<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ firm_name }} · Evidence upload</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f8fafc; color: #172033; }
    main { width: min(42rem, calc(100% - 2rem)); margin: 3rem auto; }
    .card { background: #fff; border: 1px solid #dbe2ea; border-radius: 0.75rem; padding: 1.25rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e5e7eb; }
      .card { background: #111827; border-color: #334155; }
    }
  </style>
</head>
<body>
  <main><div class="card">{{ message }}</div></main>
</body>
</html>
