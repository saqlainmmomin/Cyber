<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Overview{% endblock %} — {{ branding.firm_name }} Compliance Assessment</title>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100" hx-boost="true">
  {% block body %}
  <div class="min-h-full">
    <!-- Navigation -->
    <nav class="bg-brand dark:bg-gray-950 dark:border-b dark:border-gray-800 shadow-lg dark:shadow-none"{% if branding.has_custom_nav_color %} style="background-color: {{ branding.firm_primary_hex }}"{% endif %}>
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <div class="flex items-center">
            <a href="/" class="flex items-center gap-3">
              <div class="h-8 w-8 rounded-lg bg-white/15 dark:bg-white/10 flex items-center justify-center">
                <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                </svg>
              </div>
              <span class="text-white font-semibold text-lg">{{ branding.firm_name }}</span>
            </a>
          </div>
          <div class="flex items-center gap-4">
            <button onclick="toggleTheme()" class="p-1.5 rounded-lg hover:bg-white/10 transition-colors" aria-label="Toggle dark mode">
              <svg class="h-5 w-5 text-navy-200 dark:hidden" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
              </svg>
              <svg class="h-5 w-5 text-navy-200 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
              </svg>
            </button>
            <span class="text-navy-200 dark:text-gray-400 text-sm">Compliance Platform</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
      {% if assessment is defined %}
      <nav class="text-xs text-gray-400 dark:text-gray-500 mb-2">
        <a href="/" class="hover:text-brand dark:hover:text-navy-300 transition-colors">Assessments</a>
        <span class="mx-1.5">/</span>
        <span class="text-gray-600 dark:text-gray-300">{{ assessment.company_name }}</span>
      </nav>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% endblock %}

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
  </script>
</body>
</html>
