{% from "components/seg_rows.html" import report_seg %}
{% from "components/ui.html" import icon %}

<div class="rp-seg">{{ report_seg(assessment, "report") }}</div>
<div class="rp">

{% if preview_state == "loading" %}
<div class="rp-acts"></div>
<div id="report-content" data-report-state="loading" class="rp-loading" aria-busy="true">
  <div class="glass fw rp-skel"><span class="skel" style="width:30%"></span><div class="rp-skel-row"><span class="skel circle rp-skel-ring"></span><span class="rp-skel-lines"><span class="skel" style="width:80%"></span><span class="skel" style="width:60%"></span><span class="skel" style="width:70%"></span></span></div></div>
  <div class="glass rp-skel-card"><span class="skel" style="width:90%"></span><span class="skel" style="width:96%"></span><span class="skel" style="width:55%"></span></div>
</div>
{% elif report %}
<div id="report-content"
     hx-get="/assessments/{{ assessment.id }}/report-summary?view={{ report_view_mode }}&amp;framework={{ active_framework }}"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="glass sec" aria-busy="true">{{ icon("loader") }} Loading report</div>
</div>
{% else %}
<div id="report-content">{% include "partials/no_report.html" %}</div>
{% endif %}
</div>
