<div class="followup-panel">
  <div class="between mt-lg"><h3>Follow-up questions</h3><span class="ai">AI proposed</span></div>
  {% for fu in followups %}
  <div class="qgroup">
    <label class="label" for="followup-input-{{ fu.id }}">{{ fu.text }}</label>
    <input type="hidden" name="followup_question_{{ fu.id }}" value="{{ fu.text }}">
    <label class="field area"><textarea id="followup-input-{{ fu.id }}" name="followup_{{ fu.id }}" placeholder="Your answer">{{ fu.answer or '' }}</textarea></label>
    {% if fu.reason %}<p class="help">{{ fu.reason }}</p>{% endif %}
  </div>
  {% endfor %}
</div>
