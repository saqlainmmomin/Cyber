<div class="stack followup-panel">
  <div><h3>Follow-up questions</h3><p class="sub">Add the detail needed to assess this answer.</p></div>
  {% for fu in followups %}
  <div class="solid card">
    <p>{{ fu.text }}</p>
    {% if fu.reason %}<p class="help">{{ fu.reason }}</p>{% endif %}
    <label class="field area" style="margin-top:var(--s-3)"><textarea name="followup_{{ fu.id }}" rows="2" placeholder="Your response"></textarea></label>
  </div>
  {% endfor %}
</div>
