{% if mode == 'existing' %}
<label class="label" for="client_id">Client</label>
<label class="field"><select name="client_id" id="client_id" required><option value="">Select a client</option>{% for client in clients %}<option value="{{ client.id }}"{% if (form_values and form_values.client_id == client.id) or (not form_values and preselected_client_id == client.id) %} selected{% endif %}>{{ client.name }}</option>{% endfor %}</select></label>
{% else %}
<label class="label" for="company_name">Company name</label>
<label class="field"><input type="text" name="company_name" id="company_name" required placeholder="For example, Meridian Ledger Technologies" value="{{ form_values.company_name if form_values else '' }}"></label>
<div class="form-grid">
  <div><label class="label" for="industry">Industry</label><label class="field"><select name="industry" id="industry" required><option value="">Select industry</option><option value="it_services"{% if form_values and form_values.industry == 'it_services' %} selected{% endif %}>IT services</option><option value="fintech"{% if form_values and form_values.industry == 'fintech' %} selected{% endif %}>Fintech</option><option value="healthcare"{% if form_values and form_values.industry == 'healthcare' %} selected{% endif %}>Healthcare</option><option value="ecommerce"{% if form_values and form_values.industry == 'ecommerce' %} selected{% endif %}>E-commerce</option><option value="manufacturing"{% if form_values and form_values.industry == 'manufacturing' %} selected{% endif %}>Manufacturing</option><option value="education"{% if form_values and form_values.industry == 'education' %} selected{% endif %}>Education</option><option value="real_estate"{% if form_values and form_values.industry == 'real_estate' %} selected{% endif %}>Real estate</option><option value="legal"{% if form_values and form_values.industry == 'legal' %} selected{% endif %}>Legal</option><option value="accounting"{% if form_values and form_values.industry == 'accounting' %} selected{% endif %}>Accounting</option><option value="other"{% if form_values and form_values.industry == 'other' %} selected{% endif %}>Other</option></select></label></div>
  <div><label class="label" for="company_size">Company size</label><label class="field"><select name="company_size" id="company_size" required><option value="">Select size</option><option value="startup"{% if form_values and form_values.company_size == 'startup' %} selected{% endif %}>Startup (&lt;50 employees)</option><option value="sme"{% if form_values and form_values.company_size == 'sme' %} selected{% endif %}>SME (50–500)</option><option value="large"{% if form_values and form_values.company_size == 'large' %} selected{% endif %}>Large (500–5000)</option><option value="enterprise"{% if form_values and form_values.company_size == 'enterprise' %} selected{% endif %}>Enterprise (5000+)</option></select></label></div>
</div>
{% endif %}
