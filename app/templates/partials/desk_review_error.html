{% from "components/ui.html" import icon %}
<div class="stack">
  <div class="alert c-non" role="alert">
    {{ icon("alert") }}
    <div><b>Desk review failed</b>{% if error %}{{ error }}{% else %}The analysis service did not respond. Your documents are unchanged.{% endif %}</div>
  </div>
  <button class="btn primary lead" type="button"
          hx-post="/assessments/{{ assessment_id }}/run-desk-review"
          hx-target="#desk-review-area"
          hx-swap="innerHTML">Retry desk review</button>
</div>
