  <nav class="framework-tabs tabs" role="tablist" aria-label="Frameworks">
    {% for framework in selected_frameworks %}
    <a class="{% if framework.id == active_framework %}sel{% endif %}"
       hx-get="/assessments/{{ assessment.id }}/tab/{{ framework.id }}"
       hx-target="#framework-panel"
       hx-swap="innerHTML"
       hx-push-url="/assessments/{{ assessment.id }}?tab={{ tab }}&amp;framework={{ framework.id }}"
       role="tab"
       aria-selected="{{ 'true' if framework.id == active_framework else 'false' }}"
       onclick="this.closest('[role=tablist]').querySelectorAll('[role=tab]').forEach((tab) => { tab.classList.remove('sel'); tab.setAttribute('aria-selected', 'false'); }); this.classList.add('sel'); this.setAttribute('aria-selected', 'true');"
       href="/assessments/{{ assessment.id }}?tab={{ tab }}&amp;framework={{ framework.id }}">
      {{ framework.name }}{% if framework.version %} {{ framework.version }}{% endif %}
    </a>
    {% endfor %}
  </nav>
  <div class="mt" id="framework-panel" role="tabpanel">
    {% set framework = active_framework_definition %}
    {% set finding_count = active_framework_finding_count %}
    {% include "partials/framework_hub_panel.html" %}
  </div>
