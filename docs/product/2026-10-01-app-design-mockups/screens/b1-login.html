<script>
const root=document.documentElement,q=new URLSearchParams(location.search);
if(q.has('dark'))root.dataset.theme='dark';
const bs=[...document.querySelectorAll('#states button')],ss=[...document.querySelectorAll('.state')];
function show(s){if(!ss.some(x=>x.dataset.state===s))s=ss[0].dataset.state;ss.forEach(x=>x.hidden=x.dataset.state!==s);bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s))}
bs.forEach(b=>b.onclick=()=>{show(b.dataset.s);history.replaceState(null,'',location.pathname+(q.has('dark')?'?dark&':'?')+'state='+b.dataset.s)});
show(q.get('state')||ss[0].dataset.state);
document.addEventListener('click',e=>{const r=e.target.closest('tr[data-href]');if(r&&!e.target.closest('a,button'))location.href=r.dataset.href});
const sd=null;
if(sd){document.querySelectorAll('.menu-btn').forEach(b=>b.onclick=()=>root.classList.add('drawer-open'));
document.getElementById('scrim').onclick=()=>root.classList.remove('drawer-open');
const ub=document.getElementById('userBtn'),um=document.getElementById('userMenu');
ub.onclick=e=>{e.stopPropagation();const o=!um.classList.contains('open');um.classList.toggle('open',o);ub.setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!um.contains(e.target)){um.classList.remove('open');ub.setAttribute('aria-expanded',false)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){root.classList.remove('drawer-open');um.classList.remove('open');ub.setAttribute('aria-expanded',false)}});}

</script>
