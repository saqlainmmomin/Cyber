name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # guard tests run `git diff main...HEAD` and `git merge-base`
      - name: Provide a local main ref for guard tests
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          git rev-parse main HEAD
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install WeasyPrint system libraries (P6-8)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Renderer smoke (fails the job if WeasyPrint cannot render)
        run: python -c "from app.utils.html_pdf import render_pdf; render_pdf('<p>ok</p>')"
      - name: Run tests
        env:
          OPENROUTER_KEY: ""
          OPENROUTER_BASE_URL: "http://127.0.0.1:9/api/v1"   # any unstubbed LLM call fails fast
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "localhost,127.0.0.1,testserver"
          CYBERASSESS_REQUIRE_WEASYPRINT: "1"
        run: python -m pytest -q
      - name: Suite must not create the developer database
        run: test ! -e data/dpdpa.db
