he same ask.", "primary": true, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-SUP-03", "title": "Supplier security agreements", "domain": "SUP", "theme": "Organizational", "goal": "The organization agrees security requirements with each supplier in the contract, including the scope of access and data granted, scaled to supplier type and risk.", "owner": "Head of Procurement", "imp": "high", "origin": "iso", "note": "", "statement": "A standard set of supplier security clauses is kept, varying by supplier type or risk tier, and the agreed terms are in each contract, especially with high-risk suppliers. Each agreement states the scope of access and data granted to the supplier. Typical terms also cover confidentiality, incident notification within a stated time, audit rights, rules for sharing and reporting security information, and return or deletion of information at exit. Signed contracts prove it.", "why": "Security expectations that are not in the contract cannot be enforced when something goes wrong.", "how": "Ask for the clause set and a few contracts with high-risk suppliers. Example probe: \"Show me where this contract requires the supplier to tell you about an incident.\"", "q": "Does your organization agree security requirements in each supplier contract, scaled to the supplier's type and risk?", "evidence": "Standard supplier security clauses or schedule by risk tier; sample of contracts with high-risk suppliers. Cover the review period.", "good": "A clause set exists with variants for risk tier. High-risk contracts contain the full set of agreed terms, including incident notification within a stated time and rules for sharing and reporting security information, and state the access and data the supplier is granted, and exceptions are approved.", "test": "Sample contracts with high-risk suppliers. Pass if the clause set exists, and each sampled contract contains the security terms the clause set requires for its tier, including incident notification within a stated time and rules for sharing and reporting security information, and states the scope of access and data granted.", "risk": "A supplier could mishandle information with no contractual duty to protect it or report problems.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "CH2.SECURITY.3", "ref": "Section 8(2)", "atom": "CH2.SECURITY.3-a", "text": "Hold a valid written contract with every data processor that handles personal data for the organization.", "match": "overlap", "cov": "partial", "reason": "SUP-03 puts security terms in supplier contracts but not a signed contract for every party processing personal data.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.3", "ref": "Section 8(2)", "atom": "CH2.SECURITY.3-b", "text": "Require each processor by contract to implement appropriate security safeguards.", "match": "equal", "cov": "full", "reason": "Same ask: security requirements agreed in the contract.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.3", "ref": "Section 8(2)", "atom": "CH2.SECURITY.3-c", "text": "Require each processor by contract to process personal data only on the organization's instructions.", "match": "overlap", "cov": "partial", "reason": "SUP-03 does not require a processing-on-instructions term.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.20", "ref": "Annex A.5.20", "atom": "ISO.A5.20-a", "text": "Keep a standard set of supplier security clauses, varied by supplier type or risk.", "match": "equal", "cov": "full", "reason": "Tiered standard clauses are the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.20", "ref": "Annex A.5.20", "atom": "ISO.A5.20-b", "text": "Agree security terms in contracts with high-risk suppliers.", "match": "equal", "cov": "full", "reason": "Agreed terms in contracts are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.02", "ref": "GV.SC-02", "atom": "NIST.GV.SC.02-c", "text": "The organization defines rules for sharing and reporting security information with suppliers.", "match": "req_smaller", "cov": "full", "reason": "Supplier agreements set the security requirements, including how security information is shared and reported.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.05", "ref": "GV.SC-05", "atom": "NIST.GV.SC.05-a", "text": "The organization defines supplier cybersecurity requirements scaled to supplier criticality.", "match": "equal", "cov": "full", "reason": "Security requirements scaled to supplier type and risk is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.05", "ref": "GV.SC-05", "atom": "NIST.GV.SC.05-b", "text": "The organization builds cybersecurity clauses into standard contract templates.", "match": "req_smaller", "cov": "full", "reason": "Agreeing requirements in contract implies clauses in the templates used.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.05", "ref": "GV.SC-05", "atom": "NIST.GV.SC.05-c", "text": "Contracts with critical suppliers contain the required clauses, including incident notification within a stated time.", "match": "req_smaller", "cov": "full", "reason": "Contracts with critical suppliers carry the agreed requirements including incident notification.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.06", "ref": "GV.SC-06", "atom": "NIST.GV.SC.06-b", "text": "The organization plans the relationship scope, including the access and data the supplier will have, before it begins.", "match": "req_smaller", "cov": "full", "reason": "Scoping the access and data a supplier will have is set when requirements are agreed in the contract.", "primary": false, "rem": "", "imm": ""}], "nrec": 5, "r2": "Wording (D08, D09): each agreement states the scope of access and data granted."}, {"id": "UC-SUP-04", "title": "ICT supply chain risk", "domain": "SUP", "theme": "Organizational", "goal": "The organization requires ICT suppliers to pass security requirements to their own suppliers and disclose critical components, and assesses the chain of key suppliers.", "owner": "Head of Procurement", "imp": "high", "origin": "iso", "note": "", "statement": "ICT suppliers are required to pass security requirements on to their own suppliers and to disclose critical components or subcontractors. The supply chain of key ICT suppliers is assessed on a defined cycle, for example by reviewing sub-processor lists or component provenance. This exposes risks hidden behind the supplier the organization contracts with.", "why": "A weak link several steps down the chain can compromise the organization, even if the direct supplier looks sound.", "how": "Ask how key ICT suppliers must flow down requirements and how their own suppliers are reviewed. Example probe: \"Which sub-processors sit behind your main platform vendor, and how did you find out?\"", "q": "Does your organization manage the security risk in the supply chains behind its key ICT suppliers?", "evidence": "Supplier procedure sections on flow-down and disclosure requirements; sub-processor lists; component inventory or provenance records; supply chain assessment records for key ICT suppliers. Cover the review period.", "good": "Flow-down and disclosure duties are written into the process and contracts. Key ICT suppliers have a recent chain assessment, with sub-processor lists or provenance reviewed.", "test": "Sample key ICT suppliers. Pass if the process includes flow-down and disclosure requirements, and each sampled supplier has a supply chain assessment in the period, such as a reviewed sub-processor list or component provenance record.", "risk": "Compromised sub-suppliers or components reach the organization with nobody looking.", "applies": "Applies if the organization relies on ICT suppliers.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.21", "ref": "Annex A.5.21", "atom": "ISO.A5.21-a", "text": "Require ICT suppliers to pass security requirements to sub-suppliers and disclose critical components.", "match": "equal", "cov": "full", "reason": "Flow-down and disclosure requirements are the control's content.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.21", "ref": "Annex A.5.21", "atom": "ISO.A5.21-b", "text": "Assess the supply chain of key ICT suppliers, for example through sub-processor lists or component provenance.", "match": "equal", "cov": "full", "reason": "Assessment of the chain is the control's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SUP-05", "title": "Supplier service review", "domain": "SUP", "theme": "Organizational", "goal": "The organization reviews each supplier's services at an interval set by risk tier and whenever the scope of service changes.", "owner": "Head of Procurement", "imp": "medium", "origin": "iso", "note": "Kept as one control in round 2: one review requirement with two triggers, a set interval and a change to the scope of service.", "statement": "Supplier services are reviewed at a defined interval set by risk tier, and again whenever the scope of service changes, such as new features, sub-processors or locations. Services that matter to the security program are always in scope, so externally provided services stay controlled. Each review checks the supplier against the agreed security terms, for example through assurance reports and service and incident performance, and is recorded. Proof is the review schedule and the review records, including reviews triggered by a change.", "why": "Supplier risk changes over time, and a one-off assessment at onboarding misses later drift.", "how": "Ask for the review schedule by tier and the last reviews of high-risk suppliers, then ask how a change to a supplier's service triggers a review. Example probe: \"When your main cloud vendor added a new sub-processor, where is the review of what that meant for you?\"", "q": "Does your organization review each supplier's services at a set interval and whenever the scope of service changes?", "evidence": "Supplier review procedure stating the interval per risk tier and the change triggers; review records for high-risk suppliers; assurance reports; reviews triggered by service changes. Cover the review period.", "good": "The review interval is set per tier, and any change to the scope of service triggers an unscheduled review. High-risk suppliers were reviewed on schedule, and each scope change led to a recorded review.", "test": "Read the review procedure and check it sets the interval for each risk tier and what a review covers. Sample high-risk suppliers, other suppliers of services that matter to the program, and changes to a supplier's scope of service in the period. Pass if each sampled supplier was reviewed at its set interval, each sampled change led to a recorded review, and every review compares the supplier with the agreed terms.", "risk": "Supplier risk grows unnoticed after onboarding.", "applies": "", "type": "detective", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.22", "ref": "Annex A.5.22", "atom": "ISO.A5.22-a", "text": "Set how often each supplier risk tier is reviewed and what the review covers.", "match": "equal", "cov": "full", "reason": "Tiered review frequency is the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.22", "ref": "Annex A.5.22", "atom": "ISO.A5.22-b", "text": "Review high-risk suppliers at that frequency.", "match": "equal", "cov": "full", "reason": "Reviews in practice are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.22", "ref": "Annex A.5.22", "atom": "ISO.A5.22-c", "text": "Assess the security impact of material changes to supplier services.", "match": "equal", "cov": "full", "reason": "Change impact assessment is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C8.1", "ref": "Clause 8.1", "atom": "ISO.C8.1-d", "text": "Make sure externally provided processes, products or services that matter to the program are controlled.", "match": "req_smaller", "cov": "full", "reason": "Externally provided processes and services are controlled by reviewing suppliers against the agreed terms.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.07", "ref": "GV.SC-07", "atom": "NIST.GV.SC.07-c", "text": "The organization reassesses supplier risk throughout the relationship, not only at onboarding.", "match": "equal", "cov": "full", "reason": "Reviewing suppliers after onboarding by risk tier is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.09", "ref": "GV.SC-09", "atom": "NIST.GV.SC.09-b", "text": "The organization monitors supply chain security performance across the life cycle of products and services.", "match": "req_smaller", "cov": "full", "reason": "Reviewing suppliers by risk tier and after material change tracks performance over the relationship.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": "Kept (D11) on your reason and rewritten as one review with two triggers: a set interval and a change of scope. Also carries outside processes (D19)."}, {"id": "UC-SUP-06", "title": "Cloud service security governance", "domain": "SUP", "theme": "Organizational", "goal": "The organization governs the selection, use and management of cloud services, including shared responsibilities and provider assurance.", "owner": "Head of Procurement", "imp": "high", "origin": "iso", "note": "Split in round 2: cloud exit plans moved to UC-SUP-07.", "statement": "Rules for selecting, using and managing cloud services are documented and set out how responsibility is shared between the organization and each provider. A register of cloud services is kept, and provider assurance is obtained and reviewed in the period, including assurance on environmental protection where a provider hosts equipment or data. The policy, the register and the assurance reviews prove it.", "why": "Cloud services get adopted without clear responsibilities or any check on the provider, leaving data exposed with nobody sure who protects what.", "how": "Ask for the cloud rules and the register of cloud services in use. Then ask what assurance each important provider has given and when it was last reviewed. Example probe: \"For your main cloud provider, which security tasks are yours and which are theirs, and where is that written?\"", "q": "Does your organization govern how it selects, uses and manages cloud services, including provider assurance?", "evidence": "Cloud services policy or procedure with the shared-responsibility split; register of cloud services; provider assurance reports and certificates with review records, including hosting environmental protection; covering the review period.", "good": "A policy covers how cloud services are chosen, used and managed, and states who is responsible for what. The register is current, and each service has provider assurance evidence reviewed in the period. For hosted equipment or data, the assurance covers environmental protection.", "test": "Obtain the cloud policy or procedure and the register. Sample services from the register for the review period, weighted to the critical ones. Pass if the policy defines the shared-responsibility split, and each sampled service has provider assurance evidence reviewed in the period, including environmental protection for hosted services.", "risk": "Cloud data could be exposed because responsibilities are unclear and providers are never checked.", "applies": "Applies if the organization uses cloud services.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.23", "ref": "Annex A.5.23", "atom": "ISO.A5.23-a", "text": "Define how cloud services are selected, used, managed and exited, including shared responsibilities.", "match": "equal", "cov": "full", "reason": "The control covers the cloud life cycle and shared responsibility.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.23", "ref": "Annex A.5.23", "atom": "ISO.A5.23-b", "text": "Keep a register of cloud services with provider assurance reviewed in the period.", "match": "equal", "cov": "full", "reason": "Provider assurance is named in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.02", "ref": "PR.IR-02", "atom": "NIST.PR.IR.02-b", "text": "The organization obtains provider assurance on environmental protection for cloud or colocation hosting.", "match": "req_smaller", "cov": "full", "reason": "Provider assurance for cloud services covers environmental protection evidence for hosting.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "Split (D11): narrowed to cloud rules, register and provider assurance; the other half is now UC-SUP-07."}, {"id": "UC-SUP-07", "title": "Cloud exit plans", "domain": "SUP", "theme": "Organizational", "goal": "The organization keeps an exit plan for each critical cloud service, covering return and deletion of its data.", "owner": "Head of Procurement", "imp": "high", "origin": "iso", "note": "Split from UC-SUP-06 in round 2 so it has its own test.", "statement": "An exit plan exists for each critical cloud service. It sets out how data is returned to the organization and how the provider deletes the remaining copies. The plans are kept current so the organization can leave a provider without losing data or leaving copies behind. The exit plans prove it.", "why": "Without an exit route, a failed or unsuitable provider traps the organization's data or leaves copies with the provider after the contract ends.", "how": "Ask which cloud services are critical and ask to see the exit plan for each. Check that the plan covers getting data back and confirming deletion. Example probe: \"If your main cloud provider failed tomorrow, how would you get the data back and have the rest deleted?\"", "q": "Does your organization keep an exit plan for each critical cloud service that covers data return and deletion?", "evidence": "List of critical cloud services; exit plans for those services covering data return and deletion; provider terms or contract wording on data return and deletion; covering the current plan versions.", "good": "Every critical cloud service has an exit plan. Each plan says how data comes back, in what form, and how deletion by the provider is confirmed. The plans are dated and reflect the current services and contracts.", "test": "Obtain the list of critical cloud services and sample exit plans, covering every critical service if few. Pass if each sampled critical service has an exit plan that covers data return and deletion.", "risk": "Critical data is trapped with a provider or left behind after exit.", "applies": "Applies if the organization uses cloud services it treats as critical.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.23", "ref": "Annex A.5.23", "atom": "ISO.A5.23-c", "text": "Plan exit for critical cloud services, covering data return and deletion.", "match": "equal", "cov": "full", "reason": "Same ask: exit plans for critical cloud services.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-SUP-06 (D11). Cloud exit plans."}, {"id": "UC-SUP-40", "title": "Supplier risk management program", "domain": "SUP", "theme": "", "goal": "The organization runs a documented, formally approved supplier risk program with stated objectives that covers suppliers from selection to exit.", "owner": "Head of Procurement", "imp": "high", "origin": "nist", "note": "NIST-only. Split in round 2: responsibilities moved to UC-SUP-42.", "statement": "A documented supplier risk program states its objectives and covers supplier security from selection through contracting and monitoring to exit. The program is formally approved by the stakeholders it affects. This gives every supplier decision one agreed basis. Proof is the program document and the approval record.", "why": "Without an agreed program, supplier checks vary across the organization and decisions rest on individual habits. Consultants look for evidence that the program exists, covers the whole life cycle and was formally approved.", "how": "Ask for the supplier risk program and the record of its approval. Then check that it covers each stage from selection to exit. Example probe: \"Show me where the program says what happens when a supplier relationship ends, and who agreed it.\"", "q": "Does your organization run a documented supplier risk program that covers selection through exit and is formally approved?", "evidence": "Supplier risk management policy or program document with objectives; description of processes for supplier selection, contracting, monitoring and exit; program approval record; covering the current program version and the last annual cycle.", "good": "A program document states its objectives and covers the full supplier life cycle from selection to exit. It carries a recorded approval from the relevant stakeholders, and it is the basis used for supplier decisions.", "test": "Obtain the program document and confirm it states objectives and covers selection, contracting, monitoring and exit. Obtain the approval record for the current version. Pass if the program is documented with objectives, covers all four stages and has a formal approval record.", "risk": "Supplier security is handled inconsistently, with no agreed basis for decisions.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.SC.01", "ref": "GV.SC-01", "atom": "NIST.GV.SC.01-a", "text": "The organization documents a supply chain cybersecurity risk program with stated objectives.", "match": "equal", "cov": "full", "reason": "No base control holds a documented supplier risk program with objectives.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.01", "ref": "GV.SC-01", "atom": "NIST.GV.SC.01-b", "text": "The program defines supplier security processes across selection, contracting, monitoring and exit.", "match": "equal", "cov": "full", "reason": "Processes spanning selection, contract, monitoring and exit are the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.01", "ref": "GV.SC-01", "atom": "NIST.GV.SC.01-c", "text": "The relevant stakeholders formally agree the program.", "match": "equal", "cov": "full", "reason": "Agreement of the program by relevant stakeholders is the slot's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "Split (D11): narrowed to the documented, approved supplier risk program; the other half is now UC-SUP-42."}, {"id": "UC-SUP-41", "title": "Supplier relationship exit", "domain": "SUP", "theme": "", "goal": "The organization sets what must happen when a supplier relationship ends, including return or destruction of data and removal of access, and follows it.", "owner": "Head of Procurement", "imp": "medium", "origin": "nist", "note": "NIST-only. Cloud exit sits in UC-SUP-06.", "statement": "Supplier contracts or the supplier risk plan set out what must happen when a relationship ends, such as return or destruction of data, removal of access and transition support. When a supplier relationship ends, those steps are worked through for the service concerned and a record shows that each was done. This stops former suppliers from keeping data or access. Proof is the exit clauses and the offboarding records for suppliers that left.", "why": "Former suppliers that keep data or live accounts are a leak waiting to happen. Consultants check that exit steps are written before the relationship ends and carried out afterward.", "how": "Ask for the standard exit wording and then for a supplier that left recently. Ask to see the evidence that access was removed and data returned or destroyed. Example probe: \"Which supplier did you stop using last year, and how do you know they no longer hold your data or have a login?\"", "q": "Does your organization follow set exit steps, including data return or destruction and access removal, when a supplier relationship ends?", "evidence": "Contract templates or exit clauses; supplier exit or offboarding procedure; offboarding records for suppliers that left, showing access removal and data return or destruction confirmation; or a statement that no relationship ended; covering the last annual cycle.", "good": "Contracts or the plan require data return or destruction, access removal and transition support on exit. For each supplier that left, a record shows each step completed and confirmed, including written confirmation from the supplier on data.", "test": "Obtain the exit clauses or plan and confirm they cover data return or destruction and access removal. Identify suppliers that left in the review period and sample their offboarding records for completed steps. Pass if the exit terms exist and each sampled exit shows the steps done, or the organization shows that none ended.", "risk": "Former suppliers keep data and access after the relationship ends, creating unmanaged exposure.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.SC.10", "ref": "GV.SC-10", "atom": "NIST.GV.SC.10-a", "text": "The organization specifies in contracts or plans what must happen when a supplier relationship ends.", "match": "equal", "cov": "full", "reason": "No base control sets exit terms such as data return, deletion and access revocation for suppliers in general.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.10", "ref": "GV.SC-10", "atom": "NIST.GV.SC.10-b", "text": "The organization follows those exit provisions when a relationship ends.", "match": "equal", "cov": "full", "reason": "Following the exit provisions is the slot's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SUP-42", "title": "Supplier security accountability and responsibilities", "domain": "SUP", "theme": "", "goal": "The organization assigns accountability for supplier security and sets out and communicates what suppliers, customers and partners are each responsible for.", "owner": "Head of Procurement", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-SUP-40 in round 2 so it has its own test.", "statement": "Accountability for supplier security risk is assigned and recorded. What suppliers, customers and partners are each responsible for is written down. These responsibilities are communicated to the third parties, so everyone knows what is expected. Proof is the accountability record, a shared-responsibility matrix or contract wording, and signed agreements or onboarding packs.", "why": "When accountability is unassigned and third parties are never told what is expected, nobody answers for a supplier failure and gaps go unnoticed. Consultants look for proof the responsibilities actually reached the third parties.", "how": "Ask how accountability for supplier security is assigned and where it is recorded. Then ask how suppliers, customers and partners learn what they are responsible for. Example probe: \"Who answers if a key supplier is breached, and where is it written what that supplier must do for you?\"", "q": "Does your organization assign accountability for supplier security, with defined responsibilities for third parties?", "evidence": "Record of assigned accountability for supplier security; shared-responsibility matrix or contract clauses; sample supplier agreements or onboarding packs showing responsibilities communicated; covering the last annual cycle.", "good": "Accountability for supplier security is named in a record. Responsibilities for suppliers, customers and partners are written down. Sampled agreements or onboarding packs show the responsibilities reached the third parties.", "test": "Obtain the record of assigned accountability and the document setting out third-party responsibilities. Sample supplier agreements or onboarding packs from the last annual cycle. Pass if accountability is recorded, responsibilities are documented, and each sampled agreement or pack shows they were communicated.", "risk": "Nobody answers for supplier failures and third parties never learn what is expected of them.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.SC.02", "ref": "GV.SC-02", "atom": "NIST.GV.SC.02-a", "text": "The organization names the internal roles accountable for supplier cybersecurity risk.", "match": "equal", "cov": "full", "reason": "Assigning accountability for supplier security is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.02", "ref": "GV.SC-02", "atom": "NIST.GV.SC.02-b", "text": "The organization documents the cybersecurity responsibilities of suppliers, customers and partners and communicates them.", "match": "equal", "cov": "full", "reason": "Same ask: third-party responsibilities documented and communicated.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-SUP-40 (D11). Supply chain security responsibilities assigned and communicated."}, {"id": "UC-SUP-70", "title": "Processor contract terms for personal data", "domain": "SUP", "theme": "", "goal": "The organization binds every party that processes personal data for it, by a signed contract on file, to act only on the organization's instructions and to stop and erase that data when instructed.", "owner": "Head of Procurement", "imp": "high", "origin": "dpdpa", "note": "Remainder of UC-SUP-03. Security terms themselves stay in the base control.", "statement": "Every party that processes personal data for the organization is bound by a signed contract on file before processing starts. The contract limits the party to the organization's instructions and requires it to stop processing and erase the data when instructed. The processor register is reconciled with the contracts on file on a defined cycle. Proof is the processor register and the signed contracts.", "why": "A processor with no contract, or with a contract that lets it use data for its own ends, makes the organization answerable for misuse it cannot stop.", "how": "Ask for the processor register and a contract for each of a few processors. Look for the instruction limit and the stop-and-erase term. Example probe: \"Show me your contract with the payroll provider and the clause that limits it to your instructions.\"", "q": "Does your organization bind every party that processes personal data for it, by signed contract, to act only on its instructions?", "evidence": "Processor register; signed contracts for each processor; reconciliation records of register against contracts on file, for the audit period.", "good": "Every processor on the register has a signed contract on file. Each contract limits processing to the organization's instructions and requires the processor to stop and erase data when told. Reconciliation finds no gaps.", "test": "Reconcile the processor register against contracts on file. Sample contracts and check for the instruction limit and the stop-and-erase term. Pass if every register entry has a signed contract and each sampled contract contains both terms.", "risk": "A processor handles personal data with no binding limits, so misuse or retention cannot be prevented or enforced.", "applies": "Applies if the organization uses processors for personal data.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.SECURITY.3", "ref": "Section 8(2)", "atom": "CH2.SECURITY.3-a", "text": "Hold a valid written contract with every data processor that handles personal data for the organization.", "match": "equal", "cov": "full", "reason": "A signed contract on file for every processor completes the base control.", "primary": true, "rem": "UC-SUP-03", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.3", "ref": "Section 8(2)", "atom": "CH2.SECURITY.3-c", "text": "Require each processor by contract to process personal data only on the organization's instructions.", "match": "equal", "cov": "full", "reason": "The instructions-only term is part of the slot's contract test.", "primary": false, "rem": "UC-SUP-03", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-INC-01", "title": "Incident management plan and roles", "domain": "INC", "theme": "Organizational", "goal": "The organization documents an incident management plan covering detection through closure, with incident roles assigned to people who have contact details.", "owner": "Incident Response Lead", "imp": "critical", "origin": "iso", "note": "Split in round 2: communicating and exercising the plan moved to UC-INC-09.", "statement": "A written incident management procedure runs from detection through closure, including escalation steps, investigation and the handling of personal data breaches. Each incident role is assigned to a named person with contact details, and the plan names the third parties to coordinate with during an incident and how to reach them. The procedure and the role list prove it.", "why": "Without a documented plan and assigned people, the first hours of an incident are lost to confusion about who decides and who calls whom.", "how": "Ask how an incident would be led tomorrow and ask to see the plan and the role list. Then check that each role has a person and a way to reach them. Example probe: \"If a ransomware alert came in tonight, who would take charge, and where do I find their phone number?\"", "q": "Does your organization keep a documented incident management plan with named roles and contact details?", "evidence": "Incident management procedure or incident response plan; incident role list with named people and contact details; contact list for third parties to coordinate with; covering the current plan version.", "good": "A current procedure covers detection, reporting, triage, escalation, response, communication, investigation and closure, including personal data breaches. Each role has a named person, a reachable contact and a deputy. Third parties to coordinate with are named with contact details.", "test": "Obtain the procedure and the role list. Confirm the procedure covers every stage from detection to closure, including escalation steps and personal data breaches, that each role has a named person with contact details, and that the third parties to coordinate with are named. Pass if the procedure is complete, the roles are named with contact details and the third parties are listed.", "risk": "Incidents are handled ad hoc, response is slow and inconsistent, and nobody can be reached when it matters.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "BN.NOTIFY.3", "ref": "Section 8(4)-(6)", "atom": "BN.NOTIFY.3-a", "text": "Cover detection of personal data breaches in a documented incident response plan.", "match": "req_smaller", "cov": "full", "reason": "Defined incident management processes cover detection within the plan.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.3", "ref": "Section 8(4)-(6)", "atom": "BN.NOTIFY.3-c", "text": "Cover investigation of personal data breaches in the documented plan.", "match": "req_smaller", "cov": "full", "reason": "Investigation roles and steps sit within the defined incident process.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.24", "ref": "Annex A.5.24", "atom": "ISO.A5.24-a", "text": "Document an incident management procedure covering detection through closure.", "match": "equal", "cov": "full", "reason": "Same ask: defined incident management processes.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.24", "ref": "Annex A.5.24", "atom": "ISO.A5.24-b", "text": "Define incident roles with named people and contact details.", "match": "equal", "cov": "full", "reason": "Roles with named people are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.08", "ref": "GV.SC-08", "atom": "NIST.GV.SC.08-a", "text": "The incident response and recovery plans name the suppliers and third parties who take part and their roles.", "match": "req_bigger", "cov": "partial", "reason": "Control defines incident roles and contacts but not named supplier participation.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.04", "ref": "ID.IM-04", "atom": "NIST.ID.IM.04-a", "text": "The organization maintains a written incident response plan naming roles, escalation steps and response phases.", "match": "equal", "cov": "full", "reason": "Defined incident processes with roles and contacts are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.01", "ref": "RS.MA-01", "atom": "NIST.RS.MA.01-a", "text": "The organization maintains an incident response plan with roles, phases and contact lists.", "match": "equal", "cov": "full", "reason": "Defined incident processes, roles and contact details are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.01", "ref": "RS.MA-01", "atom": "NIST.RS.MA.01-b", "text": "The plan names the third parties to coordinate with during an incident.", "match": "req_smaller", "cov": "full", "reason": "Contact details for the people involved cover the third parties to coordinate with.", "primary": false, "rem": "", "imm": ""}], "nrec": 5, "r2": "Split (D11): narrowed to the incident procedure and roles; the other half is now UC-INC-09."}, {"id": "UC-INC-02", "title": "Event triage and classification", "domain": "INC", "theme": "Organizational", "goal": "The organization assesses security events against written criteria and decides whether each is an incident, with severity.", "owner": "Incident Response Lead", "imp": "high", "origin": "iso", "note": "", "statement": "Written criteria and severity levels decide when a security event becomes an incident. Every logged event is assessed against those criteria, and the decision and the severity are recorded. This keeps real incidents from being missed and minor events from flooding response. The classification matrix and the triage records are the proof.", "why": "If nothing defines when an event is an incident, serious events get dismissed and notification clocks start late. Consultants test whether triage decisions are recorded, not just whether a matrix exists.", "how": "Ask to see the written criteria, then pick a few logged events and ask to see the decision on each. Example probe: \"Show me an event from last quarter that you decided was not an incident, and the record of why.\"", "q": "Does your organization assess logged security events against written criteria to decide whether each is an incident and how severe it is?", "evidence": "Incident classification and severity matrix; event log export; event triage records showing the decision on each event; covering the last annual cycle.", "good": "Written criteria define incident and severity levels in terms staff can apply. Each logged event carries a recorded assessment, a decision and a severity where it was escalated, with the name of the assessor and a timestamp.", "test": "Check that the written criteria define an incident and severity levels. Sample logged events across the review period, including some closed as not an incident, and confirm each has a recorded assessment and decision. Pass if the criteria exist and every sampled event has a recorded decision consistent with them.", "risk": "Real incidents are missed or downgraded, and response effort is spent on the wrong events.", "applies": "", "type": "detective", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.25", "ref": "Annex A.5.25", "atom": "ISO.A5.25-a", "text": "Write criteria and severity levels that decide when an event is an incident.", "match": "equal", "cov": "full", "reason": "Written criteria are the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.25", "ref": "Annex A.5.25", "atom": "ISO.A5.25-b", "text": "Assess logged events and record the decision on each.", "match": "equal", "cov": "full", "reason": "Recorded decisions are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.04", "ref": "DE.AE-04", "atom": "NIST.DE.AE.04-a", "text": "The incident procedure requires estimating the impact and scope of an adverse event.", "match": "req_smaller", "cov": "full", "reason": "Assessing events and setting severity requires estimating impact and scope.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.04", "ref": "DE.AE-04", "atom": "NIST.DE.AE.04-b", "text": "The organization records impact and scope estimates and revises them as the investigation progresses.", "match": "req_smaller", "cov": "full", "reason": "Recording the assessment and revising severity as facts emerge is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.08", "ref": "DE.AE-08", "atom": "NIST.DE.AE.08-a", "text": "The organization documents criteria for when an adverse event becomes a declared incident.", "match": "equal", "cov": "full", "reason": "Written criteria for deciding whether an event is an incident are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.08", "ref": "DE.AE-08", "atom": "NIST.DE.AE.08-b", "text": "The organization records when each incident was declared and which criterion it met.", "match": "req_smaller", "cov": "full", "reason": "Recording the decision and severity against the criteria is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.08", "ref": "DE.AE-08", "atom": "NIST.DE.AE.08-c", "text": "The organization documents known false positives and considers them when applying the criteria.", "match": "req_smaller", "cov": "full", "reason": "Applying written criteria includes accounting for known false positives.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.02", "ref": "RS.MA-02", "atom": "NIST.RS.MA.02-a", "text": "The organization defines how incident reports are triaged and validated.", "match": "equal", "cov": "full", "reason": "Assessing events and deciding whether each is an incident is triage and validation.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.02", "ref": "RS.MA-02", "atom": "NIST.RS.MA.02-b", "text": "The organization defines criteria for estimating incident severity.", "match": "req_smaller", "cov": "full", "reason": "Severity criteria are part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.02", "ref": "RS.MA-02", "atom": "NIST.RS.MA.02-c", "text": "The organization records the triage outcome and timing for each incident report.", "match": "req_smaller", "cov": "full", "reason": "Recording the decision for each event is how the control is tested.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.03", "ref": "RS.MA-03", "atom": "NIST.RS.MA.03-a", "text": "The organization defines incident categories and prioritization criteria.", "match": "req_smaller", "cov": "full", "reason": "Assigning severity under written criteria covers category and priority.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.03", "ref": "RS.MA-03", "atom": "NIST.RS.MA.03-b", "text": "Each incident record carries a category and a priority.", "match": "req_smaller", "cov": "full", "reason": "Each assessed event carries severity and a decision, which a category extends.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.AN.08", "ref": "RS.AN-08", "atom": "NIST.RS.AN.08-a", "text": "The organization estimates the magnitude of each incident and validates the estimate, for example by sweeping other systems.", "match": "req_smaller", "cov": "full", "reason": "Assessing events and severity covers estimating and validating magnitude.", "primary": true, "rem": "", "imm": ""}], "nrec": 6, "r2": ""}, {"id": "UC-INC-03", "title": "Incident response and closure", "domain": "INC", "theme": "Organizational", "goal": "The organization responds to incidents under documented procedures covering containment, eradication, recovery and escalation, records the work and closes each incident.", "owner": "Incident Response Lead", "imp": "critical", "origin": "iso", "note": "Split from incident response record: response. Notification duties (INC-04) have a different test.", "statement": "Every incident is handled under documented procedures for containment, eradication, recovery and escalation. The steps taken are recorded as the work happens, and each incident is closed only after recovery is confirmed. This limits damage and leaves a trail that shows the response was controlled. The response procedures and the incident records are the proof.", "why": "A response that is not recorded cannot be repeated, reviewed or defended later. Consultants look for incidents that stayed open, or closed without evidence that recovery was confirmed.", "how": "Ask for the response procedures, then pick a recent incident and walk the record from first alert to closure. Example probe: \"For your last significant incident, show me when it was contained, when it was recovered and who signed off the closure.\"", "q": "Does your organization respond to every incident under documented procedures through to a recorded closure?", "evidence": "Incident response procedures covering containment, eradication, recovery and escalation; incident register or log; sampled incident records showing steps taken and closure; covering the last annual cycle.", "good": "Procedures set out containment, eradication, recovery and escalation steps with decision points. Every incident has a record of the steps actually taken, who took them and when, and a closure entry that confirms recovery.", "test": "Check that the procedures cover containment, eradication, recovery and escalation. Sample incidents from the review period, weighting toward the highest severity, and confirm each record shows the documented steps were followed and the incident was formally closed. Pass if the procedures are complete and every sampled record shows steps and closure.", "risk": "Incidents are contained slowly or not at all, steps are lost, and the organization cannot show what it did.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "BN.NOTIFY.3", "ref": "Section 8(4)-(6)", "atom": "BN.NOTIFY.3-b", "text": "Cover containment of personal data breaches in the documented plan.", "match": "req_smaller", "cov": "full", "reason": "Containment is a named part of documented response procedures.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.3", "ref": "Section 8(4)-(6)", "atom": "BN.NOTIFY.3-e", "text": "Cover remediation of personal data breaches in the documented plan.", "match": "req_smaller", "cov": "full", "reason": "Recovery and closure are named parts of documented response.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.4", "ref": "Section 8(6)", "atom": "BN.NOTIFY.4-a", "text": "Maintain a register of all personal data breaches.", "match": "overlap", "cov": "partial", "reason": "INC-03 records incident work but not a register of every personal data breach.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.4", "ref": "Section 8(6)", "atom": "BN.NOTIFY.4-b", "text": "Record in the register the facts and effects of each breach.", "match": "overlap", "cov": "partial", "reason": "INC-03 records the work but does not require facts and effects per breach.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.4", "ref": "Section 8(6)", "atom": "BN.NOTIFY.4-c", "text": "Record in the register the remedial actions taken for each breach.", "match": "equal", "cov": "full", "reason": "Same ask: remedial actions are recorded in the incident record.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.26", "ref": "Annex A.5.26", "atom": "ISO.A5.26-a", "text": "Respond under documented procedures covering containment, eradication, recovery and escalation.", "match": "equal", "cov": "full", "reason": "Procedure-led response is the whole of this control.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.26", "ref": "Annex A.5.26", "atom": "ISO.A5.26-b", "text": "Record the steps followed and close each incident.", "match": "equal", "cov": "full", "reason": "Recorded closure is part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.01", "ref": "RS.MA-01", "atom": "NIST.RS.MA.01-c", "text": "The organization executes the plan once an incident is declared, including coordination with third parties.", "match": "req_smaller", "cov": "full", "reason": "Responding under documented procedures once an incident is declared is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.04", "ref": "RS.MA-04", "atom": "NIST.RS.MA.04-a", "text": "The organization defines an escalation matrix by severity, including management and external parties.", "match": "equal", "cov": "full", "reason": "Documented procedures covering escalation are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.04", "ref": "RS.MA-04", "atom": "NIST.RS.MA.04-b", "text": "The organization escalates incidents as the matrix requires and tracks the status of open incidents.", "match": "req_smaller", "cov": "full", "reason": "Recording the work and closing each incident tracks escalation and status.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.AN.06", "ref": "RS.AN-06", "atom": "NIST.RS.AN.06-a", "text": "Responders record the actions they take during an investigation.", "match": "req_smaller", "cov": "full", "reason": "Recording the work done during response is in the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MI.01", "ref": "RS.MI-01", "atom": "NIST.RS.MI.01-a", "text": "The organization defines containment actions in playbooks for common incident types.", "match": "equal", "cov": "full", "reason": "Documented procedures covering containment are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MI.01", "ref": "RS.MI-01", "atom": "NIST.RS.MI.01-b", "text": "The organization configures automated containment or authorizes a third party in writing to contain on its behalf.", "match": "req_smaller", "cov": "full", "reason": "Documented response procedures cover automated and delegated containment.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MI.01", "ref": "RS.MI-01", "atom": "NIST.RS.MI.01-c", "text": "The organization carries out containment and records when it happened.", "match": "req_smaller", "cov": "full", "reason": "Recording the work includes containment actions and times.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MI.02", "ref": "RS.MI-02", "atom": "NIST.RS.MI.02-a", "text": "The organization defines eradication steps in its playbooks.", "match": "equal", "cov": "full", "reason": "Documented procedures covering eradication are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MI.02", "ref": "RS.MI-02", "atom": "NIST.RS.MI.02-b", "text": "The organization completes and verifies eradication before closing an incident.", "match": "req_smaller", "cov": "full", "reason": "Closing each incident after recorded work covers verifying eradication.", "primary": false, "rem": "", "imm": ""}], "nrec": 8, "r2": ""}, {"id": "UC-INC-04", "title": "Incident notification duties", "domain": "INC", "theme": "Organizational", "goal": "The organization decides who may notify authorities and other parties of incidents, within what timelines, and notifies in time where a legal or contractual duty applies.", "owner": "Incident Response Lead", "imp": "critical", "origin": "iso", "note": "Split from incident response record. Also carries the authorization atom of the authorities contact record.", "statement": "The people who may notify authorities and other outside parties about an incident are named, and a timeline is set for each kind of reportable event. When an incident triggers a legal or contractual duty, notification is made in time, with the date and recipient recorded. This keeps the organization out of penalties and keeps customers and regulators informed. The notification procedure and the incident notification records are the proof.", "why": "Late or unauthorized notification is often the costliest part of an incident, through fines and lost trust. Consultants check that someone is empowered to act and that the duties are known before an incident happens.", "how": "Ask who can pick up the phone to a regulator or a customer and where the deadlines are written down. Then ask for an incident that triggered a duty. Example probe: \"Which of your incidents last year had to be reported outside, and how did you show it went out on time?\"", "q": "Does your organization notify authorities and other parties of incidents within the required time where a legal or contractual duty applies?", "evidence": "Notification procedure naming who may contact authorities and the timelines for reportable events; register of legal and contractual notification duties; incident records showing notifications sent with dates and recipients; covering the last annual cycle.", "good": "The procedure names the people who may notify and the timeline for each duty, drawn from a maintained register of legal and contractual duties. Every incident record shows whether a duty applied, and where it did, the date, recipient and content of the notification.", "test": "Check that the procedure names who may notify and sets timelines for reportable events. Sample incidents from the review period that triggered a legal or contractual duty and compare notification dates against the required time. Pass if the authority is named and every sampled notification was made within the required time.", "risk": "Notification duties are missed or made by unauthorized people, exposing the organization to penalties and loss of trust.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "BN.NOTIFY.1", "ref": "Section 8(6); DPDP Rules 2025 r.7(2)", "atom": "BN.NOTIFY.1-a", "text": "Notify the Data Protection Board promptly of any personal data breach.", "match": "overlap", "cov": "partial", "reason": "INC-04 sets who notifies authorities and timelines but not the regulator-specific intimation and report.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.1", "ref": "Section 8(6); DPDP Rules 2025 r.7(2)", "atom": "BN.NOTIFY.1-b", "text": "Follow the prescribed form, content and timeline when reporting the breach to the Board.", "match": "overlap", "cov": "partial", "reason": "INC-04 does not fix the form, content and timeline of the regulator report.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.2", "ref": "Section 8(6); DPDP Rules 2025 r.7(1)", "atom": "BN.NOTIFY.2-a", "text": "Notify each affected data principal of a personal data breach.", "match": "overlap", "cov": "partial", "reason": "INC-04 covers notifying parties where a duty applies but not every affected individual.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.2", "ref": "Section 8(6); DPDP Rules 2025 r.7(1)", "atom": "BN.NOTIFY.2-b", "text": "Follow the prescribed form and content when notifying data principals.", "match": "overlap", "cov": "partial", "reason": "INC-04 sets no content for notices to individuals.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.3", "ref": "Section 8(4)-(6)", "atom": "BN.NOTIFY.3-d", "text": "Cover notification of regulators and data principals in the documented plan.", "match": "req_smaller", "cov": "full", "reason": "Notification duties and who notifies are the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.5", "ref": "Annex A.5.5", "atom": "ISO.A5.5-b", "text": "Define who may contact authorities and within what timelines for reportable events.", "match": "req_smaller", "cov": "full", "reason": "INC-04 sets who may notify authorities and the timelines, which covers this ask and the duty to notify.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.26", "ref": "Annex A.5.26", "atom": "ISO.A5.26-c", "text": "Notify internal and external parties, including legal and contractual notification, within the required time.", "match": "equal", "cov": "full", "reason": "Timely notification is the whole of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.CO.02", "ref": "RS.CO-02", "atom": "NIST.RS.CO.02-a", "text": "The incident response plan lists the internal and external parties to notify and when.", "match": "equal", "cov": "full", "reason": "Deciding who is notified and within what timelines is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.CO.02", "ref": "RS.CO-02", "atom": "NIST.RS.CO.02-b", "text": "The organization builds contractual and regulatory notification obligations into the plan.", "match": "req_smaller", "cov": "full", "reason": "Notifying where a legal or contractual duty applies requires those duties in the plan.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.CO.02", "ref": "RS.CO-02", "atom": "NIST.RS.CO.02-c", "text": "The organization notifies those parties when notification criteria are met and records who and when.", "match": "req_smaller", "cov": "full", "reason": "Notifying in time where a duty applies is the control's test.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.CO.04", "ref": "RC.CO-04", "atom": "NIST.RC.CO.04-c", "text": "The public-update procedure is linked to the breach notification procedure.", "match": "req_smaller", "cov": "full", "reason": "Deciding who notifies and when ties public updates to the breach notification duties.", "primary": false, "rem": "", "imm": ""}], "nrec": 7, "r2": ""}, {"id": "UC-INC-05", "title": "Learning from incidents", "domain": "INC", "theme": "Organizational", "goal": "The organization reviews significant incidents and tracks the resulting control improvements to completion.", "owner": "Incident Response Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "Every significant incident gets a recorded post-incident review. The review produces control improvements, which are tracked through the change or risk process until each one is complete. This makes the organization less likely to repeat the same failure. The review records and the improvement tracker are the proof.", "why": "Without a review, the same incident repeats and the cost of the first one is wasted. Consultants look for improvements that were actually completed, not only listed.", "how": "Ask which incidents counted as significant last year, then ask for the review of one and the actions that came out of it. Example probe: \"What changed in your controls after your last significant incident, and where can I see that it was finished?\"", "q": "Does your organization review significant incidents and track the resulting control improvements to completion?", "evidence": "Incident procedure section requiring a post-incident review; post-incident review reports; improvement tracker or change records linked to incidents; risk assessment updates; covering the last annual cycle.", "good": "The procedure defines significant incidents and requires a review for each. Reviews record root cause and agreed improvements with owners and dates. The improvements appear in a tracker and show as completed, with the risk assessment updated where needed.", "test": "Check that the procedure requires a post-incident review for significant incidents. Take the significant incidents in the review period and confirm each has a recorded review, then trace at least one resulting improvement through the tracker to completion. Pass if every significant incident was reviewed and the traced improvement was completed.", "risk": "The organization repeats the same incidents because root causes are never fixed.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.27", "ref": "Annex A.5.27", "atom": "ISO.A5.27-a", "text": "Require a post-incident review for significant incidents.", "match": "equal", "cov": "full", "reason": "Same ask: learn from significant incidents.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.27", "ref": "Annex A.5.27", "atom": "ISO.A5.27-b", "text": "Track resulting control improvements to completion.", "match": "equal", "cov": "full", "reason": "Tracking improvements is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.03", "ref": "ID.IM-03", "atom": "NIST.ID.IM.03-a", "text": "The organization captures lessons learned from operations and incidents through a defined review step.", "match": "req_smaller", "cov": "full", "reason": "Reviewing significant incidents is a defined lessons-learned step; the atom extends it to operations.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.04", "ref": "ID.IM-04", "atom": "NIST.ID.IM.04-d", "text": "The organization keeps the plans current and improves them based on exercises and incidents.", "match": "req_smaller", "cov": "full", "reason": "Tracking improvements from incident reviews keeps the plan current.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.AN.03", "ref": "RS.AN-03", "atom": "NIST.RS.AN.03-a", "text": "The incident procedure requires root cause analysis for incidents above a defined severity.", "match": "req_smaller", "cov": "full", "reason": "Reviewing significant incidents includes root cause analysis.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.AN.03", "ref": "RS.AN-03", "atom": "NIST.RS.AN.03-b", "text": "Post-incident reports set out the sequence of events, the root cause and, where known, the vulnerabilities and actors involved.", "match": "req_smaller", "cov": "full", "reason": "The incident review produces the sequence of events and cause.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.06", "ref": "RC.RP-06", "atom": "NIST.RC.RP.06-c", "text": "The organization completes an after-action report for each incident that reached recovery.", "match": "req_smaller", "cov": "full", "reason": "Reviewing significant incidents produces the after-action report.", "primary": false, "rem": "", "imm": ""}], "nrec": 5, "r2": ""}, {"id": "UC-INC-06", "title": "Evidence preservation", "domain": "INC", "theme": "Organizational", "goal": "The organization identifies, collects and preserves evidence of security events with chain of custody.", "owner": "Incident Response Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "A procedure sets how evidence of security events is identified, collected, acquired and preserved, including a chain of custody. When evidence is collected during an incident, an evidence-handling record is completed. This keeps the evidence usable for investigation, disciplinary action or legal proceedings. The evidence-handling procedure and the custody records are the proof.", "why": "Evidence that was altered or has no custody record may be rejected in legal or disciplinary action. Consultants check that the people handling incidents know how to preserve evidence before they are under pressure.", "how": "Ask how a laptop or a log set would be preserved from a compromised server, and ask for the record from the last time it happened. Example probe: \"When you last pulled disk images or logs during an incident, who handled them and where is that written down?\"", "q": "Does your organization preserve evidence of security events with a documented chain of custody?", "evidence": "Evidence-handling procedure covering identification, collection, acquisition and preservation; chain-of-custody or evidence-handling records for incidents where evidence was collected; covering the last annual cycle.", "good": "A procedure explains how evidence is identified, collected, acquired and preserved, with custody transfer steps and secure storage. Each collection has a record showing what was taken, by whom, when and where it is kept.", "test": "Check that the procedure covers identification, collection, acquisition, preservation and chain of custody. Select incidents in the review period where evidence was collected and confirm each has a custody or handling record. Pass if the procedure is complete and every sampled collection has a record.", "risk": "Evidence is lost or tainted, so the cause cannot be proven and legal or disciplinary action fails.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.28", "ref": "Annex A.5.28", "atom": "ISO.A5.28-a", "text": "Define how evidence of security events is identified, collected, acquired and preserved, including chain of custody.", "match": "equal", "cov": "full", "reason": "Same ask: an evidence handling procedure.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.28", "ref": "Annex A.5.28", "atom": "ISO.A5.28-b", "text": "Keep chain-of-custody or evidence-handling records where evidence was collected.", "match": "equal", "cov": "full", "reason": "Handling records are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.AN.06", "ref": "RS.AN-06", "atom": "NIST.RS.AN.06-b", "text": "The organization protects the integrity and provenance of investigation records.", "match": "req_smaller", "cov": "full", "reason": "Preserving evidence with chain of custody protects integrity and provenance.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.AN.07", "ref": "RS.AN-07", "atom": "NIST.RS.AN.07-a", "text": "The organization defines evidence collection and chain-of-custody procedures.", "match": "equal", "cov": "full", "reason": "Evidence collection with chain of custody is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.AN.07", "ref": "RS.AN-07", "atom": "NIST.RS.AN.07-b", "text": "The organization collects incident evidence with metadata and an integrity check, and restricts access to it.", "match": "equal", "cov": "full", "reason": "Collecting and preserving evidence with metadata and restricted access is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-INC-07", "title": "Contact with authorities", "domain": "INC", "theme": "Organizational", "goal": "The organization keeps a current list of relevant authorities and verifies it regularly.", "owner": "Incident Response Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "A current list is kept of the authorities the organization may need to contact, such as the data protection regulator, the national incident response team, law enforcement and the sector regulator. The list says when each is contacted. It is verified at least yearly so that contacts are right when an incident happens. The contact list and its review record are the proof.", "why": "A stale list wastes time during an incident when a regulator or law enforcement must be reached quickly. Consultants check that the list is dated and that someone owns it.", "how": "Ask to see the contact list and the date it was last checked. Example probe: \"When did someone last call or email each authority on this list to confirm the details still work?\"", "q": "Does your organization keep a current list of relevant authorities and verify it regularly?", "evidence": "Authority contact list showing which authority is contacted and when; record of the last verification or update; covering the last annual cycle.", "good": "The list names each relevant authority with a current contact point and the trigger for contacting it. It carries a review date within the last year and an owner, and changes are recorded.", "test": "Obtain the contact list and check it names the relevant authorities and when each is contacted. Confirm the review date shows it was verified or updated within the last year. Pass if the list is complete for the organization's sector and the verification is recent.", "risk": "Staff cannot reach the right authority quickly during an incident, which delays reporting and support.", "applies": "", "type": "preventive", "freq": "annual", "ks": "base: authority contact list verified at least yearly", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.5", "ref": "Annex A.5.5", "atom": "ISO.A5.5-a", "text": "Keep a current list of relevant authorities and verify it regularly.", "match": "equal", "cov": "full", "reason": "Same ask: maintain and verify contacts with authorities.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-INC-08", "title": "Reporting of security events by personnel", "domain": "INC", "theme": "People", "goal": "The organization gives personnel a published channel to report observed or suspected security events promptly and tells them what to report.", "owner": "Incident Response Lead", "imp": "high", "origin": "iso", "note": "", "statement": "A channel, such as a mailbox, portal or hotline, is published where personnel report observed or suspected security events as soon as they notice them. Personnel are told what to report and how, through awareness material and onboarding. This surfaces events that tools do not detect. The published channel, the awareness content and the reported events in the incident log are the proof.", "why": "Staff often see the first signs of an incident, such as a phishing email or a lost device, and will not report them if they do not know how. Consultants look for evidence that people actually use the channel.", "how": "Ask staff how they would report a suspicious email and see whether their answer matches the published channel. Then ask for events reported by personnel. Example probe: \"How many events did staff report last quarter, and how fast were they logged?\"", "q": "Does your organization give personnel a published channel to report security events promptly and tell them what to report?", "evidence": "Published reporting channel description in the policy or intranet; awareness material saying what to report and how; incident log entries reported by personnel with timestamps; covering the last annual cycle.", "good": "A single, well known channel is published to all personnel. Awareness content explains what to report with examples. The incident log shows events reported by personnel with short gaps between noticing and logging.", "test": "Confirm the channel is defined and published to personnel and that awareness material states what to report and how. Sample events in the incident log reported by personnel during the review period and check the timestamps show timely reporting. Pass if the channel and guidance exist and sampled events were reported and logged promptly.", "risk": "Early warning signs go unreported, so incidents are found late and cause more damage.", "applies": "", "type": "detective", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.8", "ref": "Annex A.6.8", "atom": "ISO.A6.8-a", "text": "Define and publish a channel for personnel to report security events.", "match": "equal", "cov": "full", "reason": "Same ask: a reporting mechanism.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.8", "ref": "Annex A.6.8", "atom": "ISO.A6.8-b", "text": "Show that personnel report events through the channel in a timely way.", "match": "equal", "cov": "full", "reason": "Timely reports are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.8", "ref": "Annex A.6.8", "atom": "ISO.A6.8-c", "text": "Tell personnel what to report and how.", "match": "equal", "cov": "full", "reason": "Guidance on reporting is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-INC-09", "title": "Incident plan communicated and exercised", "domain": "INC", "theme": "Organizational", "goal": "The organization communicates its incident plan and roles to those who carry them out and exercises the plan.", "owner": "Incident Response Lead", "imp": "critical", "origin": "iso", "note": "Split from UC-INC-01 in round 2 so it has its own test.", "statement": "The incident plan and roles are communicated to the people who carry them out, for example by distribution, onboarding or training. The incident plan is exercised at least yearly, for example with a tabletop, so that people know what to do when an incident happens. Communication records and exercise reports prove it.", "why": "A plan that was never shared or rehearsed fails when it is needed, because the people who must act do not know their part.", "how": "Ask how people learn their part in the plan, then ask when it was last rehearsed and what changed afterward. Example probe: \"When did you last run through the plan, who took part, and what did you change as a result?\"", "q": "Does your organization communicate its incident plan to those who carry it out and exercise it?", "evidence": "Communication record showing the plan and roles reached those who carry them out; onboarding or training records covering the plan; tabletop or other exercise report with attendance; covering the last annual cycle.", "good": "The plan and roles are shared with everyone who carries them out, and the sharing is recorded. The plan was exercised within the last year with attendance recorded.", "test": "Obtain the communication or training records and sample people with incident roles to confirm each received the plan. Select the most recent exercise and confirm it took place within the last year and that attendees match the roles. Pass if the plan reached those who carry it out and the exercise took place within the last year.", "risk": "People do not know their part, so the plan fails when an incident happens.", "applies": "", "type": "preventive", "freq": "annual", "ks": "base: incident plan exercised at least yearly", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.24", "ref": "Annex A.5.24", "atom": "ISO.A5.24-c", "text": "Communicate the procedure and roles and exercise the plan.", "match": "equal", "cov": "full", "reason": "Same ask: the plan and roles are communicated and exercised.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.08", "ref": "GV.SC-08", "atom": "NIST.GV.SC.08-b", "text": "Relevant suppliers participate in incident exercises and real incidents.", "match": "req_bigger", "cov": "partial", "reason": "The control exercises the plan but does not require suppliers to take part.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.04", "ref": "ID.IM-04", "atom": "NIST.ID.IM.04-c", "text": "The organization communicates the plans to the people who would carry them out.", "match": "req_smaller", "cov": "full", "reason": "Communicating the plans to those who carry them out is in the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": "New: split from UC-INC-01 (D11). The plan communicated and exercised; the yearly exercise setting moved here."}, {"id": "UC-INC-40", "title": "Third-party roles in incident planning and exercises", "domain": "INC", "theme": "", "goal": "The organization names the suppliers and other third parties that take part in incident planning, response and recovery, defines their roles and includes them in exercises.", "owner": "Incident Response Lead", "imp": "medium", "origin": "nist", "note": "Remainder of UC-INC-01 (third-party roles) and UC-INC-09 (third parties in exercises).", "statement": "The incident response and recovery plans name the suppliers and other third parties that take part, such as hosting providers or forensic firms, and state what each one does. The relevant suppliers are invited to incident exercises and involved in real incidents. Exercise and incident records show their participation. This makes sure outside parties act in step with the organization when an incident hits.", "why": "Many incidents run through a supplier, and a supplier that has never seen the plan loses time at the worst moment. Consultants check that named suppliers actually took part, not just that they are listed.", "how": "Ask which suppliers would be called in a serious incident and where their role is written. Then ask for exercise or incident records showing them taking part. Example probe: \"When did your hosting provider last join a rehearsal or a real incident, and where is that recorded?\"", "q": "Does your organization give the suppliers that take part in incident response defined roles in its plans and exercises?", "evidence": "Incident response and recovery plans naming suppliers and their roles; supplier contact and escalation list; exercise or tabletop records showing supplier participation; incident records showing supplier involvement; covering the last annual cycle.", "good": "The plans list each relevant supplier, its role and its contact point. At least one exercise or real incident in the period shows a supplier taking part, and lessons from it were recorded.", "test": "Read the plans and confirm relevant suppliers and their roles are named. Sample the exercises and incidents from the review period and confirm at least one shows a relevant supplier participating. Pass if suppliers and roles are named and participation is evidenced.", "risk": "Suppliers are unprepared or unreachable during an incident, which delays containment and recovery.", "applies": "Applies if suppliers or other third parties play a part in incident response or recovery.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.SC.08", "ref": "GV.SC-08", "atom": "NIST.GV.SC.08-a", "text": "The incident response and recovery plans name the suppliers and third parties who take part and their roles.", "match": "equal", "cov": "full", "reason": "The slot holds the supplier and third-party roles in incident planni
