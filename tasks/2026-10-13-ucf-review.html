 "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.05", "ref": "PR.AA-05", "atom": "NIST.PR.AA.05-c", "text": "The organization reviews access periodically and removes access that is no longer needed.", "match": "equal", "cov": "full", "reason": "Reviewing access at a set frequency and removing what is inappropriate is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-IAM-06", "title": "Access removal on leaving or role change", "domain": "IAM", "theme": "Organizational", "goal": "The organization removes or adjusts access promptly when people leave or change role, within the timeframe it has set.", "owner": "Identity and Access Lead", "imp": "critical", "origin": "iso", "note": "Split from access rights record.", "statement": "Access is removed or adjusted when people leave or change role, within the timeframe the policy sets. Each leaver or move is notified from the HR process, and the time access ended is recorded. Leaver lists and identity provider logs are the proof.", "why": "Access left open after someone leaves or moves lets former staff and old duties persist, which is a leading cause of insider incidents.", "how": "Ask what triggers removal and how fast. Compare HR dates with account end dates. Example probe: \"Take your last leaver. When did they finish, and when did their access actually stop?\"", "q": "Does your organization remove or adjust access promptly when people leave or change role, within the timeframe it has set?", "evidence": "Leaver and mover procedure with the removal timeframe; HR leaver and role change list; identity provider logs showing disablement dates; access removal tickets. Cover the audit period.", "good": "A stated timeframe applies to leavers and movers. A leaver or move notice triggers removal. Logs show access ended within the timeframe for every sampled person.", "test": "Sample leavers and role changes from the audit period. Compare HR end or move dates with identity provider logs. Pass if every sampled person lost or changed access within the timeframe in the policy.", "risk": "Former staff or people in new roles retain access they should not have.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.18", "ref": "Annex A.5.18", "atom": "ISO.A5.18-c", "text": "Remove or adjust access within the set timeframe when people leave or change role.", "match": "equal", "cov": "full", "reason": "Timely removal on leaving is the whole of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.01", "ref": "PR.AA-01", "atom": "NIST.PR.AA.01-c", "text": "Leavers' accounts are disabled within the time the procedure sets.", "match": "equal", "cov": "full", "reason": "Removing access promptly when people leave within the set time is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-IAM-07", "title": "Segregation of duties", "domain": "IAM", "theme": "Organizational", "goal": "The organization separates conflicting duties, or applies compensating measures where separation is not possible.", "owner": "Identity and Access Lead", "imp": "high", "origin": "iso", "note": "", "statement": "Duties that conflict, such as requesting and approving access, or developing and deploying to production, are identified and held by different people. System roles or approval workflows enforce the separation. Where it is not feasible, a compensating measure such as monitoring or supervisory review is documented. The conflict list and role assignments are the proof.", "why": "One person holding both sides of a sensitive task can commit or hide fraud or error alone.", "how": "Ask for the list of conflicting duties and then ask to see two examples in system roles or approvals. For small teams, ask for the compensating measure. Example probe: \"Can the person who raises a production change also approve and deploy it?\"", "q": "Does your organization separate conflicting duties, or apply compensating measures where separation is not possible?", "evidence": "List of conflicting duties and role definitions; role assignments or approval records showing different people for each side; documented compensating measures with monitoring or review records; risk assessment covering exceptions. Cover the audit period.", "good": "Conflicting pairs are identified and assigned to different people through system roles or approval workflows. Exceptions have documented compensating measures that are actually performed.", "test": "Take the list of conflicting duty pairs and sample each pair in role assignments or approval records. Pass if different individuals hold each side in every sample, or a documented compensating measure was performed.", "risk": "A single person can perform and conceal a harmful action without a second check.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.3", "ref": "Annex A.5.3", "atom": "ISO.A5.3-a", "text": "Identify duties that conflict and require them to be separated.", "match": "equal", "cov": "full", "reason": "Same ask: find conflicting duties and separate them.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.3", "ref": "Annex A.5.3", "atom": "ISO.A5.3-b", "text": "Show through system roles or approvals that different people perform each side of a conflicting pair.", "match": "equal", "cov": "full", "reason": "Sampling of duty pairs is the test of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.3", "ref": "Annex A.5.3", "atom": "ISO.A5.3-c", "text": "Document compensating measures where separation is not feasible.", "match": "equal", "cov": "full", "reason": "The control allows compensating measures when separation is impractical.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.05", "ref": "PR.AA-05", "atom": "NIST.PR.AA.05-e", "text": "The organization separates conflicting duties.", "match": "equal", "cov": "full", "reason": "Separating conflicting duties is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-IAM-08", "title": "Privileged access", "domain": "IAM", "theme": "Technological", "goal": "The organization authorizes, limits, records and regularly reviews privileged access rights, held in accounts separate from everyday use.", "owner": "Identity and Access Lead", "imp": "critical", "origin": "iso", "note": "", "statement": "Privileged access is authorized separately from standard access, limited to people who need it and held in accounts separate from everyday use. A current list of privileged accounts is kept with a recorded authorization for each, and privileged access is reviewed on a defined cycle, removing unneeded rights. The account list and review records are the proof.", "why": "Privileged accounts give the keys to systems, so one stolen or misused account can cause a total compromise.", "how": "Ask for the list of privileged accounts and how it is built. Ask if admins use separate accounts for email. Example probe: \"Show me the domain administrators, who approved each, and when the group was last reviewed.\"", "q": "Does your organization authorize, limit, record and regularly review privileged access rights, held in accounts separate from everyday use?", "evidence": "Privileged access policy; current privileged account list with authorization records; evidence of separate admin accounts; privileged access review records. Cover the last two review cycles.", "good": "A current list names every privileged account holder with a recorded authorization. Admin rights sit in separate accounts. Reviews remove unneeded rights and occur more often than standard reviews where the policy says so.", "test": "Compare the privileged account list with the groups and roles in the systems, then sample holders and find the authorization for each. Check that a privileged review took place in the audit period. Pass if the list matches the systems, all sampled holders are authorized and the review is complete.", "risk": "Excess administrator rights let one compromised or careless account take over systems and data.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.2", "ref": "Annex A.8.2", "atom": "ISO.A8.2-a", "text": "Authorize privileged access separately, limit it to those who need it and hold it in separate accounts.", "match": "equal", "cov": "full", "reason": "Same ask: restricted privileged access.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.2", "ref": "Annex A.8.2", "atom": "ISO.A8.2-b", "text": "Keep a current list of privileged accounts, each with a recorded authorization.", "match": "equal", "cov": "full", "reason": "The list and authorizations are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.2", "ref": "Annex A.8.2", "atom": "ISO.A8.2-c", "text": "Review privileged access and remove unneeded rights.", "match": "equal", "cov": "full", "reason": "Regular review is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-IAM-09", "title": "Information access restriction", "domain": "IAM", "theme": "Technological", "goal": "The organization restricts access to information and functions in each system to what each role is authorized to use.", "owner": "Identity and Access Lead", "imp": "high", "origin": "iso", "note": "Kept apart from the access rules (IAM-01) because the test is system configuration, not policy.", "statement": "Access controls are configured in each system by role or group so users reach only the information and functions their role allows, in line with the access rules. Sampled users are tested to confirm they cannot go beyond their role. Role matrices and test results are the proof.", "why": "A good policy does not matter if systems let users see or do more than their role requires. This control checks the system itself.", "how": "Ask for the role matrix for a key system and then test it. Example probe: \"Log in as a standard user and try to open the payroll function. What happens?\"", "q": "Does your organization restrict access to information and functions in each system to what each role is authorized to use?", "evidence": "System role or group matrices for in-scope applications; access listings for sampled users; access test results; access control policy. Cover the audit period.", "good": "Each in-scope system has roles that map to job needs. Testing shows users cannot reach information or functions outside their role.", "test": "Sample in-scope systems and users and try to reach information and functions outside each user's role. Pass if every attempt is denied and role settings match the matrix.", "risk": "Users see or change information and functions they have no business need for.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "CH2.SECURITY.2", "ref": "Section 8(5); DPDP Rules 2025 r.6(1)(a)-(b)", "atom": "CH2.SECURITY.2-c", "text": "Restrict access to personal data to authorized personnel on a least-privilege basis.", "match": "equal", "cov": "full", "reason": "Same ask: access limited to authorized roles on a need basis.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.3", "ref": "Annex A.8.3", "atom": "ISO.A8.3-a", "text": "Configure access controls in each system by role or group in line with the access rules.", "match": "equal", "cov": "full", "reason": "Same ask: system access restricted by role.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.3", "ref": "Annex A.8.3", "atom": "ISO.A8.3-b", "text": "Test that sampled users cannot reach information or functions outside their role.", "match": "equal", "cov": "full", "reason": "Role-limit testing is the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.05", "ref": "PR.AA-05", "atom": "NIST.PR.AA.05-d", "text": "The organization grants access on the least privilege principle.", "match": "req_smaller", "cov": "full", "reason": "Restricting each role to what it is authorized to use is least privilege.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-IAM-10", "title": "Access to source code and build tools", "domain": "IAM", "theme": "Technological", "goal": "The organization limits read and write access to source code, development tools and libraries to those authorized and requires review before changes merge.", "owner": "Head of Application Development", "imp": "medium", "origin": "iso", "note": "", "statement": "Who may read and write source code repositories, build tools and software libraries is defined, and write access is limited to authorized developers. Protected branches require review before changes merge. Repository permission exports are the proof.", "why": "Anyone who can change code or build tools can slip in a flaw or backdoor that reaches production.", "how": "Ask for repository permissions and branch protection settings on the main repositories. Example probe: \"Can a developer push straight to the production branch without a review?\"", "q": "Does your organization limit access to source code and build tools to authorized people, with review before changes merge?", "evidence": "Secure development policy rules on code access; repository permission export; branch protection settings; build tool access list. Cover the audit period.", "good": "Rules name who may read and write each repository and tool. Permissions limit write access to authorized developers. Protected branches require review before merge.", "test": "Sample repositories, including the most critical, and review permission exports and branch protection settings. Pass if write access is limited to authorized developers and review is required before merge in every sampled repository.", "risk": "Unauthorized or unreviewed changes enter code and build tools and reach production.", "applies": "Applies if the organization develops or customizes software in house.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.4", "ref": "Annex A.8.4", "atom": "ISO.A8.4-a", "text": "Define who may read and write source code repositories, build tools and libraries.", "match": "equal", "cov": "full", "reason": "Same ask: managed access to code and tools.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.4", "ref": "Annex A.8.4", "atom": "ISO.A8.4-b", "text": "Limit write access to authorized developers and require review before merge.", "match": "equal", "cov": "full", "reason": "Enforced limits and review gates are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.06", "ref": "PR.PS-06", "atom": "NIST.PR.PS.06-c", "text": "The organization restricts access to source repositories and build pipelines and protects them against tampering.", "match": "equal", "cov": "full", "reason": "Limiting access to source code and build tools is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-IAM-11", "title": "Secure authentication", "domain": "IAM", "theme": "Technological", "goal": "The organization enforces authentication strength by system sensitivity, including multi-factor where needed, and protects log-on against guessing.", "owner": "Identity and Access Lead", "imp": "critical", "origin": "iso", "note": "", "statement": "Authentication strength is set by system sensitivity, requiring multi-factor authentication for remote, privileged and sensitive-data access, and is enforced in the identity provider or systems. Log-on protections such as lockout or throttling after failed attempts are configured. Policy settings and configuration exports are the proof.", "why": "Stolen or guessed passwords are the most common way in. Multi-factor authentication and lockout stop most of these attacks.", "how": "Ask which systems require multi-factor authentication and who is exempt. Ask for the identity provider policy export. Example probe: \"Show me an administrator who logs in without multi-factor authentication, if one exists, and why.\"", "q": "Does your organization enforce authentication strength by system sensitivity, including multi-factor where needed, and protect log-on against guessing?", "evidence": "Authentication standard by system sensitivity; identity provider configuration export showing multi-factor and lockout settings; list of exceptions with approvals; configuration baselines. Cover the audit period.", "good": "The standard sets required methods by sensitivity. The identity provider enforces multi-factor for remote, privileged and sensitive access. Lockout or throttling is on. Exceptions are approved and rare.", "test": "Review the identity provider export and sample remote, privileged and sensitive-system accounts. Pass if every sampled account is covered by the required methods, lockout or throttling is configured and every exception is approved.", "risk": "Accounts are broken into with stolen or guessed passwords.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.5", "ref": "Annex A.8.5", "atom": "ISO.A8.5-a", "text": "Set authentication strength by system sensitivity, including multi-factor where needed.", "match": "equal", "cov": "full", "reason": "Same ask: authentication matched to sensitivity.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.5", "ref": "Annex A.8.5", "atom": "ISO.A8.5-b", "text": "Enforce the required methods in the identity provider or systems.", "match": "equal", "cov": "full", "reason": "Enforcement is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.5", "ref": "Annex A.8.5", "atom": "ISO.A8.5-c", "text": "Configure log-on protections such as lockout after failed attempts.", "match": "equal", "cov": "full", "reason": "Log-on protection is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.03", "ref": "PR.AA-03", "atom": "NIST.PR.AA.03-a", "text": "The organization defines how users, services and devices are authenticated.", "match": "req_smaller", "cov": "full", "reason": "Enforcing authentication strength by system sensitivity requires a defined authentication standard.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.03", "ref": "PR.AA-03", "atom": "NIST.PR.AA.03-b", "text": "The organization enforces multi-factor authentication for remote and privileged access, with exceptions recorded.", "match": "equal", "cov": "full", "reason": "Multi-factor authentication where needed is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.03", "ref": "PR.AA-03", "atom": "NIST.PR.AA.03-c", "text": "The organization sets and technically enforces minimum strength rules for passwords and other authenticators.", "match": "req_smaller", "cov": "full", "reason": "Enforcing authentication strength includes minimum rules for secrets.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-IAM-12", "title": "Privileged utility programs", "domain": "IAM", "theme": "Technological", "goal": "The organization restricts utility programs that can override system or application controls to authorized people and logs their use.", "owner": "Security Engineering Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "Utility programs that can override system or application controls are identified, and their use is limited to named, authorized people. Every use of those utilities is logged and authorizations are kept. The utility list, access settings and logs are the proof.", "why": "Utilities such as disk editors or admin consoles can bypass normal controls, so uncontrolled use leaves no trace of misuse.", "how": "Ask which tools are able to bypass controls and who may run them. Ask for logs of their use. Example probe: \"Who ran the database admin utility last month, and who approved it?\"", "q": "Does your organization restrict utility programs that can override system or application controls to authorized people and log their use?", "evidence": "List of override-capable utility programs; access settings or allow lists; authorization records; utility usage logs. Cover the audit period.", "good": "The utilities are identified and restricted to named people. Use is logged and tied to an authorization.", "test": "Take the utility list and check access settings limit each to named people. Sample logged uses from the audit period and find the authorization for each. Pass if only named people can use the utilities and all sampled uses are logged with an authorization.", "risk": "Staff or attackers bypass system controls with tools that leave no record.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.18", "ref": "Annex A.8.18", "atom": "ISO.A8.18-a", "text": "Identify utility programs that can override controls and limit their use to authorized people.", "match": "equal", "cov": "full", "reason": "Same ask: restrict override-capable utilities.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.18", "ref": "Annex A.8.18", "atom": "ISO.A8.18-b", "text": "Log use of those utilities.", "match": "equal", "cov": "full", "reason": "Logging of use is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-IAM-13", "title": "Default credentials changed on installation", "domain": "IAM", "theme": "Organizational", "goal": "The organization changes default vendor credentials when systems and devices are installed.", "owner": "Identity and Access Lead", "imp": "high", "origin": "iso", "note": "Split from UC-IAM-03 in round 2 so it has its own test.", "statement": "Default vendor credentials are changed when systems and devices are installed, before they go into use. Build checklists or configuration baselines require this step and show that it was done. This closes a well-known way into new systems. The build checklists and configuration baselines are the proof.", "why": "Default passwords on new systems and devices are among the first things attackers try, and they are published by vendors.", "how": "Ask how a new system or device is set up and when its default credentials are changed. Ask for a recent build checklist. Example probe: \"When you last installed a new device, when did its factory password get changed?\"", "q": "Does your organization change default vendor credentials when it installs systems and devices?", "evidence": "Build checklists; configuration baselines showing default credentials changed; installation records for new systems and devices; covering the audit period.", "good": "Build checklists or baselines require default credentials to be changed at installation. Records for new systems and devices show the change was made before use.", "test": "Sample new builds and newly installed devices from the review period. For each, check the build checklist or configuration baseline shows default vendor credentials were changed. Pass if every sampled build or device shows defaults changed.", "risk": "New systems and devices go live with publicly known default passwords that attackers try first.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.17", "ref": "Annex A.5.17", "atom": "ISO.A5.17-c", "text": "Change default vendor credentials on installation.", "match": "equal", "cov": "full", "reason": "Same ask: default vendor credentials changed on installation.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-IAM-03 (D11). Default credentials changed on installation."}, {"id": "UC-IAM-40", "title": "Non-human credential inventory", "domain": "IAM", "theme": "", "goal": "The organization keeps an inventory of service accounts, API keys, certificates and similar non-human credentials, each with a named owner.", "owner": "Identity and Access Lead", "imp": "high", "origin": "nist", "note": "Remainder of UC-IAM-02.", "statement": "An inventory of non-human credentials, such as service accounts, API keys, certificates and cryptographic keys, is kept with a named owner for each. The inventory is updated when a credential is created, changed or retired, and checked against live systems on a defined cycle. Proof is the inventory and the check records.", "why": "Credentials with no owner are never rotated or removed, so they become a quiet way into systems.", "how": "Ask for the inventory and pick credentials from a live system to find in it. Example probe: \"Pick an API key in production. Who owns it, when was it created and where is it recorded?\"", "q": "Does your organization keep an inventory of service accounts, API keys, certificates and similar credentials, each with a named owner?", "evidence": "Non-human credential inventory with owners; export of service accounts and keys from sampled systems; reconciliation records; covering the audit period", "good": "The inventory lists service accounts, API keys, certificates and keys. Each has a current named owner. A check against live systems finds no unlisted credentials, or each gap is actioned.", "test": "Obtain the inventory and exports from sampled systems. Sample ten non-human credentials from the live exports and check each appears in the inventory with a named owner. Pass if all sampled credentials are listed and owned.", "risk": "Orphaned service accounts and keys stay valid indefinitely and are used for unnoticed access.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.AA.01", "ref": "PR.AA-01", "atom": "NIST.PR.AA.01-d", "text": "The organization inventories non-human credentials such as service accounts, API keys, certificates and keys, each with an owner.", "match": "equal", "cov": "full", "reason": "The slot holds an inventory of non-human credentials, each with an owner.", "primary": false, "rem": "UC-IAM-02", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-IAM-41", "title": "Identity verification before credential issue", "domain": "IAM", "theme": "", "goal": "The organization verifies a person's identity, with stronger proof for higher-risk access, before issuing credentials.", "owner": "Identity and Access Lead", "imp": "high", "origin": "nist", "note": "Remainder of UC-IAM-03.", "statement": "A person's identity is verified before credentials are issued, with stronger proof for higher-risk access. Each person holds their own credential, with shared accounts allowed only by recorded exception. The verification evidence, such as an HR record or an identity check, is kept. Proof is the procedure and the evidence for new accounts.", "why": "Credentials issued to someone whose identity was never checked let impostors in with legitimate-looking accounts.", "how": "Ask how a new starter proves who they are, and whether it differs for privileged access. Ask for evidence for a recent account. Example probe: \"For the last administrator account created, what identity check was done and where is the record?\"", "q": "Does your organization verify a person's identity, with stronger proof for higher-risk access, before issuing credentials?", "evidence": "Identity verification procedure; HR onboarding identity checks; account creation records; shared account exceptions; covering the audit period", "good": "The procedure requires identity checks before issue and sets stronger checks for higher-risk access. Each person has an individual credential. Shared accounts exist only by recorded exception. Evidence of verification exists for new accounts.", "test": "Obtain the procedure and the list of accounts created in the period. Sample five accounts, including at least one higher-risk account, and check each has identity verification evidence matching the procedure. Pass if all sampled accounts have evidence.", "risk": "Fraudulent or mistaken identities obtain credentials, giving attackers direct access.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.AA.02", "ref": "PR.AA-02", "atom": "NIST.PR.AA.02-a", "text": "The organization verifies a person's identity before issuing credentials, with stronger proofing for higher-risk access.", "match": "equal", "cov": "full", "reason": "The slot holds identity verification before credentials are issued, scaled to risk.", "primary": false, "rem": "UC-IAM-03", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-IAM-42", "title": "Federation assertion security", "domain": "IAM", "theme": "", "goal": "The organization requires identity assertions used for single sign-on to be signed, validated by the receiving system, short-lived, and protected by rotated signing keys.", "owner": "Identity and Access Lead", "imp": "medium", "origin": "nist", "note": "NIST-only.", "statement": "Applications that use single sign-on or federation accept only signed identity assertions and validate the signature. Assertion and token lifetimes are limited, and signing keys are rotated on a defined schedule. Proof is the identity provider and application configuration exports and the key rotation records.", "why": "Unsigned or long-lived assertions let an attacker forge or replay a login and walk into connected applications.", "how": "Ask which applications use single sign-on and how each checks the assertion. Look at configuration. Example probe: \"For this application, show me the setting that makes it reject an unsigned assertion and the lifetime of a token.\"", "q": "Does your organization require single sign-on assertions to be signed, validated, short-lived and protected by rotated signing keys?", "evidence": "Single sign-on application list; identity provider and application configuration exports showing signing, validation and lifetimes; signing key rotation records; covering the audit period", "good": "Connected applications accept only signed assertions and verify them. Assertion and token lifetimes are limited. Signing keys rotate on a defined schedule.", "test": "Obtain the application list and configuration exports. Sample five single sign-on applications and check each has signing and signature validation enabled and a limited lifetime. Check signing key rotation is recorded. Pass if all sampled applications comply and rotation is on schedule.", "risk": "Forged or stolen assertions give attackers access to every connected application.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.AA.04", "ref": "PR.AA-04", "atom": "NIST.PR.AA.04-a", "text": "Applications using single sign-on or federation accept only signed identity assertions and validate the signature.", "match": "equal", "cov": "full", "reason": "No base control requires signed, verified identity assertions in single sign-on.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.04", "ref": "PR.AA-04", "atom": "NIST.PR.AA.04-b", "text": "The organization limits assertion and token lifetimes and rotates signing keys on a schedule.", "match": "equal", "cov": "full", "reason": "Limited assertion lifetimes and signing-key rotation are in the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-CRY-01", "title": "Use of encryption", "domain": "CRY", "theme": "Technological", "goal": "The organization defines where encryption is required and which methods are approved, and applies it to data at rest and in transit accordingly.", "owner": "Security Engineering Lead", "imp": "critical", "origin": "iso", "note": "Split from cryptography record: encryption use. Key management (CRY-02) has a different test.", "statement": "Where encryption is required, by classification and for data at rest and in transit, and which methods are approved are defined. Encryption is configured on data stores, endpoints and transport as the rules require. The cryptography policy and configuration exports are the proof.", "why": "Unencrypted data on disks, backups and networks is readable by anyone who gets hold of it.", "how": "Ask for the cryptography policy and then pick a database, a laptop and a public website to check. Example probe: \"Is the production database encrypted at rest, and which version of transport protection does the web app accept?\"", "q": "Does your organization apply encryption to data at rest and in transit where its rules require it, using approved methods?", "evidence": "Cryptography policy with required use and approved methods; configuration exports for sampled data stores, endpoints and transport settings; list of exceptions. Cover the audit period.", "good": "The policy sets where encryption applies by classification and lists approved methods. Sampled data stores, endpoints and connections show encryption enabled to that standard.", "test": "Read the policy for required use and approved methods. Sample data stores, endpoints and transport settings and check encryption is enabled with approved methods. Pass if the policy is approved and all sampled items match it.", "risk": "Data is readable if disks are lost, backups leak or traffic is intercepted.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "CH2.SECURITY.2", "ref": "Section 8(5); DPDP Rules 2025 r.6(1)(a)-(b)", "atom": "CH2.SECURITY.2-a", "text": "Encrypt personal data at rest.", "match": "equal", "cov": "full", "reason": "Same ask: encryption of data at rest where required.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.2", "ref": "Section 8(5); DPDP Rules 2025 r.6(1)(a)-(b)", "atom": "CH2.SECURITY.2-b", "text": "Encrypt personal data in transit.", "match": "equal", "cov": "full", "reason": "Same ask: encryption of data in transit.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.24", "ref": "Annex A.8.24", "atom": "ISO.A8.24-a", "text": "Define where encryption is required and which algorithms and key lengths are approved.", "match": "equal", "cov": "full", "reason": "Encryption rules are the whole of this control.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.24", "ref": "Annex A.8.24", "atom": "ISO.A8.24-b", "text": "Configure encryption on data stores, endpoints and transport as the rules require.", "match": "equal", "cov": "full", "reason": "Applied encryption is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.01", "ref": "PR.DS-01", "atom": "NIST.PR.DS.01-a", "text": "The organization sets protection requirements for stored data according to its classification.", "match": "req_smaller", "cov": "full", "reason": "Defining where encryption is required by data sensitivity sets protection requirements for stored data.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.01", "ref": "PR.DS-01", "atom": "NIST.PR.DS.01-b", "text": "The organization encrypts sensitive data at rest, including backups, and endpoint disks.", "match": "equal", "cov": "full", "reason": "Encryption at rest, including backups and endpoint disks, is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.02", "ref": "PR.DS-02", "atom": "NIST.PR.DS.02-a", "text": "The organization requires protection of data in transit, such as current TLS with valid certificates.", "match": "equal", "cov": "full", "reason": "Encryption in transit by defined requirements is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.10", "ref": "PR.DS-10", "atom": "NIST.PR.DS.10-a", "text": "The data protection standard sets explicit requirements for data in use.", "match": "req_bigger", "cov": "partial", "reason": "Control covers data at rest and in transit only.", "primary": true, "rem": "", "imm": ""}], "nrec": 5, "r2": ""}, {"id": "UC-CRY-02", "title": "Cryptographic key management", "domain": "CRY", "theme": "Technological", "goal": "The organization manages cryptographic keys across their life, from generation to destruction, holds them in a controlled store and rotates them as set.", "owner": "Security Engineering Lead", "imp": "critical", "origin": "iso", "note": "Split from cryptography record.", "statement": "Rules for managing cryptographic keys through their whole life are set, covering generation, storage, distribution, rotation, revocation and destruction, and who may access them. Keys are held in a controlled store such as a key management service and rotated as the rules require. The key rules and key store records are the proof.", "why": "Strong encryption fails if keys are kept beside the data, shared widely or never changed.", "how": "Ask where keys are kept and who can reach them. Ask for the rotation record. Example probe: \"Show me the key that protects the customer database and the last time it was rotated.\"", "q": "Does your organization manage cryptographic keys across their life, holding them in a controlled store and rotating them as set?", "evidence": "Key management rules; key store configuration export and access list; key rotation records; records of revoked or destroyed keys. Cover the audit period.", "good": "Rules cover each life stage and access to keys. Keys sit in a controlled store with limited access. Rotation happens as the rules require and is recorded.", "test": "Sample keys from the key store and check each is held there with limited access. Compare rotation dates with the rotation rule. Pass if all sampled keys are in the controlled store and rotated on schedule.", "risk": "Compromised, shared or stale keys let attackers decrypt protected data.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.24", "ref": "Annex A.8.24", "atom": "ISO.A8.24-c", "text": "Define key management rules covering generation, storage, distribution, rotation, revocation and destruction.", "match": "equal", "cov": "full", "reason": "Key life cycle rules are the whole of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.24", "ref": "Annex A.8.24", "atom": "ISO.A8.24-d", "text": "Hold keys in a controlled store and rotate them as the rules require.", "match": "equal", "cov": "full", "reason": "Controlled storage and rotation are in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-CRY-40", "title": "Data in use requirements", "domain": "CRY", "theme": "", "goal": "The organization sets explicit requirements for protecting data while it is being processed in its data protection standard.", "owner": "Security Engineering Lead", "imp": "high", "origin": "nist", "note": "Remainder of UC-CRY-01. Split in round 2: secrets moved to UC-CRY-41, tenant isolation to UC-CRY-42.", "statement": "The data protection standard sets explicit requirements for data in use, not only for data in storage and in transit. It states how data is protected while an application or user is working with it. These requirements complete the rules for encryption of stored and transmitted data. Proof is the approved standard.", "why": "Data is most exposed while in use, and a standard that stops at storage and transmission leaves that stage with no stated requirement.", "how": "Ask whether the data protection standard has its own section on data being processed. Look for requirements, not only a mention. Example probe: \"Where does your standard say how data must be protected while an application is processing it?\"", "q": "Does your organization set explicit requirements for data in use in its data protection standard?", "evidence": "Data protection standard section on data in use; approval record of the standard; covering the audit period.", "good": "The standard has a distinct, approved section on data in use with requirements that can be checked. It is current and applies to the systems that process sensitive data.", "test": "Obtain the current data protection standard. Check it contains a section with explicit requirements for data in use, separate from the rules for stored and transmitted data. Check the standard is approved and current. Pass if both hold.", "risk": "Data in use has no stated protection requirement, so controls for that stage are left to chance.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.DS.10", "ref": "PR.DS-10", "atom": "NIST.PR.DS.10-a", "text": "The data protection standard sets explicit requirements for data in use.", "match": "equal", "cov": "full", "reason": "The slot holds explicit protection requirements for data in use.", "primary": false, "rem": "UC-CRY-01", "imm": ""}], "nrec": 1, "r2": "Split (D11): narrowed to the data in use standard; the other half is now UC-CRY-41 and UC-CRY-42."}, {"id": "UC-CRY-41", "title": "Secrets kept out of code and logs", "domain": "CRY", "theme": "", "goal": "The organization keeps secrets and sensitive values out of source code and logs and exposes them only where needed.", "owner": "Security Engineering Lead", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-CRY-40 in round 2 so it has its own test.", "statement": "Secrets and sensitive values are kept out of source code and logs. They are held in a controlled store, such as a secrets manager, and exposed only where and when needed. Code and logs are scanned to confirm none appear. Proof is the secrets store settings and scan results.", "why": "Secrets left in code or logs are easy to find and reuse, and they defeat the encryption of the data they protect.", "how": "Ask where application secrets live and how the client knows none are in code or logs. Ask for scan results. Example probe: \"Where do application secrets live, and how do you know none appear in logs or source code?\"", "q": "Does your organization keep secrets out of source code and logs?", "evidence": "Secrets manager configuration; code and log scan results; coding standard rule on secrets; covering the audit period.", "good": "Secrets are held in a secrets store and reach applications only when needed. Scans of code and logs find no exposed secrets, and any finding is removed and the secret replaced.", "test": "Obtain the secrets store settings and recent scan results. Sample three applications and scan their code and logs from the period for secrets and sensitive values. Check each application reads its secrets from the store. Pass if no secret is found in sampled code or logs and each sampled application uses the store.", "risk": "Secrets leak through code and logs and give attackers direct access to systems and data.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.DS.10", "ref": "PR.DS-10", "atom": "NIST.PR.DS.10-b", "text": "The organization keeps secrets and sensitive values out of logs and code and exposes them only as needed.", "match": "equal", "cov": "full", "reason": "Same ask: secrets kept out of code and logs.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-CRY-40 (D11). Secrets kept out of code and logs."}, {"id": "UC-CRY-42", "title": "Tenant data isolation", "domain": "CRY", "theme": "", "goal": "The organization isolates each tenant's or user's data on shared platforms from other tenants and users.", "owner": "Security Engineering Lead", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-CRY-40 in round 2 so it has its own test.", "statement": "Platforms shared by several customers, tenants or users isolate each one's data from the others. The isolation is built into the platform design and checked by testing. Proof is the isolation design and the latest isolation test results.", "why": "On shared platforms, weak isolation lets one customer see or change another's data, which is a breach that encryption of stored data does not stop.", "how": "Ask how the platform separates customers and how that separation is tested. Ask for the latest test report. Example probe: \"How do you prove a user in one tenant cannot reach another tenant's data?\"", "q": "Does your organization isolate each tenant's or user's data from others on shared platforms?", "evidence": "Tenant isolation design description; isolation test reports; container or environment isolation settings; covering the audit period.", "good": "The design separates each tenant's data and processing from others. An isolation test, run on the current platform, shows no cross-tenant access, and failures were fixed and retested.", "test": "Obtain the isolation design and the latest isolation test report for the period. Check the design separates each tenant's data and the test attempted cross-tenant access on the current platform. Sample two isolation settings and check they match the design. Pass if the test showed no cross-tenant access, or any failure was fixed and retested, and the settings match.", "risk": "One customer's data becomes visible to another, causing a reportable breach.", "applies": "Applies to platforms shared by several customers or tenants.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.DS.10", "ref": "PR.DS-10", "atom": "NIST.PR.DS.10-c", "text": "Shared or multi-tenant platforms isolate each user's or tenant's data from others.", "match": "equal", "cov": "full", "reason": "Same ask: tenant data isolated on shared platforms.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-CRY-40 (D11). Tenant data isolation."}, {"id": "UC-NET-01", "title": "Endpoint device protection", "domain": "NET", "theme": "Technological", "goal": "The organization sets security requirements for user endpoint devices and verifies that devices meet them.", "owner": "Head of IT Operations", "imp": "high", "origin": "iso", "note": "", "statement": "Security requirements for user endpoint devices, such as registration, encryption, screen lock, patching, anti-malware and remote wipe, are set and extended to personally owned devices where those are allowed. Device management tools check devices against the requirements continuously, and non-compliant devices are fixed or cut off from company data. This keeps lost, stolen or poorly maintained devices from exposing company data. Proof is the endpoint policy and the device compliance report.", "why": "A policy that nobody checks leaves unencrypted, unpatched or unmanaged laptops and phones holding company data. Consultants need to see that devices are measured against the rules, not just that rules exist.", "how": "Ask what the device rules are, whether personal devices are allowed, and how the organization knows a given device meets the rules today. Ask to see a live compliance view, not a screenshot of the policy. Example probe: \"Show me how many managed devices are currently out of compliance, and what happens to them.\"", "q": "Does your organization make sure user endpoint devices meet its security requirements?", "evidence": "Endpoint device and personal device policy; device management compliance report; list of exceptions with approvals; remote wipe or device removal records. Cover the last audit period.", "good": "A written endpoint policy states the minimum settings and says whether personal devices are allowed. A device management or endpoint tool reports compliance for all in-scope devices, with exceptions approved and non-compliant devices followed up. Results are reviewed and followed up.", "test": "Read the endpoint policy and confirm it sets minimum settings, including for personal devices if allowed. Pull the current device compliance report and sample devices from it. Pass if the sampled devices meet the required settings (for example disk encryption on, supported operating system) or have an approved exception.", "risk": "Lost, stolen or unmanaged devices expose company data and become an easy way into the network.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.1", "ref": "Annex A.8.1", "atom": "ISO.A8.1-a", "text": "Set security requirements for user endpoint devices.", "match": "equal", "cov": "full", "reason": "Same ask: endpoint requirements.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.1", "ref": "Annex A.8.1", "atom": "ISO.A8.1-b", "text": "Verify devices meet the required settings.", "match": "equal", "cov": "full", "reason": "Verification is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-NET-02", "title": "Secure configuration baselines", "domain": "NET", "theme": "Technological", "goal": "The organization defines secure configuration baselines for hardware, software, services and networks, monitors drift from them and reviews the baselines.", "owner": "Head of IT Operations", "imp": "high", "origin": "iso", "note": "", "statement": "A secure configuration baseline is documented for each type of operating system, database, cloud account and network device in scope. Compliance scans or configuration monitoring compare live systems with the baselines, and drift is fixed. Each baseline is reviewed on its own defined cycle, and the version history shows it. This reduces weaknesses from default or drifting settings.", "why": "Systems built from defaults or left to drift carry avoidable weaknesses that attackers and scanners find first. Consultants test whether baselines exist, are checked against live systems and are kept current.", "how": "Ask which technology types have a baseline, how systems are checked against it, and when each baseline was last reviewed. Example probe: \"Pick a production database server and show me its baseline, its last compliance scan and any drift that was fixed.\"", "q": "Does your organization maintain secure configuration baselines and check systems against them?", "evidence": "Configuration baselines per technology type with version history; compliance scan or configuration monitoring reports; drift remediation tickets; hardening standard. Cover the last two review cycles.", "good": "Baselines exist for every in-scope technology type and are version controlled. Scans or cloud posture tools run on a defined cycle, drift is ticketed and fixed, and each baseline shows a review within its stated interval.", "test": "List the in-scope technology types and confirm each has a baseline. Sample systems and check the latest compliance scan results against the baseline, then trace drift findings to fixes. Pass if every type has a baseline, sampled systems are scanned, drift is remediated, and each baseline was reviewed within its stated interval.", "risk": "Systems run with default or inconsistent settings that leave known weaknesses open to attack.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.9", "ref": "Annex A.8.9", "atom": "ISO.A8.9-a", "text": "Document secure configuration baselines for each in-scope technology type.", "match": "equal", "cov": "full", "reason": "Baselines are the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.9", "ref": "Annex A.8.9", "atom": "ISO.A8.9-b", "text": "Monitor systems against the baselines and remediate drift.", "match": "equal", "cov": "full", "reason": "Drift monitoring is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.9", "ref": "Annex A.8.9", "atom": "ISO.A8.9-c", "text": "Review the baselines within their review interval.", "match": "equal", "cov": "full", "reason": "Baseline review is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.08", "ref": "ID.AM-08", "atom": "NIST.ID.AM.08-b", "text": "Assets are configured to a secure baseline before going live.", "match": "req_smaller", "cov": "full", "reason": "Secure configuration baselines applied to hardware and software before use is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.01", "ref": "PR.PS-01", "atom": "NIST.PR.PS.01-a", "text": "The organization documents secure configuration baselines for the platform types it uses.", "match": "equal", "cov": "full", "reason": "Secure configuration baselines for hardware, software and networks are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.01", "ref": "PR.PS-01", "atom": "NIST.PR.PS.01-b", "text": "The organization checks that systems conform to their baselines.", "match": "req_smaller", "cov": "full", "reason": "Monitoring drift from baselines checks conformity.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.01", "ref": "PR.PS-01", "atom": "NIST.PR.PS.01-c", "text": "The organization reviews and changes default settings on installation or upgrade.", "match": "req_smaller", "cov": "full", "reason": "Baselines include replacing vendor defaults and are reviewed.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.09", "ref": "DE.CM-09", "atom": "NIST.DE.CM.09-c", "text": "The organization detects and reports deviations from configuration baselines.", "match": "equal", "cov": "full", "reason": "Monitoring drift from secure baselines is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-NET-03", "title": "Network security management", "domain": "NET", "theme": "Technological", "goal": "The organization secures and manages networks and network devices, keeps an accurate network diagram and reviews firewall rules.", "owner": "Network and Infrastructure Lead", "imp": "critical", "origin": "iso", "note": "", "statement": "A network security standard is set and maintained, covering how networks and network devices are secured and managed, including device hardening, administrator access and encryption in transit. A current network diagram of the in-scope environment is kept, including cloud networks and links to third parties. Firewall and security group rules are reviewed on a defined cycle, and unneeded or overly permissive rules are removed. This limits the paths an attacker can use. Proof is the standard, the diagram and the rule review records.", "why": "Stale diagrams and unreviewed firewall rules hide exposed services and old access paths. Consultants use the diagram and the rule review records to see whether the network is understood and controlled.", "how": "Ask for the diagram and check its date, then ask who reviews firewall rules and what they removed last time. Example probe: \"Walk me through your last firewall rule review and name one rule you removed.\"", "q": "Does your organization keep its networks secured, documented and regularly reviewed?", "evidence": "Network security standard; current network diagram including cloud and third-party connections; firewall and security group rule review records with removals; change tickets for rule removals. Cover the last two review cycles.", "good": "A network standard defines secure management of devices and traffic. The diagram matches reality, including cloud and partner links. Rule reviews are recorded, and unneeded or permissive rules lead to documented changes.", "test": "Check the diagram's last update date and compare it with a sample of live network components or cloud networks. Inspect the latest firewall and security group review record and trace sampled removals to change tickets. Pass if the diagram is current and complete, the standard exists, and a review happened in the period with permissive rules removed.", "risk": "Unknown or overly permissive network paths let attackers move or reach systems that should be unreachable.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.20", "ref": "Annex A.8.20", "atom": "ISO.A8.20-a", "text": "Define how networks and network devices are secured and managed.", "match": "equal", "cov": "full", "reason": "Same ask: a network security standard.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.20", "ref": "Annex A.8.20", "atom": "ISO.A8.20-b", "text": "Keep an up-to-date network diagram of the in-scope environment.", "match": "equal", "cov": "full", "reason": "The diagram is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.20", "ref": "Annex A.8.20", "atom": "ISO.A8.20-c", "text": "Review firewall and security group rules and remove unneeded or permissive ones.", "match": "equal", "cov": "full", "reason": "Rule review is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.03", "ref": "ID.AM-03", "atom": "NIST.ID.AM.03-a", "text": "The organization maintains network diagrams showing authorized communication paths, including external and third-party connections.", "match": "equal", "cov": "full", "reason": "Keeping an accurate network diagram is in the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.03", "ref": "ID.AM-03", "atom": "NIST.ID.AM.03-c", "text": "The organization documents the expected ports, protocols and services between authorized systems and keeps the diagrams current.", "match": "req_smaller", "cov": "full", "reason": "Managing network devices and traffic rules includes documenting expected ports, protocols and services and keeping the diagram current.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.01", "ref": "PR.PS-01", "atom": "NIST.PR.PS.01-d", "text": "The organization reviews network device configurations against security principles.", "match": "req_smaller", "cov": "full", "reason": "Managing network devices and reviewing firewall rules covers reviewing network device configuration.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.01", "ref": "PR.IR-01", "atom": "NIST.PR.IR.01-a", "text": "The organization documents how networks and environments are protected from unauthorized logical access.", "match": "req_smaller", "cov": "full", "reason": "Securing and managing networks is the documented protection this atom asks for.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.01", "ref": "PR.IR-01", "atom": "NIST.PR.IR.01-d", "text": "The organization reviews firewall and security-group rules periodically and removes unjustified ones.", "match": "equal", "cov": "full", "reason": "Reviewing firewall rules is in the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-NET-04", "title": "Security of network services", "domain": "NET", "theme": "Technological", "goal": "The organization documents and monitors the security features, service levels and requirements of the network services it uses.", "owner": "Network and Infrastructure Lead", "imp": "high", "origin": "iso", "note": "", "statement": "The security features, service levels and requirements of each network service the organization uses, such as internet links, DNS, VPN, content delivery and managed connectivity, are documented. Where a provider supplies the service, these terms are written into the agreement. Service reports are reviewed against the agreed levels on a defined cycle. This keeps the organization from depending on network services that do not meet its needs. Proof is the service agreements and the review records.", "why": "Network services supplied by others often carry security and availability promises nobody checks. Consultants look for whether the terms are written down and measured.", "how": "Ask for a list of network services and who provides each one, then ask how performance and security are tracked. Example probe: \"Show me the last service report for your main internet or VPN provider and who reviewed it.\"", "q": "Does your organization document and monitor the security of the network services it uses?", "evidence": "List of network services and providers; service agreements stating security features and service levels; service level reports with review sign-off. Cover the last two review cycles.", "good": "Every network service has its security features, service levels and requirements documented, and provider-supplied ones are covered by contract. Service reports are reviewed against the agreed levels and shortfalls are raised with the provider.", "test": "List the network services in use and sample some of them. For each, check the documented requirements and the latest service level report. Pass if requirements are documented, external ones are in contracts, and reports were reviewed against the agreed levels in the period.", "risk": "Weak or unmeasured network services cause outages and exposure the organization only discovers after the fact.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.21", "ref": "Annex A.8.21", "atom": "ISO.A8.21-a", "text": "Document the security features, service levels and requirements of each network service used.", "match": "equal", "cov": "full", "reason": "Same ask: identify requirements for network services.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.21", "ref": "Annex A.8.21", "atom": "ISO.A8.21-b", "text": "Monitor network services against the agreed levels.", "match": "equal", "cov": "full", "reason": "Monitoring against levels is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-NET-05", "title": "Network segregation", "domain": "NET", "theme": "Technological", "goal": "The organization separates groups of services, users and systems into network segments by trust level and enforces the allowed traffic between them.", "owner": "Network and Infrastructure Lead", "imp": "high", "origin": "iso", "note": "", "statement": "Network segments are defined by trust level or function, such as production, development, corporate, guest and management, and the traffic allowed between them is stated. The design is enforced through firewall, VLAN or security group settings. Configuration exports show the enforcement. This limits how far an intruder can move from one compromised system.", "why": "A flat network lets one compromised machine reach everything. Consultants need proof that the segmentation design is actually enforced in configuration.", "how": "Ask for the segmentation design, then ask to see the firewall or security group rules that enforce one boundary. Example probe: \"Show me what stops the guest network from reaching production, in the actual rules.\"", "q": "Does your organization separate its networks into segments by trust level and enforce the allowed traffic between them?", "evidence": "Segmentation standard and network diagram showing segments and allowed flows; firewall, VLAN or security group configuration export for sampled segments. Cover the current configuration and the last change review.", "good": "Segments and permitted flows are documented, and exports of firewall, VLAN or cloud rules match the design. Changes to boundaries go through change control.", "test": "Pick sample segment boundaries from the design, such as guest to production and development to production. Inspect the configuration export for each. Pass if the configured rules enforce the documented allowed traffic and block the rest.", "risk": "An intruder who reaches one system can move freely to critical systems and data.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.22", "ref": "Annex A.8.22", "atom": "ISO.A8.22-a", "text": "Define network segments by trust level or function and the traffic allowed between them.", "match": "equal", "cov": "full", "reason": "Same ask: segregated network groups.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.22", "ref": "Annex A.8.22", "atom": "ISO.A8.22-b", "text": "Enforce the segmentation in firewall, VLAN or security group settings.", "match": "equal", "cov": "full", "reason": "Enforcement is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.01", "ref": "PR.IR-01", "atom": "NIST.PR.IR.01-b", "text": "The organization segments networks and cloud environments by trust level.", "match": "equal", "cov": "full", "reason": "Separating services, users and systems by trust level is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.01", "ref": "PR.IR-01", "atom": "NIST.PR.IR.01-c", "text": "Firewall and security-group rules deny inbound traffic by default and allow only documented services.", "match": "req_smaller", "cov": "full", "reason": "Enforcing allowed traffic between segments covers deny-by-default rules.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-NET-06", "title": "Web filtering", "domain": "NET", "theme": "Technological", "goal": "The organization controls access to external websites to reduce exposure to malicious content, including for remote users.", "owner": "Network and Infrastructure Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "The categories of external website that are blocked, and how exceptions are approved, are set in a policy. A filtering control such as a secure web gateway, DNS filtering or an endpoint agent enforces the policy for all in-scope users, including remote users. This reduces exposure to malicious content. Proof is the policy and the filtering configuration or report.", "why": "Users who browse freely, especially off the office network, are an easy route for malware and phishing. Consultants check that filtering follows people wherever they work.", "how": "Ask which categories are blocked, how exceptions are approved and whether the filter works on laptops outside the office. Example probe: \"If I am at home on a company laptop, what stops me from opening a known malware site?\"", "q": "Does your organization control access to external websites for all users, including remote users?", "evidence": "Web access policy listing blocked categories and exception process; filtering configuration export; filtering activity or block report; remote user coverage statement. Cover the last audit period.", "good": "A policy defines blocked categories and an exception route. A filtering tool is active for office and remote users, and activity reports show blocks occurring.", "test": "Read the policy and the filtering configuration. Sample users, including remote ones, and confirm the filter applies to them, and check that a blocked category test URL is refused. Pass if filtering is active for the sampled users and matches the policy.", "risk": "Users reach malicious sites unchecked, raising the chance of malware infection and credential theft.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.23", "ref": "Annex A.8.23", "atom": "ISO.A8.23-a", "text": "Define which categories of external website are blocked and how access is managed.", "match": "equal", "cov": "full", "reason": "Same ask: managed web access.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.23", "ref": "Annex A.8.23", "atom": "ISO.A8.23-b", "text": "Keep web filtering active for in-scope users, including remote users.", "match": "equal", "cov": "full", "reason": "Active filtering is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-NET-07", "title": "Clock synchronization", "domain": "NET", "theme": "Technological", "goal": "The organization synchronizes system clocks to approved time sources.", "owner": "Network and Infrastructure Lead", "imp": "low", "origin": "iso", "note": "", "statement": "The approved reference time sources for in-scope systems are named in a standard. Systems are configured to synchronize with those sources through network time settings or the cloud provider's time service. Configuration exports show the setting. This keeps log timestamps consistent so events can be reconstructed across systems.", "why": "Unsynchronized clocks make it impossible to line up logs during an investigation. Consultants spot-check the setting instead of reading the standard alone.", "how": "Ask which time sources are approved and how systems are pointed at them. Example probe: \"Show me the time settings on one server, one network device and one cloud workload.\"", "q": "Does your organization synchronize the clocks of its systems to approved time sources?", "evidence": "Standard naming approved time sources; system configuration exports showing time settings for sampled systems; baseline configuration that includes time. Cover the current configuration.", "good": "A standard names the approved sources, and baselines or configuration management push the setting to all system types. Sampled systems all point at the approved sources.", "test": "Read the standard for the named sources. Sample servers, network devices and cloud workloads and inspect their time settings. Pass if every sampled system synchronizes with an approved source.", "risk": "Mismatched clocks make logs unreliable for investigations and weaken evidence of what happened.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.17", "ref": "Annex A.8.17", "atom": "ISO.A8.17-a", "text": "Name the approved reference time sources for in-scope systems.", "match": "equal", "cov": "full", "reason": "Same ask: approved time sources.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.17", "ref": "Annex A.8.17", "atom": "ISO.A8.17-b", "text": "Configure systems to synchronize with the approved sources.", "match": "equal", "cov": "full", "reason": "Synchronization is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-NET-08", "title": "Software installation control", "domain": "NET", "theme": "Technological", "goal": "The organization controls who may install software on operational systems, from which sources and with what approval, and enforces it technically.", "owner": "Head of IT Operations", "imp": "medium", "origin": "iso", "note": "", "statement": "Rules state who may install software on operational systems, from which approved sources and with what testing and approval. Technical restrictions enforce this on servers and endpoints, for example no local administrator rights, application allow lists or deployment only through the pipeline. This stops unauthorized or untested software from reaching production. Proof is the procedure and the configuration or policy exports.", "why": "Unrestricted installs let malware, unlicensed tools and untested code onto operational systems. Consultants check that the restriction is technical, not just a rule.", "how": "Ask who can install software and how that is enforced on both servers and laptops. Example probe: \"If a developer tried to install an unapproved tool on a production server, what would stop them?\"", "q": "Does your organization restrict and technically enforce who can install software on its operational systems?", "evidence": "Software installation procedure with approved sources and approval steps; endpoint or server policy export showing administrator rights or allow list settings; deployment pipeline records. Cover the last audit period.", "good": "A procedure states who may install what, from where, with what approval. Technical controls such as removed local admin rights or allow lists enforce it on servers and endpoints, and exceptions are approved and recorded.", "test": "Read the procedure. Sample servers and endpoints and inspect their policy exports for installation restrictions. Pass if the sampled systems block unapproved installs and any exception has an approval record.", "risk": "Unauthorized or untested software enters operational systems and introduces malware or instability.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.19", "ref": "Annex A.8.19", "atom": "ISO.A8.19-a", "text": "Define who may install software on operational systems, from which sources and with what approval.", "match": "equal", "cov": "full", "reason": "Same ask: controlled installation.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.19", "ref": "Annex A.8.19", "atom": "ISO.A8.19-b", "text": "Enforce installation restrictions technically on servers and endpoints.", "match": "equal", "cov": "full", "reason": "Technical enforcement is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.05", "ref": "PR.PS-05", "atom": "NIST.PR.PS.05-a", "text": "Policy limits software installation and execution to approved software.", "match": "req_smaller", "cov": "full", "reason": "Controlling who may install software and from which sources sets the policy limit.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.05", "ref": "PR.PS-05", "atom": "NIST.PR.PS.05-b", "text": "Technical controls on devices stop users installing or running unapproved software.", "match": "equal", "cov": "full", "reason": "Technical enforcement of installation control is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.05", "ref": "PR.PS-05", "atom": "NIST.PR.PS.05-c", "text": "The organization checks the source and integrity of new software before installation.", "match": "req_bigger", "cov": "partial", "reason": "Control limits sources but does not require checking authenticity and integrity.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-NET-09", "title": "Secure remote working", "domain": "NET", "theme": "People", "goal": "The organization sets security requirements for remote working and enforces them technically for remote access.", "owner": "Network and Infrastructure Lead", "imp": "high", "origin": "iso", "note": "", "statement": "Security requirements for working outside company premises, such as approved devices, secure connections, physical privacy and handling of printed material, are set. Technical controls enforce them for remote access, for example a VPN or zero trust gateway with multi-factor sign-in and device compliance checks. This protects company data when people work from home or travel. Proof is the remote working policy and the access gateway configuration.", "why": "Remote workers sit outside the office defenses, so the rules must be enforced at the access point. Consultants look for both a written rule and a technical gate.", "how": "Ask what remote workers must follow and what stops a non-compliant device or user from connecting. Example probe: \"Show me what happens when a remote user connects from an unmanaged laptop.\"", "q": "Does your organization enforce security requirements for remote working through technical controls on remote access?", "evidence": "Remote working policy; remote access gateway or VPN configuration; multi-factor and device compliance settings; sample access logs showing denied non-compliant attempts. Cover the last audit period.", "good": "A remote working policy covers devices, connections, privacy and printed material. Remote access requires strong authentication and compliant devices, and logs show the rules being applied.", "test": "Read the policy for the required topics. Inspect the remote access configuration and test or review logs for sampled users and devices. Pass if remote access requires multi-factor sign-in and device checks as the policy states.", "risk": "Remote access paths become an easy entry point for attackers and expose data outside company control.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.7", "ref": "Annex A.6.7", "atom": "ISO.A6.7-a", "text": "Set security requirements for working outside the premises.", "match": "equal", "cov": "full", "reason": "Same ask: remote working requirements.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.7", "ref": "Annex A.6.7", "atom": "ISO.A6.7-b", "text": "Enforce the requirements technically for remote access.", "match": "equal", "cov": "full", "reason": "Technical enforcement is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-NET-40", "title": "Authenticity and integrity of acquired hardware and software", "domain": "NET", "theme": "", "goal": "The organization checks that hardware and software are genuine and unaltered before it is acquired or put into use.", "owner": "Head of IT Operations", "imp": "medium", "origin": "nist", "note": "Remainder of UC-NET-08; also NIST-only for hardware and acquisition checks.", "statement": "Hardware and software are checked as genuine before they are acquired, and software is checked for integrity, for example by signature or hash, before it is installed or used. The source of new software is checked. A record of each check is kept. Proof is the procedure and acquisition and integrity check records.", "why": "Counterfeit hardware and tampered software arrive already compromised and bypass every later control.", "how": "Ask how a new device or package is confirmed as genuine, then ask for the record of one check. Example probe: \"For the last software package you installed, how did you confirm its source and that it was not altered?\"", "q": "Does your organization check that hardware and software are genuine before it acquires or uses them?", "evidence": "Procedure for authenticity and integrity checks; supplier legitimacy checks; signature or hash verification records for installed software; acquisition records; covering the audit period", "good": "A procedure requires authenticity checks before acquisition and integrity checks before use. The source of new software is checked. Recent acquisitions show the checks were done and recorded before deployment.", "test": "Obtain the procedure and the acquisition and integrity check records. Sample five recent acquisitions of hardware or software and check each has a recorded authenticity or integrity check before deployment. Pass if all sampled items have a record.", "risk": "Counterfeit or tampered products enter the environment with built-in backdoors or malware.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"],
