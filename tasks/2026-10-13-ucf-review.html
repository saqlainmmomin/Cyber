ng with the consequences.", "match": "equal", "cov": "full", "reason": "Reaction and correction are in GOV-20.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C10.2", "ref": "Clause 10.2", "atom": "ISO.C10.2-b", "text": "Evaluate the need to remove causes, act, review the effectiveness of the action and change the program if needed.", "match": "equal", "cov": "full", "reason": "Root-cause action and review are in GOV-20.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C10.2", "ref": "Clause 10.2", "atom": "ISO.C10.2-c", "text": "Keep evidence of the nonconformities and the actions taken.", "match": "equal", "cov": "full", "reason": "Evidence retention is in GOV-20.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-GOV-40", "title": "Mission and business context", "domain": "GOV", "theme": "", "goal": "The organization documents its mission and business context, has top management approve them, and ties its security risk priorities to them.", "owner": "CISO", "imp": "medium", "origin": "nist", "note": "NIST-only. Mission statement and link to risk priorities; ISO issues and stakeholders do not hold it.", "statement": "The organization's mission and business context, including the services it delivers, are documented and approved by top management. Security risk priorities are tied to the mission or to those services in the risk strategy and in risk decisions. This keeps security effort aimed at what the business depends on. Proof is the approved mission statement, the risk strategy and a risk register extract.", "why": "Without a link to the mission, security priorities drift toward what is easy or fashionable and the board cannot see why risks rank as they do.", "how": "Ask for the approved mission or purpose statement, then ask how the risk priorities connect to it. Look for a named business service on the risk entries. Example probe: \"Take your top risk. Which service or mission objective does it threaten, and where is that written down?\"", "q": "Does your organization tie its security risk priorities to a documented mission that top management has approved?", "evidence": "Approved mission, vision or purpose statement with approval record; security risk strategy or methodology; risk register extract showing the mission objective or service each risk affects; covering the audit period", "good": "A written mission statement carries top management approval. The risk strategy states that priorities follow the mission or the services that deliver it. Recent risk decisions record which objective or service each risk affects.", "test": "Obtain the mission statement and the risk strategy. Check the mission is approved by top management and the strategy ties risk priorities to the mission or services. Sample three risk decisions from the period and check each names the objective or service affected. Pass if all three hold.", "risk": "Security spending and risk rankings are disconnected from what the business needs, so critical services stay under-protected.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.OC.01", "ref": "GV.OC-01", "atom": "NIST.GV.OC.01-a", "text": "The organization documents its mission and has leadership approve it.", "match": "equal", "cov": "full", "reason": "The slot's goal is a documented, leadership-approved mission and business context; no base control holds it.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.01", "ref": "GV.OC-01", "atom": "NIST.GV.OC.01-b", "text": "The organization ties its cybersecurity risk priorities to the mission or the services that deliver it.", "match": "equal", "cov": "full", "reason": "Linking risk priorities to the mission is the second half of the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "Wording (D17): 'leadership' became 'top management'."}, {"id": "UC-GOV-41", "title": "Risk direction communicated to those who act on it", "domain": "GOV", "theme": "", "goal": "The organization delivers its risk direction, methods, roles and decisions to the people who must act on them and keeps evidence that they received it.", "owner": "CISO", "imp": "medium", "origin": "nist", "note": "NIST-only. Shared by atoms that ask for communication of a specific artifact where no base control owns it.", "statement": "The risk direction, the risk method, security roles and planned risk responses are delivered to the people who must act on them. Each item is sent by a defined channel when it is issued or changed. Proof of receipt is kept, such as distribution lists, acknowledgements or briefing records, and role holders confirm they understand their roles.", "why": "Risk direction that was written but never delivered is not followed, and an auditor needs proof that the people deciding and acting actually received it.", "how": "Pick one artifact, such as the risk method, and ask how the people who apply it got it. Ask for the record of delivery. Example probe: \"Show me how the last change to the risk rating method reached the risk owners, and who confirmed they understood it.\"", "q": "Does your organization make sure the people who act on its risk direction, methods and roles have received them?", "evidence": "Distribution records or briefing sign-in sheets for the risk strategy and risk method; role appointment letters or signed acknowledgements; job descriptions stating security duties; risk reports sent to owners and leadership; covering the audit period", "good": "Each artifact has a named audience and a delivery record. Role holders have been told their security roles and confirm them. Planned risk responses reach the affected stakeholders. Follow-up exists when duties were not met. Sub-asks: risk response direction to decision makers, risk method to its users, roles to role holders, planned responses to stakeholders.", "test": "Obtain the delivery records for the risk direction, risk method, role assignments and risk responses. Sample three role holders and three risk owners and check each has a record of receipt in the period. Pass if every sampled person has a dated record for each item that applies to them.", "risk": "Decision makers and role holders act on outdated or unknown direction, so risk is accepted or ignored inconsistently.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.RM.04", "ref": "GV.RM-04", "atom": "NIST.GV.RM.04-c", "text": "The organization communicates the risk response direction to those who make risk decisions.", "match": "equal", "cov": "full", "reason": "Delivering the risk response direction to decision makers is what the communication slot covers.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.06", "ref": "GV.RM-06", "atom": "NIST.GV.RM.06-d", "text": "The organization communicates the method to the people who apply it.", "match": "equal", "cov": "full", "reason": "Delivering the method to the people who apply it is what the communication slot covers.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.02", "ref": "GV.RR-02", "atom": "NIST.GV.RR.02-b", "text": "The organization communicates these roles to role holders and confirms they understand them.", "match": "equal", "cov": "full", "reason": "Making sure role holders have been told and understand their roles is what the communication slot covers.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.06", "ref": "ID.RA-06", "atom": "NIST.ID.RA.06-d", "text": "The organization communicates planned risk responses to affected stakeholders.", "match": "equal", "cov": "full", "reason": "Delivering planned risk responses to affected stakeholders is what the communication slot covers.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-GOV-42", "title": "Security test and exercise program", "domain": "GOV", "theme": "", "goal": "The organization plans a program of security tests and exercises that includes critical suppliers where relevant, and records the improvements each one identifies.", "owner": "CISO", "imp": "medium", "origin": "nist", "note": "NIST-only. Program-level plan across penetration, tabletop and recovery tests.", "statement": "A program of security tests and exercises, such as penetration tests, tabletop exercises and recovery tests, is planned and scheduled, and includes critical suppliers and relevant third parties where it matters. Each test or exercise produces a report that records the improvements identified. Each improvement has an owner and is tracked to closure. Proof is the plan, the reports and the action tracker.", "why": "Tests that are ad hoc, skip key suppliers or leave no tracked actions do not make the organization better prepared.", "how": "Ask for the test and exercise plan, then the reports from the last cycle. Check actions have owners. Ask whether a critical supplier took part. Example probe: \"Show me the last exercise report, the actions it raised and where a supplier was involved.\"", "q": "Does your organization run a planned program of security tests and exercises, recording the improvements each one identifies?", "evidence": "Security test and exercise plan or schedule; penetration test, tabletop and recovery test reports; improvement action tracker with owners and status; record of supplier involvement or reason for none; covering the audit period", "good": "A schedule covers the main test types. Reports state the improvements found. Every improvement has an owner and a status. At least one test or exercise involved a critical supplier, or a record explains why none was needed.", "test": "Obtain the plan and the reports for the period. Sample three improvement actions and check each has an owner and a tracked status. Check at least one exercise involved a critical supplier or records why not. Pass if the plan exists, reports record improvements and all sampled actions are tracked.", "risk": "Weaknesses in people, process and supplier links stay hidden until a real incident exposes them.", "applies": "", "type": "detective", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.ID.IM.02", "ref": "ID.IM-02", "atom": "NIST.ID.IM.02-a", "text": "The organization plans and schedules security tests and exercises.", "match": "equal", "cov": "full", "reason": "No base control plans a schedule of security tests and exercises as one program.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.02", "ref": "ID.IM-02", "atom": "NIST.ID.IM.02-b", "text": "Test and exercise reports record the improvements identified.", "match": "equal", "cov": "full", "reason": "Recording the improvements each test or exercise identifies is the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.02", "ref": "ID.IM-02", "atom": "NIST.ID.IM.02-d", "text": "The organization involves critical suppliers and relevant third parties in tests and exercises.", "match": "equal", "cov": "full", "reason": "Involving critical suppliers in tests and exercises is in the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-GOV-70", "title": "Personal data inside security coverage", "domain": "GOV", "theme": "", "goal": "The organization brings all personal data it holds or controls, including data handled on its behalf, within the scope of its security program and policies.", "owner": "CISO", "imp": "high", "origin": "dpdpa", "note": "Remainder of UC-GOV-04. Completes the generic security program for personal data.", "statement": "The security policies and safeguards cover all personal data the organization holds or controls, including data that other parties process on its behalf. A scope statement names the personal data stores and processors in coverage and is checked against the data inventory whenever systems or processors change. Technical and organizational safeguards are applied to everything in that scope. Proof is the policy scope, the scope statement and the check records.", "why": "Security programs are often scoped by system, and personal data held by processors or in side systems sits outside the safeguards without anyone deciding that.", "how": "Ask where personal data lives and whether each place, including processors, falls inside the security policy. Compare the policy scope with the data inventory. Example probe: \"Pick a processor that holds customer data and show me where your security policy covers it.\"", "q": "Does your organization bring all personal data it holds or controls, including data handled by processors, within the scope of its security policies and safeguards?", "evidence": "Security policy with its scope; scope statement listing personal data stores and processors; data inventory; records of scope checks after system or processor changes, for the audit period.", "good": "The security policy states that it covers all personal data held or controlled, including processor-held data. The scope statement lists every personal data store and processor and matches the data inventory. Scope is rechecked when systems or processors change.", "test": "Read the policy scope. Sample personal data stores and processors from the data inventory and confirm each is named in the scope statement and subject to the safeguards. Pass if every sampled store and processor is in scope.", "risk": "Personal data sits outside security coverage, so a breach occurs in a place nobody was protecting.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.SECURITY.1", "ref": "Section 8(5)", "atom": "CH2.SECURITY.1-a", "text": "Implement reasonable technical safeguards to protect personal data and prevent breaches.", "match": "equal", "cov": "full", "reason": "Bringing all personal data, including processor-held data, inside the program completes the base control.", "primary": true, "rem": "UC-GOV-04", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.1", "ref": "Section 8(5)", "atom": "CH2.SECURITY.1-b", "text": "Implement reasonable organizational safeguards to protect personal data and prevent breaches.", "match": "equal", "cov": "full", "reason": "Applying the program to all personal data completes the base control.", "primary": false, "rem": "UC-GOV-04", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RSK-01", "title": "Risk assessment method", "domain": "RSK", "theme": "", "goal": "The organization defines a repeatable risk assessment method with set acceptance criteria and criteria for performing assessments that identifies risks and their owners and ranks them by likelihood and impact.", "owner": "Risk and Compliance Manager", "imp": "critical", "origin": "iso", "note": "Clause only. Method, not the performing of assessments (RSK-04).", "statement": "A repeatable risk assessment method is defined, with acceptance criteria and criteria for performing assessments. The method identifies risks to confidentiality, integrity and availability within scope, assigns risk owners, and ranks risks by likelihood and impact. It is kept as a documented procedure and reviewed on a defined cycle.", "why": "Without a set method, assessments give inconsistent results that cannot be compared or trusted for decisions.", "how": "Ask for the method document and check it sets scales, acceptance criteria and triggers. Ask how consistency between assessors is ensured. Example probe: \"If two teams assessed the same system, would they reach the same rating, and how do you know?\"", "q": "Does your organization have a documented, repeatable method for assessing security risk?", "evidence": "Risk assessment methodology or procedure; likelihood and impact scales; risk acceptance criteria; approval record; review history for the last two cycles", "good": "The method defines scales, acceptance criteria, triggers for assessment and how owners are assigned. It requires covering confidentiality, integrity and availability, and shows how consistent results are checked. It is approved and reviewed.", "test": "Obtain the method. Check it defines criteria, triggers, scales and owner assignment. Apply it to two sample risks from the register and compare ratings. Pass if the method is approved and complete and the sample ratings follow it.", "risk": "Risk ratings are inconsistent and arbitrary, so treatment effort goes to the wrong places.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C6.1.2", "ref": "Clause 6.1.2", "atom": "ISO.C6.1.2-a", "text": "Define and apply a risk assessment process with risk acceptance criteria and criteria for performing assessments.", "match": "equal", "cov": "full", "reason": "The method with criteria is the whole of RSK-01.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.2", "ref": "Clause 6.1.2", "atom": "ISO.C6.1.2-b", "text": "Make sure repeated assessments give consistent, valid and comparable results.", "match": "equal", "cov": "full", "reason": "Repeatability is the point of a defined method.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.2", "ref": "Clause 6.1.2", "atom": "ISO.C6.1.2-c", "text": "Identify risks to confidentiality, integrity and availability within scope and assign risk owners.", "match": "equal", "cov": "full", "reason": "Risk identification and owners are in RSK-01.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.2", "ref": "Clause 6.1.2", "atom": "ISO.C6.1.2-d", "text": "Analyze likelihood and consequence and evaluate and prioritize risks against the criteria.", "match": "equal", "cov": "full", "reason": "Analysis and ranking are in RSK-01.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.2", "ref": "Clause 6.1.2", "atom": "ISO.C6.1.2-e", "text": "Keep documented information about the risk assessment process.", "match": "equal", "cov": "full", "reason": "The documented method is RSK-01's artifact.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.06", "ref": "GV.RM-06", "atom": "NIST.GV.RM.06-a", "text": "The organization documents one method for rating cybersecurity risk from likelihood and impact.", "match": "equal", "cov": "full", "reason": "One repeatable method combining likelihood and impact is the control's core.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.06", "ref": "GV.RM-06", "atom": "NIST.GV.RM.06-b", "text": "The method defines how risks are categorized and prioritized.", "match": "req_smaller", "cov": "full", "reason": "The control ranks risks; categorization and priority order are part of the method.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.06", "ref": "GV.RM-06", "atom": "NIST.GV.RM.06-c", "text": "The organization applies the same method consistently across all recorded risks.", "match": "req_smaller", "cov": "full", "reason": "A repeatable method applied to every recorded risk is what the control's test checks.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.04", "ref": "ID.RA-04", "atom": "NIST.ID.RA.04-a", "text": "The risk methodology defines scales for likelihood and impact.", "match": "equal", "cov": "full", "reason": "Defined likelihood and impact scales are the control's core.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.04", "ref": "ID.RA-04", "atom": "NIST.ID.RA.04-b", "text": "Each recorded risk carries a likelihood and an impact estimate.", "match": "req_smaller", "cov": "full", "reason": "Ranking risks by likelihood and impact means each recorded risk carries both.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.04", "ref": "ID.RA-04", "atom": "NIST.ID.RA.04-c", "text": "Business owners confirm the likelihood and impact estimates for their risks.", "match": "req_smaller", "cov": "full", "reason": "The control identifies risks with their owners, which gives owners the estimates to confirm.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.05", "ref": "ID.RA-05", "atom": "NIST.ID.RA.05-a", "text": "The risk methodology combines threat, vulnerability, likelihood and impact into an inherent risk rating.", "match": "req_smaller", "cov": "full", "reason": "The method that ranks risks combines the factors into a rating.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.05", "ref": "ID.RA-05", "atom": "NIST.ID.RA.05-b", "text": "Each recorded risk shows an inherent rating.", "match": "req_smaller", "cov": "full", "reason": "A ranking recorded per risk is the control's output.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-RSK-02", "title": "Risk treatment plan", "domain": "RSK", "theme": "", "goal": "The organization chooses a treatment for each assessed risk, determines the controls needed, and gets the treatment plan approved and residual risk accepted in writing by those accountable for each risk.", "owner": "Risk and Compliance Manager", "imp": "critical", "origin": "iso", "note": "Clause only. Split from the applicability statement (RSK-03) because the test differs.", "statement": "A treatment is chosen for each assessed risk, the controls needed are determined, and a risk treatment plan is formulated. The treatment plan is approved, and residual risk accepted, in writing by those accountable for each risk. The plan is kept as a record and updated after each assessment cycle.", "why": "Risks without a chosen treatment or recorded acceptance stay open, and no one is accountable for what remains.", "how": "Ask for the treatment plan and pick risks from the register. Check each has a treatment, a control, an approval and recorded acceptance of what remains. Example probe: \"Who signed off the residual risk on your top risk, and where is that recorded?\"", "q": "Does your organization have a risk treatment plan approved, with residual risk accepted in writing by those accountable for each risk?", "evidence": "Risk treatment plan; risk register with treatment decisions; approval and residual risk acceptance records; records from the latest assessment cycle", "good": "Every assessed risk has a treatment option, planned controls, an owner, timing and an approved residual risk level. Approval is dated and recorded.", "test": "Obtain the register and treatment plan. Sample five risks and check each has a treatment, controls, approval and residual risk acceptance. Pass if all sampled risks are complete and approved.", "risk": "Risks go untreated or unaccepted, and the organization carries exposure no one has agreed to.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C6.1.3", "ref": "Clause 6.1.3", "atom": "ISO.C6.1.3-a", "text": "Select risk treatment options for the assessed risks.", "match": "equal", "cov": "full", "reason": "Treatment choice is in RSK-02.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.3", "ref": "Clause 6.1.3", "atom": "ISO.C6.1.3-d", "text": "Formulate a risk treatment plan.", "match": "equal", "cov": "full", "reason": "The plan is in RSK-02.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.3", "ref": "Clause 6.1.3", "atom": "ISO.C6.1.3-e", "text": "Get risk owner approval of the plan and acceptance of residual risk, and keep documented information.", "match": "equal", "cov": "full", "reason": "Approval and residual risk acceptance are in RSK-02.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.07", "ref": "GV.SC-07", "atom": "NIST.GV.SC.07-b", "text": "The organization records a defined response to each supplier risk.", "match": "req_smaller", "cov": "full", "reason": "Choosing a treatment and owner for each assessed risk covers supplier risk responses.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.05", "ref": "ID.RA-05", "atom": "NIST.ID.RA.05-c", "text": "The organization uses the ratings to prioritize risk treatment and justifies departures in writing.", "match": "req_smaller", "cov": "full", "reason": "Choosing a treatment for each assessed risk in rating order is the treatment plan.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.06", "ref": "ID.RA-06", "atom": "NIST.ID.RA.06-a", "text": "The organization requires a response decision for each risk, with criteria for choosing among accept, mitigate, transfer and avoid.", "match": "equal", "cov": "full", "reason": "A treatment decision for each risk is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.06", "ref": "ID.RA-06", "atom": "NIST.ID.RA.06-b", "text": "Each risk above tolerance has a recorded response, an owner and a target date.", "match": "req_smaller", "cov": "full", "reason": "A plan with a treatment, owner and approval for each risk covers response, owner and date.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-RSK-03", "title": "Statement of applicable controls", "domain": "RSK", "theme": "", "goal": "The organization keeps a documented statement of which controls apply, why each is included or left out and whether each is implemented, checked against a reference control set so none is missed.", "owner": "Risk and Compliance Manager", "imp": "high", "origin": "iso", "note": "Clause only. Split from treatment plan (RSK-02).", "statement": "A documented statement of applicable controls is kept. It states which controls apply, why each is included or left out, and whether each is implemented. The control list is checked against a reference control set to confirm none is missed, and the statement is updated after each treatment plan change.", "why": "Without this statement, necessary controls can be dropped without anyone deciding to, and exclusions have no reason on record.", "how": "Ask for the statement and check every control has a decision and reason. Ask how it was compared to a reference set. Example probe: \"Pick a control you excluded and tell me why, and where that reason is written.\"", "q": "Does your organization keep a documented statement of which controls apply?", "evidence": "Statement of applicable controls; comparison record against a reference control set; approval record; version history for the last two cycles", "good": "The statement lists each control with applicable or not, a reason, and implementation status. A recorded comparison against a reference set shows nothing was missed. Management approves it.", "test": "Obtain the statement and the comparison record. Sample five controls, including two exclusions. Pass if each has a decision, a reason and an implementation status, the comparison is recorded, and the statement is approved and current.", "risk": "Needed controls are missed or excluded without reason, leaving unplanned gaps.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C6.1.3", "ref": "Clause 6.1.3", "atom": "ISO.C6.1.3-b", "text": "Determine all controls needed to implement the chosen treatment options and compare them with Annex A to check none is missed.", "match": "equal", "cov": "full", "reason": "The omission check is in RSK-03.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.3", "ref": "Clause 6.1.3", "atom": "ISO.C6.1.3-c", "text": "Produce a statement of applicability listing the necessary controls, why each is included, whether each is implemented and why any Annex A control is excluded.", "match": "equal", "cov": "full", "reason": "The statement is the whole of RSK-03.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RSK-04", "title": "Risk assessments performed", "domain": "RSK", "theme": "", "goal": "The organization performs risk assessments at planned intervals and when significant change occurs, and keeps the results.", "owner": "Risk and Compliance Manager", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "Risk assessments are performed at planned intervals and when significant change is proposed or occurs. Assessments follow the defined method and results are kept. Proof is dated assessment reports covering the scope.", "why": "Stale assessments hide new risks introduced by changes, so decisions rest on old information.", "how": "Ask when assessments last ran and what triggers an extra one. Check results against the planned schedule. Example probe: \"What was the last significant change, and was a risk assessment done for it?\"", "q": "Does your organization perform risk assessments at planned intervals?", "evidence": "Risk assessment schedule; completed assessment reports and registers; records of change-triggered assessments; records from the last two cycles", "good": "Assessments follow a schedule and run on trigger events. Reports are dated, use the defined method, cover the full scope and are retained.", "test": "Obtain the schedule and reports. Check the last two planned assessments occurred on time and sample two significant changes for a triggered assessment. Pass if all expected assessments are on record.", "risk": "New or changed risks go unseen, and treatment decisions rest on out-of-date views.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C8.2", "ref": "Clause 8.2", "atom": "ISO.C8.2-a", "text": "Perform risk assessments at planned intervals or when significant changes are proposed or occur.", "match": "equal", "cov": "full", "reason": "Same ask: assess on schedule and on change.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C8.2", "ref": "Clause 8.2", "atom": "ISO.C8.2-b", "text": "Keep the results of the assessments.", "match": "equal", "cov": "full", "reason": "Retained results are in RSK-04.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RSK-05", "title": "Risk treatment carried out", "domain": "RSK", "theme": "", "goal": "The organization carries out its risk treatment plan and keeps the results.", "owner": "Risk and Compliance Manager", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "The risk treatment plan is carried out and the results are kept. Each treatment action has an owner and due date. Progress is tracked and completion is evidenced.", "why": "A plan that is not carried out leaves risks as high as before while records suggest otherwise.", "how": "Ask for progress on the treatment plan and pick completed items to see proof. Example probe: \"Show me the evidence that your last completed treatment action reduced the risk.\"", "q": "Does your organization carry out its risk treatment plan?", "evidence": "Treatment plan with status; completion evidence for treatment actions; overdue action report; records from the current review period", "good": "Each treatment action has an owner, due date and status. Completed actions have evidence, and overdue actions are escalated and re-planned with approval.", "test": "Obtain the treatment plan status. Sample five actions, including completed and overdue ones. Pass if completed actions have evidence and overdue actions have a recorded escalation or revised date.", "risk": "Treatment is planned but not done, and risks stay at their original level.", "applies": "", "type": "corrective", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C8.3", "ref": "Clause 8.3", "atom": "ISO.C8.3-a", "text": "Implement the risk treatment plan.", "match": "equal", "cov": "full", "reason": "Same ask: carry out the plan.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C8.3", "ref": "Clause 8.3", "atom": "ISO.C8.3-b", "text": "Keep the results of the treatment.", "match": "equal", "cov": "full", "reason": "Retained results are in RSK-05.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.06", "ref": "ID.RA-06", "atom": "NIST.ID.RA.06-c", "text": "The organization tracks progress on risk treatment.", "match": "req_smaller", "cov": "full", "reason": "Carrying out the treatment plan and keeping results is progress tracking.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-RSK-06", "title": "Legal and contractual requirements register", "domain": "RSK", "theme": "Organizational", "goal": "The organization identifies and documents the legal, regulatory and contractual requirements that bear on its information security, records how each is met, and keeps the list current.", "owner": "Legal Counsel", "imp": "high", "origin": "iso", "note": "", "statement": "A register of legal, regulatory and contractual requirements that bear on information security is kept, including the privacy laws and contract terms that apply to personal data processing. The register records how each is met, with an owner or control reference. It is reviewed at least every 12 months and after relevant legal change.", "why": "Missing requirements lead to unplanned breaches of law or contract and penalties.", "how": "Ask for the register and check it covers data protection, sector rules and customer contracts. Check ownership and the last review. Example probe: \"Which new law or contract term did you add last year, and who owns meeting it?\"", "q": "Does your organization keep a current register of the legal, regulatory, or contractual requirements that bear on its information security?", "evidence": "Legal and contractual requirements register with owners or control references; review history for the last 12 months; record of updates after legal changes", "good": "The register lists each requirement with its source, owner and how it is met, including privacy laws and contract terms for personal data. It has been reviewed within the cycle and updated after relevant changes.", "test": "Obtain the register. Check it lists the privacy laws and contract terms that apply to personal data processing. Sample five requirements and check each has an owner or control reference and how it is met. Pass if the privacy requirements are listed, the sample is complete and the register was reviewed within the last 12 months or after a relevant legal change.", "risk": "The organization breaches laws or contracts without knowing, facing fines and lost business.", "applies": "", "type": "preventive", "freq": "annual", "ks": "base: register review at least every 12 months and after relevant legal change", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.31", "ref": "Annex A.5.31", "atom": "ISO.A5.31-a", "text": "List every legal, regulatory and contractual requirement that bears on information security.", "match": "equal", "cov": "full", "reason": "The register of requirements is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.31", "ref": "Annex A.5.31", "atom": "ISO.A5.31-b", "text": "Record how each requirement is met, with an owner or control reference.", "match": "equal", "cov": "full", "reason": "How each is met is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.31", "ref": "Annex A.5.31", "atom": "ISO.A5.31-c", "text": "Review and update the list at least yearly and after relevant legal change.", "match": "equal", "cov": "full", "reason": "Keeping the list current is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.34", "ref": "Annex A.5.34", "atom": "ISO.A5.34-a", "text": "Identify the privacy laws and contractual terms that apply to personal data processing.", "match": "req_smaller", "cov": "full", "reason": "Identifying the privacy laws and contract terms that apply is part of keeping the legal requirements register.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.03", "ref": "GV.OC-03", "atom": "NIST.GV.OC.03-a", "text": "The organization keeps a register of the legal, regulatory and contractual cybersecurity and privacy requirements that apply to it.", "match": "equal", "cov": "full", "reason": "Same ask: a current register of legal, regulatory and contractual requirements.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.03", "ref": "GV.OC-03", "atom": "NIST.GV.OC.03-b", "text": "The organization assigns each requirement an owner and shows how the requirement is met.", "match": "req_bigger", "cov": "partial", "reason": "Control records how each requirement is met but its goal does not name a per-entry owner.", "primary": false, "rem": "", "imm": "The entry owner is a register field tested in the same sample as how each requirement is met; leftover is a field, not a separate control."}, {"fw": "nist_csf", "rec": "NIST.GV.OC.03", "ref": "GV.OC-03", "atom": "NIST.GV.OC.03-c", "text": "The organization runs a process to detect new or changed requirements and keeps the register current.", "match": "req_smaller", "cov": "full", "reason": "The control keeps the list current, which needs a process for new or changed requirements.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": "Gained a mapped ask (D11): identifying applicable privacy laws, moved from UC-RSK-08. Text unchanged."}, {"id": "UC-RSK-07", "title": "Intellectual property and licensing", "domain": "RSK", "theme": "Organizational", "goal": "The organization protects intellectual property rights, including using software only from legitimate sources and staying within license terms.", "owner": "Legal Counsel", "imp": "medium", "origin": "iso", "note": "", "statement": "Rules for protecting intellectual property are set, including obtaining software only from legitimate sources and staying within license terms. Software licenses are reconciled against installed or subscribed software on a defined cycle, and differences are acted on. Proof is the procedure and reconciliation record.", "why": "Unlicensed or misused software and content brings legal claims, penalties and loss of vendor trust.", "how": "Ask who manages licenses and how installed software is compared to entitlements. Example probe: \"Show me the last license reconciliation and what you did about any shortfall.\"", "q": "Does your organization protect intellectual property rights, including license compliance?", "evidence": "Intellectual property and software license procedure; software license register; reconciliation report against installed or subscribed software; records for the last review cycle", "good": "A procedure covers legitimate sources and license compliance. A register of entitlements is reconciled against actual use on a set cycle, and shortfalls are fixed.", "test": "Obtain the procedure and the latest reconciliation. Sample five software products and compare entitlements with installed or subscribed counts. Pass if the procedure exists and the sampled products are within entitlement or have a recorded fix.", "risk": "Use of unlicensed software leads to legal claims, audit penalties and exposure to tampered software.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.32", "ref": "Annex A.5.32", "atom": "ISO.A5.32-a", "text": "Define how intellectual property is protected, including legitimate software sources and license compliance.", "match": "equal", "cov": "full", "reason": "Same ask: procedures protecting IP and license terms.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.32", "ref": "Annex A.5.32", "atom": "ISO.A5.32-b", "text": "Reconcile software licenses against installed or subscribed software.", "match": "equal", "cov": "full", "reason": "License reconciliation is the control's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RSK-08", "title": "Record of personal data processing", "domain": "RSK", "theme": "Organizational", "goal": "The organization keeps a current record of its processing of personal data for the scope of its program.", "owner": "Data Protection Officer", "imp": "critical", "origin": "iso", "note": "Split in round 2: responsibility for privacy moved to UC-RSK-11; identifying applicable privacy laws re-mapped to UC-RSK-06.", "statement": "A current record of personal data processing is kept for the program scope. Each entry shows what is processed and why. The record is reviewed on a defined cycle and when processing changes, and the record itself is the proof.", "why": "Without knowing what personal data is processed and why, the organization cannot protect it or prove compliance.", "how": "Ask where the record of processing sits and how it is kept current. Check that it covers the whole scope. Example probe: \"Show me the entry for one processing activity and when it was last reviewed.\"", "q": "Does your organization keep a current record of its processing of personal data?", "evidence": "Record of personal data processing or data inventory; review history for the last two cycles.", "good": "A processing record covers the whole scope, with the purposes and data types for each activity. It is reviewed on the defined cycle and updated after change.", "test": "Obtain the processing record. Sample five processing activities and check each is recorded with a purpose and the data types. Pass if the record covers the scope and every sampled entry is current and complete.", "risk": "Personal data is processed without being tracked, which leads to privacy breaches and penalties.", "applies": "Applies if the organization processes personal data.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.34", "ref": "Annex A.5.34", "atom": "ISO.A5.34-c", "text": "Keep a current record of personal data processing for the scope.", "match": "equal", "cov": "full", "reason": "The processing record is in the control goal.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": "Split (D11): narrowed to the record of personal data processing; the other half is now UC-RSK-11; the laws ask moved to UC-RSK-06."}, {"id": "UC-RSK-09", "title": "Independent review of the security program", "domain": "RSK", "theme": "Organizational", "goal": "The organization has its approach to security independently reviewed through a planned internal audit program and other independent reviews, and reports the results to management.", "owner": "Head of Internal Audit", "imp": "high", "origin": "iso", "note": "Merge: clause on internal audit and Annex control on independent review. Same goal, owner and test.", "statement": "Independent review of security is planned, including when it happens and what triggers an unscheduled review. An internal audit program takes account of how important the processes are and the results of earlier audits. Audits have defined criteria, scope and impartial auditors. Reviews are performed within the planned interval and results are reported to management, with evidence kept.", "why": "Without independent review, the organization marks its own homework and misses problems its owners cannot see.", "how": "Ask for the audit program and the last reports. Check auditors are independent of the area audited and results reach management. Example probe: \"Who audited your last security review, and who did they report to?\"", "q": "Does your organization have its security program independently reviewed on a planned cycle?", "evidence": "Audit program or plan with triggers; audit scope and criteria; audit reports; auditor independence record; evidence of reporting to management; records from the last two cycles", "good": "An audit plan sets frequency, methods, criteria, scope and triggers. Auditors are objective and impartial. Reports go to management, and findings flow into corrective action.", "test": "Obtain the audit program and last two reports. Check each audit ran within its planned interval, used impartial auditors and was reported to management. Pass if all hold and findings are logged.", "risk": "Weaknesses go unnoticed because the program is only checked by those who run it.", "applies": "", "type": "detective", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.35", "ref": "Annex A.5.35", "atom": "ISO.A5.35-a", "text": "Plan when security is independently reviewed and what triggers an unscheduled review.", "match": "equal", "cov": "full", "reason": "The review plan and triggers are in the control goal.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.35", "ref": "Annex A.5.35", "atom": "ISO.A5.35-b", "text": "Perform the independent review within the planned interval and report the results to management.", "match": "equal", "cov": "full", "reason": "Reviews and reporting are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.2", "ref": "Clause 9.2", "atom": "ISO.C9.2-a", "text": "Conduct internal audits at planned intervals to show whether the program meets the organization's own requirements and the standard's and is effectively implemented and maintained.", "match": "equal", "cov": "full", "reason": "The internal audit program is in RSK-09.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.2", "ref": "Clause 9.2", "atom": "ISO.C9.2-b", "text": "Plan and run an audit program covering frequency, methods, responsibilities, planning and reporting, taking account of how important the processes are and past audit results.", "match": "equal", "cov": "full", "reason": "Audit program design is in RSK-09.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.2", "ref": "Clause 9.2", "atom": "ISO.C9.2-c", "text": "Define audit criteria and scope and choose auditors who are objective and impartial.", "match": "equal", "cov": "full", "reason": "Independence of auditors is the point of RSK-09.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.2", "ref": "Clause 9.2", "atom": "ISO.C9.2-d", "text": "Report audit results to relevant management and keep evidence.", "match": "equal", "cov": "full", "reason": "Reporting to management is in RSK-09.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.01", "ref": "ID.IM-01", "atom": "NIST.ID.IM.01-a", "text": "The organization schedules regular evaluations of its cybersecurity program, such as self-assessment or audit.", "match": "req_smaller", "cov": "full", "reason": "A planned internal audit program and independent reviews cover scheduled evaluation of the program. Note: the control requires independent review, which is stricter than the source; a self-assessment alone meets the source but not the control.", "primary": true, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-RSK-10", "title": "Practice checked against policy", "domain": "RSK", "theme": "Organizational", "goal": "The organization checks, on a set cycle, that the day-to-day work of each team where security controls apply follows its documented security policies and standards, and acts on any gap.", "owner": "Risk and Compliance Manager", "imp": "medium", "origin": "iso", "note": "", "statement": "The day-to-day work of each team where security controls apply is checked on a defined cycle against the documented security policies and standards. The checks test what is actually done in the work, not only what is written. Each gap between practice and policy is recorded with an action, and actions are tracked to closure. Policy violations found are recorded and handled. Proof is the check schedule, the check reports and the action tracker.", "why": "Policy drift goes unseen when nobody compares practice with the written rule, and behavior slides away from what is documented.", "how": "Ask which teams carry security controls and how the organization knows they work as the policy says (for example internal audit, a control self-assessment, or technical scans). Look at one recent check and what it found. Example probe: \"Show me the last time someone checked what one team really does against the policy, and the actions that came out of it.\"", "q": "Does your organization regularly check that day-to-day work in teams where security controls apply follows its documented security policies?", "evidence": "List of teams where controls apply; check schedule; check reports (audit reports, self-assessments or technical scan results); gap register with actions; records from the current review period", "good": "Every team where controls apply is on a schedule. Checks compare real practice (records, settings, observation) with policy, not only documents. Each gap has an owner and a due date and is tracked to closure. Policy violations found are recorded with how each was handled.", "test": "Obtain the list of teams where security controls apply, the check schedule and the latest check reports. Sample three teams. For each, confirm a check took place in the cycle, that it compared actual practice (records, settings or observation) with the documented policy, and that every gap has an action. Pass if every listed team is on the schedule, each sampled team was checked in the cycle on real practice, and every gap is tracked to closure or has an approved exception. Fail if a check was only a self-declaration with no supporting records.", "risk": "Deviations from policy persist unnoticed, and weak spots only appear in incidents or audits.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.36", "ref": "Annex A.5.36", "atom": "ISO.A5.36-a", "text": "Assign managers or control owners to check compliance with policies and standards at a set frequency.", "match": "equal", "cov": "full", "reason": "Assigned checks are the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.36", "ref": "Annex A.5.36", "atom": "ISO.A5.36-b", "text": "Perform compliance reviews and record non-compliances with actions.", "match": "equal", "cov": "full", "reason": "Reviews and follow-up are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.PO.01", "ref": "GV.PO-01", "atom": "NIST.GV.PO.01-d2", "text": "The organization enforces the policy and records violations and how each was handled.", "match": "req_smaller", "cov": "full", "reason": "Gaps between practice and policy, including violations, are recorded with actions to closure.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "The violations half of the policy-exceptions ask now maps here (D11); the text says violations are recorded and handled."}, {"id": "UC-RSK-11", "title": "Responsibility for privacy assigned", "domain": "RSK", "theme": "Organizational", "goal": "The organization assigns and records responsibility for privacy and the protection of personal data.", "owner": "Data Protection Officer", "imp": "critical", "origin": "iso", "note": "Split from UC-RSK-08 in round 2 so it has its own test.", "statement": "Responsibility for privacy and personal data protection is assigned and recorded. The assignment is made in a document the organization maintains and is kept current as roles change. The record of the assignment is the proof.", "why": "When nobody is accountable for privacy, obligations are missed and incidents have no one to act on them.", "how": "Ask who is accountable for privacy and where that is written down. Check the record is current. Example probe: \"Where is it recorded who answers for the protection of personal data?\"", "q": "Does your organization have a recorded assignment of responsibility for privacy and personal data protection?", "evidence": "Privacy policy; record of the assignment of privacy responsibility; roles and responsibilities document. Cover the current period.", "good": "Responsibility for privacy is stated in a maintained document and is current. Its scope covers all personal data processing in the program.", "test": "Obtain the privacy policy and the roles and responsibilities record. Check that responsibility for privacy and personal data protection is assigned and recorded, and that the record is current. Pass if the assignment is documented, covers the program scope and has been reviewed or confirmed in the current period.", "risk": "No one answers for personal data protection, so privacy duties go unmet.", "applies": "Applies if the organization processes personal data.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.34", "ref": "Annex A.5.34", "atom": "ISO.A5.34-b", "text": "Assign a person or role responsible for privacy and personal data protection.", "match": "equal", "cov": "full", "reason": "Same ask: responsibility for privacy assigned.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-RSK-08 (D11). Responsibility for privacy assigned."}, {"id": "UC-RSK-40", "title": "Risk appetite, tolerance and response direction", "domain": "RSK", "theme": "", "goal": "Top management sets and communicates the amount of risk the organization will accept, turns it into measurable limits, defines the response options and the criteria for choosing among them, and treats opportunities as a category of risk.", "owner": "Risk and Compliance Manager", "imp": "high", "origin": "nist", "note": "NIST-only. Strategic direction above the per-risk treatment decision.", "statement": "Top management approves a risk appetite statement, and it is turned into measurable tolerance limits, such as a maximum acceptable downtime or highest acceptable residual rating. The risk response options of accept, mitigate, transfer and avoid are defined, with criteria for choosing among them, including when outsourcing or cloud arrangements are acceptable. The risk method treats opportunities, the upside of risk, as a category alongside threats, and identified opportunities are recorded in risk decisions. All of this is communicated to risk owners and reviewed on a defined cycle. Proof is the approved statement, its version history and distribution records.", "why": "Without stated limits, risk owners accept or reject risk by personal judgment and top management cannot tell whether exposure is within what it intended to carry.", "how": "Ask for the appetite statement and look for limits a risk owner could measure against. Then ask how risk owners were told. Example probe: \"What is the highest residual risk rating you will accept, who set it, and how does a risk owner know it?\"", "q": "Does your organization have risk appetite and tolerance limits, approved by top management, that risk owners use to choose how to respond to risk?", "evidence": "Approved risk appetite statement; risk tolerance statements with measurable limits; risk response criteria including acceptance and shared-responsibility conditions; distribution or briefing records for risk owners; version history showing the last review", "good": "Top management has approved an appetite statement. Tolerance limits are measurable. The response options and the criteria for choosing among them are written, including conditions for outsourced and cloud arrangements. Opportunities are a named category in the method and appear in risk decisions. Risk owners received the statements and the statements carry a dated review.", "test": "Obtain the appetite and tolerance statements and the response criteria. Check top management approval, at least one measurable limit, response options with criteria for choosing among them including conditions for outsourced and cloud arrangements, opportunities named as a category in the method, and a review date within the organization's cycle. Sample three recent risk decisions and check identified opportunities are recorded in them. Sample three risk owners and check each received the statements. Pass if all checks hold.", "risk": "Risk is accepted inconsistently and exposure grows beyond what top management would knowingly choose.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.RM.02", "ref": "GV.RM-02", "atom": "NIST.GV.RM.02-a", "text": "Leadership approves a cybersecurity risk appetite statement.", "match": "equal", "cov": "full", "reason": "No base control holds a leadership-approved risk appetite statement.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.02", "ref": "GV.RM-02", "atom": "NIST.GV.RM.02-b", "text": "The organization turns appetite into measurable risk tolerance limits.", "match": "equal", "cov": "full", "reason": "Turning appetite into measurable tolerance limits is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.02", "ref": "GV.RM-02", "atom": "NIST.GV.RM.02-c", "text": "The organization communicates appetite and tolerance to risk owners and reviews them on a set cycle.", "match": "equal", "cov": "full", "reason": "Communicating and reviewing appetite and tolerance is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.04", "ref": "GV.RM-04", "atom": "NIST.GV.RM.04-a", "text": "The organization defines the available risk response options and when each is appropriate.", "match": "equal", "cov": "full", "reason": "Defining the available response options and when each fits is strategic direction held by the slot.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.04", "ref": "GV.RM-04", "atom": "NIST.GV.RM.04-b", "text": "The organization sets criteria for accepting or avoiding risk and for acceptable shared-responsibility arrangements.", "match": "equal", "cov": "full", "reason": "Criteria for accepting or avoiding risk and for shared-responsibility arrangements are slot content.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.07", "ref": "GV.RM-07", "atom": "NIST.GV.RM.07-a", "text": "The risk methodology treats opportunities (positive risks) as a category alongside threats.", "match": "req_smaller", "cov": "full", "reason": "The risk method names opportunities as a category alongside threats.", "primary": true, "rem": "UC-GOV-10", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.07", "ref": "GV.RM-07", "atom": "NIST.GV.RM.07-b", "text": "The organization records and discusses identified opportunities in its risk discussions.", "match": "req_smaller", "cov": "full", "reason": "Identified opportunities are recorded and discussed in risk decisions.", "primary": false, "rem": "UC-GOV-10", "imm": ""}], "nrec": 3, "r2": "D09 and D17: now treats opportunities as a risk category and carries that NIST record; 'leadership' became 'top management'."}, {"id": "UC-RSK-41", "title": "Security and supplier risk in enterprise risk management", "domain": "RSK", "theme": "", "goal": "The organization includes cybersecurity and supply chain risks in its enterprise risk process, register and method, and reports them to top management.", "owner": "Risk and Compliance Manager", "imp": "high", "origin": "nist", "note": "NIST-only. Split in round 2: escalation criteria and channels moved to UC-RSK-44.", "statement": "Cybersecurity and supply chain risks sit in the same enterprise risk process and register as other enterprise risks. The risk assessment method explicitly covers supplier risk, and supply chain security practices are part of the wider risk program. Enterprise risk reports to top management include these risks. Proof is the register, the method and the latest risk report.", "why": "Security and supplier risks held in a separate list are never weighed against other business risks, and top management never sees them.", "how": "Ask where cybersecurity and supplier risks are recorded, which method scores them, and whether they appear in the regular risk report. Example probe: \"Show me where a supplier risk sits in the enterprise risk register and where it appears in the latest report to top management.\"", "q": "Does your organization manage security and supplier risks in its enterprise risk register?", "evidence": "Enterprise risk register extract showing cybersecurity and supplier risks; risk assessment method covering supplier risk; risk management program description showing supply chain security as part of it; latest enterprise risk report to top management; covering the audit period.", "good": "Cybersecurity and supplier risks share one register and one method with other enterprise risks, and the method names supplier risk. Supply chain security is part of the wider risk program. The latest risk report to top management includes these risks.", "test": "Obtain the enterprise risk register, the risk assessment method and the latest enterprise risk report to top management for the period. Check cybersecurity risks and supplier risks are in the same register as other enterprise risks and appear in the report. Check the method explicitly covers supply chain risk and the risk program references supply chain security practices. Pass if all hold.", "risk": "Security and supplier risks stay outside the enterprise risk view and are never traded off against other business risks.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.RM.03", "ref": "GV.RM-03", "atom": "NIST.GV.RM.03-a", "text": "The organization includes cybersecurity risks in its enterprise risk management process and register.", "match": "equal", "cov": "full", "reason": "No base control places cybersecurity risks inside the enterprise risk process.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.03", "ref": "GV.RM-03", "atom": "NIST.GV.RM.03-c", "text": "Enterprise risk reporting to leadership covers cybersecurity risks.", "match": "equal", "cov": "full", "reason": "Enterprise risk reporting that includes cybersecurity risk is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.03", "ref": "GV.SC-03", "atom": "NIST.GV.SC.03-a", "text": "The organization records supplier risks in the same risk process and register as other cybersecurity risks.", "match": "equal", "cov": "full", "reason": "Putting supplier risks in the same enterprise risk process is in the slot's goal.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.03", "ref": "GV.SC-03", "atom": "NIST.GV.SC.03-b", "text": "The risk assessment method explicitly covers supply chain risk.", "match": "equal", "cov": "full", "reason": "Having the risk assessment method cover supply chain risk is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.09", "ref": "GV.SC-09", "atom": "NIST.GV.SC.09-a", "text": "Supply chain security practices are part of the cybersecurity and enterprise risk programs.", "match": "equal", "cov": "full", "reason": "Supply chain practices being part of the enterprise and cyber risk program is in the slot's goal.", "primary": true, "rem": "", "imm": ""}], "nrec": 3, "r2": "Split (D11): narrowed to cyber and supplier risk in the enterprise risk process ('top management', D17); the other half is now UC-RSK-44."}, {"id": "UC-RSK-42", "title": "Policy exceptions and time-limited risk acceptance", "domain": "RSK", "theme": "", "goal": "The organization approves departures from policy through a defined exception process, limits each by an expiry or review date, and keeps a register of them.", "owner": "Risk and Compliance Manager", "imp": "high", "origin": "nist", "note": "NIST-only. Policy exceptions only; policy violations map to UC-RSK-10 (round 2 atom split).", "statement": "Departures from policy are approved through a defined exception process. Each exception needs a recorded approval and an expiry or review date. An exception register holds each open exception with who is accountable for it and its review date, and each exception is recorded with how it was handled. Proof is the register and the approval records.", "why": "Open-ended waivers turn into permanent unmanaged risk, and nobody can show which departures from policy were approved or why.", "how": "Ask for the exception register and look for open items without an accountable party or a date. Ask what happens when an exception expires. Example probe: \"Show me an exception that expired in the last year. Who reviewed it and what was decided?\"", "q": "Does your organization approve departures from policy through a defined exception process with an expiry or review date for each?", "evidence": "Exception procedure; exception register with accountable parties, approvals, review dates and how each exception was handled; covering the audit period.", "good": "Every exception has a recorded approval, someone accountable for it and an expiry or review date. Expired exceptions are closed or re-approved, and the register shows how each was handled. No exception is open-ended.", "test": "Obtain the exception procedure and the exception register for the period. Sample five open and closed exceptions and check each has a recorded approval, a recorded accountable party, an expiry or review date and a note of how it was handled. Pass if every sampled exception meets all four and none is open-ended.", "risk": "Policy waivers accumulate with no end date, so known weaknesses persist and cannot be defended to an auditor.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.PO.01", "ref": "GV.PO-01", "atom": "NIST.GV.PO.01-d1", "text": "The organization records exceptions to the policy and how each was handled.", "match": "req_smaller", "cov": "full", "reason": "Recording each policy exception and how it was handled is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.07", "ref": "ID.RA-07", "atom": "NIST.ID.RA.07-b", "text": "The organization runs an exception process for departures from policy, with approval and an expiry or review date.", "match": "equal", "cov": "full", "reason": "The slot's goal is an approved, time-limited exception process.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.07", "ref": "ID.RA-07", "atom": "NIST.ID.RA.07-c", "text": "The organization keeps an exception register with an owner and a review date for each open exception.", "match": "equal", "cov": "full", "reason": "An exception register with owner and review date is the slot's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "Policy exceptions only (D11): the violations half of the source ask moved to UC-RSK-10."}, {"id": "UC-RSK-43", "title": "Threat identification and register", "domain": "RSK", "theme": "", "goal": "The organization identifies internal and external threats, including insiders, records them in a register and keeps that register current from threat information.", "owner": "Risk and Compliance Manager", "imp": "medium", "origin": "nist", "note": "NIST-only. Threat side of risk assessment.", "statement": "The risk method requires internal and external threats, including insiders, to be identified. Identified threats are recorded in a threat register, or in the risk register, and the entries are updated from threat intelligence on a defined cycle. Proof is the method, the register and its version history.", "why": "Risk ratings built on an outdated or incomplete threat picture understate exposure to the attacks actually in play.", "how": "Ask for the threat register and how it is updated. Look for insider threats and recent changes. Example probe: \"Which threats were added or changed after your last threat intelligence review, and where did that information come from?\"", "q": "Does your organization keep a current register of internal and external threats, including insiders?", "evidence": "Risk assessment method requiring threat identification; threat register or risk register with internal, insider and external threats; version history showing updates from threat intelligence; covering the audit period", "good": "The method requires threats to be identified. The register lists internal, insider and external threats. Entries were updated in the period from named intelligence sources.", "test": "Obtain the method, the register and its version history. Check the method requires threat identification and the register lists internal and external threats including insiders. Sample three entries and check at least one update in the period cites threat intelligence. Pass if all hold.", "risk": "New attack methods go unrecognized, so risk assessments miss the threats most likely to occur.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.ID.RA.03", "ref": "ID.RA-03", "atom": "NIST.ID.RA.03-a", "text": "The risk assessment method requires internal and external threats, including insiders, to be identified.", "match": "equal", "cov": "full", "reason": "The slot requires internal (including insider) and external threats to be identified; the method for ranking risk does not.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.03", "ref": "ID.RA-03", "atom": "NIST.ID.RA.03-b", "text": "The organization records identified threats in a register and updates them using threat intelligence.", "match": "equal", "cov": "full", "reason": "Keeping a threat register current from intelligence is in the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RSK-44", "title": "Risk escalation criteria and channels", "domain": "RSK", "theme": "", "goal": "The organization sets written criteria and defined channels for escalating security and supplier risks, and routes risks that meet them.", "owner": "Risk and Compliance Manager", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-RSK-41 in round 2 so it has its own test.", "statement": "Written criteria set when a cybersecurity risk is escalated into enterprise risk management. Defined channels exist for raising and escalating security risk across the organization, and they cover risk that starts with suppliers and other third parties. Risks that meet the threshold are routed through those channels, and material supply chain risks reach top management. Proof is the criteria, the channel description and escalation records.", "why": "Without written criteria and working channels, serious security and supplier risks stay with whoever noticed them and never reach those who can decide.", "how": "Ask for the written escalation criteria and the channel description, then ask for a real case. Check the channels cover suppliers. Example probe: \"Walk me through the last supplier risk that met the escalation threshold and who received it.\"", "q": "Does your organization define channels and criteria for escalating security risks, including supplier risks?", "evidence": "Risk escalation criteria; description of escalation channels including supplier risk; escalation records showing the recipient; records of material supply chain risks reaching top management; covering the audit period.", "good": "Escalation criteria are written and say when a risk moves into enterprise risk management. Channels are documented from staff upward and explicitly cover supplier and third-party risk. At least one risk in the period was escalated through a channel and reached the intended recipient, including a material supply chain risk.", "test": "Obtain the escalation criteria, the channel description and the escalation records for the period. Check the criteria state when a risk is escalated and the channels cover supplier and third-party risk. Sample three risks that met the threshold and check each was routed through a defined channel and reached the intended recipient. Check a material supply chain risk was escalated to top management in the period. Pass if all hold.", "risk": "Material security and supplier risks are never escalated, so decisions about them are made too low or not at all.", "applies": "", "type": "detective", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.RM.03", "ref": "GV.RM-03", "atom": "NIST.GV.RM.03-b", "text": "The organization sets criteria for escalating a cybersecurity risk into enterprise risk management.", "match": "equal", "cov": "full", "reason": "Setting escalation criteria is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.05", "ref": "GV.RM-05", "atom": "NIST.GV.RM.05-a", "text": "The organization defines channels for raising and escalating cybersecurity risk across the organization.", "match": "equal", "cov": "full", "reason": "Same ask: defined channels for raising and escalating risk.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.05", "ref": "GV.RM-05", "atom": "NIST.GV.RM.05-b", "text": "The escalation channels cover risk that originates with suppliers and other third parties.", "match": "equal", "cov": "full", "reason": "The channels cover risk from suppliers and other third parties.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.05", "ref": "GV.RM-05", "atom": "NIST.GV.RM.05-c", "text": "Risks that meet the escalation threshold are actually routed through those channels.", "match": "equal", "cov": "full", "reason": "Routing risks that meet the threshold through the channels is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.03", "ref": "GV.SC-03", "atom": "NIST.GV.SC.03-c", "text": "Material supply chain risks are escalated to senior management or enterprise risk reporting.", "match": "equal", "cov": "full", "reason": "Escalating material supply chain risks is the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": "New: split from UC-RSK-41 (D11). Risk escalation criteria and channels."}, {"id": "UC-AST-01", "title": "Asset inventory", "domain": "AST", "theme": "Organizational", "goal": "The organization keeps a current inventory of information and associated assets, including software, services and systems, each with an assigned owner.", "owner": "Head of IT Operations", "imp": "high", "origin": "iso", "note": "", "statement": "An inventory of information and associated assets, including hardware, software, systems, services such as cloud services, and data stores, is kept with a named owner for every entry. The data types that must be inventoried, such as personal, health, payment or proprietary data, are defined. For information, the inventory also records where it is held and its classification. It is updated whenever assets are added, changed or retired, and reconciled with live sources such as the cloud console and the device management tool on a defined cycle. The inventory and the reconciliation records are the proof.", "why": "Assets nobody knows about are never patched, monitored or protected, and unowned assets have no one to answer for them. The inventory is also the base for most other controls.", "how": "Ask to see the inventory itself, not the policy about it. Check that it covers cloud and software as well as laptops, and that owners are people. Pick a few live assets and look for them in the list. Example probe: \"Show me a cloud resource created last month and where it appears in the inventory.\"", "q": "Does your organization keep a current inventory of information and associated assets, with an owner assigned to each one?", "evidence": "Asset inventory export with owner column; the inventory update procedure; cloud console or device management export used for reconciliation; most recent reconciliation record. Cover the audit period.", "good": "The inventory covers hardware, software, systems, services and data stores in scope. The data types to be inventoried are defined. Information entries record location and classification. Every entry has a named owner. A recent reconciliation shows live assets match the list and gaps were fixed.", "test": "Sample live assets from the cloud console or device management tool and look each one up in the inventory. Check that every sampled entry has an owner, that the data types to be inventoried are defined, that sampled information entries record location and classification, and that the inventory was updated within its defined review cycle. Pass if all sampled live assets are listed with an owner, the data types are defined and the update is on time.", "risk": "Unknown or unowned assets go unpatched and unmonitored, and incidents cannot be traced to a responsible person.", "applies": "", "type": "detective", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.9", "ref": "Annex A.5.9", "atom": "ISO.A5.9-a", "text": "Maintain an inventory of information and associated assets in scope.", "match": "equal", "cov": "full", "reason": "Same ask: a current asset inventory.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.9", "ref": "Annex A.5.9", "atom": "ISO.A5.9-b", "text": "Assign an owner to every inventory entry.", "match": "equal", "cov": "full", "reason": "Owner assignment is part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.9", "ref": "Annex A.5.9", "atom": "ISO.A5.9-c", "text": "Keep the inventory updated and matching live assets.", "match": "equal", "cov": "full", "reason": "Currency of the inventory is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.01", "ref": "ID.AM-01", "atom": "NIST.ID.AM.01-a", "text": "The organization maintains an inventory of the hardware it manages.", "match": "equal", "cov": "full", "reason": "An inventory of assets is the same ask for hardware.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.01", "ref": "ID.AM-01", "atom": "NIST.ID.AM.01-b", "text": "Each hardware entry has an owner.", "match": "equal", "cov": "full", "reason": "Each asset having an assigned owner is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.01", "ref": "ID.AM-01", "atom": "NIST.ID.AM.01-c", "text": "The organization keeps the hardware inventory complete and current.", "match": "req_smaller", "cov": "full", "reason": "A current inventory is the control's own standard, and completeness is how it is tested.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.02", "ref": "ID.AM-02", "atom": "NIST.ID.AM.02-a", "text": "The organization maintains an inventory of software and services, including SaaS, cloud, APIs and in-house applications.", "match": "req_smaller", "cov": "full", "reason": "The inventory of information and associated assets includes software, services and applications.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.02", "ref": "ID.AM-02", "atom": "NIST.ID.AM.02-b", "text": "The organization maintains an inven
