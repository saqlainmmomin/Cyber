tory of its systems.", "match": "req_smaller", "cov": "full", "reason": "Systems are associated assets within the same inventory.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.02", "ref": "ID.AM-02", "atom": "NIST.ID.AM.02-c", "text": "The organization keeps the software inventory complete and current.", "match": "req_smaller", "cov": "full", "reason": "A current inventory is the control's own standard, tested against software found in use.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.07", "ref": "ID.AM-07", "atom": "NIST.ID.AM.07-a", "text": "The organization defines which data types it designates for inventory, such as personal, health, payment or proprietary data.", "match": "req_smaller", "cov": "full", "reason": "The inventory of information assets starts from deciding which data types are in scope.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.07", "ref": "ID.AM-07", "atom": "NIST.ID.AM.07-b", "text": "The data inventory records where each designated data type is held, who owns it and its classification.", "match": "req_smaller", "cov": "full", "reason": "Inventory of information with assigned owner, extended with location and classification fields, is the control's data entry.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.07", "ref": "ID.AM-07", "atom": "NIST.ID.AM.07-d", "text": "The organization keeps the data inventory current.", "match": "req_smaller", "cov": "full", "reason": "A current inventory is the control's own standard.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": "Wording (D08): covers software, services and systems, and records location and classification for information."}, {"id": "UC-AST-02", "title": "Acceptable use rules acknowledged", "domain": "AST", "theme": "Organizational", "goal": "The organization sets rules for acceptable and prohibited use of its information and assets, tells users their use is monitored, and has users acknowledge the rules.", "owner": "Data Governance Lead", "imp": "medium", "origin": "iso", "note": "Split in round 2: handling rules by classification level moved to UC-AST-13.", "statement": "Written rules state what use of information and assets is permitted and prohibited, and that use of the organization's systems is monitored. Users acknowledge the rules when they join and again on a defined cycle. Signed acknowledgement records are the proof.", "why": "Without written rules, staff cannot be held to a standard and misuse is hard to act on. Acknowledgements show users were told the rules, including that their use is monitored.", "how": "Ask for the acceptable use policy, then ask how staff accept it and how often. Check the policy says use is monitored. Example probe: \"How do you know a contractor who joined in the spring has accepted the acceptable use rules?\"", "q": "Does your organization set rules for acceptable use of its information and assets that users acknowledge?", "evidence": "Acceptable use policy; user acknowledgement records or onboarding sign-offs; the policy approval record. Cover the last two review cycles.", "good": "A policy states permitted and prohibited uses and that use of systems is monitored. Acknowledgements exist for current staff and new joiners, and are repeated on the defined cycle.", "test": "Read the policy for permitted uses, prohibited uses and a statement that use is monitored. Sample current users and new joiners from the last review cycle and check each has a recorded acknowledgement. Pass if the policy has all three points and every sampled user has acknowledged the current version.", "risk": "Staff misuse information and assets with no agreed standard to enforce, and cannot be said to have been told their use is monitored.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.10", "ref": "Annex A.5.10", "atom": "ISO.A5.10-a", "text": "Set rules for acceptable and prohibited use of information and assets.", "match": "equal", "cov": "full", "reason": "Acceptable-use rules are the first element of the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.10", "ref": "Annex A.5.10", "atom": "ISO.A5.10-c", "text": "Have users acknowledge the rules.", "match": "equal", "cov": "full", "reason": "Acknowledgement is stated in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.03", "ref": "DE.CM-03", "atom": "NIST.DE.CM.03-c", "text": "The organization tells personnel that their use of its systems is monitored.", "match": "req_smaller", "cov": "full", "reason": "Acceptable use rules communicated and acknowledged by users cover telling them use is monitored.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "Split (D11): narrowed to acceptable use rules acknowledged, which now state that use is monitored (D09); the other half is now UC-AST-13."}, {"id": "UC-AST-03", "title": "Return of assets", "domain": "AST", "theme": "Organizational", "goal": "Personnel and external parties return all organizational assets when they leave or change role, contract or agreement.", "owner": "Head of IT Operations", "imp": "medium", "origin": "iso", "note": "", "statement": "All organizational assets, such as devices, badges, tokens and documents, are returned by personnel and external parties when they leave or change role, contract or agreement. The leaver or role-change checklist requires return and checks each returned item against the asset inventory. Completed checklists are the proof.", "why": "Unreturned laptops, tokens and badges leave data and access in the hands of people who no longer have a right to them.", "how": "Ask how a leaver's equipment is collected and who signs it off. Ask for completed checklists, not the template. Example probe: \"Take the last contractor who left. Which items did they hold and where is the record that each came back?\"", "q": "Does your organization make sure personnel and external parties return all organizational assets when they leave or change role, contract or agreement?", "evidence": "Leaver and role-change procedure with asset return step; completed leaver checklists; asset inventory entries updated on return; list of leavers for the period. Cover the audit period.", "good": "The procedure requires return of all asset types, including for contractors. Each checklist shows items returned and matched to the inventory. Missing items are chased and recorded.", "test": "Sample leavers and role changes from the audit period and open each completed checklist. Check that every asset recorded against the person in the inventory is shown as returned or accounted for. Pass if all sampled leavers have a completed checklist reconciled to the inventory.", "risk": "Departing people keep devices, tokens and documents, exposing data and access after they leave.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.11", "ref": "Annex A.5.11", "atom": "ISO.A5.11-a", "text": "Require return of all organizational assets on leaving or on change of role, contract or agreement.", "match": "equal", "cov": "full", "reason": "Same ask: assets come back on exit or change.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.11", "ref": "Annex A.5.11", "atom": "ISO.A5.11-b", "text": "Check returned assets against the inventory.", "match": "equal", "cov": "full", "reason": "The control is tested by sampling leavers against the inventory.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-AST-04", "title": "Information classification", "domain": "AST", "theme": "Organizational", "goal": "The organization classifies information by its confidentiality, integrity, availability and stakeholder needs, using a defined scheme.", "owner": "Data Governance Lead", "imp": "high", "origin": "iso", "note": "", "statement": "An information classification scheme sets levels and criteria for assigning them, based on confidentiality, integrity, availability and stakeholder needs. A level is assigned to each information asset in the inventory and reviewed when use or sensitivity changes. The scheme and the classified inventory are the proof.", "why": "Without classification, protection is applied evenly or by guesswork, so sensitive data is under-protected or everything is over-protected at high cost.", "how": "Ask for the scheme and then the inventory with the classification column filled in. Check that the criteria let two people reach the same level. Example probe: \"Which level would customer contracts get, and who decided?\"", "q": "Does your organization classify information by its confidentiality, integrity, availability and stakeholder needs using a defined scheme?", "evidence": "Information classification scheme with level definitions and criteria; asset inventory showing classification per asset; classification review records. Cover the audit period.", "good": "The scheme defines levels with clear criteria that weigh secrecy, accuracy and uptime and stakeholder needs. Information assets in the inventory carry a level. Owners review levels when things change.", "test": "Read the scheme for levels and assignment criteria covering confidentiality, integrity, availability and stakeholder needs. Sample information assets in the inventory and check each has a classification consistent with the criteria. Pass if the scheme is approved and all sampled assets are classified.", "risk": "Sensitive information is not recognized, so it gets the same weak protection as public data.", "applies": "", "type": "preventive", "freq": "ad_hoc", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.12", "ref": "Annex A.5.12", "atom": "ISO.A5.12-a", "text": "Define classification levels and the criteria for assigning them.", "match": "equal", "cov": "full", "reason": "The scheme with levels and criteria is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.12", "ref": "Annex A.5.12", "atom": "ISO.A5.12-b", "text": "Assign a classification to information assets.", "match": "equal", "cov": "full", "reason": "Applying the scheme is part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.05", "ref": "ID.AM-05", "atom": "NIST.ID.AM.05-a", "text": "The organization defines criteria for prioritizing assets by classification, criticality, resources and mission impact.", "match": "req_bigger", "cov": "partial", "reason": "Control ranks by classification only; criticality, resources and mission impact are left.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.07", "ref": "ID.AM-07", "atom": "NIST.ID.AM.07-c", "text": "The organization maintains a classification scheme and labels designated data accordingly.", "match": "req_smaller", "cov": "full", "reason": "Keeping the classification scheme is the control; labeling is carried by UC-AST-05.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": "Gained a mapped ask (D09): the classification-scheme half of a NIST data classification ask. Text unchanged."}, {"id": "UC-AST-05", "title": "Information labeling", "domain": "AST", "theme": "Organizational", "goal": "The organization labels information in line with its classification scheme.", "owner": "Data Governance Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "The marking for each classification level on documents, systems and media is defined, and labels are applied as the procedure requires, supported by tool settings where available. The labelling procedure and a sample of labelled items are the proof.", "why": "Labels tell people and tools how to handle information. Without them, the classification scheme exists only on paper.", "how": "Ask for the labelling procedure, then ask to see real labelled documents and the tool settings that apply labels. Example probe: \"Open a confidential document from last month. Where is the label and was it applied by a person or automatically?\"", "q": "Does your organization label information in line with its classification scheme?", "evidence": "Labelling procedure; classification scheme with marking rules; sample labelled documents, systems and media; sensitivity label or tagging tool configuration export. Cover the audit period.", "good": "The procedure states the marking for each level on documents, systems and media. Tools apply or prompt for labels. Sampled items carry labels that match the procedure.", "test": "Sample documents, records and media from the audit period and check each carries the label the procedure requires for its level. Review the labelling tool configuration. Pass if all sampled items are labelled as the procedure states.", "risk": "Staff cannot tell how sensitive an item is, so it is shared or stored incorrectly.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.13", "ref": "Annex A.5.13", "atom": "ISO.A5.13-a", "text": "Define how each classification level is marked, consistent with the scheme.", "match": "equal", "cov": "full", "reason": "Same ask: a labelling procedure tied to the scheme.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.13", "ref": "Annex A.5.13", "atom": "ISO.A5.13-b", "text": "Apply labels to documents, systems and media as the procedure requires.", "match": "equal", "cov": "full", "reason": "Labels in practice are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.07", "ref": "ID.AM-07", "atom": "NIST.ID.AM.07-c", "text": "The organization maintains a classification scheme and labels designated data accordingly.", "match": "req_smaller", "cov": "full", "reason": "Labeling data in line with the scheme is the control; the scheme itself is carried by UC-AST-04.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-AST-06", "title": "Information transfer", "domain": "AST", "theme": "Organizational", "goal": "The organization sets rules, agreements and technical settings for every channel used to transfer information, matched to its sensitivity.", "owner": "Data Governance Lead", "imp": "high", "origin": "iso", "note": "", "statement": "Rules for every channel used to transfer information, such as email, file sharing, removable media, courier and verbal, are set, stating the protection each sensitivity level needs. Transfers with external parties are covered by agreements with security terms, and technical settings on the main channels enforce the rules. Rules, agreements and configuration exports are the proof.", "why": "Information leaks most often in transit or when handed to a third party. Rules with no technical enforcement or agreements rely on goodwill.", "how": "Ask which channels staff use to send sensitive information outside, then ask for the rule, the agreement and the setting for each main one. Example probe: \"How is a customer file sent to a supplier, and what stops someone sending it by personal email instead?\"", "q": "Does your organization set rules, agreements and technical settings for each channel used to transfer information, matched to its sensitivity?", "evidence": "Information transfer policy or procedure; sample agreements with external parties containing security terms; email transport protection and external sharing settings export; list of approved transfer channels. Cover the audit period.", "good": "Each channel in use has a rule linked to classification. External transfers sit under agreements with security terms. Settings on the main channels, such as encrypted mail transport and limits on external sharing, enforce the rules.", "test": "Read the transfer rules and check each channel in use is covered. Sample external parties and check each has an agreement with security terms. Inspect configuration exports for the main channels. Pass if all channels are covered, all sampled agreements have security terms and settings match the rules.", "risk": "Sensitive information is sent over unprotected channels or to third parties with no obligation to protect it.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.14", "ref": "Annex A.5.14", "atom": "ISO.A5.14-a", "text": "Set rules for each transfer channel used, stating the protection required.", "match": "equal", "cov": "full", "reason": "Per-channel rules are the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.14", "ref": "Annex A.5.14", "atom": "ISO.A5.14-b", "text": "Cover transfers with external parties by agreements containing security terms.", "match": "equal", "cov": "full", "reason": "Agreements for external transfer are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.14", "ref": "Annex A.5.14", "atom": "ISO.A5.14-c", "text": "Enforce the rules through technical settings on the main channels.", "match": "equal", "cov": "full", "reason": "Technical enforcement is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-AST-07", "title": "Records retention schedule", "domain": "AST", "theme": "Organizational", "goal": "The organization defines the types of records it keeps, how long each is kept and how each must be stored, based on legal and contractual needs.", "owner": "Data Governance Lead", "imp": "high", "origin": "iso", "note": "Split in round 2: protection of records moved to UC-AST-14.", "statement": "A records retention schedule defines record types, retention periods and storage requirements based on legal and contractual needs. Each period traces to the law or contract that drives it. The schedule is the proof.", "why": "Without a schedule, records are kept too briefly or too long, and the organization cannot show it met its legal and contractual duties.", "how": "Ask for the retention schedule and the register of legal and contractual requirements behind it. Pick two or three record types and ask what drives their period. Example probe: \"Why is this record type kept for that long, and where does it have to be stored?\"", "q": "Does your organization maintain a records retention schedule that sets periods and storage requirements for each record type?", "evidence": "Records retention schedule; compliance or legal register supporting the periods; the schedule approval record. Cover the last two review cycles.", "good": "The schedule lists record types, retention periods and storage requirements. Each period shows the legal or contractual basis, and the schedule is approved and current.", "test": "Read the schedule and the register of legal and contractual requirements. Sample record types and check each has a retention period, a storage requirement and a legal or contractual basis. Pass if every sampled record type is complete and traceable to its basis.", "risk": "Required records are discarded early or kept without need, leaving the organization unable to meet legal or contractual duties.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["dpdpa", "iso27001"], "sources": [{"fw": "dpdpa", "rec": "CH2.MINIMIZE.2", "ref": "Section 8(7)", "atom": "CH2.MINIMIZE.2-b", "text": "Retain personal data beyond that purpose only where a law requires it, and name the law.", "match": "overlap", "cov": "partial", "reason": "AST-07 keeps records for required periods but does not require naming the legal ground for keeping personal data.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-a", "text": "Maintain a documented retention schedule that sets a period or erasure trigger for each data category or purpose.", "match": "overlap", "cov": "partial", "reason": "AST-07 sets retention periods for records generally, not per personal data category or purpose.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-d", "text": "Check that retention and deletion settings on systems holding personal data match the schedule.", "match": "overlap", "cov": "partial", "reason": "AST-07 does not test that live system settings follow the retention schedule.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.33", "ref": "Annex A.5.33", "atom": "ISO.A5.33-a", "text": "Define record types, retention periods and storage requirements reflecting legal and contractual needs.", "match": "equal", "cov": "full", "reason": "The retention schedule is the control's design.", "primary": true, "rem": "", "imm": ""}], "nrec": 3, "r2": "Split (D11): narrowed to the records retention schedule; the other half is now UC-AST-14."}, {"id": "UC-AST-08", "title": "Information deletion", "domain": "AST", "theme": "Technological", "goal": "The organization deletes information from systems, devices and media when it is no longer needed, by a defined method, and keeps proof.", "owner": "Data Governance Lead", "imp": "high", "origin": "iso", "note": "", "statement": "The point at which information must be deleted from systems, devices and media once it is no longer needed, and the method of deletion, are defined. Information is deleted on that schedule, using automated jobs or manual steps, and deletion logs or supplier confirmations are kept as proof.", "why": "Information kept past its purpose adds breach exposure and legal risk. Deletion that is not proven cannot be relied on.", "how": "Ask for the deletion rule, then ask for the latest deletion log or job output. Include data held by suppliers. Example probe: \"Show me what was deleted last quarter and who confirmed a supplier deleted its copy.\"", "q": "Does your organization delete information that is no longer needed from systems, devices and media by a defined method with proof?", "evidence": "Retention and deletion procedure; deletion method standard; automated deletion job output and deletion logs; supplier deletion confirmations; the records retention schedule. Cover the audit period.", "good": "The procedure states triggers and methods for deletion across systems, devices and media. Logs or confirmations show deletions happened on schedule, including at suppliers.", "test": "Read the procedure for deletion triggers and methods. Sample items due for deletion in the audit period and trace each to a deletion log, job record or supplier confirmation. Pass if all sampled items were deleted on schedule with proof on file.", "risk": "Unneeded information accumulates, enlarging the impact of any breach and breaching retention duties.", "applies": "", "type": "corrective", "freq": "continuous", "ks": "", "fws": ["dpdpa", "iso27001"], "sources": [{"fw": "dpdpa", "rec": "CH2.MINIMIZE.2", "ref": "Section 8(7)", "atom": "CH2.MINIMIZE.2-a", "text": "Erase personal data once the purpose it was collected for is no longer served.", "match": "overlap", "cov": "partial", "reason": "AST-08 deletes data no longer needed by a defined method, but does not set purpose-end and withdrawal triggers or processor erasure.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-b", "text": "Run systematic or automated procedures that erase personal data when the purpose ends or consent is withdrawn.", "match": "overlap", "cov": "partial", "reason": "AST-08 defines deletion method and proof; it lacks the automatic trigger on purpose end or withdrawal.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.CORRECT.2", "ref": "Section 12(3)", "atom": "CH3.CORRECT.2-b", "text": "Erase the data on request unless retention is necessary for the specified purpose or to comply with law.", "match": "overlap", "cov": "partial", "reason": "AST-08 performs deletion but does not link it to a person's request or processor erasure.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.10", "ref": "Annex A.8.10", "atom": "ISO.A8.10-a", "text": "Define when information must be deleted from systems, devices and media and by what method.", "match": "equal", "cov": "full", "reason": "Same ask: a deletion rule and method.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.10", "ref": "Annex A.8.10", "atom": "ISO.A8.10-b", "text": "Delete information on schedule and keep records, such as deletion logs.", "match": "equal", "cov": "full", "reason": "Records of deletion are in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-AST-09", "title": "Data masking", "domain": "AST", "theme": "Technological", "goal": "The organization masks, pseudonymizes or anonymizes data where its rules and applicable law require.", "owner": "Data Governance Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "The data that must be masked, pseudonymized or anonymized, the contexts in which this applies and the technique to use are defined. Masking is applied in non-production environments, support screens and reports as the standard requires. The standard and samples of masked data are the proof.", "why": "Real personal or sensitive data in test environments and support tools is widely exposed to people who do not need it.", "how": "Ask which data is masked and where. Ask to see a test dataset and a support screen. Example probe: \"Show me a record in the test system and tell me whether the names and ID numbers are real.\"", "q": "Does your organization mask, pseudonymize or anonymize data where its rules and applicable law require?", "evidence": "Data masking standard or policy; list of masked data types and contexts; sample non-production datasets; screenshots of support screens and reports; masking tool configuration. Cover the audit period.", "good": "The standard names data types, contexts and techniques. Non-production data, support screens and reports show masking applied as required.", "test": "Read the standard for data types, contexts and techniques. Sample non-production datasets, support screens and reports and check masking is applied as stated. Pass if all sampled items show masking that matches the standard.", "risk": "Sensitive data is exposed to developers, testers and support staff who do not need it.", "applies": "Applies if the organization holds personal or other sensitive data in non-production environments, support tools or reports.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.11", "ref": "Annex A.8.11", "atom": "ISO.A8.11-a", "text": "Define which data must be masked, pseudonymized or anonymized and in which contexts.", "match": "equal", "cov": "full", "reason": "Same ask: masking rules.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.11", "ref": "Annex A.8.11", "atom": "ISO.A8.11-b", "text": "Apply masking as the rules require in non-production, support screens and reports.", "match": "equal", "cov": "full", "reason": "Applied masking is the control's proof.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-AST-10", "title": "Data leakage prevention", "domain": "AST", "theme": "Technological", "goal": "The organization finds the sensitive information that could leak and the channels it could leak through, applies preventive measures to them and acts on alerts.", "owner": "Security Engineering Lead", "imp": "high", "origin": "iso", "note": "", "statement": "The sensitive information that could leak and the channels it could leak through, such as email, uploads, removable media and printing, are identified. Leakage prevention measures are configured on those channels, and alerts are reviewed and acted on. Configuration exports and the alert review log are the proof.", "why": "Policy alone does not stop a user sending sensitive files out. Alerts nobody reads give a false sense of control.", "how": "Ask what sensitive data is covered and which channels are monitored or blocked. Then ask for the alert queue and what was done with the last alerts. Example probe: \"Walk me through the last leakage alert, who looked at it and what happened next.\"", "q": "Does your organization prevent sensitive information from leaking through the channels it could leak through, acting on alerts?", "evidence": "List of sensitive information and leakage channels; leakage prevention rule and endpoint configuration export; upload and removable media blocking settings; alert log with review and action records; related incident records. Cover the audit period.", "good": "The sensitive data and channels are documented. Prevention rules are active on those channels. Alerts are reviewed on a regular basis and lead to recorded actions.", "test": "Compare the list of channels with the configuration export and check prevention is set on each. Sample alerts from the audit period and check each was reviewed and acted on. Pass if all identified channels are covered and all sampled alerts have a recorded review.", "risk": "Sensitive information leaves the organization unnoticed through unmonitored channels.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.12", "ref": "Annex A.8.12", "atom": "ISO.A8.12-a", "text": "Identify the sensitive information to protect and the channels it could leak through.", "match": "equal", "cov": "full", "reason": "Identification is the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.12", "ref": "Annex A.8.12", "atom": "ISO.A8.12-b", "text": "Configure leakage prevention measures on those channels.", "match": "equal", "cov": "full", "reason": "Preventive measures are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.12", "ref": "Annex A.8.12", "atom": "ISO.A8.12-c", "text": "Review and act on leakage alerts.", "match": "equal", "cov": "full", "reason": "Acting on alerts is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.02", "ref": "PR.DS-02", "atom": "NIST.PR.DS.02-b", "text": "The organization blocks sensitive data from leaving through email or personal services.", "match": "equal", "cov": "full", "reason": "Preventing sensitive information leaving through channels is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-AST-11", "title": "Storage media management", "domain": "AST", "theme": "Physical", "goal": "The organization manages storage media through acquisition, use, transport and disposal in line with classification and handling rules.", "owner": "Head of IT Operations", "imp": "high", "origin": "iso", "note": "Disposal records for media are also mapped to AST-12.", "statement": "Storage media are managed through acquisition, use, transport, storage and disposal according to classification and handling rules. Technical controls restrict or encrypt removable media on endpoints as the procedure requires. The media handling procedure and endpoint policy settings are the proof.", "why": "Unencrypted USB drives and tapes are easily lost or stolen and carry data with them.", "how": "Ask for the media procedure, then ask what happens when someone plugs in a USB drive. Example probe: \"Insert a personal USB drive on a standard laptop. What does the device do?\"", "q": "Does your organization manage storage media from acquisition to disposal in line with classification and handling rules?", "evidence": "Media handling procedure; endpoint policy export for removable media; list of approved media and transport rules; media register. Cover the audit period.", "good": "The procedure covers each media stage and classification. Endpoint settings block or encrypt removable media. Media in use is tracked.", "test": "Read the procedure for coverage of each media stage by classification. Inspect endpoint policy settings for removable media and test a sample of endpoints. Pass if the procedure covers all stages and all sampled endpoints restrict or encrypt removable media as stated.", "risk": "Data on lost or stolen media is exposed because media was neither tracked nor protected.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.10", "ref": "Annex A.7.10", "atom": "ISO.A7.10-a", "text": "Define how storage media are acquired, used, transported and stored according to classification.", "match": "equal", "cov": "full", "reason": "Media handling over the life cycle is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.10", "ref": "Annex A.7.10", "atom": "ISO.A7.10-b", "text": "Restrict or encrypt removable media on endpoints in line with the procedure.", "match": "equal", "cov": "full", "reason": "Technical media controls are part of the same control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.01", "ref": "PR.DS-01", "atom": "NIST.PR.DS.01-c", "text": "The organization restricts the use of removable media.", "match": "req_smaller", "cov": "full", "reason": "Managing media in line with classification and handling rules covers restricting removable media.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-AST-12", "title": "Sanitization before disposal or reuse", "domain": "AST", "theme": "Physical", "goal": "The organization verifies that equipment and media holding data have been wiped or destroyed before disposal or reuse, and keeps proof.", "owner": "Head of IT Operations", "imp": "high", "origin": "iso", "note": "Equipment disposal control. Also reached by the disposal atom of the storage media record.", "statement": "Equipment and media holding data are checked, and data and licensed software are wiped or destroyed by an approved method, before disposal or reuse. Each wipe or destruction is verified, and wipe reports, destruction certificates or a disposal log are kept against the asset record.", "why": "Disposed or reissued devices often still hold readable data, and a wipe nobody verified is no better than none.", "how": "Ask who wipes devices, by what method and who checks. Ask for the last disposal batch records. Example probe: \"Take a laptop retired last quarter and show me the wipe report and where it left the building.\"", "q": "Does your organization verify, with proof, that equipment and media holding data are wiped or destroyed before disposal or reuse?", "evidence": "Equipment disposal and reuse procedure; wipe reports; destruction certificates; disposal log tied to asset inventory entries; disposal contractor agreement. Cover the audit period.", "good": "A procedure requires check and wipe or destruction before disposal or reuse. Each disposed or reissued device has a verified wipe report or certificate linked to its asset record.", "test": "Sample disposed or reissued devices and media from the audit period. Check each has a wipe report or destruction certificate and a matching asset record. Pass if all sampled devices have verified proof of sanitization.", "risk": "Data is recovered from discarded or reused equipment, exposing information to whoever receives it.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.10", "ref": "Annex A.7.10", "atom": "ISO.A7.10-c", "text": "Record media disposals, for example with destruction certificates.", "match": "req_smaller", "cov": "full", "reason": "AST-12 verifies and records wiping or destruction for equipment and media, covering this record.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.14", "ref": "Annex A.7.14", "atom": "ISO.A7.14-a", "text": "Require data and licensed software to be removed or overwritten before equipment is disposed of or reused.", "match": "equal", "cov": "full", "reason": "Same ask: sanitization before disposal or reuse.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.14", "ref": "Annex A.7.14", "atom": "ISO.A7.14-b", "text": "Keep verified wipe or destruction records for disposed or reissued devices.", "match": "equal", "cov": "full", "reason": "Proof of sanitization is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.08", "ref": "ID.AM-08", "atom": "NIST.ID.AM.08-c", "text": "The organization destroys data and sanitizes media when hardware is retired, reassigned or repaired, and records it.", "match": "equal", "cov": "full", "reason": "Verifying equipment and media are wiped before disposal or reuse is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.03", "ref": "PR.PS-03", "atom": "NIST.PR.PS.03-c", "text": "The organization disposes of retired hardware with recorded data sanitization.", "match": "equal", "cov": "full", "reason": "Verifying wiping or destruction before disposal, with proof, is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-AST-13", "title": "Handling rules by classification level", "domain": "AST", "theme": "Organizational", "goal": "The organization documents how information at each classification level is stored, shared, transported and disposed of.", "owner": "Data Governance Lead", "imp": "medium", "origin": "iso", "note": "Split from UC-AST-02 in round 2 so it has its own test.", "statement": "Handling rules are documented for each information classification level. The rules cover storage, sharing, transport and disposal, and differ as the level of sensitivity differs. The approved handling procedure is the proof.", "why": "Without level-specific rules, sensitive information gets the same casual handling as public information, and staff guess how to share or dispose of it.", "how": "Ask for the handling procedure and check it covers every classification level and all four stages. Check that handling is stricter for more sensitive levels. Example probe: \"Show me how the most sensitive level must be sent to an outside party.\"", "q": "Does your organization document how information at each classification level is handled?", "evidence": "Information handling procedure by classification level; classification scheme; the procedure approval record. Cover the last two review cycles.", "good": "The procedure sets out storage, sharing, transport and disposal for every classification level. Rules are stricter for more sensitive levels, and the procedure is approved and current.", "test": "Read the handling procedure and the classification scheme. For each classification level, check that storage, sharing, transport and disposal are each addressed. Pass if every level has all four covered and the procedure is approved.", "risk": "Sensitive information is stored, shared or disposed of without the care its level requires, which leads to leaks.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.10", "ref": "Annex A.5.10", "atom": "ISO.A5.10-b", "text": "Document how information is handled at each classification level.", "match": "equal", "cov": "full", "reason": "Same ask: handling documented for each classification level.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-AST-02 (D11). Handling rules by classification level."}, {"id": "UC-AST-14", "title": "Protection of records", "domain": "AST", "theme": "Organizational", "goal": "The organization protects stored records from loss, tampering and unauthorized access for their retention period.", "owner": "Data Governance Lead", "imp": "high", "origin": "iso", "note": "Split from UC-AST-07 in round 2 so it has its own test.", "statement": "Stored records are protected from loss, tampering and unauthorized access for their whole retention period. Protection uses access limits, immutability or backups suited to each record type. Storage settings are the proof.", "why": "Records that are lost, altered or deleted early can leave the organization unable to prove what happened or defend a claim.", "how": "Pick two or three record types from the retention schedule and ask where they live and who can change or delete them. Example probe: \"Who can delete a signed customer contract from the repository today, and would anyone notice?\"", "q": "Does your organization protect stored records from loss, tampering and unauthorized access for their retention period?", "evidence": "Storage and access settings for sampled record types; backup configuration and restore records; immutability or retention lock settings. Cover the audit period.", "good": "Sampled record types sit in storage with access limited to those who need it. Deletion and tampering are blocked or detected through immutability, logging or backups that cover the full retention period.", "test": "Sample record types from the retention schedule and inspect their storage settings. Check access restrictions, immutability or backups against deletion and tampering through the retention period. Pass if every sampled record type is protected.", "risk": "Required records are lost or altered, which leaves the organization unable to prove what happened or meet legal duties.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.33", "ref": "Annex A.5.33", "atom": "ISO.A5.33-b", "text": "Protect stored records from deletion, tampering and unauthorized access for the retention period.", "match": "equal", "cov": "full", "reason": "Same ask: stored records protected for the retention period.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-AST-07 (D11). Protection of records."}, {"id": "UC-AST-40", "title": "Data flow mapping", "domain": "AST", "theme": "", "goal": "The organization maps how data moves between key systems and across internal and external boundaries and keeps those maps current.", "owner": "Data Governance Lead", "imp": "medium", "origin": "nist", "note": "NIST-only.", "statement": "Data flow diagrams exist for key systems and show how data moves between systems and across internal and external boundaries, including third parties. The diagrams are updated when a significant system or network change occurs and reviewed on a defined cycle. Proof is the dated diagrams and the network diagram of authorized communication paths.", "why": "If nobody knows where data travels, unprotected flows, shadow connections and third-party exposure stay invisible.", "how": "Ask for the diagram of a key system and trace one flow out of the organization. Check the date. Example probe: \"Where does customer data leave this system, to whom, and when was this diagram last updated?\"", "q": "Does your organization keep current maps of how data moves between key systems and across its boundaries?", "evidence": "Data flow diagrams for key systems; network diagram showing authorized communication paths and external connections; documentation of expected ports, protocols and services; version history; covering the audit period", "good": "Diagrams cover each key system and show internal and external flows, including third parties. Authorized paths, ports, protocols and services are documented. Diagrams are dated after the latest significant change.", "test": "Obtain the diagrams and the change log. Sample three key systems and check each has a diagram showing internal and external flows. Check each diagram is dated after the latest significant change. Pass if all sampled diagrams are present and current.", "risk": "Unknown data paths bypass controls, and a breach cannot be scoped quickly because nobody knows where the data went.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.ID.AM.03", "ref": "ID.AM-03", "atom": "NIST.ID.AM.03-b", "text": "The organization maintains data flow diagrams for key systems showing internal and external flows.", "match": "equal", "cov": "full", "reason": "No base control requires data flow diagrams of internal and external flows.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-AST-41", "title": "Asset criticality and priority", "domain": "AST", "theme": "", "goal": "The organization ranks its assets by criticality, resources and impact on its mission, in addition to classification, and reviews the ranking.", "owner": "Head of IT Operations", "imp": "medium", "origin": "nist", "note": "Remainder of UC-AST-04; also NIST-only for ranking every asset.", "statement": "Every asset in the inventory is ranked by its criticality, the resources it needs and its impact on the mission, in addition to its classification. Written criteria set the ranking, the resulting priority is recorded on each asset, and priorities are reviewed on a defined cycle and after significant organizational change. This does not repeat the classification scheme. Proof is the criteria and the inventory with priorities.", "why": "Without a priority on each asset, protection and recovery effort is spread evenly instead of going first to what the business cannot lose.", "how": "Ask for the priority criteria, then open the inventory and look for the rating on a sample of assets. Example probe: \"Pick a server. Where does the inventory show how important it is, and who decided that?\"", "q": "Does your organization give each asset a reviewed priority based on its criticality and mission impact?", "evidence": "Asset prioritization criteria; asset inventory showing a priority or criticality rating on each asset; version history showing the latest review; covering the audit period", "good": "Written criteria weigh classification, criticality, resources and mission impact. Every asset has a priority. Priorities were reviewed within the cycle or after a significant change.", "test": "Obtain the criteria and the inventory. Check the criteria cover the four factors. Sample ten assets and check each carries a priority. Check the version history shows a review in the period. Pass if all sampled assets are rated and a review is dated in the period.", "risk": "Recovery and protection effort goes to the wrong assets, so the most critical systems suffer the longest outages.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.ID.AM.05", "ref": "ID.AM-05", "atom": "NIST.ID.AM.05-a", "text": "The organization defines criteria for prioritizing assets by classification, criticality, resources and mission impact.", "match": "equal", "cov": "full", "reason": "The slot holds prioritizing assets by criticality, resources and mission impact.", "primary": false, "rem": "UC-AST-04", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.05", "ref": "ID.AM-05", "atom": "NIST.ID.AM.05-b", "text": "The organization assigns each asset a priority and reviews priorities periodically.", "match": "equal", "cov": "full", "reason": "Assigning and reviewing a priority for every asset is the slot's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-AST-42", "title": "Asset life cycle management", "domain": "AST", "theme": "", "goal": "The organization sets security steps for each stage of an asset life cycle, from acquisition or deployment through change to retirement.", "owner": "Head of IT Operations", "imp": "medium", "origin": "nist", "note": "NIST-only.", "statement": "Security procedures are documented for each stage of an asset life cycle: acquisition or deployment, change, and retirement. The procedures require assets to be built to a secure baseline before going live and require data destruction when hardware is retired, reassigned or sent for repair. Records show the procedures were followed. Proof is the procedures, build records and the disposal log.", "why": "Security steps skipped at deployment or disposal leave assets misconfigured when they go live and leak data when they leave.", "how": "Ask for the procedure for each stage, then ask for one recent deployment and one disposal. Example probe: \"Show me the build record for a system deployed last quarter and the disposal record for one retired.\"", "q": "Does your organization set security steps for each stage of an asset life cycle, from deployment through change to retirement?", "evidence": "Asset life cycle procedures for acquisition, change and retirement; secure configuration baselines; build or change records for deployed systems; disposal and sanitization log; covering the audit period", "good": "Procedures cover acquisition or deployment, change and retirement. Data destruction is required when hardware is retired, reassigned or repaired. Build records show systems met the baseline before go-live. Disposal records exist for retired assets.", "test": "Obtain the procedures, build records and disposal log. Sample three systems deployed in the period and check each shows baseline configuration before go-live. Sample three retired assets and check each has a disposal or sanitization record. Pass if all sampled records exist.", "risk": "Assets enter service insecure or leave with data still on them.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.ID.AM.08", "ref": "ID.AM-08", "atom": "NIST.ID.AM.08-a", "text": "The organization documents security procedures for each asset life cycle stage: acquisition or deployment, change and retirement.", "match": "equal", "cov": "full", "reason": "No base control sets security steps across acquisition, change and retirement of all asset types.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-AST-43", "title": "Unsupported and unneeded software removal", "domain": "AST", "theme": "", "goal": "The organization avoids unsupported software in production and removes software it does not need.", "owner": "Head of IT Operations", "imp": "high", "origin": "nist", "note": "NIST-only for software end of life and removal. Split in round 2: hardware moved to UC-AST-44.", "statement": "Unsupported software is avoided in production, or an exception with a replacement plan is recorded. Software that is unauthorized or not needed is removed. Proof is the inventory with support status, exception records and removal records.", "why": "Software the vendor no longer supports gets no security fixes, and unneeded software widens the attack surface.", "how": "Ask for a report of unsupported software and what is done about each item. Example probe: \"Which software in production is past vendor support, and where is the replacement plan or exception for each?\"", "q": "Does your organization avoid unsupported software in production and remove software it does not need?", "evidence": "Software inventory showing support status; end-of-life exceptions and replacement plans for software; software inventory review with removal records. Cover the review period.", "good": "No unsupported software runs in production without a recorded exception and replacement plan. Unauthorized or unneeded software found in reviews was removed, with a record.", "test": "Obtain the software inventory with support status and the exception records. Sample software past vendor support and software removals from the review period. Pass if each sampled unsupported item has a replacement plan or recorded exception, and each sampled removal is recorded.", "risk": "Unsupported software runs with unpatched flaws that attackers exploit, and unneeded software widens the attack surface.", "applies": "", "type": "preventive", "freq": "quarterly", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.PS.02", "ref": "PR.PS-02", "atom": "NIST.PR.PS.02-b", "text": "The organization avoids unsupported software in production, or records an exception with a replacement plan.", "match": "equal", "cov": "full", "reason": "No base control retires software that is out of vendor support or tracks an exception with a plan.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.02", "ref": "PR.PS-02", "atom": "NIST.PR.PS.02-c", "text": "The organization removes unauthorized or unneeded software.", "match": "equal", "cov": "full", "reason": "Removing unneeded or unauthorized software is in the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "Split (D11): narrowed to unsupported and unneeded software; the other half is now UC-AST-44."}, {"id": "UC-AST-44", "title": "Hardware end-of-life replacement and disposal", "domain": "AST", "theme": "", "goal": "The organization plans replacement of hardware before vendor support ends and disposes of retired hardware securely.", "owner": "Head of IT Operations", "imp": "high", "origin": "nist", "note": "Remainder of UC-PHY-12 for hardware replacement and disposal. Split from UC-AST-43 in round 2.", "statement": "A documented procedure covers hardware replacement at end of life and secure disposal. Hardware past vendor support has a replacement plan or a recorded exception. Retired hardware is disposed of securely, with data sanitization recorded in a disposal log.", "why": "Hardware past vendor support gets no fixes, and retired devices that are not wiped leak the data they held.", "how": "Ask for hardware past vendor support and the disposal log for the period. Example probe: \"Which hardware is past vendor support, and for the last device retired, where is the wipe record?\"", "q": "Does your organization plan replacement of hardware before vendor support ends and dispose of retired hardware securely?", "evidence": "Hardware replacement and disposal procedure; asset inventory showing hardware support status; replacement plans or exceptions for hardware; disposal log with data sanitization evidence. Cover the review period.", "good": "A procedure covers replacement and disposal. Hardware past support has a replacement plan or recorded exception. Every retired device has a disposal record with sanitization evidence.", "test": "Obtain the procedure, the inventory with support status and the disposal log. Sample hardware past vendor support and hardware retired in the review period. Pass if the procedure exists, each sampled aging item has a replacement plan or recorded exception, and each retired item has disposal and sanitization evidence.", "risk": "Unsupported hardware stays in service with unfixable flaws, and retired devices leak the data they held.", "applies": "", "type": "preventive", "freq": "quarterly", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.PR.PS.03", "ref": "PR.PS-03", "atom": "NIST.PR.PS.03-a", "text": "The organization documents procedures for hardware maintenance, end-of-life replacement and secure disposal.", "match": "equal", "cov": "full", "reason": "Hardware end-of-life replacement and secure disposal complete the maintenance control.", "primary": false, "rem": "UC-PHY-12", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.03", "ref": "PR.PS-03", "atom": "NIST.PR.PS.03-b", "text": "The organization plans replacement or records an exception for hardware past vendor support.", "match": "equal", "cov": "full", "reason": "Same ask: replacement planned or an exception recorded for unsupported hardware.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-AST-43 (D11). Hardware end-of-life replacement and disposal; completes UC-PHY-12."}, {"id": "UC-AST-70", "title": "Erasure of personal data when no longer needed", "domain": "AST", "theme": "", "goal": "The organization erases personal data, and has the parties processing it for the organization erase it, once its purpose is served, consent is withdrawn or erasure is requested, unless a legal ground to keep it applies.", "owner": "Head of IT Operations", "imp": "high", "origin": "dpdpa", "note": "Remainder of UC-AST-08. Conditional inactivity-erasure settings (dpdpa layer) belong in the fields file.", "statement": "Personal data is erased, and the parties processing it for the organization erase it, once its purpose is served, consent is withdrawn or erasure is requested, unless a legal ground to keep it applies. Automated or systematic erasure runs on those triggers, and processors are told to erase whatever was made available to them. Where the organization is a large e-commerce, social media or online gaming intermediary of the kind the law names, a user's data is also erased after three years without contact, and the data principal is warned at least 48 hours before. Proof is erasure job logs, erasure records and the request log.", "why": "Personal data is kept after its purpose ends and survives in processor systems, and each retained record is a breach waiting to happen.", "how": "Ask what triggers erasure, who confirms it happened and how processors are told. Trace a recent erasure request from receipt to closure. Example probe: \"Show me the last erasure request, the proof the data is gone and the instruction sent to the processor.\"", "q": "Does your organization make sure personal data is erased, including at its processors, once its purpose is served, consent is withdrawn or erasure is requested?", "evidence": "Erasure procedure with triggers; erasure job logs or erasure records; rights request log with closure evidence; processor erasure instructions; inactivity erasure warning template where applicable, for the audit period.", "good": "Erasure triggers are defined and run automatically or by a controlled procedure. Processors receive erasure instructions and confirm them. Each erasure request closes with proof of erasure or a recorded legal ground to keep the data.", "test": "Sample personal data records past their erasure trigger and sample erasure requests from the audit period. Trace each to erasure logs or a recorded legal ground, including at processors. Where the inactivity rule applies, check one erased account had a warning at least 48 hours before. Pass if every sampled item was erased or has a recorded legal ground.", "risk": "Personal data lingers past its purpose, in the organization and at processors, and erasure duties are missed.", "applies": "", "type": "corrective", "freq": "continuous", "ks": "dpdpa: where the organization is a named large e-commerce, social media or online gaming intermediary, erase a user's data after three years without contact | dpdpa: warn the data principal at least 48 hours before inactivity erasure | dpdpa: thresholds are 2 crore registered users in India for e-commerce and social media, 50 lakh for online gaming", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.MINIMIZE.2", "ref": "Section 8(7)", "atom": "CH2.MINIMIZE.2-a", "text": "Erase personal data once the purpose it was collected for is no longer served.", "match": "equal", "cov": "full", "reason": "Erasure triggers (purpose served, withdrawal, request) and processor erasure complete the base deletion control.", "primary": true, "rem": "UC-AST-08", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-b", "text": "Run systematic or automated procedures that erase personal data when the purpose ends or consent is withdrawn.", "match": "equal", "cov": "full", "reason": "Systematic erasure on purpose end or withdrawal completes the base deletion control.", "primary": false, "rem": "UC-AST-08", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.CORRECT.2", "ref": "Section 12(3)", "atom": "CH3.CORRECT.2-b", "text": "Erase the data on request unless retention is necessary for the specified purpose or to comply with law.", "match": "equal", "cov": "full", "reason": "Erasure triggered by a request, at processors too, completes the base deletion control.", "primary": false, "rem": "UC-AST-08", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-AST-71", "title": "Personal data retention schedule", "domain": "AST", "theme": "", "goal": "The organization sets, for each category of personal data and each purpose, a retention period or erasure trigger, names the legal ground for any retention beyond the purpose, and checks that system settings follow the schedule.", "owner": "Data Governance Lead", "imp": "high", "origin": "dpdpa", "note": "Remainder of UC-AST-07.", "statement": "A documented retention schedule sets, for each category of personal data and each purpose, a retention period or an erasure trigger. Where the schedule keeps data beyond its purpose, it names the law that requires it. Retention and deletion settings on systems holding personal data are checked on a defined cycle to match the schedule. Proof is the schedule and the system setting checks.", "why": "Without a schedule that names a reason for every retention, data is kept by default and nobody can defend why.", "how": "Ask for the schedule and pick a few data categories. Check each has a period or trigger and a stated reason, then check the system setting. Example probe: \"Take your customer contact data. What is its retention period and what law or purpose backs that?\"", "q": "Does your organization maintain a retention schedule for personal data that names the legal ground for any retention beyond the purpose?", "evidence": "Retention schedule by data category and purpose; legal ground references; system configuration screenshots; schedule-versus-settings check records, for the audit period.", "good": "Every data category and purpose has a period or erasure trigger. Any retention beyond the purpose names its legal ground. Settings on sampled systems match the schedule, and mismatches are fixed.", "test": "Read the schedule. Sample data categories and check each has a period or trigger and a named law where data is kept beyond its purpose. Compare retention or deletion settings on the systems holding them. Pass if every sampled category is scheduled and settings match.", "risk": "Data is kept without a recorded reason or deleted too early or too late because systems do not follow any schedule.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.MINIMIZE.2", "ref": "Section 8(7)", "atom": "CH2.MINIMIZE.2-b", "text": "Retain personal data beyond that purpose only where a law requires it, and name the law.", "match": "equal", "cov": "full", "reason": "The schedule names the legal ground for any retention beyond the purpose.", "primary": false, "rem": "UC-AST-07", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-a", "text": "Maintain a documented retention schedule that sets a period or erasure trigger for each data category or purpose.", "match": "equal", "cov": "full", "reason": "Per-category and per-purpose period or trigger completes the base retention schedule.", "primary": true, "rem": "UC-AST-07", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-d", "text": "Check that retention and deletion settings on systems holding personal data match the schedule.", "match": "equal", "cov": "full", "reason": "The slot's test samples system retention settings against the schedule.", "primary": false, "rem": "UC-AST-07", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-IAM-01", "title": "Access control rules", "domain": "IAM", "theme": "Organizational", "goal": "The organization sets and applies rules for physical and logical access to information and assets based on business and security needs.", "owner": "Identity and Access Lead", "imp": "critical", "origin": "iso", "note": "", "statement": "Written rules for physical and logical access to information and assets are set, based on business and security needs such as need-to-know and least privilege. The rules are applied in real access configurations through role-based groups and by avoiding shared admin accounts. The access policy and system access listings are the proof.", "why": "Access that grows without a rule becomes broad and hard to defend. Policy that does not match actual settings gives false comfort.", "how": "Ask for the access policy, then ask to see how two systems are actually configured. Example probe: \"Show me who can reach the finance system and which rule says they should.\"", "q": "Does your organization apply rules for physical and logical access based on its business needs?", "evidence": "Access control policy covering logical and physical access; system access listings and role or group definitions for sampled systems; list of shared or generic accounts and exceptions. Cover the audit period.", "good": "The policy states access principles and who decides. Sampled systems use role or group access that matches the rules, with no shared admin accounts or documented exceptions.", "test": "Read the access policy for logical and physical rules grounded in business and security needs. Sample systems and compare access listings with the rules. Pass if the policy is approved and all sampled systems follow the rules.", "risk": "Access is granted ad hoc, so people hold more access than they need and no one can justify it.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.15", "ref": "Annex A.5.15", "atom": "ISO.A5.15-a", "text": "Set rules for physical and logical access based on business and security needs.", "match": "equal", "cov": "full", "reason": "Same ask: rules for access.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.15", "ref": "Annex A.5.15", "atom": "ISO.A5.15-b", "text": "Apply the rules in actual access configurations.", "match": "equal", "cov": "full", "reason": "The control covers applying the rules, not only writing them.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.05", "ref": "PR.AA-05", "atom": "NIST.PR.AA.05-a", "text": "The organization defines access permissions and authorizations in a policy.", "match": "equal", "cov": "full", "reason": "Access rules based on business and security needs are the policy this atom asks for.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-IAM-02", "title": "Identity life cycle", "domain": "IAM", "theme": "Organizational", "goal": "The organization manages the full life cycle of identities, links each to one person or an owned non-person account and removes identities of people who have left.", "owner": "Identity and Access Lead", "imp": "high", "origin": "iso", "note": "", "statement": "Creation, change and removal of identities are managed, each identity is linked to one person or to an owned non-person account, and shared identities are controlled. Active accounts are reconciled against the HR roster on a defined cycle so departed staff have no active identity, and every service account has an assigned owner. Reconciliation records and the account list are the proof.", "why": "Orphaned accounts of leavers and ownerless service accounts are a common route for misuse and are rarely noticed.", "how": "Ask how a new starter gets an account and how a leaver's account disappears. Ask for the last reconciliation. Example probe: \"Compare this identity export with the HR leaver list. Are any leavers still active?\"", "q": "Does your organization manage the full life cycle of identities, linking each to an accountable owner and removing those of leavers?", "evidence": "Identity management procedure; identity provider account export; HR roster and leaver list; reconciliation records; service account list with named owners. Cover the audit period.", "good": "The procedure covers creation, change and removal, and limits shared identities. Reconciliation shows no active identity for departed staff. Every service account has an owner.", "test": "Reconcile the identity provider export with the HR roster and leaver list for the audit period, and sample service accounts. Pass if no leaver has an active identity and all sampled service accounts have a recorded owner.", "risk": "Former staff or unowned accounts stay active and can be used without anyone being accountable.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.16", "ref": "Annex A.5.16", "atom": "ISO.A5.16-a", "text": "Manage creation, change and removal of identities, each linked to one person or an owned account.", "match": "equal", "cov": "full", "reason": "Same ask: full life cycle of identities.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.16", "ref": "Annex A.5.16", "atom": "ISO.A5.16-b", "text": "Reconcile active accounts against the HR roster so departed staff have no active identity.", "match": "equal", "cov": "full", "reason": "Reconciliation is the control's test of removal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.16", "ref": "Annex A.5.16", "atom": "ISO.A5.16-c", "text": "Assign an owner to every service and other non-person account.", "match": "equal", "cov": "full", "reason": "Owned non-person accounts are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.01", "ref": "PR.AA-01", "atom": "NIST.PR.AA.01-a", "text": "The organization manages the creation, change and revocation of identities and credentials for users, service accounts and devices.", "match": "equal", "cov": "full", "reason": "Managing the full identity life cycle for people and owned non-person accounts is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.01", "ref": "PR.AA-01", "atom": "NIST.PR.AA.01-d", "text": "The organization inventories non-human credentials such as service accounts, API keys, certificates and keys, each with an owner.", "match": "req_bigger", "cov": "partial", "reason": "Control covers owned non-person accounts but not keys, certificates or API credentials.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.02", "ref": "PR.AA-02", "atom": "NIST.PR.AA.02-b", "text": "Each person has their own credential, and shared accounts are prohibited or allowed only by recorded exception.", "match": "equal", "cov": "full", "reason": "Linking each identity to one person, with shared accounts excluded, is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-IAM-03", "title": "Credential issue, reset and revocation", "domain": "IAM", "theme": "Organizational", "goal": "The organization controls how authentication credentials are issued, reset and revoked, and guides users on keeping them secret.", "owner": "Identity and Access Lead", "imp": "high", "origin": "iso", "note": "Split in round 2: default credentials moved to UC-IAM-13.", "statement": "Issuing, resetting and revoking of authentication credentials such as passwords, tokens and keys are controlled by a procedure, with identity verified before any reset. Users receive written guidance on keeping credentials confidential, for example not sharing them and reporting suspected compromise. The procedure and the user guidance are the proof.", "why": "Weak reset processes let attackers take over accounts, and users who share or expose credentials undo other access controls.", "how": "Ask how a credential request, reset or revocation is handled and what users are told about protecting their credentials. Ask for the procedure and the guidance. Example probe: \"A user calls saying they are locked out. What do you do before you reset anything?\"", "q": "Does your organization control the issue, reset and revocation of authentication credentials?", "evidence": "Credential issue, reset and revocation procedure; user guidance on credential confidentiality; awareness training records covering it; recent reset records showing identity checks; covering the audit period.", "good": "A procedure covers issue, reset and revocation, with identity checks before reset. Users have written guidance on keeping credentials confidential. Recent resets show the procedure was followed.", "test": "Read the procedure and the user guidance. Sample recent resets and revocations from the review period and check identity was verified before each reset. Pass if the procedure and guidance exist and every sampled reset shows identity was verified.", "risk": "Accounts are taken over through social engineering at reset, or credentials are exposed by users who were never told how to protect them.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.17", "ref": "Annex A.5.17", "atom": "ISO.A5.17-a", "text": "Control issuing, resetting and revoking of authentication information, verifying identity before reset.", "match": "equal", "cov": "full", "reason": "Same ask: a managed process for credentials.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.17", "ref": "Annex A.5.17", "atom": "ISO.A5.17-b", "text": "Give users written guidance on keeping authentication information confidential.", "match": "equal", "cov": "full", "reason": "User guidance on handling is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.02", "ref": "PR.AA-02", "atom": "NIST.PR.AA.02-a", "text": "The organization verifies a person's identity before issuing credentials, with stronger proofing for higher-risk access.", "match": "req_bigger", "cov": "partial", "reason": "Control issues credentials but does not require verifying identity first.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": "Split (D11): narrowed to credential issue, reset and revocation; the other half is now UC-IAM-13."}, {"id": "UC-IAM-04", "title": "Access provisioning", "domain": "IAM", "theme": "Organizational", "goal": "The organization grants or changes access only after documented approval and in line with the access rules.", "owner": "Identity and Access Lead", "imp": "critical", "origin": "iso", "note": "Split from access rights record: provisioning and change. Review (IAM-05) and removal (IAM-06) have different tests.", "statement": "Access is requested and approved by someone with the authority to grant it before it is granted or changed, and in line with the access rules. Access is provisioned only against an approved request. Request tickets with approvals are the proof.", "why": "Access given on a verbal ask or without approval accumulates quietly and bypasses the rules.", "how": "Ask for a few recent access requests from start to finish and check approval comes before the grant. Example probe: \"Pick a user who gained admin rights this quarter. Show me the request and when it was approved compared with when it was granted.\"", "q": "Does your organization grant or change access only after documented approval and in line with the access rules?", "evidence": "Access request and approval procedure; access request tickets with approval and timestamps; list of access grants and changes for the period; list of who may approve access. Cover the audit period.", "good": "The policy requires a request and approval before provisioning. Every grant or change traces to an approved request that came first, given by someone with authority to approve.", "test": "Sample new or changed access grants from the audit period and find the approval record for each. Pass if every sampled grant has an approval dated before the access was given.", "risk": "People gain access without anyone with authority agreeing to it.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.18", "ref": "Annex A.5.18", "atom": "ISO.A5.18-a", "text": "Require access to be requested and approved before it is provisioned or changed.", "match": "equal", "cov": "full", "reason": "Approval before provisioning is the whole of this control.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.01", "ref": "PR.AA-01", "atom": "NIST.PR.AA.01-b", "text": "Access is approved before an account is created for a new joiner.", "match": "equal", "cov": "full", "reason": "Access granted only after documented approval is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.05", "ref": "PR.AA-05", "atom": "NIST.PR.AA.05-b", "text": "The organization manages and enforces access permissions, including justification and ownership of privileged accounts.", "match": "req_smaller", "cov": "full", "reason": "Documented approval and granting in line with the rules is how access is managed and enforced.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-IAM-05", "title": "Periodic access review", "domain": "IAM", "theme": "Organizational", "goal": "The organization reviews access rights at a set frequency and removes access that is no longer appropriate.", "owner": "Identity and Access Lead", "imp": "critical", "origin": "iso", "note": "Split from access rights record.", "statement": "Access rights for in-scope systems are reviewed on a defined cycle, and access that is no longer appropriate is removed. Each review records what was checked, the decisions and the removals, and completion of removals is confirmed. Completed review records are the proof.", "why": "Over time people change role and keep old access. Without a review, rights creep and no one notices.", "how": "Ask for the review schedule and the last completed review. Check removals were actually carried out. Example probe: \"In your last review, how many accounts were removed and where is the proof they were?\"", "q": "Does your organization review access rights at a set frequency and remove access that is no longer appropriate?", "evidence": "Access review procedure and schedule; completed user access review records for in-scope systems; evidence that removals were completed; reviewer sign-offs. Cover the last two review cycles.", "good": "Reviews take place at the defined frequency for every in-scope system. Each review is done by someone with authority over that system. Inappropriate access found is removed and the removal confirmed.", "test": "Check the schedule against completed reviews for in-scope systems over the audit period. Sample removals recommended in the reviews and confirm each was carried out. Pass if every in-scope system was reviewed on time and all sampled removals are confirmed.", "risk": "Excess and outdated access stays in place and is used to cause or hide harm.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.18", "ref": "Annex A.5.18", "atom": "ISO.A5.18-b", "text": "Review access at the defined frequency and remove inappropriate access.", "match": "equal", "cov": "full", "reason": "The review and removal-of-excess test is the whole of this control.", "primary": false, "rem":
