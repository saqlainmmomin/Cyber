<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCF part 1 review</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f27; --mute: #5b6472; --line: #dde1e8;
  --accent: #2455c8; --accent-ink: #ffffff;
  --ok: #1d7a46; --ok-bg: #e3f4ea; --chg: #9a5b00; --chg-bg: #fdf0d9; --rej: #b3261e; --rej-bg: #fbe4e2;
  --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e8ebf0; --mute: #9aa4b2; --line: #2d333d;
    --accent: #7ba3ff; --accent-ink: #0d1117;
    --ok: #5fd08d; --ok-bg: #173826; --chg: #f0b45a; --chg-bg: #3b2c12; --rej: #ff8a80; --rej-bg: #44211f;
    --chip: #262b34;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e8ebf0; --mute: #9aa4b2; --line: #2d333d;
  --accent: #7ba3ff; --accent-ink: #0d1117;
  --ok: #5fd08d; --ok-bg: #173826; --chg: #f0b45a; --chg-bg: #3b2c12; --rej: #ff8a80; --rej-bg: #44211f;
  --chip: #262b34;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 130px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header.top { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.bar h1 { font-size: 17px; margin: 0; }
.bar .grow { flex: 1; min-width: 160px; }
.meter { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ok); width: 0; }
.prog { font-size: 13px; color: var(--mute); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; }
nav.tabs button { border: 0; background: none; color: var(--mute); padding: 8px 12px; font: inherit; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs .n { font-size: 12px; color: var(--mute); margin-left: 4px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
section.panel[hidden] { display: none; }
h2 { font-size: 20px; margin: 8px 0 4px; }
h3 { font-size: 16px; margin: 20px 0 6px; }
p { margin: 6px 0; }
.mute { color: var(--mute); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
.card.s-approve { border-left: 5px solid var(--ok); }
.card.s-change { border-left: 5px solid var(--chg); }
.card.s-reject { border-left: 5px solid var(--rej); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.head .id { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); }
.head .t { font-weight: 600; font-size: 16px; }
.chip { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 999px; padding: 1px 9px; color: var(--mute); }
.chip.crit { background: var(--rej-bg); color: var(--rej); }
.chip.high { background: var(--chg-bg); color: var(--chg); }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); margin-top: 10px; }
.q { font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
.tablewrap { overflow-x: auto; }
.dec { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin-top: 12px; }
.dec .btns { display: flex; gap: 6px; }
.dec button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.dec button[aria-pressed="true"].approve { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.dec button[aria-pressed="true"].change { background: var(--chg-bg); border-color: var(--chg); color: var(--chg); font-weight: 600; }
.dec button[aria-pressed="true"].reject { background: var(--rej-bg); border-color: var(--rej); color: var(--rej); font-weight: 600; }
.dec textarea { flex: 1; min-width: 220px; min-height: 34px; font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin: 10px 0; }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--mute); gap: 2px; }
.filters select, .filters input { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.btn { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.domhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; margin-top: 28px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.domhead h3 { margin: 0; }
.rec { background: var(--chip); border-radius: 6px; padding: 6px 10px; margin-top: 8px; font-size: 14px; }
.flag { color: var(--chg); font-weight: 600; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.src-fw { font-weight: 600; margin-top: 8px; font-size: 13px; }
.small { font-size: 13px; }
@media (max-width: 640px) { main { padding: 12px; } .dec textarea { min-width: 100%; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Unified control framework, part 1: review</h1>
    <div class="grow">
      <div class="meter" role="progressbar" aria-label="Review progress" id="meter"><i id="meterfill"></i></div>
      <div class="prog" id="prog"></div>
    </div>
    <button class="btn" id="exportJson">Export decisions (JSON)</button>
    <button class="btn ghost" id="exportMd">Export summary (Markdown)</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>

<script>
"use strict";
const DATA = {"reviewKey": "ucf-review-0.0.1-draft", "round": 2, "version": "0.0.3-draft", "date": "2026-10-14", "counts": [{"label": "ISO 27001", "key": "iso27001", "controls": 134, "records": 118, "covered": 118, "atoms": 300}, {"label": "NIST CSF", "key": "nist_csf", "controls": 112, "records": 106, "covered": 106, "atoms": 299}, {"label": "DPDPA", "key": "dpdpa", "controls": 54, "records": 41, "covered": 41, "atoms": 98}, {"label": "ISO 27001 + NIST CSF", "key": "iso27001+nist_csf", "controls": 168, "records": 224, "covered": 224, "atoms": 599}, {"label": "ISO 27001 + DPDPA", "key": "iso27001+dpdpa", "controls": 177, "records": 159, "covered": 159, "atoms": 398}, {"label": "NIST CSF + DPDPA", "key": "nist_csf+dpdpa", "controls": 158, "records": 147, "covered": 147, "atoms": 397}, {"label": "ISO 27001 + NIST CSF + DPDPA", "key": "iso27001+nist_csf+dpdpa", "controls": 211, "records": 265, "covered": 265, "atoms": 697}], "domains": [{"code": "GOV", "name": "ISMS and governance", "owner": "CISO", "privacy": false}, {"code": "RSK", "name": "Risk and compliance", "owner": "Risk and Compliance Manager", "privacy": false}, {"code": "AST", "name": "Assets and information", "owner": "Head of IT Operations", "privacy": false}, {"code": "IAM", "name": "Identity and access", "owner": "Identity and Access Lead", "privacy": false}, {"code": "CRY", "name": "Cryptography", "owner": "Security Engineering Lead", "privacy": false}, {"code": "NET", "name": "Network and infrastructure", "owner": "Network and Infrastructure Lead", "privacy": false}, {"code": "OPS", "name": "Operations, logging and monitoring", "owner": "Security Operations Lead", "privacy": false}, {"code": "SDC", "name": "Secure development and change", "owner": "Head of Application Development", "privacy": false}, {"code": "PHY", "name": "Physical and environmental", "owner": "Head of Facilities", "privacy": false}, {"code": "PPL", "name": "People", "owner": "HR Head", "privacy": false}, {"code": "SUP", "name": "Suppliers and third parties", "owner": "Head of Procurement", "privacy": false}, {"code": "INC", "name": "Incident and breach management", "owner": "Incident Response Lead", "privacy": false}, {"code": "RES", "name": "Resilience and continuity", "owner": "Business Continuity Manager", "privacy": false}, {"code": "PNC", "name": "Privacy: notice and consent", "owner": "Data Protection Officer", "privacy": true}, {"code": "PRT", "name": "Privacy: principal rights and grievance", "owner": "Data Protection Officer", "privacy": true}, {"code": "PUR", "name": "Privacy: purpose, minimization and accuracy", "owner": "Data Protection Officer", "privacy": true}, {"code": "PGV", "name": "Privacy: fiduciary governance", "owner": "Data Protection Officer", "privacy": true}, {"code": "PSC", "name": "Privacy: special categories and transfers", "owner": "Data Protection Officer", "privacy": true}], "controls": [{"id": "UC-GOV-01", "title": "Internal and external issues", "domain": "GOV", "theme": "", "goal": "The organization identifies and keeps current the internal and external issues, including climate change where relevant, that affect its ability to achieve its security outcomes.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only. Climate wording from the 2024 amendment sits in this control.", "statement": "A register of the internal and external issues that affect the organization's security outcomes is kept, including climate change where it is relevant. The register is reviewed on a defined cycle and when the business context changes. Each review is recorded so the program stays tied to real conditions.", "why": "Without a view of the issues around it, the program is built for yesterday's risks and drifts away from the business.", "how": "Ask how the organization learns what is changing in its market, technology, regulation and physical environment, and who records it. Ask whether climate change was considered and what was decided. Example probe: \"Show me where you wrote down the issues that shape your security priorities, and when you last updated them.\"", "q": "Does your organization keep current the internal or external issues, including climate change where relevant, that affect its security outcomes?", "evidence": "Register or analysis of internal and external issues; record of the climate change relevance decision; review minutes or version history showing updates over the last two review cycles", "good": "A dated register lists internal and external issues with an owner. It records a clear yes or no on climate change with the reason. It shows updates after major changes and feeds scope, risk and objective setting.", "test": "Obtain the issues register. Check it covers both internal and external issues and records the climate change decision. Pass if the register is current, owned, and shows at least one review in the last two cycles.", "risk": "The security program ignores shifts in the business or environment and protects against the wrong things.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C4.1", "ref": "Clause 4.1", "atom": "ISO.C4.1-a", "text": "Determine the external and internal issues that matter to the organization's purpose and affect its security outcomes.", "match": "equal", "cov": "full", "reason": "Issue identification is the whole of GOV-01.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C4.1", "ref": "Clause 4.1", "atom": "ISO.C4.1-b", "text": "Decide whether climate change is a relevant issue.", "match": "equal", "cov": "full", "reason": "The climate wording is part of GOV-01's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-GOV-02", "title": "Interested parties and their requirements", "domain": "GOV", "theme": "", "goal": "The organization identifies the parties that have a stake in its security, determines their requirements, including any climate-related ones, and decides which of those it will address.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only. Split from issues (GOV-01) because the test differs: issues register versus interested-party register.", "statement": "A register is kept of the parties with a stake in security, such as customers, regulators, partners and staff. For each party the register states the requirements, including any climate-related ones, and whether the security program will address them. The register feeds decisions on scope, policy and risk. It is reviewed on a defined cycle and when a party or its requirements change.", "why": "If stakeholder expectations are not captured, the program can miss contractual or regulatory duties and be surprised by them.", "how": "Ask who the organization considers its interested parties and how it learns what they expect. Look for a recorded decision on which requirements are taken on. Example probe: \"Which customers or regulators have security requirements for you, and where are those written down with a decision on each?\"", "q": "Does your organization maintain a register of the parties with a stake in its security, with their requirements?", "evidence": "Interested parties register; record of requirements per party; record of decisions on which requirements are addressed; review history for the last two cycles", "good": "The register names each party, lists its requirements in plain terms, and marks each requirement as addressed or not, with the reason. It is reviewed on a set cycle and feeds scope, policy and risk decisions and the legal register.", "test": "Obtain the interested parties register. Take five parties and check each has stated requirements and a recorded decision. Check that the scope, policy set or risk assessment draws on the register. Pass if all sampled parties are complete, the register is used in those decisions, and the register was reviewed in the last two cycles.", "risk": "Stakeholder requirements go unmet, leading to lost contracts, regulatory findings or surprise demands.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C4.2", "ref": "Clause 4.2", "atom": "ISO.C4.2-a", "text": "Determine the interested parties that are relevant to the security program.", "match": "equal", "cov": "full", "reason": "Stakeholder identification is the first element of GOV-02.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C4.2", "ref": "Clause 4.2", "atom": "ISO.C4.2-b", "text": "Determine the requirements of those parties, which can include legal, regulatory and contractual ones and, under the 2024 amendment, climate-related ones.", "match": "equal", "cov": "full", "reason": "Stakeholder requirements including climate are in GOV-02.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C4.2", "ref": "Clause 4.2", "atom": "ISO.C4.2-c", "text": "Decide which of those requirements the security program will address.", "match": "equal", "cov": "full", "reason": "Selection of requirements to address is in GOV-02.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.02", "ref": "GV.OC-02", "atom": "NIST.GV.OC.02-a", "text": "The organization identifies its internal stakeholders and records what each expects from cybersecurity risk management.", "match": "equal", "cov": "full", "reason": "Identifying stakeholders and what they require is the control's core; this atom is the internal side.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.02", "ref": "GV.OC-02", "atom": "NIST.GV.OC.02-b", "text": "The organization identifies its external stakeholders and records what each expects from cybersecurity risk management.", "match": "equal", "cov": "full", "reason": "Same control, external side: customers, regulators and partners and their requirements.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.02", "ref": "GV.OC-02", "atom": "NIST.GV.OC.02-c", "text": "The organization factors stakeholder expectations into its strategy, policy and risk decisions.", "match": "req_smaller", "cov": "full", "reason": "The control has the organization decide which stakeholder requirements it will address, which is what taking them into account means.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "Soft NIST ask (D09): the register now feeds scope, policy and risk decisions."}, {"id": "UC-GOV-03", "title": "Scope of the security program", "domain": "GOV", "theme": "", "goal": "The organization defines and documents the boundaries and applicability of its security management program, taking account of issues, stakeholder requirements and dependencies.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "The scope of the security program is defined and documented, covering its boundaries and where it applies. The scope takes account of the organization's issues, stakeholder requirements and dependencies on other parties. It is approved and reviewed when the business changes.", "why": "An unclear scope leaves critical systems, sites or services unprotected, or makes any assurance claim misleading.", "how": "Ask for the scope statement and how it was decided. Check what is in and out, and why. Example probe: \"Which sites, systems and services are inside your security program, and who approved leaving anything out?\"", "q": "Does your organization document the scope of its security program?", "evidence": "Scope statement with boundaries and exclusions; approval record; version history; record of dependencies on other parties", "good": "The scope statement names the locations, business units, services and systems covered. Each exclusion has a reason. It cites the issues, stakeholder requirements and dependencies considered and carries management approval.", "test": "Obtain the scope statement. Compare it to the asset inventory and a list of business units. Pass if it is approved, current, and every sampled unit or system is either inside scope or has a recorded exclusion reason.", "risk": "Unprotected assets sit outside the program, and assurance statements overstate what is covered.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C4.3", "ref": "Clause 4.3", "atom": "ISO.C4.3-a", "text": "Determine the boundaries and applicability of the program, considering issues, requirements and dependencies.", "match": "equal", "cov": "full", "reason": "Scope boundaries are the whole of GOV-03.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C4.3", "ref": "Clause 4.3", "atom": "ISO.C4.3-b", "text": "Keep the scope as documented information.", "match": "equal", "cov": "full", "reason": "Documented scope is part of GOV-03.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-GOV-04", "title": "Security management system operated", "domain": "GOV", "theme": "", "goal": "The organization establishes, runs and maintains a security management system, with the processes it needs and the way they interact.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "A security management system is established, run and maintained, with defined processes and the way they interact. Each process has an assigned owner, and a check on a defined cycle confirms the system is running and being improved. Proof is a process map, owner list and review records.", "why": "Without a working management system, security is a set of one-off activities that fade when people change.", "how": "Ask how the organization's security processes fit together and who owns each. Look for evidence the system is used, not only written. Example probe: \"Walk me through how risk, incidents and audits feed each other, and show me a recent example.\"", "q": "Does your organization operate a security management system with defined processes?", "evidence": "Security management system description or process map; process owner list; examples of processes in operation; improvement records from the current review period", "good": "A process map shows each security process, its owner and its inputs and outputs. Records show the processes running and feeding improvements, with changes tracked.", "test": "Obtain the process map and owner list. Pick three processes and trace one recent run of each through to records. Pass if each has a named owner and a dated record of operation in the last cycle.", "risk": "Security work stays ad hoc, so gaps recur and results depend on individuals.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa", "iso27001"], "sources": [{"fw": "dpdpa", "rec": "CH2.SECURITY.1", "ref": "Section 8(5)", "atom": "CH2.SECURITY.1-a", "text": "Implement reasonable technical safeguards to protect personal data and prevent breaches.", "match": "overlap", "cov": "partial", "reason": "The operated security management system is the vehicle for technical safeguards but names none for personal data.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.1", "ref": "Section 8(5)", "atom": "CH2.SECURITY.1-b", "text": "Implement reasonable organizational safeguards to protect personal data and prevent breaches.", "match": "overlap", "cov": "partial", "reason": "The security management system carries organizational safeguards but not the personal data scope.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C4.4", "ref": "Clause 4.4", "atom": "ISO.C4.4-a", "text": "Establish and implement the security management system, with the processes it needs and their interactions.", "match": "equal", "cov": "full", "reason": "Same ask: an operated system of processes.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C4.4", "ref": "Clause 4.4", "atom": "ISO.C4.4-b", "text": "Maintain and continually improve the system.", "match": "equal", "cov": "full", "reason": "Maintenance is in GOV-04 and improvement is tested in GOV-19.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-GOV-05", "title": "Leadership commitment", "domain": "GOV", "theme": "", "goal": "Top management shows leadership of the security program by aligning it to strategy, building it into business processes, making sure it achieves its intended outcomes, directing and supporting the people who run it and supporting other managers in their own leadership.", "owner": "Top Management", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "Top management leads the security program. It sets policy and objectives that fit the strategy, builds security needs into business processes, and makes sure the program achieves its intended outcomes. It communicates why security matters, directs and supports the people who run the program, supports other managers in leading in their own areas, and promotes improvement. Sign-offs and minutes are the proof.", "why": "Programs without visible leadership lose budget and priority, and staff treat security as optional.", "how": "Ask senior leaders how they set direction, where security shows up in business planning and how they back those who run the security program. Example probe: \"Tell me about the last time a business decision changed because of a security concern. Where is that recorded?\"", "q": "Does your top management actively lead the security program?", "evidence": "Management meeting minutes with security items; approved policy and objectives; examples of security built into business processes; leadership communications on security; records from the current review period", "good": "Leaders approve policy and objectives that cite the strategy. Security appears in project, procurement and planning processes. Minutes and messages show leaders directing and supporting the program.", "test": "Review leadership minutes and communications for the period. Sample three business processes for built-in security steps and check that the program's outcomes are reviewed. Pass if leadership actions are recorded, the sampled processes include security steps, outcomes are reviewed, and policy and objectives show approval.", "risk": "Security lacks authority and resources, and the program fails when it meets business resistance.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C5.1", "ref": "Clause 5.1", "atom": "ISO.C5.1-a", "text": "Make sure the security policy and objectives are set and fit the organization's strategic direction.", "match": "equal", "cov": "full", "reason": "Alignment to strategy is in GOV-05.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.1", "ref": "Clause 5.1", "atom": "ISO.C5.1-b", "text": "Build security program requirements into business processes.", "match": "equal", "cov": "full", "reason": "Integration into processes is in GOV-05.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.1", "ref": "Clause 5.1", "atom": "ISO.C5.1-d", "text": "Communicate the importance of effective security, direct and support people and promote continual improvement.", "match": "equal", "cov": "full", "reason": "Direction and support are in GOV-05.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.1", "ref": "Clause 5.1", "atom": "ISO.C5.1-e", "text": "Make sure the program achieves its intended outcomes.", "match": "equal", "cov": "full", "reason": "Outcome assurance is part of leadership in GOV-05.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.1", "ref": "Clause 5.1", "atom": "ISO.C5.1-f", "text": "Support other managers in showing leadership in their own areas.", "match": "equal", "cov": "full", "reason": "Backing for other managers' leadership is part of GOV-05.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.01", "ref": "GV.RR-01", "atom": "NIST.GV.RR.01-c", "text": "Leadership communicates expectations for a risk-aware, ethical, improvement-minded culture.", "match": "req_smaller", "cov": "full", "reason": "Top management directing and supporting the program covers setting culture expectations.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-GOV-06", "title": "Security policy set", "domain": "GOV", "theme": "Organizational", "goal": "The organization maintains a management-approved set of security policies, headed by a top-level policy that reflects the organization's context, that is published, acknowledged by personnel and relevant outside parties, and reviewed at planned intervals.", "owner": "CISO", "imp": "critical", "origin": "iso", "note": "Merge: clause security policy (top-level policy) and Annex control on policies for information security. Same goal, owner and test.", "statement": "A set of security policies headed by a top-level policy is maintained, with each policy approved by management. The top-level policy suits the organization's purpose and context, frames security objectives and commits to meeting requirements and to continual improvement. The policies are published, available to interested parties and acknowledged by personnel and relevant outside parties. They are reviewed on a defined cycle and after significant change. Each update records what drove the change, and updated versions are communicated again to personnel. Proof is the approval record, distribution list, acknowledgements and review log.", "why": "Policies set the rules everything else relies on. If they are missing, unapproved or stale, staff have no clear standard to follow.", "how": "Ask for the policy list and sample how each was approved, shared and reviewed. Check that outsiders such as suppliers receive the relevant ones. Example probe: \"Show me your top-level policy, who approved it, and how a new joiner acknowledges it.\"", "q": "Does your organization maintain a management-approved set of security policies that it reviews on a defined cycle?", "evidence": "Top-level security policy; topic policies such as access control, backup and cryptography; approval records; distribution list; acknowledgement records; version history or review log for the last review cycle", "good": "A top-level policy written for the organization's purpose and context, not a generic template, with objectives and a commitment to meet requirements and improve. Topic policies exist, each with management approval and an owner. They are published, staff and relevant outsiders acknowledge them, and each has a recorded review within its interval or after major change. Updates note what drove them and are sent again to staff.", "test": "Obtain the policy list. Sample five policies including the top-level one. Check that the top-level policy reflects the organization's context, sets objectives and commits to meeting requirements and to improvement. Check approval, publication, acknowledgement records and last review date. For policies updated in the period, check the update records what drove it and was communicated again to personnel. Pass if all sampled policies are approved and in date, acknowledgements exist for staff, and sampled updates show their driver and re-communication.", "risk": "Staff and partners act without clear rules, and the organization cannot show management intent.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.1", "ref": "Annex A.5.1", "atom": "ISO.A5.1-a", "text": "Define a set of security policies and have management approve them.", "match": "equal", "cov": "full", "reason": "The control's policy set with management approval is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.1", "ref": "Annex A.5.1", "atom": "ISO.A5.1-b", "text": "Publish the policies and have personnel and relevant outside parties acknowledge them.", "match": "equal", "cov": "full", "reason": "Publication and acknowledgement are stated in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.1", "ref": "Annex A.5.1", "atom": "ISO.A5.1-c", "text": "Review each policy at planned intervals and after significant change.", "match": "equal", "cov": "full", "reason": "Scheduled and event-driven policy review is part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.2", "ref": "Clause 5.2", "atom": "ISO.C5.2-a", "text": "Set a top-level policy suited to the organization's purpose that frames objectives and commits to meeting requirements and improving.", "match": "equal", "cov": "full", "reason": "The top-level policy is the core of GOV-06.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.2", "ref": "Clause 5.2", "atom": "ISO.C5.2-b", "text": "Keep the policy as documented information, communicate it and make it available to interested parties.", "match": "equal", "cov": "full", "reason": "Publication and availability are in GOV-06.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.PO.01", "ref": "GV.PO-01", "atom": "NIST.GV.PO.01-a", "text": "The organization maintains a documented cybersecurity risk policy approved by senior management.", "match": "equal", "cov": "full", "reason": "A management-approved security policy set is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.PO.01", "ref": "GV.PO-01", "atom": "NIST.GV.PO.01-b", "text": "The policy is based on the organization's context, strategy and priorities.", "match": "req_smaller", "cov": "full", "reason": "A top-level policy set reflecting the organization's purpose and context is what the control maintains.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.PO.01", "ref": "GV.PO-01", "atom": "NIST.GV.PO.01-c", "text": "The organization communicates the policy to personnel.", "match": "equal", "cov": "full", "reason": "Publication and acknowledgement by personnel is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.PO.02", "ref": "GV.PO-02", "atom": "NIST.GV.PO.02-a", "text": "The organization reviews the policy on a set frequency and after defined trigger events.", "match": "equal", "cov": "full", "reason": "Review at planned intervals plus event-driven review is in the control goal.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.PO.02", "ref": "GV.PO-02", "atom": "NIST.GV.PO.02-b", "text": "Each policy update records the change in requirements, threats, technology or mission that drove it.", "match": "req_smaller", "cov": "full", "reason": "A review that records what drove each update is how the control shows the review happened.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.PO.02", "ref": "GV.PO-02", "atom": "NIST.GV.PO.02-c", "text": "The organization re-communicates updated policy versions to personnel.", "match": "req_smaller", "cov": "full", "reason": "Publication and acknowledgement of the policy set applies again to each new version.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": "Wording (D08): the top-level policy reflects the organization's context."}, {"id": "UC-GOV-07", "title": "Security roles and responsibilities", "domain": "GOV", "theme": "Organizational", "goal": "The organization defines and allocates security roles, responsibilities and authorities to named people, including responsibility for program conformity and reporting to top management.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Merge: clause on roles and authorities and Annex control on security roles. Same goal, owner and test.", "statement": "Security roles, responsibilities and authorities are defined and each is assigned to a named, current person. This includes responsibility for program conformity and for reporting performance to top management. The assignments are communicated and rechecked when people or structures change, using a role document or RACI with names.", "why": "If roles are unnamed or out of date, tasks fall between people and no one answers for security results.", "how": "Ask for the role document and check names against the current staff list. Ask who reports program performance upward. Example probe: \"Who is responsible for reporting security performance to the board, and where is that written?\"", "q": "Does your organization assign each security role to a named person?", "evidence": "Roles and responsibilities document or RACI with names; security organization chart; communication record of assignments; update history for the last review cycle", "good": "Each security role has a written responsibility set and a named, current holder. Conformity and reporting duties are assigned. Changes in staff trigger an update.", "test": "Obtain the RACI and a current staff list. Sample five roles and confirm each holder is current. Pass if every sampled role is defined, assigned to a named current person, and conformity and reporting duties are assigned.", "risk": "Duties are missed or disputed, and incidents and audits find no accountable owner.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.2", "ref": "Annex A.5.2", "atom": "ISO.A5.2-a", "text": "Define security roles and their responsibilities.", "match": "equal", "cov": "full", "reason": "Defined security roles and duties are the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.2", "ref": "Annex A.5.2", "atom": "ISO.A5.2-b", "text": "Allocate each security role to a named, current person.", "match": "equal", "cov": "full", "reason": "Named allocation is stated in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.3", "ref": "Clause 5.3", "atom": "ISO.C5.3-a", "text": "Assign and communicate responsibilities and authorities for relevant security roles.", "match": "equal", "cov": "full", "reason": "Role allocation is the first element of GOV-07.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C5.3", "ref": "Clause 5.3", "atom": "ISO.C5.3-b", "text": "Assign responsibility for conformity of the program and for reporting its performance to top management.", "match": "equal", "cov": "full", "reason": "Conformity and reporting responsibility are in GOV-07.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.01", "ref": "GV.RR-01", "atom": "NIST.GV.RR.01-a", "text": "The organization formally names a senior leader or body accountable for cybersecurity risk.", "match": "req_smaller", "cov": "full", "reason": "The control allocates responsibility to named people and reporting to top management, which is formal accountability.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.02", "ref": "GV.RR-02", "atom": "NIST.GV.RR.02-a", "text": "The organization documents cybersecurity roles, responsibilities and authorities.", "match": "equal", "cov": "full", "reason": "Defined roles, responsibilities and authorities are the control's core.", "primary": true, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-GOV-08", "title": "Team members aligned with security policy", "domain": "GOV", "theme": "Organizational", "goal": "The organization requires every team member to work in line with its security policies and procedures, and shows the requirement has reached each team.", "owner": "Top Management", "imp": "high", "origin": "iso", "note": "", "statement": "Every team member is required to work in line with the organization's security policies and procedures. The requirement is stated in documents each person receives, such as a code of conduct or onboarding pack. Teams are briefed or acknowledgements are tracked, and the records are kept.", "why": "Rules that are not reinforced inside teams are routinely ignored, and nobody is clearly responsible for lapses.", "how": "Ask how team members learn that following security policy is expected and how that is reinforced in each team. Look for records, not statements. Example probe: \"Show me the last briefing on security expectations in one team and how you know everyone was reached.\"", "q": "Does your organization make sure every team member knows they must work in line with its security policies and procedures?", "evidence": "Code of conduct, onboarding pack or briefing guide stating the expectation; policy acknowledgement tracking; team briefing records; records from the current review period", "good": "A document each team member receives states that following security policy is required. Briefings or tracked acknowledgements cover every team, with records for the period.", "test": "Obtain the document stating the expectation and the acknowledgement or briefing records. Sample three teams. Pass if the expectation is documented and each sampled team has a briefing or acknowledgement record in the period.", "risk": "Security is treated as someone else's job, and non-compliance goes unchallenged.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.4", "ref": "Annex A.5.4", "atom": "ISO.A5.4-a", "text": "Require, in a document personnel receive, that staff follow security policies and procedures.", "match": "equal", "cov": "full", "reason": "Management's stated expectation of compliance is the control's core.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.4", "ref": "Annex A.5.4", "atom": "ISO.A5.4-b", "text": "Have managers brief or require their teams to comply, with records.", "match": "equal", "cov": "full", "reason": "Briefings and acknowledgement tracking are the proof the control names.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.02", "ref": "GV.RR-02", "atom": "NIST.GV.RR.02-c", "text": "The organization enforces security duties through performance goals or follow-up on missed duties.", "match": "req_smaller", "cov": "full", "reason": "Managers requiring personnel to apply security and showing it is the enforcement ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-GOV-09", "title": "Specialist security forums", "domain": "GOV", "theme": "Organizational", "goal": "The organization keeps contact with specialist security forums and professional groups and uses what it learns.", "owner": "CISO", "imp": "low", "origin": "iso", "note": "", "statement": "A record is kept of the specialist security forums and professional groups the organization joins or follows. Participation is active, and relevant advisories and lessons are circulated to those who need them. Proof is a membership list and circulation records.", "why": "Teams that stay isolated miss emerging threats, advisories and good practice that peers already use.", "how": "Ask which groups, mailing lists or industry bodies the organization follows and what has come out of them recently. Example probe: \"What was the last advisory from a security group that changed something you did?\"", "q": "Does your organization keep contact with specialist security forums or professional groups?", "evidence": "List of forums, groups or subscriptions; advisories received and circulated; event attendance records; records from the current review period", "good": "A list names each group with an internal contact. Advisories and lessons are circulated, and at least one example shows learning being acted on.", "test": "Obtain the membership or subscription list and circulation records. Sample three recent advisories. Pass if the list is current and each sampled item shows it was received and passed on to a responsible person.", "risk": "The organization learns of new threats and practices late, from its own incidents.", "applies": "", "type": "preventive", "freq": "ad_hoc", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.6", "ref": "Annex A.5.6", "atom": "ISO.A5.6-a", "text": "Record which specialist forums and professional groups the organization joins.", "match": "equal", "cov": "full", "reason": "Same ask: keep contact with specialist forums.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.6", "ref": "Annex A.5.6", "atom": "ISO.A5.6-b", "text": "Take part actively and circulate what is learned.", "match": "equal", "cov": "full", "reason": "Active participation and use of what is learned is in the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-GOV-10", "title": "Risks and opportunities of the program", "domain": "GOV", "theme": "", "goal": "The organization determines the risks and opportunities that bear on the security program, plans actions for them, builds those actions into its processes and checks they work.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only. General planning step. Risk assessment and treatment detail sits in the risk domain.", "statement": "The risks and opportunities that bear on the security program are determined, actions for them are planned, and those actions are built into program processes. A method for checking that the actions work is planned as well. Proof is a planning record with owners and a method for evaluating results.", "why": "Skipping this planning step means the program reacts to problems and misses chances to improve.", "how": "Ask how the organization decides what could stop the program working and what could help it, and how actions are tracked. Detailed risk assessment is covered elsewhere. Example probe: \"Show me the program-level risks and opportunities you recorded and the action taken on one.\"", "q": "Does your organization plan actions for the risks and opportunities that bear on its security program?", "evidence": "Program-level risk and opportunity register or planning record; action plan with owners; evidence of effectiveness checks; review records for the last cycle", "good": "Program risks and opportunities are listed with owners and planned actions. Actions are built into the processes, and each states how its effect will be checked, with results recorded.", "test": "Obtain the planning record. Sample three actions and trace each to a process change and an effectiveness check. Pass if all sampled actions have an owner, a built-in step and a recorded check.", "risk": "The program fails to anticipate obstacles and overlooks chances to improve.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C6.1.1", "ref": "Clause 6.1.1", "atom": "ISO.C6.1.1-a", "text": "Considering the context issues and interested-party requirements, determine the risks and opportunities that must be addressed to achieve outcomes, prevent undesired effects and improve.", "match": "equal", "cov": "full", "reason": "Same ask: determine risks and opportunities.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.1", "ref": "Clause 6.1.1", "atom": "ISO.C6.1.1-b", "text": "Plan actions to address them and build the actions into program processes.", "match": "equal", "cov": "full", "reason": "Planning and integration are in GOV-10.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.1.1", "ref": "Clause 6.1.1", "atom": "ISO.C6.1.1-c", "text": "Plan how to evaluate whether the actions work.", "match": "equal", "cov": "full", "reason": "Effectiveness evaluation is in GOV-10.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.07", "ref": "GV.RM-07", "atom": "NIST.GV.RM.07-a", "text": "The risk methodology treats opportunities (positive risks) as a category alongside threats.", "match": "overlap", "cov": "partial", "reason": "The control's opportunities are ways to improve the program, not upside in enterprise risk decisions.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.07", "ref": "GV.RM-07", "atom": "NIST.GV.RM.07-b", "text": "The organization records and discusses identified opportunities in its risk discussions.", "match": "overlap", "cov": "partial", "reason": "The control plans actions for program opportunities; it does not record upside in risk decisions.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-GOV-11", "title": "Security objectives", "domain": "GOV", "theme": "", "goal": "The organization sets measurable security objectives at relevant functions, consistent with policy, and plans what will be done, with what resources, by whom, by when and how results are evaluated.", "owner": "Top Management", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "Measurable security objectives are set at relevant functions, consistent with policy. For each objective the plan states what will be done, with what resources, by whom, by when and how results are evaluated. Objectives are monitored, communicated and updated, and the plan is kept as a record.", "why": "Vague aims cannot be tracked, so the program cannot show whether it is succeeding.", "how": "Ask for the current objectives and how each is measured. Look for owners, dates and results. Example probe: \"Which security objective did you miss last period, and what did you change?\"", "q": "Does your organization set measurable security objectives with a plan to meet them?", "evidence": "Security objectives with measures; objective plans showing actions, resources, owners and dates; progress reports; communication records for the last cycle", "good": "Each objective is measurable, linked to policy and risk results, and has an owner, resources and due date. Progress is reported, objectives are updated as needed and staff know them.", "test": "Obtain the objectives and plans. Sample three objectives and check each is measurable and has resources, owner, date and a progress record. Pass if all sampled objectives meet these tests.", "risk": "The program has no way to show progress, and effort drifts toward low-value work.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C6.2", "ref": "Clause 6.2", "atom": "ISO.C6.2-a", "text": "Set measurable security objectives at relevant functions, consistent with policy, taking risk results into account, and monitor, communicate, update and document them.", "match": "equal", "cov": "full", "reason": "Same ask: objectives with these properties.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C6.2", "ref": "Clause 6.2", "atom": "ISO.C6.2-b", "text": "Plan what will be done, with what resources, by whom, by when and how results are evaluated.", "match": "equal", "cov": "full", "reason": "Action planning is in GOV-11.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.01", "ref": "GV.RM-01", "atom": "NIST.GV.RM.01-a", "text": "The organization documents its cybersecurity risk management objectives with measurable targets.", "match": "equal", "cov": "full", "reason": "Measurable objectives set and documented is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.01", "ref": "GV.RM-01", "atom": "NIST.GV.RM.01-b", "text": "Senior stakeholders formally agree the risk management objectives.", "match": "req_smaller", "cov": "full", "reason": "The control has objectives set at relevant functions and approved with resources, which requires agreement by senior stakeholders.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-GOV-12", "title": "Planned changes to the program", "domain": "GOV", "theme": "", "goal": "The organization carries out any needed change to its security management system in a planned way.", "owner": "CISO", "imp": "medium", "origin": "iso", "note": "Clause only. Covers planning of changes.", "statement": "Any needed change to the security management system is carried out in a planned way. Each change is recorded with its purpose, effects, resources and owner, and is approved before it is made. Proof is a change record or plan.", "why": "Unplanned changes to the program can break processes and leave gaps no one notices.", "how": "Ask for a recent change to the program, such as a new process or scope shift, and how it was planned and approved. Example probe: \"Walk me through the last change you made to how the program works.\"", "q": "Does your organization carry out needed changes to its security management system in a planned way?", "evidence": "Change records or plans for program changes; approval records; impact notes; records from the current review period", "good": "Changes are proposed with a reason, impact and owner and are approved before being made. Records show the change was completed and communicated.", "test": "Obtain the list of changes to the program in the period. Sample three and check for purpose, impact review, approval and completion. Pass if all sampled changes have these records.", "risk": "Ad hoc changes introduce gaps or contradictions into the program.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C6.3", "ref": "Clause 6.3", "atom": "ISO.C6.3-a", "text": "Carry out needed changes to the security management system in a planned way.", "match": "equal", "cov": "full", "reason": "Same ask: planned changes to the system.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-GOV-13", "title": "Resources for the program", "domain": "GOV", "theme": "", "goal": "The organization determines and provides the resources needed to establish, run, maintain and improve its security program.", "owner": "Top Management", "imp": "medium", "origin": "iso", "note": "Clause only.", "statement": "The resources needed to establish, run, maintain and improve the security program are determined and provided, including people, budget and tools. Resource needs are assessed on a defined cycle and when scope or risk changes. Proof is an approved budget and staffing plan.", "why": "An under-resourced program cannot deliver its commitments, whatever the policies say.", "how": "Ask how the security budget and staffing are decided and who confirms they are enough. Example probe: \"When did you last ask for more resources, what was decided, and what was the effect?\"", "q": "Does your organization provide the resources its security program needs?", "evidence": "Approved security budget; staffing plan or headcount record; resource request and decision records; records from the current review period", "good": "Resource needs are linked to objectives and risks, approved by top management and tracked. Gaps are reported, and decisions on requests are recorded.", "test": "Obtain the budget, staffing plan and resource requests. Check approvals against objectives. Pass if resources are approved, requests were decided and recorded, and any gap has a documented decision.", "risk": "The program cannot meet its objectives, and known work goes undone for lack of people or tools.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C5.1", "ref": "Clause 5.1", "atom": "ISO.C5.1-c", "text": "Make sure the resources the program needs are available.", "match": "equal", "cov": "full", "reason": "Resourcing is the whole of GOV-13.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.1", "ref": "Clause 7.1", "atom": "ISO.C7.1-a", "text": "Determine and provide the resources needed to establish, run, maintain and improve the program.", "match": "equal", "cov": "full", "reason": "Same ask: determine and provide resources.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.03", "ref": "GV.RR-03", "atom": "NIST.GV.RR.03-a", "text": "The organization plans and leadership approves a cybersecurity budget or resourcing tied to its risk strategy.", "match": "equal", "cov": "full", "reason": "Determining and providing resources for the program is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.03", "ref": "GV.RR-03", "atom": "NIST.GV.RR.03-b", "text": "Management reviews whether people with security duties have the resources and authority they need.", "match": "req_smaller", "cov": "full", "reason": "Providing needed resources includes checking the people responsible have them.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-GOV-14", "title": "Security communication plan", "domain": "GOV", "theme": "", "goal": "The organization decides what security matters it communicates, when, to whom and how, inside and outside the organization, and follows that plan.", "owner": "CISO", "imp": "medium", "origin": "iso", "note": "Clause only. Narrowed in round 2: incident and recovery communication moved to UC-INC-43.", "statement": "A communication plan sets which security matters are communicated, when, to whom and how, for audiences inside and outside the organization. Examples are policy changes, performance results, audit outcomes and requirements passed to suppliers. The plan is reviewed on a defined cycle, and sent messages show it is followed.", "why": "Without a plan, the right people do not hear about security matters at the right time.", "how": "Ask who gets told what about security, and how outside parties such as regulators and customers are reached. Example probe: \"Show me your communication plan and the last message sent under it.\" Incident communication is covered by its own controls, so ask about everyday and program communication here.", "q": "Does your organization have a plan for which security matters it communicates, to whom, when and how?", "evidence": "Security communication plan or matrix; examples of internal and external communications; review records for the last cycle", "good": "A plan lists topics, audiences, timing, senders and channels for internal and external communication. Examples show it is followed and reviewed.", "test": "Obtain the communication plan. Sample three entries and find a sent example for each. Pass if all sampled entries show the planned audience and channel was used at the planned time.", "risk": "Important security information is missed or sent to the wrong people, delaying action.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C7.4", "ref": "Clause 7.4", "atom": "ISO.C7.4-a", "text": "Decide what internal and external security communication is needed, when, with whom and how.", "match": "equal", "cov": "full", "reason": "Same ask: a defined communication plan.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": "Narrowed (D14) to the general communication plan; incident and recovery communication moved to UC-INC-43."}, {"id": "UC-GOV-15", "title": "Documented information control", "domain": "GOV", "theme": "", "goal": "The organization keeps the documented information its security program needs, and controls how it is created, approved, updated, distributed, protected, retained and disposed of.", "owner": "CISO", "imp": "medium", "origin": "iso", "note": "Clause only.", "statement": "The documented information the security program needs is kept, and how it is created, approved, updated, distributed, protected, retained and disposed of is controlled. Each document has an identifier, owner, version and review date. Documents of outside origin that the program needs are identified and controlled in the same way.", "why": "Uncontrolled documents lead to staff using outdated rules and lost or leaked records.", "how": "Ask how documents are numbered, approved and stored, and how old versions are handled. Example probe: \"Pick one procedure and show me its version history and who approved the current one.\"", "q": "Does your organization control the documented information its security program needs, from creation through disposal?", "evidence": "Document control procedure; document register with versions and owners; approval records; access and retention settings; examples of outside documents that are controlled", "good": "A document register lists identifier, owner, version, approval and review date. Access and retention rules are applied, old versions are removed from use, and outside documents are tracked.", "test": "Obtain the document register. Sample five documents and check identification, approval, version, access and retention. Pass if all sampled documents meet these tests.", "risk": "Staff rely on outdated or unapproved documents, and sensitive records are exposed or lost.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C7.5", "ref": "Clause 7.5", "atom": "ISO.C7.5-a", "text": "Include the documented information the standard requires and the organization judges necessary.", "match": "equal", "cov": "full", "reason": "Required documentation is the first element of GOV-15.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.5", "ref": "Clause 7.5", "atom": "ISO.C7.5-b", "text": "When creating or updating documents, set identification, format, review and approval.", "match": "equal", "cov": "full", "reason": "Creation and approval rules are in GOV-15.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.5", "ref": "Clause 7.5", "atom": "ISO.C7.5-c", "text": "Control documents so they are available, protected, distributed, stored, version controlled, retained and disposed of.", "match": "equal", "cov": "full", "reason": "Document control is in GOV-15.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.5", "ref": "Clause 7.5", "atom": "ISO.C7.5-d", "text": "Identify and control documents of external origin that the program needs.", "match": "equal", "cov": "full", "reason": "External documents are in GOV-15.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-GOV-16", "title": "Security processes planned and run", "domain": "GOV", "theme": "", "goal": "The organization plans, runs and controls the processes needed to meet its security requirements against set criteria, and keeps records showing they ran as planned.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only. Narrowed in round 2: change control re-mapped to UC-SDC-09, externally provided processes to UC-SUP-05.", "statement": "The processes needed to meet security requirements and carry out planned actions are planned, run and controlled against set criteria. Records show the processes ran as planned. These records are the proof.", "why": "Plans mean little if day-to-day operation is not controlled and nothing shows the work was done as intended.", "how": "Ask how operational security processes are defined and what criteria they run against. Then ask for records of one run. Example probe: \"Show me the criteria for this process and the record that it ran as planned last quarter.\"", "q": "Does your organization run its security processes against set criteria and keep records that they ran as planned?", "evidence": "Documented security processes with their criteria; operational process records showing runs as planned. Cover the current review period.", "good": "Each process has defined criteria and a plan for how it runs. Records show it ran as planned, and gaps against the criteria are noticed and acted on.", "test": "Sample three operational security processes from the current review period. Check each has set criteria and records showing it ran as planned. Pass if every sampled process has criteria and a record that it ran as planned.", "risk": "Controls exist on paper but processes drift, and nobody can show the work was done as planned.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C8.1", "ref": "Clause 8.1", "atom": "ISO.C8.1-a", "text": "Plan, implement and control the processes needed to meet security requirements and carry out the planned actions, setting criteria for the processes.", "match": "equal", "cov": "full", "reason": "Same ask: planned and controlled processes.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C8.1", "ref": "Clause 8.1", "atom": "ISO.C8.1-b", "text": "Keep documented information giving confidence that processes ran as planned.", "match": "equal", "cov": "full", "reason": "Process evidence is in GOV-16.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "Split (D11, D19): narrowed to processes planned and run; change control maps to UC-SDC-09, outside processes to UC-SUP-05."}, {"id": "UC-GOV-17", "title": "Performance monitoring and measurement", "domain": "GOV", "theme": "", "goal": "The organization decides what security performance to measure and how (valid, comparable methods), when and by whom it is measured and analyzed, evaluates the results and keeps evidence.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "What security performance to measure is decided, with methods that give valid, comparable and reproducible results, and when and by whom it is measured. When and by whom results are analyzed is also set. Results and the effectiveness of the program are evaluated on a defined cycle, and evidence is kept. Proof is a metrics list, reports and review notes.", "why": "Without measurement, the organization cannot tell whether its security is working or getting worse.", "how": "Ask which measures the organization tracks and what decisions have come from them. Check that measures reach specific areas, for example secure development. Example probe: \"Which security metric moved last quarter, and what did you do about it?\"", "q": "Does your organization measure and evaluate its security performance?", "evidence": "Metrics definitions with methods and owners; performance reports; evaluation notes or dashboards; records from the current review period", "good": "Each metric has a definition, method, owner and cycle. Reports are produced on schedule, assessed against targets and used to drive action.", "test": "Obtain the metrics list and reports for the period. Sample three metrics and check definition, method, collection, analysis and evaluation records, including who and when. Pass if every sampled metric has all of them and was reported on its cycle.", "risk": "Problems stay hidden until an incident, and leaders have no basis for decisions.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C9.1", "ref": "Clause 9.1", "atom": "ISO.C9.1-a", "text": "Determine what to monitor and measure, and the methods, which must give valid, comparable and reproducible results.", "match": "equal", "cov": "full", "reason": "Measurement design is the first element of GOV-17.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.1", "ref": "Clause 9.1", "atom": "ISO.C9.1-b", "text": "Determine when monitoring is done, when results are analyzed, and who does each; then evaluate security performance and the effectiveness of the program.", "match": "equal", "cov": "full", "reason": "Timing and responsibility for analysis and the evaluation itself are in GOV-17.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.1", "ref": "Clause 9.1", "atom": "ISO.C9.1-c", "text": "Keep evidence of the results.", "match": "equal", "cov": "full", "reason": "Evidence retention is in GOV-17.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OV.03", "ref": "GV.OV-03", "atom": "NIST.GV.OV.03-a", "text": "The organization defines indicators for measuring risk management performance.", "match": "equal", "cov": "full", "reason": "Deciding what to measure and how is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.06", "ref": "PR.PS-06", "atom": "NIST.PR.PS.06-d", "text": "The organization tracks and reports secure development performance measures.", "match": "req_bigger", "cov": "partial", "reason": "The control measures security performance in general; it does not require a development measure.", "primary": false, "rem": "", "imm": "Secure development measures are one kind of metric in the program's measurement and are sampled in the same test; the consultant prompts for them."}], "nrec": 3, "r2": "Soft NIST ask (D09): secure development measures map here as partial, and how_to_ask prompts for them."}, {"id": "UC-GOV-18", "title": "Management review", "domain": "GOV", "theme": "", "goal": "Top management reviews the security program at planned intervals using defined inputs and records decisions on improvement and needed changes.", "owner": "Top Management", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "Top management reviews the security program at planned intervals. The review covers the status of past actions, changes in issues and in the needs of interested parties, performance trends (nonconformities, measurements, audit results and objectives), feedback from interested parties, risk results and treatment status, and improvement opportunities. Decisions on improvement and needed changes are recorded and tracked.", "why": "A review that skips inputs or leaves no decisions fails to steer the program or correct it.", "how": "Ask for the last management review pack and minutes. Check the inputs covered and the decisions taken. Example probe: \"Show me the decisions from your last management review and where each stands.\"", "q": "Does your top management review the security program at planned intervals?", "evidence": "Management review agenda and inputs pack; signed minutes with decisions; action tracker; reviews from the last two cycles", "good": "The review happens on schedule with top management present. All defined inputs are covered, decisions on improvement and changes are recorded with owners, and earlier actions are followed up.", "test": "Obtain minutes of the last two reviews. Check each covers all defined inputs and has recorded decisions. Pass if both reviews occurred on plan with all inputs and each decision has an owner.", "risk": "Leaders lose sight of program health, and known problems are never decided on.", "applies": "", "type": "detective", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C9.3", "ref": "Clause 9.3", "atom": "ISO.C9.3-a", "text": "Have top management review the program at planned intervals.", "match": "equal", "cov": "full", "reason": "Same ask: scheduled management review.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.3", "ref": "Clause 9.3", "atom": "ISO.C9.3-b", "text": "Cover in the review the status of past actions, changes in issues and in interested-party needs, performance trends (nonconformities, measurements, audits, objectives), feedback from interested parties, risk results and treatment status, and improvement opportunities.", "match": "equal", "cov": "full", "reason": "Defined review inputs are in GOV-18.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C9.3", "ref": "Clause 9.3", "atom": "ISO.C9.3-c", "text": "Record decisions on improvement and needed changes and keep evidence.", "match": "equal", "cov": "full", "reason": "Review outputs and evidence are in GOV-18.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RM.01", "ref": "GV.RM-01", "atom": "NIST.GV.RM.01-c", "text": "The organization reviews the objectives on a schedule and after major change.", "match": "req_smaller", "cov": "full", "reason": "Management review takes objective achievement as input and records decisions on change.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.01", "ref": "GV.RR-01", "atom": "NIST.GV.RR.01-b", "text": "Leadership reviews cybersecurity risk on a regular basis.", "match": "equal", "cov": "full", "reason": "Top management reviewing the program at planned intervals is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OV.01", "ref": "GV.OV-01", "atom": "NIST.GV.OV.01-a", "text": "The organization defines a process for leadership to review the outcomes of the risk strategy.", "match": "equal", "cov": "full", "reason": "A defined, planned top-management review process is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OV.01", "ref": "GV.OV-01", "atom": "NIST.GV.OV.01-b", "text": "Leadership reviews strategy outcomes and records a decision to adjust or confirm direction.", "match": "equal", "cov": "full", "reason": "Review with recorded decisions on improvement and change is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OV.02", "ref": "GV.OV-02", "atom": "NIST.GV.OV.02-a", "text": "The strategy review checks that the strategy still covers current requirements and risks.", "match": "req_smaller", "cov": "full", "reason": "Management review inputs include whether the program still fits requirements and risks.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OV.02", "ref": "GV.OV-02", "atom": "NIST.GV.OV.02-b", "text": "The review considers audit findings and significant incidents and records the resulting adjustments.", "match": "req_smaller", "cov": "full", "reason": "Defined inputs to the review include audit results and incident outcomes.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OV.03", "ref": "GV.OV-03", "atom": "NIST.GV.OV.03-b", "text": "The organization reports these metrics to senior leadership.", "match": "req_smaller", "cov": "full", "reason": "Performance results are an input to the management review that top management sees.", "primary": false, "rem": "", "imm": ""}], "nrec": 6, "r2": ""}, {"id": "UC-GOV-19", "title": "Continual improvement", "domain": "GOV", "theme": "", "goal": "The organization continually improves the suitability, adequacy and effectiveness of its security program.", "owner": "CISO", "imp": "medium", "origin": "iso", "note": "Clause only. Kept apart from corrective action (GOV-20) because the test differs.", "statement": "The suitability, adequacy and effectiveness of the security program are continually improved. Improvement opportunities come from reviews, audits, incidents and measures. They are logged, prioritized, owned and tracked to completion.", "why": "Programs that do not improve fall behind changing threats and business needs.", "how": "Ask for the improvement log and examples of improvements made. Look for source, owner and outcome. Example probe: \"Name two improvements made this year and what triggered them.\"", "q": "Does your organization continually improve its security program?", "evidence": "Improvement log or register; completed improvement records; links to reviews, audits or incidents that triggered them; records from the current review period", "good": "An improvement log records each idea with source, owner, priority and status. Completed items show the benefit, and trends show the program getting better.", "test": "Obtain the improvement log. Sample three completed items and check source, owner and outcome. Pass if each sampled item is traceable from source to completion with a recorded result.", "risk": "The program stagnates, and the same weaknesses recur year after year.", "applies": "", "type": "corrective", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.C10.1", "ref": "Clause 10.1", "atom": "ISO.C10.1-a", "text": "Continually improve the suitability, adequacy and effectiveness of the program.", "match": "equal", "cov": "full", "reason": "Same ask: continual improvement.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OV.03", "ref": "GV.OV-03", "atom": "NIST.GV.OV.03-c", "text": "The organization records needed adjustments with owners and traces improvements to lessons learned or assessments.", "match": "req_smaller", "cov": "full", "reason": "Recording needed adjustments with owners and tying improvements to lessons is continual improvement.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.01", "ref": "ID.IM-01", "atom": "NIST.ID.IM.01-b", "text": "Each evaluation produces a list of improvements with owners.", "match": "req_smaller", "cov": "full", "reason": "Continual improvement turns evaluation results into owned improvements.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.02", "ref": "ID.IM-02", "atom": "NIST.ID.IM.02-c", "text": "The organization assigns owners to those improvements and tracks them.", "match": "req_smaller", "cov": "full", "reason": "Tracking improvement actions with owners is continual improvement.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.03", "ref": "ID.IM-03", "atom": "NIST.ID.IM.03-b", "text": "The organization turns lessons learned into updated policies, processes or procedures.", "match": "req_smaller", "cov": "full", "reason": "Updating processes from lessons learned is continual improvement.", "primary": false, "rem": "", "imm": ""}], "nrec": 5, "r2": ""}, {"id": "UC-GOV-20", "title": "Nonconformity and corrective action", "domain": "GOV", "theme": "", "goal": "The organization reacts to nonconformities, corrects them, removes their causes, checks the fix worked and keeps records.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "Each nonconformity is controlled and corrected, and its consequences are dealt with. Whether to remove the cause is evaluated, action is taken, and a review confirms the action worked and changes the program if needed. All nonconformities and actions are recorded in a log.", "why": "Fixing symptoms without causes lets the same failures return, and untracked findings are forgotten.", "how": "Ask for the corrective action log and pick items from audits and incidents. Check root cause and effectiveness checks. Example probe: \"Show me a finding from an audit and the evidence its fix worked.\"", "q": "Does your organization correct nonconformities and remove their causes?", "evidence": "Nonconformity and corrective action log; root cause analyses; effectiveness check records; closure approvals; records from the current review period", "good": "Each nonconformity is logged with the correction, cause analysis, action, owner and due date. Closure needs a check that the fix worked, and overdue items are escalated.", "test": "Obtain the corrective action log for the period. Sample five closed items and check correction, root cause, action and effectiveness review. Pass if all sampled items are complete with a recorded effectiveness check.", "risk": "Findings recur and audit issues stay open with no accountable fix.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C10.2", "ref": "Clause 10.2", "atom": "ISO.C10.2-a", "text": "React to a nonconformity by controlling and correcting it and deali
