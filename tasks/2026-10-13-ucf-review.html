"sources": [{"fw": "nist_csf", "rec": "NIST.ID.RA.09", "ref": "ID.RA-09", "atom": "NIST.ID.RA.09-a", "text": "The organization checks that hardware and software are authentic before acquiring them.", "match": "equal", "cov": "full", "reason": "No base control checks hardware and software authenticity before acquisition.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.09", "ref": "ID.RA-09", "atom": "NIST.ID.RA.09-b", "text": "The organization checks the integrity of software, for example by signature or hash, before use.", "match": "equal", "cov": "full", "reason": "Integrity checks such as signatures or hashes before use are in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.05", "ref": "PR.PS-05", "atom": "NIST.PR.PS.05-c", "text": "The organization checks the source and integrity of new software before installation.", "match": "equal", "cov": "full", "reason": "The slot holds authenticity and integrity checks before software is put into use.", "primary": false, "rem": "UC-NET-08", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-OPS-01", "title": "Event logging", "domain": "OPS", "theme": "Technological", "goal": "The organization produces, collects centrally and retains logs of defined security-relevant events for each system type.", "owner": "Security Operations Lead", "imp": "high", "origin": "iso", "note": "Split from logging record: generation and retention. Protection (OPS-02) has a different test.", "statement": "The security-relevant events each type of system must log, such as authentication, privileged actions, errors and security events, and how long logs are kept, are defined. Systems produce those logs and forward them to central storage, and the source list is kept current. This gives the organization a reliable record for detection and investigation. Proof is the logging standard, the source list and sample logs.", "why": "Without defined and centrally collected logs, incidents cannot be detected or reconstructed. Consultants check that logging is defined by system type and actually arrives in one place.", "how": "Ask what must be logged for each system type, where logs go and how long they are kept. Example probe: \"Pick a production application and show me its sign-in and admin activity in the central log store.\"", "q": "Does your organization log defined security-relevant events for each system type and collect them in central storage?", "evidence": "Logging standard stating events and retention per system type; central log source list; sample logs from sampled systems; retention settings. Cover the last audit period.", "good": "A standard states events and retention for each system type. The central log platform shows a current source list covering in-scope systems, and sample logs contain the defined events.", "test": "Read the logging standard. Sample in-scope systems, check each appears in the central source list and pull sample logs for the defined events. Pass if sampled systems forward the required events and retention is set as the standard states.", "risk": "Events go unrecorded, so attacks are missed and cannot be reconstructed afterwards.", "applies": "", "type": "detective", "freq": "continuous", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-c", "text": "Retain personal data, traffic data and processing logs for at least the minimum period the Rules require before erasure.", "match": "overlap", "cov": "partial", "reason": "OPS-01 retains security logs but sets no minimum for processing and traffic logs of personal data.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.1", "ref": "Section 8(5)", "atom": "CH2.SECURITY.1-a", "text": "Implement reasonable technical safeguards to protect personal data and prevent breaches.", "match": "overlap", "cov": "partial", "reason": "Event logging is one technical safeguard, but access to personal data is not specifically logged or reviewed.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.15", "ref": "Annex A.8.15", "atom": "ISO.A8.15-a", "text": "Define which events are logged for each system type and how long logs are kept.", "match": "equal", "cov": "full", "reason": "The logging standard is the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.15", "ref": "Annex A.8.15", "atom": "ISO.A8.15-b", "text": "Produce the defined logs and forward them to central storage.", "match": "equal", "cov": "full", "reason": "Production and central collection are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.04", "ref": "PR.PS-04", "atom": "NIST.PR.PS.04-a", "text": "The organization defines which events must be logged for each system type.", "match": "equal", "cov": "full", "reason": "Defined security-relevant events logged for each system type is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.04", "ref": "PR.PS-04", "atom": "NIST.PR.PS.04-b", "text": "The organization sends logs from systems and services to a central platform for monitoring.", "match": "req_smaller", "cov": "full", "reason": "Collecting logs centrally is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.04", "ref": "PR.PS-04", "atom": "NIST.PR.PS.04-c1", "text": "The organization retains logs for a defined period.", "match": "req_smaller", "cov": "full", "reason": "The logging standard sets how long logs are kept.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.03", "ref": "DE.AE-03", "atom": "NIST.DE.AE.03-b", "text": "The organization lists the log sources feeding its central platform and includes critical systems.", "match": "req_smaller", "cov": "full", "reason": "Collecting logs centrally for each system type defines the sources feeding the platform.", "primary": false, "rem": "", "imm": ""}], "nrec": 5, "r2": "Gained a mapped ask (D09): NIST log retention, split from a retention-and-protection ask. Text unchanged."}, {"id": "UC-OPS-02", "title": "Log protection", "domain": "OPS", "theme": "Technological", "goal": "The organization protects logs from tampering and unauthorized access, including from administrators of the logged systems.", "owner": "Security Operations Lead", "imp": "high", "origin": "iso", "note": "Split from logging record.", "statement": "Logs are protected from tampering and unauthorized access, including from administrators of the systems being logged. Access to log storage is restricted to those who need it for their work, and logs sit in write-once or otherwise tamper-resistant storage. Storage configuration and access lists show the protection. This keeps the record trustworthy during an investigation.", "why": "An intruder or insider with administrator rights can erase their traces if logs sit on the same system. Consultants test whether administrators of logged systems can alter or delete their own logs.", "how": "Ask who can read, change or delete logs and whether system administrators can touch their own logs. Example probe: \"Can the administrator of this server delete the logs it sent to your central store?\"", "q": "Does your organization protect logs from tampering and unauthorized access, including by system administrators?", "evidence": "Log storage configuration showing restricted access and write-once or tamper-resistant settings; access list for the log platform; administrator separation statement. Cover the current configuration and the last audit period.", "good": "Logs are stored apart from the systems that generate them, with access limited to named roles. Write-once or equivalent settings prevent deletion, and administrators of logged systems cannot alter their own logs.", "test": "Inspect the log storage configuration and access list. Check whether sampled administrators of logged systems have rights to modify or delete the central logs. Pass if access is restricted, tamper protection is on, and no sampled system administrator can alter its own logs.", "risk": "Attackers or insiders erase or alter logs, hiding their activity and destroying evidence.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.15", "ref": "Annex A.8.15", "atom": "ISO.A8.15-c", "text": "Protect logs from tampering and unauthorized access, including by administrators.", "match": "equal", "cov": "full", "reason": "Log protection is the whole of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.04", "ref": "PR.PS-04", "atom": "NIST.PR.PS.04-c2", "text": "The organization protects retained logs from alteration.", "match": "req_smaller", "cov": "full", "reason": "Protecting logs from alteration is the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-OPS-03", "title": "Monitoring for anomalous activity", "domain": "OPS", "theme": "Technological", "goal": "The organization monitors networks, systems and applications for anomalous behavior, including unauthorized devices and wireless access points, and raises alerts for analysis.", "owner": "Security Operations Lead", "imp": "high", "origin": "iso", "note": "Also carries the log analysis atom of the logging record. Alert analysis, correlation and routing sit in UC-OPS-41.", "statement": "What monitoring covers across networks, systems, applications, user activity, vendor remote access and the audit logs of cloud and SaaS services, what counts as anomalous behavior and who receives alerts are defined. Monitoring includes detecting unauthorized devices and wireless access points that connect to the network. Alert rules run and periodic log reviews take place, and each review is recorded. Vendor remote-access sessions are logged and reviewed. Alerts that warrant it are passed on for analysis and, if they point to an incident, to the incident process. This lets the organization catch suspicious activity early. Proof is the monitoring standard, alert rules, review records and linked incident tickets.", "why": "Logs nobody reads and alerts nobody triages let breaches run for months. Consultants look for evidence that alerts become decisions and that real ones reach the incident process.", "how": "Ask what is monitored, what rules raise alerts, who triages and how a serious alert becomes an incident. Example probe: \"Show me the last alert you escalated to an incident and the path it took.\"", "q": "Does your organization monitor its environment for anomalous behavior and raise alerts for analysis?", "evidence": "Monitoring standard stating coverage, anomaly criteria and who receives alerts; alert rules; network access or wireless scan reports showing unauthorized devices detected; alert triage records; log review records; incident tickets linked to alerts. Cover the last audit period.", "good": "Monitoring covers all in-scope networks, systems, applications, user activity and cloud and SaaS audit logs with defined alert rules and named recipients. Vendor remote-access sessions are logged and reviewed. Unauthorized devices and wireless access points are detected and raise alerts. Periodic log reviews are recorded and signed off, and alerts that point to an incident link to incident tickets with an owner.", "test": "Read the monitoring standard. Sample alerts and log review records from the period and trace each to a recorded outcome. Sample vendor remote-access sessions from the period and check each was logged and reviewed. Pass if the monitoring covers the in-scope systems, user activity and cloud and SaaS audit logs, detects unauthorized devices and wireless access points, sampled vendor sessions were logged and reviewed, and sampled alerts show a recorded outcome, with those that warranted it linked to the incident log.", "risk": "Attacks and misuse go unnoticed because nobody reviews or acts on the available signals.", "applies": "", "type": "detective", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.15", "ref": "Annex A.8.15", "atom": "ISO.A8.15-d", "text": "Analyze logs, through alert rules or periodic review, and record the review.", "match": "req_smaller", "cov": "full", "reason": "OPS-03 analyzes logs and alerts for anomalies, which covers this ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.16", "ref": "Annex A.8.16", "atom": "ISO.A8.16-a", "text": "Define what monitoring covers, what is anomalous and who responds.", "match": "equal", "cov": "full", "reason": "Same ask: monitoring for anomalous behavior.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.16", "ref": "Annex A.8.16", "atom": "ISO.A8.16-b", "text": "Triage alerts and pass those warranting it to the incident process.", "match": "equal", "cov": "full", "reason": "Triage and hand-off are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.01", "ref": "DE.CM-01", "atom": "NIST.DE.CM.01-a", "text": "The organization defines which networks and network services it monitors for adverse events.", "match": "req_smaller", "cov": "full", "reason": "Monitoring networks for anomalous behavior requires deciding which networks and services are covered.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.01", "ref": "DE.CM-01", "atom": "NIST.DE.CM.01-b", "text": "The organization runs network monitoring tools and reviews their alerts.", "match": "equal", "cov": "full", "reason": "Active network monitoring with alerts reviewed is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.01", "ref": "DE.CM-01", "atom": "NIST.DE.CM.01-c", "text": "The organization detects connections from unauthorized devices and rogue wireless networks.", "match": "req_smaller", "cov": "full", "reason": "Detecting unauthorized devices and rogue wireless is a form of anomalous network behavior the control monitors.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.03", "ref": "DE.CM-03", "atom": "NIST.DE.CM.03-a", "text": "The organization defines how it monitors personnel activity and technology use.", "match": "req_smaller", "cov": "full", "reason": "Monitoring systems and applications for anomalous behavior includes defining user and privileged activity to watch.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.03", "ref": "DE.CM-03", "atom": "NIST.DE.CM.03-b", "text": "The organization generates and reviews alerts on anomalous user activity.", "match": "equal", "cov": "full", "reason": "Alerting on anomalous activity and analyzing the alerts is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.06", "ref": "DE.CM-06", "atom": "NIST.DE.CM.06-a", "text": "The organization defines how it monitors external service provider activity, such as vendor remote access.", "match": "req_smaller", "cov": "full", "reason": "Monitoring systems and networks for anomalous behavior includes supplier access paths once defined.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.06", "ref": "DE.CM-06", "atom": "NIST.DE.CM.06-b", "text": "The organization logs and reviews vendor remote-access sessions.", "match": "req_smaller", "cov": "full", "reason": "Logging and reviewing vendor remote sessions is monitoring of a defined access path.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.06", "ref": "DE.CM-06", "atom": "NIST.DE.CM.06-c", "text": "The organization collects and monitors audit logs from the cloud and SaaS services it uses.", "match": "req_smaller", "cov": "full", "reason": "Collecting and analyzing cloud and SaaS audit logs is the monitoring the control performs.", "primary": false, "rem": "", "imm": ""}], "nrec": 5, "r2": "Soft NIST ask (D09): monitoring now covers unauthorized devices and wireless access points."}, {"id": "UC-OPS-04", "title": "Vulnerability management", "domain": "OPS", "theme": "Technological", "goal": "The organization gathers vulnerability information, scans systems, assesses exposure and fixes findings within set deadlines or formally accepts the risk.", "owner": "Security Operations Lead", "imp": "critical", "origin": "iso", "note": "Split from vulnerability record: scanning and fixing. Penetration testing (OPS-05) has a different test.", "statement": "A vulnerability management procedure names the sources of vulnerability information, how exposure is assessed and the fix deadlines by severity. In-scope systems are scanned, or equivalent assessments are run, on the cycle the procedure sets. Critical and high findings are fixed within the deadlines or carry a recorded risk acceptance. This closes known weaknesses before they are exploited. Proof is the procedure, scan reports and remediation tracking.", "why": "Known, unpatched weaknesses are the most common way into an organization. Consultants test both that scans run and that findings are fixed or formally accepted.", "how": "Ask about scan coverage and frequency, who sets fix deadlines and how overdue items are handled. Example probe: \"Show me your open critical findings and how many are past their deadline.\"", "q": "Does your organization scan its systems for vulnerabilities and fix findings within set deadlines or formally accept the risk?", "evidence": "Vulnerability management procedure with fix deadlines by severity; scan reports; remediation tracking export; risk acceptance records for overdue items. Cover the last two scan cycles.", "good": "A procedure sets sources, assessment method and deadlines by severity. Scans cover all in-scope systems on schedule, and critical and high findings show fixes within the deadline or an approved acceptance.", "test": "Read the procedure for deadlines. Confirm scans ran on the stated cycle for in-scope systems. Sample critical and high findings from the period and trace each to a fix date or a risk acceptance. Pass if the sampled findings met the deadline or have an approved acceptance.", "risk": "Known weaknesses stay open and attackers exploit them with readily available tools.", "applies": "", "type": "preventive", "freq": "monthly", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.8", "ref": "Annex A.8.8", "atom": "ISO.A8.8-a", "text": "Define sources of vulnerability information, how exposure is assessed and fix deadlines by severity.", "match": "equal", "cov": "full", "reason": "Same ask: a vulnerability management process.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.8", "ref": "Annex A.8.8", "atom": "ISO.A8.8-b", "text": "Run vulnerability scans or equivalent assessments at the set frequency.", "match": "equal", "cov": "full", "reason": "Scanning is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.8", "ref": "Annex A.8.8", "atom": "ISO.A8.8-c", "text": "Fix critical and high findings within deadlines or record a risk acceptance.", "match": "equal", "cov": "full", "reason": "Deadline-based fixing is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.01", "ref": "ID.RA-01", "atom": "NIST.ID.RA.01-a", "text": "The organization documents a procedure for identifying, validating and recording vulnerabilities in assets.", "match": "equal", "cov": "full", "reason": "A vulnerability procedure that gathers, assesses and fixes findings is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.01", "ref": "ID.RA-01", "atom": "NIST.ID.RA.01-b", "text": "The organization scans or assesses in-scope assets for vulnerabilities on a regular basis.", "match": "req_smaller", "cov": "full", "reason": "Scanning systems is part of the control, and coverage of in-scope assets is its test.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.01", "ref": "ID.RA-01", "atom": "NIST.ID.RA.01-c", "text": "The organization records each vulnerability in a tracker with a status and an owner.", "match": "req_smaller", "cov": "full", "reason": "Fixing findings within deadlines or formally accepting them needs a tracker with status and owner.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.02", "ref": "PR.PS-02", "atom": "NIST.PR.PS.02-a", "text": "The organization sets patch deadlines by severity and applies patches within them.", "match": "req_smaller", "cov": "full", "reason": "Fixing findings within set deadlines covers severity-based patch deadlines.", "primary": true, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-OPS-05", "title": "Penetration testing", "domain": "OPS", "theme": "Technological", "goal": "The organization has internet-facing systems penetration tested at least yearly and tracks findings to closure.", "owner": "Security Operations Lead", "imp": "high", "origin": "iso", "note": "Split from vulnerability record.", "statement": "Internet-facing systems are penetration tested at least every 12 months, using qualified testers. Findings go into a tracker with owners and due dates and are followed to closure, with retests where needed. This shows how an attacker would see the organization from outside. Proof is the penetration test report and the findings tracker.", "why": "Scanners miss logic flaws and chained weaknesses that a tester finds. Consultants confirm both that the test happened on time and that findings were closed rather than filed.", "how": "Ask when the last test was, what it covered and how many findings are still open. Example probe: \"Show me the last penetration test report and the status of its high findings.\"", "q": "Does your organization have its internet-facing systems penetration tested at least yearly and track the findings to closure?", "evidence": "Penetration test reports for internet-facing systems; scope statement; findings tracker with owners, dates and closure; retest results. Cover the last two annual tests.", "good": "Every internet-facing system is in scope of a test at least every 12 months. Findings are rated, owned and closed with retest evidence, and exceptions are accepted by management.", "test": "Confirm the date of the latest penetration test covering internet-facing systems falls within the last 12 months. Sample findings from the report and trace each to closure or an approved acceptance. Pass if the test is within 12 months and sampled findings are closed or accepted.", "risk": "Exploitable flaws in internet-facing systems stay hidden until an attacker finds them.", "applies": "", "type": "detective", "freq": "annual", "ks": "base: penetration test of internet-facing systems at least every 12 months", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.8", "ref": "Annex A.8.8", "atom": "ISO.A8.8-d", "text": "Penetration test internet-facing systems within the last 12 months and track findings to closure.", "match": "equal", "cov": "full", "reason": "Penetration testing is the whole of this control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-OPS-06", "title": "Authorization of assurance testing on live systems", "domain": "OPS", "theme": "Technological", "goal": "The organization plans audit and assurance tests on operational systems and has responsible management approve them in advance.", "owner": "Security Operations Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "Audit and assurance tests on live systems, such as penetration tests and audit queries, are planned and approved in advance by responsible management. A signed authorization or rules-of-engagement record exists for each test before it starts. This prevents tests from disrupting operations or being mistaken for an attack. Proof is the authorization procedure and the signed records.", "why": "Unapproved testing on live systems can cause outages or trigger false incident responses, and leaves no accountability. Consultants check that approval comes before the test.", "how": "Ask who approves tests on live systems and what the approval contains. Example probe: \"Show me the signed authorization for the last test run against production.\"", "q": "Does your organization require management approval before audit and assurance tests are run on live systems?", "evidence": "Procedure for authorizing tests on live systems; signed rules of engagement or authorization records; test plans with scope and timing. Cover tests in the last audit period.", "good": "A procedure requires planning and approval before any test on live systems. Each test has a signed record with scope, timing, permitted actions and contact points, dated before the test began.", "test": "List tests run on live systems in the period and sample some. Check each has a signed authorization dated before it started. Pass if every sampled test has an approval from responsible management that preceded it.", "risk": "Tests on live systems disrupt service or are run without accountability.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.34", "ref": "Annex A.8.34", "atom": "ISO.A8.34-a", "text": "Require audit and assurance tests on operational systems to be planned and approved by responsible management.", "match": "equal", "cov": "full", "reason": "Same ask: planned and agreed tests.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.34", "ref": "Annex A.8.34", "atom": "ISO.A8.34-b", "text": "Keep authorization or rules-of-engagement records for tests on live systems.", "match": "equal", "cov": "full", "reason": "Authorization records are the control's proof.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-OPS-07", "title": "Malware protection", "domain": "OPS", "theme": "Technological", "goal": "The organization defines, deploys and keeps current protection against malware on in-scope systems.", "owner": "Security Operations Lead", "imp": "critical", "origin": "iso", "note": "Malware awareness atom is carried by PPL-03.", "statement": "The malware protection required for each system type, such as endpoint detection, and email and download scanning, is defined. It is deployed and kept installed, active and up to date on in-scope systems, with exceptions justified. Console reports show the status. This reduces infection and spread of malicious software.", "why": "Systems without active, current protection are the first to be infected. Consultants test coverage and currency from console data, not from the standard alone.", "how": "Ask what protection applies to servers, endpoints and email, and how the organization finds machines where it is off or out of date. Example probe: \"Show me the list of machines where protection is missing or outdated today.\"", "q": "Does your organization keep malware protection installed, active and current on its in-scope systems?", "evidence": "Malware protection standard per system type; endpoint protection console report showing coverage and signature or agent currency; exception list with justification. Cover the current state and the last audit period.", "good": "A standard states the required protection for each system type. Console reports show full coverage with active, current agents, and any exception has a justification and an owner.", "test": "Read the standard. Pull the console report and sample endpoints and servers across system types. Pass if sampled systems have protection installed, active and current, and each gap has a justified exception.", "risk": "Malware spreads unchecked across systems and can lead to data loss or ransomware.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.7", "ref": "Annex A.8.7", "atom": "ISO.A8.7-a", "text": "Define the malware protection required for each system type.", "match": "equal", "cov": "full", "reason": "The protection standard is the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.7", "ref": "Annex A.8.7", "atom": "ISO.A8.7-b", "text": "Keep protection installed, active and current on in-scope systems.", "match": "equal", "cov": "full", "reason": "Active protection is the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.09", "ref": "DE.CM-09", "atom": "NIST.DE.CM.09-a", "text": "The organization monitors endpoints, servers and runtime environments with EDR or anti-malware.", "match": "req_smaller", "cov": "full", "reason": "Deploying and keeping current malware protection covers endpoint and server monitoring agents.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.09", "ref": "DE.CM-09", "atom": "NIST.DE.CM.09-b", "text": "The organization monitors email and web traffic for malware, phishing and data exfiltration and reviews the alerts.", "match": "req_smaller", "cov": "full", "reason": "Malware protection on in-scope systems includes mail and web gateways, with their alerts reviewed.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-OPS-08", "title": "Threat intelligence", "domain": "OPS", "theme": "Organizational", "goal": "The organization collects and analyzes threat information, produces threat intelligence and acts on it.", "owner": "Security Operations Lead", "imp": "medium", "origin": "iso", "note": "", "statement": "The threat information sources the organization uses, and how the information is analyzed for relevance, are defined. Threat intelligence outputs such as bulletins or assessments are produced on a defined cycle. At least some outputs lead to recorded actions, for example a risk register update, a blocking rule or a change in patch priority. This keeps defenses aligned with threats that matter to the organization.", "why": "Collecting feeds without using them adds noise but no protection. Consultants look for outputs that led to a real action.", "how": "Ask which sources the organization follows, how they decide what is relevant and what changed as a result. Example probe: \"Tell me about one threat report that made you change a rule, a patch priority or a risk entry.\"", "q": "Does your organization turn threat information into threat intelligence it acts on?", "evidence": "Threat intelligence procedure naming sources and relevance criteria; threat bulletins or assessments; records of actions taken, such as risk register updates, blocking rules or change tickets. Cover the last audit period.", "good": "A documented process names sources and relevance criteria. Outputs are produced regularly and each shows who reviewed it. Recorded actions link back to specific intelligence items.", "test": "Read the procedure for sources and relevance criteria. Sample threat intelligence outputs from the period and look for linked actions in the risk register, change records or blocking rules. Pass if outputs exist for the period and at least one sampled output led to a recorded action.", "risk": "The organization is surprised by threats that peers already know about and fails to adjust its defenses.", "applies": "", "type": "preventive", "freq": "monthly", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.7", "ref": "Annex A.5.7", "atom": "ISO.A5.7-a", "text": "Define the threat information sources and how they are analyzed for relevance.", "match": "equal", "cov": "full", "reason": "Source selection and analysis are the control's collection step.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.7", "ref": "Annex A.5.7", "atom": "ISO.A5.7-b", "text": "Produce threat intelligence outputs in the period.", "match": "equal", "cov": "full", "reason": "Producing intelligence is the control's output.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.7", "ref": "Annex A.5.7", "atom": "ISO.A5.7-c", "text": "Act on threat intelligence, for example by updating the risk register or blocking rules.", "match": "equal", "cov": "full", "reason": "The control requires intelligence to lead to action.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.02", "ref": "ID.RA-02", "atom": "NIST.ID.RA.02-a", "text": "The organization subscribes to named cyber threat intelligence sources.", "match": "equal", "cov": "full", "reason": "Collecting threat information from sources is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.02", "ref": "ID.RA-02", "atom": "NIST.ID.RA.02-b", "text": "The organization assigns a role to review the intelligence received and acts on relevant items.", "match": "req_smaller", "cov": "full", "reason": "Analyzing and acting on threat intelligence needs a named reviewer and recorded actions.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.07", "ref": "DE.AE-07", "atom": "NIST.DE.AE.07-a", "text": "The organization integrates threat intelligence feeds into its detection tools.", "match": "req_smaller", "cov": "full", "reason": "Acting on threat intelligence includes feeding indicators into detection tools.", "primary": true, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-OPS-09", "title": "Documented operating procedures", "domain": "OPS", "theme": "Organizational", "goal": "The organization documents operating procedures for key IT activities and keeps current versions available to those who need them.", "owner": "Head of IT Operations", "imp": "medium", "origin": "iso", "note": "", "statement": "Operating procedures are documented for key IT activities, such as backups, system start-up and shutdown, user administration and monitoring. Current approved versions are kept in a shared location, for example a runbook or wiki, where the personnel who need them can find them. Procedures are reviewed on a defined cycle. This keeps routine work consistent and recoverable when individuals are absent.", "why": "Undocumented routines depend on individuals and fail when they are away. Consultants check that procedures exist for key activities and that staff can reach the current version.", "how": "Ask which activities have written procedures and where staff find them. Example probe: \"Where would a new operator find the backup restore procedure, and when was it last updated?\"", "q": "Does your organization document operating procedures for key IT activities and keep current versions available to those who need them?", "evidence": "List of key IT activities with procedures; runbook or wiki index with version and approval details; sample procedures such as backup and user administration; access list for the procedure repository. Cover the current repository and the last review cycle.", "good": "Every key IT activity has a written, approved procedure with a named owner. Current versions sit in an accessible repository, and staff who run the activities confirm they use them.", "test": "List key IT activities and sample some. For each, locate the procedure, check it is approved and current, and confirm that the relevant staff can open it. Pass if every sampled activity has a current approved procedure accessible to its operators.", "risk": "Routine operations depend on individual knowledge and fail or are performed inconsistently.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.37", "ref": "Annex A.5.37", "atom": "ISO.A5.37-a", "text": "Document operating procedures for key IT activities.", "match": "equal", "cov": "full", "reason": "Same ask: documented operating procedures.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.37", "ref": "Annex A.5.37", "atom": "ISO.A5.37-b", "text": "Make the current approved procedures available to those who need them.", "match": "equal", "cov": "full", "reason": "Availability of current versions is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-OPS-10", "title": "Capacity management", "domain": "OPS", "theme": "Technological", "goal": "The organization defines capacity requirements for critical systems, monitors resource use and adjusts capacity before limits are reached.", "owner": "Head of IT Operations", "imp": "medium", "origin": "iso", "note": "", "statement": "Capacity requirements and utilization thresholds are defined for critical systems. Resource use is monitored against those thresholds, and alerts or periodic reviews lead to capacity changes before limits are reached. This prevents outages from exhausted capacity. Proof is the capacity plan, monitoring dashboards and the resulting change records.", "why": "Systems that run out of capacity fail at the worst moment, which hurts availability. Consultants look for thresholds and at least one adjustment made because of them.", "how": "Ask which systems are critical, what thresholds exist and who watches them. Example probe: \"Show me the last time a capacity alert led you to add or change resources.\"", "q": "Does your organization monitor the capacity of its critical systems and adjust it before limits are reached?", "evidence": "Capacity plan with thresholds for critical systems; monitoring dashboards or alert history; change records for capacity adjustments. Cover the last audit period.", "good": "Critical systems have defined thresholds and a capacity plan. Monitoring raises an alert when thresholds are approached, and recorded changes show capacity was added or tuned in time.", "test": "Read the capacity plan for critical systems and thresholds. Sample monitoring alerts or review records from the period and trace them to capacity changes. Pass if thresholds exist for critical systems and sampled alerts led to timely adjustments.", "risk": "Critical systems run out of resources and fail without warning.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.6", "ref": "Annex A.8.6", "atom": "ISO.A8.6-a", "text": "Define capacity requirements and thresholds for critical systems.", "match": "equal", "cov": "full", "reason": "Same ask: capacity requirements.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.6", "ref": "Annex A.8.6", "atom": "ISO.A8.6-b", "text": "Monitor resource use and adjust capacity when thresholds are approached.", "match": "equal", "cov": "full", "reason": "Monitoring and adjustment are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.04", "ref": "PR.IR-04", "atom": "NIST.PR.IR.04-a", "text": "The organization monitors storage, compute, network and power capacity against alert thresholds and acts on breaches.", "match": "equal", "cov": "full", "reason": "Monitoring resource use against capacity is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.04", "ref": "PR.IR-04", "atom": "NIST.PR.IR.04-b", "text": "The organization plans capacity to meet forecast future needs.", "match": "equal", "cov": "full", "reason": "Adjusting capacity before limits are reached is capacity planning.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-OPS-40", "title": "Vulnerability disclosure intake", "domain": "OPS", "theme": "", "goal": "The organization gives outside parties a channel to report vulnerabilities, analyzes each report and decides on and records a response.", "owner": "Security Operations Lead", "imp": "medium", "origin": "nist", "note": "NIST-only.", "statement": "A channel is published through which outside parties, such as researchers and customers, can report security weaknesses in the organization's systems. Each report is assigned for assessment, a response is decided, and the reporter is told the outcome where appropriate. The decision and its reasoning are recorded in a disclosure log. This lets the organization learn about weaknesses from outsiders before attackers use them.", "why": "Outsiders often find weaknesses first, and without a clear channel their reports go unread or reach the wrong person. Consultants check that reports are actually triaged and answered, not just that an inbox exists.", "how": "Ask where an outside researcher would send a report and who reads it. Then ask for the log of reports received and what was decided on each. Example probe: \"If a researcher emailed you a flaw in your login page today, who sees it first, and where is the last report you handled recorded?\"", "q": "Does your organization run a vulnerability disclosure process that takes each outside report through to a recorded response?", "evidence": "Vulnerability disclosure policy or responsible-disclosure page showing the reporting channel; disclosure intake and triage procedure; disclosure log with the analysis and response for each report, or a record of a simulated report; covering the last annual cycle.", "good": "A public policy names a monitored reporting channel and says what reporters can expect. A written procedure sets how each report is assessed and how a response or fix decision is reached. The log shows at least one real or simulated report with its analysis, decision and outcome.", "test": "Obtain the disclosure policy and confirm the reporting channel is published and monitored. Read the procedure and confirm it covers analysis and the response decision. Select reports from the review period, or a simulated report if none arrived, and confirm each has a recorded analysis and response. Pass if the channel exists, the procedure is defined and the sampled report is fully recorded.", "risk": "Weaknesses found by outsiders go unreported or unread, and are left open until someone attacks them.", "applies": "", "type": "detective", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.ID.RA.08", "ref": "ID.RA-08", "atom": "NIST.ID.RA.08-a", "text": "The organization provides a channel for external parties to report vulnerabilities.", "match": "equal", "cov": "full", "reason": "No base control provides a channel for outsiders to report vulnerabilities.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.08", "ref": "ID.RA-08", "atom": "NIST.ID.RA.08-b", "text": "The organization analyzes each reported vulnerability and decides on a response.", "match": "equal", "cov": "full", "reason": "Analyzing and answering each report is the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-OPS-41", "title": "Alert analysis, correlation and routing", "domain": "OPS", "theme": "", "goal": "The organization analyzes alerts and adverse events under defined procedures, correlates events from several sources, records its conclusions, assigns each alert for follow-up, gives the people who respond access to the analysis platform, and gives analysts asset context during investigation.", "owner": "Security Operations Lead", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-OPS-03 so monitoring and alert handling are tested apart.", "statement": "Written procedures or runbooks define how alerts raised by monitoring are analyzed, and detection rules combine events from more than one source. Each alert becomes a ticket assigned for follow-up, and the analysis and conclusion are recorded on it. Log analysis access is given to the people who respond, asset and criticality context is available during investigation, and logs that automated rules do not cover are reviewed on a defined schedule. Proof is the runbooks, rule list, alert tickets and manual review records.", "why": "Monitoring that raises alerts nobody analyzes or owns gives false comfort, and single-source alerts miss attacks that only show across systems. Consultants test what happens after an alert fires, which is separate from whether monitoring exists.", "how": "Pick up where monitoring ends and follow an alert through to its conclusion. Ask for the runbook, a sample of alert tickets and the list of rules that combine sources. Example probe: \"Show me an alert from last month, who followed it up, what the analyst looked at besides the first log line, and how they concluded it.\"", "q": "Does your organization run a defined process that takes each alert from analysis to assignment and a recorded conclusion?", "evidence": "Alert analysis procedure or runbooks; list of detection rules that combine several log sources; list of log sources feeding the central platform; sample of alert tickets with assignment, analysis and conclusion; platform access list for the people who respond; manual log review records; covering the last annual cycle.", "good": "Runbooks define how common alert types are analyzed. Alerts flow automatically or manually into assigned tickets, and each ticket records the analysis and a conclusion such as benign or escalated. Rules combine sources such as identity and endpoint data, the people who respond hold access to the analysis platform, and analysts can see asset criticality while investigating. Logs outside automated coverage are reviewed on a stated schedule with records.", "test": "Obtain the runbooks, the correlation rule list and the platform access list for the people who respond. Sample alert tickets from the review period and confirm each is assigned, has a recorded analysis and a conclusion, and that some show events from more than one source combined. Check that asset context was available and that manual log reviews followed their schedule. Pass if the runbooks exist, the people who respond have access and every sampled ticket is assigned and concluded.", "risk": "Alerts sit unowned or are dismissed without analysis, and multi-system attacks pass unnoticed.", "applies": "", "type": "detective", "freq": "continuous", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.DE.AE.02", "ref": "DE.AE-02", "atom": "NIST.DE.AE.02-a", "text": "The organization defines procedures or runbooks for analyzing alerts and adverse events.", "match": "equal", "cov": "full", "reason": "The slot holds analyst procedures or runbooks for alerts and adverse events.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.02", "ref": "DE.AE-02", "atom": "NIST.DE.AE.02-b", "text": "Analysts record the analysis performed and the conclusion for each alert.", "match": "equal", "cov": "full", "reason": "Recording the analysis and conclusion for each alert is the slot's test.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.02", "ref": "DE.AE-02", "atom": "NIST.DE.AE.02-c", "text": "The organization reviews logs not covered by automated monitoring on a defined schedule.", "match": "equal", "cov": "full", "reason": "Scheduled manual review of logs outside automated monitoring is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.03", "ref": "DE.AE-03", "atom": "NIST.DE.AE.03-a", "text": "The organization configures detection rules that combine events from more than one source.", "match": "equal", "cov": "full", "reason": "Correlation rules combining events from several sources are in the slot's goal.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.06", "ref": "DE.AE-06", "atom": "NIST.DE.AE.06-a", "text": "The organization documents how alerts are routed to named responders and into response tools.", "match": "equal", "cov": "full", "reason": "Routing alerts to a named responder or team is in the slot's goal.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.06", "ref": "DE.AE-06", "atom": "NIST.DE.AE.06-b", "text": "Alerts become tickets assigned to an owner.", "match": "equal", "cov": "full", "reason": "Turning an alert into a ticket with an owner is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.06", "ref": "DE.AE-06", "atom": "NIST.DE.AE.06-c", "text": "Incident responders have access to the log analysis platform.", "match": "equal", "cov": "full", "reason": "Responder access to the analysis platform is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.AE.07", "ref": "DE.AE-07", "atom": "NIST.DE.AE.07-b", "text": "Analysts have asset inventory and criticality context available when investigating.", "match": "equal", "cov": "full", "reason": "Asset and criticality context available to analysts during investigation is in the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-OPS-70", "title": "Personal data access logging and review", "domain": "OPS", "theme": "", "goal": "The organization logs access to personal data, reviews those logs so unauthorized access is detected and investigated, and keeps the logs and the data needed for investigation for the minimum period it is obliged to.", "owner": "Security Operations Lead", "imp": "high", "origin": "dpdpa", "note": "Remainder of UC-OPS-01. Carries the DPDPA log retention minimum (key setting, dpdpa layer).", "statement": "Access to personal data is logged, and those logs are reviewed on a defined cycle so unauthorized access is detected, investigated and fixed. The access logs, the related traffic data and the personal data needed to investigate unauthorized access are kept for at least one year, unless another law requires longer. Retention settings on systems are checked against that minimum. Proof is the review records, the alert tickets and the retention settings.", "why": "Without reviewed access logs a breach of personal data goes unnoticed, and logs deleted too early leave nothing to investigate with.", "how": "Ask who reviews access to personal data, how often and what happened with the last anomaly. Then check how long the logs are kept. Example probe: \"Show me the last review of access to customer data and how long those logs are retained.\"", "q": "Does your organization review logs of access to personal data so unauthorized access is detected, keeping them for the minimum period it is obliged to?", "evidence": "Log review records; alert tickets with follow-up; retention settings on logging systems; retention schedule entry for access logs, for the audit period.", "good": "Access to personal data is logged and reviewed on a set cycle, and anomalies are followed up to closure. Logs and related investigation data are kept for at least one year, and system settings match.", "test": "Sample review cycles from the audit period and check each review took place and anomalies were followed up. Inspect retention settings on logging systems and check the oldest available log. Pass if reviews are evidenced and logs are kept for at least one year.", "risk": "Unauthorized access to personal data goes undetected, and the organization cannot investigate or show what happened.", "applies": "", "type": "detective", "freq": "continuous", "ks": "dpdpa: keep access logs, traffic data and the personal data needed to investigate unauthorized access for at least one year, unless another law requires longer", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.MINIMIZE.3", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "atom": "CH2.MINIMIZE.3-c", "text": "Retain personal data, traffic data and processing logs for at least the minimum period the Rules require before erasure.", "match": "equal", "cov": "full", "reason": "The minimum retention period for access and processing logs of personal data is carried by the slot.", "primary": false, "rem": "UC-OPS-01", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.SECURITY.1", "ref": "Section 8(5)", "atom": "CH2.SECURITY.1-a", "text": "Implement reasonable technical safeguards to protect personal data and prevent breaches.", "match": "equal", "cov": "full", "reason": "Logging and review of access to personal data complete the base logging control.", "primary": false, "rem": "UC-OPS-01", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-SDC-01", "title": "Security in projects", "domain": "SDC", "theme": "Organizational", "goal": "The organization requires security requirements and risks to be addressed at defined stages of every project.", "owner": "Head of Application Development", "imp": "medium", "origin": "iso", "note": "", "statement": "Security requirements and risks are addressed at defined stages of every project, whatever its type. The project management method names those stages, and each project keeps a security risk assessment or a requirements sign-off. This catches security problems while they are cheap to fix. Proof is the project method and the project records.", "why": "Security added at the end of a project is costly and often skipped for non-software projects. Consultants check the method requires it for all project types and that real projects show it.", "how": "Ask how a new project, including a non-software one, triggers a security review and who signs off. Example probe: \"Show me the security sign-off from the last project that went live.\"", "q": "Does your organization require security requirements and risks to be addressed at defined stages of every project?", "evidence": "Project management method showing security stages and gates; project records with security risk assessments; gate sign-off records. Cover projects completed or started in the last audit period.", "good": "The project method requires security requirements and risk review at named stages for every project type. Sampled projects hold a dated risk assessment or sign-off from a named approver.", "test": "Read the project method for required security stages. Sample projects from the period, including a non-software one if any, and look for the assessment or sign-off at each required stage. Pass if every sampled project shows the required security record.", "risk": "Projects launch with unaddressed security risks that are expensive or impossible to fix later.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.8", "ref": "Annex A.5.8", "atom": "ISO.A5.8-a", "text": "Require security requirements and risks to be addressed at set stages of every project, whatever its type.", "match": "equal", "cov": "full", "reason": "Same ask: security built into project stages.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.8", "ref": "Annex A.5.8", "atom": "ISO.A5.8-b", "text": "Keep project records showing a security assessment or requirements sign-off.", "match": "equal", "cov": "full", "reason": "Per-project records are the proof the control names.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SDC-02", "title": "Secure development process", "domain": "SDC", "theme": "Technological", "goal": "The organization sets security rules for each phase of development and shows they are followed on releases.", "owner": "Head of Application Development", "imp": "high", "origin": "iso", "note": "", "statement": "Security rules are set for each phase of the development life cycle: requirements, design, coding, testing and release. Release records show the required security steps were completed, such as a security review, a code scan or an approval gate. This builds security into every release instead of checking it at the end. Proof is the secure development policy and the release records.", "why": "A policy that is not visible in release records is not being followed. Consultants test sampled releases against the required steps.", "how": "Ask what steps a release must pass and how the organization prevents a release from skipping them. Example probe: \"Show me the last release and the evidence that each required security step was done.\"", "q": "Does your organization set security rules for each phase of development and show that releases follow them?", "evidence": "Secure development policy by life-cycle phase; release records with completed security steps; scan results; approval gate records. Cover releases from the last audit period.", "good": "A policy defines security rules for each phase. Release records and pipeline gates show review, scanning and approval completed before release, and skipped steps need an approved exception.", "test": "Read the policy for the required steps per phase. Sample releases from the period and check each for evidence of every required step. Pass if every sampled release shows the steps completed or an approved exception.", "risk": "Releases ship with security flaws because required steps are skipped or never defined.", "applies": "Applies if the organization develops software in house or has it developed for it.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.25", "ref": "Annex A.8.25", "atom": "ISO.A8.25-a", "text": "Set security rules for each phase of the development life cycle.", "match": "equal", "cov": "full", "reason": "Same ask: secure development rules.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.25", "ref": "Annex A.8.25", "atom": "ISO.A8.25-b", "text": "Show releases completed the required security steps.", "match": "equal", "cov": "full", "reason": "Completed steps on releases are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.06", "ref": "PR.PS-06", "atom": "NIST.PR.PS.06-a", "text": "The organization defines security activities for each stage of the software development life cycle.", "match": "equal", "cov": "full", "reason": "Security rules for each development phase are the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.06", "ref": "PR.PS-06", "atom": "NIST.PR.PS.06-b", "text": "Development teams perform those security activities on each release.", "match": "req_smaller", "cov": "full", "reason": "Showing the rules are followed on releases is in the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-SDC-03", "title": "Application security requirements", "domain": "SDC", "theme": "Technological", "goal": "The organization identifies, specifies and approves security requirements for applications it builds or buys.", "owner": "Head of Application Development", "imp": "high", "origin": "iso", "note": "", "statement": "Security requirements are identified, specified and approved whenever an application is built or acquired, including software as a service. Each application keeps a documented, approved set of requirements. This makes sure applications fit the organization's security needs before purchase or build. Proof is the requirements records and the approvals.", "why": "Applications bought or built without stated security needs end up with gaps nobody planned for. Consultants test acquired and SaaS applications as well as in-house ones.", "how": "Ask how security needs are captured for a new application and who approves them. Example probe: \"Show me the approved security requirements for the last application you bought or built.\"", "q": "Does your organization identify, specify and approve security requirements for the applications it builds or buys?", "evidence": "Development and procurement process steps requiring security requirements; approved requirements documents for sampled applications; approval records. Cover applications started in the last audit period.", "good": "Both the build and the buy processes require a documented requirements set before approval. Sampled applications, including SaaS, show requirements and a named approver.", "test": "Read the development and procurement process for the requirements step. Sample applications built or acquired in the period and look for a documented, approved requirements set. Pass if every sampled application has one approved before go-live.", "risk": "Applications are adopted without stated security needs and leave unaddressed gaps.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.26", "ref": "Annex A.8.26", "atom": "ISO.A8.26-a", "text": "Require security requirements to be identified, specified and approved when applications are developed or acquired.", "match": "equal", "cov": "full", "reason": "Same ask: approved application security requirements.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.26", "ref": "Annex A.8.26", "atom": "ISO.A8.26-b", "text": "Keep a documented, approved set of requirements for sampled applications.", "match": "equal", "cov": "full", "reason": "Documented requirements are the control's proof.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SDC-04", "title": "Secure engineering principles", "domain": "SDC", "theme": "Technological", "goal": "The organization documents and keeps current principles for engineering secure systems and applies them in design.", "owner": "Head of Application Development", "imp": "high", "origin": "iso", "note": "", "statement": "Principles for engineering secure systems, such as defense in depth, least privilege, secure defaults and zero trust, are documented and kept current. They are applied in design and architecture reviews, and the review records show it. This gives development work a common bar for secure design.", "why": "Principles on a page do nothing unless design reviews use them. Consultants check that reviews cite the principles.", "how": "Ask where the principles are written and how architects use them in reviews. Example probe: \"Show me a recent design review and where it applied one of your principles.\"", "q": "Does your organization apply documented secure engineering principles in its system and application design?", "evidence": "Secure engineering principles document with version history; architecture or design review records; review checklists. Cover reviews in the last audit period.", "good": "Principles are written, versioned and reviewed on a defined cycle. Design reviews for sampled development work record which principles were applied and any exceptions.", "test": "Read the principles and confirm they are current. Sample design or architecture reviews from the period and look for recorded application of the principles. Pass if sampled reviews record the principles were applied or document exceptions.", "risk": "Systems are designed inconsistently and carry avoidable structural weaknesses.", "applies": "Applies if the organization develops software in house or has it developed for it.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.27", "ref": "Annex A.8.27", "atom": "ISO.A8.27-a", "text": "Document secure engineering principles and keep them current.", "match": "equal", "cov": "full", "reason": "Same ask: documented engineering principles.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.27", "ref": "Annex A.8.27", "atom": "ISO.A8.27-b", "text": "Apply the principles in design or architecture reviews.", "match": "equal", "cov": "full", "reason": "Applied principles are in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SDC-05", "title": "Secure coding", "domain": "SDC", "theme": "Technological", "goal": "The organization applies a secure coding standard to its software and checks code changes by review or automated scanning before release.", "owner": "Head of Application Development", "imp": "high", "origin": "iso", "note": "Developer training atom is carried by PPL-04.", "statement": "A secure coding standard covers input validation, output encoding, secrets handling and dependency management, and applies to in-house and outsourced code. Code changes go through peer review or automated scanning, such as static analysis, dependency or secret scanning, and findings are addressed before release. This keeps common coding flaws out of production. Proof is the standard and the pipeline scan results.", "why": "Common flaws like injection and exposed secrets reach production when nothing checks code changes. Consultants look for a standard and for scan or review evidence on real changes.", "how": "Ask what the standard covers, which checks run on every change and whether findings can block a release. Example probe: \"Show me a recent change where a scan finding was fixed before release.\"", "q": "Does your organization apply a secure coding standard and check code changes by review or automated scanning before release?", "evidence": "Secure coding standard; pipeline configuration showing scans; scan results and peer review records for sampled changes; finding resolution records. Cover changes in the last audit period.", "good": "A secure coding standard covers in-house and outsourced code. The pipeline runs review or scans on every change, and findings are fixed or accepted with approval before release.", "test": "Read the standard and the pipeline configuration. Sample code changes released in the period and check each for a review or scan record and resolved findings. Pass if sampled changes show checks done and findings addressed before release.", "risk": "Preventable coding flaws and leaked secrets reach production and are exploited.", "applies": "Applies if the organization develops software in house or has it developed for it.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.28", "ref": "Annex A.8.28", "atom": "ISO.A8.28-a", "text": "Maintain a secure coding standard that applies to in-house and outsourced code.", "match": "equal", "cov": "full", "reason": "The standard is the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.28", "ref": "Annex A.8.28", "atom": "ISO.A8.28-b", "text": "Run code review or automated scanning on code changes and address findings before release.", "match": "equal", "cov": "full", "reason": "Review and scanning are in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SDC-06", "title": "Security testing and acceptance", "domain": "SDC", "theme": "Technological", "goal": "The organization defines security tests for each stage of development and requires results and acceptance sign-off before release.", "owner": "Head of Application Development", "imp": "high", "origin": "iso", "note": "", "statement": "The security tests required at each stage of development, and the acceptance criteria that must be met before go-live, are defined. For new or significantly changed systems, test results and an acceptance sign-off are kept before production release. This confirms a system is safe to run before it handles real data. Proof is the test process and the test and acceptance records.", "why": "Systems that go live without defined tests or sign-off carry unknown risk. Consultants test that results and a sign-off exist before release, not after.", "how": "Ask what tests are required, who accepts results and who can stop a release. Example probe: \"Show me the acceptance sign-off for your last major release and the test results behind it.\"", "q": "Does your organization require security testing and sign-off before each release?", "evidence": "Security testing process with stage tests and acceptance criteria; test reports; acceptance sign-off records for new or changed systems. Cover releases in the last audit period.", "good": "A process lists the tests per stage and clear acceptance criteria. Each significant release shows test results and a dated sign-off by a named approver before production.", "test": "Read the process for tests and criteria. Sample new or significantly changed systems released in the period and check for test results and a sign-off dated before release. Pass if every sampled system has both and meets the acceptance criteria.", "risk": "Systems reach production with undiscovered flaws because no one confirmed they met security criteria.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.29", "ref": "Annex A.8.29", "atom": "ISO.A8.29-a", "text": "Define the security tests required at each stage and acceptance criteria before go-live.", "match": "equal", "cov": "full", "reason": "Same ask: a security testing process.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.29", "ref": "Annex A.8.29", "atom": "ISO.A8.29-b", "text": "Keep test results and an acceptance sign-off before production release.", "match": "equal", "cov": "full", "reason": "Results and sign-off are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.01", "ref": "ID.RA-01", "atom": "NIST.ID.RA.01-d", "text": "The organization tests or reviews in-house software for vulnerabilities.", "match": "req_smaller", "cov": "full", "reason": "Security tests at each development stage cover vulnerability testing of in-house software.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-SDC-07", "title": "Outsourced development oversight", "domain": "SDC", "theme": "Technological", "goal": "The organization sets security requirements for outsourced development and monitors and reviews the work.", "owner": "Head of Application Development", "imp": "medium", "origin": "iso", "note": "", "statement": "Contracts for outsourced development set security requirements, such as secure coding, test evidence, code ownership and a right to audit. The outsourced work is monitored and reviewed, for example through code reviews, test evidence received and progress meetings, and records are kept. This keeps outsourced code to the same standard as in-house code.", "why": "Outsourced developers can introduce flaws or backdoors the organization never sees. Consultants check both the contract terms and proof of oversight.", "how": "Ask who develops software for the organization, what their contracts require and how the work is checked. Example probe: \"Show me the last test evidence or code review you received from your outside developers.\"", "q": "Does your organization oversee the security of outsourced development?", "evidence": "Outsourced development contracts with security terms; oversight records such as code review, test evidence and meeting minutes; supplier performance reviews. Cover the last audit period.", "good": "Contracts require secure coding, testing evidence, ownership and audit rights. Oversight records show the organization reviewed delivered work and acted on issues.", "test": "List outsourced development suppliers and sample some. Check each contract for the security terms and look for oversight records from the period. Pass if sampled contracts include the terms and records show reviews of delivered work.", "risk": "Outsourced code arrives with flaws or hidden access, and the organization cannot prove what it received.", "applies": "Applies if the organization outsources software development.", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.30", "ref": "Annex A.8.30", "atom": "ISO.A8.30-a", "text": "Set security requirements in outsourced development contracts.", "match": "equal", "cov": "full", "reason": "Same ask: direct outsourced development.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.30", "ref": "Annex A.8.30", "atom": "ISO.A8.30-b", "text": "Monitor and review the outsourced work and keep records.", "match": "equal", "cov": "full", "reason": "Monitoring and review are in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SDC-08", "title": "Environment separation", "domain": "SDC", "theme": "Technological", "goal": "The organization separates development, test and production environments, limits developer access to production and secures non-production to the level of the data it holds.", "owner": "Head of Application Development", "imp": "high", "origin": "iso", "note": "", "statement": "Development, test and production environments are separate, for example in separate accounts, subscriptions or networks, with rules for promoting changes between them. Developers have no standing write access to production, or any such access is approved and logged. Non-production environments are secured to the level of the data they hold. Proof is the separation rules and the access configuration.", "why": "Shared environments let test mistakes hit production and let developers change live data unseen. Consultants check access settings, not only the design.", "how": "Ask how environments are separated, who can write to production and how test environments are protected. Example probe: \"Show me which developers can change production today and why.\"", "q": "Does your organization keep its development, test and production environments separate?", "evidence": "Environment separation rules; cloud or system access export showing developer rights in production; approval and log records for any production access; non-production security settings. Cover the current configuration and the last audit period.", "good": "Environments are in separate accounts or networks with documented promotion rules. Developers lack standing production write access, any exception is approved and logged, and non-production matches the protection of the data it holds.", "test": "Read the separation rules. Inspect the access export for developer rights in production and sample non-production environments for access control and data protection. Pass if developers lack standing write access or have approved logged access, and non-production security fits its data.", "risk": "Test activity or developer changes damage production, and weakly protected test systems leak real data.", "applies": "Applies if the organization develops software in house or has it developed for it.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.31", "ref": "Annex A.8.31", "atom": "ISO.A8.31-a", "text": "Separate development, test and production environments with rules for promoting changes.", "match": "equal", "cov": "full", "reason": "Same ask: separated environments.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.31", "ref": "Annex A.8.31", "atom": "ISO.A8.31-b", "text": "Limit developers' standing write access to production, or approve and log it.", "match": "equal", "cov": "full", "reason": "Limited production access is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.31", "ref": "Annex A.8.31", "atom": "ISO.A8.31-c", "text": "Secure non-production environments to the level of the data they hold.", "match": "equal", "cov": "full", "reason": "Securing non-production is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SDC-09", "title": "Change management", "domain": "SDC", "theme": "Technological", "goal": "The organization subjects changes to systems and facilities to recorded assessment, authorization, testing and rollback planning, including emergency changes.", "owner": "Head of Application Development", "imp": "high", "origin": "iso", "note": "", "statement": "A change procedure for systems and facilities covers recording, impact and risk assessment, authorization, testing, rollback planning and communication. Each change is assessed for cybersecurity risk impact before approval and tracked to closure. Production changes are authorized before they are made, with testing evidence kept. Emergency changes are recorded and reviewed and approved afterward. Unintended changes are reviewed for their effect, and any harm is dealt with. This keeps changes from causing outages or security gaps. Proof is the procedure and the change records.", "why": "Uncontrolled changes are a leading cause of outages and security regressions. Consultants test authorization timing and the handling of emergency changes.", "how": "Ask how a change is requested, approved and tested, and what happens when something must change in an emergency. Example probe: \"Show me your last emergency change and its after-the-fact approval.\"", "q": "Does your organization put changes to its systems through recorded assessment, authorization, testing and rollback planning?", "evidence": "Change management procedure; change records with approval and test evidence; emergency change records with retrospective approval. Cover changes in the last audit period.", "good": "A procedure covers every step from recording to communication. Sampled changes show a risk assessment and approval before implementation, testing evidence and closure, and emergency changes are recorded and approved afterward. Unintended changes found in the period have a recorded review and follow-up.", "test": "Read the procedure for the required steps. Sample production changes from the period and check a cybersecurity risk assessment was recorded before approval, authorization precedes implementation, testing evidence exists and the change was tracked to closure, then check emergency changes for retrospective approval and any unintended changes for a recorded review of their effect. Pass if all sampled changes meet these conditions.", "risk": "Unauthorized or untested changes cause outages, data loss or new vulnerabilities.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.32", "ref": "Annex A.8.32", "atom": "ISO.A8.32-a", "text": "Define a change procedure covering recording, impact and risk assessment, authorization, testing, rollback and communication.", "match": "equal", "cov": "full", "reason": "Same ask: a controlled change procedure.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.32", "ref": "Annex A.8.32", "atom": "ISO.A8.32-b", "text": "Authorize production changes before implementation and keep testing evidence.", "match": "equal", "cov": "full", "reason": "Authorization and testing are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.32", "ref": "Annex A.8.32", "atom": "ISO.A8.32-c", "text": "Record emergency changes and review and approve them afterwards.", "match": "equal", "cov": "full", "reason": "Emergency changes are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C8.1", "ref": "Clause 8.1", "atom": "ISO.C8.1-c", "text": "Control planned changes and review the effect of unintended changes.", "match": "req_smaller", "cov": "full", "reason": "Planned changes are controlled and unintended changes reviewed through change management.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.07", "ref": "ID.RA-07", "atom": "NIST.ID.RA.07-a", "text": "Changes are assessed for cybersecurity risk impact before approval and tracked to closure.", "match": "req_smaller", "cov": "full", "reaso
