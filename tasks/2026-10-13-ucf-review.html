n": "Changes with recorded risk assessment, authorization and testing cover impact assessment and closure.", "primary": true, "rem": "", "imm": ""}], "nrec": 3, "r2": "D19: change control from the operational planning clause maps here; unintended changes are now reviewed."}, {"id": "UC-SDC-10", "title": "Test data protection", "domain": "SDC", "theme": "Technological", "goal": "The organization selects, authorizes, protects and removes test data so production or personal data is not used in testing without approval.", "owner": "Head of Application Development", "imp": "medium", "origin": "iso", "note": "", "statement": "Rules for selecting and using test data require production or personal data to be masked or explicitly authorized before it is used in testing. Any copy of production data into a test environment has an authorization record and is deleted after testing. This keeps real data out of weakly protected test systems. Proof is the test data rules and the authorization and deletion records.", "why": "Real customer data copied to test systems is easily exposed and often forgotten there. Consultants look for authorization and proof of deletion.", "how": "Ask how test data is created, whether real data is ever copied and who approves it. Example probe: \"When did you last copy production data to test, who approved it and when was it deleted?\"", "q": "Does your organization prevent production or personal data from being used in testing without approval?", "evidence": "Test data rules; masking or synthetic data approach; authorization records for production data copies; deletion confirmations. Cover copies made in the last audit period.", "good": "Rules require masked or synthetic data by default. Any production copy has an approval, a stated purpose and a recorded deletion after testing.", "test": "Read the rules. List production data copies to test environments in the period and sample them. Pass if each sampled copy has an authorization record and evidence it was deleted after testing, or the organization shows none occurred.", "risk": "Real or personal data sits in weakly protected test environments and is exposed.", "applies": "Applies if the organization develops software in house or has it developed for it.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.33", "ref": "Annex A.8.33", "atom": "ISO.A8.33-a", "text": "Set rules for selecting and using test data, requiring masking or authorization for production or personal data.", "match": "equal", "cov": "full", "reason": "Same ask: protected test data.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.33", "ref": "Annex A.8.33", "atom": "ISO.A8.33-b", "text": "Authorize copies of production data to test and delete them after testing.", "match": "equal", "cov": "full", "reason": "Authorization and removal are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.02", "ref": "PR.DS-02", "atom": "NIST.PR.DS.02-c", "text": "The organization keeps production sensitive data out of non-production environments unless masked.", "match": "equal", "cov": "full", "reason": "Keeping production data out of testing unless approved and masked is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PHY-01", "title": "Physical security perimeters", "domain": "PHY", "theme": "Physical", "goal": "The organization defines and uses physical perimeters to protect areas holding information and assets.", "owner": "Head of Facilities", "imp": "high", "origin": "iso", "note": "", "statement": "A physical perimeter is defined for each site in scope, such as the building, floor or server room, stating the protection each one needs. At least once a cycle, the perimeters are confirmed to exist as described, for example that doors lock and there are no unprotected openings. Where the organization has no premises of its own, this is recorded and reliance is placed on the hosting provider's assurance. This keeps unauthorized people away from the areas that hold information and assets.", "why": "Without defined perimeters, nobody can say which areas need protection, so sensitive spaces end up as open as the rest of the building.", "how": "Ask for the site list and the perimeter definition for each site. Then ask whether anyone has walked the sites to confirm the perimeters match the paper. Example probe: \"When did someone last walk the server room boundary and check that every door and opening is secured as the plan says?\"", "q": "Does your organization protect the areas holding its information with defined physical perimeters?", "evidence": "Site plans and perimeter definitions for each site in scope; site walkthrough notes or photos; for hosted environments, the provider's physical assurance reports; the record of which sites are in scope. Cover the current review period.", "good": "A written perimeter definition exists for every in-scope site, naming the protection required for each area. Walkthrough records or photos show the perimeters match the definition. Sites hosted entirely by a provider are recorded as such, backed by the provider's assurance report.", "test": "Select a sample of in-scope sites or areas and compare each perimeter definition with a walkthrough record or photo. Pass if every sampled perimeter is defined, matches what was observed, and no unprotected opening is found. For provider-hosted sites, pass if the scope record shows reliance on a current provider assurance report.", "risk": "Unauthorized people could reach areas that hold information and equipment without meeting any barrier.", "applies": "Applies in full where the organization runs premises that are in scope. Where all hosting is with providers, the organization records this and relies on provider assurance.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.1", "ref": "Annex A.7.1", "atom": "ISO.A7.1-a", "text": "Define physical perimeters for each in-scope site with the protection each needs.", "match": "equal", "cov": "full", "reason": "Same ask: defined perimeters.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.1", "ref": "Annex A.7.1", "atom": "ISO.A7.1-b", "text": "Confirm the perimeters exist as described.", "match": "equal", "cov": "full", "reason": "Perimeters in use are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.1", "ref": "Annex A.7.1", "atom": "ISO.A7.1-c", "text": "Record where no own premises are in scope and rely on provider assurance for hosting.", "match": "equal", "cov": "full", "reason": "The control also covers where perimeters sit with a provider.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-02", "title": "Physical entry and visitor control", "domain": "PHY", "theme": "Physical", "goal": "The organization controls entry to secure areas and records and escorts visitors.", "owner": "Head of Facilities", "imp": "high", "origin": "iso", "note": "Split in round 2: access rights review and leaver badge removal moved to UC-PHY-13.", "statement": "Entry to each secure area is controlled through locks, badge readers or reception checks, with written rules on who may enter. Entry rules are stricter for areas holding higher-risk assets. Every visitor is recorded and escorted where the rules require. Visitor logs and access system records prove that only authorized people and recorded visitors enter.", "why": "Without entry rules and visitor records, unauthorized people or unrecorded visitors can reach sensitive areas unnoticed.", "how": "Ask how people get into the secure areas and how visitors are signed in and escorted. Example probe: \"Show me this week's visitor log for the server room and tell me who escorted each visitor.\"", "q": "Does your organization control entry to its secure areas, with visitors recorded and escorted?", "evidence": "Entry control rules for secure areas; list of secure areas and who may enter each; visitor logs; access control system reports; data center provider attestation for cloud-hosted assets. Cover the review period.", "good": "Entry rules define who may enter each secure area and how, with stricter controls for higher-risk areas. Visitor logs are complete and show escorts where required. Access system records match the rules.", "test": "Sample visitor entries and access system records from the review period, across at least two secure areas. Pass if entry rules exist for each area, and every sampled visitor is logged and escorted as the rules require.", "risk": "Unauthorized people or unrecorded visitors could walk into secure areas unnoticed.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.2", "ref": "Annex A.7.2", "atom": "ISO.A7.2-a", "text": "Define entry controls and who may enter each secure area.", "match": "equal", "cov": "full", "reason": "Entry controls and authorization rules are the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.2", "ref": "Annex A.7.2", "atom": "ISO.A7.2-b", "text": "Record visitors and escort them where required.", "match": "equal", "cov": "full", "reason": "Visitor records and escort are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.06", "ref": "PR.AA-06", "atom": "NIST.PR.AA.06-a", "text": "The organization sets physical access controls for facilities holding assets, stricter where risk is higher.", "match": "req_smaller", "cov": "full", "reason": "Controlling entry to secure areas is the physical access control this atom asks for.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": "Split (D11): narrowed to entry rules and visitor control; the other half is now UC-PHY-13."}, {"id": "UC-PHY-03", "title": "Securing offices, rooms and facilities", "domain": "PHY", "theme": "Physical", "goal": "The organization specifies and puts in place physical security for offices, rooms and facilities.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "", "statement": "Physical measures for offices, rooms and facilities are specified, such as locks, restricted signage and no public indication of where sensitive rooms are. At least once per assessment cycle, these measures are checked to be in place in the rooms holding sensitive information or equipment. This reduces the chance that sensitive rooms are found, entered or observed by people with no need.", "why": "Sensitive rooms often get the same treatment as ordinary offices, which leaves obvious and easy targets.", "how": "Ask which rooms hold sensitive information or equipment and what measures each one has. Example probe: \"Which rooms would hurt most if a stranger walked in, and what stops that today?\"", "q": "Does your organization put physical security measures in place for the offices, rooms and facilities that hold sensitive information or equipment?", "evidence": "Physical security specification for offices and rooms; list of rooms holding sensitive information or equipment; room inspection records. Cover the current review period.", "good": "A specification sets measures per room type. Inspection records show sensitive rooms meet it, with gaps tracked to closure.", "test": "Select a sample of rooms holding sensitive information or equipment and compare each with the specification, using inspection records or a walkthrough. Pass if every sampled room has the specified measures in place.", "risk": "Sensitive rooms are exposed to casual entry, observation or theft.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.3", "ref": "Annex A.7.3", "atom": "ISO.A7.3-a", "text": "Specify physical security measures for offices, rooms and facilities.", "match": "equal", "cov": "full", "reason": "Same ask: specified measures.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.3", "ref": "Annex A.7.3", "atom": "ISO.A7.3-b", "text": "Confirm the measures are in place for rooms holding sensitive information or equipment.", "match": "equal", "cov": "full", "reason": "Inspection of measures is the control's proof.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-04", "title": "Physical security monitoring", "domain": "PHY", "theme": "Physical", "goal": "The organization monitors premises for unauthorized physical access and responds to alerts.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "", "statement": "Monitoring for unauthorized physical access to premises is in place, using CCTV, intruder alarms or guards, with a defined response when an alert fires. The monitoring systems work throughout the period and are tested on a defined cycle. Alert and test records show that monitoring ran and that alerts were acted on.", "why": "Monitoring that is defined but not working gives false comfort, and intrusions go unseen or unanswered.", "how": "Ask what monitoring exists, who responds, and how the organization knows it is working. Example probe: \"If the alarm at the main entrance fired at night, who would be called and when was that last tested?\"", "q": "Does your organization monitor its premises for unauthorized physical access and act on alerts?", "evidence": "Physical monitoring arrangements and response responsibilities; CCTV retention settings; alarm test records; guard logs; alert and response records. Cover the review period.", "good": "Monitoring covers the defined premises. A named role responds to alerts. Test and maintenance records show systems were operating all period, and any outage was fixed and recorded.", "test": "Pick a sample of monitoring systems and dates in the period. Pass if each sampled system has a test or log record showing it was operational, footage or logs are available for the sampled dates, and sampled alerts show a recorded response.", "risk": "Physical intrusions would go undetected or unanswered.", "applies": "", "type": "detective", "freq": "continuous", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.4", "ref": "Annex A.7.4", "atom": "ISO.A7.4-a", "text": "Define monitoring for unauthorized physical access and who responds.", "match": "equal", "cov": "full", "reason": "Defined monitoring and response are the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.4", "ref": "Annex A.7.4", "atom": "ISO.A7.4-b", "text": "Keep monitoring systems operational throughout the period.", "match": "equal", "cov": "full", "reason": "Operational monitoring is the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.06", "ref": "PR.AA-06", "atom": "NIST.PR.AA.06-b", "text": "The organization monitors physical access through logs or visitor records and reviews them.", "match": "req_smaller", "cov": "full", "reason": "Monitoring premises for unauthorized access covers logs and visitor records being reviewed.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.02", "ref": "DE.CM-02", "atom": "NIST.DE.CM.02-a", "text": "The organization defines physical monitoring, such as CCTV, alarms or guards, for facilities holding assets.", "match": "equal", "cov": "full", "reason": "Monitoring premises for unauthorized physical access is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.02", "ref": "DE.CM-02", "atom": "NIST.DE.CM.02-b", "text": "The organization reviews physical access logs for unusual access and failed attempts.", "match": "req_smaller", "cov": "full", "reason": "Responding to alerts includes reviewing access logs for unusual entries and failed attempts.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.DE.CM.02", "ref": "DE.CM-02", "atom": "NIST.DE.CM.02-c", "text": "The organization tests and maintains its alarm and CCTV systems.", "match": "req_smaller", "cov": "full", "reason": "Monitoring depends on working alarm and camera systems, which are tested and maintained.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-PHY-05", "title": "Physical and environmental threat protection", "domain": "PHY", "theme": "Physical", "goal": "The organization assesses physical and environmental threats for each site and installs and maintains protection against them.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "", "statement": "Physical and environmental threats are assessed for each in-scope site, such as fire, flood, power surge and civil unrest, and the protection the assessment calls for is installed. That protection is maintained and tested on a defined cycle, and the certificates are kept. This lowers the chance that a natural event or attack on a site destroys information or equipment.", "why": "Without a site-level assessment, protection is guesswork and the likely hazards go unprotected.", "how": "Ask for the threat assessment per site and then for proof the protection it asks for is installed and current. Example probe: \"What does your assessment say about flooding at the data room, and what is installed because of it?\"", "q": "Does your organization protect each site against the physical threats it faces?", "evidence": "Physical and environmental threat assessment for each in-scope site; risk assessment extracts; maintenance and test certificates for fire suppression, water detection and similar protection. Cover the review period.", "good": "Each site has a documented assessment covering the likely hazards. Protective measures named in it are installed, and maintenance or test records are current.", "test": "Select a sample of sites and compare each assessment with the installed protection. Pass if a documented assessment exists for every sampled site, each protection it identifies is installed, and maintenance or test records are current.", "risk": "A fire, flood or power event could destroy information and equipment with no protection in place.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.5", "ref": "Annex A.7.5", "atom": "ISO.A7.5-a", "text": "Assess physical and environmental threats for each in-scope site.", "match": "equal", "cov": "full", "reason": "The threat assessment is the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.5", "ref": "Annex A.7.5", "atom": "ISO.A7.5-b", "text": "Install and maintain the protection the assessment identifies.", "match": "equal", "cov": "full", "reason": "Installed and maintained protection is the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.02", "ref": "PR.IR-02", "atom": "NIST.PR.IR.02-a", "text": "The organization protects facilities housing its equipment against environmental threats such as fire, heat, water and power loss.", "match": "equal", "cov": "full", "reason": "Protection against physical and environmental threats is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.02", "ref": "PR.IR-02", "atom": "NIST.PR.IR.02-c", "text": "The organization maintains and inspects environmental protection equipment.", "match": "req_smaller", "cov": "full", "reason": "Maintaining the installed protection is in the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PHY-06", "title": "Working in secure areas", "domain": "PHY", "theme": "Physical", "goal": "The organization sets rules for working in secure areas and makes authorized people aware of them.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "", "statement": "Rules for working in secure areas are documented, for example no unsupervised third parties, no recording devices and areas locked when vacant. Authorized people are made aware of the rules through a briefing or signed acknowledgement before they get access. This keeps behavior inside secure areas consistent and defensible.", "why": "People with access to secure areas often do not know what is expected of them while inside.", "how": "Ask for the written rules and how people with access are told about them. Example probe: \"What does a new engineer with data-center access sign or hear before their first entry?\"", "q": "Does your organization set rules for working in secure areas and make sure authorized people know them?", "evidence": "Secure area working rules; briefing records or signed acknowledgements; list of people authorized for secure areas. Cover the review period.", "good": "Written rules cover supervision, devices and locking. Each authorized person has a briefing record or acknowledgement on file.", "test": "Sample people on the authorized list for secure areas. Pass if the rules are documented and each sampled person has a briefing record or signed acknowledgement dated no later than their access.", "risk": "People could behave unsafely in secure areas without knowing it, or without any basis for action.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.6", "ref": "Annex A.7.6", "atom": "ISO.A7.6-a", "text": "Document rules for working in secure areas.", "match": "equal", "cov": "full", "reason": "Same ask: documented rules.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.6", "ref": "Annex A.7.6", "atom": "ISO.A7.6-b", "text": "Make authorized personnel aware of the rules.", "match": "equal", "cov": "full", "reason": "Awareness of the rules is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-07", "title": "Clear desk and clear screen", "domain": "PHY", "theme": "Physical", "goal": "The organization sets and enforces rules that keep papers, removable media and unattended screens from exposing information.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "", "statement": "Clear desk and clear screen rules are set for papers, removable media and unattended screens. Automatic screen lock after inactivity is enforced by configuration. Compliance is spot-checked on a defined cycle and findings are followed up until closed. This stops information being read or taken from untended desks and screens.", "why": "Policies alone do not stop information being left on desks and open screens, so the rules need both configuration and checks.", "how": "Ask for the policy, the screen lock setting and the last spot-check. Example probe: \"How do you know people actually lock their screens and clear their desks, not just that the policy says so?\"", "q": "Does your organization enforce rules that stop papers, removable media and unattended screens from exposing information?", "evidence": "Clear desk and clear screen policy; device management policy export showing the screen lock setting; spot-check records and follow-up actions. Cover the review period.", "good": "The policy defines rules for papers, removable media and screens. Screen lock is enforced by configuration on endpoints. Spot-checks happen on a cycle, and findings have owners and closure dates.", "test": "Review the policy, then sample endpoints from the management export and sample spot-check records for the period. Pass if the policy exists, every sampled endpoint has screen lock enforced, and spot-check findings were followed up.", "risk": "Information could be read, copied or stolen from unattended desks and screens.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.7", "ref": "Annex A.7.7", "atom": "ISO.A7.7-a", "text": "Set clear desk and clear screen rules for papers, removable media and unattended screens.", "match": "equal", "cov": "full", "reason": "Same ask: the rules.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.7", "ref": "Annex A.7.7", "atom": "ISO.A7.7-b", "text": "Enforce automatic screen lock after inactivity by configuration.", "match": "equal", "cov": "full", "reason": "Enforcement by settings is part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.7", "ref": "Annex A.7.7", "atom": "ISO.A7.7-c", "text": "Check compliance with the rules and follow up findings.", "match": "equal", "cov": "full", "reason": "Enforcement checks are in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-08", "title": "Equipment siting and protection", "domain": "PHY", "theme": "Physical", "goal": "The organization sites and protects equipment to reduce environmental risk and unauthorized access.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "", "statement": "Siting requirements for equipment are defined, for example servers in locked racks or rooms, screens not overlooked and protection from environmental hazards. On a defined cycle, inspection confirms that sampled equipment locations meet the requirements. This reduces environmental damage and unauthorized access to equipment.", "why": "Equipment placed for convenience can be exposed to water, heat, theft or shoulder-surfing.", "how": "Ask for the siting requirements and the latest inspection of equipment locations. Example probe: \"Can I see where your network switches and servers sit, and the inspection that says that is acceptable?\"", "q": "Does your organization site its equipment so it is safe from hazards and tampering?", "evidence": "Equipment siting requirements; equipment location inspection records. Cover the review period.", "good": "Requirements say where equipment must and must not sit. Inspection records show locations meet them, with exceptions corrected.", "test": "Select a sample of equipment locations and inspect or review inspection records. Pass if every sampled location meets the siting requirements.", "risk": "Equipment is exposed to environmental damage, tampering or theft.", "applies": "Applies where the organization has equipment on premises of its own.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.8", "ref": "Annex A.7.8", "atom": "ISO.A7.8-a", "text": "Define siting requirements for equipment.", "match": "equal", "cov": "full", "reason": "Same ask: siting requirements.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.8", "ref": "Annex A.7.8", "atom": "ISO.A7.8-b", "text": "Confirm sampled equipment locations meet the requirements.", "match": "equal", "cov": "full", "reason": "Inspection is the control's proof.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-09", "title": "Assets off premises", "domain": "PHY", "theme": "Physical", "goal": "The organization sets rules for protecting assets taken off premises and protects portable devices with encryption and remote wipe.", "owner": "Head of IT Operations", "imp": "medium", "origin": "iso", "note": "", "statement": "Rules for protecting assets taken off premises are set, such as not leaving them unattended, carrying them as hand luggage and getting authorization to remove them. Full-disk encryption and remote wipe are enforced on portable devices used off-site through device management, and the compliance report is reviewed on a defined cycle. This keeps information safe if a device is lost or stolen.", "why": "Portable devices are lost often, and an unencrypted device without remote wipe turns a lost laptop into a data breach.", "how": "Ask for the rules and the device compliance report. Example probe: \"If a laptop is stolen from a car tonight, what stops the thief reading it and who can wipe it?\"", "q": "Does your organization protect assets that leave its premises, including encryption and remote wipe on portable devices?", "evidence": "Off-premises asset rules; device management compliance report showing encryption and remote wipe status; authorization records for removing assets. Cover the review period.", "good": "Rules are written and known. Every portable device in use has full-disk encryption and remote wipe enabled, and exceptions are approved and tracked.", "test": "Sample portable devices from the inventory and check each against the compliance report. Pass if the rules exist and every sampled device has full-disk encryption and remote wipe enabled, or an approved exception.", "risk": "Lost or stolen devices expose the information stored on them.", "applies": "Applies if staff or contractors take assets or portable devices off premises.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.9", "ref": "Annex A.7.9", "atom": "ISO.A7.9-a", "text": "Document rules for protecting assets taken off premises.", "match": "equal", "cov": "full", "reason": "Same ask: off-site rules.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.9", "ref": "Annex A.7.9", "atom": "ISO.A7.9-b", "text": "Protect portable devices used off-site with full-disk encryption and remote wipe.", "match": "equal", "cov": "full", "reason": "Device protection is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-10", "title": "Supporting utilities", "domain": "PHY", "theme": "Physical", "goal": "The organization protects processing facilities from power and other utility failures and maintains the protection.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "", "statement": "Critical facilities are protected against power and other utility failures through measures such as UPS, generators or redundant feeds. Maintenance and test records are kept for that equipment, and it is tested on a defined cycle. This keeps processing running, or shuts it down safely, when a utility fails.", "why": "An untested UPS or generator fails when it is needed, and a utility failure can corrupt data or stop the business.", "how": "Ask which facilities are critical, what protects their power, cooling and telecoms, and when it was last tested. Example probe: \"When did you last run the generator under load and where is that record?\"", "q": "Does your organization protect its critical facilities from power and other utility failures?", "evidence": "Utility protection design for critical facilities; maintenance and test records for UPS, generators and cooling; continuity plan extracts. Cover the review period.", "good": "Each critical facility has defined protection for power, cooling and telecoms. UPS and generator equipment has current maintenance and test records, and failures are fixed and recorded.", "test": "Select a sample of critical facilities and their protection equipment. Pass if protection is defined for each, and each sampled item has a maintenance or test record that is current for the period.", "risk": "A power or utility outage could stop operations or damage equipment and data.", "applies": "Applies where the organization runs critical facilities of its own.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.11", "ref": "Annex A.7.11", "atom": "ISO.A7.11-a", "text": "Define protection against power and other utility failures for critical facilities.", "match": "equal", "cov": "full", "reason": "Same ask: utility protection defined.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.11", "ref": "Annex A.7.11", "atom": "ISO.A7.11-b", "text": "Keep maintenance and test records for UPS, generators or equivalents.", "match": "equal", "cov": "full", "reason": "Maintained protection is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-11", "title": "Cabling security", "domain": "PHY", "theme": "Physical", "goal": "The organization protects power, data and communications cabling from interception, interference and damage.", "owner": "Head of Facilities", "imp": "low", "origin": "iso", "note": "", "statement": "Protection requirements for power, data and communications cabling are defined, for example conduits or locked cabinets, separation of power and data, and patch panels in secured rooms. On a defined cycle, inspection confirms that sampled cabling and communications rooms meet them. This reduces tapping, interference and accidental damage.", "why": "Exposed cabling can be tapped or cut, and shared routes let power interfere with data.", "how": "Ask for the cabling requirements and the latest inspection of communications rooms. Example probe: \"Can we look at the patch panels and tell me who can reach them?\"", "q": "Does your organization protect its cabling from interception, interference or damage?", "evidence": "Cabling protection requirements; inspection records for sampled cabling and communications rooms. Cover the review period.", "good": "Requirements address routing, separation and access to patch panels. Inspections confirm they are met, with findings fixed.", "test": "Select a sample of cabling runs and communications rooms. Pass if each sampled item meets the written requirements on inspection.", "risk": "Network or power cabling could be tapped, damaged or interfered with.", "applies": "Applies where the organization has cabling or communications rooms of its own.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.12", "ref": "Annex A.7.12", "atom": "ISO.A7.12-a", "text": "Define protection requirements for cabling.", "match": "equal", "cov": "full", "reason": "Same ask: cabling protection defined.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.12", "ref": "Annex A.7.12", "atom": "ISO.A7.12-b", "text": "Confirm sampled cabling and communications rooms meet the requirements.", "match": "equal", "cov": "full", "reason": "Inspection is the control's proof.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PHY-12", "title": "Scheduled equipment maintenance", "domain": "PHY", "theme": "Physical", "goal": "The organization maintains in-scope equipment on a schedule and only through authorized personnel.", "owner": "Head of Facilities", "imp": "medium", "origin": "iso", "note": "Split in round 2: clearing data before repair moved to UC-PHY-14.", "statement": "Maintenance requirements and schedules are defined for in-scope equipment, following supplier recommendations. Only authorized personnel carry out maintenance. Maintenance records show the work was done on schedule and by whom, which keeps equipment reliable.", "why": "Unmaintained equipment fails, and unauthorized people working on equipment can damage it or tamper with it.", "how": "Ask for the maintenance schedule and the latest maintenance records. Example probe: \"Show me the last scheduled service on the main storage array and who carried it out.\"", "q": "Does your organization maintain its in-scope equipment on a schedule through authorized personnel?", "evidence": "Equipment maintenance schedules; maintenance records showing who performed the work; list of authorized maintenance personnel or vendors; asset inventory extract. Cover the review period.", "good": "Schedules exist for all in-scope equipment and follow supplier recommendations. Records show work done on time and only by authorized personnel.", "test": "Sample equipment from the inventory and the maintenance records for the review period. Pass if each sampled item has a defined schedule and its maintenance was done on schedule by an authorized person.", "risk": "Equipment fails unexpectedly or is tampered with during unauthorized maintenance.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.13", "ref": "Annex A.7.13", "atom": "ISO.A7.13-a", "text": "Define maintenance requirements and schedules for in-scope equipment.", "match": "equal", "cov": "full", "reason": "Same ask: maintenance schedules.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A7.13", "ref": "Annex A.7.13", "atom": "ISO.A7.13-b1", "text": "Have maintenance performed only by authorized personnel.", "match": "equal", "cov": "full", "reason": "Same ask: maintenance done only by authorized personnel.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.PS.03", "ref": "PR.PS-03", "atom": "NIST.PR.PS.03-a", "text": "The organization documents procedures for hardware maintenance, end-of-life replacement and secure disposal.", "match": "req_bigger", "cov": "partial", "reason": "Control covers scheduled maintenance but not end-of-life replacement.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": "Split (D11): narrowed to scheduled maintenance by authorized personnel; the other half is now UC-PHY-14."}, {"id": "UC-PHY-13", "title": "Physical access rights review and leaver removal", "domain": "PHY", "theme": "Physical", "goal": "The organization reviews physical access rights on a defined cycle and removes access for people who leave.", "owner": "Head of Facilities", "imp": "high", "origin": "iso", "note": "Split from UC-PHY-02 in round 2 so it has its own test.", "statement": "Who holds physical access to secure areas is reviewed on a defined cycle, and any access no longer needed is removed. When a person leaves, their badges and keys are deactivated or collected and the removal is recorded. Review records and leaver removal records prove that access rights stay current.", "why": "Access rights pile up over time, and former staff can keep badges or keys that still open secure areas.", "how": "Ask when the access lists were last checked against current staff and how leavers' badges are handled. Example probe: \"Take the last person who left and show me when their badge stopped working.\"", "q": "Does your organization review physical access rights on a defined cycle and remove access for leavers?", "evidence": "Physical access review records; access lists before and after the review; leaver list from HR; badge deactivation or key return records. Cover the review period.", "good": "Access lists for each secure area are reviewed on a defined cycle, with findings actioned and recorded. Leavers' badges are deactivated or keys returned promptly, with a record that matches the leaver list.", "test": "Take the latest physical access review and a sample of leavers from the review period. Pass if the review is on file with findings actioned, and every sampled leaver's badge was deactivated or keys returned with a record.", "risk": "Former staff or people who changed roles keep physical access to secure areas.", "applies": "", "type": "detective", "freq": "quarterly", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.2", "ref": "Annex A.7.2", "atom": "ISO.A7.2-c", "text": "Review physical access rights and deactivate leavers' badges.", "match": "equal", "cov": "full", "reason": "Same ask: access rights reviewed and leavers' badges removed.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AA.06", "ref": "PR.AA-06", "atom": "NIST.PR.AA.06-c", "text": "The organization reviews physical access rights periodically and withdraws badges or keys from leavers.", "match": "equal", "cov": "full", "reason": "Same ask: periodic review of physical access and leaver removal.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "New: split from UC-PHY-02 (D11). Physical access rights review and leaver badge removal."}, {"id": "UC-PHY-14", "title": "Data cleared before equipment leaves for repair", "domain": "PHY", "theme": "Physical", "goal": "The organization clears or protects sensitive information on equipment before it is sent off site for maintenance or repair.", "owner": "Head of IT Operations", "imp": "medium", "origin": "iso", "note": "Split from UC-PHY-12 in round 2 so it has its own test.", "statement": "Before equipment leaves the site for repair, sensitive information on it is cleared or the equipment is otherwise protected. Each send-off is recorded with the method used. These records prove that repair vendors do not receive readable sensitive data.", "why": "Repair vendors can read data left on devices sent out for fixing.", "how": "Ask for the last equipment sent off site for repair and how its data was handled. Example probe: \"The last disk that went back to the vendor, who wiped it and where is the record?\"", "q": "Does your organization clear or protect sensitive information on equipment before it is sent off site for repair?", "evidence": "Repair send-off records; data clearing or sanitization records; encryption or protection records for equipment sent out; vendor repair agreements. Cover the review period.", "good": "Every item sent off site has a record showing its data was cleared or protected, and the method used. Where clearing is not possible, other protection is recorded.", "test": "Sample equipment sent off site for repair during the review period. Pass if each sampled item has a record showing sensitive information was cleared or the equipment was otherwise protected before it left.", "risk": "Sensitive data is exposed to repair vendors through equipment sent out unwiped.", "applies": "Applies where equipment is sent off site for maintenance or repair.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A7.13", "ref": "Annex A.7.13", "atom": "ISO.A7.13-b2", "text": "Clear or protect sensitive information on equipment before it is sent off site for repair.", "match": "equal", "cov": "full", "reason": "Same ask: sensitive information cleared before equipment leaves for repair.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "New: split from UC-PHY-12 (D11). Data cleared before equipment leaves for repair. Owner set to Head of IT Operations (D20)."}, {"id": "UC-PPL-01", "title": "Pre-employment screening", "domain": "PPL", "theme": "People", "goal": "The organization carries out background checks, scaled to role risk, on candidates before they join and re-checks when its rules require.", "owner": "HR Head", "imp": "high", "origin": "iso", "note": "", "statement": "Background checks required before a person joins are defined, such as identity, references, qualifications and criminal record where lawful, with depth scaled to the role, the information it can reach and the risk. The checks are completed before the start date or before access is granted. The procedure states when re-screening happens, for example on promotion to a sensitive role. Screening records prove it.", "why": "Unchecked hires in sensitive roles are a common route to insider incidents and fraud.", "how": "Ask for the screening procedure and for the records of recent joiners. Example probe: \"For the last administrator you hired, show me which checks were done and when, relative to their first day.\"", "q": "Does your organization check the background of candidates before they join, in proportion to the risk of the role?", "evidence": "Screening procedure; screening records for joiners; re-screening records or triggers. Cover the review period.", "good": "The procedure sets checks by role risk and notes lawful limits. Records show checks done before start or access. Re-screening triggers are defined and applied.", "test": "Sample joiners in the period, weighted toward sensitive roles. Pass if each sampled joiner has the required checks recorded as complete before the start date or before access was granted, and the procedure states when re-screening occurs.", "risk": "Untrustworthy or unqualified people gain access to sensitive information.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.1", "ref": "Annex A.6.1", "atom": "ISO.A6.1-a", "text": "Define the background checks required before a person joins.", "match": "equal", "cov": "full", "reason": "Defined checks are the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.1", "ref": "Annex A.6.1", "atom": "ISO.A6.1-b", "text": "Complete the checks before the start date or before access is granted.", "match": "equal", "cov": "full", "reason": "Checks before joining are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.1", "ref": "Annex A.6.1", "atom": "ISO.A6.1-c", "text": "State when re-screening is performed.", "match": "equal", "cov": "full", "reason": "Re-checks are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.1", "ref": "Annex A.6.1", "atom": "ISO.A6.1-d", "text": "Scale the depth of checks to role, information accessed and risk.", "match": "equal", "cov": "full", "reason": "Role-based scaling is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.04", "ref": "GV.RR-04", "atom": "NIST.GV.RR.04-a", "text": "HR procedures include security steps at screening, onboarding, role change and offboarding.", "match": "overlap", "cov": "partial", "reason": "Control covers the screening step only; onboarding, role change and offboarding steps are left over.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.04", "ref": "GV.RR-04", "atom": "NIST.GV.RR.04-b", "text": "The organization runs background checks before placing people in sensitive roles.", "match": "equal", "cov": "full", "reason": "Background checks scaled to role risk before joining is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PPL-02", "title": "Terms of employment", "domain": "PPL", "theme": "People", "goal": "The organization states security responsibilities of the individual and the organization in employment and contractor agreements, and has them signed.", "owner": "HR Head", "imp": "high", "origin": "iso", "note": "", "statement": "Employment and contractor agreement templates state the security responsibilities of both the individual and the organization. All current staff and contractors sign agreements that contain these terms, and the signed copies are kept. This makes security duties part of the working relationship and gives a basis for action if they are breached.", "why": "Duties that are not in the contract are hard to enforce and easy to overlook.", "how": "Ask for the contract templates and a few signed contracts. Example probe: \"Show me the clause where a contractor accepts responsibility for protecting company information.\"", "q": "Does your organization state security responsibilities in signed agreements with staff?", "evidence": "Employment and contractor agreement templates; sample of signed agreements for current staff and contractors. Cover the current workforce.", "good": "Templates carry security responsibilities for individual and organization. Signed copies exist for current staff and contractors.", "test": "Sample current staff and contractors. Pass if the templates contain the security terms and every sampled signed agreement includes them.", "risk": "Staff and contractors may not be bound by clear security duties.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.2", "ref": "Annex A.6.2", "atom": "ISO.A6.2-a", "text": "Include security responsibilities of the individual and the organization in employment and contractor agreement templates.", "match": "equal", "cov": "full", "reason": "Same ask: security terms in agreements.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.2", "ref": "Annex A.6.2", "atom": "ISO.A6.2-b", "text": "Have current staff and contractors sign agreements containing those terms.", "match": "equal", "cov": "full", "reason": "Signed agreements are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.RR.04", "ref": "GV.RR-04", "atom": "NIST.GV.RR.04-c", "text": "Employment terms or acknowledgements oblige personnel to follow security policies.", "match": "equal", "cov": "full", "reason": "Security responsibilities stated in employment terms and signed is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PPL-03", "title": "Security awareness", "domain": "PPL", "theme": "People", "goal": "The organization delivers security awareness to all personnel and relevant outside parties, covering policy, individual contribution, consequences of non-compliance and common threats such as phishing and malware, and refreshes it when policies change.", "owner": "CISO", "imp": "critical", "origin": "iso", "note": "Merge: clause on awareness and the all-staff element of the Annex awareness and training control. Role-based training split to PPL-04 because the test differs.", "statement": "A security awareness program is delivered to all personnel and relevant outside parties. It covers the security policy, each person's contribution and the consequences of non-compliance. It also covers common threats such as phishing and malicious attachments. Personnel complete it within the period the program sets, non-completers are followed up, and people are updated whenever relevant policies or procedures change. Completion reports prove it.", "why": "People are the most targeted entry point, and awareness that is not tracked or refreshed fades quickly.", "how": "Ask for the program, the completion report and the latest policy-change communication. Example probe: \"Who has not completed training this cycle, and what happens to them?\"", "q": "Does your organization keep all personnel aware of their security responsibilities?", "evidence": "Awareness program with content, audience and cycle; completion report with follow-up of non-completers; phishing and malware awareness material; communications about policy changes. Cover the review period.", "good": "A program defines content, audience and cycle. Nearly all in-scope people complete it on time, and non-completers are chased. Policy changes are communicated, and phishing content was delivered.", "test": "Take the in-scope population list and sample people. Pass if the program is defined, each sampled person has a completion record inside the defined period or a tracked follow-up, malware awareness material was delivered in the period, and at least one policy change was communicated.", "risk": "People fall for common attacks and do not know what the organization expects of them.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.3", "ref": "Annex A.6.3", "atom": "ISO.A6.3-a", "text": "Define an awareness and training programme with content, audiences and frequency.", "match": "equal", "cov": "full", "reason": "The programme with content and frequency is the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.3", "ref": "Annex A.6.3", "atom": "ISO.A6.3-b", "text": "Have in-scope personnel complete awareness training within the set period and follow up non-completers.", "match": "equal", "cov": "full", "reason": "Completion tracking is the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.3", "ref": "Annex A.6.3", "atom": "ISO.A6.3-d", "text": "Update personnel when relevant policies or procedures change.", "match": "equal", "cov": "full", "reason": "Refresh on policy change is in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.7", "ref": "Annex A.8.7", "atom": "ISO.A8.7-c", "text": "Deliver awareness material on malware risks such as phishing and suspicious attachments.", "match": "req_smaller", "cov": "full", "reason": "The awareness control covers common threats such as phishing and malware for all personnel.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.3", "ref": "Clause 7.3", "atom": "ISO.C7.3-a", "text": "Make people aware of the security policy.", "match": "equal", "cov": "full", "reason": "Policy awareness is in PPL-03.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.3", "ref": "Clause 7.3", "atom": "ISO.C7.3-b", "text": "Make people aware of their contribution to the program and the benefit of better performance.", "match": "equal", "cov": "full", "reason": "Individual contribution is in PPL-03.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.3", "ref": "Clause 7.3", "atom": "ISO.C7.3-c", "text": "Make people aware of the consequences of not conforming.", "match": "equal", "cov": "full", "reason": "Consequences of non-compliance are in PPL-03.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AT.01", "ref": "PR.AT-01", "atom": "NIST.PR.AT.01-a", "text": "The organization runs a security awareness program covering all personnel, including contractors with access.", "match": "equal", "cov": "full", "reason": "Awareness for all personnel and relevant outside parties is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AT.01", "ref": "PR.AT-01", "atom": "NIST.PR.AT.01-b", "text": "The awareness content covers phishing and social engineering, reporting, acceptable use and credential hygiene.", "match": "equal", "cov": "full", "reason": "Covering policy, phishing and common threats is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AT.01", "ref": "PR.AT-01", "atom": "NIST.PR.AT.01-c", "text": "Personnel complete awareness training on a regular cycle.", "match": "req_smaller", "cov": "full", "reason": "Delivering and refreshing awareness is the control's test.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AT.01", "ref": "PR.AT-01", "atom": "NIST.PR.AT.01-d", "text": "The organization checks awareness through knowledge tests or phishing simulations.", "match": "req_bigger", "cov": "partial", "reason": "Control delivers awareness but does not require testing effectiveness.", "primary": false, "rem": "", "imm": "Knowledge checks and phishing simulations are produced by the same awareness program and sampled in the same test; suggest adding to the control goal."}], "nrec": 4, "r2": ""}, {"id": "UC-PPL-04", "title": "Role-based security training", "domain": "PPL", "theme": "People", "goal": "The organization gives people in technical, privileged and other high-risk roles training matched to their duties, such as secure coding for developers.", "owner": "CISO", "imp": "high", "origin": "iso", "note": "Split from Annex awareness and training record.", "statement": "People in technical, privileged and other high-risk roles receive training matched to their duties, such as secure coding for developers. A role-based curriculum is defined, completion is tracked, and it is refreshed at least yearly for developers. Training records prove it.", "why": "General awareness does not give administrators and developers the skills their work demands, and mistakes in these roles do more damage.", "how": "Ask which roles need specific training and for the completion records. Example probe: \"When did your developers last take secure coding training, and who has not?\"", "q": "Does your organization give people in technical, privileged and other high-risk roles training matched to their duties?", "evidence": "Role-based training curriculum; list of technical, privileged and high-risk roles; completion records, including secure coding training for developers. Cover the review period.", "good": "High-risk roles are listed, each has defined training, and completion is tracked. Developers have taken secure coding training in the last year.", "test": "Sample people in technical, privileged and developer roles. Pass if each sampled person has a completion record for the training defined for their role, and each sampled developer completed secure coding training within the last year.", "risk": "Privileged and technical staff lack the skills to avoid or spot role-specific security mistakes.", "applies": "The secure coding element applies if the organization develops software in house.", "type": "preventive", "freq": "annual", "ks": "base: developer secure coding training: at least once a year", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.3", "ref": "Annex A.6.3", "atom": "ISO.A6.3-c", "text": "Give technical and privileged roles role-specific training.", "match": "equal", "cov": "full", "reason": "Role-specific training is the whole of PPL-04.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.28", "ref": "Annex A.8.28", "atom": "ISO.A8.28-c", "text": "Give developers secure coding training at least yearly.", "match": "req_smaller", "cov": "full", "reason": "Role-based training for technical roles covers secure coding training for developers.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AT.02", "ref": "PR.AT-02", "atom": "NIST.PR.AT.02-a", "text": "The organization identifies roles that need specialized security training.", "match": "req_smaller", "cov": "full", "reason": "Training for technical, privileged and high-risk roles needs those roles identified.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AT.02", "ref": "PR.AT-02", "atom": "NIST.PR.AT.02-b", "text": "The organization defines role-based training content for each identified role.", "match": "equal", "cov": "full", "reason": "Training matched to duties is the same ask.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.AT.02", "ref": "PR.AT-02", "atom": "NIST.PR.AT.02-c", "text": "Holders of those roles complete their role-based training.", "match": "req_smaller", "cov": "full", "reason": "Role holders being trained is the control's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-PPL-05", "title": "Competence of security personnel", "domain": "PPL", "theme": "", "goal": "The organization determines the competence needed by people who affect security performance, ensures they have it, takes action where they do not and keeps evidence.", "owner": "HR Head", "imp": "high", "origin": "iso", "note": "Clause only.", "statement": "The competence needed by people whose work affects security performance is determined, and those people are shown to have it, through education, training or experience. Where competence is missing, action is taken to gain it and checked to see whether it worked. Evidence of competence is kept on file and reviewed on a defined cycle.", "why": "A security program run by people without the right skills tends to fail quietly.", "how": "Ask which roles affect security performance, what competence each needs, and how gaps are closed. Example probe: \"Pick one security role and show me how you know the person holds the skills it needs.\"", "q": "Does your organization make sure the people who affect security performance have the competence their roles need?", "evidence": "Competence requirements for security-relevant roles; qualification, training or experience records; action plans for competence gaps and their evaluation. Cover the review period.", "good": "Required competence is written per role. Records show each holder meets it, and gaps have an action and a later check.", "test": "Sample holders of security-relevant roles. Pass if each has competence records matching the written requirement, and any gap has a recorded action and an evaluation of the result.", "risk": "People may run security work without the skills to do it well.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.C7.2", "ref": "Clause 7.2", "atom": "ISO.C7.2-a", "text": "Determine the competence needed by people who affect security performance.", "match": "equal", "cov": "full", "reason": "Competence definition is the first element of PPL-05.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.2", "ref": "Clause 7.2", "atom": "ISO.C7.2-b", "text": "Ensure those people are competent through education, training or experience.", "match": "equal", "cov": "full", "reason": "Ensuring competence is in PPL-05.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.2", "ref": "Clause 7.2", "atom": "ISO.C7.2-c", "text": "Take action to gain missing competence and evaluate whether it worked.", "match": "equal", "cov": "full", "reason": "Acting on gaps and evaluating is in PPL-05.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.C7.2", "ref": "Clause 7.2", "atom": "ISO.C7.2-d", "text": "Keep evidence of competence.", "match": "equal", "cov": "full", "reason": "Evidence retention is in PPL-05.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PPL-06", "title": "Disciplinary process", "domain": "PPL", "theme": "People", "goal": "The organization has a formal, communicated disciplinary process for security policy violations.", "owner": "HR Head", "imp": "medium", "origin": "iso", "note": "", "statement": "A documented disciplinary process covers violations of security policy and is communicated to all personnel, for example through the handbook, policy acknowledgement or training. When a violation occurs, the process is applied and the outcome is recorded. This gives people a clear understanding of the consequences and the organization a fair way to act.", "why": "Without a known disciplinary route, security rules lack consequences and responses vary from case to case.", "how": "Ask for the process, how people learn about it, and how recent violations were handled. Example probe: \"How would a staff member learn that sharing a password can lead to formal action?\"", "q": "Does your organization have a formal, communicated disciplinary process for security policy violations?", "evidence": "Disciplinary procedure that covers security violations; handbook, policy acknowledgement or training content that communicates it; records of cases handled. Cover the review period.", "good": "A written process covers security violations. Personnel receive it at joining and when it changes. Cases follow the process and are recorded.", "test": "Review the procedure, then sample personnel and any cases in the period. Pass if the procedure covers security violations, each sampled person has evidence of receiving it, and each sampled case followed the procedure.", "risk": "Security policy breaches have no agreed consequences, which weakens compliance.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.4", "ref": "Annex A.6.4", "atom": "ISO.A6.4-a", "text": "Document a disciplinary process that covers security policy violations.", "match": "equal", "cov": "full", "reason": "Same ask: a formal disciplinary process.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.4", "ref": "Annex A.6.4", "atom": "ISO.A6.4-b", "text": "Communicate the process to personnel.", "match": "equal", "cov": "full", "reason": "Communication is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PPL-07", "title": "Responsibilities after leaving", "domain": "PPL", "theme": "People", "goal": "The organization defines and communicates the security responsibilities that continue after employment ends or changes.", "owner": "HR Head", "imp": "medium", "origin": "iso", "note": "", "statement": "The security responsibilities that continue after employment ends or changes, such as confidentiality and return of information, are defined and stated in contracts or leaver documents. At exit, these obligations are communicated to each leaver, and an exit letter or signed acknowledgement is kept. This keeps former staff bound after they stop having access.", "why": "People who leave still know company secrets, and obligations that are not repeated at exit are easy to dismiss.", "how": "Ask for the contract clause or exit document and the records for recent leavers. Example probe: \"What do you give a departing engineer that reminds them what they must still protect?\"", "q": "Does your organization define and communicate the security duties that continue after a person leaves or changes role?", "evidence": "Contract templates or leaver documents that state continuing duties; exit letters or signed acknowledgements for leavers. Cover the review period.", "good": "Continuing duties are written down and are part of the exit steps. Every leaver has a record that they were told.", "test": "Sample leavers and role changes in the period. Pass if each sampled person has an exit letter or acknowledgement, and the continuing duties appear in the contract or leaver document.", "risk": "Former staff may reuse or share information because nobody reminded them of their duties.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.5", "ref": "Annex A.6.5", "atom": "ISO.A6.5-a", "text": "Define the security responsibilities that continue after termination or change of employment.", "match": "equal", "cov": "full", "reason": "Same ask: continuing responsibilities defined.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.5", "ref": "Annex A.6.5", "atom": "ISO.A6.5-b", "text": "Communicate the continuing obligations to leavers at exit.", "match": "equal", "cov": "full", "reason": "Communication at exit is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PPL-08", "title": "Confidentiality agreements", "domain": "PPL", "theme": "People", "goal": "The organization has staff and relevant external parties sign confidentiality agreements that reflect its protection needs, and reviews the templates.", "owner": "Legal Counsel", "imp": "medium", "origin": "iso", "note": "", "statement": "Confidentiality agreement templates for staff and for relevant external parties are kept and reflect the organization's protection needs. Staff, contractors and external parties with access sign them before access begins, and the templates are reviewed on a defined cycle. Signed copies and template version history prove it.", "why": "Without signed confidentiality terms, disclosure of sensitive information is harder to prevent or challenge.", "how": "Ask for the templates and a few signed agreements. Example probe: \"Which agreement did the last external consultant sign before seeing client data and when was that template last reviewed?\"", "q": "Does your organization have staff and relevant external parties sign confidentiality agreements that reflect its protection needs?", "evidence": "Confidentiality agreement templates for staff and external parties; signed agreements for a sample of staff, contractors and external parties; template version history and review record. Cover the review period.", "good": "Templates fit the information being protected. Everyone with access to confidential information has signed before access. Templates are reviewed on the defined cycle and changes are tracked.", "test": "Sample staff, contractors and external parties with access to confidential information. Pass if each has a signed agreement on file dated no later than their access, and the template history shows a review within the defined cycle.", "risk": "Confidential information can be disclosed with no enforceable obligation.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001"], "sources": [{"fw": "iso27001", "rec": "ISO.A6.6", "ref": "Annex A.6.6", "atom": "ISO.A6.6-a", "text": "Keep confidentiality agreement templates for staff and external parties reflecting protection needs.", "match": "equal", "cov": "full", "reason": "Templates reflecting needs are the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.6", "ref": "Annex A.6.6", "atom": "ISO.A6.6-b", "text": "Have staff, contractors and external parties with access sign the agreements.", "match": "equal", "cov": "full", "reason": "Signed agreements are the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A6.6", "ref": "Annex A.6.6", "atom": "ISO.A6.6-c", "text": "Review the templates at the defined interval.", "match": "equal", "cov": "full", "reason": "Template review is in the control goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PPL-40", "title": "Security steps across the employment life cycle", "domain": "PPL", "theme": "", "goal": "The organization builds security steps into its HR procedures for onboarding, role change and offboarding, in addition to screening, and confirms they were done.", "owner": "HR Head", "imp": "medium", "origin": "nist", "note": "Remainder of UC-PPL-01.", "statement": "Security steps are built into the HR procedures for onboarding, role change and offboarding, in addition to screening. These include signing the security policies or acknowledging them in the employment terms, granting access only for the role, adjusting access when the role changes and removing all access when the person leaves. A checklist or record confirms that each step was completed for every joiner, mover and leaver. This keeps access and obligations in step with who works for the organization.", "why": "People who change roles or leave often keep access they should have lost, and new joiners start without agreeing to security rules. Consultants check that the steps happen for real people, not just that a procedure lists them.", "how": "Ask for a walk-through of what happens on a joiner's first day, a transfer and a leaving date. Then ask for the completed records for a few real people. Example probe: \"Take someone who left last quarter. Show me the record that their access was removed and who confirmed it.\"", "q": "Does your organization carry out defined security steps whenever people join, change roles or leave?", "evidence": "HR onboarding, role change and offboarding procedures with their security steps; employment terms or signed policy acknowledgments; joiner, mover and leaver records or checklists; access removal confirmations for leavers; covering the last annual cycle.", "good": "The procedures name the security step at each stage, including policy acknowledgment, access set for the role, access change on a role move and access removal on exit. Completed checklists exist for every sampled person, with sign-off for each step.", "test": "Read the procedures and confirm they include security steps for onboarding, role change and offboarding. Sample joiners, movers and leavers from the review period and confirm each has a completed record showing policy acknowledgment and the correct access change or removal. Pass if the procedures cover all three stages and every sampled person has a completed record.", "risk": "Leavers and movers keep access they should not have, and staff are never held to the security rules.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.RR.04", "ref": "GV.RR-04", "atom": "NIST.GV.RR.04-a", "text": "HR procedures include security steps at screening, onboarding, role change and offboarding.", "match": "equal", "cov": "full", "reason": "The slot holds the security steps at the other employment stages.", "primary": false, "rem": "UC-PPL-01", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-SUP-01", "title": "Supplier inventory and risk tiering", "domain": "SUP", "theme": "Organizational", "goal": "The organization identifies its suppliers, rates their security risk and keeps a register of those with access to its information or systems.", "owner": "Head of Procurement", "imp": "high", "origin": "iso", "note": "Split from supplier relationships record: register and risk tiering. Due diligence (SUP-02) has a different test.", "statement": "How suppliers are identified, rated for security risk and selected is defined. A register is kept of every supplier with access to the organization's information or systems, each with a risk rating, and it is reviewed on a defined cycle. This shows which suppliers matter most and where to focus oversight.", "why": "Without a register and ratings, the organization cannot say who has access to its data or which suppliers need the most scrutiny.", "how": "Ask for the register and how a new supplier gets onto it and gets a rating. Example probe: \"Show me the list of suppliers with system or data access, and the risk rating of the three most critical.\"", "q": "Does your organization keep a risk-rated register of the suppliers that have access to its information or systems?", "evidence": "Supplier security policy or procedure; supplier register with risk ratings; register review record. Cover the review period.", "good": "A procedure sets how suppliers are identified and rated. The register is complete, current and rated. Reviews of the register are recorded.", "test": "Sample suppliers from procurement or payment records and check each against the register. Pass if the procedure exists, each sampled supplier with access appears in the register, and each has a risk rating.", "risk": "Supplier risk is invisible, so high-risk suppliers get no extra oversight.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.19", "ref": "Annex A.5.19", "atom": "ISO.A5.19-a", "text": "Define how suppliers are identified, risk-rated and selected.", "match": "equal", "cov": "full", "reason": "Identification and risk rating are the control's content.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.19", "ref": "Annex A.5.19", "atom": "ISO.A5.19-b", "text": "Keep a register of suppliers with access to information or systems, each with a risk rating.", "match": "equal", "cov": "full", "reason": "The register with ratings is the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.04", "ref": "GV.SC-04", "atom": "NIST.GV.SC.04-a", "text": "The organization keeps a complete register of its suppliers.", "match": "equal", "cov": "full", "reason": "A register of suppliers is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.04", "ref": "GV.SC-04", "atom": "NIST.GV.SC.04-b", "text": "The organization defines criteria for supplier criticality.", "match": "req_smaller", "cov": "full", "reason": "Rating supplier security risk requires written criteria.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.04", "ref": "GV.SC-04", "atom": "NIST.GV.SC.04-c", "text": "The organization rates each supplier's criticality under those criteria.", "match": "equal", "cov": "full", "reason": "Rating each supplier is the control's core.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.07", "ref": "GV.SC-07", "atom": "NIST.GV.SC.07-a", "text": "The organization records the risk and priority of each supplier and its products and services.", "match": "req_smaller", "cov": "full", "reason": "Rating each supplier's risk and keeping that register is in the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.04", "ref": "ID.AM-04", "atom": "NIST.ID.AM.04-a", "text": "The organization inventories the external services its suppliers provide.", "match": "req_smaller", "cov": "full", "reason": "The register of suppliers with access to information or systems includes the services they provide.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.AM.04", "ref": "ID.AM-04", "atom": "NIST.ID.AM.04-b", "text": "The organization requires a new external service to be added to the inventory before use.", "match": "req_smaller", "cov": "full", "reason": "A register current before access is granted needs new services added before use.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-SUP-02", "title": "Supplier due diligence", "domain": "SUP", "theme": "Organizational", "goal": "The organization completes a security assessment of a supplier before contract signature or access is granted.", "owner": "Head of Procurement", "imp": "high", "origin": "iso", "note": "Split from supplier relationships record.", "statement": "A security assessment of each supplier is completed before the contract is signed or access is granted, and the result is kept. The depth of the assessment follows the supplier's risk rating. This lets the organization decline or condition a supplier that cannot meet its security needs.", "why": "Assessing a supplier after it has access leaves the organization committed to a risk it never evaluated.", "how": "Ask for the due diligence records of recent suppliers, with dates. Example probe: \"For the last supplier onboarded, show me the assessment and the date relative to access being granted.\"", "q": "Does your organization complete a security assessment of a supplier before signing the contract or granting access?", "evidence": "Supplier due-diligence procedure; due-diligence assessment records for suppliers onboarded in the period, with dates of contract signature and access. Cover the review period.", "good": "Every new supplier is assessed in proportion to its risk before signature or access. Findings are recorded with a decision to proceed, condition or decline.", "test": "Sample suppliers onboarded in the period. Pass if each sampled supplier has a completed assessment dated before contract signature or access, and any findings have a recorded decision.", "risk": "The organization onboards suppliers whose security it has never checked.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.19", "ref": "Annex A.5.19", "atom": "ISO.A5.19-c", "text": "Complete a security due-diligence assessment before contract signature or access.", "match": "equal", "cov": "full", "reason": "Pre-engagement assessment is the whole of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.06", "ref": "GV.SC-06", "atom": "NIST.GV.SC.06-a", "text": "The organization requires a documented due-diligence procedure with a cybersecurity risk assessment before a supplier relationship starts.", "match": "equal", "cov": "full", "reason": "Completing a supplier security assessment before contract is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.RA.10", "ref": "ID.RA-10", "atom": "NIST.ID.RA.10-a", "text": "The organization assesses suppliers judged critical before acquiring their products or services.", "match": "equal", "cov": "full", "reason": "Assessing a supplier before contract or access, for suppliers judged critical, is t
