very sampled harmful processing is prohibited or blocked.", "risk": "Children are harmed by processing that was never assessed, with legal exposure and reputational damage.", "applies": "Applies if the organization processes personal data of children.", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH4.CHILD.2", "ref": "Section 9(2)", "atom": "CH4.CHILD.2-a", "text": "Do not process children's personal data in a way that harms their well-being.", "match": "equal", "cov": "full", "reason": "Same ask: no processing that harms a child's well-being.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PSC-05", "title": "Transfers only to permitted destinations", "domain": "PSC", "theme": "", "goal": "The organization tracks government restrictions on destinations for personal data and does not transfer personal data to a restricted country or territory.", "owner": "Legal Counsel", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Government notifications that restrict transfers of personal data to specific countries or territories are tracked and kept current. Before personal data is sent outside India, the destination is checked against the current restrictions, and transfers to a restricted destination are stopped. The check is updated when a new notification is published. Proof is the notification tracker and the destination check records.", "why": "Restrictions can change at short notice, and data may keep flowing to a newly restricted destination if nobody is watching.", "how": "Ask who watches for new restrictions and how a change reaches the parts of the business that send data abroad. Compare current destinations with the restrictions. Example probe: \"Which destinations do you send data to, and when did you last check them against the government's restrictions?\"", "q": "Does your organization make sure it does not transfer personal data to any country or territory restricted by the government?", "evidence": "Notification tracker; destination check procedure; transfer approvals or check records; hosting region configuration for the audit period.", "good": "Notifications are tracked. A procedure checks each destination before transfer and stops restricted ones. The tracker is current and the system hosting regions match the permitted list.", "test": "Obtain the tracker and the list of destinations in the flow inventory. Check each destination against current restrictions and sample hosting regions of systems holding personal data. Pass if no sampled destination is restricted and the tracker is current and was reviewed recently.", "risk": "Personal data is sent to a restricted destination, which is an unlawful transfer.", "applies": "Applies if the organization transfers personal data outside India.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CB.TRANSFER.1", "ref": "Section 16(1)", "atom": "CB.TRANSFER.1-a", "text": "Transfer personal data outside India only to countries or territories not restricted by the Central Government.", "match": "req_smaller", "cov": "full", "reason": "Transferring only to permitted destinations is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CB.TRANSFER.2", "ref": "Section 16", "atom": "CB.TRANSFER.2-a", "text": "Track Central Government notifications that restrict transfers to specific countries or territories.", "match": "req_smaller", "cov": "full", "reason": "Tracking restriction notices is part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CB.TRANSFER.2", "ref": "Section 16", "atom": "CB.TRANSFER.2-b", "text": "Do not transfer personal data to a country or territory restricted by such a notification.", "match": "req_smaller", "cov": "full", "reason": "No transfer to a restricted destination is the control.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PSC-06", "title": "Cross-border flow inventory", "domain": "PSC", "theme": "", "goal": "The organization keeps an inventory of its cross-border flows of personal data.", "owner": "Data Governance Lead", "imp": "medium", "origin": "dpdpa", "note": "Privacy-only. May relate to AST-06 (transfer channels) but the test is the destination inventory.", "statement": "An inventory lists every flow of personal data outside India, naming the destination country and the recipient for each flow. It is updated whenever a new flow starts or a recipient changes, and reconciled with system hosting regions on a defined cycle. Proof is the inventory and the reconciliation records.", "why": "Without a complete list of where data goes abroad, no destination check can work and cloud regions can change unnoticed.", "how": "Ask for the list and test its completeness against cloud hosting, vendors and group entities. Example probe: \"Show me the hosting region of your main customer database and where it appears in your inventory.\"", "q": "Does your organization maintain an inventory of its cross-border flows of personal data?", "evidence": "Cross-border flow inventory with destination and recipient; data flow diagrams; cloud hosting configuration; reconciliation records for the audit period.", "good": "Every outbound flow is listed with its destination and recipient. The inventory is updated when flows change and matches the hosting configuration of the systems checked.", "test": "Obtain the inventory. Sample systems that hold personal data and compare their hosting regions and external recipients with it. Pass if every sampled flow is listed with destination and recipient and the hosting regions match.", "risk": "Data leaves the country unseen, so destination rules cannot be applied or shown.", "applies": "Applies if the organization transfers personal data outside India.", "type": "detective", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CB.TRANSFER.1", "ref": "Section 16(1)", "atom": "CB.TRANSFER.1-b", "text": "Maintain an inventory of cross-border data flows.", "match": "equal", "cov": "full", "reason": "Same ask: inventory of cross-border flows.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PSC-07", "title": "Local storage and sectoral transfer rules", "domain": "PSC", "theme": "", "goal": "The organization identifies legal requirements on where categories of personal data must be stored or may be sent, beyond the general destination rules, and complies with them.", "owner": "Legal Counsel", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Applies where such requirements exist.", "statement": "A register lists each law or regulator direction that requires categories of personal data to be stored in India or limits where they may be sent, beyond the general destination rules. For each requirement, the register records the affected data and its storage location, and a control keeps that data, including backups and disaster recovery copies, in India. The register is reviewed on a defined cycle. Proof is the register and the hosting configuration.", "why": "Sector rules and government directions can require local storage, and a backup or recovery copy abroad breaks them without anyone noticing.", "how": "Ask which sector regulators or government directions apply and which data they cover. Then check where that data and its backups sit. Example probe: \"Which data must stay in India, and where is its backup held?\"", "q": "Does your organization comply with legal requirements on where categories of personal data must be stored or may be sent?", "evidence": "Register of storage and transfer requirements; data storage location records; cloud hosting configuration including backup and recovery regions; register review records for the audit period.", "good": "The register lists every applicable requirement and the data it covers. Storage for each is documented as India. Hosting settings, including backups and recovery copies, show India regions only.", "test": "Read the register. For each requirement, check the documented storage location and inspect hosting configuration including backups and recovery copies. Pass if every sampled requirement maps to data stored only in India.", "risk": "The organization breaches local storage or sector transfer rules and risks regulatory action or loss of its license.", "applies": "Applies if a law or regulator direction requires categories of personal data to be stored in India or limits where they may be sent.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CB.TRANSFER.2", "ref": "Section 16", "atom": "CB.TRANSFER.2-c", "text": "Comply with any stricter sectoral law in force in India on transfers outside India.", "match": "req_smaller", "cov": "full", "reason": "Complying with stricter sectoral transfer rules is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CB.TRANSFER.3", "ref": "Section 16", "atom": "CB.TRANSFER.3-a", "text": "Store the categories of personal data in India that the Central Government requires to be localized.", "match": "req_smaller", "cov": "full", "reason": "Storing mandated categories locally is in the control.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}], "clauses": [{"id": "ISO.C4.1", "ref": "Clause 4.1", "title": "Understanding the organization and its context", "atoms": [{"id": "ISO.C4.1-a", "text": "Determine the external and internal issues that matter to the organization's purpose and affect its security outcomes."}, {"id": "ISO.C4.1-b", "text": "Decide whether climate change is a relevant issue."}], "controls": ["UC-GOV-01"], "nv": false, "check": "ok", "checknote": "Atom a matches the 2022 text. Atom b (climate change) comes from Amendment 1:2024, which is not in the PDF you saved, so it is still unverified."}, {"id": "ISO.C4.2", "ref": "Clause 4.2", "title": "Needs and expectations of interested parties", "atoms": [{"id": "ISO.C4.2-a", "text": "Determine the interested parties that are relevant to the security program."}, {"id": "ISO.C4.2-b", "text": "Determine the requirements of those parties, which can include legal, regulatory and contractual ones and, under the 2024 amendment, climate-related ones."}, {"id": "ISO.C4.2-c", "text": "Decide which of those requirements the security program will address."}], "controls": ["UC-GOV-02"], "nv": false, "check": "fixed", "checknote": "Matches a to c. Added the PDF's note that requirements can include legal, regulatory and contractual ones. The climate wording is from Amendment 1:2024 and is unverified."}, {"id": "ISO.C4.3", "ref": "Clause 4.3", "title": "Scope of the security program", "atoms": [{"id": "ISO.C4.3-a", "text": "Determine the boundaries and applicability of the program, considering issues, requirements and dependencies."}, {"id": "ISO.C4.3-b", "text": "Keep the scope as documented information."}], "controls": ["UC-GOV-03"], "nv": false, "check": "ok", "checknote": "Matches: boundaries and applicability, issues, requirements, interfaces and dependencies, documented scope."}, {"id": "ISO.C4.4", "ref": "Clause 4.4", "title": "The security management system", "atoms": [{"id": "ISO.C4.4-a", "text": "Establish and implement the security management system, with the processes it needs and their interactions."}, {"id": "ISO.C4.4-b", "text": "Maintain and continually improve the system."}], "controls": ["UC-GOV-04"], "nv": false, "check": "ok", "checknote": "Matches."}, {"id": "ISO.C5.1", "ref": "Clause 5.1", "title": "Leadership and commitment", "atoms": [{"id": "ISO.C5.1-a", "text": "Make sure the security policy and objectives are set and fit the organization's strategic direction."}, {"id": "ISO.C5.1-b", "text": "Build security program requirements into business processes."}, {"id": "ISO.C5.1-c", "text": "Make sure the resources the program needs are available."}, {"id": "ISO.C5.1-d", "text": "Communicate the importance of effective security, direct and support people and promote continual improvement."}, {"id": "ISO.C5.1-e", "text": "Make sure the program achieves its intended outcomes."}, {"id": "ISO.C5.1-f", "text": "Support other managers in showing leadership in their own areas."}], "controls": ["UC-GOV-05", "UC-GOV-13"], "nv": false, "check": "fixed", "checknote": "The PDF has eight asks (a to h). We missed (e) the program achieves its intended outcomes and (h) supporting other managers' leadership. Added atoms e and f; UC-GOV-05 goal, statement and test updated."}, {"id": "ISO.C5.2", "ref": "Clause 5.2", "title": "Security policy", "atoms": [{"id": "ISO.C5.2-a", "text": "Set a top-level policy suited to the organization's purpose that frames objectives and commits to meeting requirements and improving."}, {"id": "ISO.C5.2-b", "text": "Keep the policy as documented information, communicate it and make it available to interested parties."}], "controls": ["UC-GOV-06"], "nv": false, "check": "ok", "checknote": "Matches a to g, including the commitments, documented, communicated, available to interested parties."}, {"id": "ISO.C5.3", "ref": "Clause 5.3", "title": "Organizational roles, responsibilities and authorities", "atoms": [{"id": "ISO.C5.3-a", "text": "Assign and communicate responsibilities and authorities for relevant security roles."}, {"id": "ISO.C5.3-b", "text": "Assign responsibility for conformity of the program and for reporting its performance to top management."}], "controls": ["UC-GOV-07"], "nv": false, "check": "ok", "checknote": "Matches."}, {"id": "ISO.C6.1.1", "ref": "Clause 6.1.1", "title": "Actions to address risks and opportunities: general", "atoms": [{"id": "ISO.C6.1.1-a", "text": "Considering the context issues and interested-party requirements, determine the risks and opportunities that must be addressed to achieve outcomes, prevent undesired effects and improve."}, {"id": "ISO.C6.1.1-b", "text": "Plan actions to address them and build the actions into program processes."}, {"id": "ISO.C6.1.1-c", "text": "Plan how to evaluate whether the actions work."}], "controls": ["UC-GOV-10"], "nv": false, "check": "fixed", "checknote": "Added that planning considers the context issues and interested-party requirements."}, {"id": "ISO.C6.1.2", "ref": "Clause 6.1.2", "title": "Information security risk assessment", "atoms": [{"id": "ISO.C6.1.2-a", "text": "Define and apply a risk assessment process with risk acceptance criteria and criteria for performing assessments."}, {"id": "ISO.C6.1.2-b", "text": "Make sure repeated assessments give consistent, valid and comparable results."}, {"id": "ISO.C6.1.2-c", "text": "Identify risks to confidentiality, integrity and availability within scope and assign risk owners."}, {"id": "ISO.C6.1.2-d", "text": "Analyze likelihood and consequence and evaluate and prioritize risks against the criteria."}, {"id": "ISO.C6.1.2-e", "text": "Keep documented information about the risk assessment process."}], "controls": ["UC-RSK-01"], "nv": false, "check": "fixed", "checknote": "Wrong before: we wrote 'criteria for when to assess'. The standard says criteria for performing assessments (timing is 8.2). Atom and UC-RSK-01 corrected."}, {"id": "ISO.C6.1.3", "ref": "Clause 6.1.3", "title": "Information security risk treatment", "atoms": [{"id": "ISO.C6.1.3-a", "text": "Select risk treatment options for the assessed risks."}, {"id": "ISO.C6.1.3-b", "text": "Determine all controls needed to implement the chosen treatment options and compare them with Annex A to check none is missed."}, {"id": "ISO.C6.1.3-c", "text": "Produce a statement of applicability listing the necessary controls, why each is included, whether each is implemented and why any Annex A control is excluded."}, {"id": "ISO.C6.1.3-d", "text": "Formulate a risk treatment plan."}, {"id": "ISO.C6.1.3-e", "text": "Get risk owner approval of the plan and acceptance of residual risk, and keep documented information."}], "controls": ["UC-RSK-02", "UC-RSK-03"], "nv": false, "check": "fixed", "checknote": "The statement of applicability must also say whether each control is implemented; we had left that out. Atoms b and c now name the Annex A comparison and the full contents. UC-RSK-03 updated."}, {"id": "ISO.C6.2", "ref": "Clause 6.2", "title": "Security objectives and planning to achieve them", "atoms": [{"id": "ISO.C6.2-a", "text": "Set measurable security objectives at relevant functions, consistent with policy, taking risk results into account, and monitor, communicate, update and document them."}, {"id": "ISO.C6.2-b", "text": "Plan what will be done, with what resources, by whom, by when and how results are evaluated."}], "controls": ["UC-GOV-11"], "nv": false, "check": "fixed", "checknote": "Matches. Added that objectives are kept as documented information."}, {"id": "ISO.C6.3", "ref": "Clause 6.3", "title": "Planning of changes", "atoms": [{"id": "ISO.C6.3-a", "text": "Carry out needed changes to the security management system in a planned way."}], "controls": ["UC-GOV-12"], "nv": false, "check": "ok", "checknote": "Matches."}, {"id": "ISO.C7.1", "ref": "Clause 7.1", "title": "Resources", "atoms": [{"id": "ISO.C7.1-a", "text": "Determine and provide the resources needed to establish, run, maintain and improve the program."}], "controls": ["UC-GOV-13"], "nv": false, "check": "ok", "checknote": "Matches."}, {"id": "ISO.C7.2", "ref": "Clause 7.2", "title": "Competence", "atoms": [{"id": "ISO.C7.2-a", "text": "Determine the competence needed by people who affect security performance."}, {"id": "ISO.C7.2-b", "text": "Ensure those people are competent through education, training or experience."}, {"id": "ISO.C7.2-c", "text": "Take action to gain missing competence and evaluate whether it worked."}, {"id": "ISO.C7.2-d", "text": "Keep evidence of competence."}], "controls": ["UC-PPL-05"], "nv": false, "check": "ok", "checknote": "Matches a to d."}, {"id": "ISO.C7.3", "ref": "Clause 7.3", "title": "Awareness", "atoms": [{"id": "ISO.C7.3-a", "text": "Make people aware of the security policy."}, {"id": "ISO.C7.3-b", "text": "Make people aware of their contribution to the program and the benefit of better performance."}, {"id": "ISO.C7.3-c", "text": "Make people aware of the consequences of not conforming."}], "controls": ["UC-PPL-03"], "nv": false, "check": "ok", "checknote": "Matches a to c."}, {"id": "ISO.C7.4", "ref": "Clause 7.4", "title": "Communication", "atoms": [{"id": "ISO.C7.4-a", "text": "Decide what internal and external security communication is needed, when, with whom and how."}], "controls": ["UC-GOV-14"], "nv": false, "check": "fixed", "checknote": "Wrong before: we included 'by whom'. The 2022 text lists what, when, with whom and how only (who was in the 2013 edition). Atom and UC-GOV-14 corrected."}, {"id": "ISO.C7.5", "ref": "Clause 7.5", "title": "Documented information", "atoms": [{"id": "ISO.C7.5-a", "text": "Include the documented information the standard requires and the organization judges necessary."}, {"id": "ISO.C7.5-b", "text": "When creating or updating documents, set identification, format, review and approval."}, {"id": "ISO.C7.5-c", "text": "Control documents so they are available, protected, distributed, stored, version controlled, retained and disposed of."}, {"id": "ISO.C7.5-d", "text": "Identify and control documents of external origin that the program needs."}], "controls": ["UC-GOV-15"], "nv": false, "check": "ok", "checknote": "Matches 7.5.1 to 7.5.3, including documents of external origin."}, {"id": "ISO.C8.1", "ref": "Clause 8.1", "title": "Operational planning and control", "atoms": [{"id": "ISO.C8.1-a", "text": "Plan, implement and control the processes needed to meet security requirements and carry out the planned actions, setting criteria for the processes."}, {"id": "ISO.C8.1-b", "text": "Keep documented information giving confidence that processes ran as planned."}, {"id": "ISO.C8.1-c", "text": "Control planned changes and review the effect of unintended changes."}, {"id": "ISO.C8.1-d", "text": "Make sure externally provided processes, products or services that matter to the program are controlled."}], "controls": ["UC-GOV-16", "UC-SDC-09", "UC-SUP-05"], "nv": false, "check": "fixed", "checknote": "'Outsourced' was too narrow: the text says externally provided processes, products or services. Also added that criteria are set for the processes. UC-GOV-16 updated."}, {"id": "ISO.C8.2", "ref": "Clause 8.2", "title": "Risk assessment", "atoms": [{"id": "ISO.C8.2-a", "text": "Perform risk assessments at planned intervals or when significant changes are proposed or occur."}, {"id": "ISO.C8.2-b", "text": "Keep the results of the assessments."}], "controls": ["UC-RSK-04"], "nv": false, "check": "ok", "checknote": "Matches."}, {"id": "ISO.C8.3", "ref": "Clause 8.3", "title": "Risk treatment", "atoms": [{"id": "ISO.C8.3-a", "text": "Implement the risk treatment plan."}, {"id": "ISO.C8.3-b", "text": "Keep the results of the treatment."}], "controls": ["UC-RSK-05"], "nv": false, "check": "ok", "checknote": "Matches."}, {"id": "ISO.C9.1", "ref": "Clause 9.1", "title": "Monitoring, measurement, analysis and evaluation", "atoms": [{"id": "ISO.C9.1-a", "text": "Determine what to monitor and measure, and the methods, which must give valid, comparable and reproducible results."}, {"id": "ISO.C9.1-b", "text": "Determine when monitoring is done, when results are analyzed, and who does each; then evaluate security performance and the effectiveness of the program."}, {"id": "ISO.C9.1-c", "text": "Keep evidence of the results."}], "controls": ["UC-GOV-17"], "nv": false, "check": "fixed", "checknote": "Missing: methods must give valid, comparable and reproducible results; when results are analyzed and by whom. Atoms and UC-GOV-17 updated."}, {"id": "ISO.C9.2", "ref": "Clause 9.2", "title": "Internal audit", "atoms": [{"id": "ISO.C9.2-a", "text": "Conduct internal audits at planned intervals to show whether the program meets the organization's own requirements and the standard's and is effectively implemented and maintained."}, {"id": "ISO.C9.2-b", "text": "Plan and run an audit program covering frequency, methods, responsibilities, planning and reporting, taking account of how important the processes are and past audit results."}, {"id": "ISO.C9.2-c", "text": "Define audit criteria and scope and choose auditors who are objective and impartial."}, {"id": "ISO.C9.2-d", "text": "Report audit results to relevant management and keep evidence."}], "controls": ["UC-RSK-09"], "nv": false, "check": "fixed", "checknote": "9.2.1: audits test conformity to the organization's own requirements and the standard, and effective implementation. 9.2.2: the program takes account of process importance and past audit results. Atoms and UC-RSK-09 updated."}, {"id": "ISO.C9.3", "ref": "Clause 9.3", "title": "Management review", "atoms": [{"id": "ISO.C9.3-a", "text": "Have top management review the program at planned intervals."}, {"id": "ISO.C9.3-b", "text": "Cover in the review the status of past actions, changes in issues and in interested-party needs, performance trends (nonconformities, measurements, audits, objectives), feedback from interested parties, risk results and treatment status, and improvement opportunities."}, {"id": "ISO.C9.3-c", "text": "Record decisions on improvement and needed changes and keep evidence."}], "controls": ["UC-GOV-18"], "nv": false, "check": "fixed", "checknote": "We missed 9.3.2 c, changes in the needs and expectations of interested parties (new in 2022), and the trends list. Atom and UC-GOV-18 updated."}, {"id": "ISO.C10.1", "ref": "Clause 10.1", "title": "Continual improvement", "atoms": [{"id": "ISO.C10.1-a", "text": "Continually improve the suitability, adequacy and effectiveness of the program."}], "controls": ["UC-GOV-19"], "nv": false, "check": "ok", "checknote": "Matches. Numbering is right for 2022: 10.1 is continual improvement, 10.2 is nonconformity."}, {"id": "ISO.C10.2", "ref": "Clause 10.2", "title": "Nonconformity and corrective action", "atoms": [{"id": "ISO.C10.2-a", "text": "React to a nonconformity by controlling and correcting it and dealing with the consequences."}, {"id": "ISO.C10.2-b", "text": "Evaluate the need to remove causes, act, review the effectiveness of the action and change the program if needed."}, {"id": "ISO.C10.2-c", "text": "Keep evidence of the nonconformities and the actions taken."}], "controls": ["UC-GOV-20"], "nv": false, "check": "ok", "checknote": "Matches a to g."}], "trace": [{"fw": "dpdpa", "id": "CH2.CONSENT.1", "ref": "Section 6(1), 6(3)", "title": "Lawful basis for processing with free, specific, informed consent", "prim": "UC-PNC-05", "others": ["UC-PNC-02 (full)", "UC-PNC-06 (full)", "UC-PNC-07 (full)"], "atoms": 5}, {"fw": "dpdpa", "id": "CH2.CONSENT.2", "ref": "Section 6(1)", "title": "Itemised consent for multiple purposes", "prim": "UC-PNC-08", "others": ["UC-PNC-09 (full)"], "atoms": 2}, {"fw": "dpdpa", "id": "CH2.CONSENT.3", "ref": "Section 6(4), 6(6)", "title": "Consent withdrawal mechanism", "prim": "UC-PNC-11", "others": ["UC-PNC-12 (full)"], "atoms": 2}, {"fw": "dpdpa", "id": "CH2.CONSENT.4", "ref": "Section 6(8)-(9)", "title": "Consent Manager registration and interoperability", "prim": "UC-PNC-13", "others": [], "atoms": 2}, {"fw": "dpdpa", "id": "CH2.CONSENT.5", "ref": "Section 9(1)", "title": "Verifiable parental consent for children's data", "prim": "UC-PSC-02", "others": [], "atoms": 3}, {"fw": "dpdpa", "id": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "title": "Notice accompanying the consent request", "prim": "UC-PNC-01", "others": ["UC-PNC-02 (full)"], "atoms": 7}, {"fw": "dpdpa", "id": "CH2.NOTICE.2", "ref": "Section 5(2)", "title": "Notice for previously collected data", "prim": "UC-PNC-03", "others": [], "atoms": 2}, {"fw": "dpdpa", "id": "CH2.NOTI nist_csf", "id": "NIST.DE.AE.02", "ref": "DE.AE-02", "title": "Adverse event analysis", "prim": "UC-OPS-41", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.DE.AE.03", "ref": "DE.AE-03", "title": "Event correlation", "prim": "UC-OPS-41", "others": ["UC-OPS-01 (full)"], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.DE.AE.04", "ref": "DE.AE-04", "title": "Impact estimation", "prim": "UC-INC-02", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.DE.AE.06", "ref": "DE.AE-06", "title": "Adverse event information distribution", "prim": "UC-OPS-41", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.DE.AE.07", "ref": "DE.AE-07", "title": "Threat information integration", "prim": "UC-OPS-08", "others": ["UC-OPS-41 (full)"], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.DE.AE.08", "ref": "DE.AE-08", "title": "Incident declaration", "prim": "UC-INC-02", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RS.MA.01", "ref": "RS.MA-01", "title": "Incident response plan execution", "prim": "UC-INC-01", "others": ["UC-INC-03 (full)"], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RS.MA.02", "ref": "RS.MA-02", "title": "Incident triage and validation", "prim": "UC-INC-02", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RS.MA.03", "ref": "RS.MA-03", "title": "Incident categorization and prioritization", "prim": "UC-INC-02", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RS.MA.04", "ref": "RS.MA-04", "title": "Incident escalation", "prim": "UC-INC-03", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RS.MA.05", "ref": "RS.MA-05", "title": "Recovery initiation criteria", "prim": "UC-INC-42", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RS.AN.03", "ref": "RS.AN-03", "title": "Root cause analysis", "prim": "UC-INC-05", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RS.AN.06", "ref": "RS.AN-06", "title": "Investigation actions", "prim": "UC-INC-03", "others": ["UC-INC-06 (full)"], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RS.AN.07", "ref": "RS.AN-07", "title": "Incident data collection and preservation", "prim": "UC-INC-06", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RS.AN.08", "ref": "RS.AN-08", "title": "Incident scope estimation", "prim": "UC-INC-02", "others": [], "atoms": 1}, {"fw": "nist_csf", "id": "NIST.RS.CO.02", "ref": "RS.CO-02", "title": "Stakeholder incident notification", "prim": "UC-INC-04", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RS.CO.03", "ref": "RS.CO-03", "title": "Incident information sharing", "prim": "UC-INC-43", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RS.MI.01", "ref": "RS.MI-01", "title": "Incident containment", "prim": "UC-INC-03", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RS.MI.02", "ref": "RS.MI-02", "title": "Incident eradication", "prim": "UC-INC-03", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RC.RP.01", "ref": "RC.RP-01", "title": "Recovery plan execution", "prim": "UC-INC-42", "others": [], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RC.RP.02", "ref": "RC.RP-02", "title": "Recovery action selection", "prim": "UC-RES-02", "others": ["UC-INC-42 (full)", "UC-RES-03 (full)"], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RC.RP.03", "ref": "RC.RP-03", "title": "Restoration asset integrity verification", "prim": "UC-RES-42", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RC.RP.04", "ref": "RC.RP-04", "title": "Mission function consideration", "prim": "UC-RES-02", "others": ["UC-RES-01 (full)", "UC-RES-43 (full)"], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RC.RP.05", "ref": "RC.RP-05", "title": "Recovery completeness verification", "prim": "UC-RES-43", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RC.RP.06", "ref": "RC.RP-06", "title": "End of recovery declaration", "prim": "UC-INC-42", "others": ["UC-INC-05 (full)"], "atoms": 3}, {"fw": "nist_csf", "id": "NIST.RC.CO.03", "ref": "RC.CO-03", "title": "Recovery activity communication", "prim": "UC-INC-43", "others": [], "atoms": 2}, {"fw": "nist_csf", "id": "NIST.RC.CO.04", "ref": "RC.CO-04", "title": "Public update communication", "prim": "UC-INC-41", "others": ["UC-INC-04 (full)"], "atoms": 3}], "decisions": [{"id": "D01", "title": "A question field on every control", "body": "Check 6 needs a client-facing question, and how_to_ask is direction plus an example probe. Every control now has one question: one obligation, one sentence, answerable on the five-value scale, no control code, no framework name. DPDPA questions reuse the curated text. The five compound DPDPA questions (CONSENT.2, NOTICE.1, MINIMIZE.3, TRANSFER.1, TRANSFER.2) were split across controls.", "rec": "Approve. It adds one field to the approved list in plan 7.4."}, {"id": "D02", "title": "Same-control rule is checked per atom", "body": "The plan says no source requirement maps to the same control twice. I read that at atom level. 236 pairs of (record, control) are reached by two or more atoms of the same record; they are allowed and shown as INFO by the validator. A record-level reading would force one row per record and lose the per-atom reasons.", "rec": "Approve the atom-level reading."}, {"id": "D03", "title": "Id ranges and stable ids", "body": "UC-\u003cDOMAIN>-\u003cNN>. ISO controls use 01 to 39, NIST slots 40 to 69, DPDPA slots 70 to 99 in the 13 base domains. The five privacy domains are created only by DPDPA and number from 01. Ids are stable once signed. Any later change makes a new library version (validator check 7, lock file written at the first signed version).", "rec": "Approve. The ranges let three agents work without collisions; the gaps in numbering are harmless."}, {"id": "D04", "title": "How numbers and timeframes are kept apart by layer", "body": "key_settings is written 'layer: setting | layer: setting'. Any number with a unit in shown text must appear in key_settings under base or a selected framework (check 4). Today's numbers: DPDPA 72-hour breach report, 90-day grievance cap, one-year log retention, 12-month reviews, three-year inactivity erasure with a 48-hour warning and its user thresholds, child under 18. A few base controls state a yearly cycle under base. The 'strictest among selected frameworks' rule is not scripted because no two frameworks set the same number yet.", "rec": "Approve."}, {"id": "D05", "title": "Owner roles (18) and the owner of each domain", "body": "A closed list: CISO, Top Management, Risk and Compliance Manager, Head of Internal Audit, Head of IT Operations, Identity and Access Lead, Security Engineering Lead, Network and Infrastructure Lead, Security Operations Lead, Head of Application Development, Head of Facilities, HR Head, Head of Procurement, Incident Response Lead, Business Continuity Manager, Data Governance Lead, Data Protection Officer, Legal Counsel. Each domain has a default owner (see the Controls tab headers). Roles are not people. The owner appears only in the owner field, never in a control statement. Owner and importance on clause-only controls are the agent's own seed.", "rec": "Approve the list, then adjust any control owner on its card."}, {"id": "D06", "title": "Two splits made after review", "body": "UC-INC-03 carried 18 NIST atoms and UC-OPS-03 carried 16. I moved recovery management (criteria, roles, start and end of recovery) to a new NIST slot UC-INC-42, and alert analysis, correlation and routing to a new NIST slot UC-OPS-41. UC-OPS-03's goal, statement, test and question were narrowed to monitoring and raising alerts. INC-03 still holds basic recovery for the ISO atom, so check the INC-03 and INC-42 boundary. The A.8.15 log-analysis atom still maps to OPS-03.", "rec": "Approve, after reading UC-INC-03, UC-INC-42, UC-OPS-03 and UC-OPS-41."}, {"id": "D07", "title": "Merges and splits of Annex A and clauses", "body": "Splits where the test differs: A.5.18 into IAM-04, 05, 06; A.5.19 into SUP-01, 02; A.5.26 into INC-03, 04; A.5.30 into RES-02, 03; A.6.3 into PPL-03, 04; A.8.8 into OPS-04, 05; A.8.13 into RES-04, 05; A.8.15 into OPS-01, 02; A.8.24 into CRY-01, 02; clause 6.1.3 into RSK-02, 03. Merges of a clause with an Annex A control: 5.2 with A.5.1 (GOV-06), 5.3 with A.5.2 (GOV-07), 7.3 with the all-staff part of A.6.3 (PPL-03), 9.2 with A.5.35 (RSK-09). No two Annex A controls were merged. A.7.1 and A.7.3 could merge and were kept separate.", "rec": "Approve, or note which to change."}, {"id": "D08", "title": "Wording suggestions for base controls (three applied in round 2)", "body": "The mapping agents suggested these edits to ISO base controls and I left them: RSK-06 name an owner per entry; PPL-03 add checks that awareness worked; AST-01 cover software, services and systems and record location and classification; GOV-06 policy reflects organizational context; SUP-03 name the scope of access and data granted; INC-04 add affected individuals; OPS-01 add access to sensitive data to logged events plus a review step; GOV-04 a base control for measures scaled to data risk; AST-07 and AST-08 retention triggers and erasure on request. Applying them would shrink some DPDPA and NIST remainder slots.", "after": "Applied in round 2, as you agreed: UC-AST-01 now covers software, services and systems and records location and classification for information; UC-GOV-06 says the top-level policy reflects the organization's context; UC-SUP-03 says each agreement states the scope of access and data granted. The others are left as they were.", "rec": "Applied. The three cards are in your review list."}, {"id": "D09", "title": "NIST asks marked full that are soft (applied in round 2)", "intro": ["Words used here. A record is one line of a source framework (a NIST subcategory such as GV.OC-02). An atom is one single ask inside it (GV.OC-02 asks three things, so it has atoms a, b and c). A mapping row says: this atom is answered by this control. Full coverage means: if the client passes the control's test, the atom is satisfied.", "Soft means the row says full, but a client could pass the control and still fail the NIST ask. NIST shows 295 full rows of 307 mainly because the new NIST slot controls were written to fit their atoms. The rows below are the places where no slot was written and the match was stretched. My choices: K keep as full; E keep full but edit the control text or add a mapping row so full is true (no new control); P mark partial."], "table": {"head": ["NIST atom", "The ask, in plain words", "Mapped to", "Why the fit is weak", "Recommendation"], "rows": [["DE.CM-01-c", "Detect unauthorized devices and rogue wireless networks on the network.", "UC-OPS-03 Monitoring", "OPS-03 talks about anomalous behavior in general. Nothing mentions unknown devices or rogue wireless, so a client with no such detection would pass.", "E. Add unauthorized devices and wireless access points to OPS-03's statement and test."], ["DE.AE-07-b", "Analysts have asset and criticality information when they investigate an alert.", "UC-OPS-41 Alert analysis", "Already in the control's goal and test. Soft only because the control carries 8 asks.", "K. Already true."], ["DE.AE-06-c", "Incident responders can reach the log analysis platform.", "UC-OPS-41", "Statement and test already cover responder access.", "K."], ["GV.SC-06-b", "Before a supplier relationship starts, plan its scope, including the access and data the supplier gets.", "UC-SUP-03 Supplier agreements", "SUP-03 is about contract clauses. It never asks that access and data granted be scoped in advance.", "E. Say in SUP-03 that the scope of access and data granted is stated."], ["PR.PS-06-d", "Track and report measures of how well secure development is working.", "UC-GOV-17 Performance monitoring", "GOV-17 is generic. Nothing requires a development measure.", "P with an immaterial remainder: development measures are one kind of metric; add an example to how_to_ask. One new control for one ask is not worth it."], ["ID.IM-01-a", "Schedule regular evaluations of the cyber program, such as self-assessment or audit.", "UC-RSK-09 Independent review", "NIST accepts a self-assessment. RSK-09 demands an independent review, so our control is stricter. A client doing only self-assessments passes NIST but fails RSK-09.", "K, with a note that for NIST-only clients the question is stricter than NIST. Your call (see D15)."], ["DE.CM-03-c", "Tell personnel that their use of company systems is monitored.", "UC-AST-02 Acceptable use", "AST-02 is about rules and acknowledgement. Nothing says the rules must state that use is monitored.", "E. Add that the rules state use of systems is monitored."], ["ID.AM-07-c", "Keep a classification scheme for data and label data by it.", "UC-AST-05 Labeling", "The scheme itself is UC-AST-04. The atom has two asks and only one is mapped.", "E. Mapping only: also map this atom to UC-AST-04."], ["GV.OC-02-c", "Take stakeholder expectations into account in strategy, policy and risk decisions.", "UC-GOV-02 Interested parties", "GOV-02 records the requirements and decides which to address. It does not require that they feed strategy, policy and risk.", "E. Add one sentence: the register feeds scope, policy and risk decisions."], ["GV.RM-07-a, -b", "Treat opportunities (upside risk) as a category in the risk method and record them in risk discussions.", "UC-GOV-10 Risks and opportunities", "ISO clause 6.1 uses 'opportunities' for ways to improve the security program. NIST means upside in enterprise risk decisions. Same word, different idea.", "P with the remainder in UC-RSK-40 (extend risk direction to cover opportunities), or accept as nearest home. Low stakes (see D15)."], ["PR.PS-04-c", "Keep logs for a defined period and protect them from alteration.", "UC-OPS-02 Log protection only", "Two asks in one atom. Protection is in OPS-02, retention is in OPS-01. Only one half is mapped.", "E. Mapping only: split the atom or add a second row to OPS-01."]]}, "after": "Applied in round 2, as recommended. Text edits: OPS-03 (unauthorized devices and wireless access points), SUP-03 (scope of access and data), AST-02 (rules state that use is monitored), GOV-02 (the register feeds scope, policy and risk decisions). Mapping: ID.AM-07-c also maps to AST-04; PR.PS-04-c is split into c1 retention (OPS-01) and c2 protection (OPS-02); PR.PS-06-d is partial on GOV-17 with an immaterial remainder, and GOV-17's how_to_ask now prompts for secure development measures; GV.RM-07-a and -b are partial on GOV-10 with the remainder in RSK-40, whose text now covers opportunities, so RSK-40 is the record's primary; ID.IM-01-a stays full on RSK-09 with a stricter-than-source note on the mapping row. DE.AE-07-b and DE.AE-06-c are unchanged. No new control.", "rec": "Applied. Nothing to decide here; the changed cards are in your review list."}, {"id": "D10", "title": "DPDPA mapping judgment calls", "intro": ["A primary control is the one control marked as the home of a record. It decides where the record appears in the sign-off table and the trace, and does not limit what else the record maps to. A remainder slot is the small extra control for what a base control misses. Example: DPDPA requires erasure when the purpose ends. ISO control UC-AST-08 (deleting information) covers deletion in general (partial); the leftover for personal data sits in UC-AST-70, a remainder of AST-08. Remainder immaterial means the base control covers the ask in practice and what is left is too small for its own control; the row says so, with a reason.", "Three immaterial remainders exist: NIST GV.OC-03-b (each legal requirement has an owner) to UC-RSK-06, because the owner is one more column in the same register and sample. NIST PR.AT-01-d (check that awareness works) to UC-PPL-03, because it comes from the same awareness program and test. DPDPA SECURITY.1-a (reasonable technical safeguards) to UC-RES-04 backups, because personal data backups are inside normal backup scope."], "table": {"head": ["Item", "The ask in plain words", "What was done", "Why it is a judgment call", "Recommendation"], "rows": [["SECURITY.1-a, -b", "Take reasonable technical and organizational safeguards to protect personal data and prevent breaches.", "Partial to GOV-04, OPS-01 and RES-04, with slots GOV-70 and OPS-70.", "An umbrella ask meaning 'run security properly'. No single control carries it; GOV-04 is the nearest home.", "Accept. Do not create a 'measures scaled to data risk' base control."], ["BN.NOTIFY.3-a, -c", "The incident response plan must cover detecting and investigating personal data breaches.", "Full to UC-INC-01.", "Marked full, but INC-01's test does not check that personal data breaches are covered. Generous.", "Accept. A plan for all incidents covers a personal data breach. No DPDPA text in a base control."], ["SECURITY.2-a, -b", "Encrypt personal data at rest and in transit.", "Full to UC-CRY-01.", "The Rules accept encryption, masking, obfuscation or tokens. We require encryption only. Tied to the legal item on CH2.SECURITY.2.", "Your legal call first. If the Act's options are accepted, widen to encryption or an equivalent."], ["PGV-04 (CH4.SDF.4)", "A significant data fiduciary has an independent audit of its compliance each period and sends significant findings to the Board.", "Own control UC-PGV-04, not RSK-09.", "Looks close to ISO internal audit (RSK-09). Kept apart because the test differs: an independent data auditor and a Board submission.", "Accept. Make sure RSK-09's question never counts for DPDPA."], ["PNC-05, 06, 07 (CONSENT.1)", "Consent is a clear action, given freely, and states a specific purpose.", "One record split into three controls.", "The signed criteria were written for the whole record and must be shared out among three controls later.", "Accept. Handled when criteria are re-keyed."], ["CONSENT.2 and CM.GRANULAR.1", "List each purpose separately and let people choose per purpose.", "Both map to PNC-08 and PNC-09.", "Two repo records say the same thing.", "Accept. Keep both records for traceability, one control carries both."], ["Primary calls", "SECURITY.1 to GOV-04; MINIMIZE.2 and .3 to AST-08 and AST-07; SECURITY.3 to SUP-03; CORRECT.2 to PRT-04; BN.NOTIFY.1, .2, .4 to INC-04 and INC-03; CB.TRANSFER.2 to PSC-05; ACCESS.1 to PRT-02.", "In about half of these the primary row is a partial row on a base control, while a full row exists on a slot (BN.NOTIFY.1: primary INC-04 partial, but INC-70 is full and carries the record).", "Two rules are possible. R1: primary is the base control, so ISO-only clients see the record's home. R2: primary is the control with full coverage of the record's main ask.", "Applied in round 2: R2. Seven records qualified (the other three I had named already had a full primary): MINIMIZE.2 to AST-70, MINIMIZE.3 to AST-71, SECURITY.1 to GOV-70, SECURITY.3 to SUP-70, BN.NOTIFY.1 to INC-70, BN.NOTIFY.2 to INC-71, BN.NOTIFY.4 to INC-72. Only primary flags changed. The CH2.SECURITY.2 legal question stays open; CRY-01 is not widened."]]}, "rec": "Applied as approved. Nothing to decide."}, {"id": "D11", "title": "Controls doing two jobs: splits applied in round 2", "intro": ["You approved the card and marked PHY-02, AST-43 and SUP-40 Split and SUP-05 Keep. The other 20 rows were blank, so they followed my recommendation. Result: 16 splits, 8 keeps. Each split has its own test now. The source asks were moved to the half that tests them, and the remainder slots were re-pointed. 15 new controls, plus UC-INC-43 from D14: the library grows from 195 to 211.", "Keeps: PHY-09, INC-04, PGV-03, PSC-02, GOV-41, NET-40, INC-42, and SUP-05 on your reason (a supplier review happens at a set interval or when the scope of service changes). SUP-05 is now written as one requirement with those two triggers."], "table": {"head": ["Control", "Now", "New control"], "rows": [["UC-PHY-02", "Physical entry rules and visitor control", "UC-PHY-13 Physical access rights review and leaver badge removal"], ["UC-PHY-12", "Scheduled equipme (what each item is)", "intro": ["1. ISO scope question content. At the start of an engagement the product asks a few scope questions (in the ISO definition file). There are four: scope of the management system, cloud use, software development, and physical premises. Each answer can trigger an applicability proposal, a suggestion that some controls are probably not applicable (for example no cloud proposes A.5.23 as not applicable; no development proposes A.8.4, 8.25, 8.28, 8.30, 8.31, 8.33; fully remote proposes A.7.1 to 7.6, 7.8, 7.11, 7.12). The consultant confirms each; nothing is removed automatically. Today they name Annex A ids. After the unified controls are signed, each proposal must list unified control ids instead, and a split changes which ids a proposal lists. It was left because the controls had to exist first. Your decision: whether four questions are enough for ISO. Confirm after the splits are final; the work itself is mechanical.", "2. Re-keying the 728 signed test criteria. These are the criteria you signed: 230 for ISO, 348 for NIST, 150 for DPDPA. Each is one checkable condition ('every inventory entry has an assigned owner'), tagged design or operating, with an evidence hint and a source reference. They are keyed to the old record ids (ISO.A5.9, CH2.CONSENT.3), so each must be attached to the unified control that now carries its record. A script can do it by record. The hard part: 87 of the 240 records map to more than one control (316 criteria), so someone decides per criterion which control it tests. Our drafted test field is one paragraph per control with a sample size and a pass rule, and it loses the one-condition-per-line structure, the design or operating tag, the evidence hint and the criterion ids, and some criteria were not carried. Clauses 4 to 10 have no signed criteria, so their tests are new text. Your decision: which is authoritative for what an auditor tests. I recommend the signed criteria stay as the list of tests under each control, with the drafted paragraph as a readable summary (see D18).", "3. The ids lock file. A file listing every unified control id at the moment you sign the first version. From then on the validator fails if an id disappears or changes meaning, so saved assessments cannot be orphaned. It is written only at signing, and we are still changing ids (splits). No decision needed: you sign, then it is run.", "4. Loading into the app. Today the library lives only as draft files; nothing in the product reads it. Loading means the questionnaire, the information request, the judge input and the review queue use unified controls instead of the 52 hand-written clusters. Plan 7.5 says only signed rows are loaded. No decision now; the order is sign domains, re-key criteria, lock, validation script, then load.", "Also: the fields were drafted by Sonnet agents and spot-checked only. Your reading of the 195 cards is the first full review of the statements, questions and tests. Please sample tests as well as statements."], "rec": "Confirm the order described in 4, and decide D18."}, {"id": "D13", "title": "Statements are role-neutral (applied after your first 43 reviews)", "body": "You pointed out that a statement cannot hinge on a named role doing the work, because compliance depends on the implementation existing. All 195 statements were rewritten as assertive requirements with no implementer named; 190 had named a role and 38 leaned on generic actors such as 'system owners' or 'the team'. Only the statement field changed; the owner stays in the owner field. 'Top management' remains where the requirement itself is about management (GOV-05, 06, 07, 08, 18, OPS-06, RSK-02, RSK-09), and PGV-01 names the officer being appointed. The validator now fails any statement that names a listed role, so it cannot drift back.", "rec": "Confirm the wording style on a few cards, for example UC-AST-06 and UC-IAM-05. If you already approved a control, re-skim only its statement."}, {"id": "D14", "title": "Security communication (UC-GOV-14) is two jobs: narrow it and add an incident slot", "body": "You asked: if this is about incidents, say so. The ISO clause behind it (7.4) asks only for a plan for what security matters are communicated, when, to whom and how: policy changes, results, audit outcomes, requirements passed to suppliers. It is not about incidents. But four NIST incident and recovery communication asks were mapped into it (who receives incident information and what may be shared; updates to leadership during recovery), so the card read like both. It duplicates neither INC-04 (legal notification deadlines) nor GOV-41 (delivery of risk artifacts). Proposal: narrow GOV-14 to the general communication plan, and add a new control UC-INC-43 'Incident and recovery communication' for the four NIST asks. Cost: one control (196), four mapping rows moved.", "after": "Applied in round 2. UC-GOV-14 is now 'Security communication plan' (clause 7.4 only) and no longer appears for NIST-only clients. New UC-INC-43 'Incident and recovery communication' carries RS.CO-03 a, b and c and RC.CO-03 a and b, and is the primary for both records. I also moved RS.CO-03-b (status updates to top management) from INC-03, as the optional step suggested.", "rec": "Applied. Review UC-GOV-14 and UC-INC-43."}, {"id": "D15", "title": "Smaller calls from D09 and D10", "body": "(a) NIST ID.IM-01-a (regular evaluation, self-assessment accepted) is carried by UC-RSK-09, which requires an independent review: accept it as stricter than NIST? (b) NIST GV.RM-07 opportunities: make it partial with the remainder in UC-RSK-40, or accept the nearest home? (c) Primary rule for DPDPA overlap records: R1 primary is the base control; R2 primary is the control with full coverage. I recommend R2; it changes about 10 primary flags and nothing else.", "rec": "Applied as approved: (a) a note on the mapping row; (b) partial, remainder in RSK-40; (c) R2 on seven records (see D10)."}, {"id": "D16", "title": "UC-RSK-10 rewritten: who does the check is not named", "body": "Your comment: the control should be about whether teams' actual practice follows the documented policy (policy drift), applying only to teams where controls are relevant. Rewritten as 'Practice checked against policy': the day-to-day work of each team where security controls apply is checked on a defined cycle against documented policies; gaps are recorded with actions and tracked to closure. The checker is not named; 'for example internal audit' appears only in how_to_ask. Open: must the check be independent of the team, or may a manager self-check? ISO allows managers. I did not require independence.", "rec": "Approve, or tell me to require an independent check."}, {"id": "D17", "title": "Management words and the owner badge", "body": "(a) 'Top management' stays only where the requirement is itself about management (leadership, policy approval, review, risk acceptance). 'Leadership' used elsewhere (GOV-40, RSK-40, RSK-41, SUP-40) would be replaced with 'top management' for one term. (b) Each card shows an owner badge from the owner field (CISO, Head of IT Operations and so on). It is routing information, never part of the requirement. I would keep it on the sign-off tables and hide it on anything the client sees.", "rec": "(a) Applied in round 2 to GOV-40, RSK-40 and RSK-41; SUP-40 had no 'leadership' left. (b) No action now: the badge stays on sign-off, and hiding it client-side is a later concern."}, {"id": "D18", "title": "What is the authoritative test: signed criteria or the drafted paragraph?", "body": "You signed 728 criteria. Each control also has a drafted test paragraph. Recommendation: keep the signed criteria as the list of tests under each control (original criterion ids preserved) and treat the drafted paragraph as a readable summary. You then decide only the 316 criteria whose record maps to more than one control; a script will list them for you.", "rec": "Approve."}, {"id": "D19", "title": "GOV-16: change control and outside processes found homes (no new control)", "body": "The clause 8.1 control did three jobs. Planning and running processes to set criteria stays in UC-GOV-16, now 'Security processes planned and run'. Controlling planned changes and reviewing unintended ones (8.1 c) now maps to UC-SDC-09 Change management; I added one sentence to SDC-09 so unintended changes are reviewed for their effect, which makes the match full. Controlling externally provided processes, products and services (8.1 d) maps to UC-SUP-05 Supplier service review, because reviewing suppliers against the agreed terms is how that is shown. Zero new controls instead of up to two.", "rec": "Approve, or tell me to create the two controls instead."}, {"id": "D20", "title": "Other judgment calls made while applying round 2", "intro": ["Ids: ISO-origin splits took the next free number in the ISO range (PHY-13, PHY-14, SUP-07, INC-09, RES-07, IAM-13, AST-13, AST-14, RSK-11); NIST-origin splits took the next free NIST number (RSK-44, AST-44, CRY-41, CRY-42, SUP-42, RES-43). New controls inherit the original's owner and importance, except UC-PHY-14, which I gave to Head of IT Operations because clearing data from equipment is IT work.", "Primary moves outside R2: ISO A.5.34 now has its primary on the processing-record ask in RSK-08 (the laws ask moved to RSK-06). NIST GV.RM-07 now has its primary on RSK-40, the control that fully carries it after D09. NIST records whose primary is a partial row with a full remainder slot (for example PR.PS-03 on PHY-12, completed by AST-44) were left as they are: R2 was approved for DPDPA records only.", "Source asks split into numbered parts because each bundled two asks: ISO A.7.13-b (b1 maintenance by authorized people, b2 data cleared before repair), NIST GV.PO-01-d (d1 exceptions, d2 violations), NIST PR.PS-04-c (c1 retention, c2 protection). NIST ID.AM-07-c maps to two controls, both full: AST-04 for the scheme and AST-05 for the la // ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// Controls changed or added in this round get a fresh key, so an approval of the earlier text does not carry over.
const ckey = c => (c.r2 ? "c2:" : "c:") + c.id;
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function set(k, patch) { state[k] = Object.assign({}, get(k), patch); save(); updateProgress(); }

// ---------- item registry ----------
const ITEMS = []; // {key, kind, group}
DATA.decisions.forEach(d => ITEMS.push({ key: "d:" + d.id, kind: "decision", group: "Decisions", label: d.id + " " + d.title }));
DATA.decisions.forEach(d => { if (d.table && d.table.decide) d.table.rows.forEach(r => ITEMS.push({ key: "s:" + r[0].split(" ")[0], kind: "sk", group: "Decisions", label: d.id + " split or keep " + r[0] })); });
DATA.clauses.forEach(c => ITEMS.push({ key: "v:" + c.id, kind: "verify", group: "ISO clauses", label: c.ref + " " + c.title }));
DATA.legal.forEach(l => ITEMS.push({ key: "l:" + l.id, kind: "legal", group: "Legal items", label: l.ref }));
DATA.controls.forEach(c => ITEMS.push({ key: ckey(c), kind: "control", group: "Controls", label: c.id + " " + c.title }));
const GROUPS = ["Decisions", "ISO clauses", "Legal items", "Controls"];

function updateProgress() {
  let done = 0;
  const per = {};
  GROUPS.forEach(g => per[g] = { n: 0, d: 0 });
  ITEMS.forEach(it => { const d = get(it.key).s ? 1 : 0; done += d; per[it.group].n++; per[it.group].d += d; });
  const total = ITEMS.length, pct = Math.round(100 * done / total);
  document.getElementById("meterfill").style.width = pct + "%";
  document.getElementById("meter").setAttribute("aria-valuenow", pct);
  document.getElementById("prog").textContent = done + " of " + total + " items decided (" + pct + "%). Saved in this browser only; export to keep.";
  document.querySelectorAll("[data-tabcount]").forEach(el => {
    const g = el.getAttribute("data-tabcount"); el.textContent = per[g].d + "/" + per[g].n;
  });
  document.querySelectorAll("[data-card]").forEach(card => {
    const s = get(card.getAttribute("data-card")).s;
    card.classList.remove("s-approve", "s-change", "s-reject");
    if (s) card.classList.add("s-" + s);
  });
}

// ---------- decision box ----------
function decBox(key, kind) {
  const ok = kind === "legal" ? "Confirmed" : kind === "verify" ? "Verified" : "Approve";
  const two = (kind === "legal" || kind === "verify");
  const defs = kind === "sk" ? [["split", "Split"], ["keep", "Keep"]] : [["approve", ok], ["change", "Needs change"]].concat(two ? [] : [["reject", "Reject"]]);
  const btns = h("div", { class: "btns", role: "group", "aria-label": "Decision" });
  const ta = h("textarea", {
    "aria-label": "Note", placeholder: "Note (needed for Change or Reject)",
    oninput: e => set(key, { n: e.target.value })
  });
  ta.value = get(key).n;
  const refresh = () => defs.forEach(([v], i) => btns.children[i].setAttribute("aria-pressed", get(key).s === v ? "true" : "false"));
  defs.forEach(([v, label]) => btns.append(h("button", {
    class: v, type: "button", "aria-pressed": "false",
    onclick: () => { set(key, { s: get(key).s === v ? "" : v }); refresh(); if (v !== "approve" && v !== "keep" && get(key).s) ta.focus(); }
  }, label)));
  refresh();
  return h("div", { class: "dec" }, btns, ta);
}

    h("p", null, "ISO scope question content, re-keying the 728 signed criteria, the ids lock file, and loading anything into the app.")
  );
}

function renderTable(tb) {
  const head = tb.head.concat(tb.decide ? ["Your call"] : []);
  return h("div", { class: "tablewrap" }, h("table", null,
    h("thead", null, h("tr", null, head.map(c => h("th", null, c)))),
    h("tbody", null, tb.rows.map(r => h("tr", null,
      r.map((c, i) => h("td", { class: "small" }, i === 0 && tb.decide ? h("b", null, c) : c)),
      tb.decide ? h("td", { class: "small", "data-card": "s:" + r[0].split(" ")[0] }, decBox("s:" + r[0].split(" ")[0], "sk")) : null)))));
}
function decisionsPanel() {
  const cards = DATA.decisions.map(d => h("div", { class: "card", "data-card": "d:" + d.id },
    h("div", { class: "head" }, h("span", { class: "id" }, d.id), h("span", { class: "t" }, d.title)),
    (d.intro || []).map(t => h("p", null, t)),
    d.body ? h("p", null, d.body) : null,
    d.table ? renderTable(d.table) : null,
    d.after ? h("p", null, d.after) : null,
    h("div", { class: "rec" }, h("b", null, "My recommendation: "), d.rec),
    decBox("d:" + d.id, "decision")));
  return mkPanel("decisions", h("h2", null, "Decisions"), h("p", { class: "mute" }, "Choices I made or that need your call. Change and Reject need a note. D08 to D11, D14, D15 and D17 now say what was applied in round " + DATA.round + ". D19 and D20 are new and need your decision."), cards);
}

function clausesPanel() {
  const cards = DATA.clauses.map(c => h("div", { class: "card", "data-card": "v:" + c.id },
    h("div", { class: "head" }, h("span", { class: "id" }, c.ref), h("span", { class: "t" }, c.title), h("span", { class: "chip" }, c.nv ? "needs verification" : "verified by you")),
    h("ul", null, c.atoms.map(a => h("li", null, h("span", { class: "mute small" }, a.id.replace(c.id, "") + " "), a.text))),
    c.controls.length ? h("p", { class: "small mute" }, "Maps to: " + c.controls.join(", ")) : null,
    c.checknote ? h("div", { class: "rec" }, h("b", null, (c.check === "fixed" ? "Checked against your PDF, corrected: " : "Checked against your PDF, matches: ")), c.checknote) : null,
    decBox("v:" + c.id, "verify")));
  return mkPanel("clauses", h("h2", null, "ISO clauses 4 to 10"),
    h("p", { class: "mute" }, "You marked all 25 Verified in round 1, and the verification flags are now cleared in the data. These paraphrases were first written from knowledge, then cross-checked on 13 Oct 2026 against the ISO/IEC 27001:2022 PDF in your Downloads. Eleven were adjusted (eight for real errors or gaps, three for small additions), and the fixes are already in the atoms and controls below. The PDF has no Amendment 1:2024, so the climate wording in 4.1 and 4.2 is still unchecked. Mark each Verified, or Needs change with your correction."), cards);
}

function legalPanel() {
  const cards = DATA.legal.map(l => h("div", { class: "card", "data-card": "l:" + l.id },
    h("div", { class: "head" }, h("span", { class: "id" }, l.id), h("span", { class: "t" }, l.ref)),
    h("p", null, l.body),
    decBox("l:" + l.id, "legal")));
  return mkPanel("legal", h("h2", null, "DPDPA legal items"),
    h("p", { class: "mute" }, "Raised by the DPDPA drafting agent comparing the repo pack with the Act and Rules. None would change an id. Stored references and pack text stay as they are until you verify. All 16 are marked Confirmed provisionally (14 Oct 2026) until you have outside information: that is a placeholder, not a legal verification. Change any of them to Needs change with the correction when you know."), cards);
}

function controlCard(c) {
  const imp = c.imp;
  const fwChips = c.fws.map(f => h("span", { class: "chip" }, FW[f]));
  const srcByFw = {};
  c.sources.forEach(s => (srcByFw[s.fw] = srcByFw[s.fw] || []).push(s));
  const srcBlock = Object.keys(srcByFw).map(fw => h("div", null,
    h("div", { class: "src-fw" }, FW[fw]),
    h("div", { class: "tablewrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Ref"), h("th", null, "Ask"), h("th", null, "Match"), h("th", null, "Why"))),
      h("tbody", null, srcByFw[fw].map(s => h("tr", null,
        h("td", { class: "small" }, s.ref + " ", h("span", { class: "mute" }, s.atom.slice(s.rec.length))),
        h("td", { class: "small" }, s.text),
        h("td", { class: "small" }, s.match + " / " + s.cov,
          s.primary ? h("div", { class: "flag" }, "primary") : null,
          s.rem ? h("div", null, "remainder of " + s.rem) : null,
          s.imm ? h("div", null, "remainder immaterial: " + s.imm) : null),
        h("td", { class: "small" }, s.reason))))))));
  const kv = (l, v) => v ? [h("div", { class: "lbl" }, l), h("div", null, v)] : null;
  const det = h("details", null,
    h("summary", null, "All fields and sources (" + c.sources.length + " mapped asks)"),
    kv("Why asked", c.why), kv("How to ask", c.how), kv("Expected evidence", c.evidence),
    kv("Good looks like", c.good), kv("Baseline risk", c.risk),
    kv("Applies when", c.applies),
    kv("Type and frequency", [c.type, c.freq].filter(Boolean).join(", ")),
    kv("Key settings", c.ks), kv("Skeleton goal", c.goal), kv("Draft note", c.note),
    h("div", { class: "lbl" }, "Sources"), srcBlock);
  return h("article", { class: "card", id: "c-" + c.id, "data-card": ckey(c), "data-id": c.id },
    h("div", { class: "head" },
      h("span", { class: "id" }, c.id), h("span", { class: "t" }, c.title),
      h("span", { class: "chip " + (imp === "critical" ? "crit" : imp === "high" ? "high" : "") }, imp),
      c.theme ? h("span", { class: "chip" }, c.theme) : null, fwChips,
      h("span", { class: "chip" }, c.owner)),
    c.r2 ? h("div", { class: "rec" }, h("b", null, "Changed in round " + DATA.round + ": "), c.r2) : null,
    h("div", { class: "lbl" }, "Question"), h("div", { class: "q" }, c.q),
    h("div", { class: "lbl" }, "Statement"), h("div", null, c.statement),
    h("div", { class: "lbl" }, "Test"), h("div", null, c.test),
    det, decBox(ckey(c), "control"));
}

const SCOPES = [["all", "All controls"]].concat(DATA.counts.map(c => [c.key, c.label]));
const fstate = { scope: "all", status: "review", q: "", imp: "all" };
function controlsPanel() {
  const list = h("div", { id: "ctlist" });
  const sel = (id, label, opts, key) => h("label", null, label,
    h("select", { id, onchange: e => { fstate[key] = e.target.value; renderControls(); } },
      opts.map(([v, t]) => h("option", { value: v }, t))));
  const filters = h("div", { class: "filters" },
    sel("fScope", "Frameworks selected", SCOPES, "scope"),
    sel("fStatus", "Status", [["review", "Needs your review"], ["all", "All"], ["none", "Undecided"], ["approve", "Approved"], ["change", "Change"], ["reject", "Reject"]], "status"),
    sel("fImp", "Importance", [["all", "All"], ["critical", "Critical"], ["high", "High"], ["medium", "Medium"], ["low", "Low"]], "imp"),
    h("label", null, "Search", h("input", { type: "search", id: "fQ", placeholder: "id, title, text", oninput: e => { fstate.q = e.target.value.toLowerCase(); renderControls(); } })),
    h("label", null, "Jump to domain", h("select", { id: "fJump", onchange: e => { const t = document.getElementById("dom-" + e.target.value); if (t) t.scrollIntoView(); } },
      [h("option", { value: "" }, "Choose")].concat(DATA.domains.map(d => h("option", { value: d.code }, d.code + " " + d.name))))));
  const p = mkPanel("controls", h("h2", null, "Controls"),
    h("p", { class: "mute" }, "One card per unified control. The list opens on Needs your review: only the controls changed or added in round " + DATA.round + ", which need a fresh decision. Every other control keeps your earlier approval; set Status to All to see them. The Frameworks filter shows what a client would see with only those frameworks selected."),
    filters, list);
  return p;
}
function matches(c) {
  if (fstate.scope !== "all") {
    const fw = fstate.scope.split("+");
    if (!c.fws.some(f => fw.includes(f))) return false;
  }
  if (fstate.imp !== "all" && c.imp !== fstate.imp) return false;
  const s = get(ckey(c)).s;
  if ((fstate.status === "none" || fstate.status === "review") && s) return false;
  if (!["all", "none", "review"].includes(fstate.status) && s !== fstate.status) return false;
  if (fstate.q) {
    const hay = (c.id + " " + c.title + " " + c.q + " " + c.statement + " " + c.test + " " + c.evidence + " " + c.owner).toLowerCase();
    if (!hay.includes(fstate.q)) return false;
  }
  return true;
}
function renderControls() {
  const list = document.getElementById("ctlist");
  list.replaceChildren();
  let shown = 0;
  DATA.domains.forEach(d => {
    const cs = DATA.controls.filter(c => c.domain === d.code && matches(c));
    if (!cs.length) return;
    shown += cs.length;
    const all = DATA.controls.filter(c => c.domain === d.code).length;
    list.append(h("div", { class: "domhead", id: "dom-" + d.code },
      h("h3", null, d.code + ": " + d.name),
      h("div", { class: "small mute" }, "Owner: " + d.owner + " . " + cs.length + (cs.length !== all ? " of " + all : "") + " controls ",
        h("button", { class: "btn ghost", type: "button", onclick: () => {
          cs.forEach(c => { if (!get(ckey(c)).s) state[ckey(c)] = Object.assign({}, get(ckey(c)), { s: "approve" }); });
          save(); renderControls(); updateProgress();
        } }, "Approve undecided in this list"))));
    cs.forEach(c => list.append(controlCard(c)));
  });
  if (!shown) list.append(h("p", { class: "mute" }, fstate.status === "review" ? "Nothing left to review. Set Status to All to see every control." : "No controls match the filters."));
  updateProgress();
}

const tr = { fw: "all", q: "" };
function tracePanel() {
  const body = h("tbody", { id: "trbody" });
  const p = mkPanel("records", h("h2", null, "Records trace"),
    h("p", { class: "mute" }, "Every framework record, the control that carries it (primary) and any other control that covers part or all of it. Read-only: if a mapping is wrong, note it on the control card."),
    h("div", { class: "filters" },
      h("label", null, "Framework", h("select", { onchange: e => { tr.fw = e.target.value; renderTrace(); } },
        [["all", "All"], ["iso27001", "ISO 27001"], ["nist_csf", "NIST CSF"], ["dpdpa", "DPDPA"]].map(([v, t]) => h("option", { value: v }, t)))),
      h("label", null, "Search", h("input", { type: "search", placeholder: "ref, title, control", oninput: e => { tr.q = e.target.value.toLowerCase(); renderTrace(); } }))),
    h("div", { class: "tablewrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Framework"), h("th", null, "Ref"), h("th", null, "Record"), h("th", null, "Asks"), h("th", null, "Primary control"), h("th", null, "Other controls"))),
      body)));
  return p;
}
function renderTrace() {
  const body = document.getElementById("trbody");
  body.replaceChildren();
  DATA.trace.filter(t => (tr.fw === "all" || t.fw === tr.fw) &&
    (!tr.q || (t.ref + " " + t.title + " " + t.prim + " " + t.others.join(" ") + " " + t.id).toLowerCase().includes(tr.q)))
    .forEach(t => body.append(h("tr", null,
      h("td", { class: "small" }, FW[t.fw]), h("td", { class: "small" }, t.ref), h("td", null, t.title),
      h("td", { class: "small" }, t.atoms),
      h("td", { class: "small" }, t.prim ? h("a", { href: "#c-" + t.prim, onclick: () => showTab("controls", t.prim) }, t.prim) : "none"),
      h("td", { class: "small" }, t.others.join(", ")))));
}

// ---------- tabs ----------
const TABS = [["overview", "Overview", null], ["decisions", "Decisions", "Decisions"], ["clauses", "ISO clauses", "ISO clauses"],
  ["legal", "Legal items", "Legal items"], ["controls", "Controls", "Controls"], ["records", "Records trace", null]];
function showTab(id, scrollTo) {
  TABS.forEach(([t]) => { PANELS[t].hidden = t !== id; });
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id ? "true" : "false"));
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  if (id === "controls") {
    // reset filters that would hide the target
    if (scrollTo) { fstate.scope = "all"; fstate.status = "all"; fstate.q = ""; fstate.imp = "all";
      ["fScope", "fStatus", "fImp"].forEach(i => { const e = document.getElementById(i); if (e) e.value = "all"; });
      const q = document.getElementById("fQ"); if (q) q.value = ""; }
    renderControls();
    if (scrollTo) setTimeout(() => { const el = document.getElementById("c-" + scrollTo); if (el) el.scrollIntoView(); }, 0);
  } else if (!scrollTo) window.scrollTo(0, 0);
}

// ---------- export ----------
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function summary() {
  const out = {}; let n = { approve: 0, change: 0, reject: 0, none: 0 };
  ITEMS.forEach(it => { const d = get(it.key); const k = d.s || "none"; n[k] = (n[k] || 0) + 1; if (d.s || d.n) out[it.key] = { status: d.s, note: d.n, label: it.label, group: it.group }; });
  return { out, n };
}
document.getElementById("exportJson").addEventListener("click", () => {
  const { out, n } = summary();
  download("ucf-review-decisions.json", JSON.stringify({ library_version: DATA.version, exported_at: new Date().toISOString(), totals: n, decisions: out }, null, 2), "application/json");
});
document.getElementById("exportMd").addEventListener("click", () => {
  const { out, n } = summary();
  const L = ["# UCF part 1 review, round " + DATA.round, "", "Library " + DATA.version + ". Approved " + n.approve + ", change " + n.change + ", reject " + n.reject + ", undecided " + n.none + ".", ""];
  const sk = Object.entries(out).filter(([k]) => k.startsWith("s:") && out[k].status);
  if (sk.length) { L.push("## D11 split or keep", ""); sk.forEach(([k, v]) => L.push("- " + v.status.toUpperCase() + " " + k.slice(2) + (v.note ? ": " + v.note.replace(/\n/g, " ") : ""))); L.push(""); }
  GROUPS.forEach(g => {
    const rows = Object.entries(out).filter(([k, v]) => v.group === g && !k.startsWith("s:") && (v.status === "change" || v.status === "reject" || (v.note && v.status !== "approve")));
    const und = ITEMS.filter(it => it.group === g && !get(it.key).s).length;
    L.push("## " + g, "");
    if (!rows.length) L.push("No changes or rejections.");
    rows.forEach(([k, v]) => L.push("- " + v.status.toUpperCase() + " " + v.label + (v.note ? ": " + v.note.replace(/\n/g, " ") : "")));
    if (und) L.push("", "Undecided: " + und);
    L.push("");
  });
  download("ucf-review-summary.md", L.join("\n"), "text/markdown");
});

// ---------- boot ----------
const main = document.getElementById("main");
[overview(), decisionsPanel(), clausesPanel(), legalPanel(), controlsPanel(), tracePanel()].forEach(p => main.append(p));
const tabs = document.getElementById("tabs");
TABS.forEach(([id, label, grp]) => tabs.append(h("button", { type: "button", role: "tab", "data-tab": id, "aria-selected": "false", onclick: () => showTab(id) },
  label, grp ? h("span", { class: "n", "data-tabcount": grp }) : null)));
renderTrace();
updateProgress();
const start = (location.hash || "").slice(1);
showTab(TABS.some(t => t[0] === start) ? start : "overview");
</script>
