 patterns in consent collection is part of the clear-choice test.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PNC-06", "title": "Consent given freely", "domain": "PNC", "theme": "", "goal": "The organization keeps consent free of coercion by not making access to a service depend on processing the service does not need and by excluding terms that waive the person's rights.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Consent is given freely. The service does not make access depend on consent to processing it does not need, and no consent request contains a term by which people waive their rights. Sign-up flows and linked terms are checked whenever they change. This stops people from being forced to trade away their data or rights. The consent screens, the terms and a decline walkthrough are the proof.", "why": "Bundling optional processing into the core service, or burying a waiver in the terms, makes consent coerced. Consultants should test what happens when a person says no.", "how": "Ask which processing is needed to deliver the service and which is optional. Then ask for a sign-up that declines every optional item. Example probe: \"If I decline marketing and analytics at sign-up, do I still get the full service?\"", "q": "Does your organization keep consent free by not making access to a service depend on processing the service does not need?", "evidence": "List of processing needed for each service and optional processing; consent screens; terms of service and terms linked from consent flows; recorded sign-up walkthrough declining optional items; covering the review period.", "good": "The organization has decided which processing each service needs and treats the rest as optional. A person can decline every optional item and still reach the core service. No terms linked from consent flows waive a right or allow processing the law forbids.", "test": "Select a sample of services and run a sign-up that declines every optional purpose. Check the sign-up completes and the core service works. Read the terms linked from the consent flows for any waiver of rights. Pass if every sampled sign-up completes without optional consent and no waiver term is found.", "risk": "People are forced to accept unneeded processing or give up their rights to use a service, and the resulting consent is not valid.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.1", "ref": "Section 6(1), 6(3)", "atom": "CH2.CONSENT.1-b", "text": "Make consent free and unconditional, with no term that waives a legal right or permits processing the law forbids.", "match": "req_smaller", "cov": "full", "reason": "Free and unconditional consent is the control's whole test, including no rights-waiver terms.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CM.GRANULAR.2", "ref": "Section 6(1)", "atom": "CM.GRANULAR.2-a", "text": "Keep access to the service independent of consent to processing that the service does not need.", "match": "req_smaller", "cov": "full", "reason": "Service access independent of unneeded consent is the control.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PNC-07", "title": "Consent request states the purpose", "domain": "PNC", "theme": "", "goal": "The organization states the specific purpose in each consent request, in clear and plain language, so that consent is informed.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Every consent request states the specific purpose in clear and plain language, so that the person knows what they agree to. The wording of each request is reviewed when it is written or changed. This makes consent informed and not generic. The approved consent texts and live screens are the proof.", "why": "Vague purposes such as \"improve our services\" make consent uninformed. Consultants should read the actual wording a person sees.", "how": "Collect the consent text from each flow and read it as a customer would. Check each purpose is specific and the language is plain. Example probe: \"Read me the sentence that explains why you collect the phone number. Would a first-time user understand it?\"", "q": "Does your organization state the specific purpose, in clear and plain language, in every consent request?", "evidence": "Consent request texts for every flow; wording review or approval records; dated screenshots of live consent screens; covering the review period.", "good": "Each consent request names the specific purpose in short, plain sentences with no legal or technical jargon. The wording is reviewed before release and live screens match the approved text.", "test": "Sample consent requests across channels from the review period. For each, check a specific purpose is named and the wording is plain and understandable without other documents. Pass if every sampled request states a specific purpose in plain language.", "risk": "People consent to purposes they do not understand, so the consent is not informed and cannot be relied on.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.1", "ref": "Section 6(1), 6(3)", "atom": "CH2.CONSENT.1-c", "text": "State the specified purpose in every consent request so the consent is informed.", "match": "req_smaller", "cov": "full", "reason": "Stating the specific purpose in the consent request is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.CONSENT.1", "ref": "Section 6(1), 6(3)", "atom": "CH2.CONSENT.1-d", "text": "Write each consent request in clear, plain language.", "match": "req_smaller", "cov": "full", "reason": "Plain-language wording of the consent request is part of the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PNC-08", "title": "Purpose-level consent choices", "domain": "PNC", "theme": "", "goal": "The organization lists each purpose separately in the consent request and lets the person give or withhold consent for each one.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Split from consent records (PNC-09): the test differs (consent screens versus stored records).", "statement": "Each purpose appears as a separate item in the consent request, and the person can give or withhold consent for each one. A separate unticked control is built for every optional purpose. Refusing or withdrawing one purpose leaves the others unchanged. This allows real partial consent. The consent screens and the stored consent states are the proof.", "why": "A single combined consent forces all-or-nothing choices and hides purposes. Consultants should check that the choice works in the system, not only on the screen.", "how": "Open a flow that serves more than one purpose and ask to switch one purpose off. Then look at what the system does with it. Example probe: \"Turn off the marketing purpose but keep the service purpose. What changes in the system?\"", "q": "Does your organization list each purpose separately in the consent request and let people give or withhold consent for each one?", "evidence": "Consent screens for flows with more than one purpose; design of per-purpose controls; consent log extract showing per-purpose states; covering the review period.", "good": "Where data serves more than one purpose, each purpose is its own item with its own unticked control. The notice describes the data used for each purpose. People with mixed choices exist in the records and the system respects them.", "test": "Select consent flows that serve more than one purpose. For each, check purposes are listed separately with separate unticked controls. Test one partial choice and confirm the other purposes are unaffected. Check the consent log holds people with mixed per-purpose states. Pass if every sampled flow offers separate choices and partial consent works.", "risk": "People cannot refuse some purposes while accepting others, so consent is bundled and not specific.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.2", "ref": "Section 6(1)", "atom": "CH2.CONSENT.2-a", "text": "List each purpose as a separate item in the consent request when data is used for more than one purpose.", "match": "req_smaller", "cov": "full", "reason": "Separate listing of each purpose in the request is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CM.GRANULAR.1", "ref": "Section 6(1)", "atom": "CM.GRANULAR.1-a", "text": "Give data principals working controls to give or withhold consent for each purpose, so partial consent is possible.", "match": "req_smaller", "cov": "full", "reason": "Working per-purpose give or withhold controls are the control's test.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PNC-09", "title": "Consent records", "domain": "PNC", "theme": "", "goal": "The organization keeps auditable records of when, how and for which purpose each person gave consent.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Auditable consent records are kept. Each record shows the purpose, the date and time, the capture channel, the notice version shown, and any later withdrawal, stored separately for each purpose. The records are protected from alteration. This lets the organization prove consent when asked. The consent log and the notice archive are the proof.", "why": "Without records the organization cannot show who agreed to what, and a challenge becomes its word against the person's. Consultants should ask to see one person's full consent history.", "how": "Pick a person and ask for everything the organization holds about their consent. Check the notice shown can also be produced. Example probe: \"For this customer, show me when they consented, to which purposes, through which channel and which notice they saw.\"", "q": "Does your organization keep auditable records of when, how and for which purpose each person gave consent?", "evidence": "Consent log schema; consent log extract for a sample of people; notice version archive; withdrawal records; access control or change history for the log; covering the review period.", "good": "Each record holds the purpose, timestamp, channel and notice version, with a separate status for each purpose and every withdrawal logged. Records cannot be changed without trace. The matching notice version can be produced for any person.", "test": "Select a sample of people across channels and ask for their consent records. Check each shows the purpose, date and time, channel, notice version and any withdrawal, with a separate status per purpose. Ask for the matching notice version for each. Pass if all sampled records are complete and every notice version is produced.", "risk": "The organization cannot prove consent was given, so any processing based on it is hard to defend.", "applies": "", "type": "detective", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.2", "ref": "Section 6(1)", "atom": "CH2.CONSENT.2-b", "text": "Record the data principal's consent against each specific purpose rather than as one blanket consent.", "match": "req_smaller", "cov": "full", "reason": "Consent recorded against each purpose is a field of the consent record.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CM.RECORDS.1", "ref": "Section 6", "atom": "CM.RECORDS.1-a", "text": "Maintain auditable records of when, how and for what purpose each data principal gave consent.", "match": "equal", "cov": "full", "reason": "Same ask: auditable consent records of when, how and purpose.", "primary": true, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PNC-10", "title": "Fresh consent for new purposes", "domain": "PNC", "theme": "", "goal": "The organization obtains fresh consent before processing personal data for a new or changed purpose.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "A trigger ensures that any new or changed purpose is reviewed before processing starts. Fresh notice and consent for that purpose are collected before the new processing begins. Existing consent is never reused for a purpose it did not cover. This keeps processing within what people agreed to. The change procedure and the new consent records are the proof.", "why": "Teams often reuse data for a new feature on the strength of old consent. Consultants should look for a gate that stops this and for proof it worked on a real change.", "how": "Ask how a new use of data is brought to those who handle privacy and what stops it going live without consent. Then ask for a recent example. Example probe: \"Tell me about the last new feature that used existing data in a new way. When was consent collected relative to launch?\"", "q": "Does your organization obtain fresh consent before processing personal data for a new or changed purpose?", "evidence": "Change procedure with the privacy trigger; product or purpose change records; consent log extract showing new consent dates; launch dates for the new processing; covering the review period.", "good": "A documented step requires privacy review of every new or changed purpose before launch. Fresh notice and consent are collected first, and consent records are dated before the processing started. Old consent is not stretched to cover new uses.", "test": "List new or changed purposes introduced in the review period and sample them. For each, compare the consent record date with the launch date of the new processing. Pass if every sampled purpose has fresh consent dated before the processing began, and the change procedure contains the trigger.", "risk": "Data is reused for purposes people never agreed to, which makes the new processing unlawful.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CM.RECORDS.2", "ref": "Section 6(1)", "atom": "CM.RECORDS.2-a", "text": "Obtain fresh consent before processing personal data for a new or changed purpose.", "match": "equal", "cov": "full", "reason": "Same ask: fresh consent for a new or changed purpose.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PNC-11", "title": "Consent withdrawal", "domain": "PNC", "theme": "", "goal": "The organization lets people withdraw consent as easily as they gave it.", "owner": "Data Protection Officer", "imp": "critical", "origin": "dpdpa", "note": "Privacy-only. Split from PNC-12: ease of the channel versus effect on processing.", "statement": "People can withdraw consent as easily as they gave it. Withdrawal takes no more steps and no less accessible a channel than giving consent, and the notice says how to do it. Give and withdraw flows are checked side by side whenever either changes. This keeps withdrawal from becoming a hurdle. The side-by-side flows are the proof.", "why": "If giving consent takes one tap and withdrawing takes a letter, the right to withdraw is hollow. Consultants should compare the two paths directly.", "how": "Ask the client to demonstrate giving consent and then withdrawing it in each channel, and count the steps. Example probe: \"Consent was given in the app with two taps. Show me how long it takes to withdraw it in the app.\"", "q": "Does your organization let people withdraw consent as easily as they gave it?", "evidence": "Side-by-side recordings or screenshots of the give and withdraw flows in each channel; notice text on how to withdraw; counts of steps for each flow; covering the review period.", "good": "In every channel, withdrawal takes no more steps than giving consent and uses the same kind of channel. Consent given in the app can be withdrawn in the app. The notice tells people where to withdraw.", "test": "Select a sample of consent flows across channels and run the give and the withdraw path for each. Count steps and compare the channels. Check the notice explains how to withdraw. Pass if withdrawal takes no more steps and no less accessible a channel than giving consent in every sampled flow.", "risk": "People are discouraged or blocked from withdrawing consent, and the organization keeps processing on consent people no longer want to give.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.3", "ref": "Section 6(4), 6(6)", "atom": "CH2.CONSENT.3-a", "text": "Let data principals withdraw consent as easily as they gave it.", "match": "equal", "cov": "full", "reason": "Same ask: withdrawal as easy as giving consent.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PNC-12", "title": "Processing stops after withdrawal", "domain": "PNC", "theme": "", "goal": "The organization stops processing, and has its processors stop, within a defined period after consent is withdrawn, unless the law requires otherwise.", "owner": "Data Protection Officer", "imp": "critical", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Processing stops, and processors are made to stop, within a defined period after consent is withdrawn. The exception is processing the law requires or allows without consent. Stop instructions to processors are issued and recorded. This makes withdrawal have a real effect. The withdrawal log and the processor instruction records are the proof.", "why": "A withdrawal button that changes nothing behind the scenes is worse than none. Consultants should trace a withdrawal through to the systems and the processors.", "how": "Ask for a documented withdrawal procedure and the period it sets. Then pick a withdrawal and trace what stopped and when, including at processors. Example probe: \"Take a withdrawal from last month. Show me the date processing stopped in your system and at your email vendor.\"", "q": "Does your organization stop processing, and make its processors stop, within a defined period after a person withdraws consent?", "evidence": "Withdrawal procedure stating the period; withdrawal log; processor instruction records and confirmations; records of retention grounds where the law requires keeping data; covering the review period.", "good": "A written procedure sets the period for stopping processing after withdrawal and requires processors to stop too. Each withdrawal is logged with the date processing stopped, including at processors. Any data kept because the law requires it has a recorded ground.", "test": "Sample withdrawals from the review period. For each, check the date of withdrawal, the date processing stopped in internal systems and the processor stop instruction and confirmation. Pass if every sampled withdrawal was applied within the defined period, including at processors, or has a recorded legal ground for keeping the data.", "risk": "Processing continues after people withdraw consent, which is unlawful and erodes trust.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.3", "ref": "Section 6(4), 6(6)", "atom": "CH2.CONSENT.3-b", "text": "Stop processing, and have processors stop, once consent is withdrawn unless a law requires retention.", "match": "equal", "cov": "full", "reason": "Same ask: processing, including at processors, stops after withdrawal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PNC-13", "title": "Consent manager use", "domain": "PNC", "theme": "", "goal": "The organization accepts consent actions through intermediaries only where they are on the regulator's published list, and applies those actions as it would direct ones.", "owner": "Data Protection Officer", "imp": "medium", "origin": "dpdpa", "note": "Privacy-only. Applies only where such intermediaries are used.", "statement": "Consent actions are accepted through an intermediary only where the intermediary is a consent manager on the Board's published list. The organization's systems treat consent given, reviewed or withdrawn through the intermediary the same as direct actions. The intermediary's records are reconciled with internal consent status on a regular cycle. The agreement, the register extract and the reconciliation are the proof.", "why": "An unlisted intermediary may not be trusted to speak for people, and a withdrawal made there that is never applied leaves processing running without consent. Consultants should check both the registration and the data flow.", "how": "First ask whether any intermediary sends consent actions. If so, check each against the Board's published list, then follow one withdrawal into the internal system. Example probe: \"Show me this consent manager on the Board's list, and a withdrawal that came through it and where it shows in your consent log.\"", "q": "If your organization accepts consent through consent managers, does it accept only consent managers on the Board's published list and apply their actions as it would direct ones?", "evidence": "Agreements with each consent manager; extract of the Board's published list showing each one; integration documentation; reconciliation of consent manager records against the internal consent log; covering the review period.", "good": "Each intermediary is checked against the Board's published list before it is used and the check is recorded. Consent, review and withdrawal through it update the internal consent status in the same way as direct actions. Reconciliations show no unapplied withdrawals.", "test": "List every consent manager in use and check each against the Board's published list. Sample people from the review period and compare the manager's consent and withdrawal records with the internal consent log. Pass if every manager is listed and every sampled action, especially withdrawals, was applied internally.", "risk": "Consent actions arrive through unlisted or unreliable channels, and withdrawals made there are never applied.", "applies": "Applies if the organization accepts consent actions through consent managers.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.4", "ref": "Section 6(8)-(9)", "atom": "CH2.CONSENT.4-a", "text": "Use only Consent Managers that are registered with the Data Protection Board.", "match": "req_smaller", "cov": "full", "reason": "Using only intermediaries on the regulator's list is the control's test.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.CONSENT.4", "ref": "Section 6(8)-(9)", "atom": "CH2.CONSENT.4-b", "text": "Confirm the Consent Manager gives data principals an accessible, transparent and interoperable platform to manage consent.", "match": "req_smaller", "cov": "full", "reason": "Applying consent actions received through the intermediary is part of the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PRT-01", "title": "Channel for rights requests", "domain": "PRT", "theme": "", "goal": "The organization publishes the means by which people can ask for access, correction, completion or erasure of their personal data, and the identifier they must give.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "The means by which people can ask for access, correction, completion or erasure of their personal data, and the identifier they must give, are published. The published means are checked after each change to the website, the app or the request process. This gives people a route to use their rights. The published pages and the request intake form are the proof.", "why": "If people cannot find how to make a request, rights exist only on paper. Consultants should test the route as a person would.", "how": "Look for the request route on the website and in the app, then try to start each type of request. Example probe: \"Starting from the home page, show me how I would ask you to delete my data, and what you ask me to provide.\"", "q": "Does your organization publish how people can ask for access, correction, completion or erasure of their personal data, and the identifier they must give?", "evidence": "Website and app pages showing the request route; rights request intake form; description of the identifier required; covering the review period.", "good": "The website and app clearly show one or more means to request access, correction, completion and erasure, and state the identifier needed. The route is easy to find, works, and is kept current.", "test": "Check the website and the app for the published means for each of the four request types and for the identifier required. Start one test request through each channel. Pass if each type is covered, the route is findable within a few steps and each test request reaches the request intake.", "risk": "People do not know how to exercise their rights, so requests are not made or are lost.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH3.ACCESS.1", "ref": "Section 11(1)", "atom": "CH3.ACCESS.1-a", "text": "Publish how a data principal can request information about their personal data and what identifier to give.", "match": "req_smaller", "cov": "full", "reason": "Publishing how to request information is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.CORRECT.2", "ref": "Section 12(3)", "atom": "CH3.CORRECT.2-a", "text": "Let data principals request erasure of the personal data they gave consent for, at any time.", "match": "req_smaller", "cov": "full", "reason": "Publishing a means to request erasure is the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PRT-02", "title": "Summary of data and processing on request", "domain": "PRT", "theme": "", "goal": "The organization gives a person who asks a summary of the personal data it processes, the processing activities, and the other parties it shared the data with.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Each access request is answered with a summary of the personal data processed, the processing activities and the other fiduciaries and processors the data was shared with, including what was shared. A response template is used and a request log is kept. This lets people see how their data is used. The log and the sample responses are the proof.", "why": "Access responses that cover only some data, or skip who received it, give people a false picture. Consultants should read real responses against the template.", "how": "Ask for the access response template and the request log, then read a few completed responses. Example probe: \"Show me a response from last quarter. Where does it list the vendors who received this person's data?\"", "q": "Does your organization give a person who asks a summary of their personal data, the processing activities and the parties the data was shared with?", "evidence": "Access request procedure; response template; access request log; sample completed responses; list of recipients shared with; covering the review period.", "good": "The template covers the personal data held, the processing activities and the other fiduciaries and processors the data was shared with, with what was shared. Requests are logged and each has a complete response. Withheld items have a stated legal reason.", "test": "Sample access requests from the review period. For each, check the response includes the data summary, the activities and the recipient information. Where something was withheld, check a legal reason is recorded. Pass if every sampled response is complete or has a recorded lawful reason.", "risk": "People cannot see what is held about them or who received it, and the organization breaches their right of access.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH3.ACCESS.1", "ref": "Section 11(1)", "atom": "CH3.ACCESS.1-b", "text": "Provide on request a summary of the personal data being processed.", "match": "req_smaller", "cov": "full", "reason": "A summary of personal data processed is the control's core output.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.ACCESS.1", "ref": "Section 11(1)", "atom": "CH3.ACCESS.1-c", "text": "Provide on request a summary of the processing activities carried out on that data.", "match": "req_smaller", "cov": "full", "reason": "The summary of processing activities is part of the same response.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.ACCESS.1", "ref": "Section 11(1)", "atom": "CH3.ACCESS.1-d", "text": "Identify on request the other data fiduciaries and processors the data was shared with and what was shared.", "match": "req_smaller", "cov": "full", "reason": "Naming recipients and what was shared is part of the same response.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PRT-03", "title": "Correction and completion", "domain": "PRT", "theme": "", "goal": "The organization corrects inaccurate or misleading personal data and completes incomplete data when a person asks.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Inaccurate or misleading personal data is corrected, and incomplete data is completed, when a person asks. The change is made in the system of record and passed on to systems that copy the data. Each request is tracked to closure. This keeps decisions about people based on accurate data. The request log and before and after extracts are the proof.", "why": "A correction that is accepted on a form but never changed in the source system leaves wrong data in use. Consultants should check the record itself changed.", "how": "Ask for the correction procedure, then follow a request into the system of record. Example probe: \"Take a correction request from last month. Show me the record before and after, and any other system that also holds this field.\"", "q": "Does your organization correct inaccurate or misleading personal data, and complete incomplete data, when a person asks?", "evidence": "Rights request procedure; request log of correction and completion requests; before and after record extracts; evidence of updates in systems that copy the data; covering the review period.", "good": "A published route and a written procedure cover correction and completion. Each request is logged, decided and closed, and accepted changes appear in the system of record and in connected systems. People are told the outcome.", "test": "Sample correction and completion requests from the review period. For each, compare the record before and after and confirm the change was made in the system of record. Pass if every accepted request shows the change in place, and every declined request has a recorded reason.", "risk": "Inaccurate or incomplete data keeps being used, which harms people and weakens decisions.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH3.CORRECT.1", "ref": "Section 12(1)", "atom": "CH3.CORRECT.1-a", "text": "Correct personal data on request when it is inaccurate or misleading.", "match": "req_smaller", "cov": "full", "reason": "Correcting inaccurate data on request is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.CORRECT.1", "ref": "Section 12(1)", "atom": "CH3.CORRECT.1-b", "text": "Complete personal data on request when it is incomplete.", "match": "req_smaller", "cov": "full", "reason": "Completing incomplete data on request is in the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PRT-04", "title": "Erasure on request", "domain": "PRT", "theme": "", "goal": "The organization erases a person's personal data when asked, and its processors do the same, unless keeping it is necessary for the purpose or required by law, and records the outcome of each request.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Deletion mechanics are reached through AST-08 and AST-70.", "statement": "A person's personal data is erased when they ask, and processors erase it too, unless keeping it is necessary for the purpose or the law requires it. The outcome of each request is recorded, either as proof of erasure or as the ground for keeping. This honors the person's right to have data removed. The request log and erasure records are the proof.", "why": "Requests that are acknowledged but never carried out, or erased in one system while copies remain, leave the organization holding data it must delete. Consultants should look for evidence of erasure, including at processors.", "how": "Ask for the erasure procedure and the request log. Then pick closed requests and ask for proof of erasure or the retention ground. Example probe: \"For this closed erasure request, show me what was deleted, at which processors, and on what date.\"", "q": "Does your organization erase a person's personal data when asked, and have its processors do the same, unless keeping it is necessary or required by law?", "evidence": "Rights request procedure; erasure request log; erasure records or deletion confirmations; processor instruction and confirmation records; retention ground records; covering the review period.", "good": "A procedure erases data on request in internal systems and requires processors to erase too. Each request is closed either with proof of erasure or with a documented retention ground. People are told the outcome.", "test": "Sample erasure requests from the review period. For each, check the closure shows evidence of erasure, including at processors, or a recorded ground for keeping the data. Pass if every sampled request has one or the other and no data remains where erasure was recorded.", "risk": "Data stays in systems and with processors after people ask for it to be erased, which breaches their right and increases breach exposure.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH3.CORRECT.2", "ref": "Section 12(3)", "atom": "CH3.CORRECT.2-b", "text": "Erase the data on request unless retention is necessary for the specified purpose or to comply with law.", "match": "equal", "cov": "full", "reason": "Same ask: erase on request unless a retention ground applies.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PRT-05", "title": "Grievance channel and owner", "domain": "PRT", "theme": "", "goal": "The organization provides an accessible way for people to raise grievances and names the person who handles them.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "An accessible way for people to raise grievances about how their data is handled is provided, and a named person or role handles them. The route is published and a grievance log records each case. This gives people a place to complain before going to the regulator. The published route, the owner appointment and the grievance log are the proof.", "why": "A grievance route nobody owns lets complaints go unanswered. Consultants should check that a named person exists and that the log shows real use.", "how": "Ask where a person lodges a complaint and who handles it, then look at the log. Example probe: \"Where on your site do I raise a privacy complaint, who receives it, and can I see the last three entries in the log?\"", "q": "Does your organization provide an accessible way for people to raise grievances and name the person who handles them?", "evidence": "Published grievance route on the website and app; appointment of the grievance handler; grievance log with receipt date, subject and outcome; covering the review period.", "good": "The website and app show how to submit a grievance through an accessible channel. A named role or person handles grievances. The log records each grievance with its receipt date, subject and outcome.", "test": "Check the website and app for the published grievance route and test it with a sample submission. Confirm a named role or person is responsible. Sample entries in the grievance log from the review period. Pass if the route works, an owner is named and every sampled entry has a receipt date, subject and outcome.", "risk": "People have no clear route to complain, so problems go unreported and escalate to the regulator.", "applies": "", "type": "corrective", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH3.GRIEVANCE.1", "ref": "Section 13(1)", "atom": "CH3.GRIEVANCE.1-a", "text": "Provide an accessible way for data principals to register grievances.", "match": "req_smaller", "cov": "full", "reason": "An accessible way to raise grievances is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.GRIEVANCE.1", "ref": "Section 13(1)", "atom": "CH3.GRIEVANCE.1-b", "text": "Designate a person or officer who handles those grievances.", "match": "req_smaller", "cov": "full", "reason": "Naming the handler is part of the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PRT-06", "title": "Grievance response and escalation notice", "domain": "PRT", "theme": "", "goal": "The organization answers each grievance within a defined time and tells the person of the right to approach the regulator if it stays unresolved.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Time limit (dpdpa layer) goes in key_settings if one is fixed.", "statement": "Each grievance is answered within a published period of no more than 90 days. Due dates are tracked and items close to the limit are escalated. The response tells the person they may approach the Board if the grievance stays unresolved. This keeps complaints moving and the escalation right visible. The grievance log and the response template are the proof.", "why": "A period that is published but missed, or a response that hides the right to go to the Board, defeats the purpose of the grievance route. Consultants should compare dates in the log with the published period.", "how": "Ask for the published period and the tool that tracks due dates, then check the log for late items. Example probe: \"Show me the longest grievance last quarter, its dates, and the response that went to the person.\"", "q": "Does your organization answer each grievance within a published period of no more than 90 days and tell the person about their right to approach the Board?", "evidence": "Published grievance response period; grievance log with receipt and response dates; response template mentioning the Board; ticketing or alert configuration; escalation records; covering the review period.", "good": "The website states a response period of no more than 90 days. Every grievance is answered inside it, due-date alerts and an escalation path exist, and the response template tells people they can approach the Board if the matter is unresolved.", "test": "Sample grievances from the review period and compare receipt and response dates with the published period. Read the responses for the statement about the Board. Pass if the published period is no more than 90 days, every sampled grievance was answered within it and every response mentions the Board.", "risk": "Grievances go unanswered or are answered late, and people are not told they can escalate, which leads to regulator complaints.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "dpdpa: grievance answered within the published period, no more than 90 days", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH3.GRIEVANCE.2", "ref": "Section 13(2)", "atom": "CH3.GRIEVANCE.2-a", "text": "Respond to each grievance within a reasonable, defined time.", "match": "req_smaller", "cov": "full", "reason": "Answering within a defined time is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.GRIEVANCE.2", "ref": "Section 13(2)", "atom": "CH3.GRIEVANCE.2-b", "text": "Tell the data principal about their right to approach the Data Protection Board when a grievance is unresolved.", "match": "req_smaller", "cov": "full", "reason": "Telling the person of the right to approach the regulator is in the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PRT-07", "title": "Nomination of a representative", "domain": "PRT", "theme": "", "goal": "The organization lets people nominate another individual to exercise their rights on their death or incapacity, and honors the nominee's requests.", "owner": "Data Protection Officer", "imp": "medium", "origin": "dpdpa", "note": "Privacy-only. Home for the nomination right.", "statement": "People can nominate another individual to exercise their rights if they die or become unable to act. Each nomination is recorded against the person's account. When a nominee makes a request, the death or incapacity and the nominee's identity are verified, and then the request is acted on. The nomination form, the verification procedure and the nomination records are the proof.", "why": "Without a nomination route, families cannot deal with data after a death or incapacity, and the organization may release data to the wrong person. Consultants should check both the route and the verification.", "how": "Ask where a person can name a nominee and how a nominee's claim is checked. Example probe: \"If a customer dies and a relative writes in, what do you check before you act, and where is any nomination stored?\"", "q": "Does your organization let people nominate another individual to exercise their rights on their death or incapacity, and honor the nominee's requests?", "evidence": "Published nomination route and form; nomination records; verification procedure for nominee requests; sample nominee requests and outcomes; covering the review period.", "good": "A published means lets people nominate one or more individuals. Nominations are stored against the person's record and can be retrieved. A written procedure sets how a nominee's identity and the person's death or incapacity are verified before the request is handled.", "test": "Check the website or app for the nomination route and test a nomination. Sample stored nominations and confirm each can be retrieved against the right person. Read the verification procedure and any nominee request in the review period. Pass if the route exists, nominations are retrievable and every nominee request was verified before action.", "risk": "Rights cannot be used for people who have died or lost capacity, and data may be released to the wrong person.", "applies": "", "type": "corrective", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH3.NOMINATE.1", "ref": "Section 14", "atom": "CH3.NOMINATE.1-a", "text": "Let data principals nominate another individual to exercise their rights.", "match": "req_smaller", "cov": "full", "reason": "Letting people nominate an individual is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH3.NOMINATE.1", "ref": "Section 14", "atom": "CH3.NOMINATE.1-b", "text": "Honor the nominee's exercise of those rights on the data principal's death or incapacity.", "match": "req_smaller", "cov": "full", "reason": "Honoring the nominee's requests is in the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PUR-01", "title": "Processing within the consented purpose", "domain": "PUR", "theme": "", "goal": "The organization processes personal data only for the purpose the person consented to.", "owner": "Data Protection Officer", "imp": "critical", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Each processing activity runs only for a purpose stated in the notice under which the data principal gave consent. Before a new use of existing data starts, such as a campaign, an analytics use or a data share, it is checked against the consented purposes, and it is blocked or fresh consent is sought if it falls outside them. This stops purpose creep. Proof is the processing record that links each activity to its purpose and the review records for new uses.", "why": "Data collected for one reason drifts into marketing, analytics or sharing without fresh consent. Consent then no longer matches what actually happens to the data.", "how": "Ask what the data is used for today and what stops a team from using it for something new. Pick two or three recent uses and trace each back to the consent notice. Example probe: \"Show me the last new use of customer data and the purpose line in the notice that covers it.\"", "q": "Does your organization process personal data only for the purpose the data principal consented to?", "evidence": "Processing record or data inventory showing each activity and its purpose; consent notices and forms; records of new-use reviews; campaign or data-share approvals for the audit period.", "good": "Every processing activity is linked to a stated purpose in a consent notice. New uses go through a review before launch, and uses outside the consented purpose are blocked or sent back for fresh consent. The reviews leave dated records.", "test": "Sample processing activities such as a marketing campaign, an analytics use and a data share from the audit period. Trace each to a purpose in the notice under which consent was taken. Pass if every sampled activity maps to a consented purpose or to a recorded lawful ground.", "risk": "Personal data is reused beyond what people agreed to, which makes the consent invalid and exposes the organization to complaints and penalties.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.PURPOSE.1", "ref": "Section 4(1)", "atom": "CH2.PURPOSE.1-a", "text": "Process personal data only for the purpose the data principal consented to.", "match": "equal", "cov": "full", "reason": "Same ask: process only for the consented purpose.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PUR-02", "title": "Processing without consent identified and documented", "domain": "PUR", "theme": "", "goal": "The organization identifies each case where it processes personal data without consent under a legitimate-use ground and documents the ground relied on.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Related to RSK-08 (records of processing); kept apart because the test is the lawful-ground record.", "statement": "Each case where personal data is processed without consent under a legitimate-use ground is identified, and a register names the specific ground relied on for each case. For each case relying on data the person volunteered, the register records the purpose and how a refusal by the person stops the use. The register is reviewed whenever processing changes, and any entry that rests on a ground the law does not recognize is removed. Proof is the register and its review records.", "why": "Teams often assume they can process without consent because it is convenient, not because a recognized ground applies. Without a register nobody can show which grounds are in use or whether they hold.", "how": "Ask which processing runs without consent and what ground covers each. Look for grounds borrowed from other regimes, such as general business interest, that the local law does not allow. Example probe: \"Which of your processing runs without consent, and where do you record the ground for it?\"", "q": "Does your organization document each case where it processes personal data without consent and the legitimate-use ground it relies on?", "evidence": "Register of processing without consent with the ground named for each entry; records of how refusal stops voluntary-provision uses; register review records after processing changes; employment-purpose privacy notices.", "good": "A register lists every processing activity that runs without consent and names the specific ground for each. Each entry has an owner and a reason the ground applies. The register is reviewed when processing changes, and no entry relies on a ground the law does not recognize.", "test": "Read the register and sample entries. Check each names a recognized legitimate-use ground and, for volunteered data, records the purpose and how refusal stops the use. Pass if every sampled entry has a valid named ground and none relies on an unrecognized ground such as general business interest.", "risk": "Processing without consent proceeds on an assumed basis that cannot be defended when challenged.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.PURPOSE.1", "ref": "Section 4(1)", "atom": "CH2.PURPOSE.1-b", "text": "Where no consent is held, process personal data only for a purpose the Act treats as a legitimate use.", "match": "req_smaller", "cov": "full", "reason": "Limiting no-consent processing to a legitimate-use ground is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.PURPOSE.2", "ref": "Section 7", "atom": "CH2.PURPOSE.2-a", "text": "Identify every case where personal data is processed without consent under the legitimate-use provisions.", "match": "req_smaller", "cov": "full", "reason": "Identifying every no-consent processing case is the control's first test.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.PURPOSE.2", "ref": "Section 7", "atom": "CH2.PURPOSE.2-b", "text": "Document the legitimate-use basis relied on for each such case.", "match": "req_smaller", "cov": "full", "reason": "Documenting the ground relied on is the control's second test.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PUR-03", "title": "Collection limited to what is necessary", "domain": "PUR", "theme": "", "goal": "The organization collects only the personal data that is necessary for the stated purpose.", "owner": "Data Governance Lead", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Home for minimization.", "statement": "Each personal data field the organization collects is mapped to the stated purpose that needs it, and any field with no mapped purpose is removed or made optional. The check is repeated whenever a form, API or processing scope changes. This keeps collection to what is necessary. Proof is the field-to-purpose mapping and the change review records.", "why": "Forms and interfaces grow fields that nobody can justify, and every extra field is more data to protect and more data to breach.", "how": "Ask to see the fields on the main collection forms and who decided each one is needed. Compare a form with the mapping. Example probe: \"Take your sign-up form and tell me which purpose needs each field.\"", "q": "Does your organization collect only the personal data that is necessary for the stated purpose?", "evidence": "Field-to-purpose mapping; sample collection forms and API schemas; review records for scope changes and for fields removed, for the audit period.", "good": "Each collected field is mapped to a purpose that needs it. Fields without a purpose are removed or optional. Reviews run when forms or scope change, and the sampled forms match the mapping.", "test": "Sample collection forms or API payloads. Compare each field with the mapping. Pass if every sampled field maps to a stated purpose and none is marked unnecessary or missing from the mapping.", "risk": "The organization holds more personal data than it needs, which enlarges the harm of any breach and breaches the limit on collection.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.MINIMIZE.1", "ref": "Section 6(1)", "atom": "CH2.MINIMIZE.1-a", "text": "Collect only the personal data that is necessary for the stated purpose.", "match": "equal", "cov": "full", "reason": "Same ask: collect only what the purpose needs.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PUR-04", "title": "Accuracy of data used for decisions and disclosure", "domain": "PUR", "theme": "", "goal": "The organization ensures personal data is complete, accurate and consistent before it is used for a decision affecting the person or disclosed to another party.", "owner": "Data Governance Lead", "imp": "medium", "origin": "dpdpa", "note": "Privacy-only. Home for accuracy.", "statement": "The processing in which personal data is used to make a decision about a person or is disclosed to another party is identified. For that processing, checks for completeness, accuracy and consistency, such as validation at capture or reconciliation against the source, run before the data is used or disclosed. Flagged errors are corrected and the correction recorded. Proof is the list of covered processing and the data quality check records.", "why": "Wrong data used for a decision or passed to another party causes real harm to the person and spreads the error beyond the organization.", "how": "Ask which decisions about people rely on stored data and what checks the data passes first. Ask for the last error found and how it was fixed. Example probe: \"Walk me through the checks on the data before it goes into a credit or eligibility decision.\"", "q": "Does your organization check that personal data is complete, accurate and consistent before using it for a decision about a person or disclosing it to another party?", "evidence": "List of decision and disclosure processing; data quality procedure; validation-failure reports or data quality review logs; correction records for the audit period.", "good": "Decision and disclosure processing is listed. Each has documented checks that run before use or disclosure. Failure reports show the checks ran, and flagged errors were corrected with a record.", "test": "Obtain the list of covered processing and pick samples. Check the documented checks exist and review the logs or reports from the audit period. Pass if the checks ran for every sampled item and each flagged error has a correction record.", "risk": "Decisions are made, or data is passed on, using wrong records, which harms individuals and creates liability.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.ACCURACY.1", "ref": "Section 8(3)", "atom": "CH2.ACCURACY.1-a", "text": "Ensure personal data is complete, accurate and consistent before it is used to make a decision affecting the data principal.", "match": "req_smaller", "cov": "full", "reason": "Accuracy before a decision affecting the person is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.ACCURACY.1", "ref": "Section 8(3)", "atom": "CH2.ACCURACY.1-b", "text": "Ensure personal data is complete, accurate and consistent before it is disclosed to another data fiduciary.", "match": "req_smaller", "cov": "full", "reason": "Accuracy before disclosure to another party is in the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PGV-01", "title": "Data protection officer appointed", "domain": "PGV", "theme": "", "goal": "The organization appoints a data protection officer based in India who answers to the governing body, represents the organization to the regulator and individuals, and is the named contact for grievances.", "owner": "Top Management", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Applies to organizations designated as significant. Base list has no equivalent role control (GOV-07 is generic).", "statement": "A data protection officer who is an individual based in India is appointed by a formal appointment letter or governing-body resolution. The officer answers to the governing body, with the reporting line documented, and is named as the contact point for the grievance process. The officer reports to the governing body on each reporting cycle. Proof is the appointment record, the organization chart and the governing-body minutes.", "why": "Without a named, senior and local officer, privacy duties have no owner and the regulator and individuals have no one to contact.", "how": "Ask who holds the role, where they sit and to whom they report. Check the person is based in India and is named in the grievance process. Example probe: \"Show me the appointment record and the last time the officer reported to the board.\"", "q": "Has your organization appointed a data protection officer based in India who answers to the governing body?", "evidence": "Appointment letter or governing-body resolution; organization chart showing the reporting line; grievance process naming the officer as contact; governing-body minutes recording the officer's reports for the last reporting cycle.", "good": "A named individual in India holds the role by formal appointment. The reporting line to the governing body is documented. The grievance process names the officer, and minutes show the officer reporting.", "test": "Obtain the appointment record and the organization chart. Check the person is an individual based in India, reports to the governing body and is named in the grievance process. Pass if all three hold and minutes from the last reporting cycle show the officer reporting.", "risk": "No one is accountable for privacy duties, and the regulator and individuals cannot reach a responsible person.", "applies": "Applies if the organization is designated a significant data fiduciary.", "type": "preventive", "freq": "annual", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH4.SDF.1", "ref": "Section 10(2)(a)", "atom": "CH4.SDF.1-a", "text": "Appoint a Data Protection Officer when designated a Significant Data Fiduciary.", "match": "req_smaller", "cov": "full", "reason": "Appointing the officer is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.SDF.1", "ref": "Section 10(2)(a)", "atom": "CH4.SDF.1-b", "text": "Ensure the Data Protection Officer is an individual based in India.", "match": "req_smaller", "cov": "full", "reason": "India-based officer is a stated element.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.SDF.1", "ref": "Section 10(2)(a)", "atom": "CH4.SDF.1-c", "text": "Make the Data Protection Officer responsible to the board or equivalent governing body, with the reporting line documented.", "match": "req_smaller", "cov": "full", "reason": "The reporting line to the governing body is a stated element.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.SDF.1", "ref": "Section 10(2)(a)", "atom": "CH4.SDF.1-d", "text": "Name the Data Protection Officer as the contact point for the grievance mechanism.", "match": "req_smaller", "cov": "full", "reason": "Naming the officer as grievance contact is a stated element.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PGV-02", "title": "Independent data auditor appointed", "domain": "PGV", "theme": "", "goal": "The organization appoints an independent auditor to evaluate its compliance with its data protection duties.", "owner": "Top Management", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Applies to significant organizations.", "statement": "An independent data auditor is appointed under a documented engagement to evaluate the organization's compliance with its data protection duties. The auditor has no role in the processing or in designing the controls under audit, and signs a declaration of independence. The auditor issues a report on each audit cycle and the report reaches the governing body. Proof is the engagement letter, the independence declaration and the audit report.", "why": "An auditor who helped build the controls cannot judge them fairly, so the report would give false comfort.", "how": "Ask who the auditor is, what they were engaged to cover and whether they have ever worked on the systems or controls they audit. Example probe: \"Show me the engagement letter and the auditor's independence declaration.\"", "q": "Has your organization appointed an independent auditor to evaluate its compliance with its data protection duties?", "evidence": "Auditor engagement letter; independence declaration; latest audit report; evidence the report reached the governing body, for the last audit cycle.", "good": "An engagement letter defines the audit scope. The auditor is independent of the processing and of control design, with a declaration on file. A report from the latest audit cycle exists and was seen by the governing body.", "test": "Obtain the engagement letter, independence declaration and latest report. Check the auditor has no role in the processing or controls under audit. Pass if the engagement is documented, independence is declared and a report was issued in the latest audit cycle.", "risk": "Compliance is never independently tested, so serious failures go unseen until the regulator finds them.", "applies": "Applies if the organization is designated a significant data fiduciary.", "type": "detective", "freq": "annual", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH4.SDF.2", "ref": "Section 10(2)(b)", "atom": "CH4.SDF.2-a", "text": "Appoint an independent data auditor to evaluate compliance with the Act.", "match": "equal", "cov": "full", "reason": "Same ask: appoint an independent auditor.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PGV-03", "title": "Data protection impact assessment", "domain": "PGV", "theme": "", "goal": "The organization assesses the risks of its processing activities to the people concerned, and repeats the assessment at a set interval.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Applies to significant organizations.", "statement": "The risks that the organization's processing creates for the rights of data principals are assessed, covering the processing purposes, the rights involved and how each risk is managed, including a check that any algorithmic software used on personal data does not put those rights at risk. The assessment is repeated once every 12 months and a report is kept. A report of its significant observations is given to the Board. Proof is the assessment method, the reports and the Board submission acknowledgement.", "why": "Large or sensitive processing can harm people in ways ordinary controls miss, and a regular assessment is how those risks get found and treated.", "how": "Ask for the assessment method and the last report. Check that results led to changes and that the Board received the observations. Example probe: \"Show me the latest assessment and one control you changed because of it.\"", "q": "Does your organization assess the risks of its processing activities to data principals on a repeating cycle?", "evidence": "Assessment method; assessment reports for each cycle; algorithm or model risk assessments; Board submission acknowledgements.", "good": "A defined method covers purposes, rights and risk treatment. An assessment is completed each cycle and its significant observations go to the Board. Results feed into control improvements.", "test": "Read the method and the reports for each cycle since designation. Check the report covers purposes, rights and risk treatment and that the Board acknowledgement is on file. Pass if an assessment was completed in each 12-month period and the observations reached the Board.", "risk": "Risks to individuals from large-scale processing go unrecognized and the organization misses a duty tied to its designation.", "applies": "Applies if the organization is designated a significant data fiduciary.", "type": "detective", "freq": "annual", "ks": "dpdpa: repeat the impact assessment once every 12 months", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH4.SDF.3", "ref": "Section 10(2)(c)(i)", "atom": "CH4.SDF.3-a", "text": "Conduct a data protection impact assessment of processing activities and the risks to data principals.", "match": "req_smaller", "cov": "full", "reason": "Assessing processing risks to individuals is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.SDF.3", "ref": "Section 10(2)(c)(i)", "atom": "CH4.SDF.3-b", "text": "Repeat the impact assessment at the prescribed periodic interval.", "match": "req_smaller", "cov": "full", "reason": "Repeating the assessment at a set interval is part of the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PGV-04", "title": "Periodic compliance audit and report", "domain": "PGV", "theme": "", "goal": "The organization has its compliance with data protection duties audited at a set interval and the auditor reports significant observations to the regulator.", "owner": "Head of Internal Audit", "imp": "high", "origin": "dpdpa", "note": "Privacy-only. Applies to significant organizations. Close to RSK-09 but audits privacy compliance, not the security program.", "statement": "An audit of the organization's compliance with its data protection duties is scheduled once every 12 months in an audit plan. The significant observations of the audit are reported to the Board. Findings are tracked to closure and the results are reported to the governing body. Proof is the audit plan, the audit reports and the Board submission acknowledgement.", "why": "Compliance drifts over time, and a fixed audit cycle with a report to the regulator makes sure that drift is found and shown.", "how": "Ask for the audit plan and the latest report, and ask how findings are tracked to closure. Example probe: \"Show me the last audit report and the acknowledgement that the Board received its observations.\"", "q": "Does your organization have its compliance with data protection duties audited on a set cycle with significant observations reported to the regulator?", "evidence": "Audit plan; audit reports for each cycle; Board submission acknowledgements; findings tracker with closure records.", "good": "The audit plan schedules a compliance audit once every 12 months. An audit was completed in each period and its significant observations were sent to the Board. Findings are tracked until verified closed.", "test": "Read the audit plan and the reports for each period since designation. Check the Board acknowledgement. Pass if the plan sets an audit once every 12 months, an audit was completed in each period and the Board received the significant observations.", "risk": "Compliance gaps persist undetected and the organization fails the periodic audit and reporting duty tied to its designation.", "applies": "Applies if the organization is designated a significant data fiduciary.", "type": "detective", "freq": "annual", "ks": "dpdpa: audit compliance once every 12 months", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH4.SDF.4", "ref": "Section 10(2)(c)(ii)", "atom": "CH4.SDF.4-a", "text": "Audit compliance with the Act and Rules at the prescribed periodic interval.", "match": "req_smaller", "cov": "full", "reason": "Auditing compliance at a set interval is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.SDF.4", "ref": "Section 10(2)(c)(ii)", "atom": "CH4.SDF.4-b", "text": "Have the auditor report significant observations to the Data Protection Board.", "match": "req_smaller", "cov": "full", "reason": "The auditor's report to the regulator is part of the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PSC-01", "title": "Age verification", "domain": "PSC", "theme": "", "goal": "The organization verifies the age of users so it can identify children and apply the child protections.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Onboarding determines whether a user is a child, meaning a person under 18, before the organization processes the user's data beyond what that check needs. The result of the age declaration or check is stored against the account, and accounts identified as a child's are flagged so the child protections apply. A sample of onboarding records is reviewed on a defined cycle. Proof is the onboarding design and the sampled account records.", "why": "If the organization cannot tell which users are children, none of the child protections can be applied and children's data is handled like adult data.", "how": "Ask how a user is identified as a child at sign-up and what happens to the account when they are. Look at what is stored. Example probe: \"Show me an account you flagged as a child and what the system did differently for it.\"", "q": "Does your organization determine at onboarding whether a user is a child so the child protections can be applied?", "evidence": "Onboarding flow design or screenshots; age declaration or check results stored against accounts; account flagging rules; sample of onboarding records for the audit period.", "good": "Onboarding asks for or checks age before processing beyond the check. The result is stored on the account, and child accounts are flagged so consent, tracking and advertising rules apply automatically.", "test": "Walk through the onboarding flow and sample onboarding records from the audit period. Pass if every sampled record has an age result stored against the account and accounts identified as a child's are flagged.", "risk": "Children are processed as adults, with no parental consent and no protection from tracking or targeting.", "applies": "Applies if the organization offers services to users who may be children.", "type": "preventive", "freq": "continuous", "ks": "dpdpa: a child is a person under 18", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH4.CHILD.3", "ref": "Section 9", "atom": "CH4.CHILD.3-a", "text": "Verify the age of users in order to identify children.", "match": "equal", "cov": "full", "reason": "Same ask: verify age to identify children.", "primary": true, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PSC-02", "title": "Verifiable guardian consent", "domain": "PSC", "theme": "", "goal": "The organization obtains verifiable consent from a parent before processing a child's personal data, or from a lawfully appointed guardian for a person with a disability, and verifies the consenting person's identity and authority.", "owner": "Data Protection Officer", "imp": "critical", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Verifiable consent is obtained from a parent before a child's personal data is processed, or from a lawfully appointed guardian for a person with a disability, and the consent is recorded before the data is first processed. The person consenting is checked to be an identifiable adult, using details already reliably held or details from an authorized identity source. For a guardian, the appointment by a court or a designated authority is checked. Proof is the consent and verification records.", "why": "A child cannot give valid consent, so unverified parental consent leaves all processing of the child's data without a lawful basis.", "how": "Ask how the organization gets and checks a parent's consent and how it verifies a guardian. Ask for a few child accounts and check the consent date against the first processing date. Example probe: \"Show me, for one child account, the parent's consent and how you verified that person was an adult.\"", "q": "Does your organization obtain verifiable consent from a parent or lawful guardian before processing personal data of a child or of a person with a disability?", "evidence": "Parental consent process; guardian verification procedure; consent and verification records for sampled child accounts; records of any recorded exemptions the organization relies on, for the audit period.", "good": "A documented process collects the parent's or guardian's consent before first processing. It verifies adult status and, for guardians, the appointment. Each record shows the consent, the method and a date earlier than the first processing.", "test": "Sample child accounts from the audit period. Check each has a parental or guardian consent record, a verification method and a consent date before the first processing. Pass if every sampled account does, or has a recorded exemption.", "risk": "The organization processes children's data without valid consent and exposes children and the organization to the highest penalties.", "applies": "Applies if the organization processes personal data of children or of persons with a disability.", "type": "preventive", "freq": "per_event", "ks": "dpdpa: a child is a person under 18", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.5", "ref": "Section 9(1)", "atom": "CH2.CONSENT.5-a", "text": "Obtain verifiable consent from a parent before processing the personal data of a child under 18.", "match": "req_smaller", "cov": "full", "reason": "Verifiable parental consent before processing a child's data is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.CONSENT.5", "ref": "Section 9(1)", "atom": "CH2.CONSENT.5-b", "text": "Obtain verifiable consent from a lawful guardian before processing the personal data of a person with a disability.", "match": "req_smaller", "cov": "full", "reason": "Guardian consent for a person with a disability is in the same control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.CONSENT.5", "ref": "Section 9(1)", "atom": "CH2.CONSENT.5-c", "text": "Verify that the person consenting is an identifiable adult parent or a validly appointed guardian.", "match": "req_smaller", "cov": "full", "reason": "Checking the parent's identity and the guardian's appointment is the control's verification step.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.CHILD.3", "ref": "Section 9", "atom": "CH4.CHILD.3-b", "text": "Apply the child protections, including parental consent, to every user identified as a child.", "match": "req_smaller", "cov": "full", "reason": "Parental consent for identified children is the guardian-consent control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PSC-03", "title": "No tracking or targeting of children", "domain": "PSC", "theme": "", "goal": "The organization does not track children, monitor their behavior or direct targeted advertising at them.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "The organization does not track children, monitor their behavior or direct targeted advertising at them, except where a recorded exemption allows it. A written rule prohibits these practices, and analytics and ad-tech settings for child accounts have behavioral tracking and ad personalization switched off. Where an exemption is relied on, its class or purpose and its condition are recorded. Proof is the rule, the configuration records and the exemption record.", "why": "Analytics and ad tools track users by default, so children get tracked and targeted unless someone switches that off for them.", "how": "Ask what tracking and advertising tools run on child accounts and how the settings differ from adult accounts. Ask for configuration evidence. Example probe: \"Show me the ad and analytics settings on a child account.\"", "q": "Does your organization refrain from tracking children, monitoring their behavior or directing targeted advertising at them?", "evidence": "Policy prohibiting tracking and targeted advertising of children; analytics and ad-tech configuration screenshots for child accounts; exemption record; age flagging records for the audit period.", "good": "A written rule bans tracking, behavioral monitoring and targeted advertising for children. Settings for child accounts show these switched off. Any exemption is recorded with its purpose and condition.", "test": "Read the rule. Sample child accounts and inspect analytics and ad-tech configuration. Pass if tracking and ad personalization are off for every sampled child account and every exemption relied on is recorded.", "risk": "Children are profiled and shown targeted advertising, which is a prohibited practice with high penalties.", "applies": "Applies if the organization processes personal data of children.", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH4.CHILD.1", "ref": "Section 9(3)", "atom": "CH4.CHILD.1-a", "text": "Do not track children.", "match": "req_smaller", "cov": "full", "reason": "No tracking of children is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.CHILD.1", "ref": "Section 9(3)", "atom": "CH4.CHILD.1-b", "text": "Do not carry out behavioral monitoring of children.", "match": "req_smaller", "cov": "full", "reason": "No behavior monitoring of children is in the same control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH4.CHILD.1", "ref": "Section 9(3)", "atom": "CH4.CHILD.1-c", "text": "Do not direct targeted advertising at children.", "match": "req_smaller", "cov": "full", "reason": "No targeted advertising to children is in the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PSC-04", "title": "No harmful processing of children's data", "domain": "PSC", "theme": "", "goal": "The organization does not process children's personal data in a way that harms their well-being.", "owner": "Data Protection Officer", "imp": "high", "origin": "dpdpa", "note": "Privacy-only.", "statement": "The organization's processing of children's personal data is assessed for likely harm to their well-being and the result is recorded. Processing that the assessment finds likely to harm well-being is prohibited or blocked by a documented control, such as a product or content rule. The assessment is repeated when processing of children's data starts or changes. Proof is the assessment record and the blocking control.", "why": "Features that are legal for adults, such as certain recommendations or content, can harm children, and the harm only shows up if someone looks.", "how": "Ask what features touch children's data and whether anyone has judged their effect on children. Ask for the last decision to block or change a feature. Example probe: \"Show me a feature you changed or blocked because of its effect on children.\"", "q": "Does your organization ensure its processing of children's personal data does not harm their well-being?", "evidence": "Children's data assessment; product or content policy; records of features blocked or changed; assessment review records for the audit period.", "good": "Processing of children's data has been assessed for harm and the result is recorded. Harmful processing is prohibited or blocked by a documented control, and the assessment is refreshed when processing changes.", "test": "Read the assessment and the product or content policy. Sample processing it marks as harmful and check a documented control blocks it. Pass if the assessment is current and e
