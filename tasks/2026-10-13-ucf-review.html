ng, response and recovery.", "primary": false, "rem": "UC-INC-01", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.SC.08", "ref": "GV.SC-08", "atom": "NIST.GV.SC.08-b", "text": "Relevant suppliers participate in incident exercises and real incidents.", "match": "equal", "cov": "full", "reason": "The slot holds supplier participation in exercises and real incidents.", "primary": false, "rem": "UC-INC-09", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-INC-41", "title": "Approved public statements after incidents", "domain": "INC", "theme": "", "goal": "The organization governs public statements about incidents and recovery through an approved procedure that sets who may speak publicly, an approval step and approved wording.", "owner": "Incident Response Lead", "imp": "medium", "origin": "nist", "note": "NIST-only. Linked to the notification duties control.", "statement": "An approved procedure governs public statements about incidents and recovery, which sets who may speak publicly, an approval step and approved wording templates. The procedure links to the notification duties process so statements stay consistent with what was told to regulators and affected people. Each public statement is issued under the procedure with a recorded approval. This keeps public messages accurate and avoids contradicting other disclosures.", "why": "Unapproved or improvised statements during an incident can be wrong, admit liability or contradict regulator notices. Consultants check that statements actually went through approval, not that a template exists.", "how": "Ask who is allowed to speak publicly about an incident and who signs off the words. Then ask for the last public statement and its approval. Example probe: \"Who approved the last statement you published about an outage or breach, and where is that approval recorded?\"", "q": "Does your organization issue public statements about incidents only under an approved procedure that sets who may speak publicly?", "evidence": "Public communications procedure for incidents with rules on who may speak publicly and an approval step; statement templates; record of statements issued with approvals; link or reference to the breach notification procedure; covering the last annual cycle.", "good": "The procedure sets who may speak publicly, the approval step and the templates, and points to the notification duties process. Every public statement in the period shows a recorded approval and matches what regulators and affected people were told.", "test": "Obtain the procedure and confirm it sets who may speak publicly, an approval step and templates, and links to the notification procedure. List the public statements about incidents in the review period and confirm each has a recorded approval. Pass if the procedure is complete and every statement was approved under it, or none was issued.", "risk": "Inaccurate or unapproved public statements damage trust and can contradict regulatory disclosures.", "applies": "Applies if the organization makes public statements about incidents or recovery.", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.RC.CO.04", "ref": "RC.CO-04", "atom": "NIST.RC.CO.04-a", "text": "The organization defines an approved procedure for public statements about incident recovery.", "match": "equal", "cov": "full", "reason": "No base control governs approved public statements about incidents.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.CO.04", "ref": "RC.CO-04", "atom": "NIST.RC.CO.04-b", "text": "Each public recovery statement is issued under that procedure, with approval.", "match": "equal", "cov": "full", "reason": "Issuing statements only under approval is the slot's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-INC-42", "title": "Incident recovery and its closure", "domain": "INC", "theme": "", "goal": "The organization starts recovery from incident response under set criteria, assigns recovery roles and approvals, carries out and records the recovery actions, and declares the end of recovery against criteria.", "owner": "Incident Response Lead", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-INC-03 so recovery is tested apart from containment and eradication.", "statement": "Documented criteria set when incident recovery starts, weighing the disruption recovery itself may cause, and when it is declared over. The plan assigns recovery roles and states which approvals each recovery step needs. When an incident is handed over from response to recovery, the decision and the criterion used are recorded, the recovery actions are carried out, and their scope, priority and completion are recorded. The end of recovery is then declared against the criteria, with approval, and the date is recorded. Proof is the criteria, the incident records and the closure declaration.", "why": "Recovery started too early can reinfect systems, and recovery never formally closed leaves incidents hanging. Consultants test the hand-off from response to recovery and the declared end, which are separate from containment.", "how": "Take a recent incident that reached recovery and trace it from the decision to start through to the declared end. Ask for the criteria and the records. Example probe: \"For your last incident, who decided recovery could start, what rule did they apply, and who said it was finished?\"", "q": "Does your organization run incident recovery from a recorded start to a declared end under written criteria and approvals?", "evidence": "Incident response plan section or recovery plan with start and end criteria; recovery roles and approvals list; incident records showing the hand-off, criterion applied, recovery actions with scope, priority and completion, and the end declaration with date and approval; latest recovery or disaster recovery test results; after-action reports; covering the last annual cycle.", "good": "The plan sets criteria for starting recovery, including disruption it may cause, and for declaring its end. Recovery roles and approvals are named and known. Incident records show the hand-off, actions with scope, priority and completion, an approved end declaration with date, and an after-action report.", "test": "Obtain the plan and confirm it has start criteria, end criteria, recovery roles and approvals. Sample incidents from the review period that reached recovery and confirm each records the hand-off, the criterion applied, the actions taken and the end declaration with approval and date. Pass if criteria exist and every sampled incident is fully recorded.", "risk": "Recovery starts too early or never formally closes, so systems are reinfected or incidents stay open without accountability.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.RS.MA.05", "ref": "RS.MA-05", "atom": "NIST.RS.MA.05-a", "text": "The organization documents criteria for starting incident recovery, including the disruption recovery itself may cause.", "match": "equal", "cov": "full", "reason": "The slot holds criteria for starting recovery, including the disruption recovery itself may cause.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.MA.05", "ref": "RS.MA-05", "atom": "NIST.RS.MA.05-b", "text": "The organization records the decision to begin recovery and the criterion applied.", "match": "equal", "cov": "full", "reason": "Recording the decision to begin recovery and the criterion applied is the slot's test.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.01", "ref": "RC.RP-01", "atom": "NIST.RC.RP.01-a", "text": "The incident response plan includes a recovery section or links to recovery and continuity plans, triggered from incident response.", "match": "equal", "cov": "full", "reason": "The slot holds the recovery stage triggered from incident response.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.01", "ref": "RC.RP-01", "atom": "NIST.RC.RP.01-b", "text": "The organization documents recovery roles and the authorizations each recovery step needs.", "match": "equal", "cov": "full", "reason": "Recovery roles and the approvals each step needs are in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.01", "ref": "RC.RP-01", "atom": "NIST.RC.RP.01-c", "text": "The organization starts recovery from the incident response process and records the hand-off.", "match": "equal", "cov": "full", "reason": "Starting recovery from incident response with a recorded hand-off is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.02", "ref": "RC.RP-02", "atom": "NIST.RC.RP.02-b", "text": "The organization performs recovery actions and records their scope, priority and completion.", "match": "equal", "cov": "full", "reason": "Executing recovery actions and recording scope, priority and completion is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.06", "ref": "RC.RP-06", "atom": "NIST.RC.RP.06-a", "text": "The organization documents criteria for declaring the end of incident recovery.", "match": "equal", "cov": "full", "reason": "Criteria for declaring the end of recovery are in the slot's goal.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.06", "ref": "RC.RP-06", "atom": "NIST.RC.RP.06-b", "text": "An approver declares the end of recovery and records the date.", "match": "equal", "cov": "full", "reason": "Declaring the end of recovery with approver and date is the slot's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 4, "r2": ""}, {"id": "UC-INC-43", "title": "Incident and recovery communication", "domain": "INC", "theme": "", "goal": "The organization sets who receives incident and recovery information, what each may be told and through which channel, and keeps them updated during major incidents and recovery.", "owner": "Incident Response Lead", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-GOV-14 in round 2 so incident and recovery communication is tested apart from the general communication plan.", "statement": "A communication plan for incidents and recovery names the stakeholders who receive incident and recovery information, what may be shared with each, and the channel for each. During major incidents and recovery, top management and the designated stakeholders receive status updates. Information shared outside the organization follows the agreed sharing rules. Proof is the plan and the updates sent during recent incidents.", "why": "Without agreed rules for who hears what during an incident, decision makers act on stale facts and sensitive details reach the wrong audience.", "how": "Ask who must be told during a major incident or recovery, what each audience may be told and how. Then trace the updates sent in a recent incident. Example probe: \"During your last major incident, who received updates, how often, and what decided what customers were told?\"", "q": "Does your organization follow an agreed plan that sets who receives updates during incidents and recovery?", "evidence": "Incident and recovery communication plan naming stakeholders, permitted content and channels; rules for sharing information outside the organization; status updates sent during sampled incidents and recoveries; external messages from the same incidents. Cover the last annual cycle.", "good": "The plan lists each stakeholder group, what it may receive and the channel. Status updates went to top management and the designated stakeholders during each major incident and recovery. Messages sent outside the organization match the sharing rules.", "test": "Obtain the incident and recovery communication plan. Sample major incidents from the period. For each, confirm status updates reached the stakeholders the plan names through the planned channel, and that any information shared outside the organization followed the sharing rules. Pass if the plan names stakeholders, content and channels, and every sampled incident shows updates and outside sharing in line with it.", "risk": "Decision makers act without current facts during an incident, and sensitive details reach the wrong audience.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.RS.CO.03", "ref": "RS.CO-03", "atom": "NIST.RS.CO.03-a", "text": "The communications plan states who receives incident information and what may be shared with each.", "match": "equal", "cov": "full", "reason": "Same ask: the plan names who receives incident information and what each may get.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.CO.03", "ref": "RS.CO-03", "atom": "NIST.RS.CO.03-b", "text": "Leadership receives status updates on major incidents.", "match": "req_smaller", "cov": "full", "reason": "Status updates to top management during major incidents are part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RS.CO.03", "ref": "RS.CO-03", "atom": "NIST.RS.CO.03-c", "text": "Information shared externally follows the agreed sharing rules.", "match": "req_smaller", "cov": "full", "reason": "Sharing information outside the organization under the agreed rules is part of the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.CO.03", "ref": "RC.CO-03", "atom": "NIST.RC.CO.03-a", "text": "The recovery communication plan names the stakeholders to update and the channel for each.", "match": "req_smaller", "cov": "full", "reason": "The plan names the recovery stakeholders and the channel for each.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.CO.03", "ref": "RC.CO-03", "atom": "NIST.RC.CO.03-b", "text": "The organization gives recovery progress updates to leadership and designated stakeholders.", "match": "req_smaller", "cov": "full", "reason": "Recovery progress updates to top management and designated stakeholders are part of the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "New (D14): incident and recovery communication, moved out of UC-GOV-14."}, {"id": "UC-INC-70", "title": "Breach intimation to the regulator", "domain": "INC", "theme": "", "goal": "The organization notifies the regulator of every personal data breach without delay and follows with a detailed report, in the prescribed form and content, and keeps proof that both were sent on time.", "owner": "Incident Response Lead", "imp": "critical", "origin": "dpdpa", "note": "Remainder of UC-INC-04. Timeframes (dpdpa layer) go in key_settings only.", "statement": "The Board is told of every personal data breach, with no harm or size threshold, without delay on becoming aware of it, describing its nature, extent, timing, location and likely impact. A detailed report follows within 72 hours of becoming aware, or within a longer period the Board allows on a written request. The report uses the prescribed form and covers the facts and causes, mitigation, who caused it, steps to prevent recurrence and the notices sent to data principals. Proof is the breach procedure, the report template and the submission records.", "why": "Missing or late reports to the regulator are penalized separately from the breach itself, and teams often wait for certainty before reporting.", "how": "Ask what triggers the first report and who sends it, then ask for the detailed report template. Check recent breaches against the times. Example probe: \"For your last breach, show me when you became aware, when the Board was told and when the detailed report went in.\"", "q": "Does your organization report every personal data breach to the Board on time, in the prescribed form?", "evidence": "Breach procedure with Board reporting steps; Board report template; incident log; Board submission records with dates, for the audit period.", "good": "The procedure requires immediate initial notice for every breach, with no harm threshold, and a detailed report within 72 hours. The template covers every required element. Records show both reports reached the Board on time.", "test": "Sample personal data breaches from the audit period. Compare the time of awareness with the dates of the initial notice and the detailed report. Pass if every sampled breach has both on time and the report contains the template content.", "risk": "The regulator is not told of a breach in time, which adds a separate penalty and erodes trust.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "dpdpa: notify the Board without delay on becoming aware of a personal data breach | dpdpa: send the detailed report to the Board within 72 hours of becoming aware, or within a longer period the Board allows on a written request", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "BN.NOTIFY.1", "ref": "Section 8(6); DPDP Rules 2025 r.7(2)", "atom": "BN.NOTIFY.1-a", "text": "Notify the Data Protection Board promptly of any personal data breach.", "match": "equal", "cov": "full", "reason": "The regulator intimation and detailed report complete the base notification control.", "primary": true, "rem": "UC-INC-04", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.1", "ref": "Section 8(6); DPDP Rules 2025 r.7(2)", "atom": "BN.NOTIFY.1-b", "text": "Follow the prescribed form, content and timeline when reporting the breach to the Board.", "match": "equal", "cov": "full", "reason": "The prescribed form, content and timing of the report are the slot's test.", "primary": false, "rem": "UC-INC-04", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-INC-71", "title": "Breach notice to affected individuals", "domain": "INC", "theme": "", "goal": "The organization identifies every individual affected by a personal data breach and notifies each of them without delay with the facts, likely consequences, mitigations, steps they can take and a contact for queries.", "owner": "Incident Response Lead", "imp": "critical", "origin": "dpdpa", "note": "Remainder of UC-INC-04.", "statement": "Each data principal affected by a personal data breach is notified without delay, through the user account or a communication channel the person registered. The notice is in clear, plain language and covers the nature, extent and timing of the breach, its likely consequences for the person, the mitigation taken, the steps the person can take and a contact for questions. This applies to every affected person with no harm threshold. Proof is the notification template and the dispatch records.", "why": "People cannot protect themselves from a breach they do not know about, and a notice that is vague or late leaves them exposed.", "how": "Ask how affected people are identified and reached, then ask for the notice template and a sent notice. Example probe: \"Show me the notice sent to people in your last breach and how you chose who got it.\"", "q": "Does your organization notify each data principal affected by a personal data breach without delay?", "evidence": "Breach procedure for individual notices; notification template; incident log; notification dispatch records for the audit period.", "good": "The procedure identifies each affected person and notifies them without delay through the account or a registered channel. The template covers all required content in plain language, and dispatch records match the affected list.", "test": "Sample personal data breaches from the audit period. Compare the affected list with the dispatch records and check the notice content against the template. Pass if every affected person in each sampled breach was notified without delay with the required content.", "risk": "Affected individuals are not told in time, so they cannot take steps to protect themselves.", "applies": "", "type": "corrective", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "BN.NOTIFY.2", "ref": "Section 8(6); DPDP Rules 2025 r.7(1)", "atom": "BN.NOTIFY.2-a", "text": "Notify each affected data principal of a personal data breach.", "match": "equal", "cov": "full", "reason": "Identifying and notifying every affected individual completes the base control.", "primary": true, "rem": "UC-INC-04", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.2", "ref": "Section 8(6); DPDP Rules 2025 r.7(1)", "atom": "BN.NOTIFY.2-b", "text": "Follow the prescribed form and content when notifying data principals.", "match": "equal", "cov": "full", "reason": "The required notice content is the slot's test.", "primary": false, "rem": "UC-INC-04", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-INC-72", "title": "Personal data breach register", "domain": "INC", "theme": "", "goal": "The organization keeps a register of every personal data breach recording the facts, effects, remedial actions and when each party was notified.", "owner": "Incident Response Lead", "imp": "high", "origin": "dpdpa", "note": "Remainder of UC-INC-03.", "statement": "A register records every personal data breach with the facts, the effects, the remedial actions and the dates the Board and the affected data principals were notified. Each breach is added to the register as it is confirmed, and the register is checked against the security incident log on a defined cycle. Proof is the register and the reconciliation records.", "why": "Without one register, the facts the regulator may ask for are scattered and some breaches never get recorded at all.", "how": "Ask to see the register and compare it with the security incident log. Example probe: \"Show me a breach from your incident log and its entry in the breach register.\"", "q": "Does your organization keep a register of every personal data breach with its facts, effects and remedial actions?", "evidence": "Breach register; security incident log and tickets; reconciliation records of register against log, for the audit period.", "good": "Every confirmed breach has an entry with facts, effects, remedial actions and the notification dates for the Board and data principals. The register matches the security incident log.", "test": "Take the personal data breaches from the security incident log for the audit period and look each up in the register. Pass if every breach appears with facts, effects, remedial actions and both notification dates.", "risk": "Breaches go unrecorded, so the organization cannot show the regulator what happened or what it did.", "applies": "", "type": "detective", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "BN.NOTIFY.4", "ref": "Section 8(6)", "atom": "BN.NOTIFY.4-a", "text": "Maintain a register of all personal data breaches.", "match": "equal", "cov": "full", "reason": "The breach register completes the base incident records.", "primary": true, "rem": "UC-INC-03", "imm": ""}, {"fw": "dpdpa", "rec": "BN.NOTIFY.4", "ref": "Section 8(6)", "atom": "BN.NOTIFY.4-b", "text": "Record in the register the facts and effects of each breach.", "match": "equal", "cov": "full", "reason": "Facts and effects per breach are register fields.", "primary": false, "rem": "UC-INC-03", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RES-01", "title": "Security during disruption", "domain": "RES", "theme": "Organizational", "goal": "The organization plans how security controls are maintained, or compensated, during a disruption.", "owner": "Business Continuity Manager", "imp": "high", "origin": "iso", "note": "", "statement": "Continuity and crisis plans state how security controls stay in place, or which compensating controls apply, during a disruption. Each continuity test and each real disruption is reviewed to confirm that requirements such as access control and logging were kept. This stops disruption from becoming a security breach. The plans and the test or disruption reports are the proof.", "why": "In a crisis, teams often bypass controls such as access approval or logging to restore service, and that opens a second incident. Consultants check that security is part of the continuity plan and that tests look at it.", "how": "Ask which security controls the plan names and what happens to them when systems fail over. Then ask for the last test report. Example probe: \"When you last failed over, how did you keep access control and logging running on the recovery site?\"", "q": "Does your organization plan how security controls are maintained or compensated during a disruption?", "evidence": "Business continuity plan; crisis plan; statement of compensating controls during disruption; latest continuity test report or disruption record showing security requirements were considered; covering the last annual cycle.", "good": "The plans name the security controls that must stay in place during disruption and the compensating controls where they cannot. The latest test or real disruption record shows these requirements were checked and met, with any gap logged.", "test": "Check that the continuity or crisis plans state how security controls are kept or compensated during disruption. Take the most recent continuity test or real disruption and confirm its record shows security requirements, such as access control and logging, were considered and kept. Pass if both the plan content and the test record are present.", "risk": "Controls are dropped in a crisis, exposing systems and data when the organization is weakest.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.29", "ref": "Annex A.5.29", "atom": "ISO.A5.29-a", "text": "Plan how security controls are kept, or compensated, during a disruption.", "match": "equal", "cov": "full", "reason": "Same ask: security maintained during disruption.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.29", "ref": "Annex A.5.29", "atom": "ISO.A5.29-b", "text": "Show that continuity tests or real disruptions considered and kept security requirements in place.", "match": "equal", "cov": "full", "reason": "Test evidence of security during disruption is the control's proof.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.04", "ref": "RC.RP-04", "atom": "NIST.RC.RP.04-b", "text": "The organization defines how operations run right after an incident, with cybersecurity risk taken into account.", "match": "req_smaller", "cov": "full", "reason": "Planning how security controls are maintained during disruption covers post-incident operating norms.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-RES-02", "title": "Recovery objectives and plans", "domain": "RES", "theme": "Organizational", "goal": "The organization sets recovery time and recovery point objectives for critical IT services from an impact analysis and keeps recovery plans for them.", "owner": "Business Continuity Manager", "imp": "high", "origin": "iso", "note": "Split from ICT readiness record: objectives and plans. Testing (RES-03) has a different test.", "statement": "Recovery time and recovery point objectives are set for each critical IT service from a business impact analysis, and a recovery plan is kept for each of those services. The objectives and plans are updated when the analysis changes. This makes sure recovery work is aimed at what the business can least afford to lose. The impact analysis, the objectives table and the recovery plans are the proof.", "why": "Without objectives drawn from business impact, recovery effort goes to the wrong systems and nobody knows what good recovery looks like. Consultants check that objectives and plans exist for every critical service.", "how": "Ask for the list of critical services and the recovery time and recovery point set for each, then ask where those numbers came from. Example probe: \"How did you decide your payments platform must be back within that time, and where is the plan for doing it?\"", "q": "Does your organization base recovery objectives and recovery plans for critical IT services on an impact analysis?", "evidence": "Business impact analysis; table of recovery time and recovery point objectives per critical service; disaster recovery plans for the critical services; covering the last annual cycle.", "good": "An impact analysis identifies the critical services and sets recovery time and recovery point objectives for each. Every critical service has a recovery plan that matches those objectives, with an owner and a review date.", "test": "Obtain the critical service list, the impact analysis and the objectives table, and confirm each critical service has objectives traced to the analysis. Confirm a recovery plan exists for each critical service and was reviewed in the last cycle. Pass if every critical service has objectives and a plan.", "risk": "Recovery is slow and misdirected because nobody has agreed how fast each service must return.", "applies": "", "type": "corrective", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.30", "ref": "Annex A.5.30", "atom": "ISO.A5.30-a", "text": "Define recovery time and recovery point objectives for critical IT services from an impact analysis.", "match": "equal", "cov": "full", "reason": "Objectives derived from impact analysis are the control's first element.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A5.30", "ref": "Annex A.5.30", "atom": "ISO.A5.30-b", "text": "Maintain recovery plans for the critical services.", "match": "equal", "cov": "full", "reason": "Recovery plans are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.04", "ref": "GV.OC-04", "atom": "NIST.GV.OC.04-b", "text": "The organization sets resilience objectives for each critical service.", "match": "equal", "cov": "full", "reason": "Recovery objectives for critical services are the control's core.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.ID.IM.04", "ref": "ID.IM-04", "atom": "NIST.ID.IM.04-b", "text": "The organization maintains other operational cybersecurity plans, such as business continuity and disaster recovery.", "match": "req_smaller", "cov": "full", "reason": "Keeping recovery plans for critical services covers continuity and disaster recovery plans.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.03", "ref": "PR.IR-03", "atom": "NIST.PR.IR.03-a", "text": "The organization defines resilience requirements, such as availability and recovery targets, for critical systems.", "match": "req_smaller", "cov": "full", "reason": "Recovery objectives for critical services are resilience requirements.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.02", "ref": "RC.RP-02", "atom": "NIST.RC.RP.02-a", "text": "Recovery plans set criteria for selecting and prioritizing recovery actions.", "match": "req_smaller", "cov": "full", "reason": "Recovery plans for critical services set the order and criteria for recovery actions.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.04", "ref": "RC.RP-04", "atom": "NIST.RC.RP.04-a", "text": "The organization uses a business impact analysis to set the restoration order of critical functions.", "match": "req_smaller", "cov": "full", "reason": "Objectives and plans derived from an impact analysis set the restoration order.", "primary": true, "rem": "", "imm": ""}], "nrec": 6, "r2": ""}, {"id": "UC-RES-03", "title": "Recovery plan testing", "domain": "RES", "theme": "Organizational", "goal": "The organization tests its IT recovery plans at least yearly, compares results with the recovery objectives and acts on gaps.", "owner": "Business Continuity Manager", "imp": "high", "origin": "iso", "note": "Split from ICT readiness record.", "statement": "IT recovery plans are tested at least yearly. After each test, the results are compared with the recovery objectives, and any gap is logged with an owner and a due date. This shows whether recovery works in practice and drives fixes before a real outage. The test reports and the gap actions are the proof.", "why": "A recovery plan that has never been run usually fails the first time it is needed. Consultants look for test results measured against the objectives and for gaps that were actually closed.", "how": "Ask for the last recovery test, how long it took compared with the objective, and what was fixed afterward. Example probe: \"What was the actual recovery time in your last test, and what did you change because of it?\"", "q": "Does your organization test its IT recovery plans, compare results with the recovery objectives and act on the gaps?", "evidence": "Recovery test plans and reports; comparison of test results to recovery time and recovery point objectives; gap action log with status; covering the last annual cycle.", "good": "Each critical service's recovery plan was tested within the last year. The report compares actual recovery time and data loss with the objectives and lists gaps, and the gaps have owners, dates and a closed status.", "test": "Take the critical services and confirm each recovery plan was tested within the last year. For the latest test reports check that results are compared with the objectives and that every gap has an action. Pass if all sampled plans were tested on schedule, compared with objectives and gaps are being actioned.", "risk": "Recovery plans fail in a real outage because they were never proven or their gaps were never fixed.", "applies": "", "type": "detective", "freq": "annual", "ks": "base: IT recovery plans tested at least yearly", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A5.30", "ref": "Annex A.5.30", "atom": "ISO.A5.30-c", "text": "Test the recovery plans, compare results with the objectives and act on gaps.", "match": "equal", "cov": "full", "reason": "Testing against objectives is the whole of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.02", "ref": "RC.RP-02", "atom": "NIST.RC.RP.02-c", "text": "The organization tests recovery actions on a regular basis.", "match": "equal", "cov": "full", "reason": "Testing IT recovery plans and acting on gaps is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-RES-04", "title": "Backup operation", "domain": "RES", "theme": "Technological", "goal": "The organization sets a backup policy covering scope, frequency, retention, storage and protection, runs backups to it and investigates failures.", "owner": "Business Continuity Manager", "imp": "high", "origin": "iso", "note": "Split from backup record: operation. Restore testing (RES-05) has a different test.", "statement": "A backup policy sets scope, frequency, retention, storage location and protection, including offsite or isolated copies. Backups run as the policy requires, and every failure is investigated. This keeps recoverable copies of data available after loss or attack. The backup policy and the backup job logs are the proof.", "why": "Backups that are incomplete, unprotected or silently failing are discovered only when data is already lost. Consultants check that the policy is specific and that failures are acted on.", "how": "Ask to see the policy and a month of job logs, and ask how failures reach someone. Example probe: \"Show me the last failed backup job and what was done about it.\"", "q": "Does your organization run backups in line with a policy that sets how, how often and where data is backed up?", "evidence": "Backup policy; backup job logs; failure tickets or investigation records; evidence of offsite or isolated backup copies and their protection; covering the last annual cycle.", "good": "The policy states what is backed up, how often, how long copies are kept, where they are stored and how they are protected from tampering. Job logs show backups ran on schedule and every failure has a ticket and a fix.", "test": "Check the policy sets scope, frequency, retention, storage location, offsite or isolated copies and protection. Sample backup job logs across the review period and confirm they ran as the policy requires and failures have investigation records. Pass if the policy is complete and sampled jobs match it.", "risk": "Data cannot be recovered after loss, deletion or ransomware because backups are missing, stale or corrupted.", "applies": "", "type": "corrective", "freq": "continuous", "ks": "", "fws": ["dpdpa", "iso27001", "nist_csf"], "sources": [{"fw": "dpdpa", "rec": "CH2.SECURITY.1", "ref": "Section 8(5)", "atom": "CH2.SECURITY.1-a", "text": "Implement reasonable technical safeguards to protect personal data and prevent breaches.", "match": "overlap", "cov": "partial", "reason": "Backups let processing continue after loss of personal data; the standard backup control covers this without anything extra.", "primary": false, "rem": "", "imm": "Personal data backups fall inside the standard backup scope; nothing specific is left."}, {"fw": "iso27001", "rec": "ISO.A8.13", "ref": "Annex A.8.13", "atom": "ISO.A8.13-a", "text": "Set a backup policy covering scope, frequency, retention, location and protection.", "match": "equal", "cov": "full", "reason": "The backup policy is the control's design.", "primary": true, "rem": "", "imm": ""}, {"fw": "iso27001", "rec": "ISO.A8.13", "ref": "Annex A.8.13", "atom": "ISO.A8.13-b", "text": "Run backups as the policy requires and investigate failures.", "match": "equal", "cov": "full", "reason": "Backup runs and failure follow-up are in the control goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.11", "ref": "PR.DS-11", "atom": "NIST.PR.DS.11-a", "text": "The organization sets a backup policy covering scope, frequency and retention.", "match": "equal", "cov": "full", "reason": "A backup policy with scope, frequency and retention is the same ask.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.11", "ref": "PR.DS-11", "atom": "NIST.PR.DS.11-b", "text": "The organization runs backups at the defined frequency.", "match": "req_smaller", "cov": "full", "reason": "Running backups to the policy and investigating failures is in the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.11", "ref": "PR.DS-11", "atom": "NIST.PR.DS.11-c", "text": "The organization keeps at least one backup copy offline, immutable or in a separate location.", "match": "req_smaller", "cov": "full", "reason": "The control sets storage and protection of backups, which covers an offline or separate copy.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.11", "ref": "PR.DS-11", "atom": "NIST.PR.DS.11-d", "text": "The organization encrypts backups and limits access to them.", "match": "req_smaller", "cov": "full", "reason": "Protection of backups covers encryption and restricted access.", "primary": false, "rem": "", "imm": ""}], "nrec": 3, "r2": ""}, {"id": "UC-RES-05", "title": "Restore testing", "domain": "RES", "theme": "Technological", "goal": "The organization tests restoring backups at the frequency its policy sets and records the results.", "owner": "Business Continuity Manager", "imp": "high", "origin": "iso", "note": "Split from backup record.", "statement": "Restore tests run at the frequency set in the backup policy, and each result is recorded. Each test restores real backups from critical systems and confirms the data comes back usable. This proves that backups can actually be restored. The restore test records are the proof.", "why": "Many organizations find that backups are unreadable only when they try to restore them in an emergency. Consultants check that restores are tested on the policy schedule and that results are recorded.", "how": "Ask for the policy's restore test frequency and the records of the most recent tests. Example probe: \"When did you last restore a production backup, and what did you check afterward?\"", "q": "Does your organization test restoring backups at the frequency its policy sets and record the results?", "evidence": "Backup policy section setting the restore test frequency; restore test records with date, system, result and any follow-up; covering the last annual cycle.", "good": "The policy sets how often restores are tested and which systems are covered. Records show restores happened on schedule, the data was checked as usable and any failure was fixed and retested.", "test": "Read the restore test frequency in the backup policy. Check the restore test records for the review period and confirm tests were done at that frequency and the results are recorded. Pass if every scheduled restore test has a record and failures were followed up.", "risk": "Backups turn out to be unusable at the moment they are needed.", "applies": "", "type": "detective", "freq": "ad_hoc", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.13", "ref": "Annex A.8.13", "atom": "ISO.A8.13-c", "text": "Perform and record restore tests at the set frequency.", "match": "equal", "cov": "full", "reason": "Restore testing is the whole of this control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.DS.11", "ref": "PR.DS-11", "atom": "NIST.PR.DS.11-e", "text": "The organization tests restoring from backups and records the result.", "match": "equal", "cov": "full", "reason": "Testing restores and recording results is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-RES-06", "title": "Redundancy for critical systems", "domain": "RES", "theme": "Technological", "goal": "The organization defines availability requirements for critical systems and documents the redundancy that meets them, leaving no single point of failure.", "owner": "Business Continuity Manager", "imp": "medium", "origin": "iso", "note": "Split in round 2: failover testing moved to UC-RES-07.", "statement": "Availability requirements are defined for critical systems, and the redundancy that meets them is documented, for example multi-zone deployment or failover links. The design leaves no single point of failure for those systems. This keeps critical services running when a component fails. The availability requirements and the redundancy design are the proof.", "why": "A critical service built on one component goes down with that component. Consultants check that the design matches the stated availability need and that no single point of failure remains.", "how": "Ask which systems must not go down and how each is built to survive the loss of one component. Then ask to see the design. Example probe: \"If the main server for this system failed right now, what would keep the service running?\"", "q": "Does your organization document the redundancy that meets the availability requirements of its critical systems?", "evidence": "Availability requirements for critical systems; architecture diagram or redundancy design document showing no single point of failure; covering the last annual cycle.", "good": "Availability requirements are set for each critical system. The documented design uses redundancy so that no single component failure takes the system down. The design is current and matches how the systems are actually built.", "test": "Take the list of critical systems and sample a number of them. For each, confirm availability requirements are defined and read the architecture or redundancy design. Pass if every sampled system has defined requirements and a documented design that meets them with no single point of failure.", "risk": "A single component failure takes a critical service offline for longer than the business can tolerate.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.14", "ref": "Annex A.8.14", "atom": "ISO.A8.14-a", "text": "Define availability requirements for critical systems and document the redundancy that meets them.", "match": "equal", "cov": "full", "reason": "Same ask: redundancy to meet availability.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.03", "ref": "PR.IR-03", "atom": "NIST.PR.IR.03-b", "text": "The organization designs critical systems without single points of failure, using redundancy or failover.", "match": "equal", "cov": "full", "reason": "Building redundancy into processing facilities is the same ask.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "Split (D11): narrowed to redundancy for critical systems; the other half is now UC-RES-07."}, {"id": "UC-RES-07", "title": "Failover testing", "domain": "RES", "theme": "Technological", "goal": "The organization tests failover of critical systems, or observes it in a real event, and compares the results with the availability requirements.", "owner": "Business Continuity Manager", "imp": "medium", "origin": "iso", "note": "Split from UC-RES-06 in round 2 so it has its own test.", "statement": "Failover of redundant components is tested at least yearly, or confirmed from a real event. The results are compared with the defined availability requirements, and any shortfall is recorded. This shows that redundancy works when a component fails. The test records or event reports are the proof.", "why": "Redundancy that was never exercised often fails when a component actually breaks. Consultants look for evidence that failover has been seen to work and met the stated need.", "how": "Ask when failover last happened and how the result was judged against the availability need. Ask for the record. Example probe: \"When did a standby component last take over, and was it planned or a real failure?\"", "q": "Does your organization test failover of its critical systems and compare the results with availability requirements?", "evidence": "Failover test plans and results; real event reports showing failover occurred; comparison of results with availability requirements; covering the last annual cycle.", "good": "Failover was tested within the last year, or observed in a real event, and worked as designed. The result is written up and compared with the availability requirements, and gaps are tracked to closure.", "test": "Take the failover test records and any real event reports from the last year for critical systems. Confirm each shows failover worked and that the result was compared with the availability requirements. Pass if a successful failover is on record within the last year and its result is compared with the requirements.", "risk": "Redundancy fails on the day it is needed because it was never tested against the availability requirement.", "applies": "", "type": "detective", "freq": "annual", "ks": "base: failover tested at least yearly", "fws": ["iso27001", "nist_csf"], "sources": [{"fw": "iso27001", "rec": "ISO.A8.14", "ref": "Annex A.8.14", "atom": "ISO.A8.14-b", "text": "Test failover at least yearly or observe it in a real event.", "match": "equal", "cov": "full", "reason": "Same ask: failover tested or observed.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.PR.IR.03", "ref": "PR.IR-03", "atom": "NIST.PR.IR.03-c", "text": "The organization tests failover or resilience and compares results with the requirements.", "match": "req_smaller", "cov": "full", "reason": "Testing failover and comparing results with requirements is the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "New: split from UC-RES-06 (D11). Failover testing; the yearly test setting moved here."}, {"id": "UC-RES-40", "title": "Critical service identification", "domain": "RES", "theme": "", "goal": "The organization identifies the services that customers and other outside parties depend on, decides which are critical by written criteria and tells those parties what it commits to.", "owner": "Business Continuity Manager", "imp": "high", "origin": "nist", "note": "NIST-only. Input to recovery objectives in UC-RES-02.", "statement": "The services that customers and other outside parties depend on are listed, and written criteria decide which are critical. Resilience objectives are set for each critical service, and the critical services and their objectives are shared with the parties that rely on or deliver them, for example through service agreements or a distributed continuity plan. The list is reviewed on a defined cycle. This keeps recovery effort aimed at what outsiders cannot do without.", "why": "If the organization has never said which services are critical, recovery priorities are guesses and customers promised one thing get another. Consultants look for written criteria and proof that the commitments reached outside parties.", "how": "Ask for the list of services customers depend on and how criticality was decided. Then ask where customers and key suppliers are told what is promised. Example probe: \"Which three services could you least afford to lose, who decided that and by what rule, and where do your customers see the objective?\"", "q": "Does your organization decide which services outside parties depend on are critical, using written criteria?", "evidence": "Register of services external parties depend on with criticality marked; written criticality criteria or impact analysis method; resilience objectives for each critical service; service agreements, customer agreements or continuity plan distribution records showing communication to relying and delivering parties; covering the current version and last annual cycle.", "good": "A register lists the services outsiders rely on, marks which are critical and cites the written criteria used. Resilience objectives are set for each critical service. Agreements or distribution records show the objectives reached the parties that rely on or deliver those services.", "test": "Obtain the register and the criteria and confirm services are marked critical by those criteria, with objectives set for each. Sample customer or supplier agreements or distribution records and confirm the critical services or objectives were communicated. Pass if the register, criteria and objectives exist and communication is evidenced.", "risk": "Critical services are not defined, so recovery priorities are arbitrary and outside parties get no clear commitments.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.OC.04", "ref": "GV.OC-04", "atom": "NIST.GV.OC.04-a", "text": "The organization identifies the services external parties depend on and sets criteria for which of them are critical.", "match": "equal", "cov": "full", "reason": "No base control identifies the services outsiders depend on or sets criticality criteria.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.04", "ref": "GV.OC-04", "atom": "NIST.GV.OC.04-c", "text": "The organization tells the relying and delivering parties about its critical services and their resilience objectives.", "match": "equal", "cov": "full", "reason": "Telling relying parties about critical services and commitments is part of the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RES-41", "title": "Dependencies of critical services", "domain": "RES", "theme": "", "goal": "The organization maps the external resources and services its critical functions depend on, ranks them, identifies single points of failure and shares the map with those responsible for continuity and risk.", "owner": "Business Continuity Manager", "imp": "high", "origin": "nist", "note": "NIST-only.", "statement": "An inventory records the external resources and services the organization's critical functions depend on, such as cloud hosting, facilities and key software providers, and the functions each supports. The dependencies are ranked by importance to critical services, and those that are single points of failure are identified. The inventory is shared with the people responsible for continuity and risk, for example through the continuity plan and risk register. This shows where one outside failure could stop the business.", "why": "Hidden dependencies and single points of failure turn a supplier outage into a business outage. Consultants check that dependencies are ranked and that the dependency map has actually been shared for continuity and risk planning.", "how": "Ask for the list of outside services each critical function needs and which of them have no alternative. Then ask where it is referenced in continuity and risk records. Example probe: \"If your main hosting provider failed tomorrow, which functions stop, and where is that written down?\"", "q": "Does your organization keep a ranked map of the external services its critical functions depend on?", "evidence": "Inventory of external dependencies mapped to business functions; ranking of dependencies by importance to critical services; list of single points of failure; continuity plan or risk register entries referencing the dependencies; covering the current version and last annual cycle.", "good": "An inventory ties each outside resource to the functions it supports and ranks them by importance. Single points of failure are named in writing. The continuity plan or risk register references the map, and a record shows the map was shared for continuity and risk planning.", "test": "Obtain the inventory and confirm it links external dependencies to critical functions, ranks them and names single points of failure. Check that the continuity plan or risk register references the dependency information. Pass if the inventory is complete, ranked, flags single points of failure and has been shared for continuity and risk planning.", "risk": "Single points of failure outside the organization go unseen until one fails and critical services stop.", "applies": "", "type": "preventive", "freq": "annual", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.GV.OC.05", "ref": "GV.OC-05", "atom": "NIST.GV.OC.05-a", "text": "The organization inventories the external resources and services it relies on and the functions they support.", "match": "equal", "cov": "full", "reason": "No base control maps the external resources and services that critical functions depend on.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.05", "ref": "GV.OC-05", "atom": "NIST.GV.OC.05-b", "text": "The organization identifies and ranks dependencies, including single points of failure, by importance to critical services.", "match": "equal", "cov": "full", "reason": "Finding and ranking single points of failure among dependencies is in the slot's goal.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.GV.OC.05", "ref": "GV.OC-05", "atom": "NIST.GV.OC.05-c", "text": "The organization shares dependency information with those responsible for continuity and risk.", "match": "equal", "cov": "full", "reason": "Sharing dependency information with continuity and risk owners is in the slot's goal.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-RES-42", "title": "Integrity checks on backups before restore", "domain": "RES", "theme": "", "goal": "The organization checks backups and other restoration assets for integrity and compromise before using them and records the checks.", "owner": "Business Continuity Manager", "imp": "high", "origin": "nist", "note": "NIST-only. Split in round 2: verifying restored systems moved to UC-RES-43.", "statement": "Backups and other restoration assets are checked for integrity and compromise before they are used, for example by a malware scan or checksum. The recovery procedure requires these checks, and the results are recorded before restoring. This prevents restoring corrupted or infected data into production. The recovery procedure and the integrity check records are the proof.", "why": "Restoring an infected or corrupted backup can bring the attack back or deliver unusable data. Consultants test that the check happens before the restore, beyond proving that a restore technically works.", "how": "Ask what is checked on a backup before it is restored and where the result is recorded. Then ask for the records from a recent restore test or incident. Example probe: \"Before you restored last time, how did you know the backup was clean?\"", "q": "Does your organization check backups for integrity and compromise before restoring them?", "evidence": "Recovery procedure requiring integrity and compromise checks before use; restore test or recovery records showing scan or checksum results before restore; covering the last annual cycle.", "good": "The recovery procedure requires backups and other restoration assets to be checked for integrity and compromise before use. Records show the checks ran before each restore and what they found.", "test": "Read the recovery procedure and confirm it requires checks before restoring. Sample restore tests and recoveries from the review period and confirm each has recorded integrity check results from before the restore. Pass if the requirement exists and every sampled restore shows a recorded check beforehand.", "risk": "Compromised or corrupt backups are restored into production, reinfecting systems or returning bad data.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.RC.RP.03", "ref": "RC.RP-03", "atom": "NIST.RC.RP.03-a", "text": "The recovery procedure requires checking backups and other restoration assets for integrity and compromise before use.", "match": "equal", "cov": "full", "reason": "No base control requires integrity checks on backups before restoring from them.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.03", "ref": "RC.RP-03", "atom": "NIST.RC.RP.03-b", "text": "The organization performs and records those integrity checks before restoring.", "match": "equal", "cov": "full", "reason": "Performing those checks and recording results is the slot's test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": "Split (D11): narrowed to backups checked before restore; the other half is now UC-RES-43."}, {"id": "UC-RES-43", "title": "Restored systems verified before return to production", "domain": "RES", "theme": "", "goal": "The organization checks restored systems for integrity and confirms normal operation before returning them to production.", "owner": "Business Continuity Manager", "imp": "high", "origin": "nist", "note": "NIST-only. Split from UC-RES-42 in round 2 so it has its own test.", "statement": "Restored systems are checked for integrity before they return to production, for example by an indicator scan. Normal operation is confirmed and recorded for each system, and a sign-off is recorded before it returns to production, in the agreed restoration priority order. The recovery procedure requires these steps. The recovery procedure and the post-restore verification records are the proof.", "why": "A restored system that is returned without checks can still be compromised or not working properly. Consultants look for recorded verification and a defined restoration order.", "how": "Ask what is checked on a system after it is restored and how the order of restoration is decided. Then ask for the records from a recent recovery. Example probe: \"After the last restore, what did you check before the system went back into use?\"", "q": "Does your organization verify restored systems and confirm normal operation before returning them to production?", "evidence": "Recovery procedure requiring post-restore checks and confirmation of normal operation; restoration priority order; post-restore verification records; recovery or incident records; covering the last annual cycle.", "good": "The procedure requires restored assets to be checked for integrity and normal operation to be confirmed and signed off before production use. Records show each restored system was verified and signed off, and that restoration followed the priority order.", "test": "Read the recovery procedure and confirm it requires post-restore checks, confirmation of normal operation and sign-off. Sample recoveries from the review period and confirm each restored system has a recorded integrity check, recorded confirmation of normal operation and a recorded sign-off, in the agreed priority order. Pass if the requirement exists and every sampled recovery shows all three records in order.", "risk": "Compromised or malfunctioning systems return to production unnoticed, or critical functions come back in the wrong order.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["nist_csf"], "sources": [{"fw": "nist_csf", "rec": "NIST.RC.RP.04", "ref": "RC.RP-04", "atom": "NIST.RC.RP.04-c", "text": "System owners confirm the return to operations after restoration in priority order.", "match": "equal", "cov": "full", "reason": "Confirming normal operation after restoration is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.05", "ref": "RC.RP-05", "atom": "NIST.RC.RP.05-a", "text": "The recovery procedure requires checking restored assets for integrity and confirming normal status before return to production.", "match": "equal", "cov": "full", "reason": "Same ask: restored assets checked before return to production.", "primary": true, "rem": "", "imm": ""}, {"fw": "nist_csf", "rec": "NIST.RC.RP.05", "ref": "RC.RP-05", "atom": "NIST.RC.RP.05-b", "text": "The organization performs those checks and the asset owner signs off on restored systems.", "match": "equal", "cov": "full", "reason": "Performing the checks and recording sign-off is the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": "New: split from UC-RES-42 (D11). Restored systems verified before return to production."}, {"id": "UC-PNC-01", "title": "Notice with each consent request", "domain": "PNC", "theme": "", "goal": "The organization gives every person a stand-alone notice before or with each consent request, stating what data is collected, for which purposes, how to withdraw consent and exercise rights, and how to complain to the regulator.", "owner": "Data Protection Officer", "imp": "critical", "origin": "dpdpa", "note": "DPDPA-only. Privacy-only.", "statement": "A stand-alone notice is shown before or together with every consent request. The notice lists the personal data collected, the purposes and what each purpose enables, how to withdraw consent and use rights, and how to complain to the Board. Each collection point is reviewed whenever it is added or changed, so that people can give informed consent. The approved notice and the consent screens are the proof.", "why": "If the notice sits only in a site footer or depends on other documents, people consent without knowing what they agree to. Consultants should check the notice at the moment of the request, not just that a privacy page exists.", "how": "Walk through each place where consent is collected, on the web, in the app and on paper, and look at what the person sees first. Check that the notice can be understood without opening anything else. Example probe: \"Show me the sign-up screen as a new customer sees it. Where is the notice, and does it say how to complain to the Board?\"", "q": "Does your organization show a stand-alone notice before or with every consent request that explains the data, the purposes, the rights and the complaint route?", "evidence": "Privacy notice; screenshots or recordings of every consent collection flow; list of consent collection points; notice approval record; covering the review period.", "good": "Every collection point presents a notice before or with the consent request. The notice itemizes the personal data, states each purpose and what it enables, explains how to withdraw consent and exercise rights, and explains how to complain to the Board. It makes sense on its own and is reviewed when a collection point changes.", "test": "List all consent collection points and sample a mix of channels, at least one web and one app or paper flow where they exist. For each, check the notice appears before or with the request and covers the data, purposes, withdrawal and rights route, and the Board complaint route. Pass if every sampled flow meets all points and the notice is readable without other documents.", "risk": "People give consent without knowing what data is taken or why, and consent given on that basis is open to challenge.", "applies": "", "type": "preventive", "freq": "per_event", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "atom": "CH2.NOTICE.1-a", "text": "Present a notice before or together with every consent request, not only in a site footer.", "match": "req_smaller", "cov": "full", "reason": "Notice timing before or with each consent request is a stated element of the notice control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "atom": "CH2.NOTICE.1-b", "text": "Itemize in the notice the personal data to be collected.", "match": "req_smaller", "cov": "full", "reason": "Itemized personal data in the notice is a stated element of the notice control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "atom": "CH2.NOTICE.1-c", "text": "State in the notice the specified purposes and the goods, services or uses each purpose enables.", "match": "req_smaller", "cov": "full", "reason": "Purposes and what each enables in the notice is a stated element of the notice control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "atom": "CH2.NOTICE.1-d", "text": "Tell the data principal in the notice how to withdraw consent and exercise their rights.", "match": "req_smaller", "cov": "full", "reason": "Withdrawal and rights routes in the notice is a stated element of the notice control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "atom": "CH2.NOTICE.1-e", "text": "Tell the data principal in the notice how to complain to the Data Protection Board.", "match": "req_smaller", "cov": "full", "reason": "Complaint route to the regulator in the notice is a stated element of the notice control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "atom": "CH2.NOTICE.1-f", "text": "Write the notice so it is understandable on its own, without reading other documents.", "match": "req_smaller", "cov": "full", "reason": "Stand-alone readability of the notice is a stated element of the notice control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PNC-02", "title": "Notice and consent in the person's language", "domain": "PNC", "theme": "", "goal": "The organization offers each notice and consent request in English or in the person's choice of another officially listed language.", "owner": "Data Protection Officer", "imp": "medium", "origin": "dpdpa", "note": "Privacy-only. Number of languages is not settled by the text.", "statement": "Every notice and consent request can be read in English or in the person's choice of another officially listed language. The language options and their translations are kept current whenever a notice or consent screen changes. This lets people understand what they agree to in a language they use. The language selector and the translated texts are the proof.", "why": "A notice that people cannot read in their own language does not make their consent informed. Consultants should look for a working language choice, not only a translated policy page.", "how": "Ask which languages are offered and how a person picks one at the consent screen. Ask who keeps translations aligned when the English text changes. Example probe: \"Open the consent screen and switch it to Hindi. Does the notice change as well, or only the button labels?\"", "q": "Does your organization offer each notice and consent request in English or in the person's choice of another officially listed language?", "evidence": "Language selector screenshots for each consent flow; translated notice and consent texts; translation review or approval record; covering the review period.", "good": "Each consent flow offers English and a choice of officially listed languages at the point of the request. Translations of the notice and the consent text match the current English text. Someone owns translation updates when wording changes.", "test": "Select a sample of consent flows and open each in English and in at least one other listed language. Check that both the notice and the consent text appear in the chosen language and match the current English wording. Pass if every sampled flow offers the choice and the translations are complete and current.", "risk": "People who do not read English cannot give informed consent, and the organization cannot show that its consent is valid for them.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.1", "ref": "Section 6(1), 6(3)", "atom": "CH2.CONSENT.1-e", "text": "Offer the consent request in English or in a language from the Eighth Schedule at the data principal's choice.", "match": "req_smaller", "cov": "full", "reason": "Offering the consent request in a language choice is the control.", "primary": false, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.1", "ref": "Section 5(1); DPDP Rules 2025 r.3", "atom": "CH2.NOTICE.1-g", "text": "Offer the notice in English or in a language from the Eighth Schedule at the data principal's choice.", "match": "req_smaller", "cov": "full", "reason": "Offering the notice in a language choice is the control.", "primary": false, "rem": "", "imm": ""}], "nrec": 2, "r2": ""}, {"id": "UC-PNC-03", "title": "Notice for previously collected data", "domain": "PNC", "theme": "", "goal": "The organization tells people about personal data collected before its current duties began, describing what it holds and why it is processed.", "owner": "Data Protection Officer", "imp": "medium", "origin": "dpdpa", "note": "Privacy-only.", "statement": "The people whose personal data was collected before the organization's current privacy duties began are identified. A notice is then sent to them as soon as reasonably practicable, describing the personal data held and the purposes it is used for. This brings older data under the same transparency as new data. The list of affected people, the notice and the dispatch log are the proof.", "why": "Data collected years ago often carries no notice and no clear consent. Consultants should check that the organization found this older population and actually contacted it, rather than assuming it is covered.", "how": "Ask how the organization identified data collected before its current duties and how many people are affected. Ask to see the notice and the record of sending it. Example probe: \"How did you find customers whose data you held before this program started, and when did their notices go out?\"", "q": "Has your organization sent a notice to people whose personal data was collected before its current privacy duties began?", "evidence": "Register or extract of people with older consented data; retrospective notice text; dispatch log with dates and channels; plan or schedule for remaining recipients; covering the period since the duties began.", "good": "The organization has identified the people whose data predates its current duties. A notice describing the data held and its purposes has been sent through suitable channels, with dates recorded. Anyone not yet reached is on a dated plan.", "test": "Obtain the list of people with older data and check how it was built. Sample recipients and trace each to a dispatch record showing date and channel. Check the notice text describes the data held and the purposes. Pass if the population is identified, the sampled recipients were notified, and the notice content is complete.", "risk": "Older data is held and used with no notice, so the organization cannot show that people were told what it holds about them.", "applies": "Applies if the organization holds personal data collected before its current privacy duties began.", "type": "corrective", "freq": "ad_hoc", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.NOTICE.2", "ref": "Section 5(2)", "atom": "CH2.NOTICE.2-a", "text": "Give data principals a notice, as soon as reasonably practicable, for personal data collected before the Act applied.", "match": "req_smaller", "cov": "full", "reason": "Giving a notice for earlier-collected data is the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.2", "ref": "Section 5(2)", "atom": "CH2.NOTICE.2-b", "text": "Describe in that notice the personal data held and the purposes it is processed for.", "match": "req_smaller", "cov": "full", "reason": "Describing the data held and purposes is the control's content test.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PNC-04", "title": "Published privacy contact", "domain": "PNC", "theme": "", "goal": "The organization publishes, in its notices and on its website or app, the contact details of the person who answers privacy queries.", "owner": "Data Protection Officer", "imp": "medium", "origin": "dpdpa", "note": "Privacy-only.", "statement": "The contact details of the person who answers privacy questions appear in every notice and are shown prominently on the website and app. The details are checked whenever the contact person changes. This gives people a working route for questions about their data. The published pages and the notices are the proof.", "why": "A privacy contact that is missing, out of date or hidden leaves people with nobody to ask, and requests stall. Consultants should test that the contact is findable and reaches a real person.", "how": "Look for the contact on the home page, in the app and in the notice shown at consent. Then test it. Example probe: \"Show me where a customer finds the privacy contact in your app, then send a test message and show me who receives it.\"", "q": "Does your organization publish the contact details of the person who answers privacy questions in its notices and prominently on its website or app?", "evidence": "Website and app screenshots showing the contact; current notice text; role or appointment record naming the contact person; sample responses to people's requests showing the contact; covering the review period.", "good": "The contact details of a named role or person appear in each notice and in a prominent place on the website and app. The details are current and the mailbox or channel is monitored. Responses to people also carry the contact.", "test": "Check the website, the app and the notice at each consent flow for the contact details. Send a test message to the published channel and confirm it reaches the named person. Sample responses to people's requests from the review period and check they include the contact. Pass if the contact is present, prominent, current and reachable.", "risk": "People cannot reach anyone about their data, questions turn into complaints, and the organization cannot show it gave a working contact.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.NOTICE.3", "ref": "Section 6(3), 8(9); DPDP Rules 2025 r.9", "atom": "CH2.NOTICE.3-a", "text": "Include in the notice the contact details of the officer who answers data principals' questions.", "match": "req_smaller", "cov": "full", "reason": "Contact details of the query handler in the notice are the control.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CH2.NOTICE.3", "ref": "Section 6(3), 8(9); DPDP Rules 2025 r.9", "atom": "CH2.NOTICE.3-b", "text": "Publish those contact details prominently on the website or app.", "match": "req_smaller", "cov": "full", "reason": "Publishing those contact details on the site or app is in the same control.", "primary": false, "rem": "", "imm": ""}], "nrec": 1, "r2": ""}, {"id": "UC-PNC-05", "title": "Consent by clear affirmative action", "domain": "PNC", "theme": "", "goal": "The organization collects consent only through a clear affirmative action by the person, without pre-selected options, silence, continued use or manipulative design.", "owner": "Data Protection Officer", "imp": "critical", "origin": "dpdpa", "note": "Privacy-only.", "statement": "Consent is collected only through a clear affirmative action by the person. Screens carry no pre-selected options, never treat silence or continued use as consent, and show accept and decline with equal prominence. Each consent flow is reviewed when it is built or changed. This keeps consent real and not manufactured by design. The approved consent designs and live screen captures are the proof.", "why": "Pre-ticked boxes and nudging screens produce consent that people never really gave. Consultants should look at the live screens, not only the approved designs.", "how": "Ask for the design standard for consent screens, then open the live flows. Check defaults, button emphasis and any wording that pushes toward accepting. Example probe: \"Open the sign-up flow. Is any box already ticked, and is the decline button as easy to see as accept?\"", "q": "Does your organization collect consent only through a clear affirmative action by the person, without pre-selected options, silence, continued use or manipulative design?", "evidence": "Consent screen design standard; dated screenshots or recordings of every live consent flow; design approval records; covering the review period.", "good": "Every consent request needs an affirmative action such as an unticked box or a clear button. No option is pre-selected, silence or continued use is never counted, and accept and decline look equally prominent. Live screens match the approved designs.", "test": "Capture or obtain dated screens for a sample of consent flows from the review period, covering each channel. Check there is an affirmative action, no pre-selected choice, no consent inferred from inactivity or continued use, and equal prominence for accept and decline. Pass if every sampled flow meets all points and matches the approved design.", "risk": "Consent is collected through defaults or pressure, so it is not valid and any processing based on it is exposed.", "applies": "", "type": "preventive", "freq": "continuous", "ks": "", "fws": ["dpdpa"], "sources": [{"fw": "dpdpa", "rec": "CH2.CONSENT.1", "ref": "Section 6(1), 6(3)", "atom": "CH2.CONSENT.1-a", "text": "Obtain consent through a clear affirmative action by the data principal, never by silence, pre-ticked boxes or continued use.", "match": "equal", "cov": "full", "reason": "Same ask: consent by a clear affirmative act, never silence or pre-ticked boxes.", "primary": true, "rem": "", "imm": ""}, {"fw": "dpdpa", "rec": "CM.GRANULAR.2", "ref": "Section 6(1)", "atom": "CM.GRANULAR.2-b", "text": "Avoid dark patterns when collecting consent.", "match": "req_smaller", "cov": "full", "reason": "No dark
