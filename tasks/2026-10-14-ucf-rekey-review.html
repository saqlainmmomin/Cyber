<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCF re-key review</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f27; --mute: #5b6472; --line: #dde1e8;
  --accent: #2455c8; --accent-ink: #ffffff;
  --ok: #1d7a46; --ok-bg: #e3f4ea; --chg: #9a5b00; --chg-bg: #fdf0d9; --rej: #b3261e; --rej-bg: #fbe4e2;
  --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e8ebf0; --mute: #9aa4b2; --line: #2d333d;
    --accent: #7ba3ff; --accent-ink: #0d1117;
    --ok: #5fd08d; --ok-bg: #173826; --chg: #f0b45a; --chg-bg: #3b2c12; --rej: #ff8a80; --rej-bg: #44211f;
    --chip: #262b34;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e8ebf0; --mute: #9aa4b2; --line: #2d333d;
  --accent: #7ba3ff; --accent-ink: #0d1117;
  --ok: #5fd08d; --ok-bg: #173826; --chg: #f0b45a; --chg-bg: #3b2c12; --rej: #ff8a80; --rej-bg: #44211f;
  --chip: #262b34;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 130px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header.top { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.bar h1 { font-size: 17px; margin: 0; }
.bar .grow { flex: 1; min-width: 160px; }
.meter { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ok); width: 0; }
.prog { font-size: 13px; color: var(--mute); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; }
nav.tabs button { border: 0; background: none; color: var(--mute); padding: 8px 12px; font: inherit; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs .n { font-size: 12px; color: var(--mute); margin-left: 4px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
section.panel[hidden] { display: none; }
h2 { font-size: 20px; margin: 8px 0 4px; }
h3 { font-size: 16px; margin: 20px 0 6px; }
p { margin: 6px 0; }
.mute { color: var(--mute); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
.card.s-approve { border-left: 5px solid var(--ok); }
.card.s-change { border-left: 5px solid var(--chg); }
.card.s-reject { border-left: 5px solid var(--rej); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.head .id { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); }
.head .t { font-weight: 600; font-size: 16px; }
.chip { display: inline-block; font-size: 12px; background: var(--chip); border-radius: 999px; padding: 1px 9px; color: var(--mute); }
.chip.crit { background: var(--rej-bg); color: var(--rej); }
.chip.high { background: var(--chg-bg); color: var(--chg); }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); margin-top: 10px; }
.q { font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
.tablewrap { overflow-x: auto; }
.dec { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin-top: 12px; }
.dec .btns { display: flex; gap: 6px; }
.dec button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.dec button[aria-pressed="true"].approve { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.dec button[aria-pressed="true"].change { background: var(--chg-bg); border-color: var(--chg); color: var(--chg); font-weight: 600; }
.dec button[aria-pressed="true"].reject { background: var(--rej-bg); border-color: var(--rej); color: var(--rej); font-weight: 600; }
.dec textarea { flex: 1; min-width: 220px; min-height: 34px; font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin: 10px 0; }
.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--mute); gap: 2px; }
.filters select, .filters input { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.btn { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.domhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; margin-top: 28px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.domhead h3 { margin: 0; }
.rec { background: var(--chip); border-radius: 6px; padding: 6px 10px; margin-top: 8px; font-size: 14px; }
.flag { color: var(--chg); font-weight: 600; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.src-fw { font-weight: 600; margin-top: 8px; font-size: 13px; }
.small { font-size: 13px; }
@media (max-width: 640px) { main { padding: 12px; } .dec textarea { min-width: 100%; } }
.recblock { margin-top: 28px; }
.recblock > .head { border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.cand { background: var(--chip); border-radius: 6px; padding: 6px 10px; margin-top: 6px; font-size: 14px; }
.cand ul { margin: 4px 0 0; padding-left: 18px; }
.choices { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.choices label { display: flex; gap: 8px; align-items: baseline; font-size: 14px; cursor: pointer; }
.choices input { margin: 0; }
.tag { font-size: 12px; color: var(--ok); font-weight: 600; }
.why { font-size: 13px; color: var(--mute); margin-top: 4px; }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>UCF 1.0.0: criteria and scope re-key review</h1>
    <div class="grow">
      <div class="meter" role="progressbar" aria-label="Review progress" id="meter"><i id="meterfill"></i></div>
      <div class="prog" id="prog"></div>
    </div>
    <button class="btn" id="exportJson">Export decisions (JSON)</button>
    <button class="btn ghost" id="exportMd">Export summary (Markdown)</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>

"use strict";
const DATA = {"reviewKey": "ucf-rekey-review-1.0.0", "version": "1.0.0", "date": "2026-10-15", "counts": [{"fw": "iso27001", "total": 230, "auto": 163, "proposed": 67, "decided": 0}, {"fw": "nist_csf", "total": 348, "auto": 152, "proposed": 196, "decided": 0}, {"fw": "dpdpa", "total": 150, "auto": 68, "proposed": 82, "decided": 0}], "records": [{"id": "ISO.A5.5", "fw": "iso27001", "ref": "Annex A.5.5", "title": "Contact with authorities", "cands": [{"id": "UC-INC-04", "title": "Incident notification duties", "statement": "The people who may notify authorities and other outside parties about an incident are named, and a timeline is set for each kind of reportable event. When an incident triggers a legal or contractual duty, notification is made in time, with the date and recipient recorded. This keeps the organization out of penalties and keeps customers and regulators informed. The notification procedure and the incident notification records are the proof.", "asks": ["b: Define who may contact authorities and within what timelines for reportable events. (full)"], "primary": false}, {"id": "UC-INC-07", "title": "Contact with authorities", "statement": "A current list is kept of the authorities the organization may need to contact, such as the data protection regulator, the national incident response team, law enforcement and the sector regulator. The list says when each is contacted. It is verified at least yearly so that contacts are right when an incident happens. The contact list and its review record are the proof.", "asks": ["a: Keep a current list of relevant authorities and verify it regularly. (full)"], "primary": true}], "crits": [{"id": "ISO.A5.5.TC1", "stmt": "A current contact list names the authorities to contact (e.g. data protection regulator, CERT-In or national CERT, law enforcement, sector regulator) and when.", "kind": "design", "hint": "breach_procedure (authority contact list)", "prop": "UC-INC-07", "reason": "best word match via atom ISO.A5.5-a (authority, current, list, sector)"}, {"id": "ISO.A5.5.TC2", "stmt": "The incident procedure states who is authorised to contact authorities and within what timelines for reportable events.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-04", "reason": "best word match via atom ISO.A5.5-b (timelin, reportable, authority, contact)"}, {"id": "ISO.A5.5.TC3", "stmt": "The authority contact list has been verified or updated within the last 12 months.", "kind": "operating", "hint": "breach_procedure (contact list review date)", "prop": "UC-INC-07", "reason": "best word match via atom ISO.A5.5-a (authority, verify, list, contact)"}]}, {"id": "ISO.A5.10", "fw": "iso27001", "ref": "Annex A.5.10", "title": "Acceptable use of information and other associated assets", "cands": [{"id": "UC-AST-02", "title": "Acceptable use rules acknowledged", "statement": "Written rules state what use of information and assets is permitted and prohibited, and that use of the organization's systems is monitored. Users acknowledge the rules when they join and again on a defined cycle. Signed acknowledgement records are the proof.", "asks": ["a: Set rules for acceptable and prohibited use of information and assets. (full)", "c: Have users acknowledge the rules. (full)"], "primary": true}, {"id": "UC-AST-13", "title": "Handling rules by classification level", "statement": "Handling rules are documented for each information classification level. The rules cover storage, sharing, transport and disposal, and differ as the level of sensitivity differs. The approved handling procedure is the proof.", "asks": ["b: Document how information is handled at each classification level. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.10.TC1", "stmt": "An acceptable use policy states permitted and prohibited uses of information and assets.", "kind": "design", "hint": "security_policy (acceptable use policy)", "prop": "UC-AST-02", "reason": "best word match via atom ISO.A5.10-a (acceptable, prohibit, asset, use)"}, {"id": "ISO.A5.10.TC2", "stmt": "Handling procedures state how information is to be handled at each classification level (storage, sharing, transport, disposal).", "kind": "design", "hint": "security_policy (information handling procedure); asset_inventory (classification scheme)", "prop": "UC-AST-13", "reason": "best word match via atom ISO.A5.10-b (classific, level, handl, inform)"}, {"id": "ISO.A5.10.TC3", "stmt": "Users have acknowledged the acceptable use rules (e.g. at onboarding or annually).", "kind": "operating", "hint": "security_policy (acknowledgement records); hr_security", "prop": "UC-AST-02", "reason": "best word match via atom ISO.A5.10-a (acceptable, use, rule, acknowledg)"}]}, {"id": "ISO.A5.17", "fw": "iso27001", "ref": "Annex A.5.17", "title": "Authentication information", "cands": [{"id": "UC-IAM-03", "title": "Credential issue, reset and revocation", "statement": "Issuing, resetting and revoking of authentication credentials such as passwords, tokens and keys are controlled by a procedure, with identity verified before any reset. Users receive written guidance on keeping credentials confidential, for example not sharing them and reporting suspected compromise. The procedure and the user guidance are the proof.", "asks": ["a: Control issuing, resetting and revoking of authentication information, verifying identity before reset. (full)", "b: Give users written guidance on keeping authentication information confidential. (full)"], "primary": true}, {"id": "UC-IAM-13", "title": "Default credentials changed on installation", "statement": "Default vendor credentials are changed when systems and devices are installed, before they go into use. Build checklists or configuration baselines require this step and show that it was done. This closes a well-known way into new systems. The build checklists and configuration baselines are the proof.", "asks": ["c: Change default vendor credentials on installation. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.17.TC1", "stmt": "A procedure governs issuing, resetting and revoking authentication information (passwords, tokens, keys), including identity verification before resets.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-03", "reason": "best word match via atom ISO.A5.17-a (resett, reset, revok, authentic)"}, {"id": "ISO.A5.17.TC2", "stmt": "Users are given written guidance on keeping authentication information confidential (e.g. no sharing, use of a password manager, reporting compromise).", "kind": "design", "hint": "security_policy; training_records", "prop": "UC-IAM-03", "reason": "best word match via atom ISO.A5.17-b (guidance, confidential, authentic, user)"}, {"id": "ISO.A5.17.TC3", "stmt": "Default vendor credentials are changed on installation, as shown by configuration baselines or build checklists.", "kind": "operating", "hint": "configuration_baselines", "prop": "UC-IAM-13", "reason": "best word match via atom ISO.A5.17-c (default, vendor, credential, install)"}]}, {"id": "ISO.A5.18", "fw": "iso27001", "ref": "Annex A.5.18", "title": "Access rights", "cands": [{"id": "UC-IAM-04", "title": "Access provisioning", "statement": "Access is requested and approved by someone with the authority to grant it before it is granted or changed, and in line with the access rules. Access is provisioned only against an approved request. Request tickets with approvals are the proof.", "asks": ["a: Require access to be requested and approved before it is provisioned or changed. (full)"], "primary": true}, {"id": "UC-IAM-05", "title": "Periodic access review", "statement": "Access rights for in-scope systems are reviewed on a defined cycle, and access that is no longer appropriate is removed. Each review records what was checked, the decisions and the removals, and completion of removals is confirmed. Completed review records are the proof.", "asks": ["b: Review access at the defined frequency and remove inappropriate access. (full)"], "primary": false}, {"id": "UC-IAM-06", "title": "Access removal on leaving or role change", "statement": "Access is removed or adjusted when people leave or change role, within the timeframe the policy sets. Each leaver or move is notified from the HR process, and the time access ended is recorded. Leaver lists and identity provider logs are the proof.", "asks": ["c: Remove or adjust access within the set timeframe when people leave or change role. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.18.TC1", "stmt": "The access policy requires access to be requested and approved before provisioning, and defines the frequency of access reviews.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-04", "reason": "best word match via atom ISO.A5.18-a (provision, request, approv, before)"}, {"id": "ISO.A5.18.TC2", "stmt": "For a sample of new or changed access in the period, an approval record exists before the access was granted.", "kind": "operating", "hint": "access_control_policy (access request tickets)", "prop": "UC-IAM-04", "reason": "best word match via atom ISO.A5.18-a (request, chang, before, acces)"}, {"id": "ISO.A5.18.TC3", "stmt": "Access reviews were completed at the defined frequency for in-scope systems, with inappropriate access removed.", "kind": "operating", "hint": "access_control_policy (user access review records)", "prop": "UC-IAM-05", "reason": "best word match via atom ISO.A5.18-b (inappropriate, frequency, acces, defin)"}, {"id": "ISO.A5.18.TC4", "stmt": "For a sample of leavers, access was removed within the timeframe set by policy.", "kind": "operating", "hint": "access_control_policy; HR leaver list; identity provider logs", "prop": "UC-IAM-06", "reason": "best word match via atom ISO.A5.18-c (timeframe, set, acces, leaver)"}]}, {"id": "ISO.A5.19", "fw": "iso27001", "ref": "Annex A.5.19", "title": "Information security in supplier relationships", "cands": [{"id": "UC-SUP-01", "title": "Supplier inventory and risk tiering", "statement": "How suppliers are identified, rated for security risk and selected is defined. A register is kept of every supplier with access to the organization's information or systems, each with a risk rating, and it is reviewed on a defined cycle. This shows which suppliers matter most and where to focus oversight.", "asks": ["a: Define how suppliers are identified, risk-rated and selected. (full)", "b: Keep a register of suppliers with access to information or systems, each with a risk rating. (full)"], "primary": true}, {"id": "UC-SUP-02", "title": "Supplier due diligence", "statement": "A security assessment of each supplier is completed before the contract is signed or access is granted, and the result is kept. The depth of the assessment follows the supplier's risk rating. This lets the organization decline or condition a supplier that cannot meet its security needs.", "asks": ["c: Complete a security due-diligence assessment before contract signature or access. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.19.TC1", "stmt": "A supplier security policy or procedure defines how suppliers are identified, risk-rated and selected based on security risk.", "kind": "design", "hint": "supplier_security (supplier security policy)", "prop": "UC-SUP-01", "reason": "best word match via atom ISO.A5.19-a (risk-rat, select, supplier, identify)"}, {"id": "ISO.A5.19.TC2", "stmt": "A supplier register lists suppliers with access to the organisation's information or systems, with a risk rating for each.", "kind": "operating", "hint": "supplier_security (supplier register)", "prop": "UC-SUP-01", "reason": "best word match via atom ISO.A5.19-b (rating, register, supplier, inform)"}, {"id": "ISO.A5.19.TC3", "stmt": "For a sample of suppliers onboarded in the period, a security due-diligence assessment was completed before contract signature or access.", "kind": "operating", "hint": "supplier_security (due-diligence records)", "prop": "UC-SUP-02", "reason": "best word match via atom ISO.A5.19-c (due-diligence, signature, contract, assessment)"}]}, {"id": "ISO.A5.23", "fw": "iso27001", "ref": "Annex A.5.23", "title": "Information security for use of cloud services", "cands": [{"id": "UC-SUP-06", "title": "Cloud service security governance", "statement": "Rules for selecting, using and managing cloud services are documented and set out how responsibility is shared between the organization and each provider. A register of cloud services is kept, and provider assurance is obtained and reviewed in the period, including assurance on environmental protection where a provider hosts equipment or data. The policy, the register and the assurance reviews prove it.", "asks": ["a: Define how cloud services are selected, used, managed and exited, including shared responsibilities. (full)", "b: Keep a register of cloud services with provider assurance reviewed in the period. (full)"], "primary": true}, {"id": "UC-SUP-07", "title": "Cloud exit plans", "statement": "An exit plan exists for each critical cloud service. It sets out how data is returned to the organization and how the provider deletes the remaining copies. The plans are kept current so the organization can leave a provider without losing data or leaving copies behind. The exit plans prove it.", "asks": ["c: Plan exit for critical cloud services, covering data return and deletion. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.23.TC1", "stmt": "A cloud services policy or procedure covers selecting, using, managing and exiting cloud services, including security requirements and the shared-responsibility split.", "kind": "design", "hint": "cloud_services; security_policy", "prop": "UC-SUP-06", "reason": "best word match via atom ISO.A5.23-a (exit, manag, cloud, select)"}, {"id": "ISO.A5.23.TC2", "stmt": "A register of cloud services in use exists, and each has provider assurance evidence (e.g. SOC 2 report, ISO certificate) reviewed in the period.", "kind": "operating", "hint": "cloud_services (register; assurance reports)", "prop": "UC-SUP-06", "reason": "best word match via atom ISO.A5.23-b (assurance, provider, cloud, register)"}, {"id": "ISO.A5.23.TC3", "stmt": "An exit plan exists for critical cloud services, covering data return and deletion.", "kind": "design", "hint": "cloud_services (exit plan)", "prop": "UC-SUP-07", "reason": "best word match via atom ISO.A5.23-c (exit, deletion, return, cloud)"}]}, {"id": "ISO.A5.24", "fw": "iso27001", "ref": "Annex A.5.24", "title": "Information security incident management planning and preparation", "cands": [{"id": "UC-INC-01", "title": "Incident management plan and roles", "statement": "A written incident management procedure runs from detection through closure, including escalation steps, investigation and the handling of personal data breaches. Each incident role is assigned to a named person with contact details, and the plan names the third parties to coordinate with during an incident and how to reach them. The procedure and the role list prove it.", "asks": ["a: Document an incident management procedure covering detection through closure. (full)", "b: Define incident roles with named people and contact details. (full)"], "primary": true}, {"id": "UC-INC-09", "title": "Incident plan communicated and exercised", "statement": "The incident plan and roles are communicated to the people who carry them out, for example by distribution, onboarding or training. The incident plan is exercised at least yearly, for example with a tabletop, so that people know what to do when an incident happens. Communication records and exercise reports prove it.", "asks": ["c: Communicate the procedure and roles and exercise the plan. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.24.TC1", "stmt": "A documented incident management procedure covers detection, reporting, triage, response, communication and closure.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-01", "reason": "best word match via atom ISO.A5.24-a (detection, closure, management, procedure)"}, {"id": "ISO.A5.24.TC2", "stmt": "Incident management roles (e.g. incident manager, response team, communications lead) are defined with named people and contact details.", "kind": "design", "hint": "breach_procedure; roles_responsibilities", "prop": "UC-INC-01", "reason": "best word match via atom ISO.A5.24-b (detail, contact, named, role)"}, {"id": "ISO.A5.24.TC3", "stmt": "The incident procedure and roles were communicated to those involved, and the plan was exercised (e.g. tabletop) in the last 12 months.", "kind": "operating", "hint": "breach_procedure (exercise records); training_records", "prop": "UC-INC-09", "reason": "best word match via atom ISO.A5.24-c (exercise, role, procedure, plan)"}]}, {"id": "ISO.A5.26", "fw": "iso27001", "ref": "Annex A.5.26", "title": "Response to information security incidents", "cands": [{"id": "UC-INC-03", "title": "Incident response and closure", "statement": "Every incident is handled under documented procedures for containment, eradication, recovery and escalation. The steps taken are recorded as the work happens, and each incident is closed only after recovery is confirmed. This limits damage and leaves a trail that shows the response was controlled. The response procedures and the incident records are the proof.", "asks": ["a: Respond under documented procedures covering containment, eradication, recovery and escalation. (full)", "b: Record the steps followed and close each incident. (full)"], "primary": true}, {"id": "UC-INC-04", "title": "Incident notification duties", "statement": "The people who may notify authorities and other outside parties about an incident are named, and a timeline is set for each kind of reportable event. When an incident triggers a legal or contractual duty, notification is made in time, with the date and recipient recorded. This keeps the organization out of penalties and keeps customers and regulators informed. The notification procedure and the incident notification records are the proof.", "asks": ["c: Notify internal and external parties, including legal and contractual notification, within the required time. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.26.TC1", "stmt": "Response procedures cover containment, eradication, recovery, escalation and notification to internal and external parties.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-03", "reason": "best word match via atom ISO.A5.26-a (eradic, containment, escal, procedur)"}, {"id": "ISO.A5.26.TC2", "stmt": "For a sample of incidents in the period, the incident record shows the documented steps were followed and the incident was closed.", "kind": "operating", "hint": "incident_log", "prop": "UC-INC-03", "reason": "best word match via atom ISO.A5.26-b (step, follow, incident, record)"}, {"id": "ISO.A5.26.TC3", "stmt": "Where an incident triggered a legal or contractual notification duty, the record shows notification was made within the required time.", "kind": "operating", "hint": "incident_log; breach_procedure; legal_register", "prop": "UC-INC-04", "reason": "best word match via atom ISO.A5.26-c (contractual, notific, legal, time)"}]}, {"id": "ISO.A5.30", "fw": "iso27001", "ref": "Annex A.5.30", "title": "ICT readiness for business continuity", "cands": [{"id": "UC-RES-02", "title": "Recovery objectives and plans", "statement": "Recovery time and recovery point objectives are set for each critical IT service from a business impact analysis, and a recovery plan is kept for each of those services. The objectives and plans are updated when the analysis changes. This makes sure recovery work is aimed at what the business can least afford to lose. The impact analysis, the objectives table and the recovery plans are the proof.", "asks": ["a: Define recovery time and recovery point objectives for critical IT services from an impact analysis. (full)", "b: Maintain recovery plans for the critical services. (full)"], "primary": true}, {"id": "UC-RES-03", "title": "Recovery plan testing", "statement": "IT recovery plans are tested at least yearly. After each test, the results are compared with the recovery objectives, and any gap is logged with an owner and a due date. This shows whether recovery works in practice and drives fixes before a real outage. The test reports and the gap actions are the proof.", "asks": ["c: Test the recovery plans, compare results with the objectives and act on gaps. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.30.TC1", "stmt": "Recovery time and recovery point objectives are defined for critical ICT services, derived from a business impact analysis.", "kind": "design", "hint": "business_continuity (BIA; RTO/RPO table)", "prop": "UC-RES-02", "reason": "best word match via atom ISO.A5.30-a (analysi, point, objectiv, impact)"}, {"id": "ISO.A5.30.TC2", "stmt": "ICT recovery or disaster recovery plans exist for the critical services.", "kind": "design", "hint": "business_continuity (DR plans)", "prop": "UC-RES-02", "reason": "best word match via atom ISO.A5.30-b (critical, recovery, servic, plan)"}, {"id": "ISO.A5.30.TC3", "stmt": "The ICT recovery plans were tested in the last 12 months and test results compared against the recovery objectives, with gaps actioned.", "kind": "operating", "hint": "business_continuity (DR test reports)", "prop": "UC-RES-03", "reason": "best word match via atom ISO.A5.30-c (gaps, objectiv, recovery, result)"}]}, {"id": "ISO.A5.33", "fw": "iso27001", "ref": "Annex A.5.33", "title": "Protection of records", "cands": [{"id": "UC-AST-07", "title": "Records retention schedule", "statement": "A records retention schedule defines record types, retention periods and storage requirements based on legal and contractual needs. Each period traces to the law or contract that drives it. The schedule is the proof.", "asks": ["a: Define record types, retention periods and storage requirements reflecting legal and contractual needs. (full)"], "primary": true}, {"id": "UC-AST-14", "title": "Protection of records", "statement": "Stored records are protected from loss, tampering and unauthorized access for their whole retention period. Protection uses access limits, immutability or backups suited to each record type. Storage settings are the proof.", "asks": ["b: Protect stored records from deletion, tampering and unauthorized access for the retention period. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.33.TC1", "stmt": "A records retention schedule defines record types, retention periods and storage requirements, reflecting legal and contractual needs.", "kind": "design", "hint": "legal_register; records retention schedule", "prop": "UC-AST-07", "reason": "best word match via atom ISO.A5.33-a (reflect, contractual, retention, storage)"}, {"id": "ISO.A5.33.TC2", "stmt": "For a sample of record types, storage settings protect them against deletion and tampering (e.g. access restrictions, immutability, backups) for the retention period.", "kind": "operating", "hint": "records retention schedule; backup; system configuration", "prop": "UC-AST-14", "reason": "best word match via atom ISO.A5.33-b (tamper, deletion, retention, protect)"}]}, {"id": "ISO.A5.34", "fw": "iso27001", "ref": "Annex A.5.34", "title": "Privacy and protection of personal information", "cands": [{"id": "UC-RSK-06", "title": "Legal and contractual requirements register", "statement": "A register of legal, regulatory and contractual requirements that bear on information security is kept, including the privacy laws and contract terms that apply to personal data processing. The register records how each is met, with an owner or control reference. It is reviewed at least every 12 months and after relevant legal change.", "asks": ["a: Identify the privacy laws and contractual terms that apply to personal data processing. (full)"], "primary": false}, {"id": "UC-RSK-08", "title": "Record of personal data processing", "statement": "A current record of personal data processing is kept for the program scope. Each entry shows what is processed and why. The record is reviewed on a defined cycle and when processing changes, and the record itself is the proof.", "asks": ["c: Keep a current record of personal data processing for the scope. (full)"], "primary": true}, {"id": "UC-RSK-11", "title": "Responsibility for privacy assigned", "statement": "Responsibility for privacy and personal data protection is assigned and recorded. The assignment is made in a document the organization maintains and is kept current as roles change. The record of the assignment is the proof.", "asks": ["b: Assign a person or role responsible for privacy and personal data protection. (full)"], "primary": false}], "crits": [{"id": "ISO.A5.34.TC1", "stmt": "A privacy or PII protection policy identifies the privacy laws and contractual terms that apply to the organisation's processing of personal data.", "kind": "design", "hint": "privacy_policy; legal_register", "prop": "UC-RSK-06", "reason": "best word match via atom ISO.A5.34-a (laws, privacy, contractual, term)"}, {"id": "ISO.A5.34.TC2", "stmt": "A person or role is responsible for privacy and PII protection (e.g. DPO or privacy lead).", "kind": "design", "hint": "privacy_policy; roles_responsibilities", "prop": "UC-RSK-11", "reason": "best word match via atom ISO.A5.34-b (privacy, responsible, person, role)"}, {"id": "ISO.A5.34.TC3", "stmt": "A current record of personal data processing (e.g. data inventory or processing register) exists for the ISMS scope.", "kind": "operating", "hint": "privacy_policy; data processing register", "prop": "UC-RSK-08", "reason": "best word match via atom ISO.A5.34-c (scope, process, current, personal); close call with UC-RSK-06"}]}, {"id": "ISO.A6.3", "fw": "iso27001", "ref": "Annex A.6.3", "title": "Information security awareness, education and training", "cands": [{"id": "UC-PPL-03", "title": "Security awareness", "statement": "A security awareness program is delivered to all personnel and relevant outside parties. It covers the security policy, each person's contribution and the consequences of non-compliance. It also covers common threats such as phishing and malicious attachments. Personnel complete it within the period the program sets, non-completers are followed up, and people are updated whenever relevant policies or procedures change. Completion reports prove it.", "asks": ["a: Define an awareness and training programme with content, audiences and frequency. (full)", "b: Have in-scope personnel complete awareness training within the set period and follow up non-completers. (full)", "d: Update personnel when relevant policies or procedures change. (full)"], "primary": true}, {"id": "UC-PPL-04", "title": "Role-based security training", "statement": "People in technical, privileged and other high-risk roles receive training matched to their duties, such as secure coding for developers. A role-based curriculum is defined, completion is tracked, and it is refreshed at least yearly for developers. Training records prove it.", "asks": ["c: Give technical and privileged roles role-specific training. (full)"], "primary": false}], "crits": [{"id": "ISO.A6.3.TC1", "stmt": "An awareness and training programme defines content, audiences (including role-specific training for technical and privileged roles) and frequency.", "kind": "design", "hint": "training_records (training programme)", "prop": "UC-PPL-03", "reason": "best word match via atom ISO.A6.3-a (programme, audienc, awarenes, train); close call with UC-PPL-04"}, {"id": "ISO.A6.3.TC2", "stmt": "Completion records show in-scope personnel completed the required awareness training within the defined period, with non-completers followed up.", "kind": "operating", "hint": "training_records (completion report)", "prop": "UC-PPL-03", "reason": "best word match via atom ISO.A6.3-b (non-completer, awarenes, train, in-scope)"}, {"id": "ISO.A6.3.TC3", "stmt": "Personnel received updates when relevant policies or procedures changed in the period.", "kind": "operating", "hint": "training_records; internal communications record", "prop": "UC-PPL-03", "reason": "best word match via atom ISO.A6.3-d (procedur, relevant, personnel, policy)"}]}, {"id": "ISO.A7.2", "fw": "iso27001", "ref": "Annex A.7.2", "title": "Physical entry", "cands": [{"id": "UC-PHY-02", "title": "Physical entry and visitor control", "statement": "Entry to each secure area is controlled through locks, badge readers or reception checks, with written rules on who may enter. Entry rules are stricter for areas holding higher-risk assets. Every visitor is recorded and escorted where the rules require. Visitor logs and access system records prove that only authorized people and recorded visitors enter.", "asks": ["a: Define entry controls and who may enter each secure area. (full)", "b: Record visitors and escort them where required. (full)"], "primary": true}, {"id": "UC-PHY-13", "title": "Physical access rights review and leaver removal", "statement": "Who holds physical access to secure areas is reviewed on a defined cycle, and any access no longer needed is removed. When a person leaves, their badges and keys are deactivated or collected and the removal is recorded. Review records and leaver removal records prove that access rights stay current.", "asks": ["c: Review physical access rights and deactivate leavers' badges. (full)"], "primary": false}], "crits": [{"id": "ISO.A7.2.TC1", "stmt": "Entry controls (e.g. badge readers, locks, reception) are defined for secure areas, with authorisation rules for who may enter.", "kind": "design", "hint": "physical_security", "prop": "UC-PHY-02", "reason": "best word match via atom ISO.A7.2-a (enter, area, entry, secure)"}, {"id": "ISO.A7.2.TC2", "stmt": "Visitor logs or access-control system records exist for the period, and visitors are recorded and escorted where required.", "kind": "operating", "hint": "physical_security (visitor logs; access system reports)", "prop": "UC-PHY-02", "reason": "best word match via atom ISO.A7.2-b (escort, visitor, requir, record)"}, {"id": "ISO.A7.2.TC3", "stmt": "Physical access rights to secure areas were reviewed in the period and leavers' badges deactivated.", "kind": "operating", "hint": "physical_security (access review records)", "prop": "UC-PHY-13", "reason": "best word match via atom ISO.A7.2-c (badg, leaver, physical, right)"}]}, {"id": "ISO.A7.10", "fw": "iso27001", "ref": "Annex A.7.10", "title": "Storage media", "cands": [{"id": "UC-AST-11", "title": "Storage media management", "statement": "Storage media are managed through acquisition, use, transport, storage and disposal according to classification and handling rules. Technical controls restrict or encrypt removable media on endpoints as the procedure requires. The media handling procedure and endpoint policy settings are the proof.", "asks": ["a: Define how storage media are acquired, used, transported and stored according to classification. (full)", "b: Restrict or encrypt removable media on endpoints in line with the procedure. (full)"], "primary": true}, {"id": "UC-AST-12", "title": "Sanitization before disposal or reuse", "statement": "Equipment and media holding data are checked, and data and licensed software are wiped or destroyed by an approved method, before disposal or reuse. Each wipe or destruction is verified, and wipe reports, destruction certificates or a disposal log are kept against the asset record.", "asks": ["c: Record media disposals, for example with destruction certificates. (full)"], "primary": false}], "crits": [{"id": "ISO.A7.10.TC1", "stmt": "A media handling procedure covers acquisition, use, transport, storage and disposal of removable and other storage media according to classification.", "kind": "design", "hint": "media_disposal", "prop": "UC-AST-11", "reason": "best word match via atom ISO.A7.10-a (accord, transport, storage, media)"}, {"id": "ISO.A7.10.TC2", "stmt": "Technical controls restrict or encrypt removable media on endpoints in line with the procedure.", "kind": "operating", "hint": "configuration_baselines; endpoint policy export", "prop": "UC-AST-11", "reason": "best word match via atom ISO.A7.10-b (removable, encrypt, line, endpoint)"}, {"id": "ISO.A7.10.TC3", "stmt": "Media disposals in the period are recorded (e.g. destruction certificates or disposal log).", "kind": "operating", "hint": "media_disposal (disposal log / certificates)", "prop": "UC-AST-12", "reason": "best word match via atom ISO.A7.10-c (certificat, disposal, destruction, media)"}]}, {"id": "ISO.A7.13", "fw": "iso27001", "ref": "Annex A.7.13", "title": "Equipment maintenance", "cands": [{"id": "UC-PHY-12", "title": "Scheduled equipment maintenance", "statement": "Maintenance requirements and schedules are defined for in-scope equipment, following supplier recommendations. Only authorized personnel carry out maintenance. Maintenance records show the work was done on schedule and by whom, which keeps equipment reliable.", "asks": ["a: Define maintenance requirements and schedules for in-scope equipment. (full)", "b1: Have maintenance performed only by authorized personnel. (full)"], "primary": true}, {"id": "UC-PHY-14", "title": "Data cleared before equipment leaves for repair", "statement": "Before equipment leaves the site for repair, sensitive information on it is cleared or the equipment is otherwise protected. Each send-off is recorded with the method used. These records prove that repair vendors do not receive readable sensitive data.", "asks": ["b2: Clear or protect sensitive information on equipment before it is sent off site for repair. (full)"], "primary": false}], "crits": [{"id": "ISO.A7.13.TC1", "stmt": "Maintenance requirements and schedules are defined for in-scope equipment, following supplier recommendations.", "kind": "design", "hint": "maintenance schedule; asset_inventory", "prop": "UC-PHY-12", "reason": "best word match via atom ISO.A7.13-a (schedul, maintenance, equipment, in-scope)"}, {"id": "ISO.A7.13.TC2", "stmt": "Maintenance records show scheduled maintenance was performed by authorised personnel, and equipment sent off-site for repair was cleared of sensitive data or protected.", "kind": "operating", "hint": "maintenance records", "prop": "UC-PHY-14", "reason": "best word match via atom ISO.A7.13-b2 (repair, sent, clear, sensitive)"}]}, {"id": "ISO.A8.7", "fw": "iso27001", "ref": "Annex A.8.7", "title": "Protection against malware", "cands": [{"id": "UC-OPS-07", "title": "Malware protection", "statement": "The malware protection required for each system type, such as endpoint detection, and email and download scanning, is defined. It is deployed and kept installed, active and up to date on in-scope systems, with exceptions justified. Console reports show the status. This reduces infection and spread of malicious software.", "asks": ["a: Define the malware protection required for each system type. (full)", "b: Keep protection installed, active and current on in-scope systems. (full)"], "primary": true}, {"id": "UC-PPL-03", "title": "Security awareness", "statement": "A security awareness program is delivered to all personnel and relevant outside parties. It covers the security policy, each person's contribution and the consequences of non-compliance. It also covers common threats such as phishing and malicious attachments. Personnel complete it within the period the program sets, non-completers are followed up, and people are updated whenever relevant policies or procedures change. Completion reports prove it.", "asks": ["c: Deliver awareness material on malware risks such as phishing and suspicious attachments. (full)"], "primary": false}], "crits": [{"id": "ISO.A8.7.TC1", "stmt": "A malware protection standard defines the required protection (e.g. endpoint detection, email and download scanning) for each system type.", "kind": "design", "hint": "configuration_baselines (malware protection standard)", "prop": "UC-OPS-07", "reason": "best word match via atom ISO.A8.7-a (malware, type, protection, requir)"}, {"id": "ISO.A8.7.TC2", "stmt": "Endpoint and server reports show protection installed, active and up to date on in-scope systems, with exceptions justified.", "kind": "operating", "hint": "configuration_baselines; EDR / anti-malware console report", "prop": "UC-OPS-07", "reason": "best word match via atom ISO.A8.7-b (active, install, in-scope, protection)"}, {"id": "ISO.A8.7.TC3", "stmt": "Awareness material covers malware risks (e.g. phishing, suspicious attachments) and was delivered in the period.", "kind": "operating", "hint": "training_records", "prop": "UC-PPL-03", "reason": "best word match via atom ISO.A8.7-c (suspiciou, attachment, phish, malware)"}]}, {"id": "ISO.A8.8", "fw": "iso27001", "ref": "Annex A.8.8", "title": "Management of technical vulnerabilities", "cands": [{"id": "UC-OPS-04", "title": "Vulnerability management", "statement": "A vulnerability management procedure names the sources of vulnerability information, how exposure is assessed and the fix deadlines by severity. In-scope systems are scanned, or equivalent assessments are run, on the cycle the procedure sets. Critical and high findings are fixed within the deadlines or carry a recorded risk acceptance. This closes known weaknesses before they are exploited. Proof is the procedure, scan reports and remediation tracking.", "asks": ["a: Define sources of vulnerability information, how exposure is assessed and fix deadlines by severity. (full)", "b: Run vulnerability scans or equivalent assessments at the set frequency. (full)", "c: Fix critical and high findings within deadlines or record a risk acceptance. (full)"], "primary": true}, {"id": "UC-OPS-05", "title": "Penetration testing", "statement": "Internet-facing systems are penetration tested at least every 12 months, using qualified testers. Findings go into a tracker with owners and due dates and are followed to closure, with retests where needed. This shows how an attacker would see the organization from outside. Proof is the penetration test report and the findings tracker.", "asks": ["d: Penetration test internet-facing systems within the last 12 months and track findings to closure. (full)"], "primary": false}], "crits": [{"id": "ISO.A8.8.TC1", "stmt": "A vulnerability management procedure names the sources of vulnerability information, how exposure is assessed and the remediation deadlines by severity.", "kind": "design", "hint": "vulnerability_management", "prop": "UC-OPS-04", "reason": "best word match via atom ISO.A8.8-a (exposure, deadlin, severity, vulnerability)"}, {"id": "ISO.A8.8.TC2", "stmt": "Vulnerability scans or equivalent assessments of in-scope systems were run in the period at the frequency the procedure sets.", "kind": "operating", "hint": "vulnerability_management (scan reports)", "prop": "UC-OPS-04", "reason": "best word match via atom ISO.A8.8-b (equivalent, scan, vulnerability, frequency)"}, {"id": "ISO.A8.8.TC3", "stmt": "A sample of critical and high findings was remediated within the defined deadlines, or has a recorded risk acceptance.", "kind": "operating", "hint": "vulnerability_management (remediation tracking); risk_assessment", "prop": "UC-OPS-04", "reason": "best word match via atom ISO.A8.8-c (high, deadlin, acceptance, find)"}, {"id": "ISO.A8.8.TC4", "stmt": "Penetration testing of internet-facing systems was performed in the last 12 months and findings tracked to closure.", "kind": "operating", "hint": "vulnerability_management; application_security_testing (pentest reports)", "prop": "UC-OPS-05", "reason": "best word match via atom ISO.A8.8-d (internet-fac, penetr, month, closure)"}]}, {"id": "ISO.A8.13", "fw": "iso27001", "ref": "Annex A.8.13", "title": "Information backup", "cands": [{"id": "UC-RES-04", "title": "Backup operation", "statement": "A backup policy sets scope, frequency, retention, storage location and protection, including offsite or isolated copies. Backups run as the policy requires, and every failure is investigated. This keeps recoverable copies of data available after loss or attack. The backup policy and the backup job logs are the proof.", "asks": ["a: Set a backup policy covering scope, frequency, retention, location and protection. (full)", "b: Run backups as the policy requires and investigate failures. (full)"], "primary": true}, {"id": "UC-RES-05", "title": "Restore testing", "statement": "Restore tests run at the frequency set in the backup policy, and each result is recorded. Each test restores real backups from critical systems and confirms the data comes back usable. This proves that backups can actually be restored. The restore test records are the proof.", "asks": ["c: Perform and record restore tests at the set frequency. (full)"], "primary": false}], "crits": [{"id": "ISO.A8.13.TC1", "stmt": "A topic-specific backup policy sets scope, frequency, retention, storage location (including offsite or isolated copies) and protection of backups.", "kind": "design", "hint": "backup", "prop": "UC-RES-04", "reason": "best word match via atom ISO.A8.13-a (location, frequency, backup, retention)"}, {"id": "ISO.A8.13.TC2", "stmt": "Backup job logs for the period show backups ran as the policy requires, with failures investigated.", "kind": "operating", "hint": "backup (job logs)", "prop": "UC-RES-04", "reason": "best word match via atom ISO.A8.13-b (failur, backup, policy, requir)"}, {"id": "ISO.A8.13.TC3", "stmt": "Restore tests were performed at the frequency the policy sets and results recorded.", "kind": "operating", "hint": "backup (restore test records)", "prop": "UC-RES-05", "reason": "best word match via atom ISO.A8.13-c (restore, frequency, perform, test)"}]}, {"id": "ISO.A8.14", "fw": "iso27001", "ref": "Annex A.8.14", "title": "Redundancy of information processing facilities", "cands": [{"id": "UC-RES-06", "title": "Redundancy for critical systems", "statement": "Availability requirements are defined for critical systems, and the redundancy that meets them is documented, for example multi-zone deployment or failover links. The design leaves no single point of failure for those systems. This keeps critical services running when a component fails. The availability requirements and the redundancy design are the proof.", "asks": ["a: Define availability requirements for critical systems and document the redundancy that meets them. (full)"], "primary": true}, {"id": "UC-RES-07", "title": "Failover testing", "statement": "Failover of redundant components is tested at least yearly, or confirmed from a real event. The results are compared with the defined availability requirements, and any shortfall is recorded. This shows that redundancy works when a component fails. The test records or event reports are the proof.", "asks": ["b: Test failover at least yearly or observe it in a real event. (full)"], "primary": false}], "crits": [{"id": "ISO.A8.14.TC1", "stmt": "Availability requirements are defined for critical systems and the redundancy design meeting them is documented (e.g. multi-zone deployment, failover links).", "kind": "design", "hint": "business_continuity; network_security (architecture diagram)", "prop": "UC-RES-06", "reason": "best word match via atom ISO.A8.14-a (redundancy, availability, meet, critical)"}, {"id": "ISO.A8.14.TC2", "stmt": "Failover of redundant components was tested in the last 12 months, or observed in a real event, and worked.", "kind": "operating", "hint": "business_continuity (failover test records)", "prop": "UC-RES-07", "reason": "best word match via atom ISO.A8.14-b (failover, real, event, test)"}]}, {"id": "ISO.A8.15", "fw": "iso27001", "ref": "Annex A.8.15", "title": "Logging", "cands": [{"id": "UC-OPS-01", "title": "Event logging", "statement": "The security-relevant events each type of system must log, such as authentication, privileged actions, errors and security events, and how long logs are kept, are defined. Systems produce those logs and forward them to central storage, and the source list is kept current. This gives the organization a reliable record for detection and investigation. Proof is the logging standard, the source list and sample logs.", "asks": ["a: Define which events are logged for each system type and how long logs are kept. (full)", "b: Produce the defined logs and forward them to central storage. (full)"], "primary": true}, {"id": "UC-OPS-02", "title": "Log protection", "statement": "Logs are protected from tampering and unauthorized access, including from administrators of the systems being logged. Access to log storage is restricted to those who need it for their work, and logs sit in write-once or otherwise tamper-resistant storage. Storage configuration and access lists show the protection. This keeps the record trustworthy during an investigation.", "asks": ["c: Protect logs from tampering and unauthorized access, including by administrators. (full)"], "primary": false}, {"id": "UC-OPS-03", "title": "Monitoring for anomalous activity", "statement": "What monitoring covers across networks, systems, applications, user activity, vendor remote access and the audit logs of cloud and SaaS services, what counts as anomalous behavior and who receives alerts are defined. Monitoring includes detecting unauthorized devices and wireless access points that connect to the network. Alert rules run and periodic log reviews take place, and each review is recorded. Vendor remote-access sessions are logged and reviewed. Alerts that warrant it are passed on for analysis and, if they point to an incident, to the incident process. This lets the organization catch suspicious activity early. Proof is the monitoring standard, alert rules, review records and linked incident tickets.", "asks": ["d: Analyze logs, through alert rules or periodic review, and record the review. (full)"], "primary": false}], "crits": [{"id": "ISO.A8.15.TC1", "stmt": "A logging standard defines which events are logged for each system type (e.g. authentication, privileged actions, errors, security events) and how long logs are kept.", "kind": "design", "hint": "logging_monitoring", "prop": "UC-OPS-01", "reason": "best word match via atom ISO.A8.15-a (long, logg, event, type)"}, {"id": "ISO.A8.15.TC2", "stmt": "Sampled in-scope systems produce the defined logs and forward them to central storage.", "kind": "operating", "hint": "logging_monitoring (SIEM source list; sample logs)", "prop": "UC-OPS-01", "reason": "best word match via atom ISO.A8.15-b (forward, produce, central, storage)"}, {"id": "ISO.A8.15.TC3", "stmt": "Logs are protected from tampering and unauthorised access (e.g. restricted access, write-once storage), including from administrators of the logged systems.", "kind": "operating", "hint": "logging_monitoring; storage configuration", "prop": "UC-OPS-02", "reason": "best word match via atom ISO.A8.15-c (administrator, tamper, logs, protect)"}, {"id": "ISO.A8.15.TC4", "stmt": "Logs were analysed in the period (e.g. alert rules, periodic log reviews) with records of the review.", "kind": "operating", "hint": "logging_monitoring (review records)", "prop": "UC-OPS-03", "reason": "best word match via atom ISO.A8.15-d (periodic, alert, logs, rule)"}]}, {"id": "ISO.A8.24", "fw": "iso27001", "ref": "Annex A.8.24", "title": "Use of cryptography", "cands": [{"id": "UC-CRY-01", "title": "Use of encryption", "statement": "Where encryption is required, by classification and for data at rest and in transit, and which methods are approved are defined. Encryption is configured on data stores, endpoints and transport as the rules require. The cryptography policy and configuration exports are the proof.", "asks": ["a: Define where encryption is required and which algorithms and key lengths are approved. (full)", "b: Configure encryption on data stores, endpoints and transport as the rules require. (full)"], "primary": true}, {"id": "UC-CRY-02", "title": "Cryptographic key management", "statement": "Rules for managing cryptographic keys through their whole life are set, covering generation, storage, distribution, rotation, revocation and destruction, and who may access them. Keys are held in a controlled store such as a key management service and rotated as the rules require. The key rules and key store records are the proof.", "asks": ["c: Define key management rules covering generation, storage, distribution, rotation, revocation and destruction. (full)", "d: Hold keys in a controlled store and rotate them as the rules require. (full)"], "primary": false}], "crits": [{"id": "ISO.A8.24.TC1", "stmt": "A cryptography policy defines where encryption is required (at rest and in transit, by classification) and which algorithms and key lengths are approved.", "kind": "design", "hint": "cryptography_policy", "prop": "UC-CRY-01", "reason": "best word match via atom ISO.A8.24-a (length, algorithm, encryption, key)"}, {"id": "ISO.A8.24.TC2", "stmt": "Key management rules cover generation, storage, distribution, rotation, revocation and destruction of keys, and who may access them.", "kind": "design", "hint": "cryptography_policy", "prop": "UC-CRY-02", "reason": "best word match via atom ISO.A8.24-c (gener, rotation, revoc, distribution)"}, {"id": "ISO.A8.24.TC3", "stmt": "Configuration of sampled data stores and endpoints shows encryption enabled as the policy requires (e.g. storage encryption, TLS versions).", "kind": "operating", "hint": "cryptography_policy; system configuration export", "prop": "UC-CRY-01", "reason": "best word match via atom ISO.A8.24-b (encryption, endpoint, stor, data)"}, {"id": "ISO.A8.24.TC4", "stmt": "Key management records show keys are held in a controlled store (e.g. KMS, HSM) and rotated as the policy requires.", "kind": "operating", "hint": "cryptography_policy; KMS configuration export", "prop": "UC-CRY-02", "reason": "best word match via atom ISO.A8.24-d (store, keys, controll, rotat)"}]}, {"id": "ISO.A8.28", "fw": "iso27001", "ref": "Annex A.8.28", "title": "Secure coding", "cands": [{"id": "UC-PPL-04", "title": "Role-based security training", "statement": "People in technical, privileged and other high-risk roles receive training matched to their duties, such as secure coding for developers. A role-based curriculum is defined, completion is tracked, and it is refreshed at least yearly for developers. Training records prove it.", "asks": ["c: Give developers secure coding training at least yearly. (full)"], "primary": false}, {"id": "UC-SDC-05", "title": "Secure coding", "statement": "A secure coding standard covers input validation, output encoding, secrets handling and dependency management, and applies to in-house and outsourced code. Code changes go through peer review or automated scanning, such as static analysis, dependency or secret scanning, and findings are addressed before release. This keeps common coding flaws out of production. Proof is the standard and the pipeline scan results.", "asks": ["a: Maintain a secure coding standard that applies to in-house and outsourced code. (full)", "b: Run code review or automated scanning on code changes and address findings before release. (full)"], "primary": true}], "crits": [{"id": "ISO.A8.28.TC1", "stmt": "A secure coding standard exists (e.g. covering input validation, output encoding, secrets handling, dependency management) and applies to in-house and outsourced code.", "kind": "design", "hint": "sdlc_policy (secure coding standard)", "prop": "UC-SDC-05", "reason": "best word match via atom ISO.A8.28-a (in-house, coding, outsourc, code)"}, {"id": "ISO.A8.28.TC2", "stmt": "Code review or automated scanning (e.g. SAST, dependency or secret scanning) runs on code changes and findings are addressed before release.", "kind": "operating", "hint": "sdlc_policy; CI pipeline configuration and scan results", "prop": "UC-SDC-05", "reason": "best word match via atom ISO.A8.28-b (scann, release, automat, code)"}, {"id": "ISO.A8.28.TC3", "stmt": "Developers received secure coding training in the last 12 months.", "kind": "operating", "hint": "training_records", "prop": "UC-PPL-04", "reason": "best word match via atom ISO.A8.28-c (coding, developer, train, secure)"}]}, {"id": "NIST.GV.OC.04", "fw": "nist_csf", "ref": "GV.OC-04", "title": "Critical objectives and dependencies", "cands": [{"id": "UC-RES-02", "title": "Recovery objectives and plans", "statement": "Recovery time and recovery point objectives are set for each critical IT service from a business impact analysis, and a recovery plan is kept for each of those services. The objectives and plans are updated when the analysis changes. This makes sure recovery work is aimed at what the business can least afford to lose. The impact analysis, the objectives table and the recovery plans are the proof.", "asks": ["b: The organization sets resilience objectives for each critical service. (full)"], "primary": false}, {"id": "UC-RES-40", "title": "Critical service identification", "statement": "The services that customers and other outside parties depend on are listed, and written criteria decide which are critical. Resilience objectives are set for each critical service, and the critical services and their objectives are shared with the parties that rely on or deliver them, for example through service agreements or a distributed continuity plan. The list is reviewed on a defined cycle. This keeps recovery effort aimed at what outsiders cannot do without.", "asks": ["a: The organization identifies the services external parties depend on and sets criteria for which of them are critical. (full)", "c: The organization tells the relying and delivering parties about its critical services and their resilience objectives. (full)"], "primary": true}], "crits": [{"id": "NIST.GV.OC.04.TC1", "stmt": "A document identifies which of the organisation's capabilities and services customers or other external stakeholders depend on, and marks which are critical.", "kind": "design", "hint": "risk_management_strategy; business_continuity (business impact analysis)", "prop": "UC-RES-40", "reason": "best word match via atom NIST.GV.OC.04-a (depend, external, critical, servic)"}, {"id": "NIST.GV.OC.04.TC2", "stmt": "Written criteria define how the criticality of a capability or service is decided.", "kind": "design", "hint": "business_continuity (BIA method)", "prop": "UC-RES-40", "reason": "best word match via atom NIST.GV.OC.04-a (criteria, continuity, decid, service)"}, {"id": "NIST.GV.OC.04.TC3", "stmt": "Resilience objectives (e.g. recovery time and recovery point objectives) are set for each critical service.", "kind": "design", "hint": "business_continuity", "prop": "UC-RES-02", "reason": "best word match via atom NIST.GV.OC.04-b (resilience, objectiv, service, critical)"}, {"id": "NIST.GV.OC.04.TC4", "stmt": "The critical services or their resilience objectives have been communicated to the parties who rely on or deliver them (e.g. in SLAs, customer agreements or a distributed continuity plan).", "kind": "operating", "hint": "business_continuity (distribution record); supplier_security (SLAs)", "prop": "UC-RES-40", "reason": "best word match via atom NIST.GV.OC.04-c (rely, resilience, deliver, objectiv)"}]}, {"id": "NIST.GV.RM.01", "fw": "nist_csf", "ref": "GV.RM-01", "title": "Risk management objectives", "cands": [{"id": "UC-GOV-11", "title": "Security objectives", "statement": "Measurable security objectives are set at relevant functions, consistent with policy. For each objective the plan states what will be done, with what resources, by whom, by when and how results are evaluated. Objectives are monitored, communicated and updated, and the plan is kept as a record.", "asks": ["a: The organization documents its cybersecurity risk management objectives with measurable targets. (full)", "b: Senior stakeholders formally agree the risk management objectives. (full)"], "primary": true}, {"id": "UC-GOV-18", "title": "Management review", "statement": "Top management reviews the security program at planned intervals. The review covers the status of past actions, changes in issues and in the needs of interested parties, performance trends (nonconformities, measurements, audit results and objectives), feedback from interested parties, risk results and treatment status, and improvement opportunities. Decisions on improvement and needed changes are recorded and tracked.", "asks": ["c: The organization reviews the objectives on a schedule and after major change. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.RM.01.TC1", "stmt": "Documented cybersecurity risk management objectives exist.", "kind": "design", "hint": "risk_management_strategy", "prop": "UC-GOV-11", "reason": "best word match via atom NIST.GV.RM.01-a (objectiv, cybersecurity, management, document)"}, {"id": "NIST.GV.RM.01.TC2", "stmt": "Each objective has a measure, target or success condition.", "kind": "design", "hint": "risk_management_strategy", "prop": "UC-GOV-11", "reason": "best word match via atom NIST.GV.RM.01-a (target, management, risk, objective)"}, {"id": "NIST.GV.RM.01.TC3", "stmt": "Minutes or sign-off records show the objectives were agreed by senior stakeholders.", "kind": "operating", "hint": "leadership_oversight; risk_management_strategy (approval page)", "prop": "UC-GOV-11", "reason": "best word match via atom NIST.GV.RM.01-b (senior, stakeholder, objectiv, management)"}, {"id": "NIST.GV.RM.01.TC4", "stmt": "The objectives were reviewed or updated in the latest annual planning cycle or after the latest major organisational change.", "kind": "operating", "hint": "risk_management_strategy (version history); leadership_oversight", "prop": "UC-GOV-18", "reason": "best word match via atom NIST.GV.RM.01-c (major, objectiv, after, change)"}]}, {"id": "NIST.GV.RM.03", "fw": "nist_csf", "ref": "GV.RM-03", "title": "Risk management activities", "cands": [{"id": "UC-RSK-41", "title": "Security and supplier risk in enterprise risk management", "statement": "Cybersecurity and supply chain risks sit in the same enterprise risk process and register as other enterprise risks. The risk assessment method explicitly covers supplier risk, and supply chain security practices are part of the wider risk program. Enterprise risk reports to top management include these risks. Proof is the register, the method and the latest risk report.", "asks": ["a: The organization includes cybersecurity risks in its enterprise risk management process and register. (full)", "c: Enterprise risk reporting to leadership covers cybersecurity risks. (full)"], "primary": true}, {"id": "UC-RSK-44", "title": "Risk escalation criteria and channels", "statement": "Written criteria set when a cybersecurity risk is escalated into enterprise risk management. Defined channels exist for raising and escalating security risk across the organization, and they cover risk that starts with suppliers and other third parties. Risks that meet the threshold are routed through those channels, and material supply chain risks reach top management. Proof is the criteria, the channel description and escalation records.", "asks": ["b: The organization sets criteria for escalating a cybersecurity risk into enterprise risk management. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.RM.03.TC1", "stmt": "The enterprise risk management process or register includes cybersecurity risks alongside other enterprise risks (financial, operational, compliance).", "kind": "design", "hint": "risk_assessment; risk_management_strategy", "prop": "UC-RSK-41", "reason": "best word match via atom NIST.GV.RM.03-a (enterprise, cybersecurity, proces, register)"}, {"id": "NIST.GV.RM.03.TC2", "stmt": "Written criteria say when a cybersecurity risk is escalated into enterprise risk management.", "kind": "design", "hint": "risk_management_strategy", "prop": "UC-RSK-44", "reason": "best word match via atom NIST.GV.RM.03-b (enterprise, escalat, cybersecurity, criteria)"}, {"id": "NIST.GV.RM.03.TC3", "stmt": "The latest enterprise risk report to leadership in the period includes cybersecurity risks.", "kind": "operating", "hint": "leadership_oversight", "prop": "UC-RSK-41", "reason": "best word match via atom NIST.GV.RM.03-c (enterprise, leadership, cybersecurity, report)"}]}, {"id": "NIST.GV.RM.04", "fw": "nist_csf", "ref": "GV.RM-04", "title": "Strategic risk direction", "cands": [{"id": "UC-GOV-41", "title": "Risk direction communicated to those who act on it", "statement": "The risk direction, the risk method, security roles and planned risk responses are delivered to the people who must act on them. Each item is sent by a defined channel when it is issued or changed. Proof of receipt is kept, such as distribution lists, acknowledgements or briefing records, and role holders confirm they understand their roles.", "asks": ["c: The organization communicates the risk response direction to those who make risk decisions. (full)"], "primary": false}, {"id": "UC-RSK-40", "title": "Risk appetite, tolerance and response direction", "statement": "Top management approves a risk appetite statement, and it is turned into measurable tolerance limits, such as a maximum acceptable downtime or highest acceptable residual rating. The risk response options of accept, mitigate, transfer and avoid are defined, with criteria for choosing among them, including when outsourcing or cloud arrangements are acceptable. The risk method treats opportunities, the upside of risk, as a category alongside threats, and identified opportunities are recorded in risk decisions. All of this is communicated to risk owners and reviewed on a defined cycle. Proof is the approved statement, its version history and distribution records.", "asks": ["a: The organization defines the available risk response options and when each is appropriate. (full)", "b: The organization sets criteria for accepting or avoiding risk and for acceptable shared-responsibility arrangements. (full)"], "primary": true}], "crits": [{"id": "NIST.GV.RM.04.TC1", "stmt": "The risk strategy lists the available risk response options (accept, mitigate, transfer, avoid) and says when each is appropriate.", "kind": "design", "hint": "risk_management_strategy", "prop": "UC-RSK-40", "reason": "best word match via atom NIST.GV.RM.04-a (appropriate, option, available, response)"}, {"id": "NIST.GV.RM.04.TC2", "stmt": "Criteria for accepting or avoiding risk are set, e.g. by data classification.", "kind": "design", "hint": "risk_management_strategy", "prop": "UC-RSK-40", "reason": "best word match via atom NIST.GV.RM.04-b (avoid, accept, criteria, risk)"}, {"id": "NIST.GV.RM.04.TC3", "stmt": "The conditions under which shared-responsibility arrangements (outsourcing, public cloud) are acceptable are documented.", "kind": "design", "hint": "risk_management_strategy; supplier_security", "prop": "UC-RSK-40", "reason": "best word match via atom NIST.GV.RM.04-b (arrangement, shared-responsibility, acceptable, risk)"}, {"id": "NIST.GV.RM.04.TC4", "stmt": "The risk response direction has been communicated to the people who make risk decisions (e.g. distributed risk procedure, briefing record).", "kind": "operating", "hint": "risk_management_strategy (distribution record)", "prop": "UC-GOV-41", "reason": "best word match via atom NIST.GV.RM.04-c (direction, communicat, decision, response)"}]}, {"id": "NIST.GV.RM.06", "fw": "nist_csf", "ref": "GV.RM-06", "title": "Standardized risk method", "cands": [{"id": "UC-GOV-41", "title": "Risk direction communicated to those who act on it", "statement": "The risk direction, the risk method, security roles and planned risk responses are delivered to the people who must act on them. Each item is sent by a defined channel when it is issued or changed. Proof of receipt is kept, such as distribution lists, acknowledgements or briefing records, and role holders confirm they understand their roles.", "asks": ["d: The organization communicates the method to the people who apply it. (full)"], "primary": false}, {"id": "UC-RSK-01", "title": "Risk assessment method", "statement": "A repeatable risk assessment method is defined, with acceptance criteria and criteria for performing assessments. The method identifies risks to confidentiality, integrity and availability within scope, assigns risk owners, and ranks risks by likelihood and impact. It is kept as a documented procedure and reviewed on a defined cycle.", "asks": ["a: The organization documents one method for rating cybersecurity risk from likelihood and impact. (full)", "b: The method defines how risks are categorized and prioritized. (full)", "c: The organization applies the same method consistently across all recorded risks. (full)"], "primary": true}], "crits": [{"id": "NIST.GV.RM.06.TC1", "stmt": "One documented method for calculating cybersecurity risk exists and states how likelihood and impact combine into a rating.", "kind": "design", "hint": "risk_assessment (methodology)", "prop": "UC-RSK-01", "reason": "best word match via atom NIST.GV.RM.06-a (likelihood, rating, impact, method)"}, {"id": "NIST.GV.RM.06.TC2", "stmt": "The method defines how risks are categorised and how their priority order is determined.", "kind": "design", "hint": "risk_assessment (methodology)", "prop": "UC-RSK-01", "reason": "best word match via atom NIST.GV.RM.06-b (method, how, risk, defin)"}, {"id": "NIST.GV.RM.06.TC3", "stmt": "The risk register shows the same rating, category and priority fields actually populated for recorded risks, rather than a mix of ad hoc scales.", "kind": "operating", "hint": "risk_assessment (risk register)", "prop": "UC-RSK-01", "reason": "best word match via atom NIST.GV.RM.06-c (same, risk, record, scal)"}, {"id": "NIST.GV.RM.06.TC4", "stmt": "The method is communicated to the people who apply it, e.g. referenced in a risk assessment procedure or covered in training.", "kind": "design", "hint": "risk_management_strategy; training_records", "prop": "UC-GOV-41", "reason": "best word match via atom NIST.GV.RM.06-d (communicat, method, apply, people); close call with UC-RSK-01"}]}, {"id": "NIST.GV.RM.07", "fw": "nist_csf", "ref": "GV.RM-07", "title": "Positive risk consideration", "cands": [{"id": "UC-GOV-10", "title": "Risks and opportunities of the program", "statement": "The risks and opportunities that bear on the security program are determined, actions for them are planned, and those actions are built into program processes. A method for checking that the actions work is planned as well. Proof is a planning record with owners and a method for evaluating results.", "asks": ["a: The risk methodology treats opportunities (positive risks) as a category alongside threats. (partial)", "b: The organization records and discusses identified opportunities in its risk discussions. (partial)"], "primary": false}, {"id": "UC-RSK-40", "title": "Risk appetite, tolerance and response direction", "statement": "Top management approves a risk appetite statement, and it is turned into measurable tolerance limits, such as a maximum acceptable downtime or highest acceptable residual rating. The risk response options of accept, mitigate, transfer and avoid are defined, with criteria for choosing among them, including when outsourcing or cloud arrangements are acceptable. The risk method treats opportunities, the upside of risk, as a category alongside threats, and identified opportunities are recorded in risk decisions. All of this is communicated to risk owners and reviewed on a defined cycle. Proof is the approved statement, its version history and distribution records.", "asks": ["a: The risk methodology treats opportunities (positive risks) as a category alongside threats. (full)", "b: The organization records and discusses identified opportunities in its risk discussions. (full)"], "primary": true}], "crits": [{"id": "NIST.GV.RM.07.TC1", "stmt": "The risk management strategy or methodology defines opportunity (positive risk) as a category to be considered alongside threats.", "kind": "design", "hint": "risk_management_strategy", "prop": "UC-RSK-40", "reason": "best word match via atom NIST.GV.RM.07-a (positive, alongside, methodology, opportunity)"}, {"id": "NIST.GV.RM.07.TC2", "stmt": "At least one risk discussion or risk register entry in the period records a characterised opportunity, not only threats.", "kind": "operating", "hint": "risk_management_strategy (risk register or minutes); leadership_oversight", "prop": "UC-RSK-40", "reason": "best word match via atom NIST.GV.RM.07-b (discussion, opportunity, risk, record)"}]}, {"id": "NIST.GV.RR.01", "fw": "nist_csf", "ref": "GV.RR-01", "title": "Organizational leadership responsibility", "cands": [{"id": "UC-GOV-05", "title": "Leadership commitment", "statement": "Top management leads the security program. It sets policy and objectives that fit the strategy, builds security needs into business processes, and makes sure the program achieves its intended outcomes. It communicates why security matters, directs and supports the people who run the program, supports other managers in leading in their own areas, and promotes improvement. Sign-offs and minutes are the proof.", "asks": ["c: Leadership communicates expectations for a risk-aware, ethical, improvement-minded culture. (full)"], "primary": true}, {"id": "UC-GOV-07", "title": "Security roles and responsibilities", "statement": "Security roles, responsibilities and authorities are defined and each is assigned to a named, current person. This includes responsibility for program conformity and for reporting performance to top management. The assignments are communicated and rechecked when people or structures change, using a role document or RACI with names.", "asks": ["a: The organization formally names a senior leader or body accountable for cybersecurity risk. (full)"], "primary": false}, {"id": "UC-GOV-18", "title": "Management review", "statement": "Top management reviews the security program at planned intervals. The review covers the status of past actions, changes in issues and in the needs of interested parties, performance trends (nonconformities, measurements, audit results and objectives), feedback from interested parties, risk results and treatment status, and improvement opportunities. Decisions on improvement and needed changes are recorded and tracked.", "asks": ["b: Leadership reviews cybersecurity risk on a regular basis. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.RR.01.TC1", "stmt": "A named senior leader or body (e.g. board, executive committee) is formally accountable for cybersecurity risk in a charter, terms of reference or policy.", "kind": "design", "hint": "roles_responsibilities; security_policy", "prop": "UC-GOV-07", "reason": "best word match via atom NIST.GV.RR.01-a (leader, accountable, body, senior)"}, {"id": "NIST.GV.RR.01.TC2", "stmt": "Minutes or reports show that leadership reviewed cybersecurity risk at least once in the period.", "kind": "operating", "hint": "leadership_oversight", "prop": "UC-GOV-18", "reason": "best word match via atom NIST.GV.RR.01-b (leadership, cybersecurity, risk, review)"}, {"id": "NIST.GV.RR.01.TC3", "stmt": "Leadership communicated expectations for a security-aware and ethical culture in the period (e.g. staff message, policy foreword, all-hands briefing).", "kind": "operating", "hint": "leadership_oversight; training_records", "prop": "UC-GOV-05", "reason": "best word match via atom NIST.GV.RR.01-c (culture, ethical, expect, leadership)"}]}, {"id": "NIST.GV.RR.02", "fw": "nist_csf", "ref": "GV.RR-02", "title": "Cybersecurity roles and responsibilities", "cands": [{"id": "UC-GOV-07", "title": "Security roles and responsibilities", "statement": "Security roles, responsibilities and authorities are defined and each is assigned to a named, current person. T
