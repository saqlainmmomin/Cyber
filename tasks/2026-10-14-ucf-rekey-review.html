his includes responsibility for program conformity and for reporting performance to top management. The assignments are communicated and rechecked when people or structures change, using a role document or RACI with names.", "asks": ["a: The organization documents cybersecurity roles, responsibilities and authorities. (full)"], "primary": true}, {"id": "UC-GOV-08", "title": "Team members aligned with security policy", "statement": "Every team member is required to work in line with the organization's security policies and procedures. The requirement is stated in documents each person receives, such as a code of conduct or onboarding pack. Teams are briefed or acknowledgements are tracked, and the records are kept.", "asks": ["c: The organization enforces security duties through performance goals or follow-up on missed duties. (full)"], "primary": false}, {"id": "UC-GOV-41", "title": "Risk direction communicated to those who act on it", "statement": "The risk direction, the risk method, security roles and planned risk responses are delivered to the people who must act on them. Each item is sent by a defined channel when it is issued or changed. Proof of receipt is kept, such as distribution lists, acknowledgements or briefing records, and role holders confirm they understand their roles.", "asks": ["b: The organization communicates these roles to role holders and confirms they understand them. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.RR.02.TC1", "stmt": "Cybersecurity risk management roles, responsibilities and authorities are documented (e.g. in policy or a RACI).", "kind": "design", "hint": "roles_responsibilities", "prop": "UC-GOV-07", "reason": "best word match via atom NIST.GV.RR.02-a (authority, responsibility, cybersecurity, role)"}, {"id": "NIST.GV.RR.02.TC2", "stmt": "Job descriptions for roles with security duties state those duties.", "kind": "design", "hint": "roles_responsibilities; hr_security", "prop": "UC-GOV-07", "reason": "best word match via atom NIST.GV.RR.02-a (responsibility, role, duti, security)"}, {"id": "NIST.GV.RR.02.TC3", "stmt": "Role holders have been told of their security roles (e.g. appointment letters, signed acknowledgements).", "kind": "operating", "hint": "roles_responsibilities", "prop": "UC-GOV-41", "reason": "best word match via atom NIST.GV.RR.02-b (holder, role, acknowledgement, told)"}, {"id": "NIST.GV.RR.02.TC4", "stmt": "Security duties are enforced: role holders have security performance goals, or records show follow-up when duties were not met.", "kind": "operating", "hint": "roles_responsibilities; hr_security", "prop": "UC-GOV-08", "reason": "best word match via atom NIST.GV.RR.02-c (goal, follow-up, enforc, performance)"}]}, {"id": "NIST.GV.RR.04", "fw": "nist_csf", "ref": "GV.RR-04", "title": "Cybersecurity in HR practices", "cands": [{"id": "UC-PPL-01", "title": "Pre-employment screening", "statement": "Background checks required before a person joins are defined, such as identity, references, qualifications and criminal record where lawful, with depth scaled to the role, the information it can reach and the risk. The checks are completed before the start date or before access is granted. The procedure states when re-screening happens, for example on promotion to a sensitive role. Screening records prove it.", "asks": ["a: HR procedures include security steps at screening, onboarding, role change and offboarding. (partial)", "b: The organization runs background checks before placing people in sensitive roles. (full)"], "primary": true}, {"id": "UC-PPL-02", "title": "Terms of employment", "statement": "Employment and contractor agreement templates state the security responsibilities of both the individual and the organization. All current staff and contractors sign agreements that contain these terms, and the signed copies are kept. This makes security duties part of the working relationship and gives a basis for action if they are breached.", "asks": ["c: Employment terms or acknowledgements oblige personnel to follow security policies. (full)"], "primary": false}, {"id": "UC-PPL-40", "title": "Security steps across the employment life cycle", "statement": "Security steps are built into the HR procedures for onboarding, role change and offboarding, in addition to screening. These include signing the security policies or acknowledging them in the employment terms, granting access only for the role, adjusting access when the role changes and removing all access when the person leaves. A checklist or record confirms that each step was completed for every joiner, mover and leaver. This keeps access and obligations in step with who works for the organization.", "asks": ["a: HR procedures include security steps at screening, onboarding, role change and offboarding. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.RR.04.TC1", "stmt": "HR procedures include security steps at screening, onboarding, role change and offboarding.", "kind": "design", "hint": "hr_security", "prop": "UC-PPL-40", "reason": "best word match via atom NIST.GV.RR.04-a (offboard, onboard, screen, procedur)"}, {"id": "NIST.GV.RR.04.TC2", "stmt": "Background checks are required before someone is hired into a role the organisation defines as sensitive.", "kind": "design", "hint": "hr_security", "prop": "UC-PPL-01", "reason": "best word match via atom NIST.GV.RR.04-b (background, sensitive, role, before)"}, {"id": "NIST.GV.RR.04.TC3", "stmt": "Employment terms or a signed acknowledgement oblige personnel to follow security policies.", "kind": "design", "hint": "hr_security", "prop": "UC-PPL-02", "reason": "best word match via atom NIST.GV.RR.04-c (oblige, employment, acknowledgement, term)"}, {"id": "NIST.GV.RR.04.TC4", "stmt": "For a sample of joiners and leavers in the period, the defined HR security steps (screening, policy acknowledgement, access removal) were completed.", "kind": "operating", "hint": "hr_security (joiner/leaver records); access_control_policy", "prop": "UC-PPL-40", "reason": "best word match via atom NIST.GV.RR.04-a (screen, step, security, joiner)"}]}, {"id": "NIST.GV.PO.01", "fw": "nist_csf", "ref": "GV.PO-01", "title": "Cybersecurity policy", "cands": [{"id": "UC-GOV-06", "title": "Security policy set", "statement": "A set of security policies headed by a top-level policy is maintained, with each policy approved by management. The top-level policy suits the organization's purpose and context, frames security objectives and commits to meeting requirements and to continual improvement. The policies are published, available to interested parties and acknowledged by personnel and relevant outside parties. They are reviewed on a defined cycle and after significant change. Each update records what drove the change, and updated versions are communicated again to personnel. Proof is the approval record, distribution list, acknowledgements and review log.", "asks": ["a: The organization maintains a documented cybersecurity risk policy approved by senior management. (full)", "b: The policy is based on the organization's context, strategy and priorities. (full)", "c: The organization communicates the policy to personnel. (full)"], "primary": true}, {"id": "UC-RSK-10", "title": "Practice checked against policy", "statement": "The day-to-day work of each team where security controls apply is checked on a defined cycle against the documented security policies and standards. The checks test what is actually done in the work, not only what is written. Each gap between practice and policy is recorded with an action, and actions are tracked to closure. Policy violations found are recorded and handled. Proof is the check schedule, the check reports and the action tracker.", "asks": ["d2: The organization enforces the policy and records violations and how each was handled. (full)"], "primary": false}, {"id": "UC-RSK-42", "title": "Policy exceptions and time-limited risk acceptance", "statement": "Departures from policy are approved through a defined exception process. Each exception needs a recorded approval and an expiry or review date. An exception register holds each open exception with who is accountable for it and its review date, and each exception is recorded with how it was handled. Proof is the register and the approval records.", "asks": ["d1: The organization records exceptions to the policy and how each was handled. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.PO.01.TC1", "stmt": "A documented policy for managing cybersecurity risk exists.", "kind": "design", "hint": "security_policy", "prop": "UC-GOV-06", "reason": "best word match via atom NIST.GV.PO.01-a (cybersecurity, policy, document, risk)"}, {"id": "NIST.GV.PO.01.TC2", "stmt": "The policy is approved by senior management.", "kind": "design", "hint": "security_policy (approval page)", "prop": "UC-GOV-06", "reason": "best word match via atom NIST.GV.PO.01-a (senior, management, approv, policy)"}, {"id": "NIST.GV.PO.01.TC3", "stmt": "The policy refers to the organisation's context, strategy or priorities (e.g. cites the risk strategy, applicable laws or critical services).", "kind": "design", "hint": "security_policy", "prop": "UC-GOV-06", "reason": "best word match via atom NIST.GV.PO.01-b (strategy, context, priority, policy)"}, {"id": "NIST.GV.PO.01.TC4", "stmt": "Records show the policy was communicated to personnel (e.g. distribution list or acknowledgement records).", "kind": "operating", "hint": "security_policy; training_records", "prop": "UC-GOV-06", "reason": "best word match via atom NIST.GV.PO.01-c (communicat, personnel, policy, distribution)"}, {"id": "NIST.GV.PO.01.TC5", "stmt": "Policy exceptions and violations in the period are recorded with how each was handled.", "kind": "operating", "hint": "security_policy (exception register); hr_security (disciplinary process)", "prop": "UC-RSK-10", "reason": "best word match via atom NIST.GV.PO.01-d2 (viol, handl, policy, how); close call with UC-RSK-42"}]}, {"id": "NIST.GV.OV.03", "fw": "nist_csf", "ref": "GV.OV-03", "title": "Risk management performance evaluation", "cands": [{"id": "UC-GOV-17", "title": "Performance monitoring and measurement", "statement": "What security performance to measure is decided, with methods that give valid, comparable and reproducible results, and when and by whom it is measured. When and by whom results are analyzed is also set. Results and the effectiveness of the program are evaluated on a defined cycle, and evidence is kept. Proof is a metrics list, reports and review notes.", "asks": ["a: The organization defines indicators for measuring risk management performance. (full)"], "primary": true}, {"id": "UC-GOV-18", "title": "Management review", "statement": "Top management reviews the security program at planned intervals. The review covers the status of past actions, changes in issues and in the needs of interested parties, performance trends (nonconformities, measurements, audit results and objectives), feedback from interested parties, risk results and treatment status, and improvement opportunities. Decisions on improvement and needed changes are recorded and tracked.", "asks": ["b: The organization reports these metrics to senior leadership. (full)"], "primary": false}, {"id": "UC-GOV-19", "title": "Continual improvement", "statement": "The suitability, adequacy and effectiveness of the security program are continually improved. Improvement opportunities come from reviews, audits, incidents and measures. They are logged, prioritized, owned and tracked to completion.", "asks": ["c: The organization records needed adjustments with owners and traces improvements to lessons learned or assessments. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.OV.03.TC1", "stmt": "Performance or risk indicators for cybersecurity risk management are defined (KPIs or KRIs).", "kind": "design", "hint": "leadership_oversight; risk_management_strategy", "prop": "UC-GOV-17", "reason": "best word match via atom NIST.GV.OV.03-a (indicator, performance, management, risk)"}, {"id": "NIST.GV.OV.03.TC2", "stmt": "Metrics on cybersecurity risk management performance were reported to senior leadership in the period.", "kind": "operating", "hint": "leadership_oversight", "prop": "UC-GOV-18", "reason": "best word match via atom NIST.GV.OV.03-b (metric, senior, leadership, report)"}, {"id": "NIST.GV.OV.03.TC3", "stmt": "The performance review records the adjustments needed, each with an owner, or states that none are needed.", "kind": "operating", "hint": "leadership_oversight (minutes, action log)", "prop": "UC-GOV-19", "reason": "best word match via atom NIST.GV.OV.03-c (adjustment, owner, need, record); close call with UC-GOV-18"}, {"id": "NIST.GV.OV.03.TC4", "stmt": "Improvements to risk management made in the period trace back to a lessons-learned review or an assessment.", "kind": "operating", "hint": "leadership_oversight; exercise_records", "prop": "UC-GOV-19", "reason": "best word match via atom NIST.GV.OV.03-c (improvement, assessment, record, review)"}]}, {"id": "NIST.GV.SC.02", "fw": "nist_csf", "ref": "GV.SC-02", "title": "Supply chain roles and responsibilities", "cands": [{"id": "UC-SUP-03", "title": "Supplier security agreements", "statement": "A standard set of supplier security clauses is kept, varying by supplier type or risk tier, and the agreed terms are in each contract, especially with high-risk suppliers. Each agreement states the scope of access and data granted to the supplier. Typical terms also cover confidentiality, incident notification within a stated time, audit rights, rules for sharing and reporting security information, and return or deletion of information at exit. Signed contracts prove it.", "asks": ["c: The organization defines rules for sharing and reporting security information with suppliers. (full)"], "primary": false}, {"id": "UC-SUP-42", "title": "Supplier security accountability and responsibilities", "statement": "Accountability for supplier security risk is assigned and recorded. What suppliers, customers and partners are each responsible for is written down. These responsibilities are communicated to the third parties, so everyone knows what is expected. Proof is the accountability record, a shared-responsibility matrix or contract wording, and signed agreements or onboarding packs.", "asks": ["a: The organization names the internal roles accountable for supplier cybersecurity risk. (full)", "b: The organization documents the cybersecurity responsibilities of suppliers, customers and partners and communicates them. (full)"], "primary": true}], "crits": [{"id": "NIST.GV.SC.02.TC1", "stmt": "The internal role(s) accountable for supplier cybersecurity risk are named.", "kind": "design", "hint": "supplier_security; roles_responsibilities", "prop": "UC-SUP-42", "reason": "best word match via atom NIST.GV.SC.02-a (accountable, internal, cybersecurity, supplier)"}, {"id": "NIST.GV.SC.02.TC2", "stmt": "Cybersecurity responsibilities of suppliers, customers and partners are documented (e.g. shared-responsibility matrix or contract clauses).", "kind": "design", "hint": "supplier_security", "prop": "UC-SUP-42", "reason": "best word match via atom NIST.GV.SC.02-b (partner, customer, responsibility, cybersecurity)"}, {"id": "NIST.GV.SC.02.TC3", "stmt": "Those third-party responsibilities have been communicated to the third parties (e.g. signed agreements, supplier onboarding pack).", "kind": "operating", "hint": "supplier_security (sample agreements)", "prop": "UC-SUP-42", "reason": "best word match via atom NIST.GV.SC.02-b (responsibility, communicat, supplier, pack)"}, {"id": "NIST.GV.SC.02.TC4", "stmt": "Rules for sharing and reporting security information between the organisation and its suppliers are defined.", "kind": "design", "hint": "supplier_security", "prop": "UC-SUP-03", "reason": "best word match via atom NIST.GV.SC.02-c (shar, supplier, inform, report)"}]}, {"id": "NIST.GV.SC.03", "fw": "nist_csf", "ref": "GV.SC-03", "title": "Supply chain integration", "cands": [{"id": "UC-RSK-41", "title": "Security and supplier risk in enterprise risk management", "statement": "Cybersecurity and supply chain risks sit in the same enterprise risk process and register as other enterprise risks. The risk assessment method explicitly covers supplier risk, and supply chain security practices are part of the wider risk program. Enterprise risk reports to top management include these risks. Proof is the register, the method and the latest risk report.", "asks": ["a: The organization records supplier risks in the same risk process and register as other cybersecurity risks. (full)", "b: The risk assessment method explicitly covers supply chain risk. (full)"], "primary": true}, {"id": "UC-RSK-44", "title": "Risk escalation criteria and channels", "statement": "Written criteria set when a cybersecurity risk is escalated into enterprise risk management. Defined channels exist for raising and escalating security risk across the organization, and they cover risk that starts with suppliers and other third parties. Risks that meet the threshold are routed through those channels, and material supply chain risks reach top management. Proof is the criteria, the channel description and escalation records.", "asks": ["c: Material supply chain risks are escalated to senior management or enterprise risk reporting. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.SC.03.TC1", "stmt": "Supplier cybersecurity risks are recorded in the same risk register or ERM process as other cybersecurity risks.", "kind": "design", "hint": "risk_assessment; supplier_security", "prop": "UC-RSK-41", "reason": "best word match via atom NIST.GV.SC.03-a (same, cybersecurity, proces, register)"}, {"id": "NIST.GV.SC.03.TC2", "stmt": "The risk assessment method explicitly covers supplier and supply chain risks.", "kind": "design", "hint": "risk_assessment (methodology)", "prop": "UC-RSK-41", "reason": "best word match via atom NIST.GV.SC.03-b (explicitly, supply, chain, method)"}, {"id": "NIST.GV.SC.03.TC3", "stmt": "Material supply chain risks were escalated to senior management or appear in enterprise risk reporting in the period.", "kind": "operating", "hint": "leadership_oversight", "prop": "UC-RSK-44", "reason": "best word match via atom NIST.GV.SC.03-c (senior, material, enterprise, escalat)"}]}, {"id": "NIST.GV.SC.06", "fw": "nist_csf", "ref": "GV.SC-06", "title": "Supplier pre-engagement due diligence", "cands": [{"id": "UC-SUP-02", "title": "Supplier due diligence", "statement": "A security assessment of each supplier is completed before the contract is signed or access is granted, and the result is kept. The depth of the assessment follows the supplier's risk rating. This lets the organization decline or condition a supplier that cannot meet its security needs.", "asks": ["a: The organization requires a documented due-diligence procedure with a cybersecurity risk assessment before a supplier relationship starts. (full)"], "primary": true}, {"id": "UC-SUP-03", "title": "Supplier security agreements", "statement": "A standard set of supplier security clauses is kept, varying by supplier type or risk tier, and the agreed terms are in each contract, especially with high-risk suppliers. Each agreement states the scope of access and data granted to the supplier. Typical terms also cover confidentiality, incident notification within a stated time, audit rights, rules for sharing and reporting security information, and return or deletion of information at exit. Signed contracts prove it.", "asks": ["b: The organization plans the relationship scope, including the access and data the supplier will have, before it begins. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.SC.06.TC1", "stmt": "A documented supplier onboarding or due-diligence procedure requires a cybersecurity risk assessment before a contract or relationship is formalised.", "kind": "design", "hint": "supplier_security", "prop": "UC-SUP-02", "reason": "best word match via atom NIST.GV.SC.06-a (due-diligence, relationship, cybersecurity, assessment)"}, {"id": "NIST.GV.SC.06.TC2", "stmt": "The due-diligence step includes planning for the relationship (e.g. defining the scope of access or data the supplier will have) as well as risk screening.", "kind": "design", "hint": "supplier_security", "prop": "UC-SUP-03", "reason": "best word match via atom NIST.GV.SC.06-b (relationship, will, scope, supplier)"}, {"id": "NIST.GV.SC.06.TC3", "stmt": "For a sample of suppliers onboarded in the period, due-diligence records (e.g. a completed questionnaire or assessment) exist and are dated before the relationship began.", "kind": "operating", "hint": "supplier_security (due-diligence records, sample)", "prop": "UC-SUP-02", "reason": "best word match via atom NIST.GV.SC.06-a (due-diligence, relationship, assessment, supplier)"}]}, {"id": "NIST.GV.SC.07", "fw": "nist_csf", "ref": "GV.SC-07", "title": "Supplier risk management over the relationship", "cands": [{"id": "UC-RSK-02", "title": "Risk treatment plan", "statement": "A treatment is chosen for each assessed risk, the controls needed are determined, and a risk treatment plan is formulated. The treatment plan is approved, and residual risk accepted, in writing by those accountable for each risk. The plan is kept as a record and updated after each assessment cycle.", "asks": ["b: The organization records a defined response to each supplier risk. (full)"], "primary": false}, {"id": "UC-SUP-01", "title": "Supplier inventory and risk tiering", "statement": "How suppliers are identified, rated for security risk and selected is defined. A register is kept of every supplier with access to the organization's information or systems, each with a risk rating, and it is reviewed on a defined cycle. This shows which suppliers matter most and where to focus oversight.", "asks": ["a: The organization records the risk and priority of each supplier and its products and services. (full)"], "primary": true}, {"id": "UC-SUP-05", "title": "Supplier service review", "statement": "Supplier services are reviewed at a defined interval set by risk tier, and again whenever the scope of service changes, such as new features, sub-processors or locations. Services that matter to the security program are always in scope, so externally provided services stay controlled. Each review checks the supplier against the agreed security terms, for example through assurance reports and service and incident performance, and is recorded. Proof is the review schedule and the review records, including reviews triggered by a change.", "asks": ["c: The organization reassesses supplier risk throughout the relationship, not only at onboarding. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.SC.07.TC1", "stmt": "A supplier risk register or equivalent records the risk posed by each active supplier and its products or services, and its priority.", "kind": "design", "hint": "supplier_security", "prop": "UC-SUP-01", "reason": "best word match via atom NIST.GV.SC.07-a (product, priority, servic, supplier)"}, {"id": "NIST.GV.SC.07.TC2", "stmt": "A defined response is recorded against each supplier's risk (e.g. mitigation asked of the supplier, or accepted risk with a named owner).", "kind": "design", "hint": "supplier_security", "prop": "UC-RSK-02", "reason": "best word match via atom NIST.GV.SC.07-b (response, supplier, risk, defin)"}, {"id": "NIST.GV.SC.07.TC3", "stmt": "At least one active supplier's risk was reassessed or reviewed after the relationship began, not only at onboarding, evidencing monitoring for as long as the relationship lasts.", "kind": "operating", "hint": "supplier_security (periodic review records)", "prop": "UC-SUP-05", "reason": "best word match via atom NIST.GV.SC.07-c (reassess, relationship, onboard, supplier)"}]}, {"id": "NIST.GV.SC.08", "fw": "nist_csf", "ref": "GV.SC-08", "title": "Suppliers in incident planning and recovery", "cands": [{"id": "UC-INC-01", "title": "Incident management plan and roles", "statement": "A written incident management procedure runs from detection through closure, including escalation steps, investigation and the handling of personal data breaches. Each incident role is assigned to a named person with contact details, and the plan names the third parties to coordinate with during an incident and how to reach them. The procedure and the role list prove it.", "asks": ["a: The incident response and recovery plans name the suppliers and third parties who take part and their roles. (partial)"], "primary": true}, {"id": "UC-INC-09", "title": "Incident plan communicated and exercised", "statement": "The incident plan and roles are communicated to the people who carry them out, for example by distribution, onboarding or training. The incident plan is exercised at least yearly, for example with a tabletop, so that people know what to do when an incident happens. Communication records and exercise reports prove it.", "asks": ["b: Relevant suppliers participate in incident exercises and real incidents. (partial)"], "primary": false}, {"id": "UC-INC-40", "title": "Third-party roles in incident planning and exercises", "statement": "The incident response and recovery plans name the suppliers and other third parties that take part, such as hosting providers or forensic firms, and state what each one does. The relevant suppliers are invited to incident exercises and involved in real incidents. Exercise and incident records show their participation. This makes sure outside parties act in step with the organization when an incident hits.", "asks": ["a: The incident response and recovery plans name the suppliers and third parties who take part and their roles. (full)", "b: Relevant suppliers participate in incident exercises and real incidents. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.SC.08.TC1", "stmt": "The incident response or recovery plan names which suppliers or other third parties are relevant participants and what role each plays.", "kind": "design", "hint": "breach_procedure; supplier_security", "prop": "UC-INC-40", "reason": "best word match via atom NIST.GV.SC.08-a (third, response, recovery, name); close call with UC-INC-01"}, {"id": "NIST.GV.SC.08.TC2", "stmt": "Records of at least one incident response exercise, tabletop or real incident in the period show a relevant supplier's participation.", "kind": "operating", "hint": "exercise_records; supplier_security", "prop": "UC-INC-40", "reason": "best word match via atom NIST.GV.SC.08-b (real, relevant, supplier, incident)"}]}, {"id": "NIST.GV.SC.09", "fw": "nist_csf", "ref": "GV.SC-09", "title": "Supply chain security across the life cycle", "cands": [{"id": "UC-RSK-41", "title": "Security and supplier risk in enterprise risk management", "statement": "Cybersecurity and supply chain risks sit in the same enterprise risk process and register as other enterprise risks. The risk assessment method explicitly covers supplier risk, and supply chain security practices are part of the wider risk program. Enterprise risk reports to top management include these risks. Proof is the register, the method and the latest risk report.", "asks": ["a: Supply chain security practices are part of the cybersecurity and enterprise risk programs. (full)"], "primary": true}, {"id": "UC-SUP-05", "title": "Supplier service review", "statement": "Supplier services are reviewed at a defined interval set by risk tier, and again whenever the scope of service changes, such as new features, sub-processors or locations. Services that matter to the security program are always in scope, so externally provided services stay controlled. Each review checks the supplier against the agreed security terms, for example through assurance reports and service and incident performance, and is recorded. Proof is the review schedule and the review records, including reviews triggered by a change.", "asks": ["b: The organization monitors supply chain security performance across the life cycle of products and services. (full)"], "primary": false}], "crits": [{"id": "NIST.GV.SC.09.TC1", "stmt": "Supply chain security requirements or practices are referenced within the cybersecurity risk management programme rather than run as a separate, unconnected process.", "kind": "design", "hint": "supplier_security; risk_management_strategy", "prop": "UC-RSK-41", "reason": "best word match via atom NIST.GV.SC.09-a (practic, supply, chain, cybersecurity)"}, {"id": "NIST.GV.SC.09.TC2", "stmt": "A recorded metric, review or audit shows supply chain security performance being tracked at more than one point in a supplier's product or service life cycle, e.g. at onboarding and again later.", "kind": "operating", "hint": "supplier_security (performance reviews)", "prop": "UC-SUP-05", "reason": "best word match via atom NIST.GV.SC.09-b (product, supply, life, chain)"}]}, {"id": "NIST.ID.AM.03", "fw": "nist_csf", "ref": "ID.AM-03", "title": "Network communication mapping", "cands": [{"id": "UC-AST-40", "title": "Data flow mapping", "statement": "Data flow diagrams exist for key systems and show how data moves between systems and across internal and external boundaries, including third parties. The diagrams are updated when a significant system or network change occurs and reviewed on a defined cycle. Proof is the dated diagrams and the network diagram of authorized communication paths.", "asks": ["b: The organization maintains data flow diagrams for key systems showing internal and external flows. (full)"], "primary": false}, {"id": "UC-NET-03", "title": "Network security management", "statement": "A network security standard is set and maintained, covering how networks and network devices are secured and managed, including device hardening, administrator access and encryption in transit. A current network diagram of the in-scope environment is kept, including cloud networks and links to third parties. Firewall and security group rules are reviewed on a defined cycle, and unneeded or overly permissive rules are removed. This limits the paths an attacker can use. Proof is the standard, the diagram and the rule review records.", "asks": ["a: The organization maintains network diagrams showing authorized communication paths, including external and third-party connections. (full)", "c: The organization documents the expected ports, protocols and services between authorized systems and keeps the diagrams current. (full)"], "primary": true}], "crits": [{"id": "NIST.ID.AM.03.TC1", "stmt": "A network diagram shows the authorised network communication paths, including connections to external networks and third parties.", "kind": "design", "hint": "network_security", "prop": "UC-NET-03", "reason": "best word match via atom NIST.ID.AM.03-a (connection, path, diagram, communic)"}, {"id": "NIST.ID.AM.03.TC2", "stmt": "Data flow diagrams for key systems show internal and external data flows.", "kind": "design", "hint": "network_security", "prop": "UC-AST-40", "reason": "best word match via atom NIST.ID.AM.03-b (diagram, key, flow, internal)"}, {"id": "NIST.ID.AM.03.TC3", "stmt": "The expected ports, protocols and services between authorised systems are documented.", "kind": "design", "hint": "network_security", "prop": "UC-NET-03", "reason": "best word match via atom NIST.ID.AM.03-c (protocol, port, between, expect)"}, {"id": "NIST.ID.AM.03.TC4", "stmt": "The diagrams are dated within the period or after the latest significant network change.", "kind": "operating", "hint": "network_security (version history)", "prop": "UC-NET-03", "reason": "best word match via atom NIST.ID.AM.03-a (diagram, network, latest, change); close call with UC-AST-40"}]}, {"id": "NIST.ID.AM.05", "fw": "nist_csf", "ref": "ID.AM-05", "title": "Asset prioritization", "cands": [{"id": "UC-AST-04", "title": "Information classification", "statement": "An information classification scheme sets levels and criteria for assigning them, based on confidentiality, integrity, availability and stakeholder needs. A level is assigned to each information asset in the inventory and reviewed when use or sensitivity changes. The scheme and the classified inventory are the proof.", "asks": ["a: The organization defines criteria for prioritizing assets by classification, criticality, resources and mission impact. (partial)"], "primary": true}, {"id": "UC-AST-41", "title": "Asset criticality and priority", "statement": "Every asset in the inventory is ranked by its criticality, the resources it needs and its impact on the mission, in addition to its classification. Written criteria set the ranking, the resulting priority is recorded on each asset, and priorities are reviewed on a defined cycle and after significant organizational change. This does not repeat the classification scheme. Proof is the criteria and the inventory with priorities.", "asks": ["a: The organization defines criteria for prioritizing assets by classification, criticality, resources and mission impact. (full)", "b: The organization assigns each asset a priority and reviews priorities periodically. (full)"], "primary": false}], "crits": [{"id": "NIST.ID.AM.05.TC1", "stmt": "Written criteria for prioritising assets consider classification, criticality, resources and mission impact.", "kind": "design", "hint": "asset_inventory", "prop": "UC-AST-41", "reason": "best word match via atom NIST.ID.AM.05-a (mission, criticality, resourc, classific)"}, {"id": "NIST.ID.AM.05.TC2", "stmt": "Assets in the inventory (or a sample) carry a priority or criticality rating.", "kind": "operating", "hint": "asset_inventory", "prop": "UC-AST-41", "reason": "best word match via atom NIST.ID.AM.05-a (criticality, asset, priority, carry)"}, {"id": "NIST.ID.AM.05.TC3", "stmt": "Asset priorities were reviewed in the period or after the latest significant organisational change.", "kind": "operating", "hint": "asset_inventory (version history)", "prop": "UC-AST-41", "reason": "best word match via atom NIST.ID.AM.05-b (priority, asset, review, history)"}]}, {"id": "NIST.ID.AM.07", "fw": "nist_csf", "ref": "ID.AM-07", "title": "Data inventory and classification", "cands": [{"id": "UC-AST-01", "title": "Asset inventory", "statement": "An inventory of information and associated assets, including hardware, software, systems, services such as cloud services, and data stores, is kept with a named owner for every entry. The data types that must be inventoried, such as personal, health, payment or proprietary data, are defined. For information, the inventory also records where it is held and its classification. It is updated whenever assets are added, changed or retired, and reconciled with live sources such as the cloud console and the device management tool on a defined cycle. The inventory and the reconciliation records are the proof.", "asks": ["a: The organization defines which data types it designates for inventory, such as personal, health, payment or proprietary data. (full)", "b: The data inventory records where each designated data type is held, who owns it and its classification. (full)", "d: The organization keeps the data inventory current. (full)"], "primary": true}, {"id": "UC-AST-04", "title": "Information classification", "statement": "An information classification scheme sets levels and criteria for assigning them, based on confidentiality, integrity, availability and stakeholder needs. A level is assigned to each information asset in the inventory and reviewed when use or sensitivity changes. The scheme and the classified inventory are the proof.", "asks": ["c: The organization maintains a classification scheme and labels designated data accordingly. (full)"], "primary": false}, {"id": "UC-AST-05", "title": "Information labeling", "statement": "The marking for each classification level on documents, systems and media is defined, and labels are applied as the procedure requires, supported by tool settings where available. The labelling procedure and a sample of labelled items are the proof.", "asks": ["c: The organization maintains a classification scheme and labels designated data accordingly. (full)"], "primary": false}], "crits": [{"id": "NIST.ID.AM.07.TC1", "stmt": "A list of designated data types exists (e.g. personal data, health data, payment data, intellectual property).", "kind": "design", "hint": "asset_inventory (data inventory)", "prop": "UC-AST-01", "reason": "best word match via atom NIST.ID.AM.07-a (health, payment, designat, type)"}, {"id": "NIST.ID.AM.07.TC2", "stmt": "The data inventory records, for each designated data type, where it is held and at least its owner and classification.", "kind": "design", "hint": "asset_inventory (data inventory)", "prop": "UC-AST-01", "reason": "best word match via atom NIST.ID.AM.07-b (designat, held, classific, type)"}, {"id": "NIST.ID.AM.07.TC3", "stmt": "A data classification scheme exists and designated data types are labelled or tagged with a classification.", "kind": "design", "hint": "asset_inventory; cryptography_policy", "prop": "UC-AST-01", "reason": "best word match via atom NIST.ID.AM.07-b (designat, classific, type, inventory); close call with UC-AST-05"}, {"id": "NIST.ID.AM.07.TC4", "stmt": "The data inventory shows updates during the period.", "kind": "operating", "hint": "asset_inventory (version history)", "prop": "UC-AST-01", "reason": "best word match via atom NIST.ID.AM.07-a (inventory, data, updat, asset)"}]}, {"id": "NIST.ID.AM.08", "fw": "nist_csf", "ref": "ID.AM-08", "title": "Asset life-cycle management", "cands": [{"id": "UC-AST-12", "title": "Sanitization before disposal or reuse", "statement": "Equipment and media holding data are checked, and data and licensed software are wiped or destroyed by an approved method, before disposal or reuse. Each wipe or destruction is verified, and wipe reports, destruction certificates or a disposal log are kept against the asset record.", "asks": ["c: The organization destroys data and sanitizes media when hardware is retired, reassigned or repaired, and records it. (full)"], "primary": false}, {"id": "UC-AST-42", "title": "Asset life cycle management", "statement": "Security procedures are documented for each stage of an asset life cycle: acquisition or deployment, change, and retirement. The procedures require assets to be built to a secure baseline before going live and require data destruction when hardware is retired, reassigned or sent for repair. Records show the procedures were followed. Proof is the procedures, build records and the disposal log.", "asks": ["a: The organization documents security procedures for each asset life cycle stage: acquisition or deployment, change and retirement. (full)"], "primary": true}, {"id": "UC-NET-02", "title": "Secure configuration baselines", "statement": "A secure configuration baseline is documented for each type of operating system, database, cloud account and network device in scope. Compliance scans or configuration monitoring compare live systems with the baselines, and drift is fixed. Each baseline is reviewed on its own defined cycle, and the version history shows it. This reduces weaknesses from default or drifting settings.", "asks": ["b: Assets are configured to a secure baseline before going live. (full)"], "primary": false}], "crits": [{"id": "NIST.ID.AM.08.TC1", "stmt": "Documented procedures cover security at each stage of the asset life cycle: acquisition or deployment, change, and retirement or disposal.", "kind": "design", "hint": "asset_inventory; configuration_baselines", "prop": "UC-AST-42", "reason": "best word match via atom NIST.ID.AM.08-a (retirement, deployment, acquisition, stage)"}, {"id": "NIST.ID.AM.08.TC2", "stmt": "A procedure requires secure data destruction and media sanitisation when hardware is retired, reassigned or sent for repair.", "kind": "design", "hint": "asset_inventory; physical_security", "prop": "UC-AST-12", "reason": "best word match via atom NIST.ID.AM.08-c (reassign, repair, retir, hardware)"}, {"id": "NIST.ID.AM.08.TC3", "stmt": "Disposal or sanitisation records exist for assets retired in the period.", "kind": "operating", "hint": "asset_inventory (disposal log)", "prop": "UC-AST-42", "reason": "best word match via atom NIST.ID.AM.08-a (asset, retir, disposal, log); close call with UC-AST-12"}, {"id": "NIST.ID.AM.08.TC4", "stmt": "For a sample of systems deployed in the period, build or change records show they were configured to baseline before going live.", "kind": "operating", "hint": "configuration_baselines; change records", "prop": "UC-NET-02", "reason": "best word match via atom NIST.ID.AM.08-b (going, baseline, live, configur)"}]}, {"id": "NIST.ID.RA.01", "fw": "nist_csf", "ref": "ID.RA-01", "title": "Vulnerability identification", "cands": [{"id": "UC-OPS-04", "title": "Vulnerability management", "statement": "A vulnerability management procedure names the sources of vulnerability information, how exposure is assessed and the fix deadlines by severity. In-scope systems are scanned, or equivalent assessments are run, on the cycle the procedure sets. Critical and high findings are fixed within the deadlines or carry a recorded risk acceptance. This closes known weaknesses before they are exploited. Proof is the procedure, scan reports and remediation tracking.", "asks": ["a: The organization documents a procedure for identifying, validating and recording vulnerabilities in assets. (full)", "b: The organization scans or assesses in-scope assets for vulnerabilities on a regular basis. (full)", "c: The organization records each vulnerability in a tracker with a status and an owner. (full)"], "primary": true}, {"id": "UC-SDC-06", "title": "Security testing and acceptance", "statement": "The security tests required at each stage of development, and the acceptance criteria that must be met before go-live, are defined. For new or significantly changed systems, test results and an acceptance sign-off are kept before production release. This confirms a system is safe to run before it handles real data. Proof is the test process and the test and acceptance records.", "asks": ["d: The organization tests or reviews in-house software for vulnerabilities. (full)"], "primary": false}], "crits": [{"id": "NIST.ID.RA.01.TC1", "stmt": "A vulnerability management procedure says how vulnerabilities in assets are identified (e.g. scanning, testing, advisories), validated and recorded.", "kind": "design", "hint": "vulnerability_management", "prop": "UC-OPS-04", "reason": "best word match via atom NIST.ID.RA.01-a (validat, vulnerability, asset, identify)"}, {"id": "NIST.ID.RA.01.TC2", "stmt": "Vulnerability scan or assessment reports from the period cover the in-scope assets.", "kind": "operating", "hint": "vulnerability_management (scan reports)", "prop": "UC-OPS-04", "reason": "best word match via atom NIST.ID.RA.01-b (scan, vulnerability, in-scope, asset)"}, {"id": "NIST.ID.RA.01.TC3", "stmt": "Identified vulnerabilities are recorded in a tracker with status and owner.", "kind": "operating", "hint": "vulnerability_management (tracker extract)", "prop": "UC-OPS-04", "reason": "best word match via atom NIST.ID.RA.01-c (tracker, vulnerability, statu, owner)"}, {"id": "NIST.ID.RA.01.TC4", "stmt": "In-house developed software was tested or reviewed for vulnerabilities in the period (e.g. code scanning, penetration test).", "kind": "operating", "hint": "sdlc_policy; vulnerability_management", "prop": "UC-SDC-06", "reason": "best word match via atom NIST.ID.RA.01-d (in-house, vulnerability, software, test)"}]}, {"id": "NIST.ID.RA.05", "fw": "nist_csf", "ref": "ID.RA-05", "title": "Risk determination", "cands": [{"id": "UC-RSK-01", "title": "Risk assessment method", "statement": "A repeatable risk assessment method is defined, with acceptance criteria and criteria for performing assessments. The method identifies risks to confidentiality, integrity and availability within scope, assigns risk owners, and ranks risks by likelihood and impact. It is kept as a documented procedure and reviewed on a defined cycle.", "asks": ["a: The risk methodology combines threat, vulnerability, likelihood and impact into an inherent risk rating. (full)", "b: Each recorded risk shows an inherent rating. (full)"], "primary": true}, {"id": "UC-RSK-02", "title": "Risk treatment plan", "statement": "A treatment is chosen for each assessed risk, the controls needed are determined, and a risk treatment plan is formulated. The treatment plan is approved, and residual risk accepted, in writing by those accountable for each risk. The plan is kept as a record and updated after each assessment cycle.", "asks": ["c: The organization uses the ratings to prioritize risk treatment and justifies departures in writing. (full)"], "primary": false}], "crits": [{"id": "NIST.ID.RA.05.TC1", "stmt": "The risk methodology combines threat, vulnerability, likelihood and impact to produce an inherent risk rating.", "kind": "design", "hint": "risk_assessment (methodology)", "prop": "UC-RSK-01", "reason": "best word match via atom NIST.ID.RA.05-a (inherent, combin, methodology, likelihood)"}, {"id": "NIST.ID.RA.05.TC2", "stmt": "The risk register shows an inherent risk rating for each risk.", "kind": "operating", "hint": "risk_assessment (risk register)", "prop": "UC-RSK-01", "reason": "best word match via atom NIST.ID.RA.05-b (inherent, rating, risk, show)"}, {"id": "NIST.ID.RA.05.TC3", "stmt": "Risk treatment priorities follow the ratings: the highest-rated risks are treated first, or any departure is justified in writing.", "kind": "operating", "hint": "risk_assessment (treatment plan)", "prop": "UC-RSK-02", "reason": "best word match via atom NIST.ID.RA.05-c (justify, writ, rating, treatment)"}]}, {"id": "NIST.ID.RA.06", "fw": "nist_csf", "ref": "ID.RA-06", "title": "Risk response selection", "cands": [{"id": "UC-GOV-41", "title": "Risk direction communicated to those who act on it", "statement": "The risk direction, the risk method, security roles and planned risk responses are delivered to the people who must act on them. Each item is sent by a defined channel when it is issued or changed. Proof of receipt is kept, such as distribution lists, acknowledgements or briefing records, and role holders confirm they understand their roles.", "asks": ["d: The organization communicates planned risk responses to affected stakeholders. (full)"], "primary": false}, {"id": "UC-RSK-02", "title": "Risk treatment plan", "statement": "A treatment is chosen for each assessed risk, the controls needed are determined, and a risk treatment plan is formulated. The treatment plan is approved, and residual risk accepted, in writing by those accountable for each risk. The plan is kept as a record and updated after each assessment cycle.", "asks": ["a: The organization requires a response decision for each risk, with criteria for choosing among accept, mitigate, transfer and avoid. (full)", "b: Each risk above tolerance has a recorded response, an owner and a target date. (full)"], "primary": true}, {"id": "UC-RSK-05", "title": "Risk treatment carried out", "statement": "The risk treatment plan is carried out and the results are kept. Each treatment action has an owner and due date. Progress is tracked and completion is evidenced.", "asks": ["c: The organization tracks progress on risk treatment. (full)"], "primary": false}], "crits": [{"id": "NIST.ID.RA.06.TC1", "stmt": "The risk procedure requires a response decision (accept, mitigate, transfer, avoid) for each risk, with criteria for choosing.", "kind": "design", "hint": "risk_assessment (methodology)", "prop": "UC-RSK-02", "reason": "best word match via atom NIST.ID.RA.06-a (mitigate, choos, avoid, transfer)"}, {"id": "NIST.ID.RA.06.TC2", "stmt": "Each risk above tolerance has a recorded response, owner and target date.", "kind": "operating", "hint": "risk_assessment (risk register)", "prop": "UC-RSK-02", "reason": "best word match via atom NIST.ID.RA.06-b (above, tolerance, target, response)"}, {"id": "NIST.ID.RA.06.TC3", "stmt": "Treatment progress is tracked: the register or plan of action shows status updates in the period.", "kind": "operating", "hint": "risk_assessment (treatment tracker)", "prop": "UC-RSK-05", "reason": "best word match via atom NIST.ID.RA.06-c (progres, treatment, track, risk)"}, {"id": "NIST.ID.RA.06.TC4", "stmt": "Planned risk responses were communicated to affected stakeholders (e.g. risk report to owners or leadership).", "kind": "operating", "hint": "leadership_oversight; risk_assessment", "prop": "UC-GOV-41", "reason": "best word match via atom NIST.ID.RA.06-d (respons, stakeholder, affect, communicat)"}]}, {"id": "NIST.ID.RA.07", "fw": "nist_csf", "ref": "ID.RA-07", "title": "Change and exception management", "cands": [{"id": "UC-RSK-42", "title": "Policy exceptions and time-limited risk acceptance", "statement": "Departures from policy are approved through a defined exception process. Each exception needs a recorded approval and an expiry or review date. An exception register holds each open exception with who is accountable for it and its review date, and each exception is recorded with how it was handled. Proof is the register and the approval records.", "asks": ["b: The organization runs an exception process for departures from policy, with approval and an expiry or review date. (full)", "c: The organization keeps an exception register with an owner and a review date for each open exception. (full)"], "primary": false}, {"id": "UC-SDC-09", "title": "Change management", "statement": "A change procedure for systems and facilities covers recording, impact and risk assessment, authorization, testing, rollback planning and communication. Each change is assessed for cybersecurity risk impact before approval and tracked to closure. Production changes are authorized before they are made, with testing evidence kept. Emergency changes are recorded and reviewed and approved afterward. Unintended changes are reviewed for their effect, and any harm is dealt with. This keeps changes from causing outages or security gaps. Proof is the procedure and the change records.", "asks": ["a: Changes are assessed for cybersecurity risk impact before approval and tracked to closure. (full)"], "primary": true}], "crits": [{"id": "NIST.ID.RA.07.TC1", "stmt": "A change management procedure requires that changes be assessed for their cybersecurity risk impact before approval.", "kind": "design", "hint": "change_management", "prop": "UC-SDC-09", "reason": "best word match via atom NIST.ID.RA.07-a (assess, impact, approval, cybersecurity)"}, {"id": "NIST.ID.RA.07.TC2", "stmt": "An exception (risk acceptance) process exists for departures from policy, with defined approval and an expiry or review date.", "kind": "design", "hint": "change_management", "prop": "UC-RSK-42", "reason": "best word match via atom NIST.ID.RA.07-b (expiry, departur, exception, approval)"}, {"id": "NIST.ID.RA.07.TC3", "stmt": "A sample of change records from the period shows the risk assessment step actually completed and the change tracked to closure.", "kind": "operating", "hint": "change_management (sample change records)", "prop": "UC-SDC-09", "reason": "best word match via atom NIST.ID.RA.07-a (closure, track, risk, step)"}, {"id": "NIST.ID.RA.07.TC4", "stmt": "The exception register shows open exceptions with a named owner and a review or expiry date, not open-ended waivers.", "kind": "operating", "hint": "change_management (exception register)", "prop": "UC-RSK-42", "reason": "best word match via atom NIST.ID.RA.07-c (open, exception, date, register)"}]}, {"id": "NIST.ID.IM.01", "fw": "nist_csf", "ref": "ID.IM-01", "title": "Improvement from evaluations", "cands": [{"id": "UC-GOV-19", "title": "Continual improvement", "statement": "The suitability, adequacy and effectiveness of the security program are continually improved. Improvement opportunities come from reviews, audits, incidents and measures. They are logged, prioritized, owned and tracked to completion.", "asks": ["b: Each evaluation produces a list of improvements with owners. (full)"], "primary": false}, {"id": "UC-RSK-09", "title": "Independent review of the security program", "statement": "Independent review of security is planned, including when it happens and what triggers an unscheduled review. An internal audit program takes account of how important the processes are and the results of earlier audits. Audits have defined criteria, scope and impartial auditors. Reviews are performed within the planned interval and results are reported to management, with evidence kept.", "asks": ["a: The organization schedules regular evaluations of its cybersecurity program, such as self-assessment or audit. (full)"], "primary": true}], "crits": [{"id": "NIST.ID.IM.01.TC1", "stmt": "The organisation has a schedule or requirement for evaluating its cybersecurity programme (self-assessment, internal audit or independent assessment).", "kind": "design", "hint": "exercise_records; leadership_oversight", "prop": "UC-RSK-09", "reason": "best word match via atom NIST.ID.IM.01-a (self-assessment, cybersecurity, audit, independent)"}, {"id": "NIST.ID.IM.01.TC2", "stmt": "At least one evaluation of the cybersecurity programme was completed in the period.", "kind": "operating", "hint": "exercise_records; audit reports", "prop": "UC-RSK-09", "reason": "best word match via atom NIST.ID.IM.01-a (evalu, cybersecurity, audit, report)"}, {"id": "NIST.ID.IM.01.TC3", "stmt": "The evaluation produced a documented list of improvements, each with an owner.", "kind": "operating", "hint": "exercise_records (improvement actions)", "prop": "UC-GOV-19", "reason": "best word match via atom NIST.ID.IM.01-b (evalu, produc, improvement, owner)"}]}, {"id": "NIST.ID.IM.02", "fw": "nist_csf", "ref": "ID.IM-02", "title": "Improvement from testing", "cands": [{"id": "UC-GOV-19", "title": "Continual improvement", "statement": "The suitability, adequacy and effectiveness of the security program are continually improved. Improvement opportunities come from reviews, audits, incidents and measures. They are logged, prioritized, owned and tracked to completion.", "asks": ["c: The organization assigns owners to those improvements and tracks them. (full)"], "primary": false}, {"id": "UC-GOV-42", "title": "Security test and exercise program", "statement": "A program of security tests and exercises, such as penetration tests, tabletop exercises and recovery tests, is planned and scheduled, and includes critical suppliers and relevant third parties where it matters. Each test or exercise produces a report that records the improvements identified. Each improvement has an owner and is tracked to closure. Proof is the plan, the reports and the action tracker.", "asks": ["a: The organization plans and schedules security tests and exercises. (full)", "b: Test and exercise reports record the improvements identified. (full)", "d: The organization involves critical suppliers and relevant third parties in tests and exercises. (full)"], "primary": true}], "crits": [{"id": "NIST.ID.IM.02.TC1", "stmt": "A plan or schedule exists for security tests and exercises (e.g. penetration tests, tabletop exercises, recovery tests).", "kind": "design", "hint": "exercise_records", "prop": "UC-GOV-42", "reason": "best word match via atom NIST.ID.IM.02-a (exercis, test, plan, security)"}, {"id": "NIST.ID.IM.02.TC2", "stmt": "Reports from tests or exercises in the period record the improvements identified.", "kind": "operating", "hint": "exercise_records", "prop": "UC-GOV-42", "reason": "best word match via atom NIST.ID.IM.02-b (exercise, improvement, identify, test)"}, {"id": "NIST.ID.IM.02.TC3", "stmt": "Improvement actions from tests and exercises have owners and a tracked status.", "kind": "operating", "hint": "exercise_records (action tracker)", "prop": "UC-GOV-42", "reason": "best word match via atom NIST.ID.IM.02-b (exercise, improvement, test, record)"}, {"id": "NIST.ID.IM.02.TC4", "stmt": "At least one test or exercise in the period involved a critical supplier or third party, or a record explains why none was needed.", "kind": "operating", "hint": "exercise_records", "prop": "UC-GOV-42", "reason": "best word match via atom NIST.ID.IM.02-d (involv, third, critical, party)"}]}, {"id": "NIST.ID.IM.03", "fw": "nist_csf", "ref": "ID.IM-03", "title": "Improvement from execution", "cands": [{"id": "UC-GOV-19", "title": "Continual improvement", "statement": "The suitability, adequacy and effectiveness of the security program are continually improved. Improvement opportunities come from reviews, audits, incidents and measures. They are logged, prioritized, owned and tracked to completion.", "asks": ["b: The organization turns lessons learned into updated policies, processes or procedures. (full)"], "primary": false}, {"id": "UC-INC-05", "title": "Learning from incidents", "statement": "Every significant incident gets a recorded post-incident review. The review produces control improvements, which are tracked through the change or risk process until each one is complete. This makes the organization less likely to repeat the same failure. The review records and the improvement tracker are the proof.", "asks": ["a: The organization captures lessons learned from operations and incidents through a defined review step. (full)"], "primary": true}], "crits": [{"id": "NIST.ID.IM.03.TC1", "stmt": "A process captures lessons learned from operations and incidents (e.g. a post-incident review step in the incident procedure).", "kind": "design", "hint": "breach_procedure; incident_log", "prop": "UC-INC-05", "reason": "best word match via atom NIST.ID.IM.03-a (captur, lesson, oper, learn)"}, {"id": "NIST.ID.IM.03.TC2", "stmt": "Post-incident or operational review records from the period list the improvements identified.", "kind": "operating", "hint": "incident_log (post-incident reports)", "prop": "UC-INC-05", "reason": "best word match via atom NIST.ID.IM.03-a (incident, review, post-incident, improvement)"}, {"id": "NIST.ID.IM.03.TC3", "stmt": "At least one policy, process or procedure was updated in the period to reflect a lesson learned.", "kind": "operating", "hint": "security_policy change log; incident_log", "prop": "UC-INC-05", "reason": "best word match via atom NIST.ID.IM.03-a (lesson, learn, incident, updat); close call with UC-GOV-19"}]}, {"id": "NIST.ID.IM.04", "fw": "nist_csf", "ref": "ID.IM-04", "title": "Incident response and operational cyber plans", "cands": [{"id": "UC-INC-01", "title": "Incident management plan and roles", "statement": "A written incident management procedure runs from detection through closure, including escalation steps, investigation and the handling of personal data breaches. Each incident role is assigned to a named person with contact details, and the plan names the third parties to coordinate with during an incident and how to reach them. The procedure and the role list prove it.", "asks": ["a: The organization maintains a written incident response plan naming roles, escalation steps and response phases. (full)"], "primary": true}, {"id": "UC-INC-05", "title": "Learning from incidents", "statement": "Every significant incident gets a recorded post-incident review. The review produces control improvements, which are tracked through the change or risk process until each one is complete. This makes the organization less likely to repeat the same failure. The review records and the improvement tracker are the proof.", "asks": ["d: The organization keeps the plans current and improves them based on exercises and incidents. (full)"], "primary": false}, {"id": "UC-INC-09", "title": "Incident plan communicated and exercised", "statement": "The incident plan and roles are communicated to the people who carry them out, for example by distribution, onboarding or training. The incident plan is exercised at least yearly, for example with a tabletop, so that people know what to do when an incident happens. Communication records and exercise reports prove it.", "asks": ["c: The organization communicates the plans to the people who would carry them out. (full)"], "primary": false}, {"id": "UC-RES-02", "title": "Recovery objectives and plans", "statement": "Recovery time and recovery point objectives are set for each critical IT service from a business impact analysis, and a recovery plan is kept for each of those services. The objectives and plans are updated when the analysis changes. This makes sure recovery work is aimed at what the business can least afford to lose. The impact analysis, the objectives table and the recovery plans are the proof.", "asks": ["b: The organization maintains other operational cybersecurity plans, such as business continuity and disaster recovery. (full)"], "primary": false}], "crits": [{"id": "NIST.ID.IM.04.TC1", "stmt": "A written incident response plan exists, naming roles, escalation steps and response phases.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-01", "reason": "best word match via atom NIST.ID.IM.04-a (phas, naming, escal, response)"}, {"id": "NIST.ID.IM.04.TC2", "stmt": "Other cybersecurity plans that affect operations (e.g. business continuity or disaster recovery) exist alongside the incident response plan.", "kind": "design", "hint": "breach_procedure; business_continuity", "prop": "UC-RES-02", "reason": "best word match via atom NIST.ID.IM.04-b (disaster, continuity, busines, cybersecurity)"}, {"id": "NIST.ID.IM.04.TC3", "stmt": "The plan(s) have been communicated to the people who would execute them (e.g. distributed, referenced in onboarding, or covered in training).", "kind": "design", "hint": "breach_procedure; training_records", "prop": "UC-INC-09", "reason": "best word match via atom NIST.ID.IM.04-c (would, communicat, people, plan)"}, {"id": "NIST.ID.IM.04.TC4", "stmt": "The plan carries a version history or review date showing it is kept current, not a one-time document.", "kind": "operating", "hint": "breach_procedure (version history)", "prop": "UC-INC-05", "reason": "best word match via atom NIST.ID.IM.04-d (current, plan, date, procedure); close call with UC-INC-01"}, {"id": "NIST.ID.IM.04.TC5", "stmt": "At least one improvement to the plan in the period traces to a lesson learned from an exercise or an incident.", "kind": "operating", "hint": "breach_procedure; exercise_records", "prop": "UC-INC-05", "reason": "best word match via atom NIST.ID.IM.04-d (incident, plan, trac, learn)"}]}, {"id": "NIST.PR.AA.01", "fw": "nist_csf", "ref": "PR.AA-01", "title": "Identity and credential management", "cands": [{"id": "UC-IAM-02", "title": "Identity life cycle", "statement": "Creation, change and removal of identities are managed, each identity is linked to one person or to an owned non-person account, and shared identities are controlled. Active accounts are reconciled against the HR roster on a defined cycle so departed staff have no active identity, and every service account has an assigned owner. Reconciliation records and the account list are the proof.", "asks": ["a: The organization manages the creation, change and revocation of identities and credentials for users, service accounts and devices. (full)", "d: The organization inventories non-human credentials such as service accounts, API keys, certificates and keys, each with an owner. (partial)"], "primary": true}, {"id": "UC-IAM-04", "title": "Access provisioning", "statement": "Access is requested and approved by someone with the authority to grant it before it is granted or changed, and in line with the access rules. Access is provisioned only against an approved request. Request tickets with approvals are the proof.", "asks": ["b: Access is approved before an account is created for a new joiner. (full)"], "primary": false}, {"id": "UC-IAM-06", "title": "Access removal on leaving or role change", "statement": "Access is removed or adjusted when people leave or change role, within the timeframe the policy sets. Each leaver or move is notified from the HR process, and the time access ended is recorded. Leaver lists and identity provider logs are the proof.", "asks": ["c: Leavers' accounts are disabled within the time the procedure sets. (full)"], "primary": false}, {"id": "UC-IAM-40", "title": "Non-human credential inventory", "statement": "An inventory of non-human credentials, such as service accounts, API keys, certificates and cryptographic keys, is kept with a named owner for each. The inventory is updated when a credential is created, changed or retired, and checked against live systems on a defined cycle. Proof is the inventory and the check records.", "asks": ["d: The organization inventories non-human credentials such as service accounts, API keys, certificates and keys, each with an owner. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.AA.01.TC1", "stmt": "An identity and access procedure covers creating, changing and revoking identities and credentials for users, service accounts and devices.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-02", "reason": "best word match via atom NIST.PR.AA.01-a (credential, identity, devic, service)"}, {"id": "NIST.PR.AA.01.TC2", "stmt": "For a sample of joiners in the period, access requests were approved before accounts were created.", "kind": "operating", "hint": "access_control_policy (access request tickets)", "prop": "UC-IAM-04", "reason": "best word match via atom NIST.PR.AA.01-b (joiner, creat, account, approv)"}, {"id": "NIST.PR.AA.01.TC3", "stmt": "For a sample of leavers in the period, accounts were disabled within the time the procedure sets.", "kind": "operating", "hint": "access_control_policy; hr_security (leaver list)", "prop": "UC-IAM-06", "reason": "best word match via atom NIST.PR.AA.01-c (disabl, leaver, time, account)"}, {"id": "NIST.PR.AA.01.TC4", "stmt": "Non-human credentials (service accounts, API keys, certificates, cryptographic keys) are inventoried, each with an owner.", "kind": "design", "hint": "access_control_policy; cryptography_policy", "prop": "UC-IAM-40", "reason": "best word match via atom NIST.PR.AA.01-d (non-human, api, certificat, keys)"}]}, {"id": "NIST.PR.AA.02", "fw": "nist_csf", "ref": "PR.AA-02", "title": "Identity proofing", "cands": [{"id": "UC-IAM-02", "title": "Identity life cycle", "statement": "Creation, change and removal of identities are managed, each identity is linked to one person or to an owned non-person account, and shared identities are controlled. Active accounts are reconciled against the HR roster on a defined cycle so departed staff have no active identity, and every service account has an assigned owner. Reconciliation records and the account list are the proof.", "asks": ["b: Each person has their own credential, and shared accounts are prohibited or allowed only by recorded exception. (full)"], "primary": false}, {"id": "UC-IAM-03", "title": "Credential issue, reset and revocation", "statement": "Issuing, resetting and revoking of authentication credentials such as passwords, tokens and keys are controlled by a procedure, with identity verified before any reset. Users receive written guidance on keeping credentials confidential, for example not sharing them and reporting suspected compromise. The procedure and the user guidance are the proof.", "asks": ["a: The organization verifies a person's identity before issuing credentials, with stronger proofing for higher-risk access. (partial)"], "primary": true}, {"id": "UC-IAM-41", "title": "Identity verification before credential issue", "statement": "A person's identity is verified before credentials are issued, with stronger proof for higher-risk access. Each person holds their own credential, with shared accounts allowed only by recorded exception. The verification evidence, such as an HR record or an identity check, is kept. Proof is the procedure and the evidence for new accounts.", "asks": ["a: The organization verifies a person's identity before issuing credentials, with stronger proofing for higher-risk access. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.AA.02.TC1", "stmt": "A procedure requires a person's identity to be verified (e.g. official ID checked at onboarding) before credentials are issued, with stronger checks where the access context warrants.", "kind": "design", "hint": "access_control_policy; hr_security", "prop": "UC-IAM-41", "reason": "best word match via atom NIST.PR.AA.02-a (stronger, credential, issu, identity); close call with UC-IAM-03"}, {"id": "NIST.PR.AA.02.TC2", "stmt": "Each person gets their own credential; shared accounts are prohibited or allowed only by recorded exception.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-02", "reason": "best word match via atom NIST.PR.AA.02-b (prohibit, credential, allow, own)"}, {"id": "NIST.PR.AA.02.TC3", "stmt": "For a sample of accounts created in the period, identity verification evidence exists (HR record or ID check).", "kind": "operating", "hint": "hr_security; access_control_policy", "prop": "UC-IAM-41", "reason": "best word match via atom NIST.PR.AA.02-a (identity, acces, verific, creat)"}]}, {"id": "NIST.PR.AA.05", "fw": "nist_csf", "ref": "PR.AA-05", "title": "Access permissions and authorizations", "cands": [{"id": "UC-IAM-01", "title": "Access control rules", "statement": "Written rules for physical and logical access to information and assets are set, based on business and security needs such as need-to-know and least privilege. The rules are applied in real access configurations through role-based groups and by avoiding shared admin accounts. The access policy and system access listings are the proof.", "asks": ["a: The organization defines access permissions and authorizations in a policy. (full)"], "primary": true}, {"id": "UC-IAM-04", "title": "Access provisioning", "statement": "Access is requested and approved by someone with the authority to grant it before it is granted or changed, and in line with the access rules. Access is provisioned only against an approved request. Request tickets with approvals are the proof.", "asks": ["b: The organization manages and enforces access permissions, including justification and ownership of privileged accounts. (full)"], "primary": false}, {"id": "UC-IAM-05", "title": "Periodic access review", "statement": "Access rights for in-scope systems are reviewed on a defined cycle, and access that is no longer appropriate is removed. Each review records what was checked, the decisions and the removals, and completion of removals is confirmed. Completed review records are the proof.", "asks": ["c: The organization reviews access periodically and removes access that is no longer needed. (full)"], "primary": false}, {"id": "UC-IAM-07", "title": "Segregation of duties", "statement": "Duties that conflict, such as requesting and approving access, or developing and deploying to production, are identified and held by different people. System roles or approval workflows enforce the separation. Where it is not feasible, a compensating measure such as monitoring or supervisory review is documented. The conflict list and role assignments are the proof.", "asks": ["e: The organization separates conflicting duties. (full)"], "primary": false}, {"id": "UC-IAM-09", "title": "Information access restriction", "statement": "Access controls are configured in each system by role or group so users reach only the information and functions their role allows, in line with the access rules. Sampled users are tested to confirm they cannot go beyond their role. Role matrices and test results are the proof.", "asks": ["d: The organization grants access on the least privilege principle. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.AA.05.TC1", "stmt": "An access control policy requires access to be granted on least privilege.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-09", "reason": "best word match via atom NIST.PR.AA.05-d (privilege, grant, acces, control)"}, {"id": "NIST.PR.AA.05.TC2", "stmt": "The policy names conflicting duties that must be separated.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-07", "reason": "best word match via atom NIST.PR.AA.05-e (conflict, separat, duti, acces)"}, {"id": "NIST.PR.AA.05.TC3", "stmt": "User access reviews were completed in the period for in-scope systems, and the removal of unneeded access is recorded.", "kind": "operating", "hint": "access_control_policy (access review records)", "prop": "UC-IAM-05", "reason": "best word match via atom NIST.PR.AA.05-c (acces, review, removal, complet)"}, {"id": "NIST.PR.AA.05.TC4", "stmt": "Each privileged account in a sample belongs to a named person and has an approved justification.", "kind": "operating", "hint": "access_control_policy (privileged account list)", "prop": "UC-IAM-04", "reason": "best word match via atom NIST.PR.AA.05-b (justific, privileg, account, acces)"}]}, {"id": "NIST.PR.AA.06", "fw": "nist_csf", "ref": "PR.AA-06", "title": "Physical access management", "cands": [{"id": "UC-PHY-02", "title": "Physical entry and visitor control", "statement": "Entry to each secure area is controlled through locks, badge readers or reception checks, with written rules on who may enter. Entry rules are stricter for areas holding higher-risk assets. Every visitor is recorded and escorted where the rules require. Visitor logs and access system records prove that only authorized people and recorded visitors enter.", "asks": ["a: The organization sets physical access controls for facilities holding assets, stricter where risk is higher. (full)"], "primary": true}, {"id": "UC-PHY-04", "title": "Physical security monitoring", "statement": "Monitoring for unauthorized physical access to premises is in place, using CCTV, intruder alarms or guards, with a defined response when an alert fires. The monitoring systems work throughout the period and are tested on a defined cycle. Alert and test records show that monitoring ran and that alerts were acted on.", "asks": ["b: The organization monitors physical access through logs or visitor records and reviews them. (full)"], "primary": false}, {"id": "UC-PHY-13", "title": "Physical access rights review and leaver removal", "statement": "Who holds physical access to secure areas is reviewed on a defined cycle, and any access no longer needed is removed. When a person leaves, their badges and keys are deactivated or collected and the removal is recorded. Review records and leaver removal records prove that access rights stay current.", "asks": ["c: The organization reviews physical access rights periodically and withdraws badges or keys from leavers. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.AA.06.TC1", "stmt": "A physical security procedure sets access controls (e.g. badges, locks) for facilities holding assets, with stricter controls for high-risk areas.", "kind": "design", "hint": "physical_security (or data-centre provider attestation for cloud-hosted assets)", "prop": "UC-PHY-02", "reason": "best word match via atom NIST.PR.AA.06-a (stricter, facility, physical, asset)"}, {"id": "NIST.PR.AA.06.TC2", "stmt": "Physical access logs or visitor records for the period exist and were reviewed.", "kind": "operating", "hint": "physical_security (access logs, visitor register)", "prop": "UC-PHY-04", "reason": "best word match via atom NIST.PR.AA.06-b (visitor, physical, logs, acces)"}, {"id": "NIST.PR.AA.06.TC3", "stmt": "Physical access rights were reviewed in the period, and leavers' badges or keys were withdrawn.", "kind": "operating", "hint": "physical_security; hr_security", "prop": "UC-PHY-13", "reason": "best word match via atom NIST.PR.AA.06-c (badg, keys, leaver, physical)"}]}, {"id": "NIST.PR.DS.01", "fw": "nist_csf", "ref": "PR.DS-01", "title": "Data-at-rest protection", "cands": [{"id": "UC-AST-11", "title": "Storage media management", "statement": "Storage media are managed through acquisition, use, transport, storage and disposal according to classification and handling rules. Technical controls restrict or encrypt removable media on endpoints as the procedure requires. The media handling procedure and endpoint policy settings are the proof.", "asks": ["c: The organization restricts the use of removable media. (full)"], "primary": false}, {"id": "UC-CRY-01", "title": "Use of encryption", "statement": "Where encryption is required, by classification and for data at rest and in transit, and which methods are approved are defined. Encryption is configured on data stores, endpoints and transport as the rules require. The cryptography policy and configuration exports are the proof.", "asks": ["a: The organization sets protection requirements for stored data according to its classification. (full)", "b: The organization encrypts sensitive data at rest, including backups, and endpoint disks. (full)"], "primary": true}], "crits": [{"id": "NIST.PR.DS.01.TC1", "stmt": "A documented standard sets protection requirements for stored data according to its classification.", "kind": "design", "hint": "cryptography_policy", "prop": "UC-CRY-01", "reason": "best word match via atom NIST.PR.DS.01-a (accord, classific, stor, protection)"}, {"id": "NIST.PR.DS.01.TC2", "stmt": "The standard requires encryption at rest for sensitive data (databases, storage, backups) and full-disk encryption on endpoints.", "kind": "design", "hint": "cryptography_policy", "prop": "UC-CRY-01", "reason": "best word match via atom NIST.PR.DS.01-b (rest, endpoint, backup, sensitive)"}, {"id": "NIST.PR.DS.01.TC3", "stmt": "Configuration evidence (storage or database encryption settings, device-management encryption report) shows encryption at rest enabled for sampled data stores and endpoints.", "kind": "operating", "hint": "cryptography_policy; configuration export", "prop": "UC-CRY-01", "reason": "best word match via atom NIST.PR.DS.01-b (rest, endpoint, data, cryptography)"}, {"id": "NIST.PR.DS.01.TC4", "stmt": "Use of removable media is restricted by policy and technical control.", "kind": "design", "hint": "cryptography_policy; configuration_baselines", "prop": "UC-AST-11", "reason": "best word match via atom NIST.PR.DS.01-c (removable, restrict, media, use)"}]}, {"id": "NIST.PR.DS.02", "fw": "nist_csf", "ref": "PR.DS-02", "title": "Data-in-transit protection", "cands": [{"id": "UC-AST-10", "title": "Data leakage prevention", "statement": "The sensitive information that could leak and the channels it could leak through, such as email, uploads, removable media and printing, are identified. Leakage prevention measures are configured on those channels, and alerts are reviewed and acted on. Configuration exports and the alert review log are the proof.", "asks": ["b: The organization blocks sensitive data from leaving through email or personal services. (full)"], "primary": false}, {"id": "UC-CRY-01", "title": "Use of encryption", "statement": "Where encryption is required, by classification and for data at rest and in transit, and which methods are approved are defined. Encryption is configured on data stores, endpoints and transport as the rules require. The cryptography policy and configuration exports are the proof.", "asks": ["a: The organization requires protection of data in transit, such as current TLS with valid certificates. (full)"], "primary": true}, {"id": "UC-SDC-10", "title": "Test data protection", "statement": "Rules for selecting and using test data require production or personal data to be masked or explicitly authorized before it is used in testing. Any copy of production data into a test environment has an authorization record and is deleted after testing. This keeps real data out of weakly protected test sy
