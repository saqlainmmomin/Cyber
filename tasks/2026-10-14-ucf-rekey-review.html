ose ends or consent is withdrawn. (full)"], "primary": false}, {"id": "UC-AST-71", "title": "Personal data retention schedule", "statement": "A documented retention schedule sets, for each category of personal data and each purpose, a retention period or an erasure trigger. Where the schedule keeps data beyond its purpose, it names the law that requires it. Retention and deletion settings on systems holding personal data are checked on a defined cycle to match the schedule. Proof is the schedule and the system setting checks.", "asks": ["a: Maintain a documented retention schedule that sets a period or erasure trigger for each data category or purpose. (full)", "d: Check that retention and deletion settings on systems holding personal data match the schedule. (full)"], "primary": true}, {"id": "UC-OPS-01", "title": "Event logging", "statement": "The security-relevant events each type of system must log, such as authentication, privileged actions, errors and security events, and how long logs are kept, are defined. Systems produce those logs and forward them to central storage, and the source list is kept current. This gives the organization a reliable record for detection and investigation. Proof is the logging standard, the source list and sample logs.", "asks": ["c: Retain personal data, traffic data and processing logs for at least the minimum period the Rules require before erasure. (partial)"], "primary": false}, {"id": "UC-OPS-70", "title": "Personal data access logging and review", "statement": "Access to personal data is logged, and those logs are reviewed on a defined cycle so unauthorized access is detected, investigated and fixed. The access logs, the related traffic data and the personal data needed to investigate unauthorized access are kept for at least one year, unless another law requires longer. Retention settings on systems are checked against that minimum. Proof is the review records, the alert tickets and the retention settings.", "asks": ["c: Retain personal data, traffic data and processing logs for at least the minimum period the Rules require before erasure. (full)"], "primary": false}], "crits": [{"id": "CH2.MINIMIZE.3.TC1", "stmt": "A retention schedule sets a retention period or erasure trigger for each personal data category or processing purpose.", "kind": "design", "hint": "retention_policy", "prop": "UC-AST-71", "reason": "best word match via atom CH2.MINIMIZE.3-a (erasure, category, retention, trigger)"}, {"id": "CH2.MINIMIZE.3.TC2", "stmt": "Where the schedule keeps data after its purpose is served, it names the law that requires the retention.", "kind": "design", "hint": "retention_policy", "prop": "UC-AST-71", "reason": "best word match via atom CH2.MINIMIZE.3-a (retention, schedule, purpose, data)"}, {"id": "CH2.MINIMIZE.3.TC3", "stmt": "No schedule period erases personal data, associated traffic data or processing logs sooner than one year after the processing, unless another law requires otherwise.", "kind": "design", "hint": "retention_policy", "prop": "UC-OPS-70", "reason": "best word match via atom CH2.MINIMIZE.3-c (traffic, logs, process, personal)"}, {"id": "CH2.MINIMIZE.3.TC4", "stmt": "Retention or deletion settings on a sample of systems holding personal data match the schedule's periods.", "kind": "operating", "hint": "retention_policy; system configuration screenshots", "prop": "UC-AST-71", "reason": "best word match via atom CH2.MINIMIZE.3-d (deletion, retention, schedule, sett)"}]}, {"id": "CH2.SECURITY.1", "fw": "dpdpa", "ref": "Section 8(5)", "title": "Reasonable security safeguards implemented", "cands": [{"id": "UC-GOV-04", "title": "Security management system operated", "statement": "A security management system is established, run and maintained, with defined processes and the way they interact. Each process has an assigned owner, and a check on a defined cycle confirms the system is running and being improved. Proof is a process map, owner list and review records.", "asks": ["a: Implement reasonable technical safeguards to protect personal data and prevent breaches. (partial)", "b: Implement reasonable organizational safeguards to protect personal data and prevent breaches. (partial)"], "primary": false}, {"id": "UC-GOV-70", "title": "Personal data inside security coverage", "statement": "The security policies and safeguards cover all personal data the organization holds or controls, including data that other parties process on its behalf. A scope statement names the personal data stores and processors in coverage and is checked against the data inventory whenever systems or processors change. Technical and organizational safeguards are applied to everything in that scope. Proof is the policy scope, the scope statement and the check records.", "asks": ["a: Implement reasonable technical safeguards to protect personal data and prevent breaches. (full)", "b: Implement reasonable organizational safeguards to protect personal data and prevent breaches. (full)"], "primary": true}, {"id": "UC-OPS-01", "title": "Event logging", "statement": "The security-relevant events each type of system must log, such as authentication, privileged actions, errors and security events, and how long logs are kept, are defined. Systems produce those logs and forward them to central storage, and the source list is kept current. This gives the organization a reliable record for detection and investigation. Proof is the logging standard, the source list and sample logs.", "asks": ["a: Implement reasonable technical safeguards to protect personal data and prevent breaches. (partial)"], "primary": false}, {"id": "UC-OPS-70", "title": "Personal data access logging and review", "statement": "Access to personal data is logged, and those logs are reviewed on a defined cycle so unauthorized access is detected, investigated and fixed. The access logs, the related traffic data and the personal data needed to investigate unauthorized access are kept for at least one year, unless another law requires longer. Retention settings on systems are checked against that minimum. Proof is the review records, the alert tickets and the retention settings.", "asks": ["a: Implement reasonable technical safeguards to protect personal data and prevent breaches. (full)"], "primary": false}, {"id": "UC-RES-04", "title": "Backup operation", "statement": "A backup policy sets scope, frequency, retention, storage location and protection, including offsite or isolated copies. Backups run as the policy requires, and every failure is investigated. This keeps recoverable copies of data available after loss or attack. The backup policy and the backup job logs are the proof.", "asks": ["a: Implement reasonable technical safeguards to protect personal data and prevent breaches. (partial)"], "primary": false}], "crits": [{"id": "CH2.SECURITY.1.TC1", "stmt": "The security policy covers all personal data the organisation holds or controls, including data processed for it by Data Processors.", "kind": "design", "hint": "security_policy", "prop": "UC-GOV-70", "reason": "best word match via atom CH2.SECURITY.1-a (personal, data, processor, hold)"}, {"id": "CH2.SECURITY.1.TC2", "stmt": "Access to personal data is logged, and the logs are monitored and reviewed so unauthorised access can be detected, investigated and remediated.", "kind": "design", "hint": "logging_monitoring; security_policy", "prop": "UC-OPS-70", "reason": "best word match via atom CH2.SECURITY.1-a (personal, data, investigat, detect)"}, {"id": "CH2.SECURITY.1.TC3", "stmt": "Backups or equivalent measures let processing continue if personal data is destroyed or access to it is lost.", "kind": "design", "hint": "backup; business continuity plan", "prop": "UC-OPS-70", "reason": "best word match via atom CH2.SECURITY.1-a (personal, data, acces); close call with UC-RES-04"}, {"id": "CH2.SECURITY.1.TC4", "stmt": "Access logs and the personal data needed to investigate unauthorised access are kept for at least one year, unless another law requires otherwise.", "kind": "design", "hint": "logging_monitoring; retention_policy", "prop": "UC-OPS-70", "reason": "best word match via atom CH2.SECURITY.1-a (personal, data, investigate, another)"}, {"id": "CH2.SECURITY.1.TC5", "stmt": "Log-review records for the period show that reviews of access to personal data actually took place and anomalies were followed up.", "kind": "operating", "hint": "logging_monitoring (review records, SIEM alert tickets)", "prop": "UC-OPS-70", "reason": "best word match via atom CH2.SECURITY.1-a (personal, data, anomaly, took)"}]}, {"id": "CH2.SECURITY.2", "fw": "dpdpa", "ref": "Section 8(5); DPDP Rules 2025 r.6(1)(a)-(b)", "title": "Encryption and access controls", "cands": [{"id": "UC-CRY-01", "title": "Use of encryption", "statement": "Where encryption is required, by classification and for data at rest and in transit, and which methods are approved are defined. Encryption is configured on data stores, endpoints and transport as the rules require. The cryptography policy and configuration exports are the proof.", "asks": ["a: Encrypt personal data at rest. (full)", "b: Encrypt personal data in transit. (full)"], "primary": true}, {"id": "UC-IAM-09", "title": "Information access restriction", "statement": "Access controls are configured in each system by role or group so users reach only the information and functions their role allows, in line with the access rules. Sampled users are tested to confirm they cannot go beyond their role. Role matrices and test results are the proof.", "asks": ["c: Restrict access to personal data to authorized personnel on a least-privilege basis. (full)"], "primary": false}], "crits": [{"id": "CH2.SECURITY.2.TC1", "stmt": "Personal data is protected by at least one of encryption, obfuscation, masking or tokenisation.", "kind": "design", "hint": "cryptography_policy; security_policy", "prop": "UC-CRY-01", "reason": "best word match via atom CH2.SECURITY.2-a (personal, data, cryptography, encryption)"}, {"id": "CH2.SECURITY.2.TC2", "stmt": "Personal data sent over networks is encrypted in transit.", "kind": "design", "hint": "cryptography_policy; security_policy", "prop": "UC-CRY-01", "reason": "best word match via atom CH2.SECURITY.2-b (transit, encrypt, personal, data)"}, {"id": "CH2.SECURITY.2.TC3", "stmt": "Access to the computer resources holding personal data is restricted to authorised users through defined access controls.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-09", "reason": "best word match via atom CH2.SECURITY.2-c (restrict, personal, acces, data)"}, {"id": "CH2.SECURITY.2.TC4", "stmt": "Access rights to personal data are granted on a least-privilege, need-to-know basis.", "kind": "design", "hint": "access_control_policy", "prop": "UC-IAM-09", "reason": "best word match via atom CH2.SECURITY.2-c (least-privilege, basi, personal, acces)"}, {"id": "CH2.SECURITY.2.TC5", "stmt": "An access review of systems holding personal data was completed in the last 12 months and removed access no longer needed.", "kind": "operating", "hint": "access_control_policy (access review records)", "prop": "UC-IAM-09", "reason": "best word match via atom CH2.SECURITY.2-c (personal, acces, data, control)"}]}, {"id": "CH2.SECURITY.3", "fw": "dpdpa", "ref": "Section 8(2)", "title": "Data Processor contractual safeguards", "cands": [{"id": "UC-SUP-03", "title": "Supplier security agreements", "statement": "A standard set of supplier security clauses is kept, varying by supplier type or risk tier, and the agreed terms are in each contract, especially with high-risk suppliers. Each agreement states the scope of access and data granted to the supplier. Typical terms also cover confidentiality, incident notification within a stated time, audit rights, rules for sharing and reporting security information, and return or deletion of information at exit. Signed contracts prove it.", "asks": ["a: Hold a valid written contract with every data processor that handles personal data for the organization. (partial)", "b: Require each processor by contract to implement appropriate security safeguards. (full)", "c: Require each processor by contract to process personal data only on the organization's instructions. (partial)"], "primary": false}, {"id": "UC-SUP-70", "title": "Processor contract terms for personal data", "statement": "Every party that processes personal data for the organization is bound by a signed contract on file before processing starts. The contract limits the party to the organization's instructions and requires it to stop processing and erase the data when instructed. The processor register is reconciled with the contracts on file on a defined cycle. Proof is the processor register and the signed contracts.", "asks": ["a: Hold a valid written contract with every data processor that handles personal data for the organization. (full)", "c: Require each processor by contract to process personal data only on the organization's instructions. (full)"], "primary": true}], "crits": [{"id": "CH2.SECURITY.3.TC1", "stmt": "Every Data Processor that processes personal data for the organisation is engaged under a signed contract.", "kind": "design", "hint": "vendor_agreements", "prop": "UC-SUP-70", "reason": "best word match via atom CH2.SECURITY.3-a (processor, contract, personal, every)"}, {"id": "CH2.SECURITY.3.TC2", "stmt": "Each Data Processor contract requires the processor to take reasonable security safeguards.", "kind": "design", "hint": "vendor_agreements", "prop": "UC-SUP-03", "reason": "best word match via atom CH2.SECURITY.3-b (safeguard, processor, contract, security)"}, {"id": "CH2.SECURITY.3.TC3", "stmt": "Each Data Processor contract requires the processor to stop processing and to erase personal data when the organisation instructs it to.", "kind": "design", "hint": "vendor_agreements", "prop": "UC-SUP-70", "reason": "best word match via atom CH2.SECURITY.3-a (processor, contract, personal, data)"}, {"id": "CH2.SECURITY.3.TC4", "stmt": "Each Data Processor contract limits the processor to processing on the organisation's behalf and instructions.", "kind": "design", "hint": "vendor_agreements", "prop": "UC-SUP-70", "reason": "best word match via atom CH2.SECURITY.3-c (instruction, processor, contract, data)"}, {"id": "CH2.SECURITY.3.TC5", "stmt": "Every processor in the organisation's processor/vendor register has a current signed contract on file (sample reconciliation).", "kind": "operating", "hint": "vendor_agreements; processor register", "prop": "UC-SUP-70", "reason": "best word match via atom CH2.SECURITY.3-a (processor, contract, every, reconcili)"}]}, {"id": "CH3.ACCESS.1", "fw": "dpdpa", "ref": "Section 11(1)", "title": "Summary of personal data and processing activities", "cands": [{"id": "UC-PRT-01", "title": "Channel for rights requests", "statement": "The means by which people can ask for access, correction, completion or erasure of their personal data, and the identifier they must give, are published. The published means are checked after each change to the website, the app or the request process. This gives people a route to use their rights. The published pages and the request intake form are the proof.", "asks": ["a: Publish how a data principal can request information about their personal data and what identifier to give. (full)"], "primary": false}, {"id": "UC-PRT-02", "title": "Summary of data and processing on request", "statement": "Each access request is answered with a summary of the personal data processed, the processing activities and the other fiduciaries and processors the data was shared with, including what was shared. A response template is used and a request log is kept. This lets people see how their data is used. The log and the sample responses are the proof.", "asks": ["b: Provide on request a summary of the personal data being processed. (full)", "c: Provide on request a summary of the processing activities carried out on that data. (full)", "d: Identify on request the other data fiduciaries and processors the data was shared with and what was shared. (full)"], "primary": true}], "crits": [{"id": "CH3.ACCESS.1.TC1", "stmt": "The website or app publishes how a data principal can request information about her personal data and which identifier she must give.", "kind": "design", "hint": "privacy_policy", "prop": "UC-PRT-01", "reason": "best word match via atom CH3.ACCESS.1-a (identifier, about, publish, give)"}, {"id": "CH3.ACCESS.1.TC2", "stmt": "The access-request response template includes a summary of the personal data processed and of the processing activities.", "kind": "design", "hint": "access request procedure; response template", "prop": "UC-PRT-02", "reason": "best word match via atom CH3.ACCESS.1-c (summary, activity, request, process)"}, {"id": "CH3.ACCESS.1.TC3", "stmt": "The response template names all other Data Fiduciaries and Data Processors the data was shared with and describes what was shared (subject to the s.11(2) law-enforcement carve-out).", "kind": "design", "hint": "access request procedure; response template; vendor_agreements", "prop": "UC-PRT-02", "reason": "best word match via atom CH3.ACCESS.1-d (fiduciary, processor, shar, request)"}, {"id": "CH3.ACCESS.1.TC4", "stmt": "Sampled access requests in the period received a response containing the data summary and the recipient information.", "kind": "operating", "hint": "access request log; sample responses", "prop": "UC-PRT-02", "reason": "best word match via atom CH3.ACCESS.1-b (summary, request, data, respons)"}]}, {"id": "CH3.CORRECT.2", "fw": "dpdpa", "ref": "Section 12(3)", "title": "Mechanism for erasure of personal data", "cands": [{"id": "UC-AST-08", "title": "Information deletion", "statement": "The point at which information must be deleted from systems, devices and media once it is no longer needed, and the method of deletion, are defined. Information is deleted on that schedule, using automated jobs or manual steps, and deletion logs or supplier confirmations are kept as proof.", "asks": ["b: Erase the data on request unless retention is necessary for the specified purpose or to comply with law. (partial)"], "primary": false}, {"id": "UC-AST-70", "title": "Erasure of personal data when no longer needed", "statement": "Personal data is erased, and the parties processing it for the organization erase it, once its purpose is served, consent is withdrawn or erasure is requested, unless a legal ground to keep it applies. Automated or systematic erasure runs on those triggers, and processors are told to erase whatever was made available to them. Where the organization is a large e-commerce, social media or online gaming intermediary of the kind the law names, a user's data is also erased after three years without contact, and the data principal is warned at least 48 hours before. Proof is erasure job logs, erasure records and the request log.", "asks": ["b: Erase the data on request unless retention is necessary for the specified purpose or to comply with law. (full)"], "primary": false}, {"id": "UC-PRT-01", "title": "Channel for rights requests", "statement": "The means by which people can ask for access, correction, completion or erasure of their personal data, and the identifier they must give, are published. The published means are checked after each change to the website, the app or the request process. This gives people a route to use their rights. The published pages and the request intake form are the proof.", "asks": ["a: Let data principals request erasure of the personal data they gave consent for, at any time. (full)"], "primary": false}, {"id": "UC-PRT-04", "title": "Erasure on request", "statement": "A person's personal data is erased when they ask, and processors erase it too, unless keeping it is necessary for the purpose or the law requires it. The outcome of each request is recorded, either as proof of erasure or as the ground for keeping. This honors the person's right to have data removed. The request log and erasure records are the proof.", "asks": ["b: Erase the data on request unless retention is necessary for the specified purpose or to comply with law. (full)"], "primary": true}], "crits": [{"id": "CH3.CORRECT.2.TC1", "stmt": "The website or app publishes a means for data principals to request erasure of their personal data.", "kind": "design", "hint": "privacy_policy; grievance_mechanism", "prop": "UC-PRT-01", "reason": "best word match via atom CH3.CORRECT.2-a (erasure, principal, request, personal)"}, {"id": "CH3.CORRECT.2.TC2", "stmt": "The procedure erases personal data on request unless retention is necessary for the specified purpose or required by law.", "kind": "design", "hint": "rights request procedure; retention_policy", "prop": "UC-PRT-04", "reason": "best word match via atom CH3.CORRECT.2-b (necessary, unles, specify, retention); close call with UC-AST-70"}, {"id": "CH3.CORRECT.2.TC3", "stmt": "An accepted erasure request also triggers erasure at the Data Processors holding that data.", "kind": "design", "hint": "rights request procedure; vendor_agreements", "prop": "UC-PRT-01", "reason": "best word match via atom CH3.CORRECT.2-a (erasure, request, data, right); close call with UC-AST-70"}, {"id": "CH3.CORRECT.2.TC4", "stmt": "Each sampled erasure request in the period was closed either with evidence of erasure or with a recorded retention ground.", "kind": "operating", "hint": "rights request log; erasure records", "prop": "UC-PRT-04", "reason": "best word match via atom CH3.CORRECT.2-b (retention, request, either, erasure)"}]}, {"id": "CH4.CHILD.3", "fw": "dpdpa", "ref": "Section 9", "title": "Age verification mechanism", "cands": [{"id": "UC-PSC-01", "title": "Age verification", "statement": "Onboarding determines whether a user is a child, meaning a person under 18, before the organization processes the user's data beyond what that check needs. The result of the age declaration or check is stored against the account, and accounts identified as a child's are flagged so the child protections apply. A sample of onboarding records is reviewed on a defined cycle. Proof is the onboarding design and the sampled account records.", "asks": ["a: Verify the age of users in order to identify children. (full)"], "primary": true}, {"id": "UC-PSC-02", "title": "Verifiable guardian consent", "statement": "Verifiable consent is obtained from a parent before a child's personal data is processed, or from a lawfully appointed guardian for a person with a disability, and the consent is recorded before the data is first processed. The person consenting is checked to be an identifiable adult, using details already reliably held or details from an authorized identity source. For a guardian, the appointment by a court or a designated authority is checked. Proof is the consent and verification records.", "asks": ["b: Apply the child protections, including parental consent, to every user identified as a child. (full)"], "primary": false}], "crits": [{"id": "CH4.CHILD.3.TC1", "stmt": "Onboarding determines whether the user is a child (under 18) before processing her data beyond what that check needs.", "kind": "design", "hint": "age_verification", "prop": "UC-PSC-01", "reason": "best word match via atom CH4.CHILD.3-a (age, user, beyond, child)"}, {"id": "CH4.CHILD.3.TC2", "stmt": "Accounts identified as a child's are flagged so the parental-consent, tracking and targeted-advertising restrictions apply to them.", "kind": "design", "hint": "age_verification; parental_consent", "prop": "UC-PSC-02", "reason": "best word match via atom CH4.CHILD.3-b (parental, child, consent, apply); close call with UC-PSC-01"}, {"id": "CH4.CHILD.3.TC3", "stmt": "Sampled onboarding records show the age declaration or check result stored against the account.", "kind": "operating", "hint": "age_verification (onboarding records sample)", "prop": "UC-PSC-01", "reason": "best word match via atom CH4.CHILD.3-a (age, verific, declar, onboard)"}]}, {"id": "CM.GRANULAR.2", "fw": "dpdpa", "ref": "Section 6(1)", "title": "No consent bundling with service access", "cands": [{"id": "UC-PNC-05", "title": "Consent by clear affirmative action", "statement": "Consent is collected only through a clear affirmative action by the person. Screens carry no pre-selected options, never treat silence or continued use as consent, and show accept and decline with equal prominence. Each consent flow is reviewed when it is built or changed. This keeps consent real and not manufactured by design. The approved consent designs and live screen captures are the proof.", "asks": ["b: Avoid dark patterns when collecting consent. (full)"], "primary": false}, {"id": "UC-PNC-06", "title": "Consent given freely", "statement": "Consent is given freely. The service does not make access depend on consent to processing it does not need, and no consent request contains a term by which people waive their rights. Sign-up flows and linked terms are checked whenever they change. This stops people from being forced to trade away their data or rights. The consent screens, the terms and a decline walkthrough are the proof.", "asks": ["a: Keep access to the service independent of consent to processing that the service does not need. (full)"], "primary": true}], "crits": [{"id": "CM.GRANULAR.2.TC1", "stmt": "Access to the service is not made conditional on consent to processing that the service does not need.", "kind": "design", "hint": "consent_forms; terms of service", "prop": "UC-PNC-06", "reason": "best word match via atom CM.GRANULAR.2-a (does, service, consent, process)"}, {"id": "CM.GRANULAR.2.TC2", "stmt": "Consent screens show the accept and decline options with equal prominence.", "kind": "design", "hint": "consent_forms", "prop": "UC-PNC-05", "reason": "best word match via atom CM.GRANULAR.2-b (consent, equal, prominence, decline)"}, {"id": "CM.GRANULAR.2.TC3", "stmt": "A test sign-up that declines every optional purpose completes and reaches the core service.", "kind": "operating", "hint": "consent_forms (recorded walkthrough)", "prop": "UC-PNC-06", "reason": "best word match via atom CM.GRANULAR.2-a (service, consent, sign-up, core)"}]}, {"id": "CB.TRANSFER.1", "fw": "dpdpa", "ref": "Section 16(1)", "title": "Data transfers only to non-restricted jurisdictions", "cands": [{"id": "UC-PSC-05", "title": "Transfers only to permitted destinations", "statement": "Government notifications that restrict transfers of personal data to specific countries or territories are tracked and kept current. Before personal data is sent outside India, the destination is checked against the current restrictions, and transfers to a restricted destination are stopped. The check is updated when a new notification is published. Proof is the notification tracker and the destination check records.", "asks": ["a: Transfer personal data outside India only to countries or territories not restricted by the Central Government. (full)"], "primary": true}, {"id": "UC-PSC-06", "title": "Cross-border flow inventory", "statement": "An inventory lists every flow of personal data outside India, naming the destination country and the recipient for each flow. It is updated whenever a new flow starts or a recipient changes, and reconciled with system hosting regions on a defined cycle. Proof is the inventory and the reconciliation records.", "asks": ["b: Maintain an inventory of cross-border data flows. (full)"], "primary": false}], "crits": [{"id": "CB.TRANSFER.1.TC1", "stmt": "An inventory lists every flow of personal data outside India with the destination country and the recipient.", "kind": "design", "hint": "cross_border_safeguards; data_flow_diagram", "prop": "UC-PSC-05", "reason": "best word match via atom CB.TRANSFER.1-a (country, india, outside, personal)"}, {"id": "CB.TRANSFER.1.TC2", "stmt": "A procedure checks destinations against any country or territory restricted by Central Government notification and stops transfers to them.", "kind": "design", "hint": "cross_border_safeguards", "prop": "UC-PSC-05", "reason": "best word match via atom CB.TRANSFER.1-a (territory, government, country, central)"}, {"id": "CB.TRANSFER.1.TC3", "stmt": "A named owner tracks Central Government orders on making transferred personal data available to foreign States and applies them to transfers.", "kind": "design", "hint": "cross_border_safeguards", "prop": "UC-PSC-05", "reason": "best word match via atom CB.TRANSFER.1-a (government, central, transfer, personal)"}, {"id": "CB.TRANSFER.1.TC4", "stmt": "Hosting regions of a sample of systems holding personal data match the transfer inventory.", "kind": "operating", "hint": "cloud hosting configuration; cross_border_safeguards", "prop": "UC-PSC-05", "reason": "best word match via atom CB.TRANSFER.1-a (transfer, personal, data, region)"}]}, {"id": "CB.TRANSFER.2", "fw": "dpdpa", "ref": "Section 16", "title": "Transfers comply with s.16 restrictions and stricter sectoral law", "cands": [{"id": "UC-PSC-05", "title": "Transfers only to permitted destinations", "statement": "Government notifications that restrict transfers of personal data to specific countries or territories are tracked and kept current. Before personal data is sent outside India, the destination is checked against the current restrictions, and transfers to a restricted destination are stopped. The check is updated when a new notification is published. Proof is the notification tracker and the destination check records.", "asks": ["a: Track Central Government notifications that restrict transfers to specific countries or territories. (full)", "b: Do not transfer personal data to a country or territory restricted by such a notification. (full)"], "primary": true}, {"id": "UC-PSC-07", "title": "Local storage and sectoral transfer rules", "statement": "A register lists each law or regulator direction that requires categories of personal data to be stored in India or limits where they may be sent, beyond the general destination rules. For each requirement, the register records the affected data and its storage location, and a control keeps that data, including backups and disaster recovery copies, in India. The register is reviewed on a defined cycle. Proof is the register and the hosting configuration.", "asks": ["c: Comply with any stricter sectoral law in force in India on transfers outside India. (full)"], "primary": false}], "crits": [{"id": "CB.TRANSFER.2.TC1", "stmt": "Recipients outside India that act as Data Processors are engaged under a signed contract that requires reasonable security safeguards.", "kind": "design", "hint": "vendor_agreements; cross_border_safeguards", "prop": "UC-PSC-07", "reason": "best word match via atom CB.TRANSFER.2-c (india, outside, requir, data)"}, {"id": "CB.TRANSFER.2.TC2", "stmt": "Transfer agreements oblige the overseas recipient to comply with any restriction the organisation must meet under r.15 orders.", "kind": "design", "hint": "cross_border_safeguards", "prop": "UC-PSC-07", "reason": "best word match via atom CB.TRANSFER.2-c (comply, transfer); weak match"}, {"id": "CB.TRANSFER.2.TC3", "stmt": "Agreements with overseas recipients that are themselves Data Fiduciaries impose data protection obligations on them.", "kind": "design", "hint": "cross_border_safeguards", "prop": "UC-PSC-05", "reason": "best word match via atom CB.TRANSFER.2-b (data); weak match"}, {"id": "CB.TRANSFER.2.TC4", "stmt": "Every flow in the cross-border inventory has a matching signed agreement on file.", "kind": "operating", "hint": "cross_border_safeguards; vendor_agreements", "prop": "UC-PSC-05", "reason": "best word match via control text (flow, inventory, match)"}]}, {"id": "BN.NOTIFY.1", "fw": "dpdpa", "ref": "Section 8(6); DPDP Rules 2025 r.7(2)", "title": "Breach notification to Data Protection Board", "cands": [{"id": "UC-INC-04", "title": "Incident notification duties", "statement": "The people who may notify authorities and other outside parties about an incident are named, and a timeline is set for each kind of reportable event. When an incident triggers a legal or contractual duty, notification is made in time, with the date and recipient recorded. This keeps the organization out of penalties and keeps customers and regulators informed. The notification procedure and the incident notification records are the proof.", "asks": ["a: Notify the Data Protection Board promptly of any personal data breach. (partial)", "b: Follow the prescribed form, content and timeline when reporting the breach to the Board. (partial)"], "primary": false}, {"id": "UC-INC-70", "title": "Breach intimation to the regulator", "statement": "The Board is told of every personal data breach, with no harm or size threshold, without delay on becoming aware of it, describing its nature, extent, timing, location and likely impact. A detailed report follows within 72 hours of becoming aware, or within a longer period the Board allows on a written request. The report uses the prescribed form and covers the facts and causes, mitigation, who caused it, steps to prevent recurrence and the notices sent to data principals. Proof is the breach procedure, the report template and the submission records.", "asks": ["a: Notify the Data Protection Board promptly of any personal data breach. (full)", "b: Follow the prescribed form, content and timeline when reporting the breach to the Board. (full)"], "primary": true}], "crits": [{"id": "BN.NOTIFY.1.TC1", "stmt": "The breach procedure requires an initial intimation to the Data Protection Board without delay on becoming aware of a personal data breach, describing its nature, extent, timing, location and likely impact.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-70", "reason": "best word match via atom BN.NOTIFY.1-a (board, breach, protection, personal)"}, {"id": "BN.NOTIFY.1.TC2", "stmt": "The procedure requires a detailed follow-up report to the Board within 72 hours of becoming aware of the breach, or within a longer period the Board allows on a written request.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-70", "reason": "best word match via atom BN.NOTIFY.1-b (board, breach, report, hour)"}, {"id": "BN.NOTIFY.1.TC3", "stmt": "The Board report template covers updated details of the breach, its facts and causes, mitigation measures, findings on who caused it, measures to prevent recurrence, and a report of the intimations sent to data principals.", "kind": "design", "hint": "breach_procedure (Board report template)", "prop": "UC-INC-70", "reason": "best word match via atom BN.NOTIFY.1-b (board, breach, report, intim)"}, {"id": "BN.NOTIFY.1.TC4", "stmt": "The procedure applies to every personal data breach as defined in the Act, with no harm or materiality threshold for intimating the Board.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-70", "reason": "best word match via atom BN.NOTIFY.1-a (board, breach, personal, data)"}, {"id": "BN.NOTIFY.1.TC5", "stmt": "For each personal data breach in the period, records show the initial intimation and the detailed report reached the Board on time.", "kind": "operating", "hint": "incident_log; Board submission records", "prop": "UC-INC-70", "reason": "best word match via atom BN.NOTIFY.1-a (board, breach, personal, data)"}]}, {"id": "BN.NOTIFY.2", "fw": "dpdpa", "ref": "Section 8(6); DPDP Rules 2025 r.7(1)", "title": "Breach notification to affected Data Principals", "cands": [{"id": "UC-INC-04", "title": "Incident notification duties", "statement": "The people who may notify authorities and other outside parties about an incident are named, and a timeline is set for each kind of reportable event. When an incident triggers a legal or contractual duty, notification is made in time, with the date and recipient recorded. This keeps the organization out of penalties and keeps customers and regulators informed. The notification procedure and the incident notification records are the proof.", "asks": ["a: Notify each affected data principal of a personal data breach. (partial)", "b: Follow the prescribed form and content when notifying data principals. (partial)"], "primary": false}, {"id": "UC-INC-71", "title": "Breach notice to affected individuals", "statement": "Each data principal affected by a personal data breach is notified without delay, through the user account or a communication channel the person registered. The notice is in clear, plain language and covers the nature, extent and timing of the breach, its likely consequences for the person, the mitigation taken, the steps the person can take and a contact for questions. This applies to every affected person with no harm threshold. Proof is the notification template and the dispatch records.", "asks": ["a: Notify each affected data principal of a personal data breach. (full)", "b: Follow the prescribed form and content when notifying data principals. (full)"], "primary": true}], "crits": [{"id": "BN.NOTIFY.2.TC1", "stmt": "The breach procedure requires intimating each affected data principal without delay, through her user account or a communication channel she registered.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-71", "reason": "best word match via atom BN.NOTIFY.2-a (affect, breach, principal, data)"}, {"id": "BN.NOTIFY.2.TC2", "stmt": "The data principal notification template covers the breach's nature, extent and timing; likely consequences for her; mitigation measures taken; steps she can take; and a contact for queries.", "kind": "design", "hint": "breach_procedure (notification template)", "prop": "UC-INC-71", "reason": "best word match via atom BN.NOTIFY.2-a (breach, principal, data, nature)"}, {"id": "BN.NOTIFY.2.TC3", "stmt": "The procedure notifies every affected data principal, with no risk or harm threshold.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-71", "reason": "best word match via atom BN.NOTIFY.2-a (notify, affect, breach, principal)"}, {"id": "BN.NOTIFY.2.TC4", "stmt": "For each personal data breach in the period, records show affected data principals were sent a notification containing the template content.", "kind": "operating", "hint": "incident_log; notification dispatch records", "prop": "UC-INC-71", "reason": "best word match via atom BN.NOTIFY.2-a (affect, breach, principal, personal)"}]}, {"id": "BN.NOTIFY.3", "fw": "dpdpa", "ref": "Section 8(4)-(6)", "title": "Incident response plan documented", "cands": [{"id": "UC-INC-01", "title": "Incident management plan and roles", "statement": "A written incident management procedure runs from detection through closure, including escalation steps, investigation and the handling of personal data breaches. Each incident role is assigned to a named person with contact details, and the plan names the third parties to coordinate with during an incident and how to reach them. The procedure and the role list prove it.", "asks": ["a: Cover detection of personal data breaches in a documented incident response plan. (full)", "c: Cover investigation of personal data breaches in the documented plan. (full)"], "primary": true}, {"id": "UC-INC-03", "title": "Incident response and closure", "statement": "Every incident is handled under documented procedures for containment, eradication, recovery and escalation. The steps taken are recorded as the work happens, and each incident is closed only after recovery is confirmed. This limits damage and leaves a trail that shows the response was controlled. The response procedures and the incident records are the proof.", "asks": ["b: Cover containment of personal data breaches in the documented plan. (full)", "e: Cover remediation of personal data breaches in the documented plan. (full)"], "primary": false}, {"id": "UC-INC-04", "title": "Incident notification duties", "statement": "The people who may notify authorities and other outside parties about an incident are named, and a timeline is set for each kind of reportable event. When an incident triggers a legal or contractual duty, notification is made in time, with the date and recipient recorded. This keeps the organization out of penalties and keeps customers and regulators informed. The notification procedure and the incident notification records are the proof.", "asks": ["d: Cover notification of regulators and data principals in the documented plan. (full)"], "primary": false}], "crits": [{"id": "BN.NOTIFY.3.TC1", "stmt": "An approved incident response plan covers detection, containment, investigation, notification and remediation of personal data breaches.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-01", "reason": "best word match via atom BN.NOTIFY.3-a (detection, breach, response, incident)"}, {"id": "BN.NOTIFY.3.TC2", "stmt": "The plan names the roles that decide a breach has occurred and that send the Board and data principal intimations.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-01", "reason": "best word match via atom BN.NOTIFY.3-a (breach, plan, data, name)"}, {"id": "BN.NOTIFY.3.TC3", "stmt": "The plan includes a method for identifying affected data principals and their registered contact channels.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-01", "reason": "best word match via atom BN.NOTIFY.3-a (breach, plan, data, contact)"}, {"id": "BN.NOTIFY.3.TC4", "stmt": "The plan was exercised (tabletop or real incident) in the last 12 months and lessons were recorded.", "kind": "operating", "hint": "breach_procedure; incident_log; exercise report", "prop": "UC-INC-01", "reason": "best word match via atom BN.NOTIFY.3-a (breach, incident, plan, procedure)"}]}, {"id": "BN.NOTIFY.4", "fw": "dpdpa", "ref": "Section 8(6)", "title": "Breach register maintained", "cands": [{"id": "UC-INC-03", "title": "Incident response and closure", "statement": "Every incident is handled under documented procedures for containment, eradication, recovery and escalation. The steps taken are recorded as the work happens, and each incident is closed only after recovery is confirmed. This limits damage and leaves a trail that shows the response was controlled. The response procedures and the incident records are the proof.", "asks": ["a: Maintain a register of all personal data breaches. (partial)", "b: Record in the register the facts and effects of each breach. (partial)", "c: Record in the register the remedial actions taken for each breach. (full)"], "primary": false}, {"id": "UC-INC-72", "title": "Personal data breach register", "statement": "A register records every personal data breach with the facts, the effects, the remedial actions and the dates the Board and the affected data principals were notified. Each breach is added to the register as it is confirmed, and the register is checked against the security incident log on a defined cycle. Proof is the register and the reconciliation records.", "asks": ["a: Maintain a register of all personal data breaches. (full)", "b: Record in the register the facts and effects of each breach. (full)"], "primary": true}], "crits": [{"id": "BN.NOTIFY.4.TC1", "stmt": "A breach register records each personal data breach with its facts, effects and remedial actions.", "kind": "design", "hint": "incident_log", "prop": "UC-INC-72", "reason": "best word match via atom BN.NOTIFY.4-b (fact, effect, breach, register)"}, {"id": "BN.NOTIFY.4.TC2", "stmt": "Each register entry records when the Board and the affected data principals were intimated.", "kind": "design", "hint": "incident_log", "prop": "UC-INC-72", "reason": "best word match via atom BN.NOTIFY.4-a (register, data, entry, board)"}, {"id": "BN.NOTIFY.4.TC3", "stmt": "Every personal data breach in the security incident log for the period appears in the breach register.", "kind": "operating", "hint": "incident_log; security incident tickets", "prop": "UC-INC-72", "reason": "best word match via atom BN.NOTIFY.4-a (breach, register, personal, data)"}]}], "zero": [{"id": "UC-GOV-01", "title": "Internal and external issues"}, {"id": "UC-GOV-03", "title": "Scope of the security program"}, {"id": "UC-GOV-04", "title": "Security management system operated"}, {"id": "UC-GOV-10", "title": "Risks and opportunities of the program"}, {"id": "UC-GOV-12", "title": "Planned changes to the program"}, {"id": "UC-GOV-14", "title": "Security communication plan"}, {"id": "UC-GOV-15", "title": "Documented information control"}, {"id": "UC-GOV-16", "title": "Security processes planned and run"}, {"id": "UC-GOV-20", "title": "Nonconformity and corrective action"}, {"id": "UC-PPL-05", "title": "Competence of security personnel"}, {"id": "UC-PSC-06", "title": "Cross-border flow inventory"}, {"id": "UC-RSK-03", "title": "Statement of applicable controls"}, {"id": "UC-RSK-04", "title": "Risk assessments performed"}], "questions": [{"id": "ISO.SCP.1", "q": "What is the scope of your Information Security Management System (ISMS)?", "options": ["Entire organization", "Specific business units or departments", "Specific products or services", "Not yet defined"]}, {"id": "ISO.SCP.2", "q": "Does your organization use cloud services for storing or processing information?", "options": ["Yes", "No", "Planning to adopt"]}, {"id": "ISO.SCP.3", "q": "Does your organization develop software or systems (in-house or outsourced)?", "options": ["Yes: in-house development", "Yes: outsourced development", "Both in-house and outsourced", "No software development"]}, {"id": "ISO.SCP.4", "q": "Does your organization have physical premises with sensitive information processing facilities?", "options": ["Yes: including data center / server room", "Yes: office only (no on-prem servers)", "No: fully remote / cloud-only"]}], "scope": [{"key": "ISO.SCP.2=no:UC-SUP-07", "q": "ISO.SCP.2", "answer": "No", "cid": "UC-SUP-07", "title": "Cloud exit plans", "statement": "An exit plan exists for each critical cloud service. It sets out how data is returned to the organization and how the provider deletes the remaining copies. The plans are kept current so the organization can leave a provider without losing data or leaving copies behind. The exit plans prove it.", "src": "ISO.A5.23", "reason": "Answer \"No\": the control \"Cloud exit plans\" draws only on A.5.23, which this answer makes likely not applicable. The consultant confirms."}, {"key": "ISO.SCP.3=no:UC-SDC-05", "q": "ISO.SCP.3", "answer": "No software development", "cid": "UC-SDC-05", "title": "Secure coding", "statement": "A secure coding standard covers input validation, output encoding, secrets handling and dependency management, and applies to in-house and outsourced code. Code changes go through peer review or automated scanning, such as static analysis, dependency or secret scanning, and findings are addressed before release. This keeps common coding flaws out of production. Proof is the standard and the pipeline scan results.", "src": "ISO.A8.28", "reason": "Answer \"No software development\": the control \"Secure coding\" draws only on A.8.28, which this answer makes likely not applicable. The consultant confirms."}, {"key": "ISO.SCP.3=no:UC-SDC-07", "q": "ISO.SCP.3", "answer": "No software development", "cid": "UC-SDC-07", "title": "Outsourced development oversight", "statement": "Contracts for outsourced development set security requirements, such as secure coding, test evidence, code ownership and a right to audit. The outsourced work is monitored and reviewed, for example through code reviews, test evidence received and progress meetings, and records are kept. This keeps outsourced code to the same standard as in-house code.", "src": "ISO.A8.30", "reason": "Answer \"No software development\": the control \"Outsourced development oversight\" draws only on A.8.30, which this answer makes likely not applicable. The consultant confirms."}, {"key": "ISO.SCP.3=no:UC-SDC-08", "q": "ISO.SCP.3", "answer": "No software development", "cid": "UC-SDC-08", "title": "Environment separation", "statement": "Development, test and production environments are separate, for example in separate accounts, subscriptions or networks, with rules for promoting changes between them. Developers have no standing write access to production, or any such access is approved and logged. Non-production environments are secured to the level of the data they hold. Proof is the separation rules and the access configuration.", "src": "ISO.A8.31", "reason": "Answer \"No software development\": the control \"Environment separation\" draws only on A.8.31, which this answer makes likely not applicable. The consultant confirms."}, {"key": "ISO.SCP.3=inhouse:UC-SDC-07", "q": "ISO.SCP.3", "answer": "Yes: in-house development", "cid": "UC-SDC-07", "title": "Outsourced development oversight", "statement": "Contracts for outsourced development set security requirements, such as secure coding, test evidence, code ownership and a right to audit. The outsourced work is monitored and reviewed, for example through code reviews, test evidence received and progress meetings, and records are kept. This keeps outsourced code to the same standard as in-house code.", "src": "ISO.A8.30", "reason": "Answer \"Yes: in-house development\": the control \"Outsourced development oversight\" draws only on A.8.30, which this answer makes likely not applicable. The consultant confirms."}, {"key": "ISO.SCP.4=fully_remote:UC-PHY-01", "q": "ISO.SCP.4", "answer": "No: fully remote / cloud-only", "cid": "UC-PHY-01", "title": "Physical security perimeters", "statement": "A physical perimeter is defined for each site in scope, such as the building, floor or server room, stating the protection each one needs. At least once a cycle, the perimeters are confirmed to exist as described, for example that doors lock and there are no unprotected openings. Where the organization has no premises of its own,   TABS.forEach(([t]) => { PANELS[t].hidden = t !== id; });
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id ? "true" : "false"));
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  if (id === "criteria") renderCriteria();
  window.scrollTo(0, 0);
}

// ---------- export ----------
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h("a", { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function collect() {
  const criteria = {}, scope = {}, n = { accept: 0, change: 0, flag: 0, open: 0 };
  CRITS.forEach(c => {
    const d = get("t:" + c.id);
    n[d.s || "open"]++;
    if (d.s || d.n) criteria[c.id] = { record_id: c.rec.id, status: d.s, unified_control_id: d.s === "flag" ? "" : (d.c || c.prop), proposed: c.prop, note: d.n || "" };
  });
  DATA.scope.forEach(p => { const d = get("p:" + p.key); if (d.s || d.n) scope[p.key] = { status: d.s, note: d.n || "" }; });
  return { criteria, scope, n, held: get("h:held"), four: get("q:four") };
}
document.getElementById("exportJson").addEventListener("click", () => {
  const x = collect();
  download("ucf-rekey-decisions.json", JSON.stringify({ library_version: DATA.version, exported_at: new Date().toISOString(),
    totals: x.n, criteria: x.criteria, scope: x.scope,
    held_back: { status: x.held.s || "", note: x.held.n || "" }, four_questions: { status: x.four.s || "", note: x.four.n || "" } }, null, 2), "application/json");
});
document.getElementById("exportMd").addEventListener("click", () => {
  const x = collect();
  const L = ["# UCF " + DATA.version + " re-key review", "", "Criteria: accepted " + x.n.accept + ", changed " + x.n.change + ", flagged " + x.n.flag + ", undecided " + x.n.open + ".", ""];
  const ch = Object.entries(x.criteria).filter(([, v]) => v.status === "change" || v.status === "flag");
  L.push("## Criteria changed or flagged", "");
  if (!ch.length) L.push("None.");
  ch.forEach(([id, v]) => L.push("- " + v.status.toUpperCase() + " " + id + ": " + (v.status === "flag" ? "" : v.proposed + " to " + v.unified_control_id) + (v.note ? (v.status === "flag" ? "" : ". ") + v.note.replace(/\n/g, " ") : "")));
  L.push("", "## Scope proposals", "");
  const sc = DATA.scope.map(p => [p, get("p:" + p.key)]);
  sc.forEach(([p, d]) => L.push("- " + (d.s || "undecided").toUpperCase() + " " + p.q + " = " + p.answer + ": " + p.cid + " " + p.title + (d.n ? ". " + d.n.replace(/\n/g, " ") : "")));
  L.push("", "## Decisions", "");
  L.push("- S1 held-back cases: " + (x.held.s || "undecided") + (x.held.n ? ". " + x.held.n.replace(/\n/g, " ") : ""));
  L.push("- S2 four scope questions: " + (x.four.s || "undecided") + (x.four.n ? ". " + x.four.n.replace(/\n/g, " ") : ""), "");
  download("ucf-rekey-summary.md", L.join("\n"), "text/markdown");
});

// ---------- boot ----------
const main = document.getElementById("main");
[overview(), criteriaPanel(), scopePanel()].forEach(p => main.append(p));
const tabs = document.getElementById("tabs");
TABS.forEach(([id, label, grp]) => tabs.append(h("button", { type: "button", role: "tab", "data-tab": id, "aria-selected": "false", onclick: () => showTab(id) },
  label, grp ? h("span", { class: "n", "data-tabcount": grp }) : null)));
updateProgress();
const start = (location.hash || "").slice(1);
showTab(TABS.some(t => t[0] === start) ? start : "overview");
</script>
