stems. Proof is the test data rules and the authorization and deletion records.", "asks": ["c: The organization keeps production sensitive data out of non-production environments unless masked. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.DS.02.TC1", "stmt": "A documented standard requires protection of data in transit (e.g. TLS for external and for sensitive internal traffic).", "kind": "design", "hint": "cryptography_policy", "prop": "UC-CRY-01", "reason": "best word match via atom NIST.PR.DS.02-a (tls, transit, protection, requir)"}, {"id": "NIST.PR.DS.02.TC2", "stmt": "Sampled external endpoints accept only current TLS versions (e.g. 1.2 or later) and present valid certificates.", "kind": "operating", "hint": "cryptography_policy; TLS scan output", "prop": "UC-CRY-01", "reason": "best word match via atom NIST.PR.DS.02-a (tls, certificat, valid, current)"}, {"id": "NIST.PR.DS.02.TC3", "stmt": "Controls stop sensitive data leaving through email or personal services (data loss prevention or blocking).", "kind": "design", "hint": "cryptography_policy; configuration_baselines", "prop": "UC-AST-10", "reason": "best word match via atom NIST.PR.DS.02-b (email, block, leav, sensitive)"}, {"id": "NIST.PR.DS.02.TC4", "stmt": "Production sensitive data is not used in non-production environments unless masked.", "kind": "design", "hint": "sdlc_policy; cryptography_policy", "prop": "UC-SDC-10", "reason": "best word match via atom NIST.PR.DS.02-c (non-production, mask, unles, environment)"}]}, {"id": "NIST.PR.DS.10", "fw": "nist_csf", "ref": "PR.DS-10", "title": "Data-in-use protection", "cands": [{"id": "UC-CRY-01", "title": "Use of encryption", "statement": "Where encryption is required, by classification and for data at rest and in transit, and which methods are approved are defined. Encryption is configured on data stores, endpoints and transport as the rules require. The cryptography policy and configuration exports are the proof.", "asks": ["a: The data protection standard sets explicit requirements for data in use. (partial)"], "primary": true}, {"id": "UC-CRY-40", "title": "Data in use requirements", "statement": "The data protection standard sets explicit requirements for data in use, not only for data in storage and in transit. It states how data is protected while an application or user is working with it. These requirements complete the rules for encryption of stored and transmitted data. Proof is the approved standard.", "asks": ["a: The data protection standard sets explicit requirements for data in use. (full)"], "primary": false}, {"id": "UC-CRY-41", "title": "Secrets kept out of code and logs", "statement": "Secrets and sensitive values are kept out of source code and logs. They are held in a controlled store, such as a secrets manager, and exposed only where and when needed. Code and logs are scanned to confirm none appear. Proof is the secrets store settings and scan results.", "asks": ["b: The organization keeps secrets and sensitive values out of logs and code and exposes them only as needed. (full)"], "primary": false}, {"id": "UC-CRY-42", "title": "Tenant data isolation", "statement": "Platforms shared by several customers, tenants or users isolate each one's data from the others. The isolation is built into the platform design and checked by testing. Proof is the isolation design and the latest isolation test results.", "asks": ["c: Shared or multi-tenant platforms isolate each user's or tenant's data from others. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.DS.10.TC1", "stmt": "The data protection standard contains explicit requirements for data in use, not only for data at rest and in transit.", "kind": "design", "hint": "cryptography_policy", "prop": "UC-CRY-40", "reason": "best word match via atom NIST.PR.DS.10-a (explicit, standard, use, protection); close call with UC-CRY-01"}, {"id": "NIST.PR.DS.10.TC2", "stmt": "Secrets and sensitive values are kept out of logs and code and held in a secrets manager, so they are exposed in memory only while needed.", "kind": "design", "hint": "cryptography_policy; sdlc_policy", "prop": "UC-CRY-41", "reason": "best word match via atom NIST.PR.DS.10-b (valu, secret, expos, code)"}, {"id": "NIST.PR.DS.10.TC3", "stmt": "Shared or multi-tenant platforms isolate one user's or tenant's data in use from other users and processes (e.g. tenant-isolation test results, container isolation settings).", "kind": "operating", "hint": "sdlc_policy; configuration_baselines; test report", "prop": "UC-CRY-42", "reason": "best word match via atom NIST.PR.DS.10-c (multi-tenant, tenant, isolate, platform)"}]}, {"id": "NIST.PR.DS.11", "fw": "nist_csf", "ref": "PR.DS-11", "title": "Backup management", "cands": [{"id": "UC-RES-04", "title": "Backup operation", "statement": "A backup policy sets scope, frequency, retention, storage location and protection, including offsite or isolated copies. Backups run as the policy requires, and every failure is investigated. This keeps recoverable copies of data available after loss or attack. The backup policy and the backup job logs are the proof.", "asks": ["a: The organization sets a backup policy covering scope, frequency and retention. (full)", "b: The organization runs backups at the defined frequency. (full)", "c: The organization keeps at least one backup copy offline, immutable or in a separate location. (full)", "d: The organization encrypts backups and limits access to them. (full)"], "primary": true}, {"id": "UC-RES-05", "title": "Restore testing", "statement": "Restore tests run at the frequency set in the backup policy, and each result is recorded. Each test restores real backups from critical systems and confirms the data comes back usable. This proves that backups can actually be restored. The restore test records are the proof.", "asks": ["e: The organization tests restoring from backups and records the result. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.DS.11.TC1", "stmt": "A backup policy sets scope, frequency and retention for backups.", "kind": "design", "hint": "backup", "prop": "UC-RES-04", "reason": "best word match via atom NIST.PR.DS.11-a (frequency, backup, retention, scope)"}, {"id": "NIST.PR.DS.11.TC2", "stmt": "At least one backup copy is kept offline, immutable or in a separate location or account.", "kind": "design", "hint": "backup", "prop": "UC-RES-04", "reason": "best word match via atom NIST.PR.DS.11-c (offline, immutable, copy, separate)"}, {"id": "NIST.PR.DS.11.TC3", "stmt": "Access to backups is restricted to named roles, and backups are encrypted.", "kind": "design", "hint": "backup; cryptography_policy", "prop": "UC-RES-04", "reason": "best word match via atom NIST.PR.DS.11-d (encrypt, backup, acces, policy)"}, {"id": "NIST.PR.DS.11.TC4", "stmt": "Backup job logs for sampled systems show successful backups at the defined frequency.", "kind": "operating", "hint": "backup (job logs)", "prop": "UC-RES-04", "reason": "best word match via atom NIST.PR.DS.11-b (frequency, backup, defin, job)"}, {"id": "NIST.PR.DS.11.TC5", "stmt": "A restore test ran in the last 12 months and its result is recorded.", "kind": "operating", "hint": "backup (restore test records)", "prop": "UC-RES-05", "reason": "best word match via atom NIST.PR.DS.11-e (backup, result, test, record)"}]}, {"id": "NIST.PR.PS.01", "fw": "nist_csf", "ref": "PR.PS-01", "title": "Configuration management practices", "cands": [{"id": "UC-NET-02", "title": "Secure configuration baselines", "statement": "A secure configuration baseline is documented for each type of operating system, database, cloud account and network device in scope. Compliance scans or configuration monitoring compare live systems with the baselines, and drift is fixed. Each baseline is reviewed on its own defined cycle, and the version history shows it. This reduces weaknesses from default or drifting settings.", "asks": ["a: The organization documents secure configuration baselines for the platform types it uses. (full)", "b: The organization checks that systems conform to their baselines. (full)", "c: The organization reviews and changes default settings on installation or upgrade. (full)"], "primary": true}, {"id": "UC-NET-03", "title": "Network security management", "statement": "A network security standard is set and maintained, covering how networks and network devices are secured and managed, including device hardening, administrator access and encryption in transit. A current network diagram of the in-scope environment is kept, including cloud networks and links to third parties. Firewall and security group rules are reviewed on a defined cycle, and unneeded or overly permissive rules are removed. This limits the paths an attacker can use. Proof is the standard, the diagram and the rule review records.", "asks": ["d: The organization reviews network device configurations against security principles. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.PS.01.TC1", "stmt": "Secure configuration baselines (hardening standards) are documented for the platform types in use.", "kind": "design", "hint": "configuration_baselines", "prop": "UC-NET-02", "reason": "best word match via atom NIST.PR.PS.01-a (baselin, platform, type, secure)"}, {"id": "NIST.PR.PS.01.TC2", "stmt": "Sampled systems conform to their baseline (e.g. benchmark scan or configuration-compliance report from the period).", "kind": "operating", "hint": "configuration_baselines (compliance report)", "prop": "UC-NET-02", "reason": "best word match via atom NIST.PR.PS.01-b (conform, baselin, system, baseline)"}, {"id": "NIST.PR.PS.01.TC3", "stmt": "Default settings are reviewed and changed where needed when software is installed or upgraded.", "kind": "design", "hint": "configuration_baselines", "prop": "UC-NET-02", "reason": "best word match via atom NIST.PR.PS.01-c (default, install, sett, chang)"}, {"id": "NIST.PR.PS.01.TC4", "stmt": "Network infrastructure device configurations were reviewed against security principles in the period.", "kind": "operating", "hint": "configuration_baselines; network_security", "prop": "UC-NET-03", "reason": "best word match via atom NIST.PR.PS.01-d (principl, device, network, configur)"}]}, {"id": "NIST.PR.PS.02", "fw": "nist_csf", "ref": "PR.PS-02", "title": "Software maintenance", "cands": [{"id": "UC-AST-43", "title": "Unsupported and unneeded software removal", "statement": "Unsupported software is avoided in production, or an exception with a replacement plan is recorded. Software that is unauthorized or not needed is removed. Proof is the inventory with support status, exception records and removal records.", "asks": ["b: The organization avoids unsupported software in production, or records an exception with a replacement plan. (full)", "c: The organization removes unauthorized or unneeded software. (full)"], "primary": false}, {"id": "UC-OPS-04", "title": "Vulnerability management", "statement": "A vulnerability management procedure names the sources of vulnerability information, how exposure is assessed and the fix deadlines by severity. In-scope systems are scanned, or equivalent assessments are run, on the cycle the procedure sets. Critical and high findings are fixed within the deadlines or carry a recorded risk acceptance. This closes known weaknesses before they are exploited. Proof is the procedure, scan reports and remediation tracking.", "asks": ["a: The organization sets patch deadlines by severity and applies patches within them. (full)"], "primary": true}], "crits": [{"id": "NIST.PR.PS.02.TC1", "stmt": "A patch management procedure sets patch deadlines by severity.", "kind": "design", "hint": "vulnerability_management", "prop": "UC-OPS-04", "reason": "best word match via atom NIST.PR.PS.02-a (patch, deadlin, severity, sets)"}, {"id": "NIST.PR.PS.02.TC2", "stmt": "Patch reports show critical and high-severity patches applied within the set deadlines on sampled systems.", "kind": "operating", "hint": "vulnerability_management (patch reports)", "prop": "UC-OPS-04", "reason": "best word match via atom NIST.PR.PS.02-a (patch, deadlin, apply, vulnerability)"}, {"id": "NIST.PR.PS.02.TC3", "stmt": "No unsupported (end-of-life) software runs in production, or each instance has a recorded exception with a replacement plan.", "kind": "operating", "hint": "asset_inventory; vulnerability_management", "prop": "UC-AST-43", "reason": "best word match via atom NIST.PR.PS.02-b (unsupport, replacement, production, exception)"}, {"id": "NIST.PR.PS.02.TC4", "stmt": "Unauthorised or unneeded software found in the period was removed (e.g. software inventory review with removal records).", "kind": "operating", "hint": "asset_inventory", "prop": "UC-AST-43", "reason": "best word match via atom NIST.PR.PS.02-c (unneed, remov, software, removal)"}]}, {"id": "NIST.PR.PS.03", "fw": "nist_csf", "ref": "PR.PS-03", "title": "Hardware maintenance", "cands": [{"id": "UC-AST-12", "title": "Sanitization before disposal or reuse", "statement": "Equipment and media holding data are checked, and data and licensed software are wiped or destroyed by an approved method, before disposal or reuse. Each wipe or destruction is verified, and wipe reports, destruction certificates or a disposal log are kept against the asset record.", "asks": ["c: The organization disposes of retired hardware with recorded data sanitization. (full)"], "primary": false}, {"id": "UC-AST-44", "title": "Hardware end-of-life replacement and disposal", "statement": "A documented procedure covers hardware replacement at end of life and secure disposal. Hardware past vendor support has a replacement plan or a recorded exception. Retired hardware is disposed of securely, with data sanitization recorded in a disposal log.", "asks": ["a: The organization documents procedures for hardware maintenance, end-of-life replacement and secure disposal. (full)", "b: The organization plans replacement or records an exception for hardware past vendor support. (full)"], "primary": false}, {"id": "UC-PHY-12", "title": "Scheduled equipment maintenance", "statement": "Maintenance requirements and schedules are defined for in-scope equipment, following supplier recommendations. Only authorized personnel carry out maintenance. Maintenance records show the work was done on schedule and by whom, which keeps equipment reliable.", "asks": ["a: The organization documents procedures for hardware maintenance, end-of-life replacement and secure disposal. (partial)"], "primary": true}], "crits": [{"id": "NIST.PR.PS.03.TC1", "stmt": "A procedure covers hardware maintenance, end-of-life replacement and secure disposal.", "kind": "design", "hint": "configuration_baselines; asset_inventory", "prop": "UC-AST-44", "reason": "best word match via atom NIST.PR.PS.03-a (end-of-life, replacement, disposal, maintenance)"}, {"id": "NIST.PR.PS.03.TC2", "stmt": "Hardware in the inventory that is past vendor support has a replacement plan or a recorded exception.", "kind": "operating", "hint": "asset_inventory", "prop": "UC-AST-44", "reason": "best word match via atom NIST.PR.PS.03-b (replacement, past, vendor, hardware)"}, {"id": "NIST.PR.PS.03.TC3", "stmt": "Disposal records, with data-sanitisation evidence, exist for hardware retired in the period.", "kind": "operating", "hint": "asset_inventory (disposal log)", "prop": "UC-AST-44", "reason": "best word match via atom NIST.PR.PS.03-a (disposal, hardware, retir, evidence)"}]}, {"id": "NIST.PR.PS.04", "fw": "nist_csf", "ref": "PR.PS-04", "title": "Log record generation", "cands": [{"id": "UC-OPS-01", "title": "Event logging", "statement": "The security-relevant events each type of system must log, such as authentication, privileged actions, errors and security events, and how long logs are kept, are defined. Systems produce those logs and forward them to central storage, and the source list is kept current. This gives the organization a reliable record for detection and investigation. Proof is the logging standard, the source list and sample logs.", "asks": ["a: The organization defines which events must be logged for each system type. (full)", "b: The organization sends logs from systems and services to a central platform for monitoring. (full)", "c1: The organization retains logs for a defined period. (full)"], "primary": true}, {"id": "UC-OPS-02", "title": "Log protection", "statement": "Logs are protected from tampering and unauthorized access, including from administrators of the systems being logged. Access to log storage is restricted to those who need it for their work, and logs sit in write-once or otherwise tamper-resistant storage. Storage configuration and access lists show the protection. This keeps the record trustworthy during an investigation.", "asks": ["c2: The organization protects retained logs from alteration. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.PS.04.TC1", "stmt": "A logging standard says which events must be logged for operating systems, applications, cloud services and network devices.", "kind": "design", "hint": "logging_monitoring", "prop": "UC-OPS-01", "reason": "best word match via atom NIST.PR.PS.04-a (logg, event, system, standard)"}, {"id": "NIST.PR.PS.04.TC2", "stmt": "Sampled systems and services have logging enabled and send logs to the central logging platform or SIEM.", "kind": "operating", "hint": "logging_monitoring (log source list, config)", "prop": "UC-OPS-01", "reason": "best word match via atom NIST.PR.PS.04-b (send, central, platform, logs)"}, {"id": "NIST.PR.PS.04.TC3", "stmt": "Logs are kept for a defined retention period and protected from alteration.", "kind": "design", "hint": "logging_monitoring", "prop": "UC-OPS-02", "reason": "best word match via atom NIST.PR.PS.04-c2 (alter, logs, protect, logg)"}]}, {"id": "NIST.PR.PS.05", "fw": "nist_csf", "ref": "PR.PS-05", "title": "Installation and execution prevention", "cands": [{"id": "UC-NET-08", "title": "Software installation control", "statement": "Rules state who may install software on operational systems, from which approved sources and with what testing and approval. Technical restrictions enforce this on servers and endpoints, for example no local administrator rights, application allow lists or deployment only through the pipeline. This stops unauthorized or untested software from reaching production. Proof is the procedure and the configuration or policy exports.", "asks": ["a: Policy limits software installation and execution to approved software. (full)", "b: Technical controls on devices stop users installing or running unapproved software. (full)", "c: The organization checks the source and integrity of new software before installation. (partial)"], "primary": true}, {"id": "UC-NET-40", "title": "Authenticity and integrity of acquired hardware and software", "statement": "Hardware and software are checked as genuine before they are acquired, and software is checked for integrity, for example by signature or hash, before it is installed or used. The source of new software is checked. A record of each check is kept. Proof is the procedure and acquisition and integrity check records.", "asks": ["c: The organization checks the source and integrity of new software before installation. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.PS.05.TC1", "stmt": "Policy limits software installation and execution to approved software (e.g. no local admin rights, allow-listing, managed app catalogue).", "kind": "design", "hint": "configuration_baselines", "prop": "UC-NET-08", "reason": "best word match via atom NIST.PR.PS.05-a (execution, install, software, limit)"}, {"id": "NIST.PR.PS.05.TC2", "stmt": "Endpoint management or allow-listing settings on sampled devices stop users installing or running unapproved software.", "kind": "operating", "hint": "configuration_baselines (MDM/EDR policy export)", "prop": "UC-NET-08", "reason": "best word match via atom NIST.PR.PS.05-b (unapprov, runn, stop, install)"}, {"id": "NIST.PR.PS.05.TC3", "stmt": "The source and integrity of new software (e.g. signed packages) are checked before installation.", "kind": "design", "hint": "configuration_baselines", "prop": "UC-NET-40", "reason": "best word match via atom NIST.PR.PS.05-c (integrity, source, install, new)"}]}, {"id": "NIST.PR.PS.06", "fw": "nist_csf", "ref": "PR.PS-06", "title": "Secure software development", "cands": [{"id": "UC-GOV-17", "title": "Performance monitoring and measurement", "statement": "What security performance to measure is decided, with methods that give valid, comparable and reproducible results, and when and by whom it is measured. When and by whom results are analyzed is also set. Results and the effectiveness of the program are evaluated on a defined cycle, and evidence is kept. Proof is a metrics list, reports and review notes.", "asks": ["d: The organization tracks and reports secure development performance measures. (partial)"], "primary": false}, {"id": "UC-IAM-10", "title": "Access to source code and build tools", "statement": "Who may read and write source code repositories, build tools and software libraries is defined, and write access is limited to authorized developers. Protected branches require review before changes merge. Repository permission exports are the proof.", "asks": ["c: The organization restricts access to source repositories and build pipelines and protects them against tampering. (full)"], "primary": false}, {"id": "UC-SDC-02", "title": "Secure development process", "statement": "Security rules are set for each phase of the development life cycle: requirements, design, coding, testing and release. Release records show the required security steps were completed, such as a security review, a code scan or an approval gate. This builds security into every release instead of checking it at the end. Proof is the secure development policy and the release records.", "asks": ["a: The organization defines security activities for each stage of the software development life cycle. (full)", "b: Development teams perform those security activities on each release. (full)"], "primary": true}], "crits": [{"id": "NIST.PR.PS.06.TC1", "stmt": "A secure development policy defines the security activities in each SDLC stage (e.g. security requirements, code review, security testing, dependency checks).", "kind": "design", "hint": "sdlc_policy", "prop": "UC-SDC-02", "reason": "best word match via atom NIST.PR.PS.06-a (stage, development, activity, security)"}, {"id": "NIST.PR.PS.06.TC2", "stmt": "For sampled releases in the period, the defined security activities were performed (e.g. code-scan results, code review records).", "kind": "operating", "hint": "sdlc_policy (pipeline evidence)", "prop": "UC-SDC-02", "reason": "best word match via atom NIST.PR.PS.06-b (activity, perform, security, pipeline)"}, {"id": "NIST.PR.PS.06.TC3", "stmt": "Source repositories and build pipelines restrict access and protect against tampering (e.g. branch protection, signed commits or builds).", "kind": "design", "hint": "sdlc_policy", "prop": "UC-IAM-10", "reason": "best word match via atom NIST.PR.PS.06-c (pipelin, repository, tamper, source)"}, {"id": "NIST.PR.PS.06.TC4", "stmt": "Secure development performance measures (e.g. vulnerabilities found per release, time to fix) are tracked and reported in the period.", "kind": "operating", "hint": "sdlc_policy (metrics)", "prop": "UC-GOV-17", "reason": "best word match via atom NIST.PR.PS.06-d (measur, development, performance, secure)"}]}, {"id": "NIST.PR.IR.01", "fw": "nist_csf", "ref": "PR.IR-01", "title": "Network and environment protection", "cands": [{"id": "UC-NET-03", "title": "Network security management", "statement": "A network security standard is set and maintained, covering how networks and network devices are secured and managed, including device hardening, administrator access and encryption in transit. A current network diagram of the in-scope environment is kept, including cloud networks and links to third parties. Firewall and security group rules are reviewed on a defined cycle, and unneeded or overly permissive rules are removed. This limits the paths an attacker can use. Proof is the standard, the diagram and the rule review records.", "asks": ["a: The organization documents how networks and environments are protected from unauthorized logical access. (full)", "d: The organization reviews firewall and security-group rules periodically and removes unjustified ones. (full)"], "primary": true}, {"id": "UC-NET-05", "title": "Network segregation", "statement": "Network segments are defined by trust level or function, such as production, development, corporate, guest and management, and the traffic allowed between them is stated. The design is enforced through firewall, VLAN or security group settings. Configuration exports show the enforcement. This limits how far an intruder can move from one compromised system.", "asks": ["b: The organization segments networks and cloud environments by trust level. (full)", "c: Firewall and security-group rules deny inbound traffic by default and allow only documented services. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.IR.01.TC1", "stmt": "A network protection standard states how networks and environments are protected from unauthorised logical access.", "kind": "design", "hint": "network_security", "prop": "UC-NET-03", "reason": "best word match via atom NIST.PR.IR.01-a (logical, environment, network, protect)"}, {"id": "NIST.PR.IR.01.TC2", "stmt": "Networks and cloud environments are segmented by trust level (e.g. production separate from corporate and guest networks), with only required traffic allowed between segments.", "kind": "design", "hint": "network_security (architecture diagram)", "prop": "UC-NET-05", "reason": "best word match via atom NIST.PR.IR.01-b (segment, trust, environment, cloud)"}, {"id": "NIST.PR.IR.01.TC3", "stmt": "Perimeter firewall or security-group rules deny inbound traffic by default and allow only documented services.", "kind": "design", "hint": "network_security (rule export)", "prop": "UC-NET-05", "reason": "best word match via atom NIST.PR.IR.01-c (deny, inbound, security-group, firewall)"}, {"id": "NIST.PR.IR.01.TC4", "stmt": "Firewall and security-group rules were reviewed in the period, and rules without a justification were removed.", "kind": "operating", "hint": "network_security (rule review record)", "prop": "UC-NET-03", "reason": "best word match via atom NIST.PR.IR.01-d (security-group, firewall, remov, rule)"}]}, {"id": "NIST.PR.IR.02", "fw": "nist_csf", "ref": "PR.IR-02", "title": "Environmental threat protection", "cands": [{"id": "UC-PHY-05", "title": "Physical and environmental threat protection", "statement": "Physical and environmental threats are assessed for each in-scope site, such as fire, flood, power surge and civil unrest, and the protection the assessment calls for is installed. That protection is maintained and tested on a defined cycle, and the certificates are kept. This lowers the chance that a natural event or attack on a site destroys information or equipment.", "asks": ["a: The organization protects facilities housing its equipment against environmental threats such as fire, heat, water and power loss. (full)", "c: The organization maintains and inspects environmental protection equipment. (full)"], "primary": true}, {"id": "UC-SUP-06", "title": "Cloud service security governance", "statement": "Rules for selecting, using and managing cloud services are documented and set out how responsibility is shared between the organization and each provider. A register of cloud services is kept, and provider assurance is obtained and reviewed in the period, including assurance on environmental protection where a provider hosts equipment or data. The policy, the register and the assurance reviews prove it.", "asks": ["b: The organization obtains provider assurance on environmental protection for cloud or colocation hosting. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.IR.02.TC1", "stmt": "Facilities housing the organisation's equipment have documented protection against environmental threats (fire, heat and humidity, water, power loss).", "kind": "design", "hint": "physical_security", "prop": "UC-PHY-05", "reason": "best word match via atom NIST.PR.IR.02-a (hous, water, heat, fire)"}, {"id": "NIST.PR.IR.02.TC2", "stmt": "For cloud or colocation hosting, current provider attestations covering environmental protection (e.g. SOC 2 report, ISO certificate) were obtained.", "kind": "operating", "hint": "supplier_security; physical_security", "prop": "UC-SUP-06", "reason": "best word match via atom NIST.PR.IR.02-b (coloc, environmental, host, provider)"}, {"id": "NIST.PR.IR.02.TC3", "stmt": "Environmental protection equipment (e.g. UPS, fire suppression) has maintenance or inspection records in the period.", "kind": "operating", "hint": "physical_security (maintenance records)", "prop": "UC-PHY-05", "reason": "best word match via atom NIST.PR.IR.02-a (fire, environmental, equipment, maintenance)"}]}, {"id": "NIST.PR.IR.03", "fw": "nist_csf", "ref": "PR.IR-03", "title": "Resilience mechanisms", "cands": [{"id": "UC-RES-02", "title": "Recovery objectives and plans", "statement": "Recovery time and recovery point objectives are set for each critical IT service from a business impact analysis, and a recovery plan is kept for each of those services. The objectives and plans are updated when the analysis changes. This makes sure recovery work is aimed at what the business can least afford to lose. The impact analysis, the objectives table and the recovery plans are the proof.", "asks": ["a: The organization defines resilience requirements, such as availability and recovery targets, for critical systems. (full)"], "primary": true}, {"id": "UC-RES-06", "title": "Redundancy for critical systems", "statement": "Availability requirements are defined for critical systems, and the redundancy that meets them is documented, for example multi-zone deployment or failover links. The design leaves no single point of failure for those systems. This keeps critical services running when a component fails. The availability requirements and the redundancy design are the proof.", "asks": ["b: The organization designs critical systems without single points of failure, using redundancy or failover. (full)"], "primary": false}, {"id": "UC-RES-07", "title": "Failover testing", "statement": "Failover of redundant components is tested at least yearly, or confirmed from a real event. The results are compared with the defined availability requirements, and any shortfall is recorded. This shows that redundancy works when a component fails. The test records or event reports are the proof.", "asks": ["c: The organization tests failover or resilience and compares results with the requirements. (full)"], "primary": false}], "crits": [{"id": "NIST.PR.IR.03.TC1", "stmt": "Resilience requirements (availability targets, recovery time and point objectives) are defined for critical systems.", "kind": "design", "hint": "business_continuity", "prop": "UC-RES-02", "reason": "best word match via atom NIST.PR.IR.03-a (resilience, target, availability, critical)"}, {"id": "NIST.PR.IR.03.TC2", "stmt": "Architecture documents for critical systems show no single point of failure (e.g. redundancy, multi-zone deployment, failover).", "kind": "design", "hint": "business_continuity; network_security", "prop": "UC-RES-06", "reason": "best word match via atom NIST.PR.IR.03-b (redundancy, failover, single, failure)"}, {"id": "NIST.PR.IR.03.TC3", "stmt": "A failover or resilience test ran in the period and its result was compared with the defined requirements.", "kind": "operating", "hint": "business_continuity (test results)", "prop": "UC-RES-07", "reason": "best word match via atom NIST.PR.IR.03-c (failover, compar, resilience, result)"}]}, {"id": "NIST.DE.CM.03", "fw": "nist_csf", "ref": "DE.CM-03", "title": "Personnel activity monitoring", "cands": [{"id": "UC-AST-02", "title": "Acceptable use rules acknowledged", "statement": "Written rules state what use of information and assets is permitted and prohibited, and that use of the organization's systems is monitored. Users acknowledge the rules when they join and again on a defined cycle. Signed acknowledgement records are the proof.", "asks": ["c: The organization tells personnel that their use of its systems is monitored. (full)"], "primary": false}, {"id": "UC-OPS-03", "title": "Monitoring for anomalous activity", "statement": "What monitoring covers across networks, systems, applications, user activity, vendor remote access and the audit logs of cloud and SaaS services, what counts as anomalous behavior and who receives alerts are defined. Monitoring includes detecting unauthorized devices and wireless access points that connect to the network. Alert rules run and periodic log reviews take place, and each review is recorded. Vendor remote-access sessions are logged and reviewed. Alerts that warrant it are passed on for analysis and, if they point to an incident, to the incident process. This lets the organization catch suspicious activity early. Proof is the monitoring standard, alert rules, review records and linked incident tickets.", "asks": ["a: The organization defines how it monitors personnel activity and technology use. (full)", "b: The organization generates and reviews alerts on anomalous user activity. (full)"], "primary": true}], "crits": [{"id": "NIST.DE.CM.03.TC1", "stmt": "The monitoring standard defines monitoring of personnel activity and technology use (e.g. logins, privileged actions, failed access).", "kind": "design", "hint": "logging_monitoring", "prop": "UC-OPS-03", "reason": "best word match via atom NIST.DE.CM.03-a (technology, activity, personnel, monitor)"}, {"id": "NIST.DE.CM.03.TC2", "stmt": "Alerts on anomalous user activity (e.g. impossible travel, repeated failed logins, unusual privilege use) were generated and reviewed in the period.", "kind": "operating", "hint": "logging_monitoring (alert tickets)", "prop": "UC-OPS-03", "reason": "best word match via atom NIST.DE.CM.03-b (generat, anomalou, activity, alert)"}, {"id": "NIST.DE.CM.03.TC3", "stmt": "Personnel are told that their use of organisational systems is monitored (e.g. acceptable use policy or logon notice).", "kind": "design", "hint": "security_policy (acceptable use)", "prop": "UC-AST-02", "reason": "best word match via atom NIST.DE.CM.03-c (personnel, monitor, use, system)"}]}, {"id": "NIST.DE.CM.09", "fw": "nist_csf", "ref": "DE.CM-09", "title": "Computing hardware and software monitoring", "cands": [{"id": "UC-NET-02", "title": "Secure configuration baselines", "statement": "A secure configuration baseline is documented for each type of operating system, database, cloud account and network device in scope. Compliance scans or configuration monitoring compare live systems with the baselines, and drift is fixed. Each baseline is reviewed on its own defined cycle, and the version history shows it. This reduces weaknesses from default or drifting settings.", "asks": ["c: The organization detects and reports deviations from configuration baselines. (full)"], "primary": false}, {"id": "UC-OPS-07", "title": "Malware protection", "statement": "The malware protection required for each system type, such as endpoint detection, and email and download scanning, is defined. It is deployed and kept installed, active and up to date on in-scope systems, with exceptions justified. Console reports show the status. This reduces infection and spread of malicious software.", "asks": ["a: The organization monitors endpoints, servers and runtime environments with EDR or anti-malware. (full)", "b: The organization monitors email and web traffic for malware, phishing and data exfiltration and reviews the alerts. (full)"], "primary": true}], "crits": [{"id": "NIST.DE.CM.09.TC1", "stmt": "The monitoring standard requires endpoint and server monitoring (e.g. EDR or anti-malware) on computing hardware and runtime environments.", "kind": "design", "hint": "logging_monitoring", "prop": "UC-OPS-07", "reason": "best word match via atom NIST.DE.CM.09-a (edr, runtime, anti-malware, server)"}, {"id": "NIST.DE.CM.09.TC2", "stmt": "An EDR or anti-malware coverage report shows the agent active on all, or a sample of, in-scope endpoints and servers.", "kind": "operating", "hint": "logging_monitoring (coverage report)", "prop": "UC-OPS-07", "reason": "best word match via atom NIST.DE.CM.09-a (edr, anti-malware, server, endpoint)"}, {"id": "NIST.DE.CM.09.TC3", "stmt": "Email and web gateways monitor for malware, phishing and data exfiltration, and their alerts were reviewed in the period.", "kind": "operating", "hint": "logging_monitoring", "prop": "UC-OPS-07", "reason": "best word match via atom NIST.DE.CM.09-b (exfiltr, web, phish, email)"}, {"id": "NIST.DE.CM.09.TC4", "stmt": "Deviations from configuration baselines are detected and reported (e.g. drift alerts or reports in the period).", "kind": "operating", "hint": "configuration_baselines; logging_monitoring", "prop": "UC-NET-02", "reason": "best word match via atom NIST.DE.CM.09-c (devi, detect, baselin, configur)"}]}, {"id": "NIST.DE.AE.03", "fw": "nist_csf", "ref": "DE.AE-03", "title": "Event correlation", "cands": [{"id": "UC-OPS-01", "title": "Event logging", "statement": "The security-relevant events each type of system must log, such as authentication, privileged actions, errors and security events, and how long logs are kept, are defined. Systems produce those logs and forward them to central storage, and the source list is kept current. This gives the organization a reliable record for detection and investigation. Proof is the logging standard, the source list and sample logs.", "asks": ["b: The organization lists the log sources feeding its central platform and includes critical systems. (full)"], "primary": false}, {"id": "UC-OPS-41", "title": "Alert analysis, correlation and routing", "statement": "Written procedures or runbooks define how alerts raised by monitoring are analyzed, and detection rules combine events from more than one source. Each alert becomes a ticket assigned for follow-up, and the analysis and conclusion are recorded on it. Log analysis access is given to the people who respond, asset and criticality context is available during investigation, and logs that automated rules do not cover are reviewed on a defined schedule. Proof is the runbooks, rule list, alert tickets and manual review records.", "asks": ["a: The organization configures detection rules that combine events from more than one source. (full)"], "primary": true}], "crits": [{"id": "NIST.DE.AE.03.TC1", "stmt": "Correlation rules or detection use cases that combine events from more than one source are configured.", "kind": "design", "hint": "logging_monitoring (SIEM rule list)", "prop": "UC-OPS-41", "reason": "best word match via atom NIST.DE.AE.03-a (combine, detection, more, source)"}, {"id": "NIST.DE.AE.03.TC2", "stmt": "The log sources that feed the central platform are listed and include the critical systems.", "kind": "design", "hint": "logging_monitoring (log source list)", "prop": "UC-OPS-01", "reason": "best word match via atom NIST.DE.AE.03-b (feed, central, platform, sourc)"}, {"id": "NIST.DE.AE.03.TC3", "stmt": "A sample of investigations in the period shows events from several sources (e.g. identity plus endpoint) combined.", "kind": "operating", "hint": "logging_monitoring (investigation tickets)", "prop": "UC-OPS-41", "reason": "best word match via atom NIST.DE.AE.03-a (event, several, combin, ticket)"}]}, {"id": "NIST.DE.AE.07", "fw": "nist_csf", "ref": "DE.AE-07", "title": "Threat information integration", "cands": [{"id": "UC-OPS-08", "title": "Threat intelligence", "statement": "The threat information sources the organization uses, and how the information is analyzed for relevance, are defined. Threat intelligence outputs such as bulletins or assessments are produced on a defined cycle. At least some outputs lead to recorded actions, for example a risk register update, a blocking rule or a change in patch priority. This keeps defenses aligned with threats that matter to the organization.", "asks": ["a: The organization integrates threat intelligence feeds into its detection tools. (full)"], "primary": true}, {"id": "UC-OPS-41", "title": "Alert analysis, correlation and routing", "statement": "Written procedures or runbooks define how alerts raised by monitoring are analyzed, and detection rules combine events from more than one source. Each alert becomes a ticket assigned for follow-up, and the analysis and conclusion are recorded on it. Log analysis access is given to the people who respond, asset and criticality context is available during investigation, and logs that automated rules do not cover are reviewed on a defined schedule. Proof is the runbooks, rule list, alert tickets and manual review records.", "asks": ["b: Analysts have asset inventory and criticality context available when investigating. (full)"], "primary": false}], "crits": [{"id": "NIST.DE.AE.07.TC1", "stmt": "Threat intelligence feeds (e.g. indicator feeds) are integrated into detection tools.", "kind": "design", "hint": "logging_monitoring (SIEM/EDR integrations; no pack evidence request maps DE.AE.07)", "prop": "UC-OPS-08", "reason": "best word match via atom NIST.DE.AE.07-a (integrat, feed, detection, intelligence)"}, {"id": "NIST.DE.AE.07.TC2", "stmt": "Asset inventory and criticality information is available to analysts within the detection platform.", "kind": "design", "hint": "logging_monitoring; asset_inventory", "prop": "UC-OPS-41", "reason": "best word match via atom NIST.DE.AE.07-b (analyst, criticality, available, inventory)"}, {"id": "NIST.DE.AE.07.TC3", "stmt": "Sampled investigations from the period reference threat intelligence or asset context.", "kind": "operating", "hint": "logging_monitoring (investigation tickets)", "prop": "UC-OPS-41", "reason": "best word match via atom NIST.DE.AE.07-b (context, asset, ticket, investig)"}]}, {"id": "NIST.RS.MA.01", "fw": "nist_csf", "ref": "RS.MA-01", "title": "Incident response plan execution", "cands": [{"id": "UC-INC-01", "title": "Incident management plan and roles", "statement": "A written incident management procedure runs from detection through closure, including escalation steps, investigation and the handling of personal data breaches. Each incident role is assigned to a named person with contact details, and the plan names the third parties to coordinate with during an incident and how to reach them. The procedure and the role list prove it.", "asks": ["a: The organization maintains an incident response plan with roles, phases and contact lists. (full)", "b: The plan names the third parties to coordinate with during an incident. (full)"], "primary": true}, {"id": "UC-INC-03", "title": "Incident response and closure", "statement": "Every incident is handled under documented procedures for containment, eradication, recovery and escalation. The steps taken are recorded as the work happens, and each incident is closed only after recovery is confirmed. This limits damage and leaves a trail that shows the response was controlled. The response procedures and the incident records are the proof.", "asks": ["c: The organization executes the plan once an incident is declared, including coordination with third parties. (full)"], "primary": false}], "crits": [{"id": "NIST.RS.MA.01.TC1", "stmt": "An incident response plan exists with roles, phases and contact lists.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-01", "reason": "best word match via atom NIST.RS.MA.01-a (phas, contact, response, role)"}, {"id": "NIST.RS.MA.01.TC2", "stmt": "The plan names the third parties to coordinate with (e.g. incident response retainer, managed security provider, cloud providers, legal counsel) and how to reach them.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-01", "reason": "best word match via atom NIST.RS.MA.01-b (coordinate, third, name, party)"}, {"id": "NIST.RS.MA.01.TC3", "stmt": "Records of incidents in the period show the plan was followed once the incident was declared (incident lead assigned, plan steps logged).", "kind": "operating", "hint": "incident_log", "prop": "UC-INC-03", "reason": "best word match via atom NIST.RS.MA.01-c (declar, once, incident, plan)"}, {"id": "NIST.RS.MA.01.TC4", "stmt": "Where a third party was involved in an incident in the period, the records show the coordination (tickets, messages).", "kind": "operating", "hint": "incident_log", "prop": "UC-INC-03", "reason": "best word match via atom NIST.RS.MA.01-c (coordin, third, party, incident)"}]}, {"id": "NIST.RS.AN.06", "fw": "nist_csf", "ref": "RS.AN-06", "title": "Investigation actions", "cands": [{"id": "UC-INC-03", "title": "Incident response and closure", "statement": "Every incident is handled under documented procedures for containment, eradication, recovery and escalation. The steps taken are recorded as the work happens, and each incident is closed only after recovery is confirmed. This limits damage and leaves a trail that shows the response was controlled. The response procedures and the incident records are the proof.", "asks": ["a: Responders record the actions they take during an investigation. (full)"], "primary": true}, {"id": "UC-INC-06", "title": "Evidence preservation", "statement": "A procedure sets how evidence of security events is identified, collected, acquired and preserved, including a chain of custody. When evidence is collected during an incident, an evidence-handling record is completed. This keeps the evidence usable for investigation, disciplinary action or legal proceedings. The evidence-handling procedure and the custody records are the proof.", "asks": ["b: The organization protects the integrity and provenance of investigation records. (full)"], "primary": false}], "crits": [{"id": "NIST.RS.AN.06.TC1", "stmt": "The incident procedure requires responders to record the actions they take during an investigation.", "kind": "design", "hint": "breach_procedure", "prop": "UC-INC-03", "reason": "best word match via atom NIST.RS.AN.06-a (responder, during, investig, take)"}, {"id": "NIST.RS.AN.06.TC2", "stmt": "Investigation records are kept where their integrity is protected (restricted access, append-only or audit-trailed).", "kind": "design", "hint": "breach_procedure; incident_log", "prop": "UC-INC-06", "reason": "best word match via atom NIST.RS.AN.06-b (investig, integrity, protect, record)"}, {"id": "NIST.RS.AN.06.TC3", "stmt": "Sampled incident records contain time-stamped action entries that identify the responder.", "kind": "operating", "hint": "incident_log", "prop": "UC-INC-03", "reason": "best word match via atom NIST.RS.AN.06-a (responder, action, record, entry)"}]}, {"id": "NIST.RC.RP.02", "fw": "nist_csf", "ref": "RC.RP-02", "title": "Recovery action selection", "cands": [{"id": "UC-INC-42", "title": "Incident recovery and its closure", "statement": "Documented criteria set when incident recovery starts, weighing the disruption recovery itself may cause, and when it is declared over. The plan assigns recovery roles and states which approvals each recovery step needs. When an incident is handed over from response to recovery, the decision and the criterion used are recorded, the recovery actions are carried out, and their scope, priority and completion are recorded. The end of recovery is then declared against the criteria, with approval, and the date is recorded. Proof is the criteria, the incident records and the closure declaration.", "asks": ["b: The organization performs recovery actions and records their scope, priority and completion. (full)"], "primary": false}, {"id": "UC-RES-02", "title": "Recovery objectives and plans", "statement": "Recovery time and recovery point objectives are set for each critical IT service from a business impact analysis, and a recovery plan is kept for each of those services. The objectives and plans are updated when the analysis changes. This makes sure recovery work is aimed at what the business can least afford to lose. The impact analysis, the objectives table and the recovery plans are the proof.", "asks": ["a: Recovery plans set criteria for selecting and prioritizing recovery actions. (full)"], "primary": true}, {"id": "UC-RES-03", "title": "Recovery plan testing", "statement": "IT recovery plans are tested at least yearly. After each test, the results are compared with the recovery objectives, and any gap is logged with an owner and a due date. This shows whether recovery works in practice and drives fixes before a real outage. The test reports and the gap actions are the proof.", "asks": ["c: The organization tests recovery actions on a regular basis. (full)"], "primary": false}], "crits": [{"id": "NIST.RC.RP.02.TC1", "stmt": "Recovery plans set criteria for selecting and prioritising recovery actions.", "kind": "design", "hint": "business_continuity", "prop": "UC-RES-02", "reason": "best word match via atom NIST.RC.RP.02-a (select, criteria, recovery, action)"}, {"id": "NIST.RC.RP.02.TC2", "stmt": "Recovery records from the period show the actions selected, their scope and priority, and their completion.", "kind": "operating", "hint": "business_continuity; incident_log", "prop": "UC-INC-42", "reason": "best word match via atom NIST.RC.RP.02-b (completion, priority, scope, recovery)"}, {"id": "NIST.RC.RP.02.TC3", "stmt": "A recovery or disaster recovery test in the last 12 months carried out the planned recovery actions.", "kind": "operating", "hint": "business_continuity (test results); exercise_records", "prop": "UC-RES-03", "reason": "best word match via atom NIST.RC.RP.02-c (recovery, action, test, last); close call with UC-INC-42"}]}, {"id": "NIST.RC.RP.04", "fw": "nist_csf", "ref": "RC.RP-04", "title": "Mission function consideration", "cands": [{"id": "UC-RES-01", "title": "Security during disruption", "statement": "Continuity and crisis plans state how security controls stay in place, or which compensating controls apply, during a disruption. Each continuity test and each real disruption is reviewed to confirm that requirements such as access control and logging were kept. This stops disruption from becoming a security breach. The plans and the test or disruption reports are the proof.", "asks": ["b: The organization defines how operations run right after an incident, with cybersecurity risk taken into account. (full)"], "primary": false}, {"id": "UC-RES-02", "title": "Recovery objectives and plans", "statement": "Recovery time and recovery point objectives are set for each critical IT service from a business impact analysis, and a recovery plan is kept for each of those services. The objectives and plans are updated when the analysis changes. This makes sure recovery work is aimed at what the business can least afford to lose. The impact analysis, the objectives table and the recovery plans are the proof.", "asks": ["a: The organization uses a business impact analysis to set the restoration order of critical functions. (full)"], "primary": true}, {"id": "UC-RES-43", "title": "Restored systems verified before return to production", "statement": "Restored systems are checked for integrity before they return to production, for example by an indicator scan. Normal operation is confirmed and recorded for each system, and a sign-off is recorded before it returns to production, in the agreed restoration priority order. The recovery procedure requires these steps. The recovery procedure and the post-restore verification records are the proof.", "asks": ["c: System owners confirm the return to operations after restoration in priority order. (full)"], "primary": false}], "crits": [{"id": "NIST.RC.RP.04.TC1", "stmt": "Continuity and recovery plans use a business impact analysis to set the restoration order of critical functions.", "kind": "design", "hint": "business_continuity", "prop": "UC-RES-02", "reason": "best word match via atom NIST.RC.RP.04-a (order, function, restor, analysi)"}, {"id": "NIST.RC.RP.04.TC2", "stmt": "The plan defines how operations run immediately after an incident (e.g. heightened monitoring, temporary controls) with cybersecurity risk taken into account.", "kind": "design", "hint": "business_continuity", "prop": "UC-RES-01", "reason": "best word match via atom NIST.RC.RP.04-b (oper, taken, run, after)"}, {"id": "NIST.RC.RP.04.TC3", "stmt": "Recovery records show restoration followed the priority order and system owners confirmed the return to operations.", "kind": "operating", "hint": "business_continuity; incident_log", "prop": "UC-RES-43", "reason": "best word match via atom NIST.RC.RP.04-c (order, oper, restor, return)"}]}, {"id": "NIST.RC.RP.06", "fw": "nist_csf", "ref": "RC.RP-06", "title": "End of recovery declaration", "cands": [{"id": "UC-INC-05", "title": "Learning from incidents", "statement": "Every significant incident gets a recorded post-incident review. The review produces control improvements, which are tracked through the change or risk process until each one is complete. This makes the organization less likely to repeat the same failure. The review records and the improvement tracker are the proof.", "asks": ["c: The organization completes an after-action report for each incident that reached recovery. (full)"], "primary": false}, {"id": "UC-INC-42", "title": "Incident recovery and its closure", "statement": "Documented criteria set when incident recovery starts, weighing the disruption recovery itself may cause, and when it is declared over. The plan assigns recovery roles and states which approvals each recovery step needs. When an incident is handed over from response to recovery, the decision and the criterion used are recorded, the recovery actions are carried out, and their scope, priority and completion are recorded. The end of recovery is then declared against the criteria, with approval, and the date is recorded. Proof is the criteria, the incident records and the closure declaration.", "asks": ["a: The organization documents criteria for declaring the end of incident recovery. (full)", "b: An approver declares the end of recovery and records the date. (full)"], "primary": true}], "crits": [{"id": "NIST.RC.RP.06.TC1", "stmt": "Criteria for declaring the end of incident recovery are documented.", "kind": "design", "hint": "business_continuity; breach_procedure", "prop": "UC-INC-42", "reason": "best word match via atom NIST.RC.RP.06-a (end, declar, criteria, recovery)"}, {"id": "NIST.RC.RP.06.TC2", "stmt": "Incident records show the end of recovery was declared, with the date and approver.", "kind": "operating", "hint": "incident_log", "prop": "UC-INC-42", "reason": "best word match via atom NIST.RC.RP.06-b (approver, end, declar, recovery)"}, {"id": "NIST.RC.RP.06.TC3", "stmt": "An after-action report was completed for each incident in the period that reached recovery.", "kind": "operating", "hint": "incident_log (after-action reports)", "prop": "UC-INC-05", "reason": "best word match via atom NIST.RC.RP.06-c (after-action, complet, reach, recovery)"}]}, {"id": "NIST.RC.CO.04", "fw": "nist_csf", "ref": "RC.CO-04", "title": "Public update communication", "cands": [{"id": "UC-INC-04", "title": "Incident notification duties", "statement": "The people who may notify authorities and other outside parties about an incident are named, and a timeline is set for each kind of reportable event. When an incident triggers a legal or contractual duty, notification is made in time, with the date and recipient recorded. This keeps the organization out of penalties and keeps customers and regulators informed. The notification procedure and the incident notification records are the proof.", "asks": ["c: The public-update procedure is linked to the breach notification procedure. (full)"], "primary": false}, {"id": "UC-INC-41", "title": "Approved public statements after incidents", "statement": "An approved procedure governs public statements about incidents and recovery, which sets who may speak publicly, an approval step and approved wording templates. The procedure links to the notification duties process so statements stay consistent with what was told to regulators and affected people. Each public statement is issued under the procedure with a recorded approval. This keeps public messages accurate and avoids contradicting other disclosures.", "asks": ["a: The organization defines an approved procedure for public statements about incident recovery. (full)", "b: Each public recovery statement is issued under that procedure, with approval. (full)"], "primary": true}], "crits": [{"id": "NIST.RC.CO.04.TC1", "stmt": "An approved procedure governs public statements about incident recovery (spokesperson, approval step, templates).", "kind": "design", "hint": "business_continuity", "prop": "UC-INC-41", "reason": "best word match via atom NIST.RC.CO.04-a (public, statement, about, recovery)"}, {"id": "NIST.RC.CO.04.TC2", "stmt": "Every public statement on incident recovery issued in the period was approved under the procedure.", "kind": "operating", "hint": "business_continuity; incident_log", "prop": "UC-INC-41", "reason": "best word match via atom NIST.RC.CO.04-b (public, statement, under, issu)"}, {"id": "NIST.RC.CO.04.TC3", "stmt": "The public-update procedure is linked to the breach notification procedure.", "kind": "design", "hint": "business_continuity; breach_procedure", "prop": "UC-INC-04", "reason": "best word match via atom NIST.RC.CO.04-c (public-update, notific, link, breach)"}]}, {"id": "CH2.CONSENT.1", "fw": "dpdpa", "ref": "Section 6(1), 6(3)", "title": "Lawful basis for processing with free, specific, informed consent", "cands": [{"id": "UC-PNC-02", "title": "Notice and consent in the person's language", "statement": "Every notice and consent request can be read in English or in the person's choice of another officially listed language. The language options and their translations are kept current whenever a notice or consent screen changes. This lets people understand what they agree to in a language they use. The language selector and the translated texts are the proof.", "asks": ["e: Offer the consent request in English or in a language from the Eighth Schedule at the data principal's choice. (full)"], "primary": false}, {"id": "UC-PNC-05", "title": "Consent by clear affirmative action", "statement": "Consent is collected only through a clear affirmative action by the person. Screens carry no pre-selected options, never treat silence or continued use as consent, and show accept and decline with equal prominence. Each consent flow is reviewed when it is built or changed. This keeps consent real and not manufactured by design. The approved consent designs and live screen captures are the proof.", "asks": ["a: Obtain consent through a clear affirmative action by the data principal, never by silence, pre-ticked boxes or continued use. (full)"], "primary": true}, {"id": "UC-PNC-06", "title": "Consent given freely", "statement": "Consent is given freely. The service does not make access depend on consent to processing it does not need, and no consent request contains a term by which people waive their rights. Sign-up flows and linked terms are checked whenever they change. This stops people from being forced to trade away their data or rights. The consent screens, the terms and a decline walkthrough are the proof.", "asks": ["b: Make consent free and unconditional, with no term that waives a legal right or permits processing the law forbids. (full)"], "primary": false}, {"id": "UC-PNC-07", "title": "Consent request states the purpose", "statement": "Every consent request states the specific purpose in clear and plain language, so that the person knows what they agree to. The wording of each request is reviewed when it is written or changed. This makes consent informed and not generic. The approved consent texts and live screens are the proof.", "asks": ["c: State the specified purpose in every consent request so the consent is informed. (full)", "d: Write each consent request in clear, plain language. (full)"], "primary": false}], "crits": [{"id": "CH2.CONSENT.1.TC1", "stmt": "Every consent request requires a clear affirmative action by the data principal; consent is never inferred from silence, a pre-ticked box, inactivity or continued use of the service.", "kind": "design", "hint": "consent_forms (screenshots of every consent capture flow)", "prop": "UC-PNC-05", "reason": "best word match via atom CH2.CONSENT.1-a (pre-tick, silence, affirmative, never)"}, {"id": "CH2.CONSENT.1.TC2", "stmt": "Every consent request names the specified purpose(s) for which the personal data will be processed.", "kind": "design", "hint": "consent_forms", "prop": "UC-PNC-07", "reason": "best word match via atom CH2.CONSENT.1-c (specify, request, purpose, consent)"}, {"id": "CH2.CONSENT.1.TC3", "stmt": "The data principal is offered the option to read the consent request in English or in a language listed in the Eighth Schedule to the Constitution.", "kind": "design", "hint": "consent_forms (language selector screenshot)", "prop": "UC-PNC-02", "reason": "best word match via atom CH2.CONSENT.1-e (eighth, english, offer, language)"}, {"id": "CH2.CONSENT.1.TC4", "stmt": "No consent request contains a term by which the data principal waives a right under the Act or agrees to processing that would breach the Act or another law.", "kind": "design", "hint": "consent_forms; privacy_policy (terms linked from consent flows)", "prop": "UC-PNC-06", "reason": "best word match via atom CH2.CONSENT.1-b (waiv, law, term, right)"}, {"id": "CH2.CONSENT.1.TC5", "stmt": "Consent screens captured from the live web/app during the assessment period match the approved consent design (affirmative action, purpose stated, no pre-selected choices).", "kind": "operating", "hint": "consent_forms (dated live screenshots or screen recording)", "prop": "UC-PNC-05", "reason": "best word match via atom CH2.CONSENT.1-a (affirmative, action, consent, pre-select)"}]}, {"id": "CH2.CONSENT.2", "fw": "dpdpa", "ref": "Section 6(1)", "title": "Itemised consent for multiple purposes", "cands": [{"id": "UC-PNC-08", "title": "Purpose-level consent choices", "statement": "Each purpose appears as a separate item in the consent request, and the person can give or withhold consent for each one. A separate unticked control is built for every optional purpose. Refusing or withdrawing one purpose leaves the others unchanged. This allows real partial consent. The consent screens and the stored consent states are the proof.", "asks": ["a: List each purpose as a separate item in the consent request when data is used for more than one purpose. (full)"], "primary": true}, {"id": "UC-PNC-09", "title": "Consent records", "statement": "Auditable consent records are kept. Each record shows the purpose, the date and time, the capture channel, the notice version shown, and any later withdrawal, stored separately for each purpose. The records are protected from alteration. This lets the organization prove consent when asked. The consent log and the notice archive are the proof.", "asks": ["b: Record the data principal's consent against each specific purpose rather than as one blanket consent. (full)"], "primary": false}], "crits": [{"id": "CH2.CONSENT.2.TC1", "stmt": "Where one collection point serves more than one purpose, the consent request lists each purpose as a separate item rather than a single combined purpose.", "kind": "design", "hint": "consent_forms", "prop": "UC-PNC-08", "reason": "best word match via atom CH2.CONSENT.2-a (separate, more, item, request)"}, {"id": "CH2.CONSENT.2.TC2", "stmt": "The accompanying notice gives an itemised description of the personal data processed for each listed purpose.", "kind": "design", "hint": "privacy_policy; consent_forms", "prop": "UC-PNC-08", "reason": "best word match via atom CH2.CONSENT.2-a (purpose, consent, list, data)"}, {"id": "CH2.CONSENT.2.TC3", "stmt": "Sampled consent records store a consent status for each purpose separately, not one combined flag.", "kind": "operating", "hint": "consent log extract (sample of data principals)", "prop": "UC-PNC-09", "reason": "best word match via atom CH2.CONSENT.2-b (principal, purpose, consent, data)"}]}, {"id": "CH2.CONSENT.3", "fw": "dpdpa", "ref": "Section 6(4), 6(6)", "title": "Consent withdrawal mechanism", "cands": [{"id": "UC-PNC-11", "title": "Consent withdrawal", "statement": "People can withdraw consent as easily as they gave it. Withdrawal takes no more steps and no less accessible a channel than giving consent, and the notice says how to do it. Give and withdraw flows are checked side by side whenever either changes. This keeps withdrawal from becoming a hurdle. The side-by-side flows are the proof.", "asks": ["a: Let data principals withdraw consent as easily as they gave it. (full)"], "primary": true}, {"id": "UC-PNC-12", "title": "Processing stops after withdrawal", "statement": "Processing stops, and processors are made to stop, within a defined period after consent is withdrawn. The exception is processing the law requires or allows without consent. Stop instructions to processors are issued and recorded. This makes withdrawal have a real effect. The withdrawal log and the processor instruction records are the proof.", "asks": ["b: Stop processing, and have processors stop, once consent is withdrawn unless a law requires retention. (full)"], "primary": false}], "crits": [{"id": "CH2.CONSENT.3.TC1", "stmt": "The notice or consent flow tells the data principal how to withdraw consent (link or described means).", "kind": "design", "hint": "privacy_policy; consent_forms", "prop": "UC-PNC-11", "reason": "best word match via atom CH2.CONSENT.3-a (withdraw, principal, consent, data)"}, {"id": "CH2.CONSENT.3.TC2", "stmt": "Withdrawing consent takes no more steps, and uses no less accessible a channel, than giving it did (e.g. consent given in-app can be withdrawn in-app).", "kind": "design", "hint": "consent_forms (side-by-side give/withdraw flows)", "prop": "UC-PNC-11", "reason": "best word match via atom CH2.CONSENT.3-a (withdraw, consent, side-by-side, giving)"}, {"id": "CH2.CONSENT.3.TC3", "stmt": "A documented procedure makes the organisation stop the processing that relied on a withdrawn consent within a defined period, unless processing without consent is required or authorised by law.", "kind": "design", "hint": "consent_forms; retention_policy (withdrawal procedure)", "prop": "UC-PNC-12", "reason": "best word match via atom CH2.CONSENT.3-b (withdrawn, unles, stop, retention)"}, {"id": "CH2.CONSENT.3.TC4", "stmt": "The withdrawal procedure requires the organisation to make its Data Processors stop processing that data principal's personal data.", "kind": "design", "hint": "vendor_agreements; withdrawal procedure", "prop": "UC-PNC-12", "reason": "best word match via atom CH2.CONSENT.3-b (processor, stop, process, requir)"}, {"id": "CH2.CONSENT.3.TC5", "stmt": "For a sample of withdrawals in the period, records show processing stopped (including at processors) within the defined period.", "kind": "operating", "hint": "withdrawal log sample; processor instruction records", "prop": "UC-PNC-12", "reason": "best word match via atom CH2.CONSENT.3-b (processor, process, stopp, instruction)"}]}, {"id": "CH2.NOTICE.1", "fw": "dpdpa", "ref": "Section 5(1); DPDP Rules 2025 r.3", "title": "Notice accompanying the consent request", "cands": [{"id": "UC-PNC-01", "title": "Notice with each consent request", "statement": "A stand-alone notice is shown before or together with every consent request. The notice lists the personal data collected, the purposes and what each purpose enables, how to withdraw consent and use rights, and how to complain to the Board. Each collection point is reviewed whenever it is added or changed, so that people can give informed consent. The approved notice and the consent screens are the proof.", "asks": ["a: Present a notice before or together with every consent request, not only in a site footer. (full)", "b: Itemize in the notice the personal data to be collected. (full)", "c: State in the notice the specified purposes and the goods, services or uses each purpose enables. (full)", "d: Tell the data principal in the notice how to withdraw consent and exercise their rights. (full)", "e: Tell the data principal in the notice how to complain to the Data Protection Board. (full)", "f: Write the notice so it is understandable on its own, without reading other documents. (full)"], "primary": true}, {"id": "UC-PNC-02", "title": "Notice and consent in the person's language", "statement": "Every notice and consent request can be read in English or in the person's choice of another officially listed language. The language options and their translations are kept current whenever a notice or consent screen changes. This lets people understand what they agree to in a language they use. The language selector and the translated texts are the proof.", "asks": ["g: Offer the notice in English or in a language from the Eighth Schedule at the data principal's choice. (full)"], "primary": false}], "crits": [{"id": "CH2.NOTICE.1.TC1", "stmt": "A notice is presented before or together with every consent request, not only linked from a site footer.", "kind": "design", "hint": "privacy_policy; consent_forms", "prop": "UC-PNC-01", "reason": "best word match via atom CH2.NOTICE.1-a (footer, together, present, site)"}, {"id": "CH2.NOTICE.1.TC2", "stmt": "The notice itemises the personal data collected and states the specified purpose(s) and the goods, services or uses each purpose enables.", "kind": "design", "hint": "privacy_policy", "prop": "UC-PNC-01", "reason": "best word match via atom CH2.NOTICE.1-c (good, enabl, specify, uses)"}, {"id": "CH2.NOTICE.1.TC3", "stmt": "The notice gives a link (or describes another means) through which the data principal can withdraw consent and exercise her rights.", "kind": "design", "hint": "privacy_policy", "prop": "UC-PNC-01", "reason": "best word match via atom CH2.NOTICE.1-d (withdraw, exercise, notice, right)"}, {"id": "CH2.NOTICE.1.TC4", "stmt": "The notice describes how the data principal can complain to the Data Protection Board of India.", "kind": "design", "hint": "privacy_policy", "prop": "UC-PNC-01", "reason": "best word match via atom CH2.NOTICE.1-e (complain, board, notice, principal)"}, {"id": "CH2.NOTICE.1.TC5", "stmt": "The notice can be read in English or, at the data principal's option, in a language listed in the Eighth Schedule to the Constitution.", "kind": "design", "hint": "privacy_policy (language options)", "prop": "UC-PNC-02", "reason": "best word match via atom CH2.NOTICE.1-g (eighth, english, language, notice)"}]}, {"id": "CH2.PURPOSE.1", "fw": "dpdpa", "ref": "Section 4(1)", "title": "Processing only for stated purpose", "cands": [{"id": "UC-PUR-01", "title": "Processing within the consented purpose", "statement": "Each processing activity runs only for a purpose stated in the notice under which the data principal gave consent. Before a new use of existing data starts, such as a campaign, an analytics use or a data share, it is checked against the consented purposes, and it is blocked or fresh consent is sought if it falls outside them. This stops purpose creep. Proof is the processing record that links each activity to its purpose and the review records for new uses.", "asks": ["a: Process personal data only for the purpose the data principal consented to. (full)"], "primary": true}, {"id": "UC-PUR-02", "title": "Processing without consent identified and documented", "statement": "Each case where personal data is processed without consent under a legitimate-use ground is identified, and a register names the specific ground relied on for each case. For each case relying on data the person volunteered, the register records the purpose and how a refusal by the person stops the use. The register is reviewed whenever processing changes, and any entry that rests on a ground the law does not recognize is removed. Proof is the register and its review records.", "asks": ["b: Where no consent is held, process personal data only for a purpose the Act treats as a legitimate use. (full)"], "primary": false}], "crits": [{"id": "CH2.PURPOSE.1.TC1", "stmt": "A processing record (ROPA or data inventory) links every processing activity to either a specified purpose in a consent notice or a named s.7 legitimate use.", "kind": "design", "hint": "data_flow_diagram", "prop": "UC-PUR-02", "reason": "best word match via atom CH2.PURPOSE.1-b (legitimate, purpose, consent, use)"}, {"id": "CH2.PURPOSE.1.TC2", "stmt": "Sampled processing activities (e.g. a marketing campaign, an analytics use, a data share) each map to a purpose in the notice under which consent was taken, or to a recorded s.7 basis.", "kind": "operating", "hint": "data_flow_diagram; consent_forms; campaign or data-share records", "prop": "UC-PUR-01", "reason": "best word match via atom CH2.PURPOSE.1-a (purpose, consent, data, market)"}]}, {"id": "CH2.MINIMIZE.2", "fw": "dpdpa", "ref": "Section 8(7)", "title": "Data retention limited to purpose fulfilment", "cands": [{"id": "UC-AST-07", "title": "Records retention schedule", "statement": "A records retention schedule defines record types, retention periods and storage requirements based on legal and contractual needs. Each period traces to the law or contract that drives it. The schedule is the proof.", "asks": ["b: Retain personal data beyond that purpose only where a law requires it, and name the law. (partial)"], "primary": false}, {"id": "UC-AST-08", "title": "Information deletion", "statement": "The point at which information must be deleted from systems, devices and media once it is no longer needed, and the method of deletion, are defined. Information is deleted on that schedule, using automated jobs or manual steps, and deletion logs or supplier confirmations are kept as proof.", "asks": ["a: Erase personal data once the purpose it was collected for is no longer served. (partial)"], "primary": false}, {"id": "UC-AST-70", "title": "Erasure of personal data when no longer needed", "statement": "Personal data is erased, and the parties processing it for the organization erase it, once its purpose is served, consent is withdrawn or erasure is requested, unless a legal ground to keep it applies. Automated or systematic erasure runs on those triggers, and processors are told to erase whatever was made available to them. Where the organization is a large e-commerce, social media or online gaming intermediary of the kind the law names, a user's data is also erased after three years without contact, and the data principal is warned at least 48 hours before. Proof is erasure job logs, erasure records and the request log.", "asks": ["a: Erase personal data once the purpose it was collected for is no longer served. (full)"], "primary": true}, {"id": "UC-AST-71", "title": "Personal data retention schedule", "statement": "A documented retention schedule sets, for each category of personal data and each purpose, a retention period or an erasure trigger. Where the schedule keeps data beyond its purpose, it names the law that requires it. Retention and deletion settings on systems holding personal data are checked on a defined cycle to match the schedule. Proof is the schedule and the system setting checks.", "asks": ["b: Retain personal data beyond that purpose only where a law requires it, and name the law. (full)"], "primary": false}], "crits": [{"id": "CH2.MINIMIZE.2.TC1", "stmt": "The retention procedure requires erasure when consent is withdrawn or when it is reasonable to assume the specified purpose is no longer served, whichever comes first, unless a named law requires retention.", "kind": "design", "hint": "retention_policy", "prop": "UC-AST-70", "reason": "best word match via atom CH2.MINIMIZE.2-a (serv, longer, purpose, withdrawn)"}, {"id": "CH2.MINIMIZE.2.TC2", "stmt": "The procedure requires Data Processors to erase personal data the organisation made available to them when erasure is triggered.", "kind": "design", "hint": "retention_policy; vendor_agreements", "prop": "UC-AST-70", "reason": "best word match via atom CH2.MINIMIZE.2-a (erase, personal, data, erasure)"}, {"id": "CH2.MINIMIZE.2.TC3", "stmt": "If the organisation is an e-commerce entity or social media intermediary with at least 2 crore registered users in India, or an online gaming intermediary with at least 50 lakh, the procedure erases a user's data after three years without her approaching it or exercising rights (excluding account and virtual-token access).", "kind": "design", "hint": "retention_policy", "prop": "UC-AST-70", "reason": "best word match via atom CH2.MINIMIZE.2-a (data, gaming, online, e-commerce)"}, {"id": "CH2.MINIMIZE.2.TC4", "stmt": "For organisations in the Third Schedule classes, the procedure warns the data principal at least 48 hours before inactivity-based erasure.", "kind": "design", "hint": "retention_policy; erasure warning template", "prop": "UC-AST-70", "reason": "best word match via atom CH2.MINIMIZE.2-a (data, warn, hour, erasure)"}, {"id": "CH2.MINIMIZE.2.TC5", "stmt": "Erasure job logs or erasure records for the period show personal data past its erasure trigger was actually erased.", "kind": "operating", "hint": "retention_policy; deletion job logs / erasure records sample", "prop": "UC-AST-70", "reason": "best word match via atom CH2.MINIMIZE.2-a (personal, data, eras, job)"}]}, {"id": "CH2.MINIMIZE.3", "fw": "dpdpa", "ref": "Section 8(7); DPDP Rules 2025 r.8(3)", "title": "Retention schedule and deletion procedures", "cands": [{"id": "UC-AST-07", "title": "Records retention schedule", "statement": "A records retention schedule defines record types, retention periods and storage requirements based on legal and contractual needs. Each period traces to the law or contract that drives it. The schedule is the proof.", "asks": ["a: Maintain a documented retention schedule that sets a period or erasure trigger for each data category or purpose. (partial)", "d: Check that retention and deletion settings on systems holding personal data match the schedule. (partial)"], "primary": false}, {"id": "UC-AST-08", "title": "Information deletion", "statement": "The point at which information must be deleted from systems, devices and media once it is no longer needed, and the method of deletion, are defined. Information is deleted on that schedule, using automated jobs or manual steps, and deletion logs or supplier confirmations are kept as proof.", "asks": ["b: Run systematic or automated procedures that erase personal data when the purpose ends or consent is withdrawn. (partial)"], "primary": false}, {"id": "UC-AST-70", "title": "Erasure of personal data when no longer needed", "statement": "Personal data is erased, and the parties processing it for the organization erase it, once its purpose is served, consent is withdrawn or erasure is requested, unless a legal ground to keep it applies. Automated or systematic erasure runs on those triggers, and processors are told to erase whatever was made available to them. Where the organization is a large e-commerce, social media or online gaming intermediary of the kind the law names, a user's data is also erased after three years without contact, and the data principal is warned at least 48 hours before. Proof is erasure job logs, erasure records and the request log.", "asks": ["b: Run systematic or automated procedures that erase personal data when the purp
